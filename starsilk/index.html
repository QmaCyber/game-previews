- 15 hand-tuned depths in two acts with three bosses, then endless deep dives

:where(#gp-shop) { --gp-shop-bg: #fff8ec; --gp-shop-ink: #2b1d10; --gp-shop-muted: #6b5a48; --gp-shop-card: #ffffff;
  --gp-shop-accent: #1f8a4c; --gp-shop-accent-ink: #ffffff; --gp-shop-off: #d8cfc2; --gp-shop-best: #ffcf33; }
#gp-shop { color: var(--gp-shop-ink); background: var(--gp-shop-bg); border-radius: 18px; padding: 14px; box-sizing: border-box;
  width: min(96vw, 620px); max-height: 94vh; display: flex; flex-direction: column; gap: 10px; pointer-events: auto;
  font: 600 15px ${N}; font-variant-numeric: tabular-nums; text-align: left; }
#gp-shop header { display: flex; align-items: center; gap: 10px; }
#gp-shop h2 { margin: 0; font-size: 22px; flex: 1; }
#gp-shop .gp-balance { font-size: 20px; font-weight: 800; }
#gp-shop .gp-complete { font-size: 12px; color: var(--gp-shop-muted); }
#gp-shop .gp-bar { height: 8px; border-radius: 4px; background: var(--gp-shop-off); overflow: hidden; }
#gp-shop .gp-bar > i { display: block; height: 100%; background: var(--gp-shop-accent); }
#gp-shop .gp-amounts { display: flex; gap: 8px; }
#gp-shop button { font: inherit; border: 0; border-radius: 999px; cursor: pointer; touch-action: manipulation;
  min-width: 0; margin: 0; padding: 0 12px; box-shadow: none; text-transform: none; letter-spacing: normal; }
#gp-shop .gp-amounts button { flex: 1; background: var(--gp-shop-card); color: var(--gp-shop-ink); box-shadow: inset 0 0 0 2px var(--gp-shop-off); }
#gp-shop .gp-amounts button[aria-pressed=true] { box-shadow: inset 0 0 0 3px var(--gp-shop-ink); font-weight: 800; }
#gp-shop .gp-list { overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
#gp-shop .gp-card { background: var(--gp-shop-card); border-radius: 14px; padding: 10px; display: grid; gap: 4px 10px;
  grid-template-columns: auto 1fr auto; grid-template-areas: 'icon name buy' 'icon info buy' 'icon state buy'; align-items: center; }
#gp-shop .gp-card .gp-icon { grid-area: icon; font-size: 28px; width: 40px; text-align: center; }
#gp-shop .gp-card .gp-icon > img, #gp-shop .gp-card .gp-icon > svg, #gp-shop .gp-card .gp-icon > canvas { width: 36px; height: 36px; object-fit: contain; vertical-align: middle; }
#gp-shop .gp-card .gp-name { grid-area: name; font-weight: 800; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#gp-shop .gp-card .gp-info { grid-area: info; font-size: 13px; color: var(--gp-shop-muted); }
#gp-shop .gp-card .gp-state { grid-area: state; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
#gp-shop .gp-card .gp-buy { grid-area: buy; background: var(--gp-shop-accent); color: var(--gp-shop-accent-ink); padding: 0 16px; font-weight: 800; }
#gp-shop .gp-card .gp-buy[aria-disabled=true] { background: var(--gp-shop-off); color: var(--gp-shop-muted); }
#gp-shop .gp-tag { background: var(--gp-shop-best); color: #2b1d10; border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 800; }
#gp-shop .gp-pips { letter-spacing: 1px; }
#gp-shop .gp-undo { align-self: center; background: transparent; color: var(--gp-shop-ink); text-decoration: underline; }
#gp-shop .gp-back { background: var(--gp-shop-ink); color: var(--gp-shop-bg); padding: 0 18px; }
#gp-shop .gp-card { min-width: 0; }
#gp-shop [hidden] { display: none !important; }
/* Eight cards without scrolling on phones (the layout Germ Bait, QmaCyber/game6, found for 360×800 and 800×360).
   Tall screens: two columns of upright cards */
@media (max-aspect-ratio: 4/5) {
  #gp-shop { max-height: 98vh; padding: 8px; gap: 6px; }
  #gp-shop h2 { font-size: 20px; }
  #gp-shop .gp-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  #gp-shop .gp-card { grid-template-columns: auto 1fr; grid-template-areas: 'icon name' 'info info' 'state state' 'buy buy'; padding: 5px 7px 7px; gap: 1px 6px; }
  #gp-shop .gp-card .gp-icon { font-size: 20px; width: auto; }
  #gp-shop .gp-card .gp-icon > img, #gp-shop .gp-card .gp-icon > svg, #gp-shop .gp-card .gp-icon > canvas { width: 24px; height: 24px; }
  #gp-shop .gp-card .gp-name { font-size: 14px; }
  #gp-shop .gp-card .gp-info, #gp-shop .gp-card .gp-state { font-size: 12px; }
}
/* Wide screens: two columns */
@media (min-aspect-ratio: 5/4) {
  #gp-shop { width: min(96vw, 980px); }
  #gp-shop .gp-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* A phone on its side: one top row (title, amounts, back), then four columns of cards */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-shop { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto 1fr; padding: 6px 10px; gap: 5px 10px; max-height: 98vh; }
  #gp-shop > header { grid-area: 1 / 1; }
  #gp-shop > .gp-complete { display: none; }
  #gp-shop > .gp-bar { grid-area: 2 / 1 / 3 / 4; }
  #gp-shop > .gp-pick { grid-area: 1 / 2; }
  #gp-shop > .gp-list { grid-area: 3 / 1 / 4 / 4; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  #gp-shop > .gp-foot { grid-area: 1 / 3; }
  #gp-shop .gp-card { grid-template-columns: 1fr; grid-template-areas: 'name' 'info' 'state' 'buy'; padding: 5px 8px 7px; gap: 1px; }
  #gp-shop .gp-card .gp-icon { display: none; }
  #gp-shop .gp-card .gp-name { font-size: 13px; }
  #gp-shop .gp-card .gp-info, #gp-shop .gp-card .gp-state { font-size: 12px; }
  #gp-shop h2 { font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-shop .gp-pop { animation: gp-pop 0.22s ease-out; }
  #gp-shop .gp-deny { animation: gp-deny 0.3s ease-in-out; }
}
@keyframes gp-pop { 50% { transform: scale(1.08); } }
@keyframes gp-deny { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

#gp-dialog.gp-narrator .gp-text { font-style: italic; color: var(--gp-dlg-muted); }
#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 ${N}; border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;
  box-shadow: none; text-transform: none; letter-spacing: normal; text-align: center; opacity: 1; filter: none;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--gp-dlg-ink); background: var(--gp-dlg-btn); }
#gp-dialog button.gp-choice { flex: 1 1 100%; justify-content: flex-start; text-align: left; box-shadow: inset 0 0 0 2px var(--gp-dlg-edge); }
#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }
#gp-dialog button.gp-skip { order: 1; background: transparent; color: var(--gp-dlg-muted); font-size: 14px; text-decoration: underline; padding: 4px 10px; }
#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}
/* A phone on its side: a compact sheet, ≤ 45% of the height (three lines of text and one row of buttons) */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-dialog { bottom: max(4px, env(safe-area-inset-bottom)); padding: 14px 10px 6px; gap: 5px; border-width: 2px; }
  #gp-dialog .gp-text { font-size: 16px; line-height: 1.3; max-height: calc(1.3em * 3); }
  #gp-dialog .gp-face { width: 52px; height: 52px; margin-top: -8px; font-size: 30px; line-height: 46px; }
  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-dialog:not([hidden]) { animation: gp-dlg-in 0.18s ease-out; }
}
@keyframes gp-dlg-in { from { transform: translateY(12px); opacity: 0; } }

ernmere is a net. Our family wove it. Every star is a knot.`,`oda: When a knot slips, its star falls. Last month they all slipped at once.`,`wick: Not slipped. Pulled. Something at the bottom is pulling them in.`,`mira/angry: Then it can pull against me.`]},warden:{title:`The Warden`,at:`run-end`,when:`cleared >= 5`,lines:[`The Warden comes apart into a hundred moths. One of them stays and speaks.`,`warden/sad: We guarded her. The red weaver. She asked us to keep everyone out.`,`mira/surprised: My mother? She's alive?`,`warden: She holds the Heart shut. It is hungry, and it is so very lonely.`,`warden: Go down, little weaver. Do not let it hear you cry.`]},voice:{title:`A Voice Without a Mouth`,at:`run-end`,when:`cleared >= 6`,lines:[`The dark leans close. A voice without a mouth fills the chamber.`,`hollow: Little weaver. You carry my stars back up. Why?`,`mira: They aren't yours. They light a town full of people.`,`hollow/angry: I lit nothing for a thousand years. Nobody wove me into the sky.`,`wick/worried: Mira... I don't think it's a monster. I think it's a star.`,{who:`wick`,text:`Stay close. I'm not scared when you're here.`,if:`trust`},{who:`wick`,text:`I'm scared. I'm staying anyway.`,if:`not trust`}]},eleventh:{title:`The Eleventh Star`,at:`run-end`,when:`cleared >= 7`,lines:[`oda/sad: Mira. I have to tell you something before you meet it.`,`oda: When I was young, we wove the net. There were eleven stars, and room for ten.`,`oda: The eleventh fell. We said it had burned out. Nobody went down to look.`,`mira/surprised: You left it alone in the dark.`,`oda/sad: We were afraid. Your mother wasn't. She went down to weave it a place.`]},holds:{title:`What Holds`,at:`run-end`,when:`cleared >= 8`,lines:[`wick: The drifters walk through walls, but even they stop at your thread.`,`mira: Everything stops at the thread. Maybe that's what the Hollow needs. Something that holds.`,`hollow: Nothing holds me. I have tried. Everything I touch unravels.`,`mira: Not starsilk.`]},"the-heart":{title:`The Heart`,at:`run-end`,when:`cleared >= 9`,lines:[`The last stair. Red thread runs everywhere here, knotted round every pillar.`,`lena/worried: Mira? No. No, go back up. It will unravel you.`,`mira/happy: Mum! I have Grandma's spool. I've come to finish your weaving.`,`lena: The Hollow is inside my knots. Three loops, Mira. Tie it three times and it will hold.`,`oda/worried: I have the other end, girl. I won't let go.`]},"eleven-stars":{title:`Eleven Stars`,at:`run-end`,when:`cleared >= 10`,lines:[`The loop pulls tight, and tighter, and the knot of dark becomes a knot of light.`,`hollow/surprised: Oh. It holds. I am... held.`,`lena/happy: A new knot in the sky, Mira. The eleventh star. It needs a name.`,{who:`mira`,text:`Its name is...`,choose:[{id:`oda`,text:`Oda, who held on.`,then:[`oda/happy: Me? Oh, you silly girl. Fine. Shine well.`]},{id:`wick`,text:`Wick, who stayed.`,then:[`wick/happy: A star named after a moth! Every moth in the world will visit.`]},{id:`lena`,text:`Lena, who went first.`,then:[`lena/happy: Then I'll always know which one is mine.`]}]},`Grandma Oda reels them home. Above Lanternmere, eleven stars.`]},below:{title:`Below the Heart`,at:`first-action`,when:`cleared >= 10`,lines:[`wick/worried: Mira, the thread still pulls. Down.`,`lena: An older loom lies below. Someone ties knots there.`,`mira: Then I'll untie them.`]},underloom:{title:`The Underloom`,at:`run-end`,when:`cleared >= 11`,lines:[`Old threads hang from the ceiling here, every one of them knotted shut.`,`wick: Knotters. They tie the thread up so it can't reach anywhere.`,`oda/worried: A knot steals your length, girl. Walk back over it and it comes undone.`,`mira: Who taught them to knot?`,`lena/sad: Someone who was afraid of letting go.`]},burrows:{title:`Under the Floor`,at:`run-end`,when:`cleared >= 12`,lines:[`The floor heaves. Something swims beneath the stones like a fish under ice.`,`wick/surprised: Burrowers! The thread can't fence what goes under it.`,`mira: Then we wait till they come up. And you flash them, Wick.`,`wick/happy: Flashing is the one thing I am very good at!`]},lampless:{title:`The Lampless Way`,at:`run-end`,when:`cleared >= 13`,lines:[`No lamp was ever lit down here. Not one.`,`lena: The old weavers kept what they couldn't bear to lose down here. Tied down, so it would stay.`,`oda/sad: My grandmother worked a loom like that. They said she tied her own shadow to it.`,`mira/surprised: The Knotmother is... family?`,`oda: Everyone down here is somebody's, Mira.`]},unspun:{title:`The Unspun Stair`,at:`run-end`,when:`cleared >= 14`,lines:[`knotmother: Little weaver. You come to take what I keep.`,`mira: You keep everything tied so it can't leave. Even the stars.`,`knotmother/angry: Whatever I let go, the dark unravels. I have lost too much.`,`wick/worried: She isn't angry. She's scared, like the Hollow was.`,{who:`mira`,text:`What do I tell her?`,choose:[{id:`gentle`,text:`A thread can hold without a knot.`,do:{set:`gentle`},then:[`knotmother/surprised: There is no such thread.`]},{id:`firm`,text:`Then I'll untie you myself.`,then:[`knotmother/angry: Try, little weaver.`]}]}]},"loose-ends":{title:`Loose Ends`,at:`run-end`,when:`cleared >= 15`,lines:[`Four loops, and the Knotmother's knots slip loose one by one.`,`knotmother/surprised: They're... going. And nothing unravels.`,`mira: A thread someone holds doesn't need a knot. Grandma holds mine.`,{who:`knotmother`,text:`Then hold mine, little weaver. Just for a while.`,if:`gentle`},{who:`knotmother`,text:`You were right to be firm. I tied too tight, for too long.`,if:`not gentle`},`oda/happy: Bring her up, Mira. There's room in the sky for one more light.`,`Above Lanternmere the old threads catch the starlight. Every one of them holds.`]}}},ya=e=>`story.${e.replace(/\./g,`_`)}`,ba=(e,t)=>`${ya(e)}_${t}`,xa=e=>`

#ui .sub { color: #c9bfee; font-size: 15px; max-width: 34em; }
#ui .small { color: #a79cd0; font-size: 13px; }
#ui .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
#ui button.btn { pointer-events: auto; min-height: ${e}px; min-width: ${e*3}px; padding: 0 22px; border: 0;
  border-radius: 6px; cursor: pointer; touch-action: manipulation; font: 700 18px 'Trebuchet MS', ${N};
  color: #1b1330; background: linear-gradient(#ffe08a, #ffc94d 60%, #e8a73a); box-shadow: 0 3px 0 #8a5a1a, 0 0 0 2px #0d0b1c;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
#ui button.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a5a1a, 0 0 0 2px #0d0b1c; }
#ui button.btn.alt { color: #f4ecff; background: linear-gradient(#3e3572, #2d2758); box-shadow: 0 3px 0 #15112e, 0 0 0 2px #0d0b1c; }
#ui button.btn[disabled], #ui button.btn[aria-disabled=true] { opacity: 0.6; cursor: default; }
#ui button.icon { min-width: ${e}px; width: ${e}px; padding: 0; }
#ui button svg { width: 24px; height: 24px; flex: none; }
#ui .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff5a6e; box-shadow: 0 0 0 2px #0d0b1c; }
#ui .stars { display: flex; gap: 6px; justify-content: center; }
#ui .stars svg { width: 28px; height: 28px; }
#ui .rating { display: grid; gap: 4px 10px; grid-template-columns: auto 1fr; align-items: center; text-align: left; font-size: 15px; }
#ui .rating svg { width: 24px; height: 24px; }
#ui .pair { display: grid; grid-auto-rows: 1fr; gap: 10px; width: 100%; }
#ui .pair button.btn { width: 100%; }
#ui .gain { font-size: 20px; color: #ffe08a; }
/* Sheets: the Depths and the Loom share one look — a framed sheet, the title left and its count right, a bar, a list
   of cards, Back at the foot (on a phone on its side: Back up in the title row). The Loom is the platform's shop,
   restyled at the end of this sheet to match. */
#ui .sheet, body #gp-shop { background: #14112bf4; border: 2px solid #ffc94d; border-radius: 6px;
  box-shadow: 0 0 0 2px #0d0b1c, 0 0 0 5px #3e3160, 0 10px 40px #000a; }
#ui .sheet { pointer-events: auto; box-sizing: border-box; width: min(96vw, 620px); max-height: 94vh; padding: 14px;
  display: flex; flex-direction: column; gap: 10px; text-align: left; }
#ui .sheet header { display: flex; align-items: center; gap: 10px; }
#ui .sheet h2 { flex: 1; }
#ui .sheet .count { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
#ui .sheet .count svg { width: 22px; height: 22px; }
#ui .sheet .note { font-size: 12px; color: #b9b0d8; }
#ui .sheet .bar { height: 8px; border-radius: 4px; background: #3e3572; overflow: hidden; flex: none; }
#ui .sheet .bar i { display: block; height: 100%; background: #ffc94d; }
#ui .sheet .list { overflow: auto; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-right: 2px; }
#ui .sheet .back { width: 100%; flex: none; }
#ui button.dcard { min-height: ${Math.max(e,64)}px; min-width: 0; width: 100%; padding: 8px 10px; border-radius: 6px;
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: 'num name' 'num meta'; gap: 2px 10px; align-items: center;
  justify-items: start; text-align: left; color: #f4ecff; background: #2a2550; box-shadow: none; font-size: 16px; }
#ui button.dcard:active { transform: translateY(1px); box-shadow: none; }
#ui button.dcard .num { grid-area: num; width: 40px; display: flex; justify-content: center; font: 700 30px/1 Georgia, 'Times New Roman', serif; color: #ffe08a; }
#ui button.dcard .num svg { width: 22px; height: 22px; color: #b9b0d8; }
#ui button.dcard .name { grid-area: name; font-weight: 800; }
#ui button.dcard .meta { grid-area: meta; display: flex; gap: 8px; align-items: center; min-height: 16px; font-size: 13px; font-weight: 600; color: #b9b0d8; }
#ui button.dcard .stars { gap: 2px; }
#ui button.dcard .stars svg { width: 16px; height: 16px; }
#ui button.dcard.next { box-shadow: inset 0 0 0 2px #ffc94d; }
#ui button.dcard.next .meta { color: #ffe08a; }
#ui button.dcard[disabled] { opacity: 0.55; }
/* Tall screens: upright cards, the number beside the name, the stars under both (like the Loom's cards there) */
@media (max-aspect-ratio: 4/5) {
  #ui .sheet { max-height: 98vh; padding: 8px; gap: 6px; }
  #ui .sheet .list { gap: 5px; }
  #ui button.dcard { grid-template-areas: 'num name' 'meta meta'; padding: 6px 8px 8px; gap: 4px 6px; font-size: 14px; }
  #ui button.dcard .num { width: auto; font-size: 22px; }
  #ui button.dcard .meta { font-size: 12px; }
}
@media (min-aspect-ratio: 5/4) {
  #ui .sheet { width: min(96vw, 980px); }
  #ui .sheet .list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #ui .sheet { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto 1fr; padding: 6px 10px; gap: 5px 10px; max-height: 98vh; }
  #ui .sheet > header { grid-area: 1 / 1; justify-self: start; }
  #ui .sheet > header h2 { flex: none; }
  #ui .sheet > .note { display: none; }
  #ui .sheet > .bar { grid-area: 2 / 1 / 3 / 3; }
  #ui .sheet > .list { grid-area: 3 / 1 / 4 / 3; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  #ui .sheet > .back { grid-area: 1 / 2; width: auto; }
  #ui button.dcard { min-height: ${e}px; padding: 5px 8px; gap: 1px 8px; font-size: 14px; }
  #ui button.dcard .num { width: 28px; font-size: 22px; }
}
/* HUD */
#ui .hud { position: fixed; top: max(6px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; pointer-events: none; text-shadow: 0 2px 0 #000, 0 0 6px #000; }
#ui .hud .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#ui .hud .hearts { display: flex; gap: 3px; }
#ui .hud .hearts img { width: 21px; height: 21px; image-rendering: pixelated; }
#ui .hud .glim { display: flex; align-items: center; gap: 4px; font-size: 18px; color: #ffe08a; }
#ui .hud .glim img { width: 21px; height: 21px; image-rendering: pixelated; }
#ui .hud .meter { width: min(42vw, 220px); height: 12px; border: 2px solid #0d0b1c; background: #2a2347; border-radius: 3px; position: relative; overflow: hidden; }
#ui .hud .meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#fff1a8, #ffc94d); }
#ui .hud .meter.taut i { background: linear-gradient(#ffb18a, #ff6a4d); }
#ui .hud .meter.cut i { background: repeating-linear-gradient(90deg, #ffc94d 0 6px, transparent 6px 10px); }
#ui .hud .goal { grid-column: 1 / -1; font-size: 14px; color: #e9e2ff; text-align: left; }
#ui .hud .right { display: flex; gap: 8px; pointer-events: auto; }
#ui button.reel { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
  width: ${Math.max(e,76)}px; height: ${Math.max(e,76)}px; min-width: 0; border-radius: 50%; padding: 0; pointer-events: auto;
  flex-direction: column; gap: 0; font-size: 13px; touch-action: none; }
#ui button.reel svg { width: 30px; height: 30px; }
#ui button.reel.on { filter: brightness(1.25); transform: scale(0.95); }
/* Wick's flash: above Reel; the rim fills as it recharges, and glows when it's ready */
#ui button.flare { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + ${Math.max(e,76)}px + 12px);
  width: ${Math.max(e,64)}px; height: ${Math.max(e,64)}px; min-width: 0; border-radius: 50%; padding: 0; pointer-events: auto;
  flex-direction: column; gap: 0; font-size: 12px; touch-action: none; color: #f4ecff;
  background: radial-gradient(circle, #2d2758 58%, transparent 60%), conic-gradient(#9ff3ff var(--charge, 100%), #3e3572 0);
  box-shadow: 0 3px 0 #15112e, 0 0 0 2px #0d0b1c; }
#ui button.flare img { width: 28px; height: 28px; image-rendering: pixelated; }
#ui button.flare.ready { box-shadow: 0 3px 0 #15112e, 0 0 0 2px #0d0b1c, 0 0 14px #9ff3ffaa; }
#ui button.flare:not(.ready) { opacity: 0.75; }
#ui button.flare[hidden] { display: none; }
#ui .hud .meter.knotted { box-shadow: 0 0 0 2px #c63f45; }
#ui .bark { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: calc(max(6px, env(safe-area-inset-top)) + 76px);
  max-width: min(88vw, 460px); display: flex; gap: 8px; align-items: center; background: #14112bdd; border: 2px solid #ffc94d;
  border-radius: 6px; padding: 6px 10px 6px 6px; font-size: 15px; text-align: left; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
#ui .bark.on { opacity: 1; }
#ui .bark img { width: 36px; height: 36px; image-rendering: pixelated; border-radius: 4px; background: #0d0b1c; flex: none; }
#ui .float { position: fixed; transform: translate(-50%, -100%); font: 800 16px 'Trebuchet MS', ${N}; color: #ffe08a;
  text-shadow: 0 2px 0 #000, 0 0 8px #000; pointer-events: none; white-space: nowrap; animation: st-rise 1.1s ease-out forwards; }
#ui .float.big { font-size: 24px; color: #fff1a8; }
#ui .float.bad { color: #ff7a8a; }
@keyframes st-rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -36px; } }
#ui .named { color: #fff1a8; font-size: 15px; }
/* Short screens: tighter panels */
@media (max-height: 520px) {
  #ui .panel { padding: 10px 16px; gap: 6px; }
  #ui h1 { font-size: clamp(34px, 12vmin, 60px); }
  #ui h2, body #gp-shop h2 { font-size: 22px; }
  #ui .bark { top: calc(max(6px, env(safe-area-inset-top)) + 58px); }
}
/* The platform's dialogue sheet and shop in the game's colours */

orter. Walk back over a knot to undo it.`,"tip.burrower":`Burrowers dig under the thread. When the floor heaves, step away, and loop them while they are up!`,"tip.flare":`Wick can flash now! Press F (or Flash) to stun every shadow close to you.`,"bark.snare1":`Rewoven!`,"bark.snare2":`Another one remembers its edges.`,"bark.snare3":`That's my girl.`,"bark.snare4":`Tight as a Sunday knot.`,"bark.snare5":`Back into the light with you.`,"bark.snare6":`The thread holds.`,"bark.hollowDown":`It holds! Take the star, Mira!`,"bark.knotmotherDown":`She let go! Take the last star home.`,"bark.wardenDown":`The Warden is down! The star is free!`,"bark.star":`The star! Now home: hold Reel.`,"bark.devour":`It ate the whole thread! Back to the knot to tie on.`,"bark.steal":`A filcher has the star! Loop it!`,"hud.intro":`Drag or WASD to walk · hold Reel (Space) to ride the thread back`,"hud.line":`Depth {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Thread left`,"hud.pause":`Pause`,"hud.reel":`Reel`,"hud.reelAria":`Reel back along the thread`,"hud.flash":`Flash`,"hud.flashAria":`Wick's flash: stun the shadows close by`,"goal.cut":`Your thread was cut! Tie back on at the loose end to pick things up`,"goal.carry":`Bring the star home: hold Reel to ride the thread`,"goal.stolen":`A filcher took the star! Snare it to get it back`,"goal.rule":`Walk a loop around a murk and cross your thread to snare it`,"goal.warden":`Snare the Warden: walk a loop around it ({hit}/{max})`,"goal.hollow":`Snare the Hollow: walk a loop around it ({hit}/{max})`,"goal.knotmother":`Snare the Knotmother: walk a loop around her ({hit}/{max})`,"goal.knots":{one:`{n} knot shortens your thread: walk back over it to undo it`,other:`{n} knots shorten your thread: walk back over them to undo them`},"goal.find":`Find the fallen star`,"float.double":`Double knot!`,"float.triple":`Triple knot!`,"float.multi":`{n}× knot!`,"float.loopsToGo":{one:`{n} loop to go!`,other:`{n} loops to go!`},"float.knotsLeft":{one:`{n} knot left!`,other:`{n} knots left!`},"float.tied":`Tied!`,"float.untied":`Untied!`,"float.eaten":`Eaten to the knot!`,"float.stolen":`Stolen!`,"float.free":`The star is free!`,"float.knot":`Knot!`,"float.undone":`Undone!`,"pause.leave":`Leave the depth`,"lost.title":`Lost in the dark`,"lost.continue":`▶ Continue with 2 hearts (ad)`,"lost.carrying":`You were carrying the star home!`,"lost.away":{one:`The star was {n} tile away.`,other:`The star was {n} tiles away.`},"lost.dark":`The dark closes in.`,"results.elevenStars":`Eleven stars!`,"results.everyThread":`Every thread holds!`,"results.home":`Home with the star!`,"results.pulled":`Oda pulled you back up`,"results.surface":`Back on the surface`,"results.starHome":`The star is home`,"results.bringStar":`Bring the star home`,"results.snared":`Snared {n} / {quota} murks`,"results.lostHearts":{one:`Lost {n} heart`,other:`Lost {n} hearts`},"results.noHeartLost":`No heart lost`,"results.loseNoHeart":`Lose no heart`,"results.gain":`+{n} glimmer`,"results.gathered":`{n} gathered`,"results.forDepth":`{n} for the depth`,"results.forStars":`{n} for new stars`,"results.next":`Next: Depth {n}`,"results.deepDive":`Deep Dive`,"results.again":`Try again`,"cast.mira":`Mira`,"cast.oda":`Grandma Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`The Warden`,"cast.hollow":`The Hollow`,"cast.knotmother":`The Knotmother`,"chapter.prologue":`The Other End`,"chapter.first-star":`One Star Home`,"chapter.wick":`Edges`,"chapter.red-thread":`The Red Thread`,"chapter.the-net":`The Net`,"chapter.warden":`The Warden`,"chapter.voice":`A Voice Without a Mouth`,"chapter.eleventh":`The Eleventh Star`,"chapter.holds":`What Holds`,"chapter.the-heart":`The Heart`,"chapter.eleven-stars":`Eleven Stars`,"chapter.below":`Below the Heart`,"chapter.underloom":`The Underloom`,"chapter.burrows":`Under the Floor`,"chapter.lampless":`The Lampless Way`,"chapter.unspun":`The Unspun Stair`,"chapter.loose-ends":`Loose Ends`,"story.prologue_1":`Walk, Mira. The starsilk remembers the way back. I hold the other end.`,"story.first-star_1":`One star home. Look up: the sky over Lanternmere has a light again.`,"story.first-star_2":`Nine more down there. And Mum.`,"story.first-star_3":`A year, Mira. Your mother went down to mend the sky and never tied back on.`,"story.first-star_4":`Then I will find her thread.`,"story.wick_1":`A moth of pale light lands on Mira's scarf. It came out of the last knot she tied.`,"story.wick_2":`Oh! I have edges again. I was a murk. Before that... a lamplighter's moth?`,"story.wick_3":`The dark unravels whatever gets lost down here. Your thread ties us back together.`,"story.wick_4":`What will you do now?`,"story.wick_4_stay":`Stay with me, little light.`,"story.wick_4_stay_1":`I'll be your eyes! My name is Wick. I think.`,"story.wick_4_go":`Fly home. You're free.`,"story.wick_4_go_1":`Home is where the light is. That's you. I'm Wick, and I'm staying.`,"story.wick_5":`Moths talk now. Fine. Keep walking, both of you.`,"story.red-thread_1":`Among the stones lies a thread, red as a scarf. Its end is cut clean.`,"story.red-thread_2":`Grandma. This is Mum's silk.`,"story.red-thread_3":`Cut? No, starsilk doesn't break. Something down there has learned to cut.`,"story.red-thread_4":`Snippers. Crab things with scissor hands. They go for the thread, not for you.`,"story.red-thread_5":`If they cut you loose, walk back to the loose end and tie on again. Quickly.`,"story.the-net_1":`Grandma, why did the stars fall?`,"story.the-net_2":`The sky over Lanternmere is a net. Our family wove it. Every star is a knot.`,"story.the-net_3":`When a knot slips, its star falls. Last month they all slipped at once.`,"story.the-net_4":`Not slipped. Pulled. Something at the bottom is pulling them in.`,"story.the-net_5":`Then it can pull against me.`,"story.warden_1":`The Warden comes apart into a hundred moths. One of them stays and speaks.`,"story.warden_2":`We guarded her. The red weaver. She asked us to keep everyone out.`,"story.warden_3":`My mother? She's alive?`,"story.warden_4":`She holds the Heart shut. It is hungry, and it is so very lonely.`,"story.warden_5":`Go down, little weaver. Do not let it hear you cry.`,"story.voice_1":`The dark leans close. A voice without a mouth fills the chamber.`,"story.voice_2":`Little weaver. You carry my stars back up. Why?`,"story.voice_3":`They aren't yours. They light a town full of people.`,"story.voice_4":`I lit nothing for a thousand years. Nobody wove me into the sky.`,"story.voice_5":`Mira... I don't think it's a monster. I think it's a star.`,"story.voice_6":`Stay close. I'm not scared when you're here.`,"story.voice_7":`I'm scared. I'm staying anyway.`,"story.eleventh_1":`Mira. I have to tell you something before you meet it.`,"story.eleventh_2":`When I was young, we wove the net. There were eleven stars, and room for ten.`,"story.eleventh_3":`The eleventh fell. We said it had burned out. Nobody went down to look.`,"story.eleventh_4":`You left it alone in the dark.`,"story.eleventh_5":`We were afraid. Your mother wasn't. She went down to weave it a place.`,"story.holds_1":`The drifters walk through walls, but even they stop at your thread.`,"story.holds_2":`Everything stops at the thread. Maybe that's what the Hollow needs. Something that holds.`,"story.holds_3":`Nothing holds me. I have tried. Everything I touch unravels.`,"story.holds_4":`Not starsilk.`,"story.the-heart_1":`The last stair. Red thread runs everywhere here, knotted round every pillar.`,"story.the-heart_2":`Mira? No. No, go back up. It will unravel you.`,"story.the-heart_3":`Mum! I have Grandma's spool. I've come to finish your weaving.`,"story.the-heart_4":`The Hollow is inside my knots. Three loops, Mira. Tie it three times and it will hold.`,"story.the-heart_5":`I have the other end, girl. I won't let go.`,"story.eleven-stars_1":`The loop pulls tight, and tighter, and the knot of dark becomes a knot of light.`,"story.eleven-stars_2":`Oh. It holds. I am... held.`,"story.eleven-stars_3":`A new knot in the sky, Mira. The eleventh star. It needs a name.`,"story.eleven-stars_4":`Its name is...`,"story.eleven-stars_4_oda":`Oda, who held on.`,"story.eleven-stars_4_oda_1":`Me? Oh, you silly girl. Fine. Shine well.`,"story.eleven-stars_4_wick":`Wick, who stayed.`,"story.eleven-stars_4_wick_1":`A star named after a moth! Every moth in the world will visit.`,"story.eleven-stars_4_lena":`Lena, who went first.`,"story.eleven-stars_4_lena_1":`Then I'll always know which one is mine.`,"story.eleven-stars_5":`Grandma Oda reels them home. Above Lanternmere, eleven stars.`,"story.below_1":`Mira, the thread still pulls. Down.`,"story.below_2":`An older loom lies below. Someone ties knots there.`,"story.below_3":`Then I'll untie them.`,"story.underloom_1":`Old threads hang from the ceiling here, every one of them knotted shut.`,"story.underloom_2":`Knotters. They tie the thread up so it can't reach anywhere.`,"story.underloom_3":`A knot steals your length, girl. Walk back over it and it comes undone.`,"story.underloom_4":`Who taught them to knot?`,"story.underloom_5":`Someone who was afraid of letting go.`,"story.burrows_1":`The floor heaves. Something swims beneath the stones like a fish under ice.`,"story.burrows_2":`Burrowers! The thread can't fence what goes under it.`,"story.burrows_3":`Then we wait till they come up. And you flash them, Wick.`,"story.burrows_4":`Flashing is the one thing I am very good at!`,"story.lampless_1":`No lamp was ever lit down here. Not one.`,"story.lampless_2":`The old weavers kept what they couldn't bear to lose down here. Tied down, so it would stay.`,"story.lampless_3":`My grandmother worked a loom like that. They said she tied her own shadow to it.`,"story.lampless_4":`The Knotmother is... family?`,"story.lampless_5":`Everyone down here is somebody's, Mira.`,"story.unspun_1":`Little weaver. You come to take what I keep.`,"story.unspun_2":`You keep everything tied so it can't leave. Even the stars.`,"story.unspun_3":`Whatever I let go, the dark unravels. I have lost too much.`,"story.unspun_4":`She isn't angry. She's scared, like the Hollow was.`,"story.unspun_5":`What do I tell her?`,"story.unspun_5_gentle":`A thread can hold without a knot.`,"story.unspun_5_gentle_1":`There is no such thread.`,"story.unspun_5_firm":`Then I'll untie you myself.`,"story.unspun_5_firm_1":`Try, little weaver.`,"story.loose-ends_1":`Four loops, and the Knotmother's knots slip loose one by one.`,"story.loose-ends_2":`They're... going. And nothing unravels.`,"story.loose-ends_3":`A thread someone holds doesn't need a knot. Grandma holds mine.`,"story.loose-ends_4":`Then hold mine, little weaver. Just for a while.`,"story.loose-ends_5":`You were right to be firm. I tied too tight, for too long.`,"story.loose-ends_6":`Bring her up, Mira. There's room in the sky for one more light.`,"story.loose-ends_7":`Above Lanternmere the old threads catch the starlight. Every one of them holds.`},es:{"title.descend":`Desciende · Abismo {n}`,"title.deepDive":`Inmersión`,"title.named":`La estrella {name} brilla sobre Lanternmere.`,"title.home":{one:`{n} de {total} estrellas está en casa.`,other:`{n} de {total} estrellas están en casa.`},"title.tagline":`Las estrellas cayeron al laberinto. Tráelas a casa.`,"title.glimmer":`{n} brillo`,"title.loom":`Telar`,"title.depths":`Abismos`,"title.soundOn":`Sonido: sí`,"title.soundOff":`Sonido: no`,"title.musicOn":`Música: sí`,"title.musicOff":`Música: no`,"depths.title":`Los Abismos`,"depths.note":`★ a casa con la estrella · ★ atrapa a los umbríos · ★ no pierdas corazones`,"depths.locked":`Abismo {n}`,"depths.unlock":`Supera el abismo {n}`,"depths.next":`Siguiente`,"depths.boss":`Jefe`,"depths.bossNext":`Jefe · siguiente`,"depths.deep":`Inmersiones`,"depths.best":`Récord: inmersión {n}`,"depth.d1":`La Escalera del Sótano`,"depth.d2":`Galerías de Musgo`,"depth.d3":`El Nudo Rojo`,"depth.d4":`Salas de Tijeras`,"depth.d5":`El Guardián`,"depth.d6":`Aguallanto`,"depth.d7":`La Deriva`,"depth.d8":`Telar de Huesos`,"depth.d9":`El Mar sin Luz`,"depth.d10":`El Corazón Vacío`,"depth.d11":`El Subtelar`,"depth.d12":`Las Madrigueras`,"depth.d13":`El Camino sin Lámparas`,"depth.d14":`La Escalera sin Hilar`,"depth.d15":`La Madre Nudo`,"depth.deep":`Inmersión {n}`,"shop.title":`El Telar`,"shop.currency":`brillo`,"shop.spool.name":`Hilo más largo`,"shop.spool.effect":`Más seda estelar en la bobina`,"shop.reel.name":`Carrete engrasado`,"shop.reel.effect":`Vuelve a casa por el hilo más rápido; reúne chispas desde más lejos`,"shop.wire.name":`Seda de alambre`,"shop.wire.effect":`Las sombras que cortan, comen o anudan tu hilo van más lentas`,"shop.lamp.name":`Lámpara más brillante`,"shop.lamp.effect":`Ves más lejos; su resplandor hace que cada mordisco tarde más`,"shop.bell.name":`Campana estelar`,"shop.bell.effect":`Una estrella robada suena y se escapa de las patas del ratero`,"shop.redsilk.name":`El hilo rojo de Lena`,"shop.redsilk.effect":`Aún más hilo, hilado por tu madre`,"shop.cloak.name":`Capa de polilla`,"shop.cloak.effect":`Más tiempo a salvo tras un mordisco`,"shop.flash.name":`El resplandor de Wick`,"shop.flash.effect":`Wick puede lanzar otro Destello antes`,"shop.burn.name":`Quemaseda`,"shop.burn.effect":`La seda oscura se disipa más rápido dentro de tu luz`,"shop.knot.name":`Nudo de tejedor`,"shop.knot.effect":`Más brillo por cada umbrío atrapado`,"shop.thorn.name":`Seda espinosa`,"shop.thorn.effect":`Las sombras que chocan con el hilo quedan aturdidas`,"shop.boots.name":`Botas suaves`,"shop.boots.effect":`Caminas más rápido`,"shop.hearts.name":`Amuleto de la abuela`,"shop.hearts.effect":`Un corazón más`,"fmt.tiles":{one:`{n} casilla`,other:`{n} casillas`},"fmt.moreTiles":{one:`+{n} casilla`,other:`+{n} casillas`},"fmt.speed":`velocidad {n}`,"fmt.chew":`{n}% tiempo de roer`,"fmt.freeIn":`libre en {n} s`,"fmt.never":`nunca`,"fmt.seconds":`{n} s`,"fmt.every":`cada {n} s`,"fmt.fade":`×{n} disipación`,"fmt.percent":`{n}%`,"fmt.none":`ninguno`,"fmt.hearts":{one:`{n} corazón`,other:`{n} corazones`},"tip.snare":`Traza un lazo alrededor de un umbrío y cruza tu propio hilo: ¡el lazo lo atrapa!`,"tip.bite":`Cuando sus ojos se ponen rojos, muerden. ¡Sigue moviéndote y fallarán!`,"tip.fence":`¿Ves? Los umbríos no pueden cruzar la seda estelar. ¡Acorrálalos!`,"tip.taut":`¡Se acabó el hilo! Vuelve sobre tus pasos para enrollarlo o átalo a una estaca.`,"tip.peg":`¡Una estaca! Ata el hilo: desde aquí tienes un tramo nuevo. Al volver, pulsa Recoger otra vez para desatarlo.`,"tip.star":`¡La estrella! Mantén Recoger (Espacio) y te llevaré a casa.`,"tip.cut":`¡Cortado! Sin el hilo no puedes llevarte nada. ¡Vuelve al cabo suelto!`,"tip.boss":`Es demasiado grande para atraparlo de una vez. ¡Échale el lazo una y otra vez!`,"tip.drifter":`Los errantes atraviesan muros, pero nunca el hilo.`,"tip.gnawer":`¡Un roedor! Si termina de roer, se come todo el hilo hasta el nudo.`,"tip.filcher":`Los rateros roban estrellas. Si uno se la lleva, ¡atrápalo para recuperarla!`,"tip.tangler":`Los enredadores tejen seda oscura. No puedes cruzarla hasta que se disipe.`,"tip.cutterGlow":`¿Ves esa estrella brillar más? ¡Algo está royendo tu hilo!`,"tip.knotter":`¡Un anudador! Cada nudo que hace acorta tu hilo. Pasa de nuevo sobre un nudo para deshacerlo.`,"tip.burrower":`Los excavadores cavan bajo el hilo. Cuando el suelo se agite, apártate, ¡y échales el lazo cuando salgan!`,"tip.flare":`¡Wick ya puede lanzar un Destello! Pulsa F (o Destello) para aturdir a las sombras cercanas.`,"bark.snare1":`¡Retejido!`,"bark.snare2":`Otro recuerda sus contornos.`,"bark.snare3":`¡Esa es mi niña!`,"bark.snare4":`Más firme que un nudo de domingo.`,"bark.snare5":`¡A la luz contigo!`,"bark.snare6":`El hilo aguanta.`,"bark.hollowDown":`¡Aguanta! ¡Toma la estrella, Mira!`,"bark.knotmotherDown":`¡Ha soltado! Lleva la última estrella a casa.`,"bark.wardenDown":`¡El Guardián ha caído! ¡La estrella es libre!`,"bark.star":`¡La estrella! Ahora a casa: mantén Recoger.`,"bark.devour":`¡Se ha comido todo el hilo! Vuelve al nudo para atarte.`,"bark.steal":`¡Un ratero tiene la estrella! ¡Échale el lazo!`,"hud.intro":`Arrastra o WASD para andar · mantén Recoger (Espacio) para volver por el hilo`,"hud.line":`Abismo {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Hilo restante`,"hud.pause":`Pausa`,"hud.reel":`Recoger`,"hud.reelAria":`Recoger y volver por el hilo`,"hud.flash":`Destello`,"hud.flashAria":`Destello de Wick: aturde a las sombras cercanas`,"goal.cut":`¡Te cortaron el hilo! Átate de nuevo en el cabo suelto para llevarte cosas`,"goal.carry":`Lleva la estrella a casa: mantén Recoger para volver por el hilo`,"goal.stolen":`¡Un ratero se llevó la estrella! Atrápalo para recuperarla`,"goal.rule":`Traza un lazo alrededor de un umbrío y cruza tu hilo para atraparlo`,"goal.warden":`Atrapa al Guardián: traza un lazo a su alrededor ({hit}/{max})`,"goal.hollow":`Atrapa al Vacío: traza un lazo a su alrededor ({hit}/{max})`,"goal.knotmother":`Atrapa a la Madre Nudo: traza un lazo a su alrededor ({hit}/{max})`,"goal.knots":{one:`{n} nudo acorta tu hilo: pasa de nuevo por encima para deshacerlo`,other:`{n} nudos acortan tu hilo: pasa de nuevo por encima para deshacerlos`},"goal.find":`Encuentra la estrella caída`,"float.double":`¡Nudo doble!`,"float.triple":`¡Nudo triple!`,"float.multi":`¡Nudo {n}×!`,"float.loopsToGo":{one:`¡Falta {n} lazo!`,other:`¡Faltan {n} lazos!`},"float.knotsLeft":{one:`¡Queda {n} nudo!`,other:`¡Quedan {n} nudos!`},"float.tied":`¡Atado!`,"float.untied":`¡Desatado!`,"float.eaten":`¡Comido hasta el nudo!`,"float.stolen":`¡Robada!`,"float.free":`¡La estrella es libre!`,"float.knot":`¡Nudo!`,"float.undone":`¡Deshecho!`,"pause.leave":`Salir del abismo`,"lost.title":`Perdida en la oscuridad`,"lost.continue":`▶ Seguir con 2 corazones (anuncio)`,"lost.carrying":`¡Llevabas la estrella a casa!`,"lost.away":{one:`La estrella estaba a {n} casilla.`,other:`La estrella estaba a {n} casillas.`},"lost.dark":`La oscuridad se cierra.`,"results.elevenStars":`¡Once estrellas!`,"results.everyThread":`¡Todos los hilos aguantan!`,"results.home":`¡En casa con la estrella!`,"results.pulled":`Oda te subió de vuelta`,"results.surface":`De vuelta en la superficie`,"results.starHome":`La estrella está en casa`,"results.bringStar":`Lleva la estrella a casa`,"results.snared":`Atrapados {n} / {quota} umbríos`,"results.lostHearts":{one:`Perdiste {n} corazón`,other:`Perdiste {n} corazones`},"results.noHeartLost":`Ningún corazón perdido`,"results.loseNoHeart":`No pierdas corazones`,"results.gain":`+{n} brillo`,"results.gathered":`{n} reunido`,"results.forDepth":`{n} por el abismo`,"results.forStars":`{n} por estrellas nuevas`,"results.next":`Siguiente: Abismo {n}`,"results.deepDive":`Inmersión`,"results.again":`Reintentar`,"cast.mira":`Mira`,"cast.oda":`Abuela Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`El Guardián`,"cast.hollow":`El Vacío`,"cast.knotmother":`La Madre Nudo`,"chapter.prologue":`El otro extremo`,"chapter.first-star":`Una estrella en casa`,"chapter.wick":`Contornos`,"chapter.red-thread":`El hilo rojo`,"chapter.the-net":`La red`,"chapter.warden":`El Guardián`,"chapter.voice":`Una voz sin boca`,"chapter.eleventh":`La undécima estrella`,"chapter.holds":`Lo que aguanta`,"chapter.the-heart":`El Corazón`,"chapter.eleven-stars":`Once estrellas`,"chapter.below":`Bajo el Corazón`,"chapter.underloom":`El Subtelar`,"chapter.burrows":`Bajo el suelo`,"chapter.lampless":`El Camino sin Lámparas`,"chapter.unspun":`La Escalera sin Hilar`,"chapter.loose-ends":`Cabos sueltos`,"story.prologue_1":`Camina, Mira. La seda estelar recuerda el camino de vuelta. Yo sostengo el otro extremo.`,"story.first-star_1":`Una estrella en casa. Alza la vista: el cielo de Lanternmere vuelve a tener luz.`,"story.first-star_2":`Quedan nueve ahí abajo. Y mamá.`,"story.first-star_3":`Un año, Mira. Tu madre bajó a remendar el cielo y nunca volvió a atarse.`,"story.first-star_4":`Entonces encontraré su hilo.`,"story.wick_1":`Una polilla de luz pálida se posa en la bufanda de Mira. Salió del último nudo que ató.`,"story.wick_2":`¡Oh! Vuelvo a tener contornos. Era un umbrío. Y antes... ¿la polilla de un farolero?`,"story.wick_3":`La oscuridad deshilacha todo lo que se pierde aquí abajo. Tu hilo nos vuelve a atar.`,"story.wick_4":`¿Y ahora qué harás?`,"story.wick_4_stay":`Quédate conmigo, lucecita.`,"story.wick_4_stay_1":`¡Seré tus ojos! Me llamo Wick. Creo.`,"story.wick_4_go":`Vuela a casa. Eres libre.`,"story.wick_4_go_1":`Mi casa está donde está la luz. O sea, tú. Soy Wick y me quedo.`,"story.wick_5":`Vaya, ahora hablan las polillas. Muy bien. Andando, los dos.`,"story.red-thread_1":`Entre las piedras hay un hilo, rojo como una bufanda. Su extremo está cortado en limpio.`,"story.red-thread_2":`Abuela. Es la seda de mamá.`,"story.red-thread_3":`¿Cortado? La seda estelar no se rompe. Algo ahí abajo ha aprendido a cortar.`,"story.red-thread_4":`Tijeretas. Bichos como cangrejos con manos de tijera. Atacan al hilo, no a ti.`,"story.red-thread_5":`Si te cortan, vuelve al cabo suelto y átate de nuevo. ¡Rápido!`,"story.the-net_1":`Abuela, ¿por qué cayeron las estrellas?`,"story.the-net_2":`El cielo de Lanternmere es una red. La tejió nuestra familia. Cada estrella es un nudo.`,"story.the-net_3":`Cuando un nudo se suelta, su estrella cae. El mes pasado se soltaron todos a la vez.`,"story.the-net_4":`No se soltaron. Tiraron de ellos. Algo en el fondo los está arrastrando.`,"story.the-net_5":`Pues que tire contra mí.`,"story.warden_1":`El Guardián se deshace en cien polillas. Una de ellas se queda y habla.`,"story.warden_2":`La protegíamos. A la tejedora roja. Nos pidió que no dejáramos pasar a nadie.`,"story.warden_3":`¿Mi madre? ¿Está viva?`,"story.warden_4":`Mantiene cerrado el Corazón. Tiene hambre, y está tan, tan solo.`,"story.warden_5":`Baja, pequeña tejedora. No dejes que te oiga llorar.`,"story.voice_1":`La oscuridad se acerca. Una voz sin boca llena la cámara.`,"story.voice_2":`Pequeña tejedora. Te llevas mis estrellas arriba. ¿Por qué?`,"story.voice_3":`No son tuyas. Iluminan un pueblo lleno de gente.`,"story.voice_4":`No iluminé nada en mil años. Nadie me tejió en el cielo.`,"story.voice_5":`Mira... No creo que sea un monstruo. Creo que es una estrella.`,"story.voice_6":`Quédate cerca. No tengo miedo si estás aquí.`,"story.voice_7":`Tengo miedo. Pero me quedo igual.`,"story.eleventh_1":`Mira. Tengo que contarte algo antes de que lo conozcas.`,"story.eleventh_2":`De joven, tejimos la red. Había once estrellas, y sitio para diez.`,"story.eleventh_3":`La undécima cayó. Dijimos que se había apagado. Nadie bajó a mirar.`,"story.eleventh_4":`La dejaste sola en la oscuridad.`,"story.eleventh_5":`Teníamos miedo. Tu madre no. Bajó a tejerle un sitio.`,"story.holds_1":`Los errantes atraviesan muros, pero hasta ellos se detienen ante tu hilo.`,"story.holds_2":`Ante el hilo se detiene todo. Quizá eso necesite el Vacío. Algo que lo sostenga.`,"story.holds_3":`Nada me sostiene. Lo he intentado. Todo lo que toco se deshilacha.`,"story.holds_4":`La seda estelar, no.`,"story.the-heart_1":`La última escalera. Aquí el hilo rojo lo cubre todo, anudado a cada columna.`,"story.the-heart_2":`¿Mira? No. No, vuelve arriba. Te deshilachará.`,"story.the-heart_3":`¡Mamá! Tengo la bobina de la abuela. He venido a terminar tu tejido.`,"story.the-heart_4":`El Vacío está dentro de mis nudos. Tres lazos, Mira. Átalo tres veces y aguantará.`,"story.the-heart_5":`Tengo el otro extremo, niña. No pienso soltarlo.`,"story.eleven-stars_1":`El lazo se aprieta, y se aprieta más, y el nudo de oscuridad se vuelve un nudo de luz.`,"story.eleven-stars_2":`Oh. Aguanta. Me... sostiene.`,"story.eleven-stars_3":`Un nudo nuevo en el cielo, Mira. La undécima estrella. Necesita un nombre.`,"story.eleven-stars_4":`Se llama...`,"story.eleven-stars_4_oda":`Oda, la que no soltó.`,"story.eleven-stars_4_oda_1":`¿Yo? Ay, niña tonta. Bueno. Brilla bien.`,"story.eleven-stars_4_wick":`Wick, el que se quedó.`,"story.eleven-stars_4_wick_1":`¡Una estrella con nombre de polilla! Vendrán todas las polillas del mundo.`,"story.eleven-stars_4_lena":`Lena, la que bajó primero.`,"story.eleven-stars_4_lena_1":`Así siempre sabré cuál es la mía.`,"story.eleven-stars_5":`La abuela Oda los sube a casa con el hilo. Sobre Lanternmere, once estrellas.`,"story.below_1":`Mira, el hilo todavía tira. Hacia abajo.`,"story.below_2":`Abajo hay un telar más antiguo. Alguien ata nudos allí.`,"story.below_3":`Entonces los desataré.`,"story.underloom_1":`Aquí cuelgan hilos viejos del techo, todos cerrados con nudos.`,"story.underloom_2":`Anudadores. Atan el hilo para que no llegue a ninguna parte.`,"story.underloom_3":`Un nudo te roba hilo, niña. Pasa de nuevo por encima y se deshace.`,"story.underloom_4":`¿Quién les enseñó a anudar?`,"story.underloom_5":`Alguien que tenía miedo de soltar.`,"story.burrows_1":`El suelo se agita. Algo nada bajo las piedras como un pez bajo el hielo.`,"story.burrows_2":`¡Excavadores! El hilo no puede cercar lo que pasa por debajo.`,"story.burrows_3":`Entonces esperamos a que salgan. Y tú les lanzas un destello, Wick.`,"story.burrows_4":`¡Lanzar destellos es lo que mejor se me da!`,"story.lampless_1":`Aquí abajo nunca se encendió una lámpara. Ni una.`,"story.lampless_2":`Los antiguos tejedores guardaban aquí lo que no soportaban perder. Atado, para que se quedara.`,"story.lampless_3":`Mi abuela trabajaba en un telar así. Decían que ató a él su propia sombra.`,"story.lampless_4":`¿La Madre Nudo es... familia?`,"story.lampless_5":`Todos aquí abajo son de alguien, Mira.`,"story.unspun_1":`Pequeña tejedora. Vienes a llevarte lo que guardo.`,"story.unspun_2":`Lo tienes todo atado para que no se vaya. Hasta las estrellas.`,"story.unspun_3":`Lo que suelto, la oscuridad lo deshilacha. He perdido demasiado.`,"story.unspun_4":`No está enfadada. Tiene miedo, como el Vacío.`,"story.unspun_5":`¿Qué le digo?`,"story.unspun_5_gentle":`Un hilo puede aguantar sin nudo.`,"story.unspun_5_gentle_1":`No existe tal hilo.`,"story.unspun_5_firm":`Entonces te desataré yo misma.`,"story.unspun_5_firm_1":`Inténtalo, pequeña tejedora.`,"story.loose-ends_1":`Cuatro lazos, y los nudos de la Madre Nudo se sueltan uno a uno.`,"story.loose-ends_2":`Se... van. Y nada se deshilacha.`,"story.loose-ends_3":`Un hilo que alguien sostiene no necesita nudo. La abuela sostiene el mío.`,"story.loose-ends_4":`Entonces sostén el mío, pequeña tejedora. Solo un rato.`,"story.loose-ends_5":`Hiciste bien en ser firme. Até demasiado fuerte, durante demasiado tiempo.`,"story.loose-ends_6":`Súbela, Mira. Hay sitio en el cielo para una luz más.`,"story.loose-ends_7":`Sobre Lanternmere, los hilos viejos reflejan la luz de las estrellas. Todos aguantan.`},"pt-BR":{"title.descend":`Descer · Profundeza {n}`,"title.deepDive":`Mergulho Profundo`,"title.named":`A estrela {name} brilha sobre Lanternmere.`,"title.home":{one:`{n} de {total} estrelas está em casa.`,other:`{n} de {total} estrelas estão em casa.`},"title.tagline":`As estrelas caíram no labirinto. Traga-as para casa.`,"title.glimmer":`{n} de brilho`,"title.loom":`Tear`,"title.depths":`Profundezas`,"title.soundOn":`Som ligado`,"title.soundOff":`Som desligado`,"title.musicOn":`Música ligada`,"title.musicOff":`Música desligada`,"depths.title":`As Profundezas`,"depths.note":`★ volte com a estrela · ★ lace os breus · ★ não perca nenhum coração`,"depths.locked":`Profundeza {n}`,"depths.unlock":`Conclua a profundeza {n}`,"depths.next":`Próxima`,"depths.boss":`Chefe`,"depths.bossNext":`Chefe · próxima`,"depths.deep":`Mergulhos Profundos`,"depths.best":`Recorde: mergulho {n}`,"depth.d1":`A Escada do Porão`,"depth.d2":`Galerias de Musgo`,"depth.d3":`O Nó Vermelho`,"depth.d4":`Salões das Tesouras`,"depth.d5":`O Guardião`,"depth.d6":`Águas Chorosas`,"depth.d7":`A Deriva`,"depth.d8":`Tear de Ossos`,"depth.d9":`O Mar Apagado`,"depth.d10":`O Coração Vazio`,"depth.d11":`O Tear de Baixo`,"depth.d12":`Salões d
