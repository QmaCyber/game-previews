.warden":`Bekçi`,"chapter.voice":`Ağzı Olmayan Bir Ses`,"chapter.eleventh":`On Birinci Yıldız`,"chapter.holds":`Tutan Şey`,"chapter.the-heart":`Kalp`,"chapter.eleven-stars":`On Bir Yıldız`,"chapter.below":`Kalbin Altında`,"chapter.underloom":`Alt Tezgâh`,"chapter.burrows":`Zeminin Altında`,"chapter.lampless":`Lambasız Yol`,"chapter.unspun":`Eğrilmemiş Merdiven`,"chapter.loose-ends":`Açık Uçlar`,"story.prologue_1":`Yürü, Mira. Yıldız ipeği dönüş yolunu hatırlar. Öbür ucu ben tutuyorum.`,"story.first-star_1":`Bir yıldız evde. Yukarı bak: Lanternmere'in göğünde yine bir ışık var.`,"story.first-star_2":`Aşağıda dokuz tane daha var. Bir de annem.`,"story.first-star_3":`Bir yıl oldu, Mira. Annen göğü onarmaya indi ve bir daha ipe bağlanmadı.`,"story.first-star_4":`O zaman onun ipini bulacağım.`,"story.wick_1":`Mira'nın atkısına soluk ışıktan bir pervane konuyor. Attığı son düğümden çıkmış.`,"story.wick_2":`Ah! Hatlarım geri geldi. Bir karaltıydım. Ondan önce... bir lambacının pervanesi?`,"story.wick_3":`Karanlık, burada kaybolan her şeyi söker. Senin ipin bizi yeniden bağlıyor.`,"story.wick_4":`Şimdi ne yapacaksın?`,"story.wick_4_stay":`Benimle kal, küçük ışık.`,"story.wick_4_stay_1":`Senin gözlerin olurum! Adım Wick. Galiba.`,"story.wick_4_go":`Evine uç. Özgürsün.`,"story.wick_4_go_1":`Ev, ışığın olduğu yerdir. Yani sen. Ben Wick'im ve kalıyorum.`,"story.wick_5":`Artık pervaneler de konuşuyor. Peki. Yürümeye devam edin, ikiniz de.`,"story.red-thread_1":`Taşların arasında atkı gibi kırmızı bir ip yatıyor. Ucu tertemiz kesilmiş.`,"story.red-thread_2":`Nine. Bu annemin ipeği.`,"story.red-thread_3":`Kesilmiş mi? Hayır, yıldız ipeği kopmaz. Aşağıda bir şey kesmeyi öğrenmiş.`,"story.red-thread_4":`Kesiciler. Makas elli yengeç şeyler. Seni değil, ipi hedef alırlar.`,"story.red-thread_5":`Seni koparırlarsa kopuk uca geri yürü ve yeniden bağlan. Çabuk.`,"story.the-net_1":`Nine, yıldızlar neden düştü?`,"story.the-net_2":`Lanternmere'in göğü bir ağdır. Onu ailemiz dokudu. Her yıldız bir düğümdür.`,"story.the-net_3":`Bir düğüm kayınca yıldızı düşer. Geçen ay hepsi birden kaydı.`,"story.the-net_4":`Kaymadılar. Çekildiler. Dipteki bir şey onları aşağı çekiyor.`,"story.the-net_5":`O zaman bir de bana karşı çeksin.`,"story.warden_1":`Bekçi yüz pervaneye dağılıyor. İçlerinden biri kalıp konuşuyor.`,"story.warden_2":`Onu koruduk. Kırmızı dokumacıyı. Kimseyi içeri almamamızı istedi.`,"story.warden_3":`Annem mi? Yaşıyor mu?`,"story.warden_4":`Kalbi kapalı tutuyor. Kalp aç, hem de öyle yalnız ki.`,"story.warden_5":`İn aşağı, küçük dokumacı. Ağladığını duymasın.`,"story.voice_1":`Karanlık yaklaşıyor. Ağzı olmayan bir ses odayı dolduruyor.`,"story.voice_2":`Küçük dokumacı. Yıldızlarımı yukarı taşıyorsun. Neden?`,"story.voice_3":`Onlar senin değil. Koca bir kasabayı aydınlatıyorlar.`,"story.voice_4":`Bin yıl hiçbir şeyi aydınlatmadım. Kimse beni göğe dokumadı.`,"story.voice_5":`Mira... Bence o bir canavar değil. Bence o bir yıldız.`,"story.voice_6":`Yakın dur. Sen buradayken korkmuyorum.`,"story.voice_7":`Korkuyorum. Yine de kalıyorum.`,"story.eleventh_1":`Mira. Onunla karşılaşmadan önce sana bir şey söylemeliyim.`,"story.eleventh_2":`Ben gençken ağı dokuduk. On bir yıldız vardı, ama on yıldızlık yer.`,"story.eleventh_3":`On birincisi düştü. Söndü dedik. Kimse bakmaya inmedi.`,"story.eleventh_4":`Onu karanlıkta yalnız bıraktınız.`,"story.eleventh_5":`Korktuk. Annen korkmadı. Ona bir yer dokumak için aşağı indi.`,"story.holds_1":`Süzülenler duvarlardan geçer ama onlar bile ipinde durur.`,"story.holds_2":`Her şey ipte durur. Belki Oyuk'un ihtiyacı da bu. Tutan bir şey.`,"story.holds_3":`Hiçbir şey beni tutamaz. Denedim. Dokunduğum her şey sökülür.`,"story.holds_4":`Yıldız ipeği sökülmez.`,"story.the-heart_1":`Son merdiven. Burada her yere kırmızı ip uzanıyor, her sütuna düğümlenmiş.`,"story.the-heart_2":`Mira? Hayır. Hayır, yukarı dön. Seni söker.`,"story.the-heart_3":`Anne! Ninemin makarası bende. Dokumanı bitirmeye geldim.`,"story.the-heart_4":`Oyuk düğümlerimin içinde. Üç halka, Mira. Onu üç kez bağla, tutacaktır.`,"story.the-heart_5":`Öbür uç bende, kızım. Bırakmayacağım.`,"story.eleven-stars_1":`Halka sıkılaşıyor, daha da sıkılaşıyor ve karanlık düğüm ışık düğümüne dönüşüyor.`,"story.eleven-stars_2":`Ah. Tutuyor. Ben... tutuluyorum.`,"story.eleven-stars_3":`Gökte yeni bir düğüm, Mira. On birinci yıldız. Bir adı olmalı.`,"story.eleven-stars_4":`Adı...`,"story.eleven-stars_4_oda":`Oda, ipi bırakmayan.`,"story.eleven-stars_4_oda_1":`Ben mi? Ah, seni deli kız. Peki. Güzel parla.`,"story.eleven-stars_4_wick":`Wick, yanımda kalan.`,"story.eleven-stars_4_wick_1":`Adını bir pervaneden alan yıldız! Dünyadaki bütün pervaneler ziyarete gelecek.`,"story.eleven-stars_4_lena":`Lena, ilk giden.`,"story.eleven-stars_4_lena_1":`O zaman hangisinin benim olduğunu hep bileceğim.`,"story.eleven-stars_5":`Oda Nine onları ipi sararak eve çekiyor. Lanternmere'in üstünde on bir yıldız.`,"story.below_1":`Mira, ip hâlâ çekiyor. Aşağı.`,"story.below_2":`Aşağıda daha eski bir tezgâh var. Orada biri düğüm atıyor.`,"story.below_3":`O zaman onları çözerim.`,"story.underloom_1":`Burada tavandan eski ipler sarkıyor, hepsi sımsıkı düğümlenmiş.`,"story.underloom_2":`Düğümcüler. İpi düğümlerler, hiçbir yere uzanamasın diye.`,"story.underloom_3":`Düğüm ipinin boyunu çalar, kızım. Üstünden geri yürü, çözülür.`,"story.underloom_4":`Onlara düğüm atmayı kim öğretti?`,"story.underloom_5":`Bırakmaktan korkan biri.`,"story.burrows_1":`Zemin kabarıyor. Taşların altında bir şey, buz altındaki balık gibi yüzüyor.`,"story.burrows_2":`Kazıcılar! İp, altından geçeni çevreleyemez.`,"story.burrows_3":`O zaman yukarı çıkmalarını bekleriz. Sen de onlara flaş çakarsın, Wick.`,"story.burrows_4":`Flaş çakmak benim en iyi yaptığım iş!`,"story.lampless_1":`Burada hiç lamba yakılmadı. Bir tane bile.`,"story.lampless_2":`Eski dokumacılar kaybetmeye dayanamadıklarını burada saklardı. Kalsın diye bağlayarak.`,"story.lampless_3":`Benim ninem de öyle bir tezgâhta çalışırdı. Kendi gölgesini ona bağladığını söylerlerdi.`,"story.lampless_4":`Düğüm Ana... akrabamız mı?`,"story.lampless_5":`Buradaki herkes birinin yakını, Mira.`,"story.unspun_1":`Küçük dokumacı. Sakladıklarımı almaya geldin.`,"story.unspun_2":`Her şeyi gidemesin diye bağlı tutuyorsun. Yıldızları bile.`,"story.unspun_3":`Neyi bıraksam karanlık onu söker. Çok şey kaybettim.`,"story.unspun_4":`O kızgın değil. Korkuyor, tıpkı Oyuk gibi.`,"story.unspun_5":`Ona ne diyeyim?`,"story.unspun_5_gentle":`Bir ip düğümsüz de tutabilir.`,"story.unspun_5_gentle_1":`Öyle bir ip yok.`,"story.unspun_5_firm":`O zaman seni kendim çözerim.`,"story.unspun_5_firm_1":`Dene bakalım, küçük dokumacı.`,"story.loose-ends_1":`Dört halka ve Düğüm Ana'nın düğümleri teker teker çözülüyor.`,"story.loose-ends_2":`Gidiyorlar... Ve hiçbir şey sökülmüyor.`,"story.loose-ends_3":`Birinin tuttuğu ipin düğüme ihtiyacı yoktur. Benimkini ninem tutuyor.`,"story.loose-ends_4":`O zaman benimkini sen tut, küçük dokumacı. Birazcık.`,"story.loose-ends_5":`Kararlı olmakta haklıydın. Çok sıkı bağladım, hem de çok uzun süre.`,"story.loose-ends_6":`Onu yukarı getir, Mira. Gökte bir ışığa daha yer var.`,"story.loose-ends_7":`Lanternmere'in üstünde eski ipler yıldız ışığını yakalıyor. Her biri tutuyor.`},it:{"title.descend":`Scendi · Profondità {n}`,"title.deepDive":`Immersione`,"title.named":`La stella {name} brilla su Lanternmere.`,"title.home":{one:`{n} stella su {total} è a casa.`,other:`{n} stelle su {total} sono a casa.`},"title.tagline":`Le stelle sono cadute nel labirinto. Riportale a casa.`,"title.glimmer":`{n} barlumi`,"title.loom":`Telaio`,"title.depths":`Profondità`,"title.soundOn":`Suoni sì`,"title.soundOff":`Suoni no`,"title.musicOn":`Musica sì`,"title.musicOff":`Musica no`,"depths.title":`Le Profondità`,"depths.note":`★ a casa con la stella · ★ cattura i tenebrini · ★ non perdere cuori`,"depths.locked":`Profondità {n}`,"depths.unlock":`Supera la profondità {n}`,"depths.next":`Prossima`,"depths.boss":`Boss`,"depths.bossNext":`Boss · prossima`,"depths.deep":`Immersioni`,"depths.best":`Record: immersione {n}`,"depth.d1":`La Scala della Cantina`,"depth.d2":`Gallerie di Muschio`,"depth.d3":`Il Nodo Rosso`,"depth.d4":`Sale delle Forbici`,"depth.d5":`Il Guardiano`,"depth.d6":`Acquapianto`,"depth.d7":`La Deriva`,"depth.d8":`Telaio d'Ossa`,"depth.d9":`Il Mare Spento`,"depth.d10":`Il Cuore del Vuoto`,"depth.d11":`Il Sottotelaio`,"depth.d12":`Sale delle Tane`,"depth.d13":`La Via Senza Lampade`,"depth.d14":`La Scala Sfilata`,"depth.d15":`La Madre dei Nodi`,"depth.deep":`Immersione {n}`,"shop.title":`Il Telaio`,"shop.currency":`barlumi`,"shop.spool.name":`Filo più lungo`,"shop.spool.effect":`Più seta stellare sul rocchetto`,"shop.reel.name":`Avvolgitore oliato`,"shop.reel.effect":`Torni a casa lungo il filo più veloce; raccogli scintille più lontane`,"shop.wire.name":`Seta di ferro`,"shop.wire.effect":`Le ombre che tagliano, mangiano o annodano il filo sono più lente`,"shop.lamp.name":`Lanterna più forte`,"shop.lamp.effect":`Vedi più lontano; il bagliore rallenta la carica di ogni morso`,"shop.bell.name":`Campanella`,"shop.bell.effect":`Una stella rubata suona e sfugge alle zampe del ladruncolo`,"shop.redsilk.name":`Il filo rosso di Lena`,"shop.redsilk.effect":`Ancora più filo, filato da tua madre`,"shop.cloak.name":`Mantello di falena`,"shop.cloak.effect":`Protezione più lunga dopo un morso`,"shop.flash.name":`La luce di Wick`,"shop.flash.effect":`Wick può fare un altro Lampo prima`,"shop.burn.name":`Brucia-seta`,"shop.burn.effect":`La seta scura svanisce prima nella tua luce`,"shop.knot.name":`Nodo del tessitore`,"shop.knot.effect":`Più barlumi per ogni cattura`,"shop.thorn.name":`Seta spinosa`,"shop.thorn.effect":`Le ombre che urtano il filo restano stordite`,"shop.boots.name":`Stivali morbidi`,"shop.boots.effect":`Cammini più veloce`,"shop.hearts.name":`Amuleto della nonna`,"shop.hearts.effect":`Un cuore in più`,"fmt.tiles":{one:`{n} casella`,other:`{n} caselle`},"fmt.moreTiles":{one:`+{n} casella`,other:`+{n} caselle`},"fmt.speed":`velocità {n}`,"fmt.chew":`{n}% tempo di morso`,"fmt.freeIn":`gratis tra {n} s`,"fmt.never":`mai`,"fmt.seconds":`{n} s`,"fmt.every":`ogni {n} s`,"fmt.fade":`×{n} dissolvenza`,"fmt.percent":`{n}%`,"fmt.none":`nessuno`,"fmt.hearts":{one:`{n} cuore`,other:`{n} cuori`},"tip.snare":`Fai un giro attorno a un tenebrino e incrocia il tuo filo: il giro lo cattura!`,"tip.bite":`Quando gli occhi diventano rossi, mordono. Continua a muoverti e ti mancano!`,"tip.fence":`Visto? I tenebrini non attraversano la seta stellare. Recintali!`,"tip.taut":`Il filo è finito! Torna indietro per riavvolgerlo, o legalo a un picchetto.`,"tip.peg":`Un picchetto! Ci leghi il filo: da qui riparte tutta la lunghezza. Lì, premi di nuovo Avvolgi per slegarlo.`,"tip.star":`La stella! Tieni premuto Avvolgi (Spazio) e ti tiro a casa.`,"tip.cut":`Tagliato! Senza filo non puoi raccogliere niente. Torna al capo sciolto!`,"tip.boss":`Troppo grande da prendere in una volta. Fagli un giro attorno ancora e ancora!`,"tip.drifter":`Gli erranti passano attraverso i muri, ma mai attraverso il filo.`,"tip.gnawer":`Un rosicchino! Se finisce di rosicchiare, si mangia tutto il filo fino al nodo.`,"tip.filcher":`I ladruncoli rubano le stelle. Se ne prende una, catturalo per riaverla!`,"tip.tangler":`Gli arruffoni filano seta scura. Non puoi attraversarla finché non svanisce.`,"tip.cutterGlow":`Vedi quella stella che brilla di più? Qualcosa ti sta rosicchiando il filo!`,"tip.knotter":`Un annodatore! Ogni nodo che fa accorcia il filo. Ripassa sopra un nodo per scioglierlo.`,"tip.burrower":`Gli scavatori scavano sotto il filo. Quando il pavimento si solleva, allontanati e catturali mentre sono fuori!`,"tip.flare":`Wick può fare un Lampo! Premi F (o Lampo) per stordire le ombre vicine.`,"bark.snare1":`Ritessuto!`,"bark.snare2":`Un altro si ricorda dei suoi contorni.`,"bark.snare3":`Brava la mia bambina.`,"bark.snare4":`Stretto come un nodo della domenica.`,"bark.snare5":`Torna alla luce, tu.`,"bark.snare6":`Il filo tiene.`,"bark.hollowDown":`Tiene! Prendi la stella, Mira!`,"bark.knotmotherDown":`Ha mollato la presa! Porta a casa l'ultima stella.`,"bark.wardenDown":`Il Guardiano è a terra! La stella è libera!`,"bark.star":`La stella! Ora a casa: tieni premuto Avvolgi.`,"bark.devour":`Si è mangiato tutto il filo! Torna al nodo per riallacciarti.`,"bark.steal":`Un ladruncolo ha la stella! Fagli un giro attorno!`,"hud.intro":`Trascina o WASD per camminare · tieni Avvolgi (Spazio) per tornare lungo il filo`,"hud.line":`Profondità {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Filo rimasto`,"hud.pause":`Pausa`,"hud.reel":`Avvolgi`,"hud.reelAria":`Torna indietro lungo il filo`,"hud.flash":`Lampo`,"hud.flashAria":`Il Lampo di Wick: stordisce le ombre vicine`,"goal.cut":`Il filo è stato tagliato! Riallacciati al capo sciolto per raccogliere`,"goal.carry":`Porta a casa la stella: tieni Avvolgi per tornare lungo il filo`,"goal.stolen":`Un ladruncolo ha preso la stella! Catturalo per riaverla`,"goal.rule":`Fai un giro attorno a un tenebrino e incrocia il filo per catturarlo`,"goal.warden":`Cattura il Guardiano: fagli un giro attorno ({hit}/{max})`,"goal.hollow":`Cattura il Vuoto: fagli un giro attorno ({hit}/{max})`,"goal.knotmother":`Cattura la Madre dei Nodi: falle un giro attorno ({hit}/{max})`,"goal.knots":{one:`{n} nodo accorcia il filo: ripassaci sopra per scioglierlo`,other:`{n} nodi accorciano il filo: ripassaci sopra per scioglierli`},"goal.find":`Trova la stella caduta`,"float.double":`Nodo doppio!`,"float.triple":`Nodo triplo!`,"float.multi":`Nodo ×{n}!`,"float.loopsToGo":{one:`Ancora {n} giro!`,other:`Ancora {n} giri!`},"float.knotsLeft":{one:`Resta {n} nodo!`,other:`Restano {n} nodi!`},"float.tied":`Legato!`,"float.untied":`Slegato!`,"float.eaten":`Mangiato fino al nodo!`,"float.stolen":`Rubata!`,"float.free":`La stella è libera!`,"float.knot":`Nodo!`,"float.undone":`Sciolto!`,"pause.leave":`Lascia la profondità`,"lost.title":`Perduta nel buio`,"lost.continue":`▶ Continua con 2 cuori (pubblicità)`,"lost.carrying":`Stavi portando a casa la stella!`,"lost.away":{one:`La stella era a {n} casella.`,other:`La stella era a {n} caselle.`},"lost.dark":`Il buio si chiude su di te.`,"results.elevenStars":`Undici stelle!`,"results.everyThread":`Ogni filo tiene!`,"results.home":`A casa con la stella!`,"results.pulled":`Oda ti ha tirata su`,"results.surface":`Di nuovo in superficie`,"results.starHome":`La stella è a casa`,"results.bringStar":`Porta a casa la stella`,"results.snared":`Catturati {n} / {quota} tenebrini`,"results.lostHearts":{one:`Perso {n} cuore`,other:`Persi {n} cuori`},"results.noHeartLost":`Nessun cuore perso`,"results.loseNoHeart":`Non perdere cuori`,"results.gain":`+{n} barlumi`,"results.gathered":`{n} raccolti`,"results.forDepth":`{n} per la profondità`,"results.forStars":`{n} per le nuove stelle`,"results.next":`Prossima: Profondità {n}`,"results.deepDive":`Immersione`,"results.again":`Riprova`,"cast.mira":`Mira`,"cast.oda":`Nonna Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`Il Guardiano`,"cast.hollow":`Il Vuoto`,"cast.knotmother":`La Madre dei Nodi`,"chapter.prologue":`L'altro capo`,"chapter.first-star":`Una stella a casa`,"chapter.wick":`Contorni`,"chapter.red-thread":`Il filo rosso`,"chapter.the-net":`La rete`,"chapter.warden":`Il Guardiano`,"chapter.voice":`Una voce senza bocca`,"chapter.eleventh":`L'undicesima stella`,"chapter.holds":`Ciò che tiene`,"chapter.the-heart":`Il Cuore`,"chapter.eleven-stars":`Undici stelle`,"chapter.below":`Sotto il Cuore`,"chapter.underloom":`Il Sottotelaio`,"chapter.burrows":`Sotto il pavimento`,"chapter.lampless":`La Via Senza Lampade`,"chapter.unspun":`La Scala Sfilata`,"chapter.loose-ends":`Capi sciolti`,"story.prologue_1":`Cammina, Mira. La seta stellare ricorda la via del ritorno. Io tengo l'altro capo.`,"story.first-star_1":`Una stella a casa. Guarda su: il cielo di Lanternmere ha di nuovo una luce.`,"story.first-star_2":`Ne restano nove laggiù. E la mamma.`,"story.first-star_3":`Un anno, Mira. Tua madre scese a rammendare il cielo e non si riallacciò più.`,"story.first-star_4":`Allora troverò il suo filo.`,"story.wick_1":`Una falena di luce pallida si posa sulla sciarpa di Mira. È uscita dall'ultimo nodo.`,"story.wick_2":`Oh! Ho di nuovo dei contorni. Ero un tenebrino. E prima ancora... la falena di un lampionaio?`,"story.wick_3":`Il buio disfa tutto ciò che si perde quaggiù. Il tuo filo ci rilega insieme.`,"story.wick_4":`Cosa farai adesso?`,"story.wick_4_stay":`Resta con me, piccola luce.`,"story.wick_4_stay_1":`Sarò i tuoi occhi! Mi chiamo Wick. Credo.`,"story.wick_4_go":`Vola a casa. Sei libero.`,"story.wick_4_go_1":`Casa è dov'è la luce. Cioè tu. Sono Wick, e resto.`,"story.wick_5":`Adesso parlano anche le falene. Va bene. Continuate a camminare, tutte e due.`,"story.red-thread_1":`Tra le pietre c'è un filo, rosso come una sciarpa. Il capo è tagliato netto.`,"story.red-thread_2":`Nonna. È la seta della mamma.`,"story.red-thread_3":`Tagliato? La seta stellare non si spezza. Laggiù qualcosa ha imparato a tagliare.`,"story.red-thread_4":`Forbicini. Granchi con le mani a forbice. Puntano al filo, non a te.`,"story.red-thread_5":`Se ti tagliano, torna al capo sciolto e riallacciati. In fretta.`,"story.the-net_1":`Nonna, perché sono cadute le stelle?`,"story.the-net_2":`Il cielo di Lanternmere è una rete. L'ha tessuta la nostra famiglia. Ogni stella è un nodo.`,"story.the-net_3":`Quando un nodo scivola, la sua stella cade. Il mese scorso sono scivolati tutti insieme.`,"story.the-net_4":`Non scivolati. Tirati. Qualcosa laggiù in fondo li sta tirando giù.`,"story.the-net_5":`Allora dovrà vedersela con me.`,"story.warden_1":`Il Guardiano si sfalda in cento falene. Una resta, e parla.`,"story.warden_2":`La custodivamo. La tessitrice rossa. Ci chiese di non far entrare nessuno.`,"story.warden_3":`Mia madre? È viva?`,"story.warden_4":`Tiene chiuso il Cuore. Ha fame, ed è così tanto solo.`,"story.warden_5":`Scendi, piccola tessitrice. Non fargli sentire che piangi.`,"story.voice_1":`Il buio si fa vicino. Una voce senza bocca riempie la sala.`,"story.voice_2":`Piccola tessitrice. Riporti su le mie stelle. Perché?`,"story.voice_3":`Non sono tue. Illuminano un paese pieno di gente.`,"story.voice_4":`Per mille anni non ho illuminato nulla. Nessuno mi ha tessuto nel cielo.`,"story.voice_5":`Mira... non credo sia un mostro. Credo sia una stella.`,"story.voice_6":`Stammi vicina. Con te non ho paura.`,"story.voice_7":`Ho paura. Ma resto lo stesso.`,"story.eleventh_1":`Mira. Devo dirti una cosa prima che tu lo incontri.`,"story.eleventh_2":`Da giovane, tessemmo la rete. Le stelle erano undici, e c'era posto per dieci.`,"story.eleventh_3":`L'undicesima cadde. Dicemmo che si era spenta. Nessuno scese a guardare.`,"story.eleventh_4":`L'avete lasciata sola nel buio.`,"story.eleventh_5":`Avevamo paura. Tua madre no. È scesa a tesserle un posto.`,"story.holds_1":`Gli erranti attraversano i muri, ma persino loro si fermano al tuo filo.`,"story.holds_2":`Tutto si ferma al filo. Forse è ciò che serve al Vuoto. Qualcosa che tiene.`,"story.holds_3":`Niente mi tiene. Ci ho provato. Tutto ciò che tocco si disfa.`,"story.holds_4":`Non la seta stellare.`,"story.the-heart_1":`L'ultima scala. Il filo rosso corre ovunque, annodato attorno a ogni colonna.`,"story.the-heart_2":`Mira? No. No, torna su. Ti disferà.`,"story.the-heart_3":`Mamma! Ho il rocchetto della nonna. Sono venuta a finire la tua tessitura.`,"story.the-heart_4":`Il Vuoto è dentro i miei nodi. Tre giri, Mira. Legalo tre volte e terrà.`,"story.the-heart_5":`Io tengo l'altro capo, bambina. Non mollo.`,"story.eleven-stars_1":`Il giro si stringe, sempre di più, e il nodo di buio diventa un nodo di luce.`,"story.eleven-stars_2":`Oh. Tiene. Io sono... tenuto.`,"story.eleven-stars_3":`Un nuovo nodo nel cielo, Mira. L'undicesima stella. Le serve un nome.`,"story.eleven-stars_4":`Il suo nome è...`,"story.eleven-stars_4_oda":`Oda, che non ha mollato.`,"story.eleven-stars_4_oda_1":`Io? Oh, sciocchina. E va bene. Brilla bene.`,"story.eleven-stars_4_wick":`Wick, che è rimasto.`,"story.eleven-stars_4_wick_1":`Una stella che si chiama come una falena! Verranno a trovarla tutte le falene del mondo.`,"story.eleven-stars_4_lena":`Lena, che è scesa per prima.`,"story.eleven-stars_4_lena_1":`Così saprò sempre qual è la mia.`,"story.eleven-stars_5":`Nonna Oda le riavvolge fino a casa. Sopra Lanternmere, undici stelle.`,"story.below_1":`Mira, il filo tira ancora. Verso il basso.`,"story.below_2":`Più giù c'è un telaio più antico. Qualcuno ci fa dei nodi.`,"story.below_3":`Allora li scioglierò.`,"story.underloom_1":`Vecchi fili pendono dal soffitto, ognuno chiuso da un nodo.`,"story.underloom_2":`Annodatori. Annodano il filo così non arriva da nessuna parte.`,"story.underloom_3":`Un nodo ti ruba lunghezza, bambina. Ripassaci sopra e si scioglie.`,"story.underloom_4":`Chi gli ha insegnato a fare nodi?`,"story.underloom_5":`Qualcuno che aveva paura di lasciar andare.`,"story.burrows_1":`Il pavimento si solleva. Qualcosa nuota sotto le pietre come un pesce sotto il ghiaccio.`,"story.burrows_2":`Scavatori! Il filo non può recintare ciò che gli passa sotto.`,"story.burrows_3":`Allora aspettiamo che salgano. E tu li abbagli col Lampo, Wick.`,"story.burrows_4":`Fare lampi è l'unica cosa in cui sono bravissimo!`,"story.lampless_1":`Quaggiù non è mai stata accesa una lampada. Nemmeno una.`,"story.lampless_2":`I vecchi tessitori tenevano quaggiù ciò che non sopportavano di perdere. Legato, perché restasse.`,"story.lampless_3":`Mia nonna lavorava a un telaio così. Dicevano che ci avesse legato la propria ombra.`,"story.lampless_4":`La Madre dei Nodi è... di famiglia?`,"story.lampless_5":`Ognuno quaggiù è di qualcuno, Mira.`,"story.unspun_1":`Piccola tessitrice. Vieni a prendere ciò che custodisco.`,"story.unspun_2":`Tieni tutto legato perché non se ne vada. Persino le stelle.`,"story.unspun_3":`Ciò che lascio andare, il buio lo disfa. Ho perso troppo.`,"story.unspun_4":`Non è arrabbiata. Ha paura, come il Vuoto.`,"story.unspun_5":`Cosa le dico?`,"story.unspun_5_gentle":`Un filo può tenere senza nodi.`,"story.unspun_5_gentle_1":`Un filo così non esiste.`,"story.unspun_5_firm":`Allora ti slegherò io.`,"story.unspun_5_firm_1":`Provaci, piccola tessitrice.`,"story.loose-ends_1":`Quattro giri, e i nodi della Madre dei Nodi si sciolgono uno a uno.`,"story.loose-ends_2":`Se ne... vanno. E niente si disfa.`,"story.loose-ends_3":`Un filo che qualcuno tiene non ha bisogno di nodi. La nonna tiene il mio.`,"story.loose-ends_4":`Allora tieni il mio, piccola tessitrice. Solo per un po'.`,"story.loose-ends_5":`Hai fatto bene a essere decisa. Ho legato troppo stretto, troppo a lungo.`,"story.loose-ends_6":`Portala su, Mira. Nel cielo c'è posto per un'altra luce.`,"story.loose-ends_7":`Sopra Lanternmere i vecchi fili catturano la luce delle stelle. Ognuno di loro tiene.`},pl:{"title.descend":`Zejdź · Głębia {n}`,"title.deepDive":`Otchłań`,"title.named":`Gwiazda {name} świeci nad Lanternmere.`,"title.home":{one:`Gwiazdy w domu: {n} z {total}.`,few:`Gwiazdy w domu: {n} z {total}.`,many:`Gwiazdy w domu: {n} z {total}.`,other:`Gwiazdy w domu: {n} z {total}.`},"title.tagline":`Gwiazdy spadły do labiryntu. Sprowadź je do domu.`,"title.glimmer":`Blask: {n}`,"title.loom":`Krosno`,"title.depths":`Głębie`,"title.soundOn":`Dźwięk: wł.`,"title.soundOff":`Dźwięk: wył.`,"title.musicOn":`Muzyka: wł.`,"title.musicOff":`Muzyka: wył.`,"depths.title":`Głębie`,"depths.note":`★ wróć z gwiazdą · ★ złap mroczki · ★ nie trać serca`,"depths.locked":`Głębia {n}`,"depths.unlock":`Przejdź głębię {n}`,"depths.next":`Dalej`,"depths.boss":`Boss`,"depths.bossNext":`Boss · dalej`,"depths.deep":`Otchłań`,"depths.best":`Rekord: otchłań {n}`,"depth.d1":`Schody do piwnicy`,"depth.d2":`Mszyste galerie`,"depth.d3":`Czerwony supeł`,"depth.d4":`Nożycowe sale`,"depth.d5":`Strażnik`,"depth.d6":`Płacząca Woda`,"depth.d7":`Dryf`,"depth.d8":`Krosno z kości`,"depth.d9":`Ciemne Morze`,"depth.d10":`Serce Pustki`,"depth.d11":`Podkrosno`,"depth.d12":`Nory`,"depth.d13":`Droga bez lamp`,"depth.d14":`Nieuprzędzone schody`,"depth.d15":`Matka Supłów`,"depth.deep":`Otchłań {n}`,"shop.title":`Krosno`,"shop.currency":`blask`,"shop.spool.name":`Dłuższa nić`,"shop.spool.effect":`Więcej gwiezdnego jedwabiu na szpuli`,"shop.reel.name":`Naoliwiona szpula`,"shop.reel.effect":`Szybciej wracasz po nici; zbierasz iskry z dalszej odległości`,"shop.wire.name":`Drutojedwab`,"shop.wire.effect":`Cienie, które tną, jedzą lub supłają nić, działają wolniej`,"shop.lamp.name":`Jaśniejsza lampa`,"shop.lamp.effect":`Widzisz dalej; jej blask spowalnia każde ugryzienie`,"shop.bell.name":`Gwiezdny dzwonek`,"shop.bell.effect":`Skradziona gwiazda dzwoni i wymyka się rabusiowi z łap`,"shop.redsilk.name":`Lena: czerwona nić`,"shop.redsilk.effect":`Znów więcej nici, uprzędzonej przez mamę`,"shop.cloak.name":`Płaszcz ćmy`,"shop.cloak.effect":`Dłuższa ochrona po ugryzieniu`,"shop.flash.name":`Blask Wicka`,"shop.flash.effect":`Wick szybciej może znów błysnąć`,"shop.burn.name":`Jedwabny żar`,"shop.burn.effect":`Ciemny jedwab szybciej znika w twoim świetle`,"shop.knot.name":`Supeł tkacza`,"shop.knot.effect":`Więcej blasku za każde złapanie`,"shop.thorn.name":`Ciernisty jedwab`,"shop.thorn.effect":`Cienie, które trącą nić, zostają ogłuszone`,"shop.boots.name":`Miękkie buty`,"shop.boots.effect":`Szybszy chód`,"shop.hearts.name":`Amulet babci`,"shop.hearts.effect":`Jedno serce więcej`,"fmt.tiles":{one:`{n} pole`,few:`{n} pola`,many:`{n} pól`,other:`{n} pola`},"fmt.moreTiles":{one:`+{n} pole`,few:`+{n} pola`,many:`+{n} pól`,other:`+{n} pola`},"fmt.speed":`prędkość {n}`,"fmt.chew":`{n}% czasu gryzienia`,"fmt.freeIn":`wolna za {n} s`,"fmt.never":`nigdy`,"fmt.seconds":`{n} s`,"fmt.every":`co {n} s`,"fmt.fade":`znikanie ×{n}`,"fmt.percent":`{n}%`,"fmt.none":`brak`,"fmt.hearts":{one:`{n} serce`,few:`{n} serca`,many:`{n} serc`,other:`{n} serca`},"tip.snare":`Obejdź mroczka pętlą i przetnij własną nić: pętla go złapie!`,"tip.bite":`Gdy ich oczy robią się czerwone, gryzą. Ruszaj się, a chybią!`,"tip.fence":`Widzisz? Mroczki nie przejdą przez gwiezdny jedwab. Zagródź je!`,"tip.taut":`To cała nić! Wróć, by ją zwinąć, albo przywiąż ją do kołka.`,"tip.peg":`Kołek! Przywiązuje nić: stąd masz nowy kawałek. Przy nim naciśnij znów „Zwiń”, by odwiązać.`,"tip.star":`Gwiazda! Przytrzymaj „Zwiń” (Spacja), a ściągnę cię do domu.`,"tip.cut":`Przecięta! Bez nici nic nie podniesiesz. Wróć do luźnego końca!`,"tip.boss":`Za duży, by złapać go naraz. Obchodź go pętlą raz po raz!`,"tip.drifter":`Snuje przechodzą przez ściany, ale nigdy przez nić.`,"tip.gnawer":`Gryzak! Jeśli skończy gryźć, zje całą nić aż do supła.`,"tip.filcher":`Rabusie kradną gwiazdy. Jeśli któryś ją weźmie, złap go, by ją odzyskać!`,"tip.tangler":`Plątacze przędą ciemny jedwab. Nie przejdziesz przez niego, póki nie zniknie.`,"tip.cutterGlow":`Widzisz, jak gwiazda świeci jaśniej? Coś gryzie twoją nić!`,"tip.knotter":`Supłacz! Każdy jego supeł skraca twoją nić. Przejdź z powrotem przez supeł, by go rozwiązać.`,"tip.burrower":`Kopacze ryją pod nicią. Gdy podłoga drży, odsuń się i złap je w pętlę, gdy wyjdą!`,"tip.flare":`Wick może błysnąć! Naciśnij F (lub „Błysk”), by ogłuszyć cienie wokół ciebie.`,"bark.snare1":`Utkany na nowo!`,"bark.snare2":`Kolejny przypomina sobie swoje kształty.`,"bark.snare3":`To moja dziewczynka.`,"bark.snare4":`Mocno jak niedzielny supeł.`,"bark.snare5":`Wracaj do światła.`,"bark.snare6":`Nić trzyma.`,"bark.hollowDown":`Trzyma! Bierz gwiazdę, Mira!`,"bark.knotmotherDown":`Puściła! Zanieś ostatnią gwiazdę do domu.`,"bark.wardenDown":`Strażnik pokonany! Gwiazda jest wolna!`,"bark.star":`Gwiazda! Teraz do domu: trzymaj „Zwiń”.`,"bark.devour":`Zjadł całą nić! Wróć do supła, by się przywiązać.`,"bark.steal":`Rabuś ma gwiazdę! Złap go w pętlę!`,"hud.intro":`Przeciągnij lub WASD, by iść · trzymaj „Zwiń” (Spacja), by wrócić po nici`,"hud.line":`Głębia {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Zostało nici`,"hud.pause":`Pauza`,"hud.reel":`Zwiń`,"hud.reelAria":`Zwiń nić i wróć po niej`,"hud.flash":`Błysk`,"hud.flashAria":`Błysk Wicka: ogłusz pobliskie cienie`,"goal.cut":`Nić przecięta! Przywiąż się na luźnym końcu, by znów podnosić rzeczy`,"goal.carry":`Zanieś gwiazdę do domu: trzymaj „Zwiń”, by wrócić po nici`,"goal.stolen":`Rabuś zabrał gwiazdę! Złap go, by ją odzyskać`,"goal.rule":`Obejdź mroczka pętlą i przetnij swoją nić, by go złapać`,"goal.warden":`Złap Strażnika: obejdź go pętlą ({hit}/{max})`,"goal.hollow":`Złap Pustkę: obejdź ją pętlą ({hit}/{max})`,"goal.knotmother":`Złap Matkę Supłów: obejdź ją pętlą ({hit}/{max})`,"goal.knots":{one:`{n} supeł skraca ci nić: przejdź po nim, by go rozwiązać`,few:`{n} supły skracają ci nić: przejdź po nich, by je rozwiązać`,many:`{n} supłów skraca ci nić: przejdź po nich, by je rozwiązać`,other:`{n} supła skraca ci nić: przejdź po nich, by je rozwiązać`},"goal.find":`Znajdź spadłą gwiazdę`,"float.double":`Podwójny supeł!`,"float.triple":`Potrójny supeł!`,"float.multi":`Supeł ×{n}!`,"float.loopsToGo":{one:`Jeszcze {n} pętla!`,few:`Jeszcze {n} pętle!`,many:`Jeszcze {n} pętli!`,other:`Jeszcze {n} pętli!`},"float.knotsLeft":{one:`Został {n} supeł!`,few:`Zostały {n} supły!`,many:`Zostało {n} supłów!`,other:`Zostało {n} supła!`},"float.tied":`Przywiązane!`,"float.untied":`Odwiązane!`,"float.eaten":`Zjedzona do supła!`,"float.stolen":`Skradziona!`,"float.free":`Gwiazda jest wolna!`,"float.knot":`Supeł!`,"float.undone":`Rozwiązany!`,"pause.leave":`Opuść głębię`,"lost.title":`Zgubiona w ciemności`,"lost.continue":`▶ Graj dalej z 2 sercami (reklama)`,"lost.carrying":`Gwiazda była już w drodze do domu!`,"lost.away":{one:`Gwiazda była {n} pole dalej.`,few:`Gwiazda była {n} pola dalej.`,many:`Gwiazda była {n} pól dalej.`,other:`Gwiazda była {n} pola dalej.`},"lost.dark":`Ciemność gęstnieje.`,"results.elevenStars":`Jedenaście gwiazd!`,"results.everyThread":`Każda nić trzyma!`,"results.home":`W domu z gwiazdą!`,"results.pulled":`Oda wyciągnęła cię na górę`,"results.surface":`Znów na powierzchni`,"results.starHome":`Gwiazda jest w domu`,"results.bringStar":`Zanieś gwiazdę do domu`,"results.snared":`Złapane mroczki: {n} / {quota}`,"results.lostHearts":{one:`{n} utracone serce`,few:`{n} utracone serca`,many:`{n} utraconych serc`,other:`{n} utraconego serca`},"results.noHeartLost":`Żadne serce nie stracone`,"results.loseNoHeart":`Nie trać serca`,"results.gain":`+{n} blasku`,"results.gathered":`{n} zebrane`,"results.forDepth":`{n} za głębię`,"results.forStars":`{n} za nowe gwiazdy`,"results.next":`Dalej: Głębia {n}`,"results.deepDive":`Otchłań`,"results.again":`Spróbuj znowu`,"cast.mira":`Mira`,"cast.oda":`Babcia Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`Strażnik`,"cast.hollow":`Pustka`,"cast.knotmother":`Matka Supłów`,"chapter.prologue":`Drugi koniec`,"chapter.first-star":`Jedna gwiazda w domu`,"chapter.wick":`Kształty`,"chapter.red-thread":`Czerwona nić`,"chapter.the-net":`Sieć`,"chapter.warden":`Strażnik`,"chapter.voice":`Głos bez ust`,"chapter.eleventh":`Jedenasta gwiazda`,"chapter.holds":`Co trzyma`,"chapter.the-heart":`Serce`,"chapter.eleven-stars":`Jedenaście gwiazd`,"chapter.below":`Pod Sercem`,"chapter.underloom":`Podkrosno`,"chapter.burrows":`Pod podłogą`,"chapter.lampless":`Droga bez lamp`,"chapter.unspun":`Nieuprzędzone schody`,"chapter.loose-ends":`Luźne końce`,"story.prologue_1":`Idź, Mira. Gwiezdny jedwab pamięta drogę powrotną. Trzymam drugi koniec.`,"story.first-star_1":`Jedna gwiazda w domu. Spójrz w górę: niebo nad Lanternmere znów ma światło.`,"story.first-star_2":`Dziewięć jeszcze tam na dole. I mama.`,"story.first-star_3":`Rok, Mira. Twoja mama zeszła naprawić niebo i nigdy się nie przywiązała z powrotem.`,"story.first-star_4":`To znajdę jej nić.`,"story.wick_1":`Mira ma na szaliku ćmę z bladego światła. Wyfrunęła z ostatniego supła, który zawiązała.`,"story.wick_2":`Och! Znów mam kształt. Byłem mroczkiem. A wcześniej... ćmą latarnika?`,"story.wick_3":`Ciemność rozplata wszystko, co się tu zgubi. Twoja nić znów nas splata.`,"story.wick_4":`Co teraz zrobisz?`,"story.wick_4_stay":`Zostań ze mną, małe światełko.`,"story.wick_4_stay_1":`Będę twoimi oczami! Nazywam się Wick. Chyba.`,"story.wick_4_go":`Leć do domu. Jesteś wolny.`,"story.wick_4_go_1":`Dom jest tam, gdzie światło. Czyli przy tobie. Jestem Wick i zostaję.`,"story.wick_5":`Ćmy teraz mówią. Niech będzie. Idźcie dalej, oboje.`,"story.red-thread_1":`Między kamieniami leży nić, czerwona jak szalik. Jej koniec jest równo ucięty.`,"story.red-thread_2":`Babciu. To jedwab mamy.`,"story.red-thread_3":`Ucięty? Gwiezdny jedwab się nie rwie. Coś tam na dole nauczyło się ciąć.`,"story.red-thread_4":`Nożycaki. Kraby z nożycami zamiast rąk. Polują na nić, nie na ciebie.`,"story.red-thread_5":`Jeśli cię odetną, wróć do luźnego końca i przywiąż się znowu. Szybko.`,"story.the-net_1":`Babciu, czemu gwiazdy spadły?`,"story.the-net_2":`Niebo nad Lanternmere to sieć. Utkała ją nasza rodzina. Każda gwiazda to supeł.`,"story.the-net_3":`Gdy supeł się zsunie, jego gwiazda spada. W zeszłym miesiącu zsunęły się wszystkie naraz.`,"story.the-net_4":`Nie zsunęły się. Ktoś je ściągnął. Coś na samym dnie je wciąga.`,"story.the-net_5":`To niech spróbuje się ze mną przeciągać.`,"story.warden_1":`Strażnik rozpada się na sto ciem. Jedna z nich zostaje i mówi.`,"story.warden_2":`Strzegliśmy jej. Czerwonej tkaczki. Prosiła, byśmy nikogo nie wpuszczali.`,"story.warden_3":`Mojej mamy? Ona żyje?`,"story.warden_4":`Trzyma Serce zamknięte. Jest głodne i tak bardzo samotne.`,"story.warden_5":`Zejdź niżej, mała tkaczko. Nie pozwól, by usłyszało twój płacz.`,"story.voice_1":`Ciemność się przybliża. Głos bez ust wypełnia komnatę.`,"story.voice_2":`Mała tkaczko. Wynosisz moje gwiazdy na górę. Czemu?`,"story.voice_3":`One nie są twoje. Oświetlają miasto pełne ludzi.`,"story.voice_4":`Przez tysiąc lat niczego nie oświetliłam. Nikt nie wplótł mnie w niebo.`,"story.voice_5":`Mira... Chyba to nie potwór. Chyba to gwiazda.`,"story.voice_6":`Trzymaj się blisko. Gdy jesteś obok, nie boję się.`,"story.voice_7":`Boję się. Ale i tak zostaję.`,"story.eleventh_1":`Mira. Muszę ci coś powiedzieć, zanim to spotkasz.`,"story.eleventh_2":`Gdy byłam młoda, tkaliśmy sieć. Gwiazd było jedenaście, a miejsca na dziesięć.`,"story.eleventh_3":`Jedenasta spadła. Mówiliśmy, że się wypaliła. Nikt nie zszedł sprawdzić.`,"story.eleventh_4":`Zostawiliście ją samą w ciemności.`,"story.eleventh_5":`Baliśmy się. Twoja mama nie. Zeszła, by utkać jej miejsce.`,"story.holds_1":`Snuje chodzą przez ściany, ale nawet one stają przy twojej nici.`,"story.holds_2":`Wszystko staje przy nici. Może tego potrzebuje Pustka. Czegoś, co trzyma.`,"story.holds_3":`Nic mnie nie utrzyma. Próbowałam. Wszystko, czego dotknę, się rozplata.`,"story.holds_4":`Gwiezdny jedwab tak.`,"story.the-heart_1":`Ostatnie schody. Czerwona nić biegnie tu wszędzie, zawiązana na każdym filarze.`,"story.the-heart_2":`Mira? Nie. Nie, wracaj na górę. To cię rozplecie.`,"story.the-heart_3":`Mamo! Mam szpulę babci. Przyszłam dokończyć twoje tkanie.`,"story.the-heart_4":`Pustka jest w moich supłach. Trzy pętle, Mira. Zwiąż ją trzy razy, a utrzyma się.`,"story.the-heart_5":`Trzymam drugi koniec, dziecko. Nie puszczę.`,"story.eleven-stars_1":`Pętla zaciska się coraz mocniej, a supeł ciemności staje się supłem światła.`,"story.eleven-stars_2":`Och. Trzyma. Coś mnie... trzyma.`,"story.eleven-stars_3":`Nowy supeł na niebie, Mira. Jedenasta gwiazda. Potrzebuje imienia.`,"story.eleven-stars_4":`Nazywa się...`,"story.eleven-stars_4_oda":`Oda, która nie puściła.`,"story.eleven-stars_4_oda_1":`Ja? Och, ty głuptasie. Niech ci będzie. Świeć ładnie.`,"story.eleven-stars_4_wick":`Wick, który został.`,"story.eleven-stars_4_wick_1":`Gwiazda na cześć ćmy! Odwiedzą ją wszystkie ćmy świata.`,"story.eleven-stars_4_lena":`Lena, która poszła pierwsza.`,"story.eleven-stars_4_lena_1":`To zawsze będę wiedzieć, która jest moja.`,"story.eleven-stars_5":`Babcia Oda ściąga ich do domu. Nad Lanternmere świeci jedenaście gwiazd.`,"story.below_1":`Mira, nić wciąż ciągnie. W dół.`,"story.below_2":`Niżej leży starsze krosno. Ktoś tam wiąże supły.`,"story.below_3":`To je rozwiążę.`,"story.underloom_1":`Ze sklepienia zwisają tu stare nici, każda zawiązana na supeł.`,"story.underloom_2":`Supłacze. Supłają nić tak, że nigdzie nie sięga.`,"story.underloom_3":`Supeł kradnie ci długość, dziecko. Przejdź po nim z powrotem, a się rozwiąże.`,"story.underloom_4":`Kto ich nauczył supłać?`,"story.underloom_5":`Ktoś, kto bał się puścić.`,"story.burrows_1":`Podłoga faluje. Coś pływa pod kamieniami jak ryba pod lodem.`,"story.burrows_2":`Kopacze! Nić nie zagrodzi czegoś, co przechodzi pod nią.`,"story.burrows_3":`To czekamy, aż wyjdą. A ty ich oślepisz, Wick.`,"story.burrows_4":`Błyskanie to jedyne, w czym jestem naprawdę dobry!`,"story.lampless_1":`Tu na dole nigdy nie zapalono lampy. Ani jednej.`,"story.lampless_2":`Dawni tkacze trzymali tu to, czego nie mogli stracić. Przywiązane, żeby zostało.`,"story.lampless_3":`Moja babcia tkała na takim krośnie. Mówili, że przywiązała do niego własny cień.`,"story.lampless_4":`Matka Supłów to... rodzina?`,"story.lampless_5":`Każdy tu na dole jest czyjś, Mira.`,"story.unspun_1":`Mała tkaczko. Przychodzisz zabrać to, co trzymam.`,"story.unspun_2":`Trzymasz wszystko związane, żeby nie odeszło. Nawet gwiazdy.`,"story.unspun_3":`Co puszczę, ciemność rozplata. Za dużo już straciłam.`,"story.unspun_4":`Ona nie jest zła. Boi się, tak jak Pustka.`,"story.unspun_5":`Co mam jej powiedzieć?`,"story.unspun_5_gentle":`Nić może trzymać bez supła.`,"story.unspun_5_gentle_1":`Nie ma takiej nici.`,"story.unspun_5_firm":`To sama cię rozwiążę.`,"story.unspun_5_firm_1":`Spróbuj, mała tkaczko.`,"story.loose-ends_1":`Cztery pętle i supły Matki Supłów puszczają jeden po drugim.`,"story.loose-ends_2":`One... odchodzą. I nic się nie rozplata.`,"story.loose-ends_3":`Nić, którą ktoś trzyma, nie potrzebuje supła. Moją trzyma babcia.`,"story.loose-ends_4":`To potrzymaj moją, mała tkaczko. Choć przez chwilę.`,"story.loose-ends_5":`Dobrze, że byłaś stanowcza. Wiązałam za mocno i za długo.`,"story.loose-ends_6":`Wyprowadź ją na górę, Mira. Na niebie jest miejsce na jeszcze jedno światło.`,"story.loose-ends_7":`Nad Lanternmere stare nici łapią blask gwiazd. Każda z nich trzyma.`},id:{"title.descend":`Turun · Kedalaman {n}`,"title.deepDive":`Selam Dalam`,"title.named":`Bintang {name} bersinar di atas Lanternmere.`,"title.home":`{n} dari {total} bintang sudah pulang.`,"title.tagline":`Bintang-bintang jatuh ke labirin. Bawa mereka pulang.`,"title.glimmer":`{n} kerlip`,"title.loom":`Alat Tenun`,"title.depths":`Kedalaman`,"title.soundOn":`Suara aktif`,"title.soundOff":`Suara mati`,"title.musicOn":`Musik aktif`,"title.musicOff":`Musik mati`,"depths.title":`Kedalaman`,"depths.note":`★ pulang bawa bintang · ★ jerat para kelam · ★ tak kehilangan hati`,"depths.locked":`Kedalaman {n}`,"depths.unlock":`Tuntaskan kedalaman {n}`,"depths.next":`Lanjut`,"depths.boss":`Bos`,"depths.bossNext":`Bos · berikutnya`,"depths.deep":`Selam Dalam`,"depths.best":`Terbaik: selam {n}`,"depth.d1":`Tangga Ruang Bawah`,"depth.d2":`Galeri Lumut`,"depth.d3":`Simpul Merah`,"depth.d4":`Aula Gunting`,"depth.d5":`Sang Penjaga`,"depth.d6":`Air Tangis`,"depth.d7":`Hanyutan`,"depth.d8":`Alat Tenun Tulang`,"depth.d9":`Laut Tanpa Cahaya`,"depth.d10":`Jantung Hampa`,"depth.d11":`Alat Tenun Bawah`,"depth.d12":`Aula Liang`,"depth.d13":`Jalan Tanpa Lampu`,"depth.d14":`Tangga Tak Terpintal`,"depth.d15":`Ibu Simpul`,"depth.deep":`Selam Dalam {n}`,"shop.title":`Alat Tenun`,"shop.currency":`kerlip`,"shop.spool.name":`Benang lebih panjang`,"shop.spool.effect":`Lebih banyak sutra bintang di kumparan`,"shop.reel.name":`Gulungan licin`,"shop.reel.effect":`Meluncur pulang lebih cepat; ambil percik dari lebih jauh`,"shop.wire.name":`Sutra kawat`,"shop.wire.effect":`Bayangan yang embali ke ujung yang lepas!`,"tip.boss":`Terlalu besar untuk ditangkap sekaligus. Lingkari terus berulang kali!`,"tip.drifter":`Pelayang menembus dinding, tapi tak pernah menembus benang.`,"tip.gnawer":`Penggerogot! Kalau selesai menggerogoti, ia memakan seluruh benang sampai ke simpul.`,"tip.filcher":`Pencopet mencuri bintang. Kalau bintangnya diambil, jerat pencopetnya untuk merebutnya!`,"tip.tangler":`Pembelit memintal sutra gelap. Kau tak bisa melintasinya sampai sutra itu memudar.`,"tip.cutterGlow":`Lihat bintang yang makin terang itu? Ada yang menggerogoti benangmu!`,"tip.knotter":`Penyimpul! Tiap simpul yang diikatnya memendekkan benangmu. Lewati lagi simpulnya untuk membukanya.`,"tip.burrower":`Penggali menggali di bawah benang. Saat lantai bergolak, menjauhlah, lalu lingkari mereka saat muncul!`,"tip.flare":`Wick bisa Kilat sekarang! Tekan F (atau Kilat) untuk melumpuhkan semua bayangan di dekatmu.`,"bark.snare1":`Teranyam lagi!`,"bark.snare2":`Satu lagi ingat bentuknya.`,"bark.snare3":`Itu baru cucuku.`,"bark.snare4":`Erat seperti simpul hari Minggu.`,"bark.snare5":`Kembalilah ke cahaya.`,"bark.snare6":`Benangnya bertahan.`,"bark.hollowDown":`Bertahan! Ambil bintangnya, Mira!`,"bark.knotmotherDown":`Ia melepaskannya! Bawa bintang terakhir pulang.`,"bark.wardenDown":`Sang Penjaga tumbang! Bintangnya bebas!`,"bark.star":`Bintangnya! Sekarang pulang: tahan Gulung.`,"bark.devour":`Seluruh benang dimakannya! Kembali ke simpul untuk mengikat lagi.`,"bark.steal":`Pencopet membawa bintangnya! Lingkari dia!`,"hud.intro":`Seret atau WASD untuk berjalan · tahan Gulung (Spasi) untuk meluncur kembali di benang`,"hud.line":`Kedalaman {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Sisa benang`,"hud.pause":`Jeda`,"hud.reel":`Gulung`,"hud.reelAria":`Gulung kembali menyusuri benang`,"hud.flash":`Kilat`,"hud.flashAria":`Kilat Wick: lumpuhkan bayangan di dekatmu`,"goal.cut":`Benangmu putus! Ikat lagi di ujung yang lepas untuk mengambil barang`,"goal.car da":`Nenek Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`Sang Penjaga`,"cast.hollow":`Sang Hampa`,"cast.knotmother":`Ibu Simpul`,"chapter.prologue":`Ujung yang Lain`,"chapter.first-star":`Satu Bintang Pulang`,"chapter.wick":`Bentuk`,"chapter.red-thread":`Benang Merah`,"chapter.the-net":`Jaring`,"chapter.warden":`Sang Penjaga`,"chapter.voice":`Suara Tanpa Mulut`,"chapter.eleventh":`Bintang Kesebelas`,"chapter.holds":`Yang Bertahan`,"chapter.the-heart":`Sang Jantung`,"chapter.eleven-stars":`Sebelas Bintang`,"chapter.below":`Di Bawah Jantung`,"chapter.underloom":`Alat Tenun Bawah`,"chapter.burrows":`Di Bawah Lantai`,"chapter.lampless":`Jalan Tanpa Lampu`,"chapter.unspun":`Tangga Tak Terpintal`,"chapter.loose-ends":`Ujung yang Lepas`,"story.prologue_1":`Jalanlah, Mira. Sutra bintang ingat jalan pulang. Nenek pegang ujung satunya.`,"story.first-star_1":`Satu bintang pulang. Lihat ke atas: langit Lanternmere bercahaya lagi.`,"story.first-star_2":`Masih sembilan lagi di bawah sana. Dan Ibu.`,"story.first-star_3":`Setahun, Mira. Ibumu turun untuk memperbaiki langit, lalu tak pernah tersambung lagi.`,"story.first-star_4":`Kalau begitu aku akan menemukan benangnya.`,"story.wick_1":`Seekor ngengat cahaya pucat hinggap di syal Mira. Ia keluar dari simpul terakhir yang diikatnya.`,"story.wick_2":`Oh! Aku punya bentuk lagi. Dulu aku kelam. Sebelum itu... ngengat penyulut lampu?`,"story.wick_3":`Kegelapan mengurai apa pun yang tersesat di sini. Benangmu menyatukan kami lagi.`,"story.wick_4":`Sekarang kau mau apa?`,"story.wick_4_stay":`Tinggallah bersamaku, cahaya kecil.`,"story.wick_4_stay_1":`Aku akan jadi matamu! Namaku Wick. Sepertinya.`,"story.wick_4_go":`Terbanglah pulang. Kau bebas.`,"story.wick_4_go_1":`Rumah itu tempat cahaya berada. Yaitu kamu. Aku Wick, dan aku tetap di sini.`,"story.wick_5":`Sekarang ngengat bisa bicara. Baiklah. Terus berjalan, kalian berdua.`,"story.red-thread_1":`Di antara bebatuan tergeletak benang, merah seperti syal. Ujungnya terpotong rapi.`,"story.red-thread_2":`Nek. Ini sutra Ibu.`,"story.red-thread_3":`Terpotong? Tidak, sutra bintang tak bisa putus. Ada sesuatu di bawah sana yang belajar memotong.`,"story.red-thread_4":`Pengunting. Makhluk mirip kepiting bertangan gunting. Mereka mengincar benang, bukan kamu.`,"story.red-thread_5":`Kalau benangmu diputus, kembali ke ujung yang lepas dan ikat lagi. Cepat.`,"story.the-net_1":`Nek, kenapa bintang-bintang jatuh?`,"story.the-net_2":`Langit Lanternmere itu jaring. Keluarga kita yang menenunnya. Tiap bintang adalah simpul.`,"story.the-net_3":`Kalau simpul mengendur, bintangnya jatuh. Bulan lalu semuanya mengendur bersamaan.`,"story.the-net_4":`Bukan mengendur. Ditarik. Ada sesuatu di dasar yang menarik mereka.`,"story.the-net_5":`Kalau begitu biar ia menarik melawanku.`,"story.warden_1":`Sang Penjaga terurai jadi seratus ngengat. Satu tetap tinggal dan bicara.`,"story.warden_2":`Kami menjaganya. Sang penenun merah. Ia meminta kami menghalangi siapa pun.`,"story.warden_3":`Ibuku? Ia masih hidup?`,"story.warden_4":`Ia menahan Jantung tetap tertutup. Jantung itu lapar, dan sangat kesepian.`,"story.warden_5":`Turunlah, penenun kecil. Jangan biarkan ia mendengarmu menangis.`,"story.voice_1":`Kegelapan mendekat. Suara tanpa mulut memenuhi ruangan.`,"story.voice_2":`Penenun kecil. Kau bawa bintang-bintangku naik lagi. Kenapa?`,"story.voice_3":`Itu bukan milikmu. Mereka menerangi kota yang penuh orang.`,"story.voice_4":`Seribu tahun aku tak menerangi apa pun. Tak ada yang menenunku ke langit.`,"story.voice_5":`Mira... kurasa itu bukan monster. Kurasa itu bintang.`,"story.voice_6":`Tetap dekat. Aku tak takut kalau ada kamu.`,"story.voice_7":`Aku takut. Tapi aku tetap tinggal.`,"story.eleventh_1":`Mira. Nenek harus memberitahumu sesuatu sebelum kau menemuinya.`,"story.eleventh_2":`Waktu Nenek muda, kami menenun jaring itu. Ada sebelas bintang, tapi tempat untuk sepuluh.`,"story.eleventh_3":`Yang kesebelas jatuh. Kami bilang ia sudah padam. Tak ada yang turun untuk melihat.`,"story.eleventh_4":`Kalian meninggalkannya sendirian dalam gelap.`,"story.eleventh_5":`Kami takut. Ibumu tidak. Ia turun untuk menenunkan tempat baginya.`,"story.holds_1":`Pelayang berjalan menembus dinding, tapi mereka pun berhenti di benangmu.`,"story.holds_2":`Semuanya berhenti di benang. Mungkin itu yang dibutuhkan Sang Hampa. Sesuatu yang menahan.`,"story.holds_3":`Tak ada yang bisa menahanku. Aku sudah mencoba. Semua yang kusentuh terurai.`,"story.holds_4":`Kecuali sutra bintang.`,"story.the-heart_1":`Tangga terakhir. Benang merah membentang di mana-mana, tersimpul di tiap pilar.`,"story.the-heart_2":`Mira? Jangan. Jangan, naiklah lagi. Ia akan mengurai dirimu.`,"story.the-heart_3":`Ibu! Aku bawa kumparan Nenek. Aku datang untuk menyelesaikan tenunan Ibu.`,"story.the-heart_4":`Sang Hampa ada di dalam simpulku. Tiga lingkaran, Mira. Ikat tiga kali dan ia akan tertahan.`,"story.the-heart_5":`Nenek pegang ujung satunya, Nak. Nenek takkan melepaskannya.`,"story.eleven-stars_1":`Lingkaran menarik erat, makin erat, dan simpul gelap menjadi simpul cahaya.`,"story.eleven-stars_2":`Oh. Ia bertahan. Aku... digenggam.`,"story.eleven-stars_3":`Simpul baru di langit, Mira. Bintang kesebelas. Ia butuh nama.`,"story.eleven-stars_4":`Namanya...`,"story.eleven-stars_4_oda":`Oda, yang terus memegang.`,"story.eleven-stars_4_oda_1":`Nenek? Aduh, dasar anak ini. Baiklah. Bersinarlah yang terang.`,"story.eleven-stars_4_wick":`Wick, yang tetap tinggal.`,"story.eleven-stars_4_wick_1":`Bintang dinamai seekor ngengat! Semua ngengat di dunia akan berkunjung.`,"story.eleven-stars_4_lena":`Lena, yang turun lebih dulu.`,"story.eleven-stars_4_lena_1":`Kalau begitu Ibu akan selalu tahu mana bintang Ibu.`,"story.eleven-stars_5":`Nenek Oda menggulung mereka pulang. Di atas Lanternmere, sebelas bintang.`,"story.below_1":`Mira, benangnya masih menarik. Ke bawah.`,"story.below_2":`Ada alat tenun yang lebih tua di bawah. Seseorang mengikat simpul di sana.`,"story.below_3":`Kalau begitu akan kubuka semuanya.`,"story.underloom_1":`Benang-benang tua tergantung dari langit-langit, semuanya tersimpul rapat.`,"story.underloom_2":`Penyimpul. Mereka menyimpul benang supaya tak bisa menjangkau ke mana pun.`,"story.underloom_3":`Simpul mencuri panjang benangmu, Nak. Lewati lagi, nanti simpulnya terbuka.`,"story.underloom_4":`Siapa yang mengajari mereka menyimpul?`,"story.underloom_5":`Seseorang yang takut melepaskan.`,"story.burrows_1":`Lantai bergolak. Sesuatu berenang di bawah batu seperti ikan di bawah es.`,"story.burrows_2":`Penggali! Benang tak bisa memagari yang lewat di bawahnya.`,"story.burrows_3":`Kalau begitu kita tunggu sampai mereka muncul. Lalu sambar dengan Kilat, Wick.`,"story.burrows_4":`Kilat itu keahlian terbaikku!`,"story.lampless_1":`Tak pernah ada lampu dinyalakan di sini. Tak satu pun.`,"story.lampless_2":`Para penenun dulu menyimpan di sini apa yang tak sanggup mereka lepas. Diikat, agar tetap tinggal.`,"story.lampless_3":`Nenekku dulu menenun di alat tenun seperti itu. Katanya ia mengikat bayangannya sendiri di sana.`,"story.lampless_4":`Ibu Simpul itu... keluarga?`,"story.lampless_5":`Semua yang di bawah sini milik seseorang, Mira.`,"story.unspun_1":`Penenun kecil. Kau datang untuk mengambil yang kusimpan.`,"story.unspun_2":`Kau mengikat semuanya supaya tak bisa pergi. Bahkan bintang-bintang.`,"story.unspun_3":`Apa pun yang kulepas, diurai kegelapan. Aku sudah kehilangan terlalu banyak.`,"story.unspun_4":`Ia tidak marah. Ia takut, seperti Sang Hampa dulu.`,"story.unspun_5":`Apa yang harus kukatakan?`,"story.unspun_5_gentle":`Benang bisa menahan tanpa simpul.`,"story.unspun_5_gentle_1":`Tak ada benang seperti itu.`,"story.unspun_5_firm":`Kalau begitu akan kubuka sendiri simpulmu.`,"story.unspun_5_firm_1":`Coba saja, penenun kecil.`,"story.loose-ends_1":`Empat lingkaran, dan simpul-simpul Ibu Simpul terlepas satu per satu.`,"story.loose-ends_2":`Mereka... lepas. Dan tak ada yang terurai.`,"story.loose-ends_3":`Benang yang dipegang seseorang tak butuh simpul. Nenek memegang benangku.`,"story.loose-ends_4":`Kalau begitu peganglah benangku, penenun kecil. Sebentar saja.`,"story.loose-ends_5":`Kau benar bersikap tegas. Aku mengikat terlalu kuat, terlalu lama.`,"story.loose-ends_6":`Bawa ia naik, Mira. Masih ada tempat di langit untuk satu cahaya lagi.`,"story.loose-ends_7":`Di atas Lanternmere, benang-benang tua menangkap cahaya bintang. Semuanya bertahan.`}},ka=!1;async function Aa(e,t){let n=NaN;k(Number.isFinite(n)?n:null),document.addEventListener(`contextmenu`,e=>e.preventDefault());let r=_e(t.portal);return r&&(await r.init(),r.loadingStart()),ja(e,t,t.kit,r,Oa)}async function ja(e,t,n,r,i){let a=new Ie({strings:i,languages:t.languages,saveKey:t.saveKey,minTouchPx:t.minTouchPx,locale:t.locale,ads:t.ads,portal:r,keepEventLog:ka,canvas:e,title:t.title});if(!Da)throw Error(`kit code: no entry module (${n.entry})`);let o=document.createElement(`div`);o.id=`ui`,document.body.append(o);try{await Da({host:a,canvas:e,ui:o,game:{id:t.id,title:t.title,locale:t.locale,audience:t.audience.id,channel:t.channel.id}})}catch(e){Ma(t.title,e,a)}return r==null||r.loadingStop(),a}function Ma(e,t,n){let r=(t instanceof Error?t.message||t.name:String(t)).trim()||`unknown error`,i=r.length>200?`${r.slice(0,199)}…`:r;console.warn(`[gp] ${e} can't run in this browser:`,t),n.gameplay(!1),Fe(n.t(`gp.cantRun`,{title:e,reason:i}),`cant-run`)}var Na=document.getElementById(`game`);if(!Na)throw Error(`No <canvas id="game">`);Aa(Na,r);</script>
