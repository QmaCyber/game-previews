ordem. Continue andando e eles erram!`,"tip.fence":`Viu? Os breus não atravessam a seda estelar. Cerque-os!`,"tip.taut":`Acabou o fio! Volte para enrolá-lo ou amarre-o num pino.`,"tip.peg":`Um pino! Ele prende o fio: daqui sai um trecho novo. Nele, aperte Puxar de novo para desamarrar.`,"tip.star":`A estrela! Segure Puxar (Espaço) e eu puxo você para casa.`,"tip.cut":`Cortado! Sem o fio você não pega nada. Volte até a ponta solta!`,"tip.boss":`Grande demais para laçar de uma vez. Faça um laço nele de novo e de novo!`,"tip.drifter":`Errantes atravessam paredes, mas nunca o fio.`,"tip.gnawer":`Um roedor! Se ele terminar de roer, come o fio inteiro até o nó.`,"tip.filcher":`Gatunos roubam estrelas. Se um pegar a sua, lace-o para recuperá-la!`,"tip.tangler":`Enredadores tecem seda escura. Você não a atravessa até ela sumir.`,"tip.cutterGlow":`Vê aquela estrela brilhando mais forte? Algo está roendo seu fio!`,"tip.knotter":`Um atador! Cada nó que ele dá encurta seu fio. Passe de volta sobre um nó para desfazê-lo.`,"tip.burrower":`Escavadores cavam por baixo do fio. Quando o chão tremer, afaste-se e lace-os quando subirem!`,"tip.flare":`Wick pode dar um Clarão! Aperte F (ou Clarão) para atordoar as sombras perto de você.`,"bark.snare1":`Retecido!`,"bark.snare2":`Mais um se lembra dos seus contornos.`,"bark.snare3":`Essa é a minha menina.`,"bark.snare4":`Firme como nó de domingo.`,"bark.snare5":`De volta à luz com você.`,"bark.snare6":`O fio segura.`,"bark.hollowDown":`Segurou! Pegue a estrela, Mira!`,"bark.knotmotherDown":`Ela soltou! Leve a última estrela para casa.`,"bark.wardenDown":`O Guardião caiu! A estrela está livre!`,"bark.star":`A estrela! Agora para casa: segure Puxar.`,"bark.devour":`Ele comeu o fio inteiro! Volte ao nó para reatar.`,"bark.steal":`Um gatuno pegou a estrela! Lace-o!`,"hud.intro":`Arraste ou WASD para andar · segure Puxar (Espaço) para voltar pelo fio`,"hud.line":`Profundeza {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Fio restante`,"hud.pause":`Pausar`,"hud.reel":`Puxar`,"hud.reelAria":`Voltar puxado pelo fio`,"hud.flash":`Clarão`,"hud.flashAria":`Clarão de Wick: atordoa as sombras por perto`,"goal.cut":`Seu fio foi cortado! Reate na ponta solta para pegar as coisas`,"goal.carry":`Leve a estrela para casa: segure Puxar para voltar pelo fio`,"goal.stolen":`Um gatuno levou a estrela! Lace-o para recuperá-la`,"goal.rule":`Faça um laço em volta de um breu e cruze seu fio para laçá-lo`,"goal.warden":`Lace o Guardião: faça um laço em volta dele ({hit}/{max})`,"goal.hollow":`Lace o Vazio: faça um laço em volta dele ({hit}/{max})`,"goal.knotmother":`Lace a Mãe dos Nós: faça um laço em volta dela ({hit}/{max})`,"goal.knots":{one:`{n} nó encurta seu fio: passe de volta sobre ele para desfazê-lo`,other:`{n} nós encurtam seu fio: passe de volta sobre eles para desfazê-los`},"goal.find":`Encontre a estrela caída`,"float.double":`Nó duplo!`,"float.triple":`Nó triplo!`,"float.multi":`Nó {n}×!`,"float.loopsToGo":{one:`Falta {n} laço!`,other:`Faltam {n} laços!`},"float.knotsLeft":{one:`Falta {n} nó!`,other:`Faltam {n} nós!`},"float.tied":`Amarrado!`,"float.untied":`Desamarrado!`,"float.eaten":`Roído até o nó!`,"float.stolen":`Roubada!`,"float.free":`A estrela está livre!`,"float.knot":`Nó!`,"float.undone":`Desfeito!`,"pause.leave":`Sair da profundeza`,"lost.title":`Perdida no escuro`,"lost.continue":`▶ Continuar com 2 corações (anúncio)`,"lost.carrying":`Você estava levando a estrela para casa!`,"lost.away":{one:`A estrela estava a {n} casa de distância.`,other:`A estrela estava a {n} casas de distância.`},"lost.dark":`O escuro se fecha.`,"results.elevenStars":`Onze estrelas!`,"results.everyThread":`Cada fio segura!`,"results.home":`Em casa com a estrela!`,"results.pulled":`Oda puxou você de volta`,"results.surface":`De volta à superfície`,"results.starHome":`A estrela está em casa`,"results.bringStar":`Leve a estrela para casa`,"results.snared":`{n} / {quota} breus laçados`,"results.lostHearts":{one:`Perdeu {n} coração`,other:`Perdeu {n} corações`},"results.noHeartLost":`Nenhum coração perdido`,"results.loseNoHeart":`Não perca nenhum coração`,"results.gain":`+{n} de brilho`,"results.gathered":`Coletado: {n}`,"results.forDepth":`{n} pela profundeza`,"results.forStars":`{n} por novas estrelas`,"results.next":`Próxima: Profundeza {n}`,"results.deepDive":`Mergulho Profundo`,"results.again":`Tentar de novo`,"cast.mira":`Mira`,"cast.oda":`Vovó Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`O Guardião`,"cast.hollow":`O Vazio`,"cast.knotmother":`A Mãe dos Nós`,"chapter.prologue":`A Outra Ponta`,"chapter.first-star":`Uma Estrela em Casa`,"chapter.wick":`Contornos`,"chapter.red-thread":`O Fio Vermelho`,"chapter.the-net":`A Rede`,"chapter.warden":`O Guardião`,"chapter.voice":`Uma Voz sem Boca`,"chapter.eleventh":`A Décima Primeira Estrela`,"chapter.holds":`O que Segura`,"chapter.the-heart":`O Coração`,"chapter.eleven-stars":`Onze Estrelas`,"chapter.below":`Abaixo do Coração`,"chapter.underloom":`O Tear de Baixo`,"chapter.burrows":`Sob o Chão`,"chapter.lampless":`O Caminho sem Lampião`,"chapter.unspun":`A Escada Desfiada`,"chapter.loose-ends":`Pontas Soltas`,"story.prologue_1":`Ande, Mira. A seda estelar lembra o caminho de volta. Eu seguro a outra ponta.`,"story.first-star_1":`Uma estrela em casa. Olhe para cima: o céu de Lanternmere tem luz de novo.`,"story.first-star_2":`Faltam mais nove lá embaixo. E a mamãe.`,"story.first-star_3":`Faz um ano, Mira. Sua mãe desceu para remendar o céu e nunca mais reatou o fio.`,"story.first-star_4":`Então eu vou achar o fio dela.`,"story.wick_1":`Uma mariposa de luz pálida pousa no cachecol de Mira. Saiu do último nó que ela deu.`,"story.wick_2":`Oh! Tenho contornos de novo. Eu era um breu. Antes disso... mariposa de um acendedor de lampiões?`,"story.wick_3":`O escuro desfia tudo o que se perde aqui embaixo. Seu fio nos junta de novo.`,"story.wick_4":`O que você vai fazer agora?`,"story.wick_4_stay":`Fique comigo, luzinha.`,"story.wick_4_stay_1":`Vou ser seus olhos! Meu nome é Wick. Acho.`,"story.wick_4_go":`Voe para casa. Você está livre.`,"story.wick_4_go_1":`Casa é onde está a luz. E a luz é você. Eu sou Wick, e vou ficar.`,"story.wick_5":`Agora mariposas falam. Tudo bem. Continuem andando, vocês dois.`,"story.red-thread_1":`Entre as pedras há um fio, vermelho como um cachecol. A ponta foi cortada rente.`,"story.red-thread_2":`Vovó. Essa é a seda da mamãe.`,"story.red-thread_3":`Cortado? A seda estelar não arrebenta. Algo lá embaixo aprendeu a cortar.`,"story.red-thread_4":`Tesourinhas. Tipo caranguejos com mãos de tesoura. Elas atacam o fio, não você.`,"story.red-thread_5":`Se cortarem seu fio, volte até a ponta solta e reate. Rápido.`,"story.the-net_1":`Vovó, por que as estrelas caíram?`,"story.the-net_2":`O céu de Lanternmere é uma rede. Nossa família a teceu. Cada estrela é um nó.`,"story.the-net_3":`Quando um nó escorrega, a estrela cai. Mês passado, todos escorregaram de uma vez.`,"story.the-net_4":`Não escorregaram. Foram puxados. Algo lá no fundo está puxando todos.`,"story.the-net_5":`Então que tente puxar contra mim.`,"story.warden_1":`O Guardião se desfaz em cem mariposas. Uma delas fica e fala.`,"story.warden_2":`Nós a guardávamos. A tecelã vermelha. Ela pediu que não deixássemos ninguém entrar.`,"story.warden_3":`Minha mãe? Ela está viva?`,"story.warden_4":`Ela mantém o Coração fechado. Ele tem fome, e é tão, tão solitário.`,"story.warden_5":`Desça, pequena tecelã. Não deixe que ele ouça você chorar.`,"story.voice_1":`O escuro se aproxima. Uma voz sem boca enche a câmara.`,"story.voice_2":`Pequena tecelã. Você leva minhas estrelas de volta para cima. Por quê?`,"story.voice_3":`Elas não são suas. Elas iluminam uma cidade cheia de gente.`,"story.voice_4":`Não iluminei nada por mil anos. Ninguém me teceu no céu.`,"story.voice_5":`Mira... acho que não é um monstro. Acho que é uma estrela.`,"story.voice_6":`Fique perto. Não tenho medo quando você está aqui.`,"story.voice_7":`Estou com medo. Mas vou ficar mesmo assim.`,"story.eleventh_1":`Mira. Tenho que contar uma coisa antes de você encontrá-la.`,"story.eleventh_2":`Quando eu era jovem, tecemos a rede. Eram onze estrelas, e espaço para dez.`,"story.eleventh_3":`A décima primeira caiu. Dissemos que tinha se apagado. Ninguém desceu para ver.`,"story.eleventh_4":`Vocês a deixaram sozinha no escuro.`,"story.eleventh_5":`Tínhamos medo. Sua mãe não. Ela desceu para tecer um lugar para ela.`,"story.holds_1":`Os errantes atravessam paredes, mas até eles param no seu fio.`,"story.holds_2":`Tudo para no fio. Talvez seja disso que o Vazio precisa. Algo que segure.`,"story.holds_3":`Nada me segura. Eu tentei. Tudo o que toco se desfia.`,"story.holds_4":`A seda estelar, não.`,"story.the-heart_1":`A última escada. Há fio vermelho por toda parte, amarrado em cada pilar.`,"story.the-heart_2":`Mira? Não. Não, volte lá para cima. Ele vai desfiar você.`,"story.the-heart_3":`Mamãe! Estou com o carretel da Vovó. Vim terminar a sua trama.`,"story.the-heart_4":`O Vazio está dentro dos meus nós. Três laços, Mira. Amarre-o três vezes e ele vai segurar.`,"story.the-heart_5":`Estou com a outra ponta, menina. Não vou soltar.`,"story.eleven-stars_1":`O laço aperta, e aperta mais, e o nó de escuridão vira um nó de luz.`,"story.eleven-stars_2":`Oh. Segura. Eu estou... seguro.`,"story.eleven-stars_3":`Um nó novo no céu, Mira. A décima primeira estrela. Ela precisa de um nome.`,"story.eleven-stars_4":`O nome dela é...`,"story.eleven-stars_4_oda":`Oda, que não soltou.`,"story.eleven-stars_4_oda_1":`Eu? Ah, menina boba. Está bem. Brilhe bonito.`,"story.eleven-stars_4_wick":`Wick, que ficou.`,"story.eleven-stars_4_wick_1":`Uma estrela com nome de mariposa! Toda mariposa do mundo vai visitar.`,"story.eleven-stars_4_lena":`Lena, que foi na frente.`,"story.eleven-stars_4_lena_1":`Então sempre vou saber qual é a minha.`,"story.eleven-stars_5":`Vovó Oda puxa todos para casa. Sobre Lanternmere, onze estrelas.`,"story.below_1":`Mira, o fio ainda puxa. Para baixo.`,"story.below_2":`Há um tear mais antigo lá embaixo. Alguém dá nós lá.`,"story.below_3":`Então eu vou desatá-los.`,"story.underloom_1":`Fios antigos pendem do teto aqui, todos amarrados com nós.`,"story.underloom_2":`Atadores. Eles dão nós no fio para que ele não alcance lugar nenhum.`,"story.underloom_3":`Um nó rouba seu comprimento, menina. Passe de volta sobre ele e ele se desfaz.`,"story.underloom_4":`Quem ensinou eles a dar nós?`,"story.underloom_5":`Alguém que tinha medo de soltar.`,"story.burrows_1":`O chão se ergue. Algo nada sob as pedras como um peixe sob o gelo.`,"story.burrows_2":`Escavadores! O fio não cerca o que passa por baixo dele.`,"story.burrows_3":`Então esperamos eles subirem. E você lança um Clarão neles, Wick.`,"story.burrows_4":`Dar clarões é a única coisa em que eu sou ótimo!`,"story.lampless_1":`Nenhum lampião jamais foi aceso aqui embaixo. Nem um.`,"story.lampless_2":`Os antigos tecelões guardavam aqui o que não suportavam perder. Amarrado, para que ficasse.`,"story.lampless_3":`Minha avó trabalhava num tear assim. Diziam que ela amarrou a própria sombra nele.`,"story.lampless_4":`A Mãe dos Nós é... da família?`,"story.lampless_5":`Aqui embaixo, todo mundo é de alguém, Mira.`,"story.unspun_1":`Pequena tecelã. Você vem tomar o que eu guardo.`,"story.unspun_2":`Você mantém tudo amarrado para que nada vá embora. Até as estrelas.`,"story.unspun_3":`Tudo o que eu solto, o escuro desfia. Já perdi demais.`,"story.unspun_4":`Ela não está com raiva. Está com medo, como o Vazio estava.`,"story.unspun_5":`O que eu digo a ela?`,"story.unspun_5_gentle":`Um fio pode segurar sem nó.`,"story.unspun_5_gentle_1":`Esse fio não existe.`,"story.unspun_5_firm":`Então eu mesma vou desatar você.`,"story.unspun_5_firm_1":`Tente, pequena tecelã.`,"story.loose-ends_1":`Quatro laços, e os nós da Mãe dos Nós se soltam um a um.`,"story.loose-ends_2":`Eles estão... indo. E nada se desfia.`,"story.loose-ends_3":`Um fio que alguém segura não precisa de nó. A Vovó segura o meu.`,"story.loose-ends_4":`Então segure o meu, pequena tecelã. Só por um tempo.`,"story.loose-ends_5":`Você estava certa em ser firme. Eu amarrei apertado demais, por tempo demais.`,"story.loose-ends_6":`Traga-a para cima, Mira. Há lugar no céu para mais uma luz.`,"story.loose-ends_7":`Sobre Lanternmere, os fios antigos pegam a luz das estrelas. Todos eles seguram.`},fr:{"title.descend":`Descendre · Profondeur {n}`,"title.deepDive":`Plongée`,"title.named":`L'étoile {name} brille sur Lanternmere.`,"title.home":{one:`Étoiles de retour\xA0: {n} sur {total}.`,other:`Étoiles de retour\xA0: {n} sur {total}.`},"title.tagline":`Les étoiles sont tombées dans le labyrinthe. Ramenez-les.`,"title.glimmer":`Lueurs\xA0: {n}`,"title.loom":`Métier`,"title.depths":`Profondeurs`,"title.soundOn":`Son activé`,"title.soundOff":`Son coupé`,"title.musicOn":`Musique activée`,"title.musicOff":`Musique coupée`,"depths.title":`Les Profondeurs`,"depths.note":`★ rentrez avec l'étoile · ★ capturez les obscurs · ★ ne perdez aucun cœur`,"depths.locked":`Profondeur {n}`,"depths.unlock":`Finissez la profondeur {n}`,"depths.next":`Suivante`,"depths.boss":`Boss`,"depths.bossNext":`Boss · suivante`,"depths.deep":`Plongées`,"depths.best":`Record\xA0: plongée {n}`,"depth.d1":`L'Escalier de la cave`,"depth.d2":`Galeries moussues`,"depth.d3":`Le Nœud rouge`,"depth.d4":`Salles des Ciseaux`,"depth.d5":`Le Gardien`,"depth.d6":`Eaux-Pleurs`,"depth.d7":`La Dérive`,"depth.d8":`Le Métier d'os`,"depth.d9":`La Mer sans lumière`,"depth.d10":`Le Cœur creux`,"depth.d11":`Le Sous-Métier`,"depth.d12":`Salles des Terriers`,"depth.d13":`La Voie sans lampe`,"depth.d14":`L'Escalier défilé`,"depth.d15":`La Mère-Nœud`,"depth.deep":`Plongée {n}`,"shop.title":`Le Métier`,"shop.currency":`lueurs`,"shop.spool.name":`Fil plus long`,"shop.spool.effect":`Plus de soie d'étoile sur la bobine`,"shop.reel.name":`Bobine huilée`,"shop.reel.effect":`Revenez plus vite par le fil\xA0; ramassez les étincelles de plus loin`,"shop.wire.name":`Soie d'acier`,"shop.wire.effect":`Les ombres qui coupent, mangent ou nouent votre fil vont moins vite`,"shop.lamp.name":`Lampe plus vive`,"shop.lamp.effect":`Voyez plus loin\xA0; son éclat ralentit l'élan de chaque morsure`,"shop.bell.name":`Clochette d'étoile`,"shop.bell.effect":`Une étoile volée tinte et glisse des pattes du chapardeur`,"shop.redsilk.name":`Le fil rouge de Lena`,"shop.redsilk.effect":`Encore plus de fil, filé par votre mère`,"shop.cloak.name":`Cape de phalène`,"shop.cloak.effect":`Protection plus longue après une morsure`,"shop.flash.name":`Halo de Wick`,"shop.flash.effect":`Le Flash de Wick revient plus vite`,"shop.burn.name":`Brûle-soie`,"shop.burn.effect":`La soie sombre s'efface plus vite dans votre lumière`,"shop.knot.name":`Nœud de tisserande`,"shop.knot.effect":`Plus de lueurs à chaque capture`,"shop.thorn.name":`Soie épineuse`,"shop.thorn.effect":`Les ombres qui heurtent le fil sont étourdies`,"shop.boots.name":`Bottes souples`,"shop.boots.effect":`Marchez plus vite`,"shop.hearts.name":`Talisman de Mamie`,"shop.hearts.effect":`Un cœur de plus`,"fmt.tiles":{one:`{n} case`,other:`{n} cases`},"fmt.moreTiles":{one:`+{n} case`,other:`+{n} cases`},"fmt.speed":`vitesse {n}`,"fmt.chew":`{n}\xA0% de rongement`,"fmt.freeIn":`libre dans {n} s`,"fmt.never":`jamais`,"fmt.seconds":`{n} s`,"fmt.every":`toutes les {n} s`,"fmt.fade":`effacement ×{n}`,"fmt.percent":`{n}\xA0%`,"fmt.none":`aucun`,"fmt.hearts":{one:`{n} cœur`,other:`{n} cœurs`},"tip.snare":`Fais une boucle autour d'un obscur et recroise ton fil\xA0: la boucle le capture\xA0!`,"tip.bite":`Quand leurs yeux rougissent, ils mordent. Bouge sans arrêt et ils te ratent\xA0!`,"tip.fence":`Tu vois\xA0? Les obscurs ne traversent pas la soie d'étoile. Enferme-les\xA0!`,"tip.taut":`C'est tout le fil\xA0! Reviens sur tes pas pour l'enrouler, ou attache-le à un piquet.`,"tip.peg":`Un piquet\xA0! Il attache le fil\xA0: une nouvelle longueur part d'ici. Reviens-y et appuie encore sur Enrouler pour le détacher.`,"tip.star":`L'étoile\xA0! Maintiens Enrouler (Espace) et je te ramène.`,"tip.cut":`Coupé\xA0! Sans le fil, tu ne peux rien ramasser. Retourne au bout libre\xA0!`,"tip.boss":`Trop gros pour l'attraper d'un coup. Boucle-le encore et encore\xA0!`,"tip.drifter":`Les errants traversent les murs, mais jamais le fil.`,"tip.gnawer":`Un rongeur\xA0! S'il finit de mâcher, il dévore tout le fil jusqu'au nœud.`,"tip.filcher":`Les chapardeurs volent les étoiles. Si l'un d'eux la prend, capture-le pour la récupérer\xA0!`,"tip.tangler":`Les emmêleurs filent de la soie sombre. Impossible de la traverser avant qu'elle s'efface.`,"tip.cutterGlow":`Tu vois cette étoile briller plus fort\xA0? Quelque chose ronge ton fil\xA0!`,"tip.knotter":`Un noueur\xA0! Chaque nœud qu'il fait raccourcit ton fil. Repasse sur un nœud pour le défaire.`,"tip.burrower":`Les fouisseurs creusent sous le fil. Quand le sol se soulève, écarte-toi, et boucle-les quand ils sortent\xA0!`,"tip.flare":`Le Flash de Wick est prêt\xA0! Appuie sur F (ou sur Flash) pour étourdir les ombres proches.`,"bark.snare1":`Retissé\xA0!`,"bark.snare2":`Encore un qui retrouve ses contours.`,"bark.snare3":`Ça, c'est ma petite\xA0!`,"bark.snare4":`Serré comme un nœud du dimanche.`,"bark.snare5":`Retourne à la lumière, toi.`,"bark.snare6":`Le fil tient.`,"bark.hollowDown":`Ça tient\xA0! Prends l'étoile, Mira\xA0!`,"bark.knotmotherDown":`Elle a lâché prise\xA0! Ramène la dernière étoile.`,"bark.wardenDown":`Le Gardien est tombé\xA0! L'étoile est libre\xA0!`,"bark.star":`L'étoile\xA0! Maintenant, rentre\xA0: maintiens Enrouler.`,"bark.devour":`Il a mangé tout le fil\xA0! Retourne au nœud pour te rattacher.`,"bark.steal":`Un chapardeur a l'étoile\xA0! Boucle-le\xA0!`,"hud.intro":`Glissez ou ZQSD pour marcher · maintenez Enrouler (Espace) pour rentrer par le fil`,"hud.line":`Profondeur {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Fil restant`,"hud.pause":`Pause`,"hud.reel":`Enrouler`,"hud.reelAria":`Revenir en enroulant le fil`,"hud.flash":`Flash`,"hud.flashAria":`Flash de Wick\xA0: étourdit les ombres proches`,"goal.cut":`Votre fil est coupé\xA0! Rattachez-vous au bout libre pour ramasser`,"goal.carry":`Ramenez l'étoile\xA0: maintenez Enrouler pour suivre le fil`,"goal.stolen":`Un chapardeur a pris l'étoile\xA0! Capturez-le pour la récupérer`,"goal.rule":`Faites une boucle autour d'un obscur et recroisez votre fil pour le capturer`,"goal.warden":`Capturez le Gardien\xA0: faites une boucle autour ({hit}/{max})`,"goal.hollow":`Capturez le Creux\xA0: faites une boucle autour ({hit}/{max})`,"goal.knotmother":`Capturez la Mère-Nœud\xA0: faites une boucle autour ({hit}/{max})`,"goal.knots":{one:`{n} nœud raccourcit votre fil\xA0: repassez dessus pour le défaire`,other:`{n} nœuds raccourcissent votre fil\xA0: repassez dessus pour les défaire`},"goal.find":`Trouvez l'étoile tombée`,"float.double":`Double nœud\xA0!`,"float.triple":`Triple nœud\xA0!`,"float.multi":`Nœud ×{n}\xA0!`,"float.loopsToGo":{one:`Encore {n} boucle\xA0!`,other:`Encore {n} boucles\xA0!`},"float.knotsLeft":{one:`Plus que {n} nœud\xA0!`,other:`Plus que {n} nœuds\xA0!`},"float.tied":`Attaché\xA0!`,"float.untied":`Détaché\xA0!`,"float.eaten":`Dévoré jusqu'au nœud\xA0!`,"float.stolen":`Volée\xA0!`,"float.free":`L'étoile est libre\xA0!`,"float.knot":`Nœud\xA0!`,"float.undone":`Défait\xA0!`,"pause.leave":`Quitter la profondeur`,"lost.title":`Perdue dans le noir`,"lost.continue":`▶ Continuer avec 2 cœurs (pub)`,"lost.carrying":`Vous rameniez l'étoile\xA0!`,"lost.away":{one:`L'étoile était à {n} case.`,other:`L'étoile était à {n} cases.`},"lost.dark":`Les ténèbres se referment.`,"results.elevenStars":`Onze étoiles\xA0!`,"results.everyThread":`Chaque fil tient\xA0!`,"results.home":`De retour avec l'étoile\xA0!`,"results.pulled":`Oda vous a remontée`,"results.surface":`De retour à la surface`,"results.starHome":`L'étoile est rentrée`,"results.bringStar":`Ramenez l'étoile`,"results.snared":`Obscurs capturés\xA0: {n} / {quota}`,"results.lostHearts":{one:`{n} cœur perdu`,other:`{n} cœurs perdus`},"results.noHeartLost":`Aucun cœur perdu`,"results.loseNoHeart":`Ne perdez aucun cœur`,"results.gain":`+{n} lueurs`,"results.gathered":`{n} ramassées`,"results.forDepth":`{n} pour la profondeur`,"results.forStars":`{n} pour les nouvelles étoiles`,"results.next":`Suivante\xA0: profondeur {n}`,"results.deepDive":`Plongée`,"results.again":`Réessayer`,"cast.mira":`Mira`,"cast.oda":`Mamie Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`Le Gardien`,"cast.hollow":`Le Creux`,"cast.knotmother":`La Mère-Nœud`,"chapter.prologue":`L'autre bout`,"chapter.first-star":`Une étoile rentrée`,"chapter.wick":`Contours`,"chapter.red-thread":`Le fil rouge`,"chapter.the-net":`Le filet`,"chapter.warden":`Le Gardien`,"chapter.voice":`Une voix sans bouche`,"chapter.eleventh":`La onzième étoile`,"chapter.holds":`Ce qui tient`,"chapter.the-heart":`Le Cœur`,"chapter.eleven-stars":`Onze étoiles`,"chapter.below":`Sous le Cœur`,"chapter.underloom":`Le Sous-Métier`,"chapter.burrows":`Sous le sol`,"chapter.lampless":`La Voie sans lampe`,"chapter.unspun":`L'Escalier défilé`,"chapter.loose-ends":`Les bouts libres`,"story.prologue_1":`Marche, Mira. La soie d'étoile se souvient du chemin. Je tiens l'autre bout.`,"story.first-star_1":`Une étoile rentrée. Regarde\xA0: le ciel de Lanternmere a de nouveau une lumière.`,"story.first-star_2":`Encore neuf en bas. Et Maman.`,"story.first-star_3":`Un an, Mira. Ta mère est descendue réparer le ciel et ne s'est jamais rattachée.`,"story.first-star_4":`Alors je retrouverai son fil.`,"story.wick_1":`Une phalène de lumière pâle se pose sur l'écharpe de Mira. Elle sort de son dernier nœud.`,"story.wick_2":`Oh\xA0! J'ai de nouveau des contours. J'étais un obscur. Et avant… la phalène d'un allumeur\xA0?`,"story.wick_3":`Le noir effiloche tout ce qui se perd ici. Ton fil nous renoue.`,"story.wick_4":`Qu'est-ce que tu vas faire\xA0?`,"story.wick_4_stay":`Reste avec moi, petite lumière.`,"story.wick_4_stay_1":`Je serai tes yeux\xA0! Je m'appelle Wick. Je crois.`,"story.wick_4_go":`Rentre chez toi. Tu es libre.`,"story.wick_4_go_1":`Chez moi, c'est là où est la lumière. C'est toi. Je suis Wick, et je reste.`,"story.wick_5":`Les phalènes parlent, maintenant. Soit. Continuez, vous deux.`,"story.red-thread_1":`Parmi les pierres gît un fil, rouge comme une écharpe. Son bout est coupé net.`,"story.red-thread_2":`Mamie. C'est la soie de Maman.`,"story.red-thread_3":`Coupé\xA0? La soie d'étoile ne casse pas. Quelque chose, en bas, a appris à couper.`,"story.red-thread_4":`Des cisailleurs. Des sortes de crabes aux mains en ciseaux. Ils visent le fil, pas toi.`,"story.red-thread_5":`S'ils te détachent, retourne au bout libre et rattache-toi. Vite.`,"story.the-net_1":`Mamie, pourquoi les étoiles sont tombées\xA0?`,"story.the-net_2":`Le ciel de Lanternmere est un filet. Notre famille l'a tissé. Chaque étoile est un nœud.`,"story.the-net_3":`Quand un nœud glisse, son étoile tombe. Le mois dernier, ils ont tous glissé d'un coup.`,"story.the-net_4":`Pas glissé. Tiré. Quelque chose, tout au fond, les attire à lui.`,"story.the-net_5":`Alors il devra tirer contre moi.`,"story.warden_1":`Le Gardien se défait en cent phalènes. L'une d'elles reste et parle.`,"story.warden_2":`Nous la gardions. La tisserande rouge. Elle nous a demandé de tenir tout le monde à l'écart.`,"story.warden_3":`Ma mère\xA0? Elle est vivante\xA0?`,"story.warden_4":`Elle tient le Cœur fermé. Il a faim, et il est si terriblement seul.`,"story.warden_5":`Descends, petite tisserande. Ne le laisse pas t'entendre pleurer.`,"story.voice_1":`Le noir se penche. Une voix sans bouche emplit la salle.`,"story.voice_2":`Petite tisserande. Tu remontes mes étoiles. Pourquoi\xA0?`,"story.voice_3":`Elles ne sont pas à toi. Elles éclairent toute une ville.`,"story.voice_4":`Je n'ai rien éclairé depuis mille ans. Personne ne m'a tissé dans le ciel.`,"story.voice_5":`Mira… Je ne crois pas que ce soit un monstre. Je crois que c'est une étoile.`,"story.voice_6":`Reste près de moi. Je n'ai pas peur quand tu es là.`,"story.voice_7":`J'ai peur. Je reste quand même.`,"story.eleventh_1":`Mira. Je dois te dire quelque chose avant que tu le rencontres.`,"story.eleventh_2":`Quand j'étais jeune, on a tissé le filet. Il y avait onze étoiles, et de la place pour dix.`,"story.eleventh_3":`La onzième est tombée. On a dit qu'elle s'était éteinte. Personne n'est descendu voir.`,"story.eleventh_4":`Vous l'avez laissée seule dans le noir.`,"story.eleventh_5":`On avait peur. Ta mère, non. Elle est descendue lui tisser une place.`,"story.holds_1":`Les errants traversent les murs, mais même eux s'arrêtent à ton fil.`,"story.holds_2":`Tout s'arrête au fil. C'est peut-être ce qu'il faut au Creux. Quelque chose qui tient.`,"story.holds_3":`Rien ne me tient. J'ai essayé. Tout ce que je touche s'effiloche.`,"story.holds_4":`Pas la soie d'étoile.`,"story.the-heart_1":`Le dernier escalier. Le fil rouge court partout ici, noué autour de chaque pilier.`,"story.the-heart_2":`Mira\xA0? Non. Non, remonte. Il va t'effilocher.`,"story.the-heart_3":`Maman\xA0! J'ai la bobine de Mamie. Je viens finir ton tissage.`,"story.the-heart_4":`Le Creux est pris dans mes nœuds. Trois boucles, Mira. Noue-le trois fois et il tiendra.`,"story.the-heart_5":`Je tiens l'autre bout, ma petite. Je ne lâcherai pas.`,"story.eleven-stars_1":`La boucle se serre, encore et encore, et le nœud de ténèbres devient un nœud de lumière.`,"story.eleven-stars_2":`Oh. Ça tient. Je suis… tenu.`,"story.eleven-stars_3":`Un nouveau nœud dans le ciel, Mira. La onzième étoile. Il lui faut un nom.`,"story.eleven-stars_4":`Elle s'appelle…`,"story.eleven-stars_4_oda":`Oda, qui a tenu bon.`,"story.eleven-stars_4_oda_1":`Moi\xA0? Oh, petite bêtasse. Bon. Brille bien.`,"story.eleven-stars_4_wick":`Wick, qui n'est pas parti.`,"story.eleven-stars_4_wick_1":`Une étoile au nom d'une phalène\xA0! Toutes les phalènes du monde vont venir la voir.`,"story.eleven-stars_4_lena":`Lena, qui est partie la première.`,"story.eleven-stars_4_lena_1":`Alors je saurai toujours laquelle est la mienne.`,"story.eleven-stars_5":`Mamie Oda les remonte en enroulant le fil. Sur Lanternmere, onze étoiles.`,"story.below_1":`Mira, le fil tire encore. Vers le bas.`,"story.below_2":`Un métier plus ancien se trouve en dessous. Quelqu'un y fait des nœuds.`,"story.below_3":`Alors je les déferai.`,"story.underloom_1":`De vieux fils pendent du plafond ici, tous noués serré.`,"story.underloom_2":`Des noueurs. Ils nouent le fil pour qu'il n'atteigne rien.`,"story.underloom_3":`Un nœud te vole de la longueur, ma petite. Repasse dessus et il se défait.`,"story.underloom_4":`Qui leur a appris à nouer\xA0?`,"story.underloom_5":`Quelqu'un qui avait peur de lâcher prise.`,"story.burrows_1":`Le sol se soulève. Quelque chose nage sous les pierres, comme un poisson sous la glace.`,"story.burrows_2":`Des fouisseurs\xA0! Le fil ne peut pas enfermer ce qui passe dessous.`,"story.burrows_3":`Alors on attend qu'ils sortent. Et toi, Wick, tu leur envoies ton Flash.`,"story.burrows_4":`Le Flash, c'est vraiment mon grand talent\xA0!`,"story.lampless_1":`Aucune lampe n'a jamais été allumée ici. Pas une.`,"story.lampless_2":`Les anciens tisserands gardaient ici ce qu'ils ne pouvaient pas perdre. Attaché, pour que ça reste.`,"story.lampless_3":`Ma grand-mère tissait sur un métier comme ça. On disait qu'elle y avait attaché sa propre ombre.`,"story.lampless_4":`La Mère-Nœud est… de la famille\xA0?`,"story.lampless_5":`Ici, chacun appartient à quelqu'un, Mira.`,"story.unspun_1":`Petite tisserande. Tu viens prendre ce que je garde.`,"story.unspun_2":`Tu gardes tout attaché pour que rien ne parte. Même les étoiles.`,"story.unspun_3":`Tout ce que je lâche, le noir l'effiloche. J'ai trop perdu.`,"story.unspun_4":`Elle n'est pas en colère. Elle a peur, comme le Creux.`,"story.unspun_5":`Qu'est-ce que je lui dis\xA0?`,"story.unspun_5_gentle":`Un fil peut tenir sans nœud.`,"story.unspun_5_gentle_1":`Un tel fil n'existe pas.`,"story.unspun_5_firm":`Alors je te dénouerai moi-même.`,"story.unspun_5_firm_1":`Essaie, petite tisserande.`,"story.loose-ends_1":`Quatre boucles, et les nœuds de la Mère-Nœud glissent un à un.`,"story.loose-ends_2":`Ils… s'en vont. Et rien ne s'effiloche.`,"story.loose-ends_3":`Un fil que quelqu'un tient n'a pas besoin de nœud. Mamie tient le mien.`,"story.loose-ends_4":`Alors tiens le mien, petite tisserande. Juste un moment.`,"story.loose-ends_5":`Tu as eu raison d'être ferme. J'ai noué trop serré, trop longtemps.`,"story.loose-ends_6":`Remonte-la, Mira. Il y a de la place dans le ciel pour une lumière de plus.`,"story.loose-ends_7":`Sur Lanternmere, les vieux fils captent la lumière des étoiles. Chacun d'eux tient.`},de:{"title.descend":`Hinab · Tiefe {n}`,"title.deepDive":`Tauchgang`,"title.named":`Der Stern {name} leuchtet über Lanternmere.`,"title.home":{one:`{n} von {total} Sternen ist daheim.`,other:`{n} von {total} Sternen sind daheim.`},"title.tagline":`Die Sterne fielen ins Labyrinth. Bring sie heim.`,"title.glimmer":`{n} Schimmer`,"title.loom":`Webstuhl`,"title.depths":`Tiefen`,"title.soundOn":`Ton an`,"title.soundOff":`Ton aus`,"title.musicOn":`Musik an`,"title.musicOff":`Musik aus`,"depths.title":`Die Tiefen`,"depths.note":`★ mit dem Stern heim · ★ fang die Düsterlinge · ★ verlier kein Herz`,"depths.locked":`Tiefe {n}`,"depths.unlock":`Schaff Tiefe {n}`,"depths.next":`Nächste`,"depths.boss":`Boss`,"depths.bossNext":`Boss · Nächste`,"depths.deep":`Tauchgänge`,"depths.best":`Rekord: Tauchgang {n}`,"depth.d1":`Die Kellertreppe`,"depth.d2":`Moosgalerien`,"depth.d3":`Der rote Knoten`,"depth.d4":`Scherenhallen`,"depth.d5":`Der Wächter`,"depth.d6":`Tränenwasser`,"depth.d7":`Die Drift`,"depth.d8":`Knochenwebstuhl`,"depth.d9":`Die lichtlose See`,"depth.d10":`Das Herz der Leere`,"depth.d11":`Der Unterwebstuhl`,"depth.d12":`Wühlerhallen`,"depth.d13":`Der lampenlose Weg`,"depth.d14":`Die ungesponnene Treppe`,"depth.d15":`Die Knotenmutter`,"depth.deep":`Tauchgang {n}`,"shop.title":`Der Webstuhl`,"shop.currency":`Schimmer`,"shop.spool.name":`Längerer Faden`,"shop.spool.effect":`Mehr Sternseide auf der Spule`,"shop.reel.name":`Geölte Spule`,"shop.reel.effect":`Schneller am Faden heim; Funken von weiter her sammeln`,"shop.wire.name":`Drahtseide`,"shop.wire.effect":`Schatten, die deinen Faden schneiden, fressen oder verknoten, sind langsamer`,"shop.lamp.name":`Hellere Lampe`,"shop.lamp.effect":`Weiter sehen; ihr Glanz lässt jeden Biss langsamer ausholen`,"shop.bell.name":`Sternglocke`,"shop.bell.effect":`Ein gestohlener Stern klingelt und entwischt den Pfoten des Stibitzers`,"shop.redsilk.name":`Lenas roter Faden`,"shop.redsilk.effect":`Noch mehr Faden, gesponnen von deiner Mutter`,"shop.cloak.name":`Mottenmantel`,"shop.cloak.effect":`Länger sicher nach einem Biss`,"shop.flash.name":`Wicks Leuchten`,"shop.flash.effect":`Wick kann schneller wieder blitzen`,"shop.burn.name":`Seidenbrand`,"shop.burn.effect":`Dunkle Seide verblasst in deinem Licht schneller`,"shop.knot.name":`Weberknoten`,"shop.knot.effect":`Mehr Schimmer für jeden Fang`,"shop.thorn.name":`Dornenseide`,"shop.thorn.effect":`Schatten, die an den Faden stoßen, werden betäubt`,"shop.boots.name":`Weiche Stiefel`,"shop.boots.effect":`Schneller laufen`,"shop.hearts.name":`Omas Glücksbringer`,"shop.hearts.effect":`Ein Herz mehr`,"fmt.tiles":{one:`{n} Feld`,other:`{n} Felder`},"fmt.moreTiles":{one:`+{n} Feld`,other:`+{n} Felder`},"fmt.speed":`Tempo {n}`,"fmt.chew":`{n} % Kauzeit`,"fmt.freeIn":`frei in {n} s`,"fmt.never":`nie`,"fmt.seconds":`{n} s`,"fmt.every":`alle {n} s`,"fmt.fade":`×{n} Verblassen`,"fmt.percent":`{n} %`,"fmt.none":`keine`,"fmt.hearts":{one:`{n} Herz`,other:`{n} Herzen`},"tip.snare":`Lauf eine Schlinge um einen Düsterling und kreuze deinen Faden: Die Schlinge fängt ihn!`,"tip.bite":`Werden ihre Augen rot, beißen sie. Bleib in Bewegung, dann verfehlen sie dich!`,"tip.fence":`Siehst du? Düsterlinge kommen nicht über die Sternseide. Zäun sie ein!`,"tip.taut":`Das ist der ganze Faden! Geh zurück, um ihn aufzuwickeln, oder bind ihn an einen Pflock.`,"tip.peg":`Ein Pflock! Er bindet den Faden fest: Ab hier gibt's ein neues Stück. Drück dort erneut Spulen zum Lösen.`,"tip.star":`Der Stern! Halte Spulen (Leertaste), dann zieh ich dich heim.`,"tip.cut":`Durchtrennt! Ohne Faden kannst du nichts aufheben. Geh zurück zum losen Ende!`,"tip.boss":`Zu groß für einen einzigen Fang. Leg immer wieder Schlingen um ihn!`,"tip.drifter":`Schweber gehen durch Wände, aber nie durch den Faden.`,"tip.gnawer":`Ein Nager! Kaut er fertig, frisst er den ganzen Faden bis zum Knoten.`,"tip.filcher":`Stibitzer stehlen Sterne. Schnappt sich einer den Stern, fang ihn, um ihn zurückzuholen!`,"tip.tangler":`Verspinner spinnen dunkle Seide. Du kommst erst drüber, wenn sie verblasst.`,"tip.cutterGlow":`Siehst du den Stern heller glühen? Etwas kaut an deinem Faden!`,"tip.knotter":`Ein Knüpfer! Jeder Knoten von ihm kürzt deinen Faden. Geh über einen Knoten zurück, um ihn zu lösen.`,"tip.burrower":`Wühler graben unter dem Faden durch. Hebt sich der Boden, geh weg und fang sie, solange sie oben sind!`,"tip.flare":`Wick kann jetzt blitzen! Drück F (oder „Blitz“), um alle Schatten in deiner Nähe zu betäuben.`,"bark.snare1":`Neu gewebt!`,"bark.snare2":`Noch einer erinnert sich an seine Umrisse.`,"bark.snare3":`So ist's recht, Mädchen.`,"bark.snare4":`Fest wie ein Sonntagsknoten.`,"bark.snare5":`Zurück ins Licht mit dir.`,"bark.snare6":`Der Faden hält.`,"bark.hollowDown":`Es hält! Nimm den Stern, Mira!`,"bark.knotmotherDown":`Sie hat losgelassen! Bring den letzten Stern heim.`,"bark.wardenDown":`Der Wächter ist besiegt! Der Stern ist frei!`,"bark.star":`Der Stern! Jetzt heim: Halte Spulen.`,"bark.devour":`Er hat den ganzen Faden gefressen! Zurück zum Knoten, neu anbinden.`,"bark.steal":`Ein Stibitzer hat den Stern! Leg eine Schlinge um ihn!`,"hud.intro":`Ziehen oder WASD zum Gehen · halte Spulen (Leertaste), um am Faden zurückzufahren`,"hud.line":`Tiefe {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Restfaden`,"hud.pause":`Pause`,"hud.reel":`Spulen`,"hud.reelAria":`Am Faden zurückspulen`,"hud.flash":`Blitz`,"hud.flashAria":`Wicks Blitz: betäubt Schatten in der Nähe`,"goal.cut":`Dein Faden ist durch! Bind am losen Ende neu an, um Dinge aufzuheben`,"goal.carry":`Bring den Stern heim: Halte Spulen, um am Faden heimzufahren`,"goal.stolen":`Ein Stibitzer hat den Stern! Fang ihn, um ihn zurückzuholen`,"goal.rule":`Lauf eine Schlinge um einen Düsterling und kreuze deinen Faden, um ihn zu fangen`,"goal.warden":`Fang den Wächter: Lauf eine Schlinge um ihn ({hit}/{max})`,"goal.hollow":`Fang die Leere: Lauf eine Schlinge um sie ({hit}/{max})`,"goal.knotmother":`Fang die Knotenmutter: Lauf eine Schlinge um sie ({hit}/{max})`,"goal.knots":{one:`{n} Knoten kürzt deinen Faden: Geh über ihn zurück, um ihn zu lösen`,other:`{n} Knoten kürzen deinen Faden: Geh über sie zurück, um sie zu lösen`},"goal.find":`Finde den gefallenen Stern`,"float.double":`Doppelknoten!`,"float.triple":`Dreifachknoten!`,"float.multi":`{n}×-Knoten!`,"float.loopsToGo":{one:`Noch {n} Schlinge!`,other:`Noch {n} Schlingen!`},"float.knotsLeft":{one:`Noch {n} Knoten!`,other:`Noch {n} Knoten!`},"float.tied":`Angebunden!`,"float.untied":`Gelöst!`,"float.eaten":`Bis zum Knoten gefressen!`,"float.stolen":`Gestohlen!`,"float.free":`Der Stern ist frei!`,"float.knot":`Knoten!`,"float.undone":`Entknotet!`,"pause.leave":`Tiefe verlassen`,"lost.title":`Verloren im Dunkeln`,"lost.continue":`▶ Weiter mit 2 Herzen (Werbung)`,"lost.carrying":`Du warst mit dem Stern auf dem Heimweg!`,"lost.away":{one:`Der Stern war {n} Feld entfernt.`,other:`Der Stern war {n} Felder entfernt.`},"lost.dark":`Die Dunkelheit schließt sich.`,"results.elevenStars":`Elf Sterne!`,"results.everyThread":`Jeder Faden hält!`,"results.home":`Mit dem Stern daheim!`,"results.pulled":`Oda hat dich hochgezogen`,"results.surface":`Zurück an der Oberfläche`,"results.starHome":`Der Stern ist daheim`,"results.bringStar":`Bring den Stern heim`,"results.snared":`{n} / {quota} Düsterlinge gefangen`,"results.lostHearts":{one:`{n} Herz verloren`,other:`{n} Herzen verloren`},"results.noHeartLost":`Kein Herz verloren`,"results.loseNoHeart":`Verlier kein Herz`,"results.gain":`+{n} Schimmer`,"results.gathered":`{n} gesammelt`,"results.forDepth":`{n} für die Tiefe`,"results.forStars":`{n} für neue Sterne`,"results.next":`Weiter: Tiefe {n}`,"results.deepDive":`Tauchgang`,"results.again":`Nochmal`,"cast.mira":`Mira`,"cast.oda":`Oma Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`Der Wächter`,"cast.hollow":`Die Leere`,"cast.knotmother":`Die Knotenmutter`,"chapter.prologue":`Das andere Ende`,"chapter.first-star":`Ein Stern daheim`,"chapter.wick":`Umrisse`,"chapter.red-thread":`Der rote Faden`,"chapter.the-net":`Das Netz`,"chapter.warden":`Der Wächter`,"chapter.voice":`Eine Stimme ohne Mund`,"chapter.eleventh":`Der elfte Stern`,"chapter.holds":`Was hält`,"chapter.the-heart":`Das Herz`,"chapter.eleven-stars":`Elf Sterne`,"chapter.below":`Unter dem Herzen`,"chapter.underloom":`Der Unterwebstuhl`,"chapter.burrows":`Unter dem Boden`,"chapter.lampless":`Der lampenlose Weg`,"chapter.unspun":`Die ungesponnene Treppe`,"chapter.loose-ends":`Lose Enden`,"story.prologue_1":`Geh, Mira. Die Sternseide kennt den Weg zurück. Ich halte das andere Ende.`,"story.first-star_1":`Ein Stern daheim. Schau hoch: Der Himmel über Lanternmere leuchtet wieder.`,"story.first-star_2":`Noch neun da unten. Und Mama.`,"story.first-star_3":`Ein Jahr, Mira. Deine Mutter ging hinab, den Himmel flicken, und band nie wieder an.`,"story.first-star_4":`Dann finde ich ihren Faden.`,"story.wick_1":`Eine Motte aus blassem Licht landet auf Miras Schal. Sie kam aus dem letzten Knoten, den Mira band.`,"story.wick_2":`Oh! Ich hab wieder Umrisse. Ich war ein Düsterling. Und davor ... die Motte eines Laternenanzünders?`,"story.wick_3":`Die Dunkelheit löst auf, was sich hier unten verirrt. Dein Faden knüpft uns wieder zusammen.`,"story.wick_4":`Was machst du jetzt?`,"story.wick_4_stay":`Bleib bei mir, kleines Licht.`,"story.wick_4_stay_1":`Ich bin deine Augen! Ich heiße Wick. Glaub ich.`,"story.wick_4_go":`Flieg heim. Du bist frei.`,"story.wick_4_go_1":`Daheim ist, wo das Licht ist. Also bei dir. Ich bin Wick, und ich bleibe.`,"story.wick_5":`Jetzt reden also Motten. Schön. Geht weiter, ihr beiden.`,"story.red-thread_1":`Zwischen den Steinen liegt ein Faden, rot wie ein Schal. Sein Ende ist glatt durchtrennt.`,"story.red-thread_2":`Oma. Das ist Mamas Seide.`,"story.red-thread_3":`Durchtrennt? Sternseide reißt nicht. Da unten hat etwas schneiden gelernt.`,"story.red-thread_4":`Schnipper. Krabbenviecher mit Scherenhänden. Die wollen den Faden, nicht dich.`,"story.red-thread_5":`Schneiden sie dich los, geh zurück zum losen Ende und bind neu an. Schnell.`,"story.the-net_1":`Oma, warum sind die Sterne gefallen?`,"story.the-net_2":`Der Himmel über Lanternmere ist ein Netz. Unsere Familie hat es gewebt. Jeder Stern ist ein Knoten.`,"story.the-net_3":`Rutscht ein Knoten, fällt sein Stern. Letzten Monat rutschten alle auf einmal.`,"story.the-net_4":`Nicht gerutscht. Gezogen. Etwas ganz unten zieht sie hinab.`,"story.the-net_5":`Dann soll es gegen mich ziehen.`,"story.warden_1":`Der Wächter zerfällt in hundert Motten. Eine bleibt und spricht.`,"story.warden_2":`Wir haben sie bewacht. Die rote Weberin. Sie bat uns, alle fernzuhalten.`,"story.warden_3":`Meine Mutter? Sie lebt?`,"story.warden_4":`Sie hält das Herz verschlossen. Es ist hungrig, und es ist so sehr einsam.`,"story.warden_5":`Geh hinab, kleine Weberin. Lass es dich nicht weinen hören.`,"story.voice_1":`Die Dunkelheit rückt heran. Eine Stimme ohne Mund erfüllt die Kammer.`,"story.voice_2":`Kleine Weberin. Du trägst meine Sterne wieder hinauf. Warum?`,"story.voice_3":`Sie gehören nicht dir. Sie erleuchten eine Stadt voller Menschen.`,"story.voice_4":`Tausend Jahre lang erleuchtete ich nichts. Niemand webte mich in den Himmel.`,"story.voice_5":`Mira ... ich glaub, das ist kein Monster. Ich glaub, das ist ein Stern.`,"story.voice_6":`Bleib nah. Wenn du da bist, hab ich keine Angst.`,"story.voice_7":`Ich hab Angst. Ich bleibe trotzdem.`,"story.eleventh_1":`Mira. Ich muss dir etwas sagen, bevor du ihm begegnest.`,"story.eleventh_2":`Als ich jung war, webten wir das Netz. Es gab elf Sterne und Platz für zehn.`,"story.eleventh_3":`Der elfte fiel. Wir sagten, er sei erloschen. Keiner ging hinab, um nachzusehen.`,"story.eleventh_4":`Ihr habt ihn allein im Dunkeln gelassen.`,"story.eleventh_5":`Wir hatten Angst. Deine Mutter nicht. Sie ging hinab, um ihm einen Platz zu weben.`,"story.holds_1":`Die Schweber gehen durch Wände, aber selbst sie halten an deinem Faden.`,"story.holds_2":`Alles hält am Faden an. Vielleicht braucht die Leere genau das. Etwas, das hält.`,"story.holds_3":`Nichts hält mich. Ich habe es versucht. Alles, was ich berühre, löst sich auf.`,"story.holds_4":`Sternseide schon.`,"story.the-heart_1":`Die letzte Treppe. Überall läuft roter Faden, um jede Säule geknotet.`,"story.the-heart_2":`Mira? Nein. Nein, geh zurück nach oben. Es löst dich auf.`,"story.the-heart_3":`Mama! Ich hab Omas Spule. Ich bin gekommen, um dein Gewebe zu vollenden.`,"story.the-heart_4":`Die Leere steckt in meinen Knoten. Drei Schlingen, Mira. Binde sie dreimal, dann hält es.`,"story.the-heart_5":`Ich hab das andere Ende, Mädchen. Ich lass nicht los.`,"story.eleven-stars_1":`Die Schlinge zieht sich fest, und fester, und der Knoten aus Dunkel wird ein Knoten aus Licht.`,"story.eleven-stars_2":`Oh. Es hält. Ich werde ... gehalten.`,"story.eleven-stars_3":`Ein neuer Knoten am Himmel, Mira. Der elfte Stern. Er braucht einen Namen.`,"story.eleven-stars_4":`Sein Name ist ...`,"story.eleven-stars_4_oda":`Oda, die festhielt.`,"story.eleven-stars_4_oda_1":`Ich? Ach, du dummes Ding. Na gut. Leuchte schön.`,"story.eleven-stars_4_wick":`Wick, der blieb.`,"story.eleven-stars_4_wick_1":`Ein Stern, benannt nach einer Motte! Alle Motten der Welt kommen zu Besuch.`,"story.eleven-stars_4_lena":`Lena, die vorausging.`,"story.eleven-stars_4_lena_1":`Dann weiß ich immer, welcher meiner ist.`,"story.eleven-stars_5":`Oma Oda holt sie heim. Über Lanternmere stehen elf Sterne.`,"story.below_1":`Mira, der Faden zieht noch. Nach unten.`,"story.below_2":`Darunter liegt ein älterer Webstuhl. Dort knüpft jemand Knoten.`,"story.below_3":`Dann löse ich sie.`,"story.underloom_1":`Hier hängen alte Fäden von der Decke, jeder einzelne zugeknotet.`,"story.underloom_2":`Knüpfer. Sie verknoten den Faden, damit er nirgends hinreicht.`,"story.underloom_3":`Ein Knoten stiehlt dir Länge, Mädchen. Geh über ihn zurück, dann geht er auf.`,"story.underloom_4":`Wer hat ihnen das Knoten beigebracht?`,"story.underloom_5":`Jemand, der Angst hatte loszulassen.`,"story.burrows_1":`Der Boden hebt sich. Etwas schwimmt unter den Steinen wie ein Fisch unter Eis.`,"story.burrows_2":`Wühler! Was unter dem Faden durchgeht, kann er nicht einzäunen.`,"story.burrows_3":`Dann warten wir, bis sie hochkommen. Und du blitzt sie an, Wick.`,"story.burrows_4":`Blitzen ist das, was ich richtig gut kann!`,"story.lampless_1":`Hier unten brannte nie eine Lampe. Nicht eine.`,"story.lampless_2":`Die alten Weber bewahrten hier unten, was sie nicht verlieren konnten. Festgebunden, damit es bleibt.`,"story.lampless_3":`Meine Großmutter arbeitete an so einem Webstuhl. Man sagt, sie band ihren eigenen Schatten daran.`,"story.lampless_4":`Die Knotenmutter ist ... Familie?`,"story.lampless_5":`Jeder hier unten gehört zu jemandem, Mira.`,"story.unspun_1":`Kleine Weberin. Du kommst, um zu nehmen, was ich bewahre.`,"story.unspun_2":`Du hältst alles festgebunden, damit es nicht gehen kann. Sogar die Sterne.`,"story.unspun_3":`Was ich loslasse, löst die Dunkelheit auf. Ich habe zu viel verloren.`,"story.unspun_4":`Sie ist nicht wütend. Sie hat Angst, wie damals die Leere.`,"story.unspun_5":`Was sag ich ihr?`,"story.unspun_5_gentle":`Ein Faden kann ohne Knoten halten.`,"story.unspun_5_gentle_1":`So einen Faden gibt es nicht.`,"story.unspun_5_firm":`Dann binde ich dich selbst los.`,"story.unspun_5_firm_1":`Versuch es, kleine Weberin.`,"story.loose-ends_1":`Vier Schlingen, und die Knoten der Knotenmutter lösen sich einer nach dem anderen.`,"story.loose-ends_2":`Sie ... gehen. Und nichts löst sich auf.`,"story.loose-ends_3":`Ein Faden, den jemand hält, braucht keinen Knoten. Oma hält meinen.`,"story.loose-ends_4":`Dann halte meinen, kleine Weberin. Nur eine Weile.`,"story.loose-ends_5":`Du warst zu Recht hart. Ich habe zu fest gebunden, zu lange.`,"story.loose-ends_6":`Bring sie hoch, Mira. Am Himmel ist Platz für ein Licht mehr.`,"story.loose-ends_7":`Über Lanternmere fangen die alten Fäden das Sternenlicht. Jeder einzelne hält.`},ru:{"title.descend":`Спуск · Глубина {n}`,"title.deepDive":`Погружение`,"title.named":`Звезда {name} сияет над Lanternmere.`,"title.home":{one:`Звёзд дома: {n} из {total}.`,few:`Звёзд дома: {n} из {total}.`,many:`Звёзд дома: {n} из {total}.`,other:`Звёзд дома: {n} из {total}.`},"title.tagline":`Звёзды упали в лабиринт. Верните их домой.`,"title.glimmer":`Блеск: {n}`,"title.loom":`Станок`,"title.depths":`Глубины`,"title.soundOn":`Звук вкл.`,"title.soundOff":`Звук выкл.`,"title.musicOn":`Музыка вкл.`,"title.musicOff":`Музыка выкл.`,"depths.title":`Глубины`,"depths.note":`★ звезда дома · ★ мороки пойманы · ★ без потери сердец`,"depths.locked":`Глубина {n}`,"depths.unlock":`Пройдите глубину {n}`,"depths.next":`Далее`,"depths.boss":`Босс`,"depths.bossNext":`Босс · далее`,"depths.deep":`Погружения`,"depths.best":`Рекорд: {n}`,"depth.d1":`Лестница в погреб`,"depth.d2":`Моховые галереи`,"depth.d3":`Красный узел`,"depth.d4":`Залы ножниц`,"depth.d5":`Страж`,"depth.d6":`Плакучие воды`,"depth.d7":`Дрейф`,"depth.d8":`Костяной станок`,"depth.d9":`Тёмное море`,"depth.d10":`Пустое Сердце`,"depth.d11":`Нижний станок`,"depth.d1 . Двигайся, и они промахнутся!`,"tip.fence":`Видишь? Мороки не могут пересечь звёздный шёлк. Огороди их!`,"tip.taut":`Нить кончилась! Вернись назад, чтобы смотать её, или привяжи к колышку.`,"tip.peg":`Колышек! Он закрепляет нить: отсюда — новый отрезок. Чтобы отвязать, снова нажми у него «Смотать».`,"tip.star":`Звезда! Держи «Смотать» (Пробел), и я вытяну тебя домой.`,"tip.cut":`Обрыв! Без нити ничего не подобрать. Вернись к свободному концу!`,"tip.boss":`Слишком большой, сразу не поймать. Обводи петлёй снова и снова!`,"tip.drifter":`Скитальцы проходят сквозь стены, но никогда — сквозь нить.`,"tip.gnawer":`Грызун! Если он догрызёт, то съест всю нить до самого узла.`,"tip.filcher":`Воришки крадут звёзды. Если звезду стащили — поймай воришку и верни её!`,"tip.tangler":`Путаники прядут тёмный шёлк. Через него не пройти, пока он не растает.`,"tip.cutterGlow":`Видишь, звезда светится ярче? Кто-то грызёт твою нить!`,"tip.knotter":`Вязальщик! Каждый его узел укорачивает нить. Пройди по узлу обратно, чтобы развязать.`,"tip.burrower":`Землерои роют под нитью. Когда пол вздымается, отойди и лови их петлёй, пока они наверху!`,"tip.flare":`Wick готов к вспышке! Нажми F (или «Вспышка»), чтобы оглушить все тени рядом.`,"bark.snare1":`Соткан заново!`,"bark.snare2":`Ещё один вспомнил свои очертания.`,"bark.snare3":`Умница моя.`,"bark.snare4":`Крепко, как праздничный узел.`,"bark.snare5":`А ну-ка обратно к свету.`,"bark.snare6":`Нить держит.`,"bark.hollowDown":`Держит! Бери звезду, Mira!`,"bark.knotmotherDown":`Она отпустила! Неси последнюю звезду домой.`,"bark.wardenDown":`Страж повержен! Звезда свободна!`,"bark.star":`Звезда! Теперь домой: держи «Смотать».`,"bark.devour":`Он съел всю нить! Назад к узлу, привяжись снова.`,"bark.steal":`Воришка схватил звезду! Лови его петлёй!`,"hud.intro":`Тяните или WASD — идти · держите «Смотать» (Пробел) — назад по нити`,"hud.line":`Глубина {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Остаток нити`,"hud.pause":`Пауза`,"hud.reel":`Смотать`,"hud.reelAria":`Смотать нить и вернуться по ней`,"hud.flash":`Вспышка`,"hud.flashAria":`Вспышка Wick: оглушить тени рядом`,"goal.cut":`Нить перерезана! Привяжитесь у свободного конца, чтобы подбирать предметы`,"goal.carry":`Несите звезду домой: держите «Смотать», чтобы вернуться по нити`,"goal.stolen":`Воришка унёс звезду! Поймайте его, чтобы вернуть её`,"goal.rule":`Обойдите морока петлёй и пересеките нить, чтобы поймать его`,"goal.warden":`Поймайте Стража: обойдите его петлёй ({hit}/{max})`,"goal.hollow":`Поймайте Пустоту: обойдите её петлёй ({hit}/{max})`,"goal.knotmother":`Поймайте Мать узлов: обойдите её петлёй ({hit}/{max})`,"goal.knots":{one:`{n} узел укорачивает нить: пройдите по нему, чтобы развязать`,few:`{n} узла укорачивают нить: пройдите по ним, чтобы развязать`,many:`{n} узлов укорачивают нить: пройдите по ним, чтобы развязать`,other:`{n} узла укорачивают нить: пройдите по ним, чтобы развязать`},"goal.find":`Найдите упавшую звезду`,"float.double":`Двойной узел!`,"float.triple":`Тройной узел!`,"float.multi":`Узел ×{n}!`,"float.loopsToGo":{one:`Ещё {n} петля!`,few:`Ещё {n} петли!`,many:`Ещё {n} петель!`,other:`Ещё {n} петли!`},"float.knotsLeft":{one:`Остался {n} узел!`,few:`Осталось {n} узла!`,many:`Осталось {n} узлов!`,other:`Осталось {n} узла!`},"float.tied":`Привязано!`,"float.untied":`Отвязано!`,"float.eaten":`Съедено до узла!`,"float.stolen":`Украдена!`,"float.free":`Звезда свободна!`,"float.knot":`Узел!`,"float.undone":`Развязан!`,"pause.leave":`Покинуть глубину`,"lost.title":`Заблудилась во тьме`,"lost.continue":`▶ Продолжить с 2 сердцами (реклама)`,"lost.carrying":`Вы уже несли звезду домой!`,"lost.away":{one:`До звезды оставалась {n} клетка.`,few:`До звезды оставалось {n} клетки.`,many:`До звезды оставалось {n} клеток.`,other:`До звезды оставалось {n} клетки.`},"lost.dark":`Тьма сгущается.`,"results.elevenStars":`Одиннадцать звёзд!`,"results.everyThread":`Каждая нить держит!`,"results.home":`Домой со звездой!`,"results.pulled":`Oda вытянула вас наверх`,"results.surface":`Снова на поверхности`,"results.starHome":`Звезда дома`,"results.bringStar":`Принесите звезду домой`,"results.snared":`Поймано мороков: {n} / {quota}`,"results.lostHearts":{one:`Потеряно {n} сердце`,few:`Потеряно {n} сердца`,many:`Потеряно {n} сердец`,other:`Потеряно {n} сердца`},"results.noHeartLost":`Все сердца целы`,"results.loseNoHeart":`Не теряйте сердец`,"results.gain":`Блеск +{n}`,"results.gathered":`собрано: {n}`,"results.forDepth":`за глубину: {n}`,"results.forStars":`за новые звёзды: {n}`,"results.next":`Далее: глубина {n}`,"results.deepDive":`Погружение`,"results.again":`Ещё раз`,"cast.mira":`Mira`,"cast.oda":`Бабушка Oda`,"cast.wick":`Wick`,"cast.lena":`Lena`,"cast.warden":`Страж`,"cast.hollow":`Пустота`,"cast.knotmother":`Мать узлов`,"chapter.prologue":`Другой конец`,"chapter.first-star":`Одна звезда дома`,"chapter.wick":`Очертания`,"chapter.red-thread":`Красная нить`,"chapter.the-net":`Сеть`,"chapter.warden":`Страж`,"chapter.voice":`Голос без рта`,"chapter.eleventh":`Одиннадцатая звезда`,"chapter.holds":`Что держит`,"chapter.the-heart":`Сердце`,"chapter.eleven-stars":`Одиннадцать звёзд`,"chapter.below":`Под Сердцем`,"chapter.underloom":`Нижний станок`,"chapter.burrows":`Под полом`,"chapter.lampless":`Путь без ламп`,"chapter.unspun":`Неспрядённая лестница`,"chapter.loose-ends":`Свободные концы`,"story.prologue_1":`Иди, Mira. Звёздный шёлк помнит дорогу назад. Я держу другой конец.`,"story.first-star_1":`Одна звезда дома. Глянь вверх: над Lanternmere снова есть свет.`,"story.first-star_2":`Там внизу ещё девять. И мама.`,"story.first-star_3":`Год прошёл, Mira. Твоя мама спустилась чинить небо и так и не вернулась по нити.`,"story.first-star_4":`Тогда я найду её нить.`,"story.wick_1":`На шарф садится мотылёк из бледного света. Он вылетел из последнего узла, что завязала Mira.`,"story.wick_2":`Ой! У меня снова есть очертания. Я был мороком. А до того... мотыльком фонарщика?`,"story.wick_3":`Тьма распускает всё, что здесь теряется. Твоя нить связывает нас обратно.`,"story.wick_4":`Что ты теперь будешь делать?`,"story.wick_4_stay":`Останься со мной, огонёк.`,"story.wick_4_stay_1":`Я буду твоими глазами! Меня зовут Wick. Кажется.`,"story.wick_4_go":`Лети домой. Ты свободен.`,"story.wick_4_go_1":`Дом там, где свет. То есть ты. Я Wick, и я остаюсь.`,"story.wick_5":`Теперь и мотыльки болтают. Ладно. Идите дальше, оба.`,"story.red-thread_1":`Среди камней лежит нить, красная, как шарф. Её конец ровно срезан.`,"story.red-thread_2":`Бабушка. Это мамин шёлк.`,"story.red-thread_3":`Срезан? Звёздный шёлк не рвётся. Кто-то там внизу научился резать.`,"story.red-thread_4":`Стригуны. Крабы с руками-ножницами. Им нужна нить, а не ты.`,"story.red-thread_5":`Если тебя отрежут, вернись к свободному концу и привяжись снова. Быстро.`,"story.the-net_1":`Бабушка, почему упали звёзды?`,"story.the-net_2":`Небо над Lanternmere — это сеть. Её соткала наша семья. Каждая звезда — узел.`,"story.the-net_3":`Когда узел соскальзывает, звезда падает. В прошлом месяце соскользнули все разом.`,"story.the-net_4":`Не соскользнули. Их утянули. Что-то на дне тянет их к себе.`,"story.the-net_5":`Тогда пусть потягается со мной.`,"story.warden_1":`Страж распадается на сотню мотыльков. Один из них остаётся и говорит.`,"story.warden_2":`Мы охраняли её. Красную ткачиху. Она просила никого не пускать.`,"story.warden_3":`Мою маму? Она жива?`,"story.warden_4":`Она держит Сердце закрытым. Оно голодно, и ему так одиноко.`,"story.warden_5":`Спускайся, маленькая ткачиха. Не дай ему услышать твой плач.`,"story.voice_1":`Тьма подступает ближе. Голос без рта наполняет зал.`,"story.voice_2":`Маленькая ткачиха. Ты уносишь мои звёзды наверх. Зачем?`,"story.voice_3":`Они не твои. Они светят целому городу.`,"story.voice_4":`Тысячу лет от меня ни луча. Никто не вплёл меня в небо.`,"story.voice_5":`Mira... по-моему, это не чудовище. По-моему, это звезда.`,"story.voice_6":`Будь рядом. С тобой мне не страшно.`,"story.voice_7":`Мне страшно. Но я всё равно остаюсь.`,"story.eleventh_1":`Mira. Мне нужно кое-что сказать тебе до вашей встречи.`,"story.eleventh_2":`В молодости мы соткали сеть. Звёзд было одиннадцать, а места — на десять.`,"story.eleventh_3":`Одиннадцатая упала. Мы сказали, что она выгорела. Никто не спустился проверить.`,"story.eleventh_4":`Ты оставила её одну во тьме.`,"story.eleventh_5":`Мы боялись. А твоя мама — нет. Она спустилась, чтобы соткать ей место.`,"story.holds_1":`Скитальцы ходят сквозь стены, но даже они останавливаются у твоей нити.`,"story.holds_2":`У нити останавливается всё. Может, это и нужно Пустоте. Что-то, что держит.`,"story.holds_3":`Меня ничто не держит. Сколько ни пытайся. Всё, чего я касаюсь, распускается.`,"story.holds_4":`Только не звёздный шёлк.`,"story.the-heart_1":`Последняя лестница. Красная нить здесь повсюду, обвязана вокруг каждой колонны.`,"story.the-heart_2":`Mira? Нет. Нет, возвращайся наверх. Оно тебя распустит.`,"story.the-heart_3":`Мама! У меня бабушкина катушка. Я пришла доткать твоё полотно.`,"story.the-heart_4":`Пустота внутри моих узлов. Три петли, Mira. Затяни её трижды — и она удержится.`,"story.the-heart_5":`Другой конец у меня, девочка. Я не отпущу.`,"story.eleven-stars_1":`Петля затягивается туже и туже, и узел тьмы становится узлом света.`,"story.eleven-stars_2":`Ох. Держит. Меня... держат.`,"story.eleven-stars_3":`Новый узел в небе, Mira. Одиннадцатая звезда. Ей нужно имя.`,"story.eleven-stars_4":`Её зовут...`,"story.eleven-stars_4_oda":`Oda — та, что не отпустила.`,"story.eleven-stars_4_oda_1":`Меня? Ох, глупышка. Ладно. Свети ярко.`,"story.eleven-stars_4_wick":`Wick — тот, кто остался.`,"story.eleven-stars_4_wick_1":`Звезду назвали в честь мотылька! Все мотыльки мира прилетят в гости.`,"story.eleven-stars_4_lena":`Lena — та, что пошла первой.`,"story.eleven-stars_4_lena_1":`Тогда я всегда буду знать, какая из них моя.`,"story.eleven-stars_5":`Бабушка Oda вытягивает их домой. Над Lanternmere — одиннадцать звёзд.`,"story.below_1":`Mira, нить всё ещё тянет. Вниз.`,"story.below_2":`Ниже лежит станок постарше. Там кто-то вяжет узлы.`,"story.below_3":`Тогда я их развяжу.`,"story.underloom_1":`С потолка здесь свисают старые нити, и каждая затянута узлом.`,"story.underloom_2":`Вязальщики. Они вяжут нить в узлы, чтобы она никуда не дотянулась.`,"story.underloom_3":`Узел крадёт длину нити, девочка. Пройди по нему обратно — и он развяжется.`,"story.underloom_4":`Кто научил их вязать узлы?`,"story.underloom_5":`Тот, кто боялся отпускать.`,"story.burrows_1":`Пол вздымается. Под камнями что-то плывёт, как рыба подо льдом.`,"story.burrows_2":`Землерои! Нить не огородит то, что проходит под ней.`,"story.burrows_3":`Тогда ждём, пока они вылезут. А ты ослепишь их вспышкой, Wick.`,"story.burrows_4":`Вспыхивать — это у меня получается лучше всего!`,"story.lampless_1":`Здесь внизу никогда не зажигали ламп. Ни одной.`,"story.lampless_2":`Старые ткачи прятали здесь то, что боялись потерять. Привязывали, чтобы оно осталось.`,"story.lampless_3":`Моя бабушка работала на таком станке. Говорили, она привязала к нему собственную тень.`,"story.lampless_4":`Мать узлов — это... родня?`,"story.lampless_5":`Здесь внизу каждый кому-то родной, Mira.`,"story.unspun_1":`Маленькая ткачиха. Ты пришла забрать то, что я храню.`,"story.unspun_2":`Ты держишь всё на привязи, чтобы ничего не ушло. Даже звёзды.`,"story.unspun_3":`Всё, что я отпускаю, распускает тьма. Я потеряла слишком много.`,"story.unspun_4":`Она не злится. Ей страшно, как было Пустоте.`,"story.unspun_5":`Что мне ей сказать?`,"story.unspun_5_gentle":`Нить может держать и без узла.`,"story.unspun_5_gentle_1":`Такой нити не бывает.`,"story.unspun_5_firm":`Тогда я сама тебя развяжу.`,"story.unspun_5_firm_1":`Попробуй, маленькая ткачиха.`,"story.loose-ends_1":`Четыре петли, и узлы Матери узлов один за другим распускаются.`,"story.loose-ends_2":`Они... уходят. И ничего не распускается.`,"story.loose-ends_3":`Нити, которую кто-то держит, не нужен узел. Мою держит бабушка.`,"story.loose-ends_4":`Тогда подержи мою, маленькая ткачиха. Хоть немного.`,"story.loose-ends_5":`Ты правильно сделала, что была строга. Я вязала слишком туго и слишком долго.`,"story.loose-ends_6":`Подними её наверх, Mira. В небе найдётся место ещё для одного огонька.`,"story.loose-ends_7":`Над Lanternmere старые нити ловят звёздный свет. И каждая из них держит.`},tr:{"title.descend":`İn · Derinlik {n}`,"title.deepDive":`Derin Dalış`,"title.named":`{name} yıldızı Lanternmere üzerinde parlıyor.`,"title.home":{one:`{total} yıldızın {n} tanesi evde.`,other:`{total} yıldızın {n} tanesi evde.`},"title.tagline":`Yıldızlar labirente düştü. Onları eve getirin.`,"title.glimmer":`{n} pırıltı`,"title.loom":`Tezgâh`,"title.depths":`Derinlikler`,"title.soundOn":`Ses açık`,"title.soundOff":`Ses kapalı`,"title.musicOn":`Müzik açık`,"title.musicOff":`Müzik kapalı`,"depths.title":`Derinlikler`,"depths.note":`★ yıldızla eve dönün · ★ karaltıları yakalayın · ★ can kaybetmeyin`,"depths.locked":`Derinlik {n}`,"depths.unlock":`{n}. derinliği geçin`,"depths.next":`Sıradaki`,"depths.boss":`Boss`,"depths.bossNext":`Boss · sıradaki`,"depths.deep":`Derin Dalışlar`,"depths.best":`En iyi: {n}. dalış`,"depth.d1":`Kiler Merdiveni`,"depth.d2":`Yosun Galerileri`,"depth.d3":`Kırmızı Düğüm`,"depth.d4":`Makas Salonları`,"depth.d5":`Bekçi`,"depth.d6":`Ağlayan Sular`,"depth.d7":`Sürüklenti`,"depth.d8":`Kemik Tezgâhı`,"depth.d9":`Işıksız Deniz`,"depth.d10":`Oyuk Kalp`,"depth.d11":`Alt Tezgâh`,"depth.d12":`Kazıcı Salonları`,"depth.d13":`Lambasız Yol`,"depth.d14":`Eğrilmemiş Merdiven`,"depth.d15":`Düğüm Ana`,"depth.deep":`Derin Dalış {n}`,"shop.title":`Tezgâh`,"shop.currency":`pırıltı`,"shop.spool.name":`Daha uzun ip`,"shop.spool.effect":`Makarada daha çok yıldız ipeği`,"shop.reel.name":`Yağlı makara`,"shop.reel.effect":`İple eve daha hızlı dönün; kıvılcımları daha uzaktan toplayın`,"shop.wire.name":`Telipek`,"shop.wire.effect":`İpinizi kesen, yiyen ya da düğümleyen gölgeler daha yavaş çalışır`,"shop.lamp.name" ":`Bir kemirgen! Kemirmeyi bitirirse bütün ipi düğüme kadar yer.`,"tip.filcher":`Aşırıcılar yıldız çalar. Biri alırsa, geri almak için onu yakala!`,"tip.tangler":`Ağcılar kara ipek örer. O sönene kadar üstünden geçemezsin.`,"tip.cutterGlow":`Şu yıldız daha parlak yanıyor, görüyor musun? Bir şey ipini kemiriyor!`,"tip.knotter":`Bir düğümcü! Attığı her düğüm ipini kısaltır. Çözmek için düğümün üstünden geri yürü.`,"tip.burrower":`Kazıcılar ipin altından kazar. Zemin kabarınca uzaklaş, yukarı çıktıklarında halkaya al!`,"tip.flare":`Wick artık flaş çakabilir! Yakınındaki tüm gölgeleri sersemletmek için F'ye (ya da Flaş düğmesine) bas.`,"bark.snare1":`Yeniden dokundu!`,"bark.snare2":`Biri daha hatlarını hatırladı.`,"bark.snare3":`İşte benim kızım.`,"bark.snare4":`Bayram düğümü gibi sıkı.`,"bark.snare5":`Haydi bakalım, ışığa geri.`,"bark.snare6":`İp tutuyor.`,"bark.hollowDown":`Tutuyor! Yıldızı al, Mira!`,"bark.knotmotherDown":`Bıraktı! Son yıldızı eve götür.`,"bark.wardenDown":`Bekçi düştü! Yıldız serbest!`,"bark.star":`Yıldız! Şimdi eve: Sar'ı basılı tut.`,"bark.devour":`Bütün ipi yedi! Bağlanmak için düğüme dön.`,"bark.steal":`Yıldız bir aşırıcıda! Halkaya al!`,"hud.intro":`Yürümek için sürükleyin ya da WASD · ipte geri dönmek için Sar'ı (Boşluk) basılı tutun`,"hud.line":`Derinlik {n} · {name} — {goal}`,"hud.lineDeep":`{name} — {goal}`,"hud.thread":`Kalan ip`,"hud.pause":`Duraklat`,"hud.reel":`Sar`,"hud.reelAria":`İp boyunca geri sarın`,"hud.flash":`Flaş`,"hud.flashAria":`Wick'in flaşı: yakındaki gölgeleri sersemletin`,"goal.cut":`İpiniz kesildi! Bir şey alabilmek için kopuk uca yeniden bağlanın`,"goal.carry":`Yıldızı eve getirin: ipte geri dönmek için Sar'ı basılı tutun`,"goal.stolen":`Bir aşırıcı yıldızı aldı! Geri almak için onu yakalayın`,"goal.rule":`Bir karaltının çevresini dolaşıp kendi ipinizden geçerek onu yakalayın`,"goal.warden":`Bekçi'yi yakalayın: çevresini dolaşın ({hit}/{max})`,"goal.hollow":`Oyuk'u yakalayın: çevresini dolaşın ({hit}/{max})`,"goal.knotm
