:where(#gp-shop) { --gp-shop-bg: #fff8ec; --gp-shop-ink: #2b1d10; --gp-shop-muted: #6b5a48; --gp-shop-card: #ffffff;
  --gp-shop-accent: #1f8a4c; --gp-shop-accent-ink: #ffffff; --gp-shop-off: #d8cfc2; --gp-shop-best: #ffcf33; }
#gp-shop { color: var(--gp-shop-ink); background: var(--gp-shop-bg); border-radius: 18px; padding: 14px; box-sizing: border-box;
  width: min(96vw, 620px); max-height: 94vh; display: flex; flex-direction: column; gap: 10px; pointer-events: auto;
  font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; text-align: left; }
#gp-shop header { display: flex; align-items: center; gap: 10px; }
#gp-shop h2 { margin: 0; font-size: 22px; flex: 1; }
#gp-shop .gp-balance { font-size: 20px; font-weight: 800; }
#gp-shop .gp-complete { font-size: 12px; color: var(--gp-shop-muted); }
#gp-shop .gp-bar { height: 8px; border-radius: 4px; background: var(--gp-shop-off); overflow: hidden; }
#gp-shop .gp-bar > i { display: block; height: 100%; background: var(--gp-shop-accent); }
#gp-shop .gp-amounts { display: flex; gap: 8px; }
#gp-shop button { font: inherit; border: 0; border-radius: 999px; cursor: pointer; touch-action: manipulation;
  min-width: 0; margin: 0; padding: 0 12px; box-shadow: none; text-transform: none; letter-spacing: normal; }
#gp-shop .gp-amounts button { flex: 1; background: var(--gp-shop-card); color: var(--gp-shop-ink); box-shadow: inset 0 0 0 2px var(--gp-shop-off); }
#gp-shop .gp-amounts button[aria-pressed=true] { box-shadow: inset 0 0 0 3px var(--gp-shop-ink); font-weight: 800; }
#gp-shop .gp-list { overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
#gp-shop .gp-card { background: var(--gp-shop-card); border-radius: 14px; padding: 10px; display: grid; gap: 4px 10px;
  grid-template-columns: auto 1fr auto; grid-template-areas: 'icon name buy' 'icon info buy' 'icon state buy'; align-items: center; }
#gp-shop .gp-card .gp-icon { grid-area: icon; font-size: 28px; width: 40px; text-align: center; }
#gp-shop .gp-card .gp-icon > img, #gp-shop .gp-card .gp-icon > svg, #gp-shop .gp-card .gp-icon > canvas { width: 36px; height: 36px; object-fit: contain; vertical-align: middle; }
#gp-shop .gp-card .gp-name { grid-area: name; font-weight: 800; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#gp-shop .gp-card .gp-info { grid-area: info; font-size: 13px; color: var(--gp-shop-muted); }
#gp-shop .gp-card .gp-state { grid-area: state; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
#gp-shop .gp-card .gp-buy { grid-area: buy; background: var(--gp-shop-accent); color: var(--gp-shop-accent-ink); padding: 0 16px; font-weight: 800; }
#gp-shop .gp-card .gp-buy[aria-disabled=true] { background: var(--gp-shop-off); color: var(--gp-shop-muted); }
#gp-shop .gp-tag { background: var(--gp-shop-best); color: #2b1d10; border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 800; }
#gp-shop .gp-pips { letter-spacing: 1px; }
#gp-shop .gp-undo { align-self: center; background: transparent; color: var(--gp-shop-ink); text-decoration: underline; }
#gp-shop .gp-back { background: var(--gp-shop-ink); color: var(--gp-shop-bg); padding: 0 18px; }
#gp-shop .gp-card { min-width: 0; }
#gp-shop [hidden] { display: none !important; }
/* Eight cards without scrolling on phones (the layout Germ Bait, QmaCyber/game6, found for 360×800 and 800×360).
   Tall screens: two columns of upright cards */
@media (max-aspect-ratio: 4/5) {
  #gp-shop { max-height: 98vh; padding: 8px; gap: 6px; }
  #gp-shop h2 { font-size: 20px; }
  #gp-shop .gp-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  #gp-shop .gp-card { grid-template-columns: auto 1fr; grid-template-areas: 'icon name' 'info info' 'state state' 'buy buy'; padding: 5px 7px 7px; gap: 1px 6px; }
  #gp-shop .gp-card .gp-icon { font-size: 20px; width: auto; }
  #gp-shop .gp-card .gp-icon > img, #gp-shop .gp-card .gp-icon > svg, #gp-shop .gp-card .gp-icon > canvas { width: 24px; height: 24px; }
  #gp-shop .gp-card .gp-name { font-size: 14px; }
  #gp-shop .gp-card .gp-info, #gp-shop .gp-card .gp-state { font-size: 12px; }
}
/* Wide screens: two columns */
@media (min-aspect-ratio: 5/4) {
  #gp-shop { width: min(96vw, 980px); }
  #gp-shop .gp-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* A phone on its side: one top row (title, amounts, back), then four columns of cards */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-shop { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto 1fr; padding: 6px 10px; gap: 5px 10px; max-height: 98vh; }
  #gp-shop > header { grid-area: 1 / 1; }
  #gp-shop > .gp-complete { display: none; }
  #gp-shop > .gp-bar { grid-area: 2 / 1 / 3 / 4; }
  #gp-shop > .gp-pick { grid-area: 1 / 2; }
  #gp-shop > .gp-list { grid-area: 3 / 1 / 4 / 4; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  #gp-shop > .gp-foot { grid-area: 1 / 3; }
  #gp-shop .gp-card { grid-template-columns: 1fr; grid-template-areas: 'name' 'info' 'state' 'buy'; padding: 5px 8px 7px; gap: 1px; }
  #gp-shop .gp-card .gp-icon { display: none; }
  #gp-shop .gp-card .gp-name { font-size: 13px; }
  #gp-shop .gp-card .gp-info, #gp-shop .gp-card .gp-state { font-size: 12px; }
  #gp-shop h2 { font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-shop .gp-pop { animation: gp-pop 0.22s ease-out; }
  #gp-shop .gp-deny { animation: gp-deny 0.3s ease-in-out; }
}
@keyframes gp-pop { 50% { transform: scale(1.08); } }

#gp-dialog { --gp-dlg-bg: #fff8ec; --gp-dlg-ink: #2b1d10; --gp-dlg-muted: #6b5a48; --gp-dlg-edge: #8a5a3a;
  --gp-dlg-btn: #ffffff; --gp-dlg-accent: #2b1d10; --gp-dlg-accent-ink: #fff8ec; --gp-dlg-speaker: #8a5a3a;
  position: fixed; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom)); margin: 0 auto; z-index: 20;
  width: min(720px, calc(100vw - 12px)); box-sizing: border-box; pointer-events: auto; touch-action: manipulation;
  display: flex; flex-direction: column; gap: 8px; padding: 18px 12px 10px; text-align: left; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  color: var(--gp-dlg-ink); background: var(--gp-dlg-bg); border: 3px solid var(--gp-dlg-edge); border-radius: 18px;
  box-shadow: 0 8px 28px #0008; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; }
#gp-dialog[hidden], #gp-dialog [hidden] { display: none !important; }
#gp-dialog .gp-row, #gp-dialog .gp-actions, #gp-dialog .gp-face, #gp-dialog .gp-live { font-size: 15px; }
#gp-dialog .gp-typed, #gp-dialog .gp-rest, #gp-dialog .gp-label { font: inherit; }
#gp-dialog .gp-plate { position: absolute; top: -14px; left: 14px; max-width: calc(100% - 28px); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; background: var(--gp-dlg-speaker); color: #fff; font-size: 14px; font-weight: 800;
  line-height: 1.2; padding: 4px 12px; border-radius: 9px; box-shadow: 0 2px 0 #0003; }
#gp-dialog .gp-badge { position: absolute; top: -12px; right: 14px; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; background: var(--gp-dlg-ink); color: var(--gp-dlg-bg); font-size: 12px; font-weight: 700;
  padding: 3px 9px; border-radius: 8px; }
#gp-dialog.gp-has-plate .gp-badge { max-width: 40%; }
#gp-dialog .gp-row { display: flex; gap: 10px; align-items: flex-start; min-height: 0; }
#gp-dialog .gp-face { font-size: 36px; line-height: 58px; text-align: center; flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin-top: -6px;
  border: 3px solid var(--gp-dlg-speaker); box-sizing: border-box; background: #fff; }
#gp-dialog .gp-face > canvas, #gp-dialog .gp-face > img, #gp-dialog .gp-face > svg { width: 100%; height: 100%; display: block; }
#gp-dialog .gp-text { flex: 1; min-width: 0; font: 500 17px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif;
  max-height: calc(1.35em * 5); overflow-y: auto; overflow-wrap: anywhere; }
#gp-dialog.gp-narrator .gp-text { font-style: italic; color: var(--gp-dlg-muted); }
#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;
  box-shadow: none; text-transform: none; letter-spacing: normal; text-align: center; opacity: 1; filter: none;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--gp-dlg-ink); background: var(--gp-dlg-btn); }
#gp-dialog button.gp-choice { flex: 1 1 100%; justify-content: flex-start; text-align: left; box-shadow: inset 0 0 0 2px var(--gp-dlg-edge); }
#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }
#gp-dialog button.gp-skip { order: 1; background: transparent; color: var(--gp-dlg-muted); font-size: 14px; text-decoration: underline; padding: 4px 10px; }
#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}
/* A phone on its side: a compact sheet, ≤ 45% of the height (three lines of text and one row of buttons) */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-dialog { bottom: max(4px, env(safe-area-inset-bottom)); padding: 14px 10px 6px; gap: 5px; border-width: 2px; }
  #gp-dialog .gp-text { font-size: 16px; line-height: 1.3; max-height: calc(1.3em * 3); }
  #gp-dialog .gp-face { width: 52px; height: 52px; margin-top: -8px; font-size: 30px; line-height: 46px; }
  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-dialog:not([hidden]) { animation: gp-dlg-in 0.18s ease-out; }
}
@keyframes gp-dlg-in { from { transform: translateY(12px); opacity: 0; } }

`},{who:`wick`,text:`I'm scared. I'm staying anyway.`,if:`not trust`}]},eleventh:{title:`The Eleventh Star`,at:`run-end`,when:`cleared >= 7`,lines:[`oda/sad: Mira. I have to tell you something before you meet it.`,`oda: When I was young, we wove the net. There were eleven stars, and room for ten.`,`oda: The eleventh fell. We said it had burned out. Nobody went down to look.`,`mira/surprised: You left it alone in the dark.`,`oda/sad: We were afraid. Your mother wasn't. She went down to weave it a place.`]},holds:{title:`What Holds`,at:`run-end`,when:`cleared >= 8`,lines:[`wick: The drifters walk through walls, but even they stop at your thread.`,`mira: Everything stops at the thread. Maybe that's what the Hollow needs. Something that holds.`,`hollow: Nothing holds me. I have tried. Everything I touch unravels.`,`mira: Not starsilk.`]},"the-heart":{title:`The Heart`,at:`run-end`,when:`cleared >= 9`,lines:[`The last stair. Red thread runs everywhere here, knotted round every pillar.`,`lena/worried: Mira? No. No, go back up. It will unravel you.`,`mira/happy: Mum! I have Grandma's spool. I've come to finish your weaving.`,`lena: The Hollow is inside my knots. Three loops, Mira. Tie it three times and it will hold.`,`oda/worried: I have the other end, girl. I won't let go.`]},"eleven-stars":{title:`Eleven Stars`,at:`run-end`,when:`cleared >= 10`,lines:[`The loop pulls tight, and tighter, and the knot of dark becomes a knot of light.`,`hollow/surprised: Oh. It holds. I am... held.`,`lena/happy: A new knot in the sky, Mira. The eleventh star. It needs a name.`,{who:`mira`,text:`Its name is...`,choose:[{id:`oda`,text:`Oda, who held on.`,then:[`oda/happy: Me? Oh, you silly girl. Fine. Shine well.`]},{id:`wick`,text:`Wick, who stayed.`,then:[`wick/happy: A star named after a moth! Every moth in the world will visit.`]},{id:`lena`,text:`Lena, who went first.`,then:[`lena/happy: Then I'll always know which one is mine.`]}]},`Grandma Oda reels them home. Above Lanternmere, eleven stars.`]}}},hr=e=>`

  color: #1b1330; background: linear-gradient(#ffe08a, #ffc94d 60%, #e8a73a); box-shadow: 0 3px 0 #8a5a1a, 0 0 0 2px #0d0b1c;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
#ui button.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a5a1a, 0 0 0 2px #0d0b1c; }
#ui button.btn.alt { color: #f4ecff; background: linear-gradient(#3e3572, #2d2758); box-shadow: 0 3px 0 #15112e, 0 0 0 2px #0d0b1c; }
#ui button.btn[disabled], #ui button.btn[aria-disabled=true] { opacity: 0.6; cursor: default; }
#ui button.icon { min-width: ${e}px; width: ${e}px; padding: 0; }
#ui button svg { width: 24px; height: 24px; flex: none; }
#ui .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff5a6e; box-shadow: 0 0 0 2px #0d0b1c; }
#ui .stars { display: flex; gap: 6px; justify-content: center; }
#ui .stars svg { width: 28px; height: 28px; }
#ui .rating { display: grid; gap: 4px 10px; grid-template-columns: auto 1fr; align-items: center; text-align: left; font-size: 15px; }
#ui .rating svg { width: 24px; height: 24px; }
#ui .pair { display: grid; grid-auto-rows: 1fr; gap: 10px; width: 100%; }
#ui .pair button.btn { width: 100%; }
#ui .gain { font-size: 20px; color: #ffe08a; }
/* Sheets: the Depths and the Loom share one look — a framed sheet, the title left and its count right, a bar, a list
   of cards, Back at the foot (on a phone on its side: Back up in the title row). The Loom is the platform's shop,
   restyled at the end of this sheet to match. */
#ui .sheet, body #gp-shop { background: #14112bf4; border: 2px solid #ffc94d; border-radius: 6px;
  box-shadow: 0 0 0 2px #0d0b1c, 0 0 0 5px #3e3160, 0 10px 40px #000a; }
#ui .sheet { pointer-events: auto; box-sizing: border-box; width: min(96vw, 620px); max-height: 94vh; padding: 14px;
  display: flex; flex-direction: column; gap: 10px; text-align: left; }
#ui .sheet header { display: flex; align-items: center; gap: 10px; }
#ui .sheet h2 { flex: 1; }
#ui .sheet .count { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
#ui .sheet .count svg { width: 22px; height: 22px; }
#ui .sheet .note { font-size: 12px; color: #b9b0d8; }
#ui .sheet .bar { height: 8px; border-radius: 4px; background: #3e3572; overflow: hidden; flex: none; }
#ui .sheet .bar i { display: block; height: 100%; background: #ffc94d; }
#ui .sheet .list { overflow: auto; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-right: 2px; }
#ui .sheet .back { width: 100%; flex: none; }
#ui button.dcard { min-height: ${Math.max(e,64)}px; min-width: 0; width: 100%; padding: 8px 10px; border-radius: 6px;
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: 'num name' 'num meta'; gap: 2px 10px; align-items: center;
  justify-items: start; text-align: left; color: #f4ecff; background: #2a2550; box-shadow: none; font-size: 16px; }
#ui button.dcard:active { transform: translateY(1px); box-shadow: none; }
#ui button.dcard .num { grid-area: num; width: 40px; display: flex; justify-content: center; font: 700 30px/1 Georgia, 'Times New Roman', serif; color: #ffe08a; }
#ui button.dcard .num svg { width: 22px; height: 22px; color: #b9b0d8; }
#ui button.dcard .name { grid-area: name; font-weight: 800; }
#ui button.dcard .meta { grid-area: meta; display: flex; gap: 8px; align-items: center; min-height: 16px; font-size: 13px; font-weight: 600; color: #b9b0d8; }
#ui button.dcard .stars { gap: 2px; }
#ui button.dcard .stars svg { width: 16px; height: 16px; }
#ui button.dcard.next { box-shadow: inset 0 0 0 2px #ffc94d; }
#ui button.dcard.next .meta { color: #ffe08a; }
#ui button.dcard[disabled] { opacity: 0.55; }
/* Tall screens: upright cards, the number beside the name, the stars under both (like the Loom's cards there) */
@media (max-aspect-ratio: 4/5) {
  #ui .sheet { max-height: 98vh; padding: 8px; gap: 6px; }
  #ui .sheet .list { gap: 5px; }
  #ui button.dcard { grid-template-areas: 'num name' 'meta meta'; padding: 6px 8px 8px; gap: 4px 6px; font-size: 14px; }
  #ui button.dcard .num { width: auto; font-size: 22px; }
  #ui button.dcard .meta { font-size: 12px; }
}
@media (min-aspect-ratio: 5/4) {
  #ui .sheet { width: min(96vw, 980px); }
  #ui .sheet .list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #ui .sheet { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto 1fr; padding: 6px 10px; gap: 5px 10px; max-height: 98vh; }
  #ui .sheet > header { grid-area: 1 / 1; justify-self: start; }
  #ui .sheet > header h2 { flex: none; }
  #ui .sheet > .note { display: none; }
  #ui .sheet > .bar { grid-area: 2 / 1 / 3 / 3; }
  #ui .sheet > .list { grid-area: 3 / 1 / 4 / 3; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  #ui .sheet > .back { grid-area: 1 / 2; width: auto; }
  #ui button.dcard { min-height: ${e}px; padding: 5px 8px; gap: 1px 8px; font-size: 14px; }
  #ui button.dcard .num { width: 28px; font-size: 22px; }
}
/* HUD */
#ui .hud { position: fixed; top: max(6px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; pointer-events: none; text-shadow: 0 2px 0 #000, 0 0 6px #000; }
#ui .hud .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#ui .hud .hearts { display: flex; gap: 3px; }
#ui .hud .hearts img { width: 21px; height: 21px; image-rendering: pixelated; }
#ui .hud .glim { display: flex; align-items: center; gap: 4px; font-size: 18px; color: #ffe08a; }
#ui .hud .glim img { width: 21px; height: 21px; image-rendering: pixelated; }
#ui .hud .meter { width: min(42vw, 220px); height: 12px; border: 2px solid #0d0b1c; background: #2a2347; border-radius: 3px; position: relative; overflow: hidden; }
#ui .hud .meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#fff1a8, #ffc94d); }
#ui .hud .meter.taut i { background: linear-gradient(#ffb18a, #ff6a4d); }
#ui .hud .meter.cut i { background: repeating-linear-gradient(90deg, #ffc94d 0 6px, transparent 6px 10px); }
#ui .hud .goal { grid-column: 1 / -1; font-size: 14px; color: #e9e2ff; text-align: left; }
#ui .hud .right { display: flex; gap: 8px; pointer-events: auto; }
#ui button.reel { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
  width: ${Math.max(e,76)}px; height: ${Math.max(e,76)}px; min-width: 0; border-radius: 50%; padding: 0; pointer-events: auto;
  flex-direction: column; gap: 0; font-size: 13px; touch-action: none; }
#ui button.reel svg { width: 30px; height: 30px; }
#ui button.reel.on { filter: brightness(1.25); transform: scale(0.95); }
#ui .bark { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(6px, env(safe-area-inset-top)) + 76px);
  max-width: min(88vw, 460px); display: flex; gap: 8px; align-items: center; background: #14112bdd; border: 2px solid #ffc94d;
  border-radius: 6px; padding: 6px 10px 6px 6px; font-size: 15px; text-align: left; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
#ui .bark.on { opacity: 1; }
#ui .bark img { width: 36px; height: 36px; image-rendering: pixelated; border-radius: 4px; background: #0d0b1c; flex: none; }
#ui .float { position: fixed; transform: translate(-50%, -100%); font: 800 16px 'Trebuchet MS', system-ui, sans-serif; color: #ffe08a;
  text-shadow: 0 2px 0 #000, 0 0 8px #000; pointer-events: none; white-space: nowrap; animation: st-rise 1.1s ease-out forwards; }
#ui .float.big { font-size: 24px; color: #fff1a8; }
#ui .float.bad { color: #ff7a8a; }
@keyframes st-rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -36px; } }
#ui .named { color: #fff1a8; font-size: 15px; }
/* Short screens: tighter panels */
@media (max-height: 520px) {
  #ui .panel { padding: 10px 16px; gap: 6px; }
  #ui h1 { font-size: clamp(34px, 12vmin, 60px); }
  #ui h2, body #gp-shop h2 { font-size: 22px; }
  #ui .bark { top: calc(max(6px, env(safe-area-inset-top)) + 58px); }
}
/* The platform's dialogue sheet and shop in the game's colours */
body #gp-dialog { --gp-dlg-bg: #1b1838; --gp-dlg-ink: #f4ecff; --gp-dlg-muted: #b9b0d8; --gp-dlg-edge: #ffc94d; --gp-dlg-btn: #2d2a55;
  --gp-dlg-accent: #ffc94d; --gp-dlg-accent-ink: #1b1330; --gp-dlg-speaker: #6d4c9e; border-radius: 6px; }
body #gp-dialog .gp-face { background: #0d0b1c; border-radius: 6px; }
body #gp-dialog .gp-face img { image-rendering: pixelated; }
body #gp-shop { --gp-shop-bg: #14112bf4; --gp-shop-ink: #f4ecff; --gp-shop-muted: #b9b0d8; --gp-shop-card: #2a2550; --gp-shop-accent: #ffc94d;
  --gp-shop-accent-ink: #1b1330; --gp-shop-off: #3e3572; --gp-shop-best: #7fe0c0; font-family: 'Trebuchet MS', system-ui, -apple-system, 'Segoe UI', sans-serif; }
body #gp-shop h2 { font: 700 26px/1.1 Georgia, 'Times New Roman', serif; color: #ffe08a; text-shadow: 0 2px 0 #6b4412; }
body #gp-shop .gp-card { border-radius: 6px; }
body #gp-shop button { border-radius: 6px; }
body #gp-shop .gp-card .gp-buy { background: linear-gradient(#ffe08a, #ffc94d 60%, #e8a73a); box-shadow: 0 3px 0 #8a5a1a, 0 0 0 2px #0d0b1c; }
body #gp-shop .gp-card .gp-buy[aria-disabled=true] { background: #3e3572; color: #b9b0d8; box-shadow: 0 0 0 2px #0d0b1c; }
body #gp-shop .gp-foot .gp-back { display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 18px 'Trebuchet MS', system-ui, sans-serif;
  color: #f4ecff; background: linear-gradient(#3e3572, #2d2758); box-shadow: 0 3px 0 #15112e, 0 0 0 2px #0d0b1c; }
body #gp-shop .gp-foot .gp-back svg { width: 24px; height: 24px; flex: none; }
body #gp-shop .gp-icon img { width: 36px; height: 36px; image-rendering: pixelated; vertical-align: middle; }
body #gp-shop .gp-amounts[hidden] { display: none; }
@media (max-aspect-ratio: 4/5) { body #gp-shop .gp-icon img { width: 24px; height: 24px; } }
