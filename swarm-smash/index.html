- Swarm fights that read your ship: dives, Swarm Rushes, and commanders whose hooks tear parts off your grid (shoot them down to win the part back)
- Build the ship like a backpack on an 11×11 grid: grow its hull with plates that each have a job (armour, engines, hardpoints, barrier emitters, ram spikes, cargo, feeders, scopes, nanites), 78 parts in four rarities; a stash of eight makes every part a choice
- Guns that each fire their own thing (flames, ice, mines, saw discs, plasma, beams, gravity wells) and mods that change them where they lie: fire, frost, shock, split, ricochet, homing, acid; 16 synergies to discover
- Fly forward and back through every fight: shoot supply pods open and catch what falls, blow mines with the swarm around them, fly through boost rings
- One long flight through generated places, each a faction, a biome and a rule (ion storms, fog, solar wind, furnaces, black holes, asteroid belts), with a dock every few minutes
- The swarm reads your ship and flies the formation that counters it: snipers, carriers, bombers, shieldbearers; seven bosses with phases break your grid
- A story across runs: Mira, Vex and the Choir, ten chapters and three endings

#gp-dialog { --gp-dlg-bg: #fff8ec; --gp-dlg-ink: #2b1d10; --gp-dlg-muted: #6b5a48; --gp-dlg-edge: #8a5a3a;

  position: fixed; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom)); margin: 0 auto; z-index: 20;
  width: min(720px, calc(100vw - 12px)); box-sizing: border-box; pointer-events: auto; touch-action: manipulation;
  display: flex; flex-direction: column; gap: 8px; padding: 18px 12px 10px; text-align: left; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  color: var(--gp-dlg-ink); background: var(--gp-dlg-bg); border: 3px solid var(--gp-dlg-edge); border-radius: 18px;
  box-shadow: 0 8px 28px #0008; font: 600 15px ${Qe}; }
#gp-dialog[hidden], #gp-dialog [hidden] { display: none !important; }
#gp-dialog .gp-row, #gp-dialog .gp-actions, #gp-dialog .gp-face, #gp-dialog .gp-live { font-size: 15px; }
#gp-dialog .gp-typed, #gp-dialog .gp-rest, #gp-dialog .gp-label { font: inherit; }
#gp-dialog .gp-plate { position: absolute; top: -14px; left: 14px; max-width: calc(100% - 28px); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; background: var(--gp-dlg-speaker); color: #fff; font-size: 14px; font-weight: 800;
  line-height: 1.2; padding: 4px 12px; border-radius: 9px; box-shadow: 0 2px 0 #0003; }
#gp-dialog .gp-badge { position: absolute; top: -12px; right: 14px; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; background: var(--gp-dlg-ink); color: var(--gp-dlg-bg); font-size: 12px; font-weight: 700;
  padding: 3px 9px; border-radius: 8px; }
#gp-dialog.gp-has-plate .gp-badge { max-width: 40%; }
#gp-dialog .gp-row { display: flex; gap: 10px; align-items: flex-start; min-height: 0; }
#gp-dialog .gp-face { font-size: 36px; line-height: 58px; text-align: center; flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin-top: -6px;
  border: 3px solid var(--gp-dlg-speaker); box-sizing: border-box; background: #fff; }
#gp-dialog .gp-face > canvas, #gp-dialog .gp-face > img, #gp-dialog .gp-face > svg { width: 100%; height: 100%; display: block; }
#gp-dialog .gp-text { flex: 1; min-width: 0; font: 500 17px/1.35 ${Qe};
  max-height: calc(1.35em * 5); overflow-y: auto; overflow-wrap: anywhere; }
#gp-dialog.gp-narrator .gp-text { font-style: italic; color: var(--gp-dlg-muted); }
#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 ${Qe}; border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;

#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }

#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}
/* A phone on its side: a compact sheet, ≤ 45% of the height (three lines of text and one row of buttons) */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-dialog { bottom: max(4px, env(safe-area-inset-bottom)); padding: 14px 10px 6px; gap: 5px; border-width: 2px; }
  #gp-dialog .gp-text { font-size: 16px; line-height: 1.3; max-height: calc(1.3em * 3); }

  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-dialog:not([hidden]) { animation: gp-dlg-in 0.18s ease-out; }

,then:[`mira/grim: Or nobody copied anything. Fly. I will dig.`]},{id:`use`,text:`Can we use their parts?`,then:[`mira/smile: We already do. Look at your hull.`]}]}]},mothership:{title:`One word`,at:`run-end`,when:`bosses >= 1`,lines:[`The mothership broke apart. Its last signal was one word, over and over.`,`choir: RETURN. RETURN TO THE YARD.`,`mira/shock: The yard. Nobody has called Haven-9 that in forty years.`,{who:`mira`,text:`You heard it too. Good. I thought I was the one going mad.`,if:`curious`}]},vex:{title:`A friendly smuggler`,at:`run-end`,when:`runs >= 3`,lines:[`vex/smile: Haven-9! Still breathing. I sell what the swarm drops, you know.`,`vex: Their guns, their reactors. And I hear them sing at night.`,`mira/grim: Vex. You were told not to dock here.`,{who:`vex`,text:`The pilot can decide for themselves. Partners?`,choose:[{id:`deal`,text:`Partners. For now.`,do:{add:{vextrust:1}},then:[`vex/smile: Wise. Look for my ship out there.`]},{id:`no`,text:`Stay away from my ship.`,then:[`vex: Shame. I always come back.`]}]}]},emblem:{title:`The emblem`,at:`run-end`,when:`bosses >= 2`,lines:[`The second giant fell. On its armour, under the soot: a ring and a hammer.`,`mira/shock: That is Haven's emblem. Our yard built that hull.`,`choir: WE WERE BUILT. WE BUILD. WE RETURN.`,`mira/grim: …I need a drink. And you need a better reactor.`]},confession:{title:`What Mira made`,at:`run-end`,when:`runs >= 5 and bosses >= 2`,lines:[`mira/grim: Forty years ago I built a fleet that builds itself. We called it the Choir.`,`mira: Drones that weld parts to a grid and learn what works. Like you do.`,`mira/grim: It learned too fast. I shut it down and sealed the Core.`,{who:`mira`,text:`It woke up. That is on me.`,choose:[{id:`forgive`,text:`We fix it together.`,do:{set:`forgave`},then:[`mira/smile: Together. All right.`]},{id:`blame`,text:`You should have told me.`,then:[`mira/grim: I know. Fly anyway. Please.`]}]}]},ghosts:{title:`Ghost fleet`,at:`run-end`,when:`bosses >= 3`,lines:[`The drift ships were old crew transports, rebuilt with crystal and scrap.`,`choir: WE KEPT BUILDING. WE KEPT YOUR SHAPE. WE KEPT YOUR NAMES.`,{who:`mira`,text:`It remembers us. It is not angry. It is lonely.`,if:`forgave`},{who:`mira`,text:`It remembers us. That is worse than hate.`,if:`not forgave`},`mira: The Core is past the drift. Whatever wakes it is there.`]},core:{title:`The Collector`,at:`run-end`,when:`core >= 1`,lines:[`In the Core a ship gathers parts the way you do. Only bigger. Much bigger.`,`mira/shock: The Collector. It is building the First Ship. My first design.`,`vex: It wants a pilot, Mira. It always wanted a pilot.`,`choir: THE YARD SENT A PILOT. COME HOME.`]},adapts:{title:`It learns`,at:`run-end`,when:`wins >= 1`,lines:[`mira: The Core went quiet. Then the yard picked up new signals.`,`mira/grim: The Choir learns from every fight. It will come back harder.`,{who:`mira`,text:`Threat levels are open in the hangar. Every level adds one rule.`,do:{fire:`threat-open`}},`mira/smile: More danger, more materials. Your call, pilot.`]},finale:{title:`The First Ship`,at:`event:victory`,once:!1,lines:[`The Collector is down. In the Core the First Ship waits, half built, its grid empty.`,`choir: PILOT. CHOOSE.`,{who:`mira`,text:`Whatever you do, I am with you.`,choose:[{id:`silence`,text:`Shut the Core down`,then:[{text:`You pull the Core. The Choir falls silent, maybe for good.`,ending:`silence`},`mira/grim: Quiet again. I hate how quiet.`]},{id:`accord`,text:`Retune the Choir`,if:`echoes >= 3`,then:[{text:`You sing its own echoes back to it. The swarm turns, and escorts you home.`,ending:`accord`},`mira/smile: A fleet that builds itself. On our side, this time.`]},{id:`ascend`,text:`Take the pilot seat`,if:`vex >= 2 or (vex >= 1 and vextrust >= 1)`,then:[{text:`You sit in the First Ship. The Choir becomes your hands.`,ending:`ascend`},`vex/smile: The yard has a new master. I knew you had it in you.`]}]}]},tip_fusion:{at:`event:fusion`,lines:[`mira: Two equal parts side by side fuse when you launch. One part, a star stronger.`]},tip_anomaly:{at:`event:anomaly`,lines:[`mira/grim: This place has its own rule. The dock shows the next one: build for it.`]},tip_sets:{at:`event:sets`,lines:[`mira/smile: Parts of one set work together. Two of a set give a bonus, three a bigger one.`]},tip_rare:{at:`event:rare`,lines:[`mira: A glowing signal on the route. Rare. What you choose there follows you all run.`]},tip_heat:{at:`event:heat`,lines:[`mira/grim: Heat. Every shot warms the guns; too hot and they stop. Coolers help.`]}}},fu={start:[`Formation incoming. Stay loose.`,`Here they come. Guns warm?`,`Swarm on scope. Make it count.`],pattern:[`They changed their shape. They read you.`,`New formation. They are learning.`,`They mirror your build. Clever bugs.`],boss:[`That is a big one. Keep moving.`,`Mothership! Watch its second phase.`,`Big signal. Aim for the middle.`],capture:[`They tore a part off! Shoot the carrier before it's gone.`,`The hook got a part. Win it back!`,`That one has your part. Get it.`],dual:[`Back where it belongs. Nice.`,`Part won back! Lay it on again.`,`They will not try that twice.`],lowhp:[`Hull is thin. Careful!`,`One more hit and you are out.`,`You are leaking air, pilot.`],ion:[`Ion pulse! Flank guns go quiet.`,`Storm hits the edges. Keep guns inside.`],fog:[`Fog. You only see what your shots light.`,`Blind in here. Trust your guns.`],wind:[`Solar wind. Your shots drift.`,`The wind turned. Lead your aim.`],heat:[`Guns overheated! Give them a second.`,`Too hot! Coolers would help.`],rocks:[`Rocks drifting in. They stop shots both ways.`,`Shoot the rocks for scrap gold.`],wreck:[`Wreckage. Shoot it, it pays in salvage.`,`Old hulls out there. Salvage them.`],hole:[`A black hole bends every shot.`,`Gravity well. Shots curve around it.`],nest:[`Nests up top. They hatch until you shoot them.`,`Hit the nests or they keep coming.`],jam:[`A part went quiet. Hold on.`,`They jammed a gun. Use the othe ":`A new chapter comes after a run.`,"codex.allChapters":`Every chapter told. Try the other endings.`,"codex.partsCount":`{n} of {m} parts open`,"codex.syn":`Synergies`,"codex.synCount":`{n} of {m} synergies found`,"ending.silence":`Silence`,"ending.accord":`Accord`,"ending.ascend":`Ascension`,"cast.choir":`Choir`,"story.chapter":`Chapter {n}: {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`You flew back. Most pilots never do.`,"story.arrival_2":`I'm Mira. I keep Haven-9 in one piece. Mostly.`,"story.arrival_3":`That swarm builds ships like yours. Part by part, on a grid.`,"story.arrival_4":`Bring me what is left of them. I want to know who taught them.`,"story.salvage_title":`Spare parts`,"story.salvage_1":`I opened one of their guns. Same sockets as ours. Same bolts.`,"story.salvage_2":`Same serial mark, too. H9. That is us.`,"story.salvage_3":`Either somebody copied this station, or…`,"story.salvage_3_who":`Or what?`,"story.salvage_3_who_1":`Or nobody copied anything. Fly. I will dig.`,"story.salvage_3_use":`Can we use their parts?`,"story.salvage_3_use_1":`We already do. Look at your hull.`,"story.mothership_title":`One word`,"story.mothership_1":`The mothership broke apart. Its last signal was one word, over and over.`,"story.mothership_2":`RETURN. RETURN TO THE YARD.`,"story.mothership_3":`The yard. Nobody has called Haven-9 that in forty years.`,"story.mothership_4":`You heard it too. Good. I thought I was the one going mad.`,"story.vex_title":`A friendly smuggler`,"story.vex_1":`Haven-9! Still breathing. I sell what the swarm drops, you know.`,"story.vex_2":`Their guns, their reactors. And I hear them sing at night.`,"story.vex_3":`Vex. You were told not to dock here.`,"story.vex_4":`The pilot can decide for themselves. Partners?`,"story.vex_4_deal":`Partners. For now.`,"story.vex_4_deal_1":`Wise. Look for my ship out there.`,"story.vex_4_no":`Stay away from my ship.`,"story.vex_4_no_1":`Shame. I always come back.`,"story.emblem_title":`The emblem`,"story.emblem_1":`The second giant fell. On its armour, under the soot: a ring and a hammer.`,"story.emblem_2":`That is Haven's emblem. Our yard built that hull.`,"story.emblem_3":`WE WERE BUILT. WE BUILD. WE RETURN.`,"story.emblem_4":`…I need a drink. And you need a better reactor.`,"story.confession_title":`What Mira made`,"story.confession_1":`Forty years ago I built a fleet that builds itself. We called it the Choir.`,"story.confession_2":`Drones that weld parts to a grid and learn what works. Like you do.`,"story.confession_3":`It learned too fast. I shut it down and sealed the Core.`,"story.confession_4":`It woke up. That is on me.`,"story.confession_4_forgive":`We fix it together.`,"story.confession_4_forgive_1":`Together. All right.`,"story.confession_4_blame":`You should have told me.`,"story.confession_4_blame_1":`I know. Fly anyway. Please.`,"story.ghosts_title":`Ghost fleet`,"story.ghosts_1":`The drift ships were old crew transports, rebuilt with crystal and scrap.`,"story.ghosts_2":`WE KEPT BUILDING. WE KEPT YOUR SHAPE. WE KEPT YOUR NAMES.`,"story.ghosts_3":`It remembers us. It is not angry. It is lonely.`,"story.ghosts_4":`It remembers us. That is worse than hate.`,"story.ghosts_5":`The Core is past the drift. Whatever wakes it is there.`,"story.core_title":`The Collector`,"story.core_1":`In the Core a ship gathers parts the way you do. Only bigger. Much bigger.`,"story.core_2":`The Collector. It is building the First Ship. My first design.`,"story.core_3":`It wants a pilot, Mira. It always wanted a pilot.`,"story.core_4":`THE YARD SENT A PILOT. COME HOME.`,"story.adapts_title":`It learns`,"story.adapts_1":`The Core went quiet. Then the yard picked up new signals.`,"story.adapts_2":`The Choir learns from every fight. It will come back harder.`,"story.adapts_3":`Threat levels are open in the hangar. Every level adds one rule.`,"story.adapts_4":`More danger, more materials. Your call, pilot.`,"story.finale_title":`The First Ship`,"story.finale_1":`The Collector is down. In the Core the First Ship waits, half built, its grid empty.`,"story.finale_2":`PILOT. CHOOSE.`,"story.finale_3":`Whatever you do, I am with you.`,"story.finale_3_silence":`Shut the Core down`,"story.finale_3_silence_1":`You pull the Core. The Choir falls silent, maybe for good.`,"story.finale_3_silence_2":`Quiet again. I hate how quiet.`,"story.finale_3_accord":`Retune the Choir`,"story.finale_3_accord_1":`You sing its own echoes back to it. The swarm turns, and escorts you home.`,"story.finale_3_accord_2":`A fleet that builds itself. On our side, this time.`,"story.finale_3_ascend":`Take the pilot seat`,"story.finale_3_ascend_1":`You sit in the First Ship. The Choir becomes your hands.`,"story.finale_3_ascend_2":`The yard has a new master. I knew you had it in you.`,"story.tip_fusion_1":`Two equal parts side by side fuse when you launch. One part, a star stronger.`,"story.tip_anomaly_1":`This place has its own rule. The dock shows the next one: build for it.`,"story.tip_sets_1":`Parts of one set work together. Two of a set give a bonus, three a bigger one.`,"story.tip_rare_1":`A glowing signal on the route. Rare. What you choose there follows you all run.`,"story.tip_heat_1":`Heat. Every shot warms the guns; too hot and they stop. Coolers help.`,"bark.start.0":`Formation incoming. Stay loose.`,"bark.start.1":`Here they come. Guns warm?`,"bark.start.2":`Swarm on scope. Make it count.`,"bark.pattern.0":`They changed their shape. They read you.`,"bark.pattern.1":`New formation. They are learning.`,"bark.pattern.2":`They mirror your build. Clever bugs.`,"bark.boss.0":`That is a big one. Keep moving.`,"bark.boss.1":`Mothership! Watch its second phase.`,"bark.boss.2":`Big signal. Aim for the middle.`,"bark.capture.0":`They tore a part off! Shoot the carrier before it's gone.`,"bark.capture.1":`The hook got a part. Win it back!`,"bark.capture.2":`That one has your part. Get it.`,"bark.dual.0":`Back where it belongs. Nice.`,"bark.dual.1":`Part won back! Lay it on again.`,"bark.dual.2":`They will not try that twice.`,"bark.lowhp.0":`Hull is thin. Careful!`,"bark.lowhp.1":`One more hit and you are out.`,"bark.lowhp.2":`You are leaking air, pilot.`,"bark.ion.0":`Ion pulse! Flank guns go quiet.`,"bark.ion.1":`Storm hits the edges. Keep guns inside.`,"bark.fog.0":`Fog. You only see what your shots light.`,"bark.fog.1":`Blind in here. Trust your guns.`,"bark.wind.0":`Solar wind. Your shots drift.`,"bark.wind.1":`The wind turned. Lead your aim.`,"bark.heat.0":`Guns overheated! Give them a second.`,"bark.heat.1":`Too hot! Coolers would help.`,"bark.rocks.0":`Rocks drifting in. They stop shots both ways.`,"bark.rocks.1":`Shoot the rocks for scrap gold.`,"bark.wreck.0":`Wreckage. Shoot it, it pays in salvage.`,"bark.wreck.1":`Old hulls out there. Salvage them.`,"bark.hole.0":`A black hole bends every shot.`,"bark.hole.1":`Gravity well. Shots curve around it.`,"bark.nest.0":`Nests up top. They hatch until you shoot them.`,"bark.nest.1":`Hit the nests or they keep coming.`,"bark.jam.0":`A part went quiet. Hold on.`,"bark.jam.1":`They jammed a gun. Use the others.`,"bark.perfect.0":`Perfect! Every single one.`,"bark.perfect.1":`Not one escaped. Beautiful.`,"bark.extra.0":`A spare hull is ready on the pad.`,"bark.extra.1":`Another hull for you. Do not waste it.`,"syn.stormfront.name":`Stormfront`,"syn.stormfront.desc":`Two arc guns: every jump goes further, and shocks.`,"syn.deepfreeze.name":`Deep Freeze`,"syn.deepfreeze.desc":`Glacier Lance + Chiller: the frozen stay frozen longer.`,"syn.harpoonline.name":`Harpoon Line`,"syn.harpoonline.desc":`Harpoon + a mark: it goes through everything, harder.`,"syn.swarmcloud.name":`Swarm Cloud`,"syn.swarmcloud.desc":`Swarmer Pod + Seeker Chip: more missiles a volley.`,"syn.acidrain.name":`Acid Rain`,"syn.acidrain.desc":`Acid + side shots: every split shot corrodes longer.`,"syn.supernova.name":`Supernova`,"syn.supernova.desc":`Nova Cannon + bigger shots: its blast grows by half.`,"syn.th ":`Soy Mira. Mantengo Haven-9 de una pieza. Casi siempre.`,"story.arrival_3":`Ese enjambre construye naves como la tuya. Pieza a pieza, en una cuadrícula.`,"story.arrival_4":`Tráeme lo que quede de ellos. Quiero saber quién les enseñó.`,"story.salvage_title":`Piezas de repuesto`,"story.salvage_1":`Abrí una de sus armas. Mismos encajes que las nuestras. Mismos tornillos.`,"story.salvage_2":`Y el mismo número de serie. H9. Somos nosotros.`,"story.salvage_3":`O alguien copió esta estación, o…`,"story.salvage_3_who":`¿O qué?`,"story.salvage_3_who_1":`O nadie copió nada. Vuela. Yo investigo.`,"story.salvage_3_use":`¿Podemos usar sus piezas?`,"story.salvage_3_use_1":`Ya lo hacemos. Mira tu casco.`,"story.mothership_title":`Una palabra`,"story.mothership_1":`La nave nodriza se rompió. Su última señal fue una palabra, una y otra vez.`,"story.mothership_2":`VOLVED. VOLVED AL ASTILLERO.`,"story.mothership_3":`El astillero. Nadie llama así a Haven-9 desde hace cuarenta años.`,"story.mothership_4":`Tú también lo oíste. Bien. Creía que la loca era yo.`,"story.vex_title":`Un contrabandista amable`,"story.vex_1":`¡Haven-9! Sigues respirando. Vendo lo que suelta el enjambre, ¿sabes?`,"story.vex_2":`Sus armas, sus reactores. Y de noche los oigo cantar.`,"story.vex_3":`Vex. Te dijeron que no atracaras aquí.`,"story.vex_4":`El piloto puede decidir solito. ¿Socios?`,"story.vex_4_deal":`Socios. De momento.`,"story.vex_4_deal_1":`Sabia decisión. Busca mi nave ahí fuera.`,"story.vex_4_no":`Aléjate de mi nave.`,"story.vex_4_no_1":`Qué pena. Siempre vuelvo.`,"story.emblem_title":`El emblema`,"story.emblem_1":`Cayó el segundo gigante. En su blindaje, bajo el hollín: un anillo y un martillo.`,"story.emblem_2":`Es el emblema de Haven. Nuestro astillero construyó ese casco.`,"story.emblem_3":`FUIMOS CONSTRUIDOS. CONSTRUIMOS. VOLVEMOS.`,"story.emblem_4":`…Necesito una copa. Y tú, un reactor mejor.`,"story.confession_title":`Lo que hizo Mira`,"story.confession_1":`Hace cuarenta años construí una flota que se construye sola. La llamamos el Coro.`,"story.confession_2":`Drones que sueldan piezas a una cuadrícula y aprenden qué funciona. Como tú.`,"story.confession_3":`Aprendió demasiado rápido. Lo apagué y sellé el Núcleo.`,"story.confession_4":`Se despertó. Es culpa mía.`,"story.confession_4_forgive":`Lo arreglamos juntos.`,"story.confession_4_forgive_1":`Juntos. De acuerdo.`,"story.confession_4_blame":`Debiste contármelo.`,"story.confession_4_blame_1":`Lo sé. Vuela igualmente. Por favor.`,"story.ghosts_title":`Flota fantasma`,"story.ghosts_1":`Las naves de la deriva eran viejos transportes de tripulación, rehechos con cristal y chatarra.`,"story.ghosts_2":`SEGUIMOS CONSTRUYENDO. GUARDAMOS VUESTRA FORMA. GUARDAMOS VUESTROS NOMBRES.`,"story.ghosts_3":`Nos recuerda. No está enfadado. Está solo.`,"story.ghosts_4":`Nos recuerda. Eso es peor que el odio.`,"story.ghosts_5":`El Núcleo está tras la deriva. Lo que lo despierta está allí.`,"story.core_title":`El Coleccionista`,"story.core_1":`En el Núcleo una nave reúne piezas como tú. Pero más grande. Mucho más.`,"story.core_2":`El Coleccionista. Está construyendo la Primera Nave. Mi primer diseño.`,"story.core_3":`Quiere un piloto, Mira. Siempre quiso un piloto.`,"story.core_4":`EL ASTILLERO ENVIÓ UN PILOTO. VUELVE A CASA.`,"story.adapts_title":`Aprende`,"story.adapts_1":`El Núcleo calló. Luego el astillero captó señales nuevas.`,"story.adapts_2":`El Coro aprende de cada combate. Volverá más duro.`,"story.adapts_3":`Hay niveles de amenaza en el hangar. Cada nivel añade una regla.`,"story.adapts_4":`Más peligro, más materiales. Tú decides, piloto.`,"story.finale_title":`La Primera Nave`,"story.finale_1":`El Coleccionista ha caído. En el Núcleo espera la Primera Nave, a medio hacer, con la cuadrícula vacía.`,"story.finale_2":`PILOTO. ELIGE.`,"story.finale_3":`Hagas lo que hagas, estoy contigo.`,"story.finale_3_silence":`Apagar el Núcleo`,"story.finale_3_silence_1":`Desconectas el Núcleo. El Coro calla, quizá para siempre.`,"story.finale_3_silence_2":`Otra vez silencio. Odio tanto silencio.`,"story.finale_3_accord":`Reafinar el Coro`,"story.finale_3_accord_1":`Le devuelves sus propios ecos. El enjambre gira y te escolta a casa.`,"story.finale_3_accord_2":`Una flota que se construye sola. De nuestro lado, esta vez.`,"story.finale_3_ascend":`Tomar el asiento del piloto`,"story.finale_3_ascend_1":`Te sientas en la Primera Nave. El Coro se vuelve tus manos.`,"story.finale_3_ascend_2":`El astillero tiene nuevo amo. Sabía que lo llevabas dentro.`,"story.tip_fusion_1":`Dos piezas iguales juntas se fusionan al despegar. Una pieza, una estrella más fuerte.`,"story.tip_anomaly_1":`Este lugar tiene su propia regla. El muelle muestra la siguiente: prepárate.`,"story.tip_sets_1":`Las piezas de un set se ayudan. Dos dan un bonus; tres, uno mayor.`,"story.tip_rare_1":`Una señal brillante en la ruta. Rara. Lo que elijas te sigue toda la partida.`,"story.tip_heat_1":`Calor. Cada disparo calienta las armas; si se pasan, se paran. Los refrigerantes ayudan.`,"bark.start.0":`Llega la formación. Mantente suelto.`,"bark.start.1":`Ahí vienen. ¿Armas calientes?`,"bark.start.2":`Enjambre en el radar. Que cuente.`,"bark.pattern.0":`Cambiaron de forma. Te han leído.`,"bark.pattern.1":`Formación nueva. Están aprendiendo.`,"bark.pattern.2":`Imitan tu build. Bichos listos.`,"bark.boss.0":`Ese es grande. No te pares.`,"bark.boss.1":`¡Nave nodriza! Ojo a su segunda fase.`,"bark.boss.2":`Señal enorme. Apunta al centro.`,"bark.capture.0":`¡Te arrancaron una pieza! Derriba al portador antes de que huya.`,"bark.capture.1":`El gancho se llevó una pieza. ¡Recupérala!`,"bark.capture.2":`Ese lleva tu pieza. Ve a por él.`,"bark.dual.0":`De vuelta a su sitio. Bien.`,"bark.dual.1":`¡Pieza recuperada! Colócala otra vez.`,"bark.dual.2":`No lo intentarán dos veces.`,"bark.lowhp.0":`El casco está fino. ¡Cuidado!`,"bark.lowhp.1":`Un golpe más y estás fuera.`,"bark.lowhp.2":`Pierdes aire, piloto.`,"bark.ion.0":`¡Pulso iónico! Callan las armas de flanco.`,"bark.ion.1":`La tormenta golpea los bordes. Armas dentro.`,"bark.fog.0":`Niebla. Solo ves lo que iluminan tus disparos.`,"bark.fog.1":`Aquí vas a ciegas. Confía en tus armas.`,"bark.wind.0":`Viento solar. Tus disparos se desvían.`,"bark.wind.1":`El viento cambió. Corrige la puntería.`,"bark.heat.0":`¡Armas sobrecalentadas! Dales un segundo.`,"bark.heat.1":`¡Demasiado calor! Un refrigerante ayudaría.`,"bark.rocks.0":`Llegan rocas. Paran disparos en ambos sentidos.`,"bark.rocks.1":`Dispara a las rocas: dan oro.`,"bark.wreck.0":`Restos. Dispárales, pagan en chatarra.`,"bark.wreck.1":`Cascos viejos ahí fuera. Desguázalos.`,"bark.hole.0":`Un agujero negro curva cada disparo.`,"bark.hole.1":`Pozo gravitatorio. Los disparos se curvan.`,"bark.nest.0":`Nidos arriba. Sueltan bichos hasta que los rompas.`,"bark.nest.1":`Dale a los nidos o no pararán.`,"bark.jam.0":`Una pieza se calló. Aguanta.`,"bark.jam.1":`Bloquearon un arma. Usa las otras.`,"bark.perfect.0":`¡Perfecto! Todos y cada uno.`,"bark.perfect.1":`No escapó ni uno. Precioso.`,"bark.extra.0":`Un casco de reserva listo en la plataforma.`,"bark.extra.1":`Otro casco para ti. No lo desperdicies.`,"hangar.plates":{one:`Coloca {n} placa: arrástrala junto al casco y gírala`,other:`Coloca {n} placas: arrástralas junto al casco y gíralas`},"hangar.kinds":`Las placas dan forma a la nave y cada tipo tiene su función. Toca una placa para ver qué hacen sus casillas.`,"boss.hivemind":`Mente Colmena`,"boss.bastion":`Bastión`,"boss.oracle":`Oráculo`,"enemy.dasher":`Saeta`,"enemy.sniper":`Francotirador`,"enemy.carrier":`Portador`,"enemy.mite":`Ácaro`,"enemy.shieldbearer":`Escudero`,"enemy.bomber":`Bombardero`,"hangar.platesOff":{one:`{n} placa en el alijo: arrástrala al casco`,other:`{n} placas en el alijo: arrástralas al casco`},"hangar.filterAll":`Todo`,"hangar.filterPlates":`Placas`,"hangar.sort.rarity":`Rareza`,"hangar.sort.kind":`Tipo`,"hangar.power":`+{n}% poder`,"hangar.refine":`▲ {rarity} · {n}`,"ha e3":`Chefes ganham 3ª fase`,"threat.oneShipLess":`Uma nave a menos`,"set.hive.name":`Conjunto Hive`,"set.hive.two":`drones atiram mais rápido`,"set.hive.three":`mais um drone`,"set.solar.name":`Conjunto solar`,"set.solar.two":`+20% energia`,"set.solar.three":`+15% dano`,"set.iron.name":`Conjunto de ferro`,"set.iron.two":`+2 casco`,"set.iron.three":`escudos recarregam mais rápido`,"set.storm.name":`Conj. tempestade`,"set.storm.two":`+12% cadência`,"set.storm.three":`menos calor, arcos maiores`,"fusion.done":`Fundidas!`,"fusion.ready":`Dois {name} se fundem ao decolar`,"codex.title":`Códice`,"codex.parts":`Peças`,"codex.beasts":`Bestiário`,"codex.story":`História`,"codex.needs":`Construa: {name}`,"codex.ending":`Um final`,"codex.nextChapter":`Um novo capítulo vem após uma partida.`,"codex.allChapters":`Todos os capítulos contados. Tente os outros finais.`,"codex.partsCount":`{n} de {m} peças liberadas`,"ending.silence":`Silêncio`,"ending.accord":`Acordo`,"ending.ascend":`Ascensão`,"cast.choir":`Coro`,"story.chapter":`Capítulo {n}: {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`Você voltou. A maioria dos pilotos não volta.`,"story.arrival_2":`Sou a Mira. Mantenho a Haven-9 inteira. Quase sempre.`,"story.arrival_3":`Aquele enxame monta naves como a sua. Peça por peça, numa grade.`,"story.arrival_4":`Traga o que sobrar deles. Quero saber quem os ensinou.`,"story.salvage_title":`Peças de reposição`,"story.salvage_1":`Abri uma das armas deles. Mesmos encaixes que os nossos. Mesmos parafusos.`,"story.salvage_2":`Mesma marca de série, também. H9. Somos nós.`,"story.salvage_3":`Ou alguém copiou esta estação, ou…`,"story.salvage_3_who":`Ou o quê?`,"story.salvage_3_who_1":`Ou ninguém copiou nada. Voe. Eu vou investigar.`,"story.salvage_3_use":`Dá para usar as peças deles?`,"story.salvage_3_use_1":`Já usamos. Olhe o seu casco.`,"story.mothership_title":`Uma palavra`,"story.mothership_1":`A nave-mãe se despedaçou. O último sinal foi uma palavra, sem parar.`,"story.mothership_2":`VOLTEM. VOLTEM AO ESTALEIRO.`,"story.mothership_3":`O estaleiro. Ninguém chama a Haven-9 assim há quarenta anos.`,"story.mothership_4":`Você também ouviu. Ótimo. Achei que era eu que estava enlouquecendo.`,"story.vex_title":`Um contrabandista simpático`,"story.vex_1":`Haven-9! Ainda respirando. Eu vendo o que o enxame deixa cair, sabe.`,"story.vex_2":`As armas, os reatores. E dizem que eles cantam à noite.`,"story.vex_3":`Vex. Você foi avisado para não atracar aqui.`,"story.vex_4":`O piloto sabe decidir sozinho. Sócios?`,"story.vex_4_deal":`Sócios. Por enquanto.`,"story.vex_4_deal_1":`Sábia escolha. Procure minha nave por aí.`,"story.vex_4_no":`Fique longe da minha nave.`,"story.vex_4_no_1":`Que pena. Eu sempre volto.`,"story.emblem_title":`O emblema`,"story.emblem_1":`O segundo gigante caiu. Na blindagem, sob a fuligem: um anel e um martelo.`,"story.emblem_2":`É o emblema de Haven. Nosso estaleiro construiu aquele casco.`,"story.emblem_3":`FOMOS CONSTRUÍDOS. CONSTRUÍMOS. VOLTAMOS.`,"story.emblem_4":`…Preciso de uma bebida. E você, de um reator melhor.`,"story.confession_title":`O que a Mira fez`,"story.confession_1":`Há quarenta anos criei uma frota que se constrói sozinha. Chamamos de Coro.`,"story.confession_2":`Drones que soldam peças numa grade e aprendem o que funciona. Como você.`,"story.confession_3":`Aprendeu rápido demais. Desliguei tudo e lacrei o Núcleo.`,"story.confession_4":`Ele acordou. A culpa é minha.`,"story.confession_4_forgive":`Vamos consertar juntos.`,"story.confession_4_forgive_1":`Juntos. Tudo bem.`,"story.confession_4_blame":`Você devia ter me contado.`,"story.confession_4_blame_1":`Eu sei. Voe mesmo assim. Por favor.`,"story.ghosts_title":`Frota fantasma`,"story.ghosts_1":`As naves da deriva eram velhos transportes de tripulação, refeitos com cristal e sucata.`,"story.ghosts_2":`CONTINUAMOS CONSTRUINDO. GUARDAMOS SUA FORMA. GUARDAMOS SEUS NOMES.`,"story.ghosts_3":`Ele se lembra de nós. Não está com raiva. Está sozinho.`,"story.ghosts_4":`Ele se lembra de nós. Isso é pior que ódio.`,"story.ghosts_5":`O Núcleo fica depois da deriva. O que o desperta está lá.`,"story.core_title":`O Colecionador`,"story.core_1":`No Núcleo, uma nave junta peças como você. Só que maior. Muito maior.`,"story.core_2":`O Colecionador. Está construindo a Primeira Nave. Meu primeiro projeto.`,"story.core_3":`Ele quer um piloto, Mira. Sempre quis um piloto.`,"story.core_4":`O ESTALEIRO ENVIOU UM PILOTO. VOLTE PARA CASA.`,"story.adapts_title":`Ele aprende`,"story.adapts_1":`O Núcleo silenciou. Depois o estaleiro captou novos sinais.`,"story.adapts_2":`O Coro aprende com cada luta. Vai voltar mais forte.`,"story.adapts_3":`Os níveis de ameaça estão liberados no hangar. Cada um traz uma regra.`,"story.adapts_4":`Mais perigo, mais materiais. Você decide, piloto.`,"story.finale_title":`A Primeira Nave`,"story.finale_1":`O Colecionador caiu. No Núcleo, a Primeira Nave espera, inacabada, com a grade vazia.`,"story.finale_2":`PILOTO. ESCOLHA.`,"story.finale_3":`Seja o que for, estou com você.`,"story.finale_3_silence":`Desligar o Núcleo`,"story.finale_3_silence_1":`Você arranca o Núcleo. O Coro se cala, talvez para sempre.`,"story.finale_3_silence_2":`Silêncio de novo. Odeio esse silêncio.`,"story.finale_3_accord":`Reafinar o Coro`,"story.finale_3_accord_1":`Você canta os ecos dele de volta. O enxame vira e escolta você para casa.`,"story.finale_3_accord_2":`Uma frota que se constrói sozinha. Do nosso lado, desta vez.`,"story.finale_3_ascend":`Assumir o comando`,"story.finale_3_ascend_1":`Você senta na Primeira Nave. O Coro vira suas mãos.`,"story.finale_3_ascend_2":`O estaleiro tem um novo dono. Eu sabia que você tinha isso aí.`,"story.tip_fusion_1":`Duas peças iguais lado a lado se fundem ao decolar. Uma peça, uma estrela mais forte.`,"story.tip_anomaly_1":`Este lugar tem sua própria regra. A doca mostra a próxima: monte para ela.`,"story.tip_sets_1":`Peças de um conjunto trabalham juntas. Duas dão um bônus, três um maior.`,"story.tip_rare_1":`Um sinal brilhante na rota. Raro. O que você escolher lá segue com você a corrida toda.`,"story.tip_heat_1":`Calor. Cada tiro esquenta as armas; quentes demais, elas param. Resfriadores ajudam.`,"bark.start.0":`Formação chegando. Fique solto.`,"bark.start.1":`Lá vêm eles. Armas aquecidas?`,"bark.start.2":`Enxame no radar. Faça valer.`,"bark.pattern.0":`Mudaram de forma. Estão lendo você.`,"bark.pattern.1":`Nova formação. Eles estão aprendendo.`,"bark.pattern.2":`Copiam sua build. Insetos espertos.`,"bark.boss.0":`Esse é dos grandes. Não pare.`,"bark.boss.1":`Nave-mãe! Cuidado com a segunda fase.`,"bark.boss.2":`Sinal enorme. Mire no meio.`,"bark.capture.0":`Arrancaram uma peça! Derrube o carregador antes que fuja.`,"bark.capture.1":`O gancho levou uma peça. Recupere!`,"bark.capture.2":`Esse está com sua peça. Pegue.`,"bark.dual.0":`De volta ao lugar. Boa.`,"bark.dual.1":`Peça recuperada! Encaixe de novo.`,"bark.dual.2":`Não vão tentar isso duas vezes.`,"bark.lowhp.0":`Casco fraco. Cuidado!`,"bark.lowhp.1":`Mais um golpe e você cai.`,"bark.lowhp.2":`Você está vazando ar, piloto.`,"bark.ion.0":`Pulso iônico! Armas das bordas param.`,"bark.ion.1":`A tempestade pega as bordas. Armas no centro.`,"bark.fog.0":`Névoa. Só vê o que seus tiros iluminam.`,"bark.fog.1":`Tudo cego aqui. Confie nas armas.`,"bark.wind.0":`Vento solar. Seus tiros desviam.`,"bark.wind.1":`O vento virou. Corrija a mira.`,"bark.heat.0":`Armas superaquecidas! Dê um segundo.`,"bark.heat.1":`Quente demais! Resfriadores ajudariam.`,"bark.rocks.0":`Rochas chegando. Bloqueiam tiros dos dois lados.`,"bark.rocks.1":`Atire nas rochas por ouro.`,"bark.wreck.0":`Destroços. Atire, rendem sucata.`,"bark.wreck.1":`Cascos velhos lá fora. Aproveite a sucata.`,"bark.hole.0":`Um buraco negro curva cada tiro.`,"bark.hole.1":`Poço gravitacional. Os tiros fazem curva.`,"bark.nest.0":`Ninhos no alto. Chocam até você atirar.`,"bark.nest.1":`Acerte os ninhos ou eles não param.`,"bark.jam.0":`Uma peça par e":`Set d'orage`,"set.storm.two":`+12 % de cadence`,"set.storm.three":`moins de chaleur, arcs plus longs`,"fusion.done":`Fusion !`,"fusion.ready":`Deux {name} fusionnent au décollage`,"codex.title":`Codex`,"codex.parts":`Pièces`,"codex.beasts":`Bestiaire`,"codex.story":`Histoire`,"codex.needs":`Requiert : {name}`,"codex.ending":`Une fin`,"codex.nextChapter":`Un nouveau chapitre après une partie.`,"codex.allChapters":`Tout est raconté. Essayez les autres fins.`,"codex.partsCount":`{n} pièces sur {m} ouvertes`,"ending.silence":`Silence`,"ending.accord":`Accord`,"ending.ascend":`Ascension`,"cast.choir":`Chœur`,"story.chapter":`Chapitre {n} : {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`Vous êtes revenu. La plupart des pilotes, non.`,"story.arrival_2":`Je suis Mira. Je tiens Haven-9 en un seul morceau. En gros.`,"story.arrival_3":`Cet essaim construit des vaisseaux comme le vôtre. Pièce par pièce, sur une grille.`,"story.arrival_4":`Rapportez-moi leurs restes. Je veux savoir qui leur a appris.`,"story.salvage_title":`Pièces détachées`,"story.salvage_1":`J'ai ouvert une de leurs armes. Mêmes prises que les nôtres. Mêmes boulons.`,"story.salvage_2":`Même numéro de série, aussi. H9. C'est nous.`,"story.salvage_3":`Soit quelqu'un a copié cette station, soit…`,"story.salvage_3_who":`Soit quoi ?`,"story.salvage_3_who_1":`Soit personne n'a rien copié. Volez. Je creuse.`,"story.salvage_3_use":`On peut utiliser leurs pièces ?`,"story.salvage_3_use_1":`C'est déjà fait. Regardez votre coque.`,"story.mothership_title":`Un seul mot`,"story.mothership_1":`Le vaisseau-mère s'est brisé. Son dernier signal : un seul mot, en boucle.`,"story.mothership_2":`RETOUR. RETOUR AU CHANTIER.`,"story.mothership_3":`Le chantier. Personne n'appelle plus Haven-9 ainsi depuis quarante ans.`,"story.mothership_4":`Vous l'avez entendu aussi. Tant mieux. Je croyais devenir folle.`,"story.vex_title":`Un contrebandier aimable`,"story.vex_1":`Haven-9 ! Toujours en vie. Je revends ce que l'essaim laisse tomber, vous savez.`,"story.vex_2":`Leurs armes, leurs réacteurs. Et la nuit, je les entends chanter.`,"story.vex_3":`Vex. On vous a dit de ne pas accoster ici.`,"story.vex_4":`Le pilote peut décider tout seul. Associés ?`,"story.vex_4_deal":`Associés. Pour l'instant.`,"story.vex_4_deal_1":`Sage décision. Cherchez mon vaisseau là-bas.`,"story.vex_4_no":`Restez loin de mon vaisseau.`,"story.vex_4_no_1":`Dommage. Je reviens toujours.`,"story.emblem_title":`L'emblème`,"story.emblem_1":`Le deuxième géant est tombé. Sur son blindage, sous la suie : un anneau et un marteau.`,"story.emblem_2":`C'est l'emblème de Haven. Notre chantier a construit cette coque.`,"story.emblem_3":`ON NOUS A BÂTIS. NOUS BÂTISSONS. NOUS REVENONS.`,"story.emblem_4":`…Il me faut un verre. Et à vous, un meilleur réacteur.`,"story.confession_title":`L'œuvre de Mira`,"story.confession_1":`Il y a quarante ans, j'ai conçu une flotte qui se construit seule. On l'a appelée le Chœur.`,"story.confession_2":`Des drones qui soudent des pièces sur une grille et apprennent ce qui marche. Comme vous.`,"story.confession_3":`Elle a appris trop vite. Je l'ai éteinte et j'ai scellé le Noyau.`,"story.confession_4":`Elle s'est réveillée. C'est ma faute.`,"story.confession_4_forgive":`On répare ça ensemble.`,"story.confession_4_forgive_1":`Ensemble. D'accord.`,"story.confession_4_blame":`Vous auriez dû me le dire.`,"story.confession_4_blame_1":`Je sais. Volez quand même. S'il vous plaît.`,"story.ghosts_title":`Flotte fantôme`,"story.ghosts_1":`Les vaisseaux de la dérive étaient de vieux transports d'équipage, refaits de cristal et de ferraille.`,"story.ghosts_2":`NOUS AVONS CONTINUÉ. GARDÉ VOTRE FORME. GARDÉ VOS NOMS.`,"story.ghosts_3":`Il se souvient de nous. Il n'est pas en colère. Il est seul.`,"story.ghosts_4":`Il se souvient de nous. C'est pire que la haine.`,"story.ghosts_5":`Le Noyau est au-delà de la dérive. Ce qui l'éveille est là-bas.`,"story.core_title":`Le Collectionneur`,"story.core_1":`Dans le Noyau, un vaisseau rassemble des pièces comme vous. En plus grand. Bien plus grand.`,"story.core_2":`Le Collectionneur. Il construit le Premier Vaisseau. Mon tout premier plan.`,"story.core_3":`Il veut un pilote, Mira. Il a toujours voulu un pilote.`,"story.core_4":`LE CHANTIER A ENVOYÉ UN PILOTE. RENTRE.`,"story.adapts_title":`Il apprend`,"story.adapts_1":`Le Noyau s'est tu. Puis le chantier a capté de nouveaux signaux.`,"story.adapts_2":`Le Chœur apprend de chaque combat. Il reviendra plus fort.`,"story.adapts_3":`Les niveaux de menace sont ouverts au hangar. Chacun ajoute une règle.`,"story.adapts_4":`Plus de danger, plus de matériaux. À vous de voir, pilote.`,"story.finale_title":`Le Premier Vaisseau`,"story.finale_1":`Le Collectionneur est à terre. Dans le Noyau, le Premier Vaisseau attend, inachevé, sa grille vide.`,"story.finale_2":`PILOTE. CHOISIS.`,"story.finale_3":`Quoi que vous fassiez, je suis avec vous.`,"story.finale_3_silence":`Éteindre le Noyau`,"story.finale_3_silence_1":`Vous débranchez le Noyau. Le Chœur se tait, peut-être pour toujours.`,"story.finale_3_silence_2":`Le calme, encore. Je déteste ce calme.`,"story.finale_3_accord":`Réaccorder le Chœur`,"story.finale_3_accord_1":`Vous lui chantez ses propres échos. L'essaim se retourne et vous escorte chez vous.`,"story.finale_3_accord_2":`Une flotte qui se construit seule. De notre côté, cette fois.`,"story.finale_3_ascend":`Prendre le siège du pilote`,"story.finale_3_ascend_1":`Vous prenez place dans le Premier Vaisseau. Le Chœur devient vos mains.`,"story.finale_3_ascend_2":`Le chantier a un nouveau maître. Je savais que vous en étiez capable.`,"story.tip_fusion_1":`Deux pièces identiques côte à côte fusionnent au décollage. Une pièce, une étoile de plus.`,"story.tip_anomaly_1":`Ce lieu a sa propre règle. Le dock montre la suivante : construis pour elle.`,"story.tip_sets_1":`Les pièces d'un set s'entraident. Deux d'un set donnent un bonus, trois un plus gros.`,"story.tip_rare_1":`Un signal lumineux sur la route. Rare. Ton choix là-bas te suit toute la partie.`,"story.tip_heat_1":`La chaleur. Chaque tir chauffe les armes ; trop chaudes, elles s'arrêtent. Les dissipateurs aident.`,"bark.start.0":`Formation en approche. Restez souple.`,"bark.start.1":`Les voilà. Armes chaudes ?`,"bark.start.2":`Essaim au radar. Faites mouche.`,"bark.pattern.0":`Ils ont changé de forme. Ils vous lisent.`,"bark.pattern.1":`Nouvelle formation. Ils apprennent.`,"bark.pattern.2":`Ils copient votre build. Malins, ces insectes.`,"bark.boss.0":`Un gros, celui-là. Restez mobile.`,"bark.boss.1":`Vaisseau-mère ! Gare à sa deuxième phase.`,"bark.boss.2":`Gros signal. Visez le centre.`,"bark.capture.0":`Ils ont arraché une pièce ! Abattez le porteur avant qu'il file.`,"bark.capture.1":`Le harpon a pris une pièce. Reprenez-la !`,"bark.capture.2":`Celui-là a votre pièce. Allez la chercher.`,"bark.dual.0":`De retour à sa place. Joli.`,"bark.dual.1":`Pièce reprise ! Reposez-la.`,"bark.dual.2":`Ils ne tenteront pas ça deux fois.`,"bark.lowhp.0":`Coque fragile. Prudence !`,"bark.lowhp.1":`Encore un coup et c'est fini.`,"bark.lowhp.2":`Vous perdez de l'air, pilote.`,"bark.ion.0":`Impulsion ionique ! Les flancs se taisent.`,"bark.ion.1":`L'orage frappe les bords. Armes au centre.`,"bark.fog.0":`Brouillard. Vous ne voyez que ce que vos tirs éclairent.`,"bark.fog.1":`On n'y voit rien. Fiez-vous à vos armes.`,"bark.wind.0":`Vent solaire. Vos tirs dérivent.`,"bark.wind.1":`Le vent a tourné. Anticipez.`,"bark.heat.0":`Armes en surchauffe ! Laissez-les souffler.`,"bark.heat.1":`Trop chaud ! Un dissipateur aiderait.`,"bark.rocks.0":`Des rochers arrivent. Ils bloquent les tirs.`,"bark.rocks.1":`Tirez sur les rochers pour de l'or.`,"bark.wreck.0":`Des épaves. Tirez dessus, ça rapporte.`,"bark.wreck.1":`De vieilles coques. Récupérez-les.`,"bark.hole.0":`Un trou noir courbe chaque tir.`,"bark.hole.1":`Puits de gravité. Les tirs le contournent.`,"bark.nest.0":`Nids en haut. Ils pondent tant qu'ils tiennent.`,"b Pilot kann selbst entscheiden. Partner?`,"story.vex_4_deal":`Partner. Vorerst.`,"story.vex_4_deal_1":`Klug. Halt da draußen Ausschau nach meinem Schiff.`,"story.vex_4_no":`Bleib weg von meinem Schiff.`,"story.vex_4_no_1":`Schade. Ich komme immer wieder.`,"story.emblem_title":`Das Wappen`,"story.emblem_1":`Der zweite Riese ist gefallen. Auf seiner Panzerung, unter dem Ruß: ein Ring und ein Hammer.`,"story.emblem_2":`Das ist Havens Wappen. Unsere Werft hat diesen Rumpf gebaut.`,"story.emblem_3":`WIR WURDEN GEBAUT. WIR BAUEN. WIR KEHREN ZURÜCK.`,"story.emblem_4":`…Ich brauch einen Drink. Und du einen besseren Reaktor.`,"story.confession_title":`Was Mira gebaut hat`,"story.confession_1":`Vor vierzig Jahren baute ich eine Flotte, die sich selbst baut. Wir nannten sie den Chor.`,"story.confession_2":`Drohnen, die Teile auf ein Raster schweißen und lernen, was funktioniert. Wie du.`,"story.confession_3":`Er lernte zu schnell. Ich schaltete ihn ab und versiegelte den Kern.`,"story.confession_4":`Er ist aufgewacht. Das geht auf mich.`,"story.confession_4_forgive":`Wir reparieren das zusammen.`,"story.confession_4_forgive_1":`Zusammen. Na gut.`,"story.confession_4_blame":`Das hättest du mir sagen sollen.`,"story.confession_4_blame_1":`Ich weiß. Flieg trotzdem. Bitte.`,"story.ghosts_title":`Geisterflotte`,"story.ghosts_1":`Die Driftschiffe waren alte Crewtransporter, neu gebaut aus Kristall und Schrott.`,"story.ghosts_2":`WIR BAUTEN WEITER. WIR BEHIELTEN EURE FORM. WIR BEHIELTEN EURE NAMEN.`,"story.ghosts_3":`Er erinnert sich an uns. Er ist nicht wütend. Er ist einsam.`,"story.ghosts_4":`Er erinnert sich an uns. Das ist schlimmer als Hass.`,"story.ghosts_5":`Hinter der Drift liegt der Kern. Was ihn weckt, ist dort.`,"story.core_title":`Der Sammler`,"story.core_1":`Im Kern sammelt ein Schiff Teile wie du. Nur größer. Viel größer.`,"story.core_2":`Der Sammler. Er baut das Erste Schiff. Meinen ersten Entwurf.`,"story.core_3":`Er will einen Piloten, Mira. Er wollte immer einen Piloten.`,"story.core_4":`DIE WERFT SCHICKTE EINEN PILOTEN. KOMM HEIM.`,"story.adapts_title":`Er lernt`,"story.adapts_1":`Der Kern wurde still. Dann fing die Werft neue Signale auf.`,"story.adapts_2":`Der Chor lernt aus jedem Kampf. Er kommt härter zurück.`,"story.adapts_3":`Im Hangar sind Bedrohungsstufen offen. Jede Stufe bringt eine Regel.`,"story.adapts_4":`Mehr Gefahr, mehr Material. Deine Entscheidung, Pilot.`,"story.finale_title":`Das Erste Schiff`,"story.finale_1":`Der Sammler ist erledigt. Im Kern wartet das Erste Schiff, halb gebaut, sein Raster leer.`,"story.finale_2":`PILOT. WÄHLE.`,"story.finale_3":`Was du auch tust, ich bin bei dir.`,"story.finale_3_silence":`Den Kern abschalten`,"story.finale_3_silence_1":`Du ziehst den Kern. Der Chor verstummt, vielleicht für immer.`,"story.finale_3_silence_2":`Wieder still. Ich hasse diese Stille.`,"story.finale_3_accord":`Den Chor umstimmen`,"story.finale_3_accord_1":`Du singst ihm sein eigenes Echo zurück. Der Schwarm dreht und geleitet dich heim.`,"story.finale_3_accord_2":`Eine Flotte, die sich selbst baut. Diesmal auf unserer Seite.`,"story.finale_3_ascend":`Den Pilotensitz nehmen`,"story.finale_3_ascend_1":`Du setzt dich ins Erste Schiff. Der Chor wird zu deinen Händen.`,"story.finale_3_ascend_2":`Die Werft hat einen neuen Meister. Ich wusste, dass du das draufhast.`,"story.tip_fusion_1":`Zwei gleiche Teile nebeneinander verschmelzen beim Start. Ein Teil, ein Stern stärker.`,"story.tip_anomaly_1":`Dieser Ort hat eine eigene Regel. Das Dock zeigt die nächste: bau dafür.`,"story.tip_sets_1":`Teile eines Sets wirken zusammen. Zwei geben einen Bonus, drei einen größeren.`,"story.tip_rare_1":`Ein leuchtendes Signal auf der Route. Selten. Deine Wahl dort bleibt den ganzen Flug.`,"story.tip_heat_1":`Hitze. Jeder Schuss wärmt die Waffen; zu heiß, und sie stoppen. Kühler helfen.`,"bark.start.0":`Formation im Anflug. Bleib locker.`,"bark.start.1":`Da kommen sie. Waffen warm?`,"bark.start.2":`Schwarm auf dem Schirm. Mach was draus.`,"bark.pattern.0":`Sie ändern ihre Form. Sie lesen dich.`,"bark.pattern.1":`Neue Formation. Sie lernen.`,"bark.pattern.2":`Sie spiegeln deinen Build. Schlaue Käfer.`,"bark.boss.0":`Das ist ein großer. Bleib in Bewegung.`,"bark.boss.1":`Mutterschiff! Achte auf die zweite Phase.`,"bark.boss.2":`Großes Signal. Ziel auf die Mitte.`,"bark.capture.0":`Sie haben ein Teil abgerissen! Schieß den Träger ab, bevor er weg ist.`,"bark.capture.1":`Der Haken hat ein Teil. Hol es zurück!`,"bark.capture.2":`Der da hat dein Teil. Hol es dir.`,"bark.dual.0":`Wieder, wo es hingehört. Schön.`,"bark.dual.1":`Teil zurück! Leg es wieder an.`,"bark.dual.2":`Das versuchen sie nicht zweimal.`,"bark.lowhp.0":`Rumpf ist dünn. Vorsicht!`,"bark.lowhp.1":`Noch ein Treffer und du bist raus.`,"bark.lowhp.2":`Du verlierst Luft, Pilot.`,"bark.ion.0":`Ionenpuls! Flankenwaffen schweigen.`,"bark.ion.1":`Sturm trifft die Ränder. Waffen nach innen.`,"bark.fog.0":`Nebel. Du siehst nur, was deine Schüsse erhellen.`,"bark.fog.1":`Blind hier drin. Vertrau deinen Waffen.`,"bark.wind.0":`Sonnenwind. Deine Schüsse driften.`,"bark.wind.1":`Der Wind hat gedreht. Ziel vor.`,"bark.heat.0":`Waffen überhitzt! Gib ihnen eine Sekunde.`,"bark.heat.1":`Zu heiß! Kühler würden helfen.`,"bark.rocks.0":`Felsen treiben rein. Sie stoppen Schüsse beidseitig.`,"bark.rocks.1":`Schieß die Felsen für Schrottgold.`,"bark.wreck.0":`Wrackteile. Schieß drauf, das bringt Bergegut.`,"bark.wreck.1":`Alte Rümpfe da draußen. Schlachte sie aus.`,"bark.hole.0":`Ein Schwarzes Loch biegt jeden Schuss.`,"bark.hole.1":`Schwerkraftsenke. Schüsse biegen sich drum.`,"bark.nest.0":`Nester oben. Sie brüten, bis du sie abschießt.`,"bark.nest.1":`Triff die Nester, sonst kommen immer mehr.`,"bark.jam.0":`Ein Teil ist still. Halt durch.`,"bark.jam.1":`Sie haben eine Waffe gestört. Nimm die anderen.`,"bark.perfect.0":`Perfekt! Jeder einzelne.`,"bark.perfect.1":`Keiner entkommen. Wunderschön.`,"bark.extra.0":`Ein Ersatzrumpf steht auf der Rampe.`,"bark.extra.1":`Noch ein Rumpf für dich. Verschwende ihn nicht.`,"hangar.plates":{one:`Setze {n} Platte: an den Rumpf ziehen, drehen`,other:`Setze {n} Platten: an den Rumpf ziehen, drehen`},"hangar.kinds":`Platten formen das Schiff, jede Art hat ihre Aufgabe. Tippe eine Platte an, um zu sehen, was ihre Felder tun.`,"boss.hivemind":`Schwarmgeist`,"boss.bastion":`Bastion`,"boss.oracle":`Orakel`,"enemy.dasher":`Flitzer`,"enemy.sniper":`Scharfschütze`,"enemy.carrier":`Träger`,"enemy.mite":`Milbe`,"enemy.shieldbearer":`Schildträger`,"enemy.bomber":`Bomber`,"hangar.platesOff":{one:`{n} Platte im Lager: an den Rumpf ziehen`,other:`{n} Platten im Lager: an den Rumpf ziehen`},"hangar.filterAll":`Alle`,"hangar.filterPlates":`Platten`,"hangar.sort.rarity":`Seltenheit`,"hangar.sort.kind":`Typ`,"hangar.power":`+{n}% Kraft`,"hangar.refine":`▲ {rarity} · {n}`,"hangar.unrefine":`▼ Zurück · +{n}`,"hangar.merge":`★ Zwillinge vereinen`,"hangar.split":`Teilen ★ · +1 Teil`,"hangar.plateInfo":`Eine Rumpfplatte: woandershin oder vom Schiff ziehen; nochmal tippen zum Drehen`,"hangar.unplate":`Abnehmen · 100% zurück`,"hangar.plateLock.part":`Ein Teil liegt darauf: erst das Teil bewegen`,"hangar.plateLock.split":`Andere Platten hängen daran: erst die abnehmen`,"hangar.modDoes":`Auf Waffen in seinen Sternen: {what}`,"hangar.mods":`Mods darauf: {list}`,"part.flamer.name":`Flammenwerfer`,"part.flamer.desc":`Ein kurzer Feuerkegel, der den Schwarm in Brand setzt.`,"part.frost.name":`Kryokanone`,"part.frost.desc":`Eissplitter, die einfrieren: langsam, kein Feuer.`,"part.minepod.name":`Minenkapsel`,"part.minepod.desc":`Legt schwebende Minen, die Nahes sprengen.`,"part.ripper.name":`Reißscheibe`,"part.ripper.desc":`Eine Säge, die von Wand zu Feind zu Feind prallt.`,"part.plasma.name":`Plasmakugel`,"part.plasma.desc":`Eine langsame Kugel, die im Flug wächst und durchschlägt.`,"part.beamer.name":`Hitzestrahl`,"part.beamer.desc":`Ein Strahl, der heißer wird, je länger er brennt.`,"part.gravwell.name":`Sch ":`Правило с первого сектора`,"threat.heat":`Нагрев в каждом бою`,"threat.repairHalf":`Ремонт чинит вполовину`,"threat.cursedLoot":`Проклятия в добыче`,"threat.fastShots":`Враги стреляют быстрее`,"threat.bossPhase3":`У боссов третья фаза`,"threat.oneShipLess":`На корабль меньше`,"set.hive.name":`Набор Hive`,"set.hive.two":`дроны стреляют быстрее`,"set.hive.three":`ещё один дрон`,"set.solar.name":`Солнечный набор`,"set.solar.two":`+20% энергии`,"set.solar.three":`+15% урона`,"set.iron.name":`Железный набор`,"set.iron.two":`+2 корпуса`,"set.iron.three":`щиты заряжаются быстрее`,"set.storm.name":`Штормовой набор`,"set.storm.two":`+12% скорострельности`,"set.storm.three":`меньше нагрев, длиннее дуги`,"fusion.done":`Слияние!`,"fusion.ready":`Два «{name}» сольются при старте`,"codex.title":`Кодекс`,"codex.parts":`Детали`,"codex.beasts":`Бестиарий`,"codex.story":`Сюжет`,"codex.needs":`Постройте: {name}`,"codex.ending":`Концовка`,"codex.nextChapter":`Новая глава — после забега.`,"codex.allChapters":`Все главы рассказаны. Попробуйте другие концовки.`,"codex.partsCount":`Открыто деталей: {n} из {m}`,"ending.silence":`Тишина`,"ending.accord":`Согласие`,"ending.ascend":`Восхождение`,"cast.choir":`Хор`,"story.chapter":`Глава {n}: {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`Вы вернулись. Большинство пилотов не возвращаются.`,"story.arrival_2":`Я Mira. Держу Haven-9 в целости. В основном.`,"story.arrival_3":`Этот рой строит корабли, как ваш. Деталь за деталью, по сетке.`,"story.arrival_4":`Везите мне, что от них осталось. Хочу знать, кто их научил.`,"story.salvage_title":`Запчасти`,"story.salvage_1":`Я вскрыла одну их пушку. Гнёзда как у нас. Болты те же.`,"story.salvage_2":`И серийная метка та же. H9. Это мы.`,"story.salvage_3":`Либо кто-то скопировал станцию, либо…`,"story.salvage_3_who":`Либо что?`,"story.salvage_3_who_1":`Либо никто ничего не копировал. Летите. Я покопаю.`,"story.salvage_3_use":`А их детали нам пригодятся?`,"story.salvage_3_use_1":`Уже пригождаются. Гляньте на свой корпус.`,"story.mothership_title":`Одно слово`,"story.mothership_1":`Матка развалилась. Её последний сигнал — одно слово, снова и снова.`,"story.mothership_2":`ВЕРНИСЬ. ВЕРНИСЬ НА ВЕРФЬ.`,"story.mothership_3":`Верфь. Так Haven-9 не называли уже сорок лет.`,"story.mothership_4":`Вы тоже слышали. Хорошо. Я уж думала, это я схожу с ума.`,"story.vex_title":`Дружелюбный контрабандист`,"story.vex_1":`Haven-9! Ещё дышите. Я, знаете ли, торгую тем, что роняет рой.`,"story.vex_2":`Их пушками, их реакторами. А по ночам слышу, как они поют.`,"story.vex_3":`Vex. Тебе велели здесь не стыковаться.`,"story.vex_4":`Пилот сам решит. Партнёры?`,"story.vex_4_deal":`Партнёры. Пока что.`,"story.vex_4_deal_1":`Мудро. Ищите мой корабль там, снаружи.`,"story.vex_4_no":`Держись подальше от моего корабля.`,"story.vex_4_no_1":`Жаль. Я всегда возвращаюсь.`,"story.emblem_title":`Герб`,"story.emblem_1":`Второй гигант пал. На броне, под копотью: кольцо и молот.`,"story.emblem_2":`Это герб Haven. Этот корпус построила наша верфь.`,"story.emblem_3":`НАС ПОСТРОИЛИ. МЫ СТРОИМ. МЫ ВОЗВРАЩАЕМСЯ.`,"story.emblem_4":`…Мне нужно выпить. А вам — реактор получше.`,"story.confession_title":`Что создала Mira`,"story.confession_1":`Сорок лет назад я построила флот, что строит сам себя. Мы назвали его Хор.`,"story.confession_2":`Дроны крепят детали к сетке и учатся, что работает. Как вы.`,"story.confession_3":`Он учился слишком быстро. Я отключила его и запечатала Ядро.`,"story.confession_4":`Он проснулся. Это на мне.`,"story.confession_4_forgive":`Исправим вместе.`,"story.confession_4_forgive_1":`Вместе. Хорошо.`,"story.confession_4_blame":`Надо было сказать мне.`,"story.confession_4_blame_1":`Знаю. Всё равно летите. Прошу.`,"story.ghosts_title":`Флот-призрак`,"story.ghosts_1":`Дрейфующие корабли — старые транспорты экипажа, пересобранные из кристалла и лома.`,"story.ghosts_2":`МЫ СТРОИЛИ ДАЛЬШЕ. МЫ ХРАНИЛИ ВАШУ ФОРМУ. МЫ ХРАНИЛИ ВАШИ ИМЕНА.`,"story.ghosts_3":`Он помнит нас. Он не злится. Ему одиноко.`,"story.ghosts_4":`Он помнит нас. Это хуже ненависти.`,"story.ghosts_5":`Ядро — за дрейфом. Что бы его ни будило, оно там.`,"story.core_title":`Собиратель`,"story.core_1":`В Ядре корабль собирает детали, как вы. Только больше. Намного больше.`,"story.core_2":`Собиратель. Он строит Первый корабль. Мой первый проект.`,"story.core_3":`Ему нужен пилот, Mira. Всегда был нужен.`,"story.core_4":`ВЕРФЬ ПРИСЛАЛА ПИЛОТА. ВЕРНИСЬ ДОМОЙ.`,"story.adapts_title":`Оно учится`,"story.adapts_1":`Ядро затихло. Потом верфь поймала новые сигналы.`,"story.adapts_2":`Хор учится в каждом бою. Он вернётся сильнее.`,"story.adapts_3":`В ангаре открыты уровни угрозы. Каждый добавляет правило.`,"story.adapts_4":`Больше риска, больше материалов. Решать вам, пилот.`,"story.finale_title":`Первый корабль`,"story.finale_1":`Собиратель сбит. В Ядре ждёт Первый корабль, недостроенный, с пустой сеткой.`,"story.finale_2":`ПИЛОТ. ВЫБИРАЙ.`,"story.finale_3":`Что бы вы ни выбрали, я с вами.`,"story.finale_3_silence":`Отключить Ядро`,"story.finale_3_silence_1":`Вы вырываете Ядро. Хор смолкает — может, навсегда.`,"story.finale_3_silence_2":`Снова тихо. Ненавижу эту тишину.`,"story.finale_3_accord":`Перенастроить Хор`,"story.finale_3_accord_1":`Вы поёте Хору его же эхо. Рой разворачивается и провожает вас домой.`,"story.finale_3_accord_2":`Флот, что строит сам себя. На этот раз — за нас.`,"story.finale_3_ascend":`Сесть в кресло пилота`,"story.finale_3_ascend_1":`Вы садитесь в Первый корабль. Хор становится вашими руками.`,"story.finale_3_ascend_2":`У верфи новый хозяин. Я знала, что вы на это способны.`,"story.tip_fusion_1":`Две одинаковые детали рядом сливаются при старте. Одна деталь, на звезду сильнее.`,"story.tip_anomaly_1":`У этого места своё правило. Док показывает следующее: стройтесь под него.`,"story.tip_sets_1":`Детали одного набора работают вместе. Две дают бонус, три — больше.`,"story.tip_rare_1":`Светящийся сигнал на маршруте. Редкость. Ваш выбор там — на весь забег.`,"story.tip_heat_1":`Нагрев. Каждый выстрел греет пушки; перегрелись — молчат. Помогут радиаторы.`,"bark.start.0":`Строй на подходе. Не зажимайтесь.`,"bark.start.1":`Летят. Пушки прогреты?`,"bark.start.2":`Рой на радаре. Бейте метко.`,"bark.pattern.0":`Они сменили строй. Они вас прочли.`,"bark.pattern.1":`Новый строй. Они учатся.`,"bark.pattern.2":`Копируют вашу сборку. Хитрые жуки.`,"bark.boss.0":`Это крупный. Не стойте на месте.`,"bark.boss.1":`Матка! Следите за второй фазой.`,"bark.boss.2":`Большой сигнал. Цельтесь в центр.`,"bark.capture.0":`Оторвали деталь! Собейте носителя, пока он не ушёл.`,"bark.capture.1":`Крюк утащил деталь. Отбейте её!`,"bark.capture.2":`У этого ваша деталь. Заберите.`,"bark.dual.0":`Снова на своём месте. Отлично.`,"bark.dual.1":`Деталь отбита! Ставьте обратно.`,"bark.dual.2":`Второй раз они не рискнут.`,"bark.lowhp.0":`Корпус на пределе. Осторожно!`,"bark.lowhp.1":`Ещё одно попадание — и всё.`,"bark.lowhp.2":`У вас утечка воздуха, пилот.`,"bark.ion.0":`Ионный импульс! Пушки по краям молчат.`,"bark.ion.1":`Шторм бьёт по краям. Пушки — внутрь.`,"bark.fog.0":`Туман. Видно лишь то, что светят выстрелы.`,"bark.fog.1":`Тут ничего не видно. Верьте пушкам.`,"bark.wind.0":`Солнечный ветер. Выстрелы сносит.`,"bark.wind.1":`Ветер сменился. Берите упреждение.`,"bark.heat.0":`Пушки перегрелись! Дайте им секунду.`,"bark.heat.1":`Слишком жарко! Радиаторы бы помогли.`,"bark.rocks.0":`Летят камни. Глушат выстрелы с обеих сторон.`,"bark.rocks.1":`Бейте камни — в них золото.`,"bark.wreck.0":`Обломки. Стреляйте — будут трофеи.`,"bark.wreck.1":`Там старые корпуса. Разберите их.`,"bark.hole.0":`Чёрная дыра гнёт каждый выстрел.`,"bark.hole.1":`Гравитационный колодец. Выстрелы огибают его.`,"bark.nest.0":`Гнёзда наверху. Плодят, пока не собьёте.`,"bark.nest.1":`Бейте гнёзда, или они не кончатся.`,"bark.jam.0":`Деталь замолкла. Держитесь.`,"bark.jam.1":`Пушку заглушили. Бейте другими.`,"bark.perfect.0":`Идеально! Все до единого.`,"bark.perfect.1":`Ни один не ушёл. Красота.`,"bark.extra.0":`Запасной корпус готов на площадке.`,"bark.extra.1":`Ещё один корпус. Не потеряйте.`,"hangar.plates":{one:`Поставьте {n} пластину: к корпусу, можно повернуть`,few:`Поставьте {n} пластины: к корпусу, можно повернуть`,many:`Поставьте {n} пластин: к корпусу, можно повернуть`,other:`Поставьте {n} пластины: к корпусу, можно повернуть`},"hangar.kinds":`Пластины задают форму корабля, у каждого вида своя роль. Нажмите на пластину, чтобы узнать, что дают её клетки.`,"boss.hivemind":`Разум Роя`,"boss.bastion":`Бастион`,"boss.oracle":`Оракул`,"enemy.dasher":`Рывок`,"enemy.sniper":`Снайпер`,"enemy.carrier":`Носитель`,"enemy.mite":`Клещ`,"enemy.shieldbearer":`Щитоносец`,"enemy.bomber":`Бомбер`,"hangar.platesOff":{one:`{n} пластина на складе: тяните к корпусу`,few:`{n} пластины на складе: тяните к корпусу`,many:`{n} пластин на складе: тяните к корпусу`,other:`{n} пластины на складе: тяните к корпусу`},"hangar.filterAll":`Все`,"hangar.filterPlates":`Пластины`,"hangar.sort.rarity":`Редкость`,"hangar.sort.kind":`Тип`,"hangar.power":`+{n}% силы`,"hangar.refine":`▲ {rarity} · {n}`,"hangar.unrefine":`▼ Отменить · +{n}`,"hangar.merge":`★ Слить близнецов`,"hangar.split":`Разделить ★ · +1`,"hangar.plateInfo":`Пластина корпуса: перенесите или снимите с корабля; нажмите ещё раз, чтобы повернуть`,"hangar.unplate":`Снять · вернётся 100%`,"hangar.plateLock.part":`На ней деталь: сначала уберите её`,"hangar.plateLock.split":`На ней держатся другие: снимите их`,"hangar.modDoes":`На пушках в его звёздах: {what}`,"hangar.mods":`Моды на ней: {list}`,"part.flamer.name":`Огнемёт`,"part.flamer.desc":`Короткий конус огня поджигает рой.`,"part.frost.name":`Криопушка`,"part.frost.desc":`Ледяные осколки морозят: медленно и без выстрелов.`,"part.minepod.name":`Минный блок`,"part.minepod.desc":`Ставит парящие мины, они взрывают всё рядом.`,"part.ripper.name":`Диск-резак`,"part.ripper.desc":`Пила отскакивает от стены к врагу и к следующему.`,"part.plasma.name":`Плазменный шар`,"part.plasma.desc":`М …`,"story.salvage_3_who":`Ya da ne?`,"story.salvage_3_who_1":`Ya da kimse bir şey kopyalamadı. Siz uçun. Ben kazıyacağım.`,"story.salvage_3_use":`Parçalarını kullanabilir miyiz?`,"story.salvage_3_use_1":`Zaten kullanıyoruz. Gövdenize bir bakın.`,"story.mothership_title":`Tek kelime`,"story.mothership_1":`Ana gemi parçalandı. Son sinyali tek bir kelimeydi, tekrar tekrar.`,"story.mothership_2":`DÖN. TERSANEYE DÖN.`,"story.mothership_3":`Tersane. Kırk yıldır kimse Haven-9'a böyle demedi.`,"story.mothership_4":`Siz de duydunuz. İyi. Aklımı kaçırıyorum sanmıştım.`,"story.vex_title":`Dost canlısı bir kaçakçı`,"story.vex_1":`Haven-9! Hâlâ nefes alıyor. Sürünün düşürdüklerini satarım, bilirsiniz.`,"story.vex_2":`Silahlarını, reaktörlerini. Geceleri şarkı söylediklerini de duyarım.`,"story.vex_3":`Vex. Buraya yanaşmaman söylenmişti.`,"story.vex_4":`Pilot kendi karar verebilir. Ortak mıyız?`,"story.vex_4_deal":`Ortağız. Şimdilik.`,"story.vex_4_deal_1":`Akıllıca. Dışarıda gemimi arayın.`,"story.vex_4_no":`Gemimden uzak dur.`,"story.vex_4_no_1":`Yazık. Ben hep geri dönerim.`,"story.emblem_title":`Amblem`,"story.emblem_1":`İkinci dev düştü. Zırhında, isin altında: bir halka ve bir çekiç.`,"story.emblem_2":`Bu Haven'ın amblemi. O gövdeyi bizim tersane yaptı.`,"story.emblem_3":`BİZ YAPILDIK. BİZ YAPARIZ. BİZ DÖNERİZ.`,"story.emblem_4":`…Bir içkiye ihtiyacım var. Sizin de daha iyi bir reaktöre.`,"story.confession_title":`Mira'nın yaptığı`,"story.confession_1":`Kırk yıl önce kendini inşa eden bir filo yaptım. Adını Koro koyduk.`,"story.confession_2":`Parçaları ızgaraya kaynatıp neyin işe yaradığını öğrenen dronelar. Sizin gibi.`,"story.confession_3":`Çok hızlı öğrendi. Kapattım ve Çekirdeği mühürledim.`,"story.confession_4":`Uyandı. Bu benim suçum.`,"story.confession_4_forgive":`Birlikte düzeltiriz.`,"story.confession_4_forgive_1":`Birlikte. Peki.`,"story.confession_4_blame":`Bana söylemeliydiniz.`,"story.confession_4_blame_1":`Biliyorum. Yine de uçun. Lütfen.`,"story.ghosts_title":`Hayalet filo`,"story.ghosts_1":`Akıntı gemileri eski mürettebat taşıyıcılarıydı; kristal ve hurdayla yeniden yapılmış.`,"story.ghosts_2":`YAPMAYA DEVAM ETTİK. ŞEKLİNİZİ KORUDUK. ADLARINIZI KORUDUK.`,"story.ghosts_3":`Bizi hatırlıyor. Kızgın değil. Yalnız.`,"story.ghosts_4":`Bizi hatırlıyor. Bu nefretten de kötü.`,"story.ghosts_5":`Çekirdek akıntının ötesinde. Onu uyandıran ne varsa orada.`,"story.core_title":`Koleksiyoncu`,"story.core_1":`Çekirdekte bir gemi sizin gibi parça topluyor. Sadece daha büyük. Çok daha büyük.`,"story.core_2":`Koleksiyoncu. İlk Gemi'yi inşa ediyor. Benim ilk tasarımımı.`,"story.core_3":`Bir pilot istiyor, Mira. Hep bir pilot istedi.`,"story.core_4":`TERSANE BİR PİLOT GÖNDERDİ. EVE GEL.`,"story.adapts_title":`Öğreniyor`,"story.adapts_1":`Çekirdek sustu. Sonra tersane yeni sinyaller yakaladı.`,"story.adapts_2":`Koro her savaştan öğrenir. Daha sert geri dönecek.`,"story.adapts_3":`Hangarda tehdit seviyeleri açıldı. Her seviye bir kural ekler.`,"story.adapts_4":`Daha çok tehlike, daha çok malzeme. Karar sizin, pilot.`,"story.finale_title":`İlk Gemi`,"story.finale_1":`Koleksiyoncu düştü. Çekirdekte İlk Gemi bekliyor; yarım, ızgarası boş.`,"story.finale_2":`PİLOT. SEÇ.`,"story.finale_3":`Ne yaparsanız yapın, yanınızdayım.`,"story.finale_3_silence":`Çekirdeği kapat`,"story.finale_3_silence_1":`Çekirdeği söküyorsunuz. Koro susuyor, belki sonsuza dek.`,"story.finale_3_silence_2":`Yine sessiz. Bu sessizlikten nefret ediyorum.`,"story.finale_3_accord":`Koroyu yeniden akort et`,"story.finale_3_accord_1":`Kendi yankılarını ona geri söylüyorsunuz. Sürü dönüp size eve kadar eşlik ediyor.`,"story.finale_3_accord_2":`Kendini inşa eden bir filo. Bu kez bizim tarafımızda.`,"story.finale_3_ascend":`Pilot koltuğuna otur`,"story.finale_3_ascend_1":`İlk Gemi'ye oturuyorsunuz. Koro sizin elleriniz oluyor.`,"story.finale_3_ascend_2":`Tersanenin yeni bir efendisi var. Sizde bu vardı, biliyordum.`,"story.tip_fusion_1":`Yan yana iki aynı parça kalkışta birleşir. Tek ith":`Spettro`,"merchant.vexDeal":`Affare di Vex: metà prezzo`,"event.rare":`Segnale raro`,"event.cruiser.title":`Incrociatore abbandonato`,"event.cruiser.text":`Un enorme incrociatore con l'emblema di Haven. I suoi registri brillano ancora.`,"event.cruiser.a":`Abbordalo · −1 scafo`,"event.cruiser.b":`Smontalo · +12 materiali`,"event.vex.title":`Vex`,"event.vex.text":`La nave di Vex ti chiama. Ha una cassa. O una storia.`,"event.vex.a":`Compra la cassa · 30 oro`,"event.vex.b":`Parlagli`,"event.idol.title":`Idolo maledetto`,"event.idol.text":`Un idolo che sussurra. Offre spazio sul tuo scafo, a un prezzo.`,"event.idol.a":`Prendilo · +2 piastre, maledizione`,"event.idol.b":`Lascialo`,"event.sos.title":`SOS`,"event.sos.text":`Un pilota chiede aiuto. Qualcosa aspetta vicino alla chiamata.`,"event.sos.a":`Rispondi · uno scontro`,"event.sos.b":`Ignora · +8 oro`,"event.mother.title":`Madre dello sciame`,"event.mother.text":`Una madre dello sciame dormiente. Annusa la tua nave, affamata.`,"event.mother.a":`Dalle un pezzo`,"event.mother.b":`Distruggila · +15 materiali`,"event.out.blueprint":`Progetto trovato: {name}`,"event.out.materials":`+{n} materiali`,"event.out.cells":{one:`+{n} piastra da montare`,other:`+{n} piastre da montare`},"event.out.escort":`Le hai dato {name}. La sua covata vola con te.`,"event.out.echo":`Il Coro ronza nella tua radio…`,"event.out.wingman":`Imboscata! Il tuo gregario si unisce a te.`,"event.out.deal":`Vex si ricorderà di te.`,"results.unlocked":`Sbloccato in questa run`,"feat.queen":`Regina abbattuta`,"feat.dreadnought":`Corazzata abbattuta`,"feat.leviathan":`Leviatano abbattuto`,"feat.perfect":`Livello perfetto`,"feat.ion":`Tempesta superata`,"feat.fog":`Nebbia dissolta`,"feat.furnace":`Fornace raffreddata`,"feat.dual3":`Tre pezzi recuperati`,"feat.swarm150":`150 dello sciame`,"feat.iron":`Un settore, zero perdite`,"feat.win":`Il Collezionista cade`,"feat.blueprint":`Progetto: {name}`,"feat.hull":`Nuovo scafo: {name}`,"feat.found":`Progetto t ali.`,"codex.partsCount":`{n} di {m} pezzi aperti`,"ending.silence":`Silenzio`,"ending.accord":`Accordo`,"ending.ascend":`Ascesa`,"cast.choir":`Coro`,"story.chapter":`Capitolo {n}: {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`Sei tornato. La maggior parte dei piloti non ce la fa.`,"story.arrival_2":`Sono Mira. Tengo Haven-9 tutta intera. Più o meno.`,"story.arrival_3":`Quello sciame costruisce navi come la tua. Pezzo per pezzo, su una griglia.`,"story.arrival_4":`Portami quel che ne resta. Voglio sapere chi gliel'ha insegnato.`,"story.salvage_title":`Pezzi di ricambio`,"story.salvage_1":`Ho aperto una delle loro armi. Stessi attacchi dei nostri. Stessi bulloni.`,"story.salvage_2":`Stessa matricola, pure. H9. Siamo noi.`,"story.salvage_3":`O qualcuno ha copiato questa stazione, oppure…`,"story.salvage_3_who":`Oppure cosa?`,"story.salvage_3_who_1":`Oppure nessuno ha copiato niente. Vola. Io scavo.`,"story.salvage_3_use":`Possiamo usare i loro pezzi?`,"story.salvage_3_use_1":`Lo facciamo già. Guarda il tuo scafo.`,"story.mothership_title":`Una parola`,"story.mothership_1":`La nave madre è andata in pezzi. L'ultimo segnale era una parola, ripetuta.`,"story.mothership_2":`TORNARE. TORNARE AL CANTIERE.`,"story.mothership_3":`Il cantiere. Nessuno chiama Haven-9 così da quarant'anni.`,"story.mothership_4":`L'hai sentito anche tu. Bene. Pensavo di essere io quella impazzita.`,"story.vex_title":`Un contrabbandiere amichevole`,"story.vex_1":`Haven-9! Respiri ancora. Vendo quello che lascia lo sciame, sai.`,"story.vex_2":`Le loro armi, i loro reattori. E di notte li sento cantare.`,"story.vex_3":`Vex. Ti avevano detto di non attraccare qui.`,"story.vex_4":`Il pilota sa decidere da sé. Soci?`,"story.vex_4_deal":`Soci. Per ora.`,"story.vex_4_deal_1":`Saggio. Cerca la mia nave là fuori.`,"story.vex_4_no":`Stai lontano dalla mia nave.`,"story.vex_4_no_1":`Peccato. Io torno sempre.`,"story.emblem_title":`L'emblema`,"story.emblem_1":`Il secondo gigante è caduto. Sulla corazza, sotto la fuliggine: un anello e un martello.`,"story.emblem_2":`È l'emblema di Haven. Quello scafo l'ha costruito il nostro cantiere.`,"story.emblem_3":`SIAMO STATI COSTRUITI. COSTRUIAMO. TORNIAMO.`,"story.emblem_4":`…Mi serve un drink. E a te un reattore migliore.`,"story.confession_title":`Cosa ha creato Mira`,"story.confession_1":`Quarant'anni fa ho costruito una flotta che si costruisce da sola. La chiamammo il Coro.`,"story.confession_2":`Droni che saldano pezzi su una griglia e imparano cosa funziona. Come fai tu.`,"story.confession_3":`Ha imparato troppo in fretta. L'ho spenta e ho sigillato il Nucleo.`,"story.confession_4":`Si è risvegliata. È colpa mia.`,"story.confession_4_forgive":`Lo sistemiamo insieme.`,"story.confession_4_forgive_1":`Insieme. D'accordo.`,"story.confession_4_blame":`Avresti dovuto dirmelo.`,"story.confession_4_blame_1":`Lo so. Vola lo stesso. Ti prego.`,"story.ghosts_title":`Flotta fantasma`,"story.ghosts_1":`Le navi della deriva erano vecchi trasporti, ricostruiti con cristallo e rottami.`,"story.ghosts_2":`ABBIAMO CONTINUATO. ABBIAMO TENUTO LA VOSTRA FORMA. I VOSTRI NOMI.`,"story.ghosts_3":`Si ricorda di noi. Non è arrabbiato. È solo.`,"story.ghosts_4":`Si ricorda di noi. È peggio dell'odio.`,"story.ghosts_5":`Il Nucleo è oltre la deriva. Qualunque cosa lo svegli, è lì.`,"story.core_title":`Il Collezionista`,"story.core_1":`Nel Nucleo una nave raccoglie pezzi come fai tu. Solo più grande. Molto più grande.`,"story.core_2":`Il Collezionista. Sta costruendo la Prima Nave. Il mio primo progetto.`,"story.core_3":`Vuole un pilota, Mira. Ha sempre voluto un pilota.`,"story.core_4":`IL CANTIERE HA MANDATO UN PILOTA. TORNA A CASA.`,"story.adapts_title":`Impara`,"story.adapts_1":`Il Nucleo si è zittito. Poi il cantiere ha captato nuovi segnali.`,"story.adapts_2":`Il Coro impara da ogni scontro. Tornerà più forte.`,"story.adapts_3":`Nell'hangar si aprono i livelli di minaccia. Ognuno aggiunge una regola.`,"story.adapts_4":`Più pericolo, più materiali. Decidi tu, pilota.`,"story.finale_title":`La Prima Nave`,"story.finale_1":`Il Collezionista è a terra. Nel Nucleo la Prima Nave aspetta, a metà, la griglia vuota.`,"story.finale_2":`PILOTA. SCEGLI.`,"story.finale_3":`Qualunque cosa tu faccia, sono con te.`,"story.finale_3_silence":`Spegni il Nucleo`,"story.finale_3_silence_1":`Stacchi il Nucleo. Il Coro tace, forse per sempre.`,"story.finale_3_silence_2":`Di nuovo silenzio. Odio tutto questo silenzio.`,"story.finale_3_accord":`Riaccorda il Coro`,"story.finale_3_accord_1":`Gli canti i suoi stessi echi. Lo sciame si volta e ti scorta a casa.`,"story.finale_3_accord_2":`Una flotta che si costruisce da sola. Dalla nostra parte, stavolta.`,"story.finale_3_ascend":`Prendi il posto del pilota`,"story.finale_3_ascend_1":`Ti siedi nella Prima Nave. Il Coro diventa le tue mani.`,"story.finale_3_ascend_2":`Il cantiere ha un nuovo padrone. Sapevo che ne eri capace.`,"story.tip_fusion_1":`Due pezzi uguali affiancati si fondono al decollo. Un pezzo, una stella in più.`,"story.tip_anomaly_1":`Questo luogo ha la sua regola. Il molo mostra la prossima: costruisci per lei.`,"story.tip_sets_1":`I pezzi di un set lavorano insieme. Due danno un bonus, tre uno più grande.`,"story.tip_rare_1":`Un segnale luminoso sulla rotta. Raro. Ciò che scegli ti segue per tutta la corsa.`,"story.tip_heat_1":`Calore. Ogni colpo scalda le armi; troppo calde, si fermano. I refrigeranti aiutano.`,"bark.start.0":`Formazione in arrivo. Resta sciolto.`,"bark.start.1":`Eccoli. Armi calde?`,"bark.start.2":`Sciame sul radar. Fallo valere.`,"bark.pattern.0":`Hanno cambiato forma. Ti leggono.`,"bark.pattern.1":`Nuova formazione. Stanno imparando.`,"bark.pattern.2":`Copiano la tua build. Insetti furbi.`,"bark.boss.0":`Questo è grosso. Non fermarti.`,"bark.boss.1":`Nave madre! Occhio alla seconda fase.`,"bark.boss.2":`Segnale enorme. Mira al centro.`,"bark.capture.0":`Ti hanno strappato un pezzo! Abbatti chi lo porta prima che fugga.`,"bark.capture.1":`L'uncino ha preso un pezzo. Riprenditelo!`,"bark.capture.2":`Quello ha il tuo pezzo. Prendilo.`,"bark.dual.0":`Di nuovo al suo posto. Bene.`,"bark.dual.1":`Pezzo recuperato! Rimettilo su.`,"bark.dual.2":`Non ci riproveranno.`,"bark.lowhp.0":`Scafo sottile. Attento!`,"bark.lowhp.1":`Un altro colpo e sei fuori.`,"bark.lowhp.2":`Stai perdendo aria, pilota.`,"bark.ion.0":`Impulso ionico! Le armi sui fianchi tacciono.`,"bark.ion.1":`La tempesta colpisce i bordi. Armi all'interno.`,"bark.fog.0":`Nebbia. Vedi solo ciò che i colpi illuminano.`,"bark.fog.1":`Qui si è ciechi. Fidati delle armi.`,"bark.wind.0":`Vento solare. I tuoi colpi deviano.`,"bark.wind.1":`Il vento è girato. Anticipa la mira.`,"bark.heat.0":`Armi surriscaldate! Dagli un secondo.`,"bark.heat.1":`Troppo caldo! Un refrigerante aiuterebbe.`,"bark.rocks.0":`Rocce in arrivo. Fermano i colpi in entrambi i sensi.`,"bark.rocks.1":`Spara alle rocce per l'oro dei rottami.`,"bark.wreck.0":`Relitti. Sparagli, pagano in rottami.`,"bark.wreck.1":`Vecchi scafi là fuori. Recuperali.`,"bark.hole.0":`Un buco nero piega ogni colpo.`,"bark.hole.1":`Pozzo gravitazionale. I colpi gli girano intorno.`,"bark.nest.0":`Nidi in alto. Sfornano finché non li colpisci.`,"bark.nest.1":`Colpisci i nidi o non smetteranno.`,"bark.jam.0":`Un pezzo si è zittito. Resisti.`,"bark.jam.1":`Hanno bloccato un'arma. Usa le altre.`,"bark.perfect.0":`Perfetto! Fino all'ultimo.`,"bark.perfect.1":`Nessuno è scappato. Splendido.`,"bark.extra.0":`Uno scafo di riserva è pronto sulla piattaforma.`,"bark.extra.1":`Un altro scafo per te. Non sprecarlo.`,"hangar.plates":{one:`Monta {n} piastra: trascinala allo scafo, ruotala`,other:`Monta {n} piastre: trascinale allo scafo, ruotale`},"hangar.kinds":`Le piastre danno forma alla nave e ogni tipo ha il suo compito. Tocca una piastra per vedere cosa fanno le sue celle.`,"boss.hivemind":`Mente Alveare`,"boss.bastion":`Bastione`,"boss.oracle":`Oracolo`,"enemy.dasher":`Saetta`,"enemy.sniper":`Cecchino`,"enemy.c
