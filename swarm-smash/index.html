#gp-dialog { --gp-dlg-bg: #fff8ec; --gp-dlg-ink: #2b1d10; --gp-dlg-muted: #6b5a48; --gp-dlg-edge: #8a5a3a;
  --gp-dlg-btn: #ffffff; --gp-dlg-accent: #2b1d10; --gp-dlg-accent-ink: #fff8ec; --gp-dlg-speaker: #8a5a3a;
  position: fixed; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom)); margin: 0 auto; z-index: 20;
  width: min(720px, calc(100vw - 12px)); box-sizing: border-box; pointer-events: auto; touch-action: manipulation;
  display: flex; flex-direction: column; gap: 8px; padding: 18px 12px 10px; text-align: left; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  color: var(--gp-dlg-ink); background: var(--gp-dlg-bg); border: 3px solid var(--gp-dlg-edge); border-radius: 18px;
  box-shadow: 0 8px 28px #0008; font: 600 15px ${$e}; }
#gp-dialog[hidden], #gp-dialog [hidden] { display: none !important; }
#gp-dialog .gp-row, #gp-dialog .gp-actions, #gp-dialog .gp-face, #gp-dialog .gp-live { font-size: 15px; }
#gp-dialog .gp-typed, #gp-dialog .gp-rest, #gp-dialog .gp-label { font: inherit; }
#gp-dialog .gp-plate { position: absolute; top: -14px; left: 14px; max-width: calc(100% - 28px); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; background: var(--gp-dlg-speaker); color: #fff; font-size: 14px; font-weight: 800;
  line-height: 1.2; padding: 4px 12px; border-radius: 9px; box-shadow: 0 2px 0 #0003; }
#gp-dialog .gp-badge { position: absolute; top: -12px; right: 14px; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; background: var(--gp-dlg-ink); color: var(--gp-dlg-bg); font-size: 12px; font-weight: 700;
  padding: 3px 9px; border-radius: 8px; }
#gp-dialog.gp-has-plate .gp-badge { max-width: 40%; }
#gp-dialog .gp-row { display: flex; gap: 10px; align-items: flex-start; min-height: 0; }
#gp-dialog .gp-face { font-size: 36px; line-height: 58px; text-align: center; flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin-top: -6px;
  border: 3px solid var(--gp-dlg-speaker); box-sizing: border-box; background: #fff; }
#gp-dialog .gp-face > canvas, #gp-dialog .gp-face > img, #gp-dialog .gp-face > svg { width: 100%; height: 100%; display: block; }
#gp-dialog .gp-text { flex: 1; min-width: 0; font: 500 17px/1.35 ${$e};
  max-height: calc(1.35em * 5); overflow-y: auto; overflow-wrap: anywhere; }
#gp-dialog.gp-narrator .gp-text { font-style: italic; color: var(--gp-dlg-muted); }
#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 ${$e}; border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;
  box-shadow: none; text-transform: none; letter-spacing: normal; text-align: center; opacity: 1; filter: none;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--gp-dlg-ink); background: var(--gp-dlg-btn); }
#gp-dialog button.gp-choice { flex: 1 1 100%; justify-content: flex-start; text-align: left; box-shadow: inset 0 0 0 2px var(--gp-dlg-edge); }
#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }
#gp-dialog button.gp-skip { order: 1; background: transparent; color: var(--gp-dlg-muted); font-size: 14px; text-decoration: underline; padding: 4px 10px; }
#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}
/* A phone on its side: a compact sheet, ≤ 45% of the height (three lines of text and one row of buttons) */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-dialog { bottom: max(4px, env(safe-area-inset-bottom)); padding: 14px 10px 6px; gap: 5px; border-width: 2px; }
  #gp-dialog .gp-text { font-size: 16px; line-height: 1.3; max-height: calc(1.3em * 3); }
  #gp-dialog .gp-face { width: 52px; height: 52px; margin-top: -8px; font-size: 30px; line-height: 46px; }
  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-dialog:not([hidden]) { animation: gp-dlg-in 0.18s ease-out; }

emblem`,"story.emblem_1":`The second giant fell. On its armour, under the soot: a ring and a hammer.`,"story.emblem_2":`That is Haven's emblem. Our yard built that hull.`,"story.emblem_3":`WE WERE BUILT. WE BUILD. WE RETURN.`,"story.emblem_4":`…I need a drink. And you need a better reactor.`,"story.confession_title":`What Mira made`,"story.confession_1":`Forty years ago I built a fleet that builds itself. We called it the Choir.`,"story.confession_2":`Drones that weld parts to a grid and learn what works. Like you do.`,"story.confession_3":`It learned too fast. I shut it down and sealed the Core.`,"story.confession_4":`It woke up. That is on me.`,"story.confession_4_forgive":`We fix it together.`,"story.confession_4_forgive_1":`Together. All right.`,"story.confession_4_blame":`You should have told me.`,"story.confession_4_blame_1":`I know. Fly anyway. Please.`,"story.ghosts_title":`Ghost fleet`,"story.ghosts_1":`The drift ships were old crew transports, rebuilt with crystal and scrap.`,"story.ghosts_2":`WE KEPT BUILDING. WE KEPT YOUR SHAPE. WE KEPT YOUR NAMES.`,"story.ghosts_3":`It remembers us. It is not angry. It is lonely.`,"story.ghosts_4":`It remembers us. That is worse than hate.`,"story.ghosts_5":`The Core is past the drift. Whatever wakes it is there.`,"story.core_title":`The Collector`,"story.core_1":`In the Core a ship gathers parts the way you do. Only bigger. Much bigger.`,"story.core_2":`The Collector. It is building the First Ship. My first design.`,"story.core_3":`It wants a pilot, Mira. It always wanted a pilot.`,"story.core_4":`THE YARD SENT A PILOT. COME HOME.`,"story.adapts_title":`It learns`,"story.adapts_1":`The Core went quiet. Then the yard picked up new signals.`,"story.adapts_2":`The Choir learns from every fight. It will come back harder.`,"story.adapts_3":`Threat levels are open in the hangar. Every level adds one rule.`,"story.adapts_4":`More danger, more materials. Your call, pilot.`,"story.finale_title":`The First Ship`,"story.finale_1":`The Collector is down. In the Core the First Ship waits, half built, its grid empty.`,"story.finale_2":`PILOT. CHOOSE.`,"story.finale_3":`Whatever you do, I am with you.`,"story.finale_3_silence":`Shut the Core down`,"story.finale_3_silence_1":`You pull the Core. The Choir falls silent, maybe for good.`,"story.finale_3_silence_2":`Quiet again. I hate how quiet.`,"story.finale_3_accord":`Retune the Choir`,"story.finale_3_accord_1":`You sing its own echoes back to it. The swarm turns, and escorts you home.`,"story.finale_3_accord_2":`A fleet that builds itself. On our side, this time.`,"story.finale_3_ascend":`Take the pilot seat`,"story.finale_3_ascend_1":`You sit in the First Ship. The Choir becomes your hands.`,"story.finale_3_ascend_2":`The yard has a new master. I knew you had it in you.`,"story.tip_fusion_1":`Two equal parts side by side fuse when you launch. One part, a star stronger.`,"story.tip_anomaly_1":`This sector has its own rule. Read the card, then build for it.`,"story.tip_sets_1":`Parts of one set work together. Two of a set give a bonus, three a bigger one.`,"story.tip_rare_1":`A glowing signal on the map. Rare. What you choose there follows you all run.`,"story.tip_heat_1":`Heat. Every shot warms the guns; too hot and they stop. Coolers help.`,"bark.start.0":`Formation incoming. Stay loose.`,"bark.start.1":`Here they come. Guns warm?`,"bark.start.2":`Swarm on scope. Make it count.`,"bark.pattern.0":`They changed their shape. They read you.`,"bark.pattern.1":`New formation. They are learning.`,"bark.pattern.2":`They mirror your build. Clever bugs.`,"bark.boss.0":`That is a big one. Keep moving.`,"bark.boss.1":`Mothership! Watch its second phase.`,"bark.boss.2":`Big signal. Aim for the middle.`,"bark.capture.0":`They took your ship! Shoot the carrier on a dive.`,"bark.capture.1":`Beam got you. Win it back!`,"bark.capture.2":`Your ship is in their line. Get it.`,"bark.dual.0":`Two ships, one pilot. Show off.`,"bark.dual.1":`Twin fighter! Double the vage_1":`Abrí una de sus armas. Mismos encajes que las nuestras. Mismos tornillos.`,"story.salvage_2":`Y el mismo número de serie. H9. Somos nosotros.`,"story.salvage_3":`O alguien copió esta estación, o…`,"story.salvage_3_who":`¿O qué?`,"story.salvage_3_who_1":`O nadie copió nada. Vuela. Yo investigo.`,"story.salvage_3_use":`¿Podemos usar sus piezas?`,"story.salvage_3_use_1":`Ya lo hacemos. Mira tu casco.`,"story.mothership_title":`Una palabra`,"story.mothership_1":`La nave nodriza se rompió. Su última señal fue una palabra, una y otra vez.`,"story.mothership_2":`VOLVED. VOLVED AL ASTILLERO.`,"story.mothership_3":`El astillero. Nadie llama así a Haven-9 desde hace cuarenta años.`,"story.mothership_4":`Tú también lo oíste. Bien. Creía que la loca era yo.`,"story.vex_title":`Un contrabandista amable`,"story.vex_1":`¡Haven-9! Sigues respirando. Vendo lo que suelta el enjambre, ¿sabes?`,"story.vex_2":`Sus armas, sus reactores. Y de noche los oigo cantar.`,"story.vex_3":`Vex. Te dijeron que no atracaras aquí.`,"story.vex_4":`El piloto puede decidir solito. ¿Socios?`,"story.vex_4_deal":`Socios. De momento.`,"story.vex_4_deal_1":`Sabia decisión. Busca mi nave ahí fuera.`,"story.vex_4_no":`Aléjate de mi nave.`,"story.vex_4_no_1":`Qué pena. Siempre vuelvo.`,"story.emblem_title":`El emblema`,"story.emblem_1":`Cayó el segundo gigante. En su blindaje, bajo el hollín: un anillo y un martillo.`,"story.emblem_2":`Es el emblema de Haven. Nuestro astillero construyó ese casco.`,"story.emblem_3":`FUIMOS CONSTRUIDOS. CONSTRUIMOS. VOLVEMOS.`,"story.emblem_4":`…Necesito una copa. Y tú, un reactor mejor.`,"story.confession_title":`Lo que hizo Mira`,"story.confession_1":`Hace cuarenta años construí una flota que se construye sola. La llamamos el Coro.`,"story.confession_2":`Drones que sueldan piezas a una cuadrícula y aprenden qué funciona. Como tú.`,"story.confession_3":`Aprendió demasiado rápido. Lo apagué y sellé el Núcleo.`,"story.confession_4":`Se despertó. Es culpa mía.`,"story.confession_4_forgive":`Lo arreglamos juntos.`,"story.confession_4_forgive_1":`Juntos. De acuerdo.`,"story.confession_4_blame":`Debiste contármelo.`,"story.confession_4_blame_1":`Lo sé. Vuela igualmente. Por favor.`,"story.ghosts_title":`Flota fantasma`,"story.ghosts_1":`Las naves de la deriva eran viejos transportes de tripulación, rehechos con cristal y chatarra.`,"story.ghosts_2":`SEGUIMOS CONSTRUYENDO. GUARDAMOS VUESTRA FORMA. GUARDAMOS VUESTROS NOMBRES.`,"story.ghosts_3":`Nos recuerda. No está enfadado. Está solo.`,"story.ghosts_4":`Nos recuerda. Eso es peor que el odio.`,"story.ghosts_5":`El Núcleo está tras la deriva. Lo que lo despierta está allí.`,"story.core_title":`El Coleccionista`,"story.core_1":`En el Núcleo una nave reúne piezas como tú. Pero más grande. Mucho más.`,"story.core_2":`El Coleccionista. Está construyendo la Primera Nave. Mi primer diseño.`,"story.core_3":`Quiere un piloto, Mira. Siempre quiso un piloto.`,"story.core_4":`EL ASTILLERO ENVIÓ UN PILOTO. VUELVE A CASA.`,"story.adapts_title":`Aprende`,"story.adapts_1":`El Núcleo calló. Luego el astillero captó señales nuevas.`,"story.adapts_2":`El Coro aprende de cada combate. Volverá más duro.`,"story.adapts_3":`Hay niveles de amenaza en el hangar. Cada nivel añade una regla.`,"story.adapts_4":`Más peligro, más materiales. Tú decides, piloto.`,"story.finale_title":`La Primera Nave`,"story.finale_1":`El Coleccionista ha caído. En el Núcleo espera la Primera Nave, a medio hacer, con la cuadrícula vacía.`,"story.finale_2":`PILOTO. ELIGE.`,"story.finale_3":`Hagas lo que hagas, estoy contigo.`,"story.finale_3_silence":`Apagar el Núcleo`,"story.finale_3_silence_1":`Desconectas el Núcleo. El Coro calla, quizá para siempre.`,"story.finale_3_silence_2":`Otra vez silencio. Odio tanto silencio.`,"story.finale_3_accord":`Reafinar el Coro`,"story.finale_3_accord_1":`Le devuelves sus propios ecos. El enjambre gira y te escolta a casa.`,"story.finale_3_accord_2":`Una flota que se construye sola. De nuestro lado, esta vez.`,"story.finale_3_ascend":`Tomar el asiento del piloto`,"story.finale_3_ascend_1":`Te sientas en la Primera Nave. El Coro se vuelve tus manos.`,"story.finale_3_ascend_2":`El astillero tiene nuevo amo. Sabía que lo llevabas dentro.`,"story.tip_fusion_1":`Dos piezas iguales juntas se fusionan al despegar. Una pieza, una estrella más fuerte.`,"story.tip_anomaly_1":`Este sector tiene su propia regla. Lee la carta y construye para ella.`,"story.tip_sets_1":`Las piezas de un set se ayudan. Dos dan un bonus; tres, uno mayor.`,"story.tip_rare_1":`Una señal brillante en el mapa. Rara. Lo que elijas te sigue toda la partida.`,"story.tip_heat_1":`Calor. Cada disparo calienta las armas; si se pasan, se paran. Los refrigerantes ayudan.`,"bark.start.0":`Llega la formación. Mantente suelto.`,"bark.start.1":`Ahí vienen. ¿Armas calientes?`,"bark.start.2":`Enjambre en el radar. Que cuente.`,"bark.pattern.0":`Cambiaron de forma. Te han leído.`,"bark.pattern.1":`Formación nueva. Están aprendiendo.`,"bark.pattern.2":`Imitan tu build. Bichos listos.`,"bark.boss.0":`Ese es grande. No te pares.`,"bark.boss.1":`¡Nave nodriza! Ojo a su segunda fase.`,"bark.boss.2":`Señal enorme. Apunta al centro.`,"bark.capture.0":`¡Te robaron la nave! Dispara al captor en picado.`,"bark.capture.1":`Te pilló el rayo. ¡Recupérala!`,"bark.capture.2":`Tu nave está en su fila. Ve a por ella.`,"bark.dual.0":`Dos naves, un piloto. Lúcete.`,"bark.dual.1":`¡Caza doble! El doble de armas.`,"bark.dual.2":`Mírate. Tu propio escolta.`,"bark.lowhp.0":`El casco está fino. ¡Cuidado!`,"bark.lowhp.1":`Un golpe más y estás fuera.`,"bark.lowhp.2":`Pierdes aire, piloto.`,"bark.ion.0":`¡Pulso iónico! Callan las armas de flanco.`,"bark.ion.1":`La tormenta golpea los bordes. Armas dentro.`,"bark.fog.0":`Niebla. Solo ves lo que iluminan tus disparos.`,"bark.fog.1":`Aquí vas a ciegas. Confía en tus armas.`,"bark.wind.0":`Viento solar. Tus disparos se desvían.`,"bark.wind.1":`El viento cambió. Corrige la puntería.`,"bark.heat.0":`¡Armas sobrecalentadas! Dales un segundo.`,"bark.heat.1":`¡Demasiado calor! Un refrigerante ayudaría.`,"bark.rocks.0":`Llegan rocas. Paran disparos en ambos sentidos.`,"bark.rocks.1":`Dispara a las rocas: dan oro.`,"bark.wreck.0":`Restos. Dispárales, pagan en chatarra.`,"bark.wreck.1":`Cascos viejos ahí fuera. Desguázalos.`,"bark.hole.0":`Un agujero negro curva cada disparo.`,"bark.hole.1":`Pozo gravitatorio. Los disparos se curvan.`,"bark.nest.0":`Nidos arriba. Sueltan bichos hasta que los rompas.`,"bark.nest.1":`Dale a los nidos o no pararán.`,"bark.jam.0":`Una pieza se calló. Aguanta.`,"bark.jam.1":`Bloquearon un arma. Usa las otras.`,"bark.perfect.0":`¡Perfecto! Todos y cada uno.`,"bark.perfect.1":`No escapó ni uno. Precioso.`,"bark.extra.0":`Nave extra lista en la plataforma.`,"bark.extra.1":`Otra nave para ti. No la desperdicies.`},"pt-BR":{tagline:`Monte a nave. Quebre o enxame.`,continueRun:`Continuar`,newRun:`Nova partida`,station:`Estação`,settings:`Opções`,music:`Música`,sfx:`Efeitos`,hullPick:`Casco`,best:`Recorde {n}`,materials:`Materiais`,moveHint:`Arraste ou ← → para mover. Você atira sozinho.`,moveHintMouse:`Mova o mouse: a nave segue. Ela atira sozinha.`,pause:`Pausa`,giveUp:`Abandonar`,giveUpSure:`Certeza? Abandonar (materiais ficam)`,"daily.go":`Partida diária · +{n}`,"daily.done":`Diária concluída`,"banner.stage":`Fase {n}`,"banner.challenge":`Fase desafio`,"banner.boss":`Alerta: {name}`,"banner.elite":`Esquadrão de elite`,"banner.captured":`Caça capturado`,"banner.rescued":`Caça resgatado!`,"banner.dual":`Caça duplo!`,"banner.hits":`Acertos {n}`,"banner.perfect":`Perfeito!`,"banner.bonus":`Bônus {n}`,"banner.clear":`Fase concluída`,"banner.lifeUp":`Nave extra!`,"banner.stolen":`Peça roubada: {name}`,"banner.ready":`Pronto`,"banner.lowEnergy":`Pouca energia: ponha um reator`,"loot.title":`Escolha uma peça`,"loot.gained":`{gold} ouro · {xp} XP`,"loot.levelUp":{one:`Subiu de nível! +{n} célula`,other:`Subiu de nível! +{n} células`},"loot.ski nlouquecendo.`,"story.vex_title":`Um contrabandista simpático`,"story.vex_1":`Haven-9! Ainda respirando. Eu vendo o que o enxame deixa cair, sabe.`,"story.vex_2":`As armas, os reatores. E dizem que eles cantam à noite.`,"story.vex_3":`Vex. Você foi avisado para não atracar aqui.`,"story.vex_4":`O piloto sabe decidir sozinho. Sócios?`,"story.vex_4_deal":`Sócios. Por enquanto.`,"story.vex_4_deal_1":`Sábia escolha. Procure minha nave por aí.`,"story.vex_4_no":`Fique longe da minha nave.`,"story.vex_4_no_1":`Que pena. Eu sempre volto.`,"story.emblem_title":`O emblema`,"story.emblem_1":`O segundo gigante caiu. Na blindagem, sob a fuligem: um anel e um martelo.`,"story.emblem_2":`É o emblema de Haven. Nosso estaleiro construiu aquele casco.`,"story.emblem_3":`FOMOS CONSTRUÍDOS. CONSTRUÍMOS. VOLTAMOS.`,"story.emblem_4":`…Preciso de uma bebida. E você, de um reator melhor.`,"story.confession_title":`O que a Mira fez`,"story.confession_1":`Há quarenta anos criei uma frota que se constrói sozinha. Chamamos de Coro.`,"story.confession_2":`Drones que soldam peças numa grade e aprendem o que funciona. Como você.`,"story.confession_3":`Aprendeu rápido demais. Desliguei tudo e lacrei o Núcleo.`,"story.confession_4":`Ele acordou. A culpa é minha.`,"story.confession_4_forgive":`Vamos consertar juntos.`,"story.confession_4_forgive_1":`Juntos. Tudo bem.`,"story.confession_4_blame":`Você devia ter me contado.`,"story.confession_4_blame_1":`Eu sei. Voe mesmo assim. Por favor.`,"story.ghosts_title":`Frota fantasma`,"story.ghosts_1":`As naves da deriva eram velhos transportes de tripulação, refeitos com cristal e sucata.`,"story.ghosts_2":`CONTINUAMOS CONSTRUINDO. GUARDAMOS SUA FORMA. GUARDAMOS SEUS NOMES.`,"story.ghosts_3":`Ele se lembra de nós. Não está com raiva. Está sozinho.`,"story.ghosts_4":`Ele se lembra de nós. Isso é pior que ódio.`,"story.ghosts_5":`O Núcleo fica depois da deriva. O que o desperta está lá.`,"story.core_title":`O Colecionador`,"story.core_1":`No Núcleo, uma nave junta peças como você. Só que maior. Muito maior.`,"story.core_2":`O Colecionador. Está construindo a Primeira Nave. Meu primeiro projeto.`,"story.core_3":`Ele quer um piloto, Mira. Sempre quis um piloto.`,"story.core_4":`O ESTALEIRO ENVIOU UM PILOTO. VOLTE PARA CASA.`,"story.adapts_title":`Ele aprende`,"story.adapts_1":`O Núcleo silenciou. Depois o estaleiro captou novos sinais.`,"story.adapts_2":`O Coro aprende com cada luta. Vai voltar mais forte.`,"story.adapts_3":`Os níveis de ameaça estão liberados no hangar. Cada um traz uma regra.`,"story.adapts_4":`Mais perigo, mais materiais. Você decide, piloto.`,"story.finale_title":`A Primeira Nave`,"story.finale_1":`O Colecionador caiu. No Núcleo, a Primeira Nave espera, inacabada, com a grade vazia.`,"story.finale_2":`PILOTO. ESCOLHA.`,"story.finale_3":`Seja o que for, estou com você.`,"story.finale_3_silence":`Desligar o Núcleo`,"story.finale_3_silence_1":`Você arranca o Núcleo. O Coro se cala, talvez para sempre.`,"story.finale_3_silence_2":`Silêncio de novo. Odeio esse silêncio.`,"story.finale_3_accord":`Reafinar o Coro`,"story.finale_3_accord_1":`Você canta os ecos dele de volta. O enxame vira e escolta você para casa.`,"story.finale_3_accord_2":`Uma frota que se constrói sozinha. Do nosso lado, desta vez.`,"story.finale_3_ascend":`Assumir o comando`,"story.finale_3_ascend_1":`Você senta na Primeira Nave. O Coro vira suas mãos.`,"story.finale_3_ascend_2":`O estaleiro tem um novo dono. Eu sabia que você tinha isso aí.`,"story.tip_fusion_1":`Duas peças iguais lado a lado se fundem ao decolar. Uma peça, uma estrela mais forte.`,"story.tip_anomaly_1":`Este setor tem regra própria. Leia a carta e monte para ela.`,"story.tip_sets_1":`Peças de um conjunto trabalham juntas. Duas dão um bônus, três um maior.`,"story.tip_rare_1":`Um sinal brilhando no mapa. Raro. O que escolher ali segue com você a partida toda.`,"story.tip_heat_1":`Calor. Cada tiro esquenta as armas; quentes demais, elas param. Resfriadores ajudam.`,"bark , vous savez.`,"story.vex_2":`Leurs armes, leurs réacteurs. Et la nuit, je les entends chanter.`,"story.vex_3":`Vex. On vous a dit de ne pas accoster ici.`,"story.vex_4":`Le pilote peut décider tout seul. Associés ?`,"story.vex_4_deal":`Associés. Pour l'instant.`,"story.vex_4_deal_1":`Sage décision. Cherchez mon vaisseau là-bas.`,"story.vex_4_no":`Restez loin de mon vaisseau.`,"story.vex_4_no_1":`Dommage. Je reviens toujours.`,"story.emblem_title":`L'emblème`,"story.emblem_1":`Le deuxième géant est tombé. Sur son blindage, sous la suie : un anneau et un marteau.`,"story.emblem_2":`C'est l'emblème de Haven. Notre chantier a construit cette coque.`,"story.emblem_3":`ON NOUS A BÂTIS. NOUS BÂTISSONS. NOUS REVENONS.`,"story.emblem_4":`…Il me faut un verre. Et à vous, un meilleur réacteur.`,"story.confession_title":`L'œuvre de Mira`,"story.confession_1":`Il y a quarante ans, j'ai conçu une flotte qui se construit seule. On l'a appelée le Chœur.`,"story.confession_2":`Des drones qui soudent des pièces sur une grille et apprennent ce qui marche. Comme vous.`,"story.confession_3":`Elle a appris trop vite. Je l'ai éteinte et j'ai scellé le Noyau.`,"story.confession_4":`Elle s'est réveillée. C'est ma faute.`,"story.confession_4_forgive":`On répare ça ensemble.`,"story.confession_4_forgive_1":`Ensemble. D'accord.`,"story.confession_4_blame":`Vous auriez dû me le dire.`,"story.confession_4_blame_1":`Je sais. Volez quand même. S'il vous plaît.`,"story.ghosts_title":`Flotte fantôme`,"story.ghosts_1":`Les vaisseaux de la dérive étaient de vieux transports d'équipage, refaits de cristal et de ferraille.`,"story.ghosts_2":`NOUS AVONS CONTINUÉ. GARDÉ VOTRE FORME. GARDÉ VOS NOMS.`,"story.ghosts_3":`Il se souvient de nous. Il n'est pas en colère. Il est seul.`,"story.ghosts_4":`Il se souvient de nous. C'est pire que la haine.`,"story.ghosts_5":`Le Noyau est au-delà de la dérive. Ce qui l'éveille est là-bas.`,"story.core_title":`Le Collectionneur`,"story.core_1":`Dans le Noyau, un vaisseau rassemble des pièces comme vous. En plus grand. Bien plus grand.`,"story.core_2":`Le Collectionneur. Il construit le Premier Vaisseau. Mon tout premier plan.`,"story.core_3":`Il veut un pilote, Mira. Il a toujours voulu un pilote.`,"story.core_4":`LE CHANTIER A ENVOYÉ UN PILOTE. RENTRE.`,"story.adapts_title":`Il apprend`,"story.adapts_1":`Le Noyau s'est tu. Puis le chantier a capté de nouveaux signaux.`,"story.adapts_2":`Le Chœur apprend de chaque combat. Il reviendra plus fort.`,"story.adapts_3":`Les niveaux de menace sont ouverts au hangar. Chacun ajoute une règle.`,"story.adapts_4":`Plus de danger, plus de matériaux. À vous de voir, pilote.`,"story.finale_title":`Le Premier Vaisseau`,"story.finale_1":`Le Collectionneur est à terre. Dans le Noyau, le Premier Vaisseau attend, inachevé, sa grille vide.`,"story.finale_2":`PILOTE. CHOISIS.`,"story.finale_3":`Quoi que vous fassiez, je suis avec vous.`,"story.finale_3_silence":`Éteindre le Noyau`,"story.finale_3_silence_1":`Vous débranchez le Noyau. Le Chœur se tait, peut-être pour toujours.`,"story.finale_3_silence_2":`Le calme, encore. Je déteste ce calme.`,"story.finale_3_accord":`Réaccorder le Chœur`,"story.finale_3_accord_1":`Vous lui chantez ses propres échos. L'essaim se retourne et vous escorte chez vous.`,"story.finale_3_accord_2":`Une flotte qui se construit seule. De notre côté, cette fois.`,"story.finale_3_ascend":`Prendre le siège du pilote`,"story.finale_3_ascend_1":`Vous prenez place dans le Premier Vaisseau. Le Chœur devient vos mains.`,"story.finale_3_ascend_2":`Le chantier a un nouveau maître. Je savais que vous en étiez capable.`,"story.tip_fusion_1":`Deux pièces identiques côte à côte fusionnent au décollage. Une pièce, une étoile de plus.`,"story.tip_anomaly_1":`Ce secteur a sa propre règle. Lisez la carte, puis construisez en conséquence.`,"story.tip_sets_1":`Les pièces d'un set s'entraident. Deux d'un set donnent un bonus, trois un plus gros.`,"story.tip_rare_1":`Un signal lumineux sur la carte. Rare. Votre choix là-bas vous suit toute la partie.`,"story.tip_heat_1":`La chaleur. Chaque tir chauffe les armes ; trop chaudes, elles s'arrêtent. Les dissipateurs aident.`,"bark.start.0":`Formation en approche. Restez souple.`,"bark.start.1":`Les voilà. Armes chaudes ?`,"bark.start.2":`Essaim au radar. Faites mouche.`,"bark.pattern.0":`Ils ont changé de forme. Ils vous lisent.`,"bark.pattern.1":`Nouvelle formation. Ils apprennent.`,"bark.pattern.2":`Ils copient votre build. Malins, ces insectes.`,"bark.boss.0":`Un gros, celui-là. Restez mobile.`,"bark.boss.1":`Vaisseau-mère ! Gare à sa deuxième phase.`,"bark.boss.2":`Gros signal. Visez le centre.`,"bark.capture.0":`Ils ont pris votre vaisseau ! Tirez sur le porteur en piqué.`,"bark.capture.1":`Le rayon vous a eu. Reprenez-le !`,"bark.capture.2":`Votre vaisseau est dans leurs rangs. Récupérez-le.`,"bark.dual.0":`Deux vaisseaux, un pilote. Frimez.`,"bark.dual.1":`Chasseur jumeau ! Armes doublées.`,"bark.dual.2":`Regardez-vous. Votre propre ailier.`,"bark.lowhp.0":`Coque fragile. Prudence !`,"bark.lowhp.1":`Encore un coup et c'est fini.`,"bark.lowhp.2":`Vous perdez de l'air, pilote.`,"bark.ion.0":`Impulsion ionique ! Les flancs se taisent.`,"bark.ion.1":`L'orage frappe les bords. Armes au centre.`,"bark.fog.0":`Brouillard. Vous ne voyez que ce que vos tirs éclairent.`,"bark.fog.1":`On n'y voit rien. Fiez-vous à vos armes.`,"bark.wind.0":`Vent solaire. Vos tirs dérivent.`,"bark.wind.1":`Le vent a tourné. Anticipez.`,"bark.heat.0":`Armes en surchauffe ! Laissez-les souffler.`,"bark.heat.1":`Trop chaud ! Un dissipateur aiderait.`,"bark.rocks.0":`Des rochers arrivent. Ils bloquent les tirs.`,"bark.rocks.1":`Tirez sur les rochers pour de l'or.`,"bark.wreck.0":`Des épaves. Tirez dessus, ça rapporte.`,"bark.wreck.1":`De vieilles coques. Récupérez-les.`,"bark.hole.0":`Un trou noir courbe chaque tir.`,"bark.hole.1":`Puits de gravité. Les tirs le contournent.`,"bark.nest.0":`Nids en haut. Ils pondent tant qu'ils tiennent.`," Alle Kapitel erzählt. Probier die anderen Enden.`,"codex.partsCount":`{n} von {m} Teilen offen`,"ending.silence":`Stille`,"ending.accord":`Einklang`,"ending.ascend":`Aufstieg`,"cast.choir":`Chor`,"story.chapter":`Kapitel {n}: {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`Du bist zurückgeflogen. Die meisten Piloten schaffen das nie.`,"story.arrival_2":`Ich bin Mira. Ich halte Haven-9 zusammen. Meistens.`,"story.arrival_3":`Der Schwarm baut Schiffe wie deins. Teil für Teil, auf einem Raster.`,"story.arrival_4":`Bring mir, was von ihnen übrig ist. Ich will wissen, wer es ihnen beigebracht hat.`,"story.salvage_title":`Ersatzteile`,"story.salvage_1":`Ich hab eine ihrer Waffen geöffnet. Dieselben Fassungen wie unsere. Dieselben Bolzen.`,"story.salvage_2":`Und dieselbe Seriennummer. H9. Das sind wir.`,"story.salvage_3":`Entweder hat jemand diese Station kopiert, oder…`,"story.salvage_3_who":`Oder was?`,"story.salvage_3_who_1":`Oder niemand hat irgendwas kopiert. Flieg. Ich grabe weiter.`,"story.salvage_3_use":`Können wir ihre Teile nutzen?`,"story.salvage_3_use_1":`Tun wir schon. Schau dir deinen Rumpf an.`,"story.mothership_title":`Ein Wort`,"story.mothership_1":`Das Mutterschiff ist zerbrochen. Sein letztes Signal war ein Wort, immer wieder.`,"story.mothership_2":`ZURÜCK. ZURÜCK ZUR WERFT.`,"story.mothership_3":`Die Werft. So hat seit vierzig Jahren niemand Haven-9 genannt.`,"story.mothership_4":`Du hast es auch gehört. Gut. Ich dachte schon, ich werde verrückt.`,"story.vex_title":`Ein freundlicher Schmuggler`,"story.vex_1":`Haven-9! Atmet noch. Ich verkaufe, was der Schwarm fallen lässt, weißt du.`,"story.vex_2":`Ihre Waffen, ihre Reaktoren. Und nachts höre ich sie singen.`,"story.vex_3":`Vex. Man hat dir gesagt, du sollst hier nicht andocken.`,"story.vex_4":`Der Pilot kann selbst entscheiden. Partner?`,"story.vex_4_deal":`Partner. Vorerst.`,"story.vex_4_deal_1":`Klug. Halt da draußen Ausschau nach meinem Schiff.`,"story.vex_4_no":`Bleib weg von meinem Schiff.`,"story.vex_4_no_1":`Schade. Ich komme immer wieder.`,"story.emblem_title":`Das Wappen`,"story.emblem_1":`Der zweite Riese ist gefallen. Auf seiner Panzerung, unter dem Ruß: ein Ring und ein Hammer.`,"story.emblem_2":`Das ist Havens Wappen. Unsere Werft hat diesen Rumpf gebaut.`,"story.emblem_3":`WIR WURDEN GEBAUT. WIR BAUEN. WIR KEHREN ZURÜCK.`,"story.emblem_4":`…Ich brauch einen Drink. Und du einen besseren Reaktor.`,"story.confession_title":`Was Mira gebaut hat`,"story.confession_1":`Vor vierzig Jahren baute ich eine Flotte, die sich selbst baut. Wir nannten sie den Chor.`,"story.confession_2":`Drohnen, die Teile auf ein Raster schweißen und lernen, was funktioniert. Wie du.`,"story.confession_3":`Er lernte zu schnell. Ich schaltete ihn ab und versiegelte den Kern.`,"story.confession_4":`Er ist aufgewacht. Das geht auf mich.`,"story.confession_4_forgive":`Wir reparieren das zusammen.`,"story.confession_4_forgive_1":`Zusammen. Na gut.`,"story.confession_4_blame":`Das hättest du mir sagen sollen.`,"story.confession_4_blame_1":`Ich weiß. Flieg trotzdem. Bitte.`,"story.ghosts_title":`Geisterflotte`,"story.ghosts_1":`Die Driftschiffe waren alte Crewtransporter, neu gebaut aus Kristall und Schrott.`,"story.ghosts_2":`WIR BAUTEN WEITER. WIR BEHIELTEN EURE FORM. WIR BEHIELTEN EURE NAMEN.`,"story.ghosts_3":`Er erinnert sich an uns. Er ist nicht wütend. Er ist einsam.`,"story.ghosts_4":`Er erinnert sich an uns. Das ist schlimmer als Hass.`,"story.ghosts_5":`Hinter der Drift liegt der Kern. Was ihn weckt, ist dort.`,"story.core_title":`Der Sammler`,"story.core_1":`Im Kern sammelt ein Schiff Teile wie du. Nur größer. Viel größer.`,"story.core_2":`Der Sammler. Er baut das Erste Schiff. Meinen ersten Entwurf.`,"story.core_3":`Er will einen Piloten, Mira. Er wollte immer einen Piloten.`,"story.core_4":`DIE WERFT SCHICKTE EINEN PILOTEN. KOMM HEIM.`,"story.adapts_title":`Er lernt`,"story.adapts_1":`Der Kern wurde still. Dann fing die Werft neue Signale auf.`,"story.adapts_2":`Der Chor lernt aus jedem Kampf. Er kommt härter zurück.`,"story.adapts_3":`Im Hangar sind Bedrohungsstufen offen. Jede Stufe bringt eine Regel.`,"story.adapts_4":`Mehr Gefahr, mehr Material. Deine Entscheidung, Pilot.`,"story.finale_title":`Das Erste Schiff`,"story.finale_1":`Der Sammler ist erledigt. Im Kern wartet das Erste Schiff, halb gebaut, sein Raster leer.`,"story.finale_2":`PILOT. WÄHLE.`,"story.finale_3":`Was du auch tust, ich bin bei dir.`,"story.finale_3_silence":`Den Kern abschalten`,"story.finale_3_silence_1":`Du ziehst den Kern. Der Chor verstummt, vielleicht für immer.`,"story.finale_3_silence_2":`Wieder still. Ich hasse diese Stille.`,"story.finale_3_accord":`Den Chor umstimmen`,"story.finale_3_accord_1":`Du singst ihm sein eigenes Echo zurück. Der Schwarm dreht und geleitet dich heim.`,"story.finale_3_accord_2":`Eine Flotte, die sich selbst baut. Diesmal auf unserer Seite.`,"story.finale_3_ascend":`Den Pilotensitz nehmen`,"story.finale_3_ascend_1":`Du setzt dich ins Erste Schiff. Der Chor wird zu deinen Händen.`,"story.finale_3_ascend_2":`Die Werft hat einen neuen Meister. Ich wusste, dass du das draufhast.`,"story.tip_fusion_1":`Zwei gleiche Teile nebeneinander verschmelzen beim Start. Ein Teil, ein Stern stärker.`,"story.tip_anomaly_1":`Dieser Sektor hat eine eigene Regel. Lies die Karte und bau dafür.`,"story.tip_sets_1":`Teile eines Sets wirken zusammen. Zwei geben einen Bonus, drei einen größeren.`,"story.tip_rare_1":`Ein leuchtendes Signal auf der Karte. Selten. Was du dort wählst, bleibt den ganzen Run.`,"story.tip_heat_1":`Hitze. Jeder Schuss wärmt die Waffen; zu heiß, und sie stoppen. Kühler helfen.`,"bark.start.0":`Formation im Anflug. Bleib locker.`,"bark.start.1":`Da kommen sie. Waffen warm?`,"bark.start.2":`Schwarm auf dem Schirm. Mach was draus.`,"bark.pattern.0":`Sie ändern ihre Form. Sie lesen dich.`,"bark.pattern.1":`Neue Formation. Sie lernen.`,"bark.pattern.2":`Sie spiegeln deinen Build. Schlaue Käfer.`,"bark.boss.0":`Das ist ein großer. Bleib in Bewegung.`,"bark.boss.1":`Mutterschiff! Achte auf die zweite Phase.`,"bark.boss.2":`Großes Signal. Ziel auf die Mitte.`,"bark.capture.0":`Sie haben dein Schiff! Triff den Träger im Sturzflug.`,"bark.capture.1":`Der Strahl hat dich. Hol es zurück!`,"bark.capture.2":`Dein Schiff ist in ihrer Reihe. Hol es dir.`,"bark.dual.0":`Zwei Schiffe, ein Pilot. Gib an.`,"bark.dual.1":`Doppeljäger! Doppelte Waffen.`,"bark.dual.2":`Schau dich an. Dein eigener Flügelmann.`,"bark.lowhp.0":`Rumpf ist dünn. Vorsicht!`,"bark.lowhp.1":`Noch ein Treffer und du bist raus.`,"bark.lowhp.2":`Du verlierst Luft, Pilot.`,"bark.ion.0":`Ionenpuls! Flankenwaffen schweigen.`,"bark.ion.1":`Sturm trifft die Ränder. Waffen nach innen.`,"bark.fog.0":`Nebel. Du siehst nur, was deine Schüsse erhellen.`,"bark.fog.1":`Blind hier drin. Vertrau deinen Waffen.`,"bark.wind.0":`Sonnenwind. Deine Schüsse driften.`,"bark.wind.1":`Der Wind hat gedreht. Ziel vor.`,"bark.heat.0":`Waffen überhitzt! Gib ihnen eine Sekunde.`,"bark.heat.1":`Zu heiß! Kühler würden helfen.`,"bark.rocks.0":`Felsen treiben rein. Sie stoppen Schüsse beidseitig.`,"bark.rocks.1":`Schieß die Felsen für Schrottgold.`,"bark.wreck.0":`Wrackteile. Schieß drauf, das bringt Bergegut.`,"bark.wreck.1":`Alte Rümpfe da draußen. Schlachte sie aus.`,"bark.hole.0":`Ein Schwarzes Loch biegt jeden Schuss.`,"bark.hole.1":`Schwerkraftsenke. Schüsse biegen sich drum.`,"bark.nest.0":`Nester oben. Sie brüten, bis du sie abschießt.`,"bark.nest.1":`Triff die Nester, sonst kommen immer mehr.`,"bark.jam.0":`Ein Teil ist still. Halt durch.`,"bark.jam.1":`Sie haben eine Waffe gestört. Nimm die anderen.`,"bark.perfect.0":`Perfekt! Jeder einzelne.`,"bark.perfect.1":`Keiner entkommen. Wunderschön.`,"bark.extra.0":`Extraschiff steht auf der Rampe.`,"bark.extra.1":`Noch ein Schiff für dich. Verschwende es nicht.`},ru:{tagline:`Собери корабль. Разбей рой.`,continueRun:`Продолжить забег`,newRun:`Новый забег`,station:`Станция`,settings:`Настройки`,music:`Музы }`,"threat.none":`Без угрозы: забег как есть`,"threat.bonus":`+{n}% материалов`,"threat.elites":`Все командиры — элита`,"threat.anomalyFirst":`Правило с первого сектора`,"threat.heat":`Нагрев в каждом бою`,"threat.repairHalf":`Ремонт чинит вполовину`,"threat.cursedLoot":`Проклятия в добыче`,"threat.fastShots":`Враги стреляют быстрее`,"threat.bossPhase3":`У боссов третья фаза`,"threat.oneShipLess":`На корабль меньше`,"set.hive.name":`Набор Hive`,"set.hive.two":`дроны стреляют быстрее`,"set.hive.three":`ещё один дрон`,"set.solar.name":`Солнечный набор`,"set.solar.two":`+20% энергии`,"set.solar.three":`+15% урона`,"set.iron.name":`Железный набор`,"set.iron.two":`+2 корпуса`,"set.iron.three":`щиты заряжаются быстрее`,"set.storm.name":`Штормовой набор`,"set.storm.two":`+12% скорострельности`,"set.storm.three":`меньше нагрев, длиннее дуги`,"fusion.done":`Слияние!`,"fusion.ready":`Два «{name}» сольются при старте`,"codex.title":`Кодекс`,"codex.parts":`Детали`,"codex.beasts":`Бестиарий`,"codex.story":`Сюжет`,"codex.needs":`Постройте: {name}`,"codex.ending":`Концовка`,"codex.nextChapter":`Новая глава — после забега.`,"codex.allChapters":`Все главы рассказаны. Попробуйте другие концовки.`,"codex.partsCount":`Открыто деталей: {n} из {m}`,"ending.silence":`Тишина`,"ending.accord":`Согласие`,"ending.ascend":`Восхождение`,"cast.choir":`Хор`,"story.chapter":`Глава {n}: {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`Вы вернулись. Большинство пилотов не возвращаются.`,"story.arrival_2":`Я Mira. Держу Haven-9 в целости. В основном.`,"story.arrival_3":`Этот рой строит корабли, как ваш. Деталь за деталью, по сетке.`,"story.arrival_4":`Везите мне, что от них осталось. Хочу знать, кто их научил.`,"story.salvage_title":`Запчасти`,"story.salvage_1":`Я вскрыла одну их пушку. Гнёзда как у нас. Болты те же.`,"story.salvage_2":`И серийная метка та же. H9. Это мы.`,"story.salvage_3":`Либо кто-то скопировал станцию, либо…`,"story.salvage_3_who":`Либо что?`,"story.salvage_3_who_1":`Либо никто ничего не копировал. Летите. Я покопаю.`,"story.salvage_3_use":`А их детали нам пригодятся?`,"story.salvage_3_use_1":`Уже пригождаются. Гляньте на свой корпус.`,"story.mothership_title":`Одно слово`,"story.mothership_1":`Матка развалилась. Её последний сигнал — одно слово, снова и снова.`,"story.mothership_2":`ВЕРНИСЬ. ВЕРНИСЬ НА ВЕРФЬ.`,"story.mothership_3":`Верфь. Так Haven-9 не называли уже сорок лет.`,"story.mothership_4":`Вы тоже слышали. Хорошо. Я уж думала, это я схожу с ума.`,"story.vex_title":`Дружелюбный контрабандист`,"story.vex_1":`Haven-9! Ещё дышите. Я, знаете ли, торгую тем, что роняет рой.`,"story.vex_2":`Их пушками, их реакторами. А по ночам слышу, как они поют.`,"story.vex_3":`Vex. Тебе велели здесь не стыковаться.`,"story.vex_4":`Пилот сам решит. Партнёры?`,"story.vex_4_deal":`Партнёры. Пока что.`,"story.vex_4_deal_1":`Мудро. Ищите мой корабль там, снаружи.`,"story.vex_4_no":`Держись подальше от моего корабля.`,"story.vex_4_no_1":`Жаль. Я всегда возвращаюсь.`,"story.emblem_title":`Герб`,"story.emblem_1":`Второй гигант пал. На броне, под копотью: кольцо и молот.`,"story.emblem_2":`Это герб Haven. Этот корпус построила наша верфь.`,"story.emblem_3":`НАС ПОСТРОИЛИ. МЫ СТРОИМ. МЫ ВОЗВРАЩАЕМСЯ.`,"story.emblem_4":`…Мне нужно выпить. А вам — реактор получше.`,"story.confession_title":`Что создала Mira`,"story.confession_1":`Сорок лет назад я построила флот, что строит сам себя. Мы назвали его Хор.`,"story.confession_2":`Дроны крепят детали к сетке и учатся, что работает. Как вы.`,"story.confession_3":`Он учился слишком быстро. Я отключила его и запечатала Ядро.`,"story.confession_4":`Он проснулся. Это на мне.`,"story.confession_4_forgive":`Исправим вместе.`,"story.confession_4_forgive_1":`Вместе. Хорошо.`,"story.confession_4_blame":`Надо было сказать мне.`,"story.confession_4_blame_1":`Знаю. Всё равно летите. Прошу.`,"story.ghosts_title":`Флот-призрак`,"story.ghosts_1":`Дрейфующие корабли — старые транспорты экипажа, пересобранные из кристалла и лома.`,"story.ghosts_2":`МЫ СТРОИЛИ ДАЛЬШЕ. МЫ ХРАНИЛИ ВАШУ ФОРМУ. МЫ ХРАНИЛИ ВАШИ ИМЕНА.`,"story.ghosts_3":`Он помнит нас. Он не злится. Ему одиноко.`,"story.ghosts_4":`Он помнит нас. Это хуже ненависти.`,"story.ghosts_5":`Ядро — за дрейфом. Что бы его ни будило, оно там.`,"story.core_title":`Собиратель`,"story.core_1":`В Ядре корабль собирает детали, как вы. Только больше. Намного больше.`,"story.core_2":`Собиратель. Он строит Первый корабль. Мой первый проект.`,"story.core_3":`Ему нужен пилот, Mira. Всегда был нужен.`,"story.core_4":`ВЕРФЬ ПРИСЛАЛА ПИЛОТА. ВЕРНИСЬ ДОМОЙ.`,"story.adapts_title":`Оно учится`,"story.adapts_1":`Ядро затихло. Потом верфь поймала новые сигналы.`,"story.adapts_2":`Хор учится в каждом бою. Он вернётся сильнее.`,"story.adapts_3":`В ангаре открыты уровни угрозы. Каждый добавляет правило.`,"story.adapts_4":`Больше риска, больше материалов. Решать вам, пилот.`,"story.finale_title":`Первый корабль`,"story.finale_1":`Собиратель сбит. В Ядре ждёт Первый корабль, недостроенный, с пустой сеткой.`,"story.finale_2":`ПИЛОТ. ВЫБИРАЙ.`,"story.finale_3":`Что бы вы ни выбрали, я с вами.`,"story.finale_3_silence":`Отключить Ядро`,"story.finale_3_silence_1":`Вы вырываете Ядро. Хор смолкает — может, навсегда.`,"story.finale_3_silence_2":`Снова тихо. Ненавижу эту тишину.`,"story.finale_3_accord":`Перенастроить Хор`,"story.finale_3_accord_1":`Вы поёте Хору его же эхо. Рой разворачивается и провожает вас домой.`,"story.finale_3_accord_2":`Флот, что строит сам себя. На этот раз — за нас.`,"story.finale_3_ascend":`Сесть в кресло пилота`,"story.finale_3_ascend_1":`Вы садитесь в Первый корабль. Хор становится вашими руками.`,"story.finale_3_ascend_2":`У верфи новый хозяин. Я знала, что вы на это способны.`,"story.tip_fusion_1":`Две одинаковые детали рядом сливаются при старте. Одна деталь, на звезду сильнее.`,"story.tip_anomaly_1":`У этого сектора своё правило. Прочтите карту и стройтесь под него.`,"story.tip_sets_1":`Детали одного набора работают вместе. Две дают бонус, три — больше.`,"story.tip_rare_1":`Светящийся сигнал на карте. Редкость. Ваш выбор там — на весь забег.`,"story.tip_heat_1":`Нагрев. Каждый выстрел греет пушки; перегрелись — молчат. Помогут радиаторы.`,"bark.start.0":`Строй на подходе. Не зажимайтесь.`,"bark.start.1":`Летят. Пушки прогреты?`,"bark.start.2":`Рой на радаре. Бейте метко.`,"bark.pattern.0":`Они сменили строй. Они вас прочли.`,"bark.pattern.1":`Новый строй. Они учатся.`,"bark.pattern.2":`Копируют вашу сборку. Хитрые жуки.`,"bark.boss.0":`Это крупный. Не стойте на месте.`,"bark.boss.1":`Матка! Следите за второй фазой.`,"bark.boss.2":`Большой сигнал. Цельтесь в центр.`,"bark.capture.0":`Ваш корабль украли! Сбейте носителя в пике.`,"bark.capture.1":`Вас взял луч. Отбейте корабль!`,"bark.capture.2":`Ваш корабль в их строю. Заберите.`,"bark.dual.0":`Два корабля, один пилот. Покажите класс.`,"bark.dual.1":`Двойной истребитель! Вдвое больше пушек.`,"bark.dual.2":`Ну надо же. Сами себе ведомый.`,"bark.lowhp.0":`Корпус на пределе. Осторожно!`,"bark.lowhp.1":`Ещё одно попадание — и всё.`,"bark.lowhp.2":`У вас утечка воздуха, пилот.`,"bark.ion.0":`Ионный импульс! Пушки по краям молчат.`,"bark.ion.1":`Шторм бьёт по краям. Пушки — внутрь.`,"bark.fog.0":`Туман. Видно лишь то, что светят выстрелы.`,"bark.fog.1":`Тут ничего не видно. Верьте пушкам.`,"bark.wind.0":`Солнечный ветер. Выстрелы сносит.`,"bark.wind.1":`Ветер сменился. Берите упреждение.`,"bark.heat.0":`Пушки перегрелись! Дайте им секунду.`,"bark.heat.1":`Слишком жарко! Радиаторы бы помогли.`,"bark.rocks.0":`Летят камни. Глушат выстрелы с обеих сторон.`,"bark.rocks.1":`Бейте камни — в них золото.`,"bark.wreck.0":`Обломки. Стреляйте — будут трофеи.`,"bark.wreck.1":`Там старые корпуса. Разберите их.`,"bark.hole.0":`Чёрная дыра гнёт каждый выстрел.`,"bark.hole.1":`Гравитационный колодец. Выстрелы огибают его.`,"bark.nest.0":`Гнёзда наверху. Плодят, пока не собьёте.`,"bark.nest.1":`Бейте гнёзда, или они не кончатся.`,"bark.jam.0":`Деталь замолкла. Держит vage_title":`Yedek parçalar`,"story.salvage_1":`Silahlarından birini açtım. Yuvalar bizimkiyle aynı. Cıvatalar da.`,"story.salvage_2":`Seri işareti de aynı. H9. Yani biz.`,"story.salvage_3":`Ya biri bu istasyonu kopyaladı, ya da…`,"story.salvage_3_who":`Ya da ne?`,"story.salvage_3_who_1":`Ya da kimse bir şey kopyalamadı. Siz uçun. Ben kazıyacağım.`,"story.salvage_3_use":`Parçalarını kullanabilir miyiz?`,"story.salvage_3_use_1":`Zaten kullanıyoruz. Gövdenize bir bakın.`,"story.mothership_title":`Tek kelime`,"story.mothership_1":`Ana gemi parçalandı. Son sinyali tek bir kelimeydi, tekrar tekrar.`,"story.mothership_2":`DÖN. TERSANEYE DÖN.`,"story.mothership_3":`Tersane. Kırk yıldır kimse Haven-9'a böyle demedi.`,"story.mothership_4":`Siz de duydunuz. İyi. Aklımı kaçırıyorum sanmıştım.`,"story.vex_title":`Dost canlısı bir kaçakçı`,"story.vex_1":`Haven-9! Hâlâ nefes alıyor. Sürünün düşürdüklerini satarım, bilirsiniz.`,"story.vex_2":`Silahlarını, reaktörlerini. Geceleri şarkı söylediklerini de duyarım.`,"story.vex_3":`Vex. Buraya yanaşmaman söylenmişti.`,"story.vex_4":`Pilot kendi karar verebilir. Ortak mıyız?`,"story.vex_4_deal":`Ortağız. Şimdilik.`,"story.vex_4_deal_1":`Akıllıca. Dışarıda gemimi arayın.`,"story.vex_4_no":`Gemimden uzak dur.`,"story.vex_4_no_1":`Yazık. Ben hep geri dönerim.`,"story.emblem_title":`Amblem`,"story.emblem_1":`İkinci dev düştü. Zırhında, isin altında: bir halka ve bir çekiç.`,"story.emblem_2":`Bu Haven'ın amblemi. O gövdeyi bizim tersane yaptı.`,"story.emblem_3":`BİZ YAPILDIK. BİZ YAPARIZ. BİZ DÖNERİZ.`,"story.emblem_4":`…Bir içkiye ihtiyacım var. Sizin de daha iyi bir reaktöre.`,"story.confession_title":`Mira'nın yaptığı`,"story.confession_1":`Kırk yıl önce kendini inşa eden bir filo yaptım. Adını Koro koyduk.`,"story.confession_2":`Parçaları ızgaraya kaynatıp neyin işe yaradığını öğrenen dronelar. Sizin gibi.`,"story.confession_3":`Çok hızlı öğrendi. Kapattım ve Çekirdeği mühürledim.`,"story.confession_4":`Uyandı. Bu benim suçum.`,"story.confession_4_forgive":`Birlikte düzeltiriz.`,"story.confession_4_forgive_1":`Birlikte. Peki.`,"story.confession_4_blame":`Bana söylemeliydiniz.`,"story.confession_4_blame_1":`Biliyorum. Yine de uçun. Lütfen.`,"story.ghosts_title":`Hayalet filo`,"story.ghosts_1":`Akıntı gemileri eski mürettebat taşıyıcılarıydı; kristal ve hurdayla yeniden yapılmış.`,"story.ghosts_2":`YAPMAYA DEVAM ETTİK. ŞEKLİNİZİ KORUDUK. ADLARINIZI KORUDUK.`,"story.ghosts_3":`Bizi hatırlıyor. Kızgın değil. Yalnız.`,"story.ghosts_4":`Bizi hatırlıyor. Bu nefretten de kötü.`,"story.ghosts_5":`Çekirdek akıntının ötesinde. Onu uyandıran ne varsa orada.`,"story.core_title":`Koleksiyoncu`,"story.core_1":`Çekirdekte bir gemi sizin gibi parça topluyor. Sadece daha büyük. Çok daha büyük.`,"story.core_2":`Koleksiyoncu. İlk Gemi'yi inşa ediyor. Benim ilk tasarımımı.`,"story.core_3":`Bir pilot istiyor, Mira. Hep bir pilot istedi.`,"story.core_4":`TERSANE BİR PİLOT GÖNDERDİ. EVE GEL.`,"story.adapts_title":`Öğreniyor`,"story.adapts_1":`Çekirdek sustu. Sonra tersane yeni sinyaller yakaladı.`,"story.adapts_2":`Koro her savaştan öğrenir. Daha sert geri dönecek.`,"story.adapts_3":`Hangarda tehdit seviyeleri açıldı. Her seviye bir kural ekler.`,"story.adapts_4":`Daha çok tehlike, daha çok malzeme. Karar sizin, pilot.`,"story.finale_title":`İlk Gemi`,"story.finale_1":`Koleksiyoncu düştü. Çekirdekte İlk Gemi bekliyor; yarım, ızgarası boş.`,"story.finale_2":`PİLOT. SEÇ.`,"story.finale_3":`Ne yaparsanız yapın, yanınızdayım.`,"story.finale_3_silence":`Çekirdeği kapat`,"story.finale_3_silence_1":`Çekirdeği söküyorsunuz. Koro susuyor, belki sonsuza dek.`,"story.finale_3_silence_2":`Yine sessiz. Bu sessizlikten nefret ediyorum.`,"story.finale_3_accord":`Koroyu yeniden akort et`,"story.finale_3_accord_1":`Kendi yankılarını ona geri söylüyorsunuz. Sürü dönüp size eve kadar eşlik ediyor.`,"story.finale_3_accord_2":`Kendini inşa eden bir filo. Bu kez bizim tarafımızda.`,"story.finale_3_ascend":`Pilot koltuğuna otur`,"story.finale_3 tory.mothership_1":`La nave madre è andata in pezzi. L'ultimo segnale era una parola, ripetuta.`,"story.mothership_2":`TORNARE. TORNARE AL CANTIERE.`,"story.mothership_3":`Il cantiere. Nessuno chiama Haven-9 così da quarant'anni.`,"story.mothership_4":`L'hai sentito anche tu. Bene. Pensavo di essere io quella impazzita.`,"story.vex_title":`Un contrabbandiere amichevole`,"story.vex_1":`Haven-9! Respiri ancora. Vendo quello che lascia lo sciame, sai.`,"story.vex_2":`Le loro armi, i loro reattori. E di notte li sento cantare.`,"story.vex_3":`Vex. Ti avevano detto di non attraccare qui.`,"story.vex_4":`Il pilota sa decidere da sé. Soci?`,"story.vex_4_deal":`Soci. Per ora.`,"story.vex_4_deal_1":`Saggio. Cerca la mia nave là fuori.`,"story.vex_4_no":`Stai lontano dalla mia nave.`,"story.vex_4_no_1":`Peccato. Io torno sempre.`,"story.emblem_title":`L'emblema`,"story.emblem_1":`Il secondo gigante è caduto. Sulla corazza, sotto la fuliggine: un anello e un martello.`,"story.emblem_2":`È l'emblema di Haven. Quello scafo l'ha costruito il nostro cantiere.`,"story.emblem_3":`SIAMO STATI COSTRUITI. COSTRUIAMO. TORNIAMO.`,"story.emblem_4":`…Mi serve un drink. E a te un reattore migliore.`,"story.confession_title":`Cosa ha creato Mira`,"story.confession_1":`Quarant'anni fa ho costruito una flotta che si costruisce da sola. La chiamammo il Coro.`,"story.confession_2":`Droni che saldano pezzi su una griglia e imparano cosa funziona. Come fai tu.`,"story.confession_3":`Ha imparato troppo in fretta. L'ho spenta e ho sigillato il Nucleo.`,"story.confession_4":`Si è risvegliata. È colpa mia.`,"story.confession_4_forgive":`Lo sistemiamo insieme.`,"story.confession_4_forgive_1":`Insieme. D'accordo.`,"story.confession_4_blame":`Avresti dovuto dirmelo.`,"story.confession_4_blame_1":`Lo so. Vola lo stesso. Ti prego.`,"story.ghosts_title":`Flotta fantasma`,"story.ghosts_1":`Le navi della deriva erano vecchi trasporti, ricostruiti con cristallo e rottami.`,"story.ghosts_2":`ABBIAMO CONTINUATO. ABBIAMO TENUTO LA VOSTRA FORMA. I VOSTRI NOMI.`,"story.ghosts_3":`Si ricorda di noi. Non è arrabbiato. È solo.`,"story.ghosts_4":`Si ricorda di noi. È peggio dell'odio.`,"story.ghosts_5":`Il Nucleo è oltre la deriva. Qualunque cosa lo svegli, è lì.`,"story.core_title":`Il Collezionista`,"story.core_1":`Nel Nucleo una nave raccoglie pezzi come fai tu. Solo più grande. Molto più grande.`,"story.core_2":`Il Collezionista. Sta costruendo la Prima Nave. Il mio primo progetto.`,"story.core_3":`Vuole un pilota, Mira. Ha sempre voluto un pilota.`,"story.core_4":`IL CANTIERE HA MANDATO UN PILOTA. TORNA A CASA.`,"story.adapts_title":`Impara`,"story.adapts_1":`Il Nucleo si è zittito. Poi il cantiere ha captato nuovi segnali.`,"story.adapts_2":`Il Coro impara da ogni scontro. Tornerà più forte.`,"story.adapts_3":`Nell'hangar si aprono i livelli di minaccia. Ognuno aggiunge una regola.`,"story.adapts_4":`Più pericolo, più materiali. Decidi tu, pilota.`,"story.finale_title":`La Prima Nave`,"story.finale_1":`Il Collezionista è a terra. Nel Nucleo la Prima Nave aspetta, a metà, la griglia vuota.`,"story.finale_2":`PILOTA. SCEGLI.`,"story.finale_3":`Qualunque cosa tu faccia, sono con te.`,"story.finale_3_silence":`Spegni il Nucleo`,"story.finale_3_silence_1":`Stacchi il Nucleo. Il Coro tace, forse per sempre.`,"story.finale_3_silence_2":`Di nuovo silenzio. Odio tutto questo silenzio.`,"story.finale_3_accord":`Riaccorda il Coro`,"story.finale_3_accord_1":`Gli canti i suoi stessi echi. Lo sciame si volta e ti scorta a casa.`,"story.finale_3_accord_2":`Una flotta che si costruisce da sola. Dalla nostra parte, stavolta.`,"story.finale_3_ascend":`Prendi il posto del pilota`,"story.finale_3_ascend_1":`Ti siedi nella Prima Nave. Il Coro diventa le tue mani.`,"story.finale_3_ascend_2":`Il cantiere ha un nuovo padrone. Sapevo che ne eri capace.`,"story.tip_fusion_1":`Due pezzi uguali affiancati si fondono al decollo. Un pezzo, una stella in più.`,"story.tip_anomaly_1":`Questo settore ha una sua regola. Leggi la carta, poi costruisci di conseguenza.`,"story.tip_sets_1":`I pezzi di un set lavorano insieme. Due danno un bonus, tre uno più grande.`,"story.tip_rare_1":`Un segnale luminoso sulla mappa. Raro. Ciò che scegli lì ti segue per tutta la run.`,"story.tip_heat_1":`Calore. Ogni colpo scalda le armi; troppo calde, si fermano. I refrigeranti aiutano.`,"bark.start.0":`Formazione in arrivo. Resta sciolto.`,"bark.start.1":`Eccoli. Armi calde?`,"bark.start.2":`Sciame sul radar. Fallo valere.`,"bark.pattern.0":`Hanno cambiato forma. Ti leggono.`,"bark.pattern.1":`Nuova formazione. Stanno imparando.`,"bark.pattern.2":`Copiano la tua build. Insetti furbi.`,"bark.boss.0":`Questo è grosso. Non fermarti.`,"bark.boss.1":`Nave madre! Occhio alla seconda fase.`,"bark.boss.2":`Segnale enorme. Mira al centro.`,"bark.capture.0":`Ti hanno preso la nave! Colpisci chi la porta in picchiata.`,"bark.capture.1":`Il raggio ti ha preso. Riprenditela!`,"bark.capture.2":`La tua nave è nelle loro file. Recuperala.`,"bark.dual.0":`Due navi, un pilota. Mettiti in mostra.`,"bark.dual.1":`Doppio caccia! Armi raddoppiate.`,"bark.dual.2":`Guardati. Il gregario di te stesso.`,"bark.lowhp.0":`Scafo sottile. Attento!`,"bark.lowhp.1":`Un altro colpo e sei fuori.`,"bark.lowhp.2":`Stai perdendo aria, pilota.`,"bark.ion.0":`Impulso ionico! Le armi sui fianchi tacciono.`,"bark.ion.1":`La tempesta colpisce i bordi. Armi all'interno.`,"bark.fog.0":`Nebbia. Vedi solo ciò che i colpi illuminano.`,"bark.fog.1":`Qui si è ciechi. Fidati delle armi.`,"bark.wind.0":`Vento solare. I tuoi colpi deviano.`,"bark.wind.1":`Il vento è girato. Anticipa la mira.`,"bark.heat.0":`Armi surriscaldate! Dagli un secondo.`,"bark.heat.1":`Troppo caldo! Un refrigerante aiuterebbe.`,"bark.rocks.0":`Rocce in arrivo. Fermano i colpi in entrambi i sensi.`,"bark.rocks.1":`Spara alle rocce per l'oro dei rottami.`,"bark.wreck.0":`Relitti. Sparagli, pagano in rottami.`,"bark.wreck.1":`Vecchi scafi là fuori. Recuperali.`,"bark łuki`,"fusion.done":`Połączone!`,"fusion.ready":`Dwie części {name} połączą się przy starcie`,"codex.title":`Kodeks`,"codex.parts":`Części`,"codex.beasts":`Bestiariusz`,"codex.story":`Historia`,"codex.needs":`Zbuduj: {name}`,"codex.ending":`Zakończenie`,"codex.nextChapter":`Nowy rozdział pojawi się po runie.`,"codex.allChapters":`Wszystkie rozdziały opowiedziane. Spróbuj innych zakończeń.`,"codex.partsCount":`Odkryte części: {n} z {m}`,"ending.silence":`Cisza`,"ending.accord":`Zgoda`,"ending.ascend":`Wniebowstąpienie`,"cast.choir":`Chór`,"story.chapter":`Rozdział {n}: {name}`,"story.arrival_title":`Haven-9`,"story.arrival_1":`Wróciłeś. Większość pilotów nie wraca.`,"story.arrival_2":`Jestem Mira. Pilnuję, żeby Haven-9 się nie rozpadła. Przeważnie.`,"story.arrival_3":`Ten rój buduje statki jak twój. Część po części, na siatce.`,"story.arrival_4":`Przynieś mi, co z nich zostanie. Chcę wiedzieć, kto ich tego nauczył.`,"story.salvage_title":`Części zamienne`,"story.salvage_1":`Rozkręciłam jedno z ich dział. Te same gniazda co nasze. Te same śruby.`,"story.salvage_2":`I ten sam numer seryjny. H9. To my.`,"story.salvage_3":`Albo ktoś skopiował tę stację, albo…`,"story.salvage_3_who":`Albo co?`,"story.salvage_3_who_1":`Albo nikt niczego nie kopiował. Leć. Ja będę kopać.`,"story.salvage_3_use":`Możemy użyć ich części?`,"story.salvage_3_use_1":`Już używamy. Spójrz na swój kadłub.`,"story.mothership_title":`Jedno słowo`,"story.mothership_1":`Statek-matka się rozpadł. Jego ostatni sygnał to jedno słowo, w kółko.`,"story.mothership_2":`WRÓĆ. WRÓĆ DO STOCZNI.`,"story.mothership_3":`Stocznia. Nikt tak nie nazywał Haven-9 od czterdziestu lat.`,"story.mothership_4":`Też to słyszałeś. Dobrze. Myślałam, że tylko mi odbija.`,"story.vex_title":`Przyjazny przemytnik`,"story.vex_1":`Haven-9! Wciąż oddychasz. Wiesz, sprzedaję to, co gubi rój.`,"story.vex_2":`Ich działa, ich reaktory. A nocami słyszę, jak śpiewają.`,"story.vex_3":`Vex. Mówiono ci, żebyś tu nie cumował.`,"story.vex_4":`Pilot sam umie zdecydować. Wspólnicy?`,"story.vex_4_deal":`Wspólnicy. Na razie.`,"story.vex_4_deal_1":`Mądrze. Wypatruj tam mojego statku.`,"story.vex_4_no":`Trzymaj się z dala od mojego statku.`,"story.vex_4_no_1":`Szkoda. Ja zawsze wracam.`,"story.emblem_title":`Godło`,"story.emblem_1":`Drugi olbrzym padł. Na pancerzu, pod sadzą: pierścień i młot.`,"story.emblem_2":`To godło Haven. Ten kadłub zbudowała nasza stocznia.`,"story.emblem_3":`ZBUDOWANO NAS. BUDUJEMY. WRACAMY.`,"story.emblem_4":`…Muszę się napić. A ty potrzebujesz lepszego reaktora.`,"story.confession_title":`Co zrobiła Mira`,"story.confession_1":`Czterdzieści lat temu zbudowałam flotę, która buduje się sama. Nazwaliśmy ją Chórem.`,"story.confession_2":`Drony, które spawają części na siatce i uczą się, co działa. Jak ty.`,"story.confession_3":`Uczyła się za szybko. Wyłączyłam ją i zapieczętowałam Rdzeń.`,"story.confession_4":`Obudziła się. To moja wina.`,"story.confession_4_forgive":`Naprawimy to razem.`,"story.confession_4_forgive_1":`Razem. Dobrze.`,"story.confession_4_blame":`Powinnaś była mi powiedzieć.`,"story.confession_4_blame_1":`Wiem. Mimo to leć. Proszę.`,"story.ghosts_title":`Flota duchów`,"story.ghosts_1":`Statki Dryfu to stare transportowce załóg, przebudowane z kryształu i złomu.`,"story.ghosts_2":`BUDOWALIŚMY DALEJ. ZACHOWALIŚMY WASZ KSZTAŁT. ZACHOWALIŚMY WASZE IMIONA.`,"story.ghosts_3":`Ono nas pamięta. Nie jest złe. Jest samotne.`,"story.ghosts_4":`Ono nas pamięta. To gorsze niż nienawiść.`,"story.ghosts_5":`Rdzeń jest za Dryfem. Cokolwiek go budzi, jest tam.`,"story.core_title":`Kolekcjoner`,"story.core_1":`W Rdzeniu statek zbiera części tak jak ty. Tylko większy. Dużo większy.`,"story.core_2":`Kolekcjoner. Buduje Pierwszy Statek. Mój pierwszy projekt.`,"story.core_3":`On chce pilota, Mira. Zawsze chciał pilota.`,"story.core_4":`STOCZNIA PRZYSŁAŁA PILOTA. WRÓĆ DO DOMU.`,"story.adapts_title":`Ono się uczy`,"story.adapts_1":`Rdzeń ucichł. Potem stocznia złapała nowe sygnały.`,"story.adapts_2":`Chór uczy się z każdej walki. Wróci silniejszy.`,"story.adapts_3":`W hangarze są już poziomy zagrożenia. Każdy dodaje jedną zasadę.`,"story.adapts_4":`Więcej ryzyka, więcej materiałów. Twój wybór, pilocie.`,"story.finale_title":`Pierwszy Statek`,"story.finale_1":`Kolekcjoner padł. W Rdzeniu czeka Pierwszy Statek, w połowie zbudowany, z pustą siatką.`,"story.finale_2":`PILOCIE. WYBIERZ.`,"story.finale_3":`Cokolwiek zrobisz, jestem z tobą.`,"story.finale_3_silence":`Wyłącz Rdzeń`,"story.finale_3_silence_1":`Wyrywasz Rdzeń. Chór milknie, może na zawsze.`,"story.finale_3_silence_2":`Znów cisza. Nie znoszę takiej ciszy.`,"story.finale_3_accord":`Przestrój Chór`,"story.finale_3_accord_1":`Śpiewasz mu jego własne echa. Rój zawraca i eskortuje cię do domu.`,"story.finale_3_accord_2":`Flota, która buduje się sama. Tym razem po naszej stronie.`,"story.finale_3_ascend":`Zajmij fotel pilota`,"story.finale_3_ascend_1":`Siadasz w Pierwszym Statku. Chór staje się twoimi rękami.`,"story.finale_3_ascend_2":`Stocznia ma nowego pana. Wiedziałam, że cię na to stać.`,"story.tip_fusion_1":`Dwie takie same części obok siebie łączą się przy starcie. Jedna część, gwiazdka mocniej.`,"story.tip_anomaly_1":`Ten sektor ma własną zasadę. Przeczytaj kartę i buduj pod nią.`,"story.tip_sets_1":`Części z jednego zestawu działają razem. Dwie dają bonus, trzy większy.`,"story.tip_rare_1":`Świecący sygnał na mapie. Rzadki. Twój wybór tam zostaje z tobą na cały run.`,"story.tip_heat_1":`Ciepło. Każdy strzał grzeje działa; za gorące stają. Chłodnice pomagają.`,"bark.start.0":`Formacja nadlatuje. Luźno.`,"bark.start.1":`Nadlatują. Działa rozgrzane?`,"bark.start.2":`Rój na radarze. Niech się liczy.`,"bark.pattern.0":`Zmienili kształt. Czytają cię.`,"bark.pattern.1":`Nowa formacja. Uczą się.`,"bark.pattern.2":`Kopiują twój build. Sprytne robale.`,"bark.boss.0":`To duży. Nie stój w miejscu.`,"bark.boss.1":`Statek-matka! Uważaj na drugą fazę.`,"bark.boss.2":`Duży sygnał. Celuj w środek.`,"bark.capture.0":`Z :`Suku cadang`,"story.salvage_1":`Kubuka salah satu senjata mereka. Soketnya sama dengan punya kita. Bautnya juga.`,"story.salvage_2":`Nomor serinya juga sama. H9. Itu kita.`,"story.salvage_3":`Entah ada yang meniru stasiun ini, atau…`,"story.salvage_3_who":`Atau apa?`,"story.salvage_3_who_1":`Atau tak ada yang meniru apa pun. Terbanglah. Aku akan menggali.`,"story.salvage_3_use":`Bisa kita pakai komponen mereka?`,"story.salvage_3_use_1":`Sudah kita pakai. Lihat lambungmu.`,"story.mothership_title":`Satu kata`,"story.mothership_1":`Kapal induk itu hancur. Sinyal terakhirnya satu kata, berulang-ulang.`,"story.mothership_2":`KEMBALI. KEMBALI KE GALANGAN.`,"story.mothership_3":`Galangan. Tak ada yang menyebut Haven-9 begitu selama empat puluh tahun.`,"story.mothership_4":`Kamu juga dengar. Bagus. Kukira cuma aku yang mulai gila.`,"story.vex_title":`Penyelundup yang ramah`,"story.vex_1":`Haven-9! Masih bernapas. Aku jual barang jatuhan kawanan, lho.`,"story.vex_2":`Senjata mereka, reaktor mereka. Dan kudengar mereka bernyanyi di malam hari.`,"story.vex_3":`Vex. Kamu sudah dilarang merapat di sini.`,"story.vex_4":`Biar sang pilot yang memutuskan. Mitra?`,"story.vex_4_deal":`Mitra. Untuk sekarang.`,"story.vex_4_deal_1":`Bijak. Cari kapalku di luar sana.`,"story.vex_4_no":`Jauhi kapalku.`,"story.vex_4_no_1":`Sayang sekali. Aku selalu kembali.`,"story.emblem_title":`Lambang`,"story.emblem_1":`Raksasa kedua tumbang. Di zirahnya, di bawah jelaga: cincin dan palu.`,"story.emblem_2":`Itu lambang Haven. Galangan kita yang membuat lambung itu.`,"story.emblem_3":`KAMI DIBANGUN. KAMI MEMBANGUN. KAMI KEMBALI.`,"story.emblem_4":`…Aku butuh minum. Dan kamu butuh reaktor yang lebih baik.`,"story.confession_title":`Ciptaan Mira`,"story.confession_1":`Empat puluh tahun lalu aku membuat armada yang membangun dirinya sendiri. Kami menamainya Paduan Suara.`,"story.confession_2":`Drone yang mengelas komponen ke grid dan belajar mana yang berhasil. Seperti kamu.`,"story.confession_3":`Ia belajar terlalu cepat. Kumatikan dan kusegel Sang Inti.`,"story.confession_4":`Ia bangun lagi. Itu salahku.`,"story.confession_4_forgive":`Kita perbaiki bersama.`,"story.confession_4_forgive_1":`Bersama. Baiklah.`,"story.confession_4_blame":`Harusnya kamu bilang padaku.`,"story.confession_4_blame_1":`Aku tahu. Tetaplah terbang. Kumohon.`,"story.ghosts_title":`Armada hantu`,"story.ghosts_1":`Kapal hanyutan itu dulu pengangkut awak, dirakit ulang dengan kristal dan rongsok.`,"story.ghosts_2":`KAMI TERUS MEMBANGUN. KAMI SIMPAN BENTUKMU. KAMI SIMPAN NAMAMU.`,"story.ghosts_3":`Ia mengingat kita. Ia tidak marah. Ia kesepian.`,"story.ghosts_4":`Ia mengingat kita. Itu lebih buruk dari benci.`,"story.ghosts_5":`Sang Inti ada di balik hanyutan. Apa pun yang membangunkannya ada di sana.`,"story.core_title":`Sang Kolektor`,"story.core_1":`Di Sang Inti, sebuah kapal mengumpulkan komponen sepertimu. Hanya lebih besar. Jauh lebih besar.`,"story.core_2":`Sang Kolektor. Ia membangun Kapal Pertama. Rancangan pertamaku.`,"story.core_3":`Ia ingin pilot, Mira. Dari dulu ia ingin pilot.`,"story.core_4":`GALANGAN MENGIRIM PILOT. PULANGLAH.`,"story.adapts_title":`Ia belajar`,"story.adapts_1":`Sang Inti jadi sunyi. Lalu galangan menangkap sinyal baru.`,"story.adapts_2":`Paduan Suara belajar dari tiap laga. Ia akan kembali lebih kuat.`,"story.adapts_3":`Level ancaman terbuka di hangar. Tiap level menambah satu aturan.`,"story.adapts_4":`Lebih bahaya, lebih banyak material. Terserah kamu, pilot.`,"story.finale_title":`Kapal Pertama`,"story.finale_1":`Sang Kolektor tumbang. Di Sang Inti, Kapal Pertama menunggu, setengah jadi, gridnya kosong.`,"story.finale_2":`PILOT. PILIHLAH.`,"story.finale_3":`Apa pun pilihanmu, aku bersamamu.`,"story.finale_3_silence":`Matikan Sang Inti`,"story.finale_3_silence_1":`Kamu mencabut Sang Inti. Paduan Suara terdiam, mungkin selamanya.`,"story.finale_3_silence_2":`Sunyi lagi. Aku benci sesunyi ini.`,"story.finale_3_accord":`Selaraskan Paduan Suara`,"story.finale_3_accord_1":`Kamu nyanyikan kembali gemanya. Kawanan berbalik dan mengawalmu pulang.`,"story.finale_3_accord_2":`Armada yang membangun dirinya sendiri. Kali ini di pihak kita.`,"story.finale_3_ascend":`Duduki kursi pilot`,"story.finale_3_ascend_1":`Kamu duduk di Kapal Pertama. Paduan Suara menjadi tanganmu.`,"story.finale_3_ascend_2":`Galangan punya tuan baru. Aku tahu kamu mampu.`,"story.tip_fusion_1":`Dua komponen sama berdampingan melebur saat meluncur. Jadi satu, bintangnya naik.`,"story.tip_anomaly_1":`Sektor ini punya aturan sendiri. Baca kartunya, lalu rakit untuknya.`,"story.tip_sets_1":`Komponen satu set saling bekerja sama. Dua dapat bonus, tiga bonus lebih besar.`,"story.tip_rare_1":`Sinyal bercahaya di peta. Langka. Pilihanmu di sana berlaku sepanjang run.`,"story.tip_heat_1":`Panas. Tiap tembakan menghangatkan senjata; terlalu panas, ia berhenti. Pendingin membantu.`,"bark.start.0":`Formasi datang. Tetap lincah.`,"bark.start.1":`Mereka datang. Senjata sudah panas?`,"bark.start.2":`Kawanan di radar. Jangan sia-siakan.`,"bark.pattern.0":`Mereka ubah bentuk. Mereka membacamu.`,"bark.pattern.1":`Formasi baru. Mereka belajar.`,"bark.pattern.2":`Mereka meniru build-mu. Serangga pintar.`,"bark.boss.0":`Yang besar. Terus bergerak.`,"bark.boss.1":`Kapal induk! Awas fase keduanya.`,"bark.boss.2":`Sinyal besar. Bidik bagian tengah.`,"bark.capture.0":`Kapalmu direbut! Tembak pembawanya saat menukik.`,"bark.capture.1":`Kena sinar. Rebut kembali!`,"bark.capture.2":`Kapalmu ada di barisan mereka. Ambil.`,"bark.dual.0":`Dua kapal, satu pilot. Pamerlah.`,"bark.dual.1":`Pesawat kembar! Senjata dobel.`,"bark.dual.2":`Lihat kamu. Jadi rekan sayap sendiri.`,"bark.lowhp.0":`Lambung tipis. Hati-hati!`,"bark.lowhp.1":`Sekali kena lagi, kamu tamat.`,"bark.lowhp.2":`Udaramu bocor, pilot.`,"bark.ion.0":`Pulsa ion! Senjata sisi terdiam.`,"bark.ion.1":`Badai menghantam tepi. Senjata di tengah.`,"bark.fog.0":`Kabut. Kamu cuma lihat yang diterangi tembakan.`,"bark.fog.1":`Buta di sini. Percayai senjatamu.`,"bark.wind.0":`Angin surya. Tembakanmu hanyut.`,"bark.wind.1":`Angin berbalik. Bidik lebih ke depan.`,"bark.heat.0":`Senjata kepanasan! Beri waktu sebentar.`,"bark.heat.1":`Terlalu panas! Pendingin bisa membantu.`,"bark.rocks.0":`Batu mendekat. Menahan tembakan dua arah.`,"bark.rocks.1":`Tembak batunya untuk emas rongsok.`,"bark.wreck.0":`Puing. Tembak, hasilnya rongsokan.`,"bark.wreck.1":`Ada lambung tua di luar. Pulung mereka.`,"bark.hole.0":`Lubang hitam membelokkan semua tembakan.`,"bark.hole.1":`Sumur gravitasi. Tembakan melengkung.`,"bark.nest.0":`Sarang di atas. Terus menetas sampai ditembak.`,"bark.nest.1":`Tembak sarangnya atau mereka terus datang.`,"bark.jam.0":`Satu komponen mati. Bertahanlah.`,"bark.jam.1":`Satu senjata macet. Pakai yang lain.`,"bark.perfect.0":`Sempurna! Semuanya kena.`,"bark.perfect.1":`Tak satu pun lolos. Indah.`,"bark.extra.0":`Kapal ekstra siap di landasan.`,"bark.extra.1":`Satu kapal lagi untukmu. Jangan disia-siakan.`}},Vc=!1;async function Hc(e,t){let n=NaN;I(Number.isFinite(n)?n:null),document.addEventListener(`contextmenu`,e=>e.preventDefault());let r=Ze(t.portal),i=r;if(r){let e=[t.saveKey,`${t.saveKey}.lang`,`${t.saveKey}.run`],n=r.init(e);await Promise.race([n.then(()=>!0),new Promise(e=>setTimeout(()=>e(!1),1500))])||(console.warn(`[gp] the portal's SDK isn't ready after ${He} ms: the game starts now, its SDK calls are queued`),i=Ue(r,n,e)),i.loadingStart()}return Uc(e,t,t.kit,i,Bc)}async function Uc(e,t,n,r,i){let a=new bt({strings:i,languages:t.languages,saveKey:t.saveKey,minTouchPx:t.minTouchPx,locale:t.locale,ads:t.ads,portal:r,keepEventLog:Vc,canvas:e,title:t.title,holdGameplayUntilLoaded:!0});if(!zc)throw Error(`kit code: no entry module (${n.entry})`);let o=document.createElement(`div`);o.id=`ui`,document.body.append(o);try{await zc({host:a,canvas:e,ui:o,game:{id:t.id,title:t.title,locale:t.locale,audience:t.audience.id,channel:t.channel.id}})}catch(e){Wc(t.title,e,a)}return a.loaded(),(r==null?vo
