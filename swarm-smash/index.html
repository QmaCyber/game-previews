my.`,"story.salvage_3":`Albo ktoś skopiował tę stację, albo…`,"story.salvage_3_who":`Albo co?`,"story.salvage_3_who_1":`Albo nikt niczego nie kopiował. Leć. Ja będę kopać.`,"story.salvage_3_use":`Możemy użyć ich części?`,"story.salvage_3_use_1":`Już używamy. Spójrz na swój kadłub.`,"story.mothership_title":`Jedno słowo`,"story.mothership_1":`Statek-matka się rozpadł. Jego ostatni sygnał to jedno słowo, w kółko.`,"story.mothership_2":`WRÓĆ. WRÓĆ DO STOCZNI.`,"story.mothership_3":`Stocznia. Nikt tak nie nazywał Haven-9 od czterdziestu lat.`,"story.mothership_4":`Też to słyszałeś. Dobrze. Myślałam, że tylko mi odbija.`,"story.vex_title":`Przyjazny przemytnik`,"story.vex_1":`Haven-9! Wciąż oddychasz. Wiesz, sprzedaję to, co gubi rój.`,"story.vex_2":`Ich działa, ich reaktory. A nocami słyszę, jak śpiewają.`,"story.vex_3":`Vex. Mówiono ci, żebyś tu nie cumował.`,"story.vex_4":`Pilot sam umie zdecydować. Wspólnicy?`,"story.vex_4_deal":`Wspólnicy. Na razie.`,"story.vex_4_deal_1":`Mądrze. Wypatruj tam mojego statku.`,"story.vex_4_no":`Trzymaj się z dala od mojego statku.`,"story.vex_4_no_1":`Szkoda. Ja zawsze wracam.`,"story.emblem_title":`Godło`,"story.emblem_1":`Drugi olbrzym padł. Na pancerzu, pod sadzą: pierścień i młot.`,"story.emblem_2":`To godło Haven. Ten kadłub zbudowała nasza stocznia.`,"story.emblem_3":`ZBUDOWANO NAS. BUDUJEMY. WRACAMY.`,"story.emblem_4":`…Muszę się napić. A ty potrzebujesz lepszego reaktora.`,"story.confession_title":`Co zrobiła Mira`,"story.confession_1":`Czterdzieści lat temu zbudowałam flotę, która buduje się sama. Nazwaliśmy ją Chórem.`,"story.confession_2":`Drony, które spawają części na siatce i uczą się, co działa. Jak ty.`,"story.confession_3":`Uczyła się za szybko. Wyłączyłam ją i zapieczętowałam Rdzeń.`,"story.confession_4":`Obudziła się. To moja wina.`,"story.confession_4_forgive":`Naprawimy to razem.`,"story.confession_4_forgive_1":`Razem. Dobrze.`,"story.confession_4_blame":`Powinnaś była mi powiedzieć.`,"story.confession_4_blame_1":`Wiem. Mimo to leć. Proszę.`,"story.ghosts_title":`Flota duchów`,"story.ghosts_1":`Statki Dryfu to stare transportowce załóg, przebudowane z kryształu i złomu.`,"story.ghosts_2":`BUDOWALIŚMY DALEJ. ZACHOWALIŚMY WASZ KSZTAŁT. ZACHOWALIŚMY WASZE IMIONA.`,"story.ghosts_3":`Ono nas pamięta. Nie jest złe. Jest samotne.`,"story.ghosts_4":`Ono nas pamięta. To gorsze niż nienawiść.`,"story.ghosts_5":`Rdzeń jest za Dryfem. Cokolwiek go budzi, jest tam.`,"story.core_title":`Kolekcjoner`,"story.core_1":`W Rdzeniu statek zbiera części tak jak ty. Tylko większy. Dużo większy.`,"story.core_2":`Kolekcjoner. Buduje Pierwszy Statek. Mój pierwszy projekt.`,"story.core_3":`On chce pilota, Mira. Zawsze chciał pilota.`,"story.core_4":`STOCZNIA PRZYSŁAŁA PILOTA. WRÓĆ DO DOMU.`,"story.adapts_title":`Ono się uczy`,"story.adapts_1":`Rdzeń ucichł. Potem stocznia złapała nowe sygnały.`,"story.adapts_2":`Chór uczy się z każdej walki. Wróci silniejszy.`,"story.adapts_3":`W hangarze są już poziomy zagrożenia. Każdy dodaje jedną zasadę.`,"story.adapts_4":`Więcej ryzyka, więcej materiałów. Twój wybór, pilocie.`,"story.finale_title":`Pierwszy Statek`,"story.finale_1":`Kolekcjoner padł. W Rdzeniu czeka Pierwszy Statek, w połowie zbudowany, z pustą siatką.`,"story.finale_2":`PILOCIE. WYBIERZ.`,"story.finale_3":`Cokolwiek zrobisz, jestem z tobą.`,"story.finale_3_silence":`Wyłącz Rdzeń`,"story.finale_3_silence_1":`Wyrywasz Rdzeń. Chór milknie, może na zawsze.`,"story.finale_3_silence_2":`Znów cisza. Nie znoszę takiej ciszy.`,"story.finale_3_accord":`Przestrój Chór`,"story.finale_3_accord_1":`Śpiewasz mu jego własne echa. Rój zawraca i eskortuje cię do domu.`,"story.finale_3_accord_2":`Flota, która buduje się sama. Tym razem po naszej stronie.`,"story.finale_3_ascend":`Zajmij fotel pilota`,"story.finale_3_ascend_1":`Siadasz w Pierwszym Statku. Chór staje się twoimi rękami.`,"story.finale_3_ascend_2":`Stocznia ma nowego pana. Wiedziałam, że cię na to stać.`,"story.tip_fusion_1":`Dwie takie same części obok siebie łączą się przy starcie. Jedna część, gwiazdka mocniej.`,"story.tip_anomaly_1":`To miejsce ma własną regułę. Dok pokazuje następną: buduj pod nią.`,"story.tip_sets_1":`Części z jednego zestawu działają razem. Dwie dają bonus, trzy większy.`,"story.tip_rare_1":`Świecący sygnał na trasie. Rzadki. Twój wybór tam zostaje na cały lot.`,"story.tip_heat_1":`Ciepło. Każdy strzał grzeje działa; za gorące stają. Chłodnice pomagają.`,"bark.start.0":`Formacja nadlatuje. Luźno.`,"bark.start.1":`Nadlatują. Działa rozgrzane?`,"bark.start.2":`Rój na radarze. Niech się liczy.`,"bark.pattern.0":`Zmienili kształt. Czytają cię.`,"bark.pattern.1":`Nowa formacja. Uczą się.`,"bark.pattern.2":`Kopiują twój build. Sprytne robale.`,"bark.boss.0":`To duży. Nie stój w miejscu.`,"bark.boss.1":`Statek-matka! Uważaj na drugą fazę.`,"bark.boss.2":`Duży sygnał. Celuj w środek.`,"bark.capture.0":`Wyrwali część! Zestrzel nosiciela, zanim ucieknie.`,"bark.capture.1":`Hak zabrał część. Odbij ją!`,"bark.capture.2":`Ten ma twoją część. Odbierz ją.`,"bark.dual.0":`Wróciła na miejsce. Ładnie.`,"bark.dual.1":`Część odbita! Załóż ją znowu.`,"bark.dual.2":`Drugi raz nie spróbują.`,"bark.lowhp.0":`Kadłub cienki. Ostrożnie!`,"bark.lowhp.1":`Jeszcze jedno trafienie i po tobie.`,"bark.lowhp.2":`Tracisz powietrze, pilocie.`,"bark.ion.0":`Impuls jonowy! Działa na bokach milkną.`,"bark.ion.1":`Burza bije w krawędzie. Działa do środka.`,"bark.fog.0":`Mgła. Widzisz tylko to, co oświetlą strzały.`,"bark.fog.1":`Tu nic nie widać. Zaufaj działom.`,"bark.wind.0":`Wiatr słoneczny. Strzały znosi.`,"bark.wind.1":`Wiatr się zmienił. Celuj z wyprzedzeniem.`,"bark.heat.0":`Działa przegrzane! Daj im chwilę.`,"bark.heat.1":`Za gorąco! Chłodnice by pomogły.`,"bark.rocks.0":`Nadlatują skały. Blokują strzały w obie strony.`,"bark.rocks.1":`Strzelaj w skały, będzie złoto.`,"bark.wreck.0":`Wraki. Strzelaj, płacą złomem.`,"bark.wreck.1":`Tam są stare kadłuby. Rozbierz je.`,"bark.hole.0":`Czarna dziura zagina każdy strzał.`,"ba ku jual barang jatuhan kawanan, lho.`,"story.vex_2":`Senjata mereka, reaktor mereka. Dan kudengar mereka bernyanyi di malam hari.`,"story.vex_3":`Vex. Kamu sudah dilarang merapat di sini.`,"story.vex_4":`Biar sang pilot yang memutuskan. Mitra?`,"story.vex_4_deal":`Mitra. Untuk sekarang.`,"story.vex_4_deal_1":`Bijak. Cari kapalku di luar sana.`,"story.vex_4_no":`Jauhi kapalku.`,"story.vex_4_no_1":`Sayang sekali. Aku selalu kembali.`,"story.emblem_title":`Lambang`,"story.emblem_1":`Raksasa kedua tumbang. Di zirahnya, di bawah jelaga: cincin dan palu.`,"story.emblem_2":`Itu lambang Haven. Galangan kita yang membuat lambung itu.`,"story.emblem_3":`KAMI DIBANGUN. KAMI MEMBANGUN. KAMI KEMBALI.`,"story.emblem_4":`…Aku butuh minum. Dan kamu butuh reaktor yang lebih baik.`,"story.confession_title":`Ciptaan Mira`,"story.confession_1":`Empat puluh tahun lalu aku membuat armada yang membangun dirinya sendiri. Kami menamainya Paduan Suara.`,"story.confession_2":`Drone yang mengelas komponen ke grid dan belajar mana yang berhasil. Seperti kamu.`,"story.confession_3":`Ia belajar terlalu cepat. Kumatikan dan kusegel Sang Inti.`,"story.confession_4":`Ia bangun lagi. Itu salahku.`,"story.confession_4_forgive":`Kita perbaiki bersama.`,"story.confession_4_forgive_1":`Bersama. Baiklah.`,"story.confession_4_blame":`Harusnya kamu bilang padaku.`,"story.confession_4_blame_1":`Aku tahu. Tetaplah terbang. Kumohon.`,"story.ghosts_title":`Armada hantu`,"story.ghosts_1":`Kapal hanyutan itu dulu pengangkut awak, dirakit ulang dengan kristal dan rongsok.`,"story.ghosts_2":`KAMI TERUS MEMBANGUN. KAMI SIMPAN BENTUKMU. KAMI SIMPAN NAMAMU.`,"story.ghosts_3":`Ia mengingat kita. Ia tidak marah. Ia kesepian.`,"story.ghosts_4":`Ia mengingat kita. Itu lebih buruk dari benci.`,"story.ghosts_5":`Sang Inti ada di balik hanyutan. Apa pun yang membangunkannya ada di sana.`,"story.core_title":`Sang Kolektor`,"story.core_1":`Di Sang Inti, sebuah kapal mengumpulkan komponen sepertimu. Hanya lebih besar. Jauh lebih besar.`,"story.core_2":`Sang Kolektor. Ia membangun Kapal Pertama. Rancangan pertamaku.`,"story.core_3":`Ia ingin pilot, Mira. Dari dulu ia ingin pilot.`,"story.core_4":`GALANGAN MENGIRIM PILOT. PULANGLAH.`,"story.adapts_title":`Ia belajar`,"story.adapts_1":`Sang Inti jadi sunyi. Lalu galangan menangkap sinyal baru.`,"story.adapts_2":`Paduan Suara belajar dari tiap laga. Ia akan kembali lebih kuat.`,"story.adapts_3":`Level ancaman terbuka di hangar. Tiap level menambah satu aturan.`,"story.adapts_4":`Lebih bahaya, lebih banyak material. Terserah kamu, pilot.`,"story.finale_title":`Kapal Pertama`,"story.finale_1":`Sang Kolektor tumbang. Di Sang Inti, Kapal Pertama menunggu, setengah jadi, gridnya kosong.`,"story.finale_2":`PILOT. PILIHLAH.`,"story.finale_3":`Apa pun pilihanmu, aku bersamamu.`,"story.finale_3_silence":`Matikan Sang Inti`,"story.finale_3_silence_1":`Kamu mencabut Sang Inti. Paduan Suara terdiam, mungkin selamanya.`,"story.finale_3_silence_2":`Sunyi lagi. Aku benci sesunyi ini.`,"story.finale_3_accord":`Selaraskan Paduan Suara`,"story.finale_3_accord_1":`Kamu nyanyikan kembali gemanya. Kawanan berbalik dan mengawalmu pulang.`,"story.finale_3_accord_2":`Armada yang membangun dirinya sendiri. Kali ini di pihak kita.`,"story.finale_3_ascend":`Duduki kursi pilot`,"story.finale_3_ascend_1":`Kamu duduk di Kapal Pertama. Paduan Suara menjadi tanganmu.`,"story.finale_3_ascend_2":`Galangan punya tuan baru. Aku tahu kamu mampu.`,"story.tip_fusion_1":`Dua komponen sama berdampingan melebur saat meluncur. Jadi satu, bintangnya naik.`,"story.tip_anomaly_1":`Tempat ini punya aturannya sendiri. Dok menunjukkan berikutnya: rakit untuknya.`,"story.tip_sets_1":`Komponen satu set saling bekerja sama. Dua dapat bonus, tiga bonus lebih besar.`,"story.tip_rare_1":`Sinyal bercahaya di rute. Langka. Pilihanmu di sana mengikutimu sepanjang lari.`,"story.tip_heat_1":`Panas. Tiap tembakan menghangatkan senjata; terlalu panas, ia berhenti. Pendingin membantu.`,"bark.start.0":`Formasi datang. Tetap lincah.`,"bark.start.1":`Mereka datang. Senjata sudah panas?`,"bark.start.2":`Kawanan di radar. Jangan sia-siakan.`,"bark.pattern.0":`Mereka ubah bentuk. Mereka membacamu.`,"bark.pattern.1":`Formasi baru. Mereka belajar.`,"bark.pattern.2":`Mereka meniru build-mu. Serangga pintar.`,"bark.boss.0":`Yang besar. Terus bergerak.`,"bark.boss.1":`Kapal induk! Awas fase keduanya.`,"bark.boss.2":`Sinyal besar. Bidik bagian tengah.`,"bark.capture.0":`Satu komponen direnggut! Tembak pembawanya sebelum kabur.`,"bark.capture.1":`Kaitnya membawa komponen. Rebut kembali!`,"bark.capture.2":`Yang itu membawa komponenmu. Ambil.`,"bark.dual.0":`Kembali ke tempatnya. Bagus.`,"bark.dual.1":`Komponen kembali! Pasang lagi.`,"bark.dual.2":`Mereka tak akan coba dua kali.`,"bark.lowhp.0":`Lambung tipis. Hati-hati!`,"bark.lowhp.1":`Sekali kena lagi, kamu tamat.`,"bark.lowhp.2":`Udaramu bocor, pilot.`,"bark.ion.0":`Pulsa ion! Senjata sisi terdiam.`,"bark.ion.1":`Badai menghantam tepi. Senjata di tengah.`,"bark.fog.0":`Kabut. Kamu cuma lihat yang diterangi tembakan.`,"bark.fog.1":`Buta di sini. Percayai senjatamu.`,"bark.wind.0":`Angin surya. Tembakanmu hanyut.`,"bark.wind.1":`Angin berbalik. Bidik lebih ke depan.`,"bark.heat.0":`Senjata kepanasan! Beri waktu sebentar.`,"bark.heat.1":`Terlalu panas! Pendingin bisa membantu.`,"bark.rocks.0":`Batu mendekat. Menahan tembakan dua arah.`,"bark.rocks.1":`Tembak batunya untuk emas rongsok.`,"bark.wreck.0":`Puing. Tembak, hasilnya rongsokan.`,"bark.wreck.1":`Ada lambung tua di luar. Pulung mereka.`,"bark.hole.0":`Lubang hitam membelokkan semua tembakan.`,"bark.hole.1":`Sumur gravitasi. Tembakan melengkung.`,"bark.nest.0":`Sarang di atas. Terus menetas sampai ditembak.`,"bark.nest.1":`Tembak sarangnya atau mereka terus datang.`,"bark.jam.0":`Satu komponen mati. Bertahanlah.`,"bark.jam.1":`Satu senjata macet. Pakai yang lain.`,"bark.perfect.0":`Sempurna! Semuanya kena.`,"bark.perfect.1":`Tak satu pun lolos. Indah.`,"bark.extra.0":`Lambung cadangan siap di landasan.`,"bark.extra.1":`Satu lambung lagi untukmu. Jangan disia-siakan.`,"hangar.plates":{other:`Pasang {n} pelat: seret ke lambung, putar`},"hangar.kinds":`Pelat membentuk kapal, dan tiap jenis punya tugasnya. Ketuk pelat untuk melihat fungsi selnya.`,"boss.hivemind":`Pikiran Sarang`,"boss.bastion":`Benteng`,"boss.oracle":`Orakel`,"enemy.dasher":`Pelesat`,"enemy.sniper":`Penembak Jitu`,"enemy.carrier":`Pengangkut`,"enemy.mite":`Tungau`,"enemy.shieldbearer":`Pembawa Perisai`,"enemy.bomber":`Pengebom`,"hangar.platesOff":{other:`{n} pelat di gudang: seret ke lambung`},"hangar.filterAll":`Semua`,"hangar.filterPlates":`Pelat`,"hangar.sort.rarity":`Kelangkaan`,"hangar.sort.kind":`Jenis`,"hangar.power":`+{n}% daya`,"hangar.refine":`▲ {rarity} · {n}`,"hangar.unrefine":`▼ Batal · +{n}`,"hangar.merge":`★ Gabung kembar`,"hangar.split":`Pisah ★ · +1 bagian`,"hangar.plateInfo":`Pelat lambung: pindahkan atau lepas dari kapal; ketuk lagi untuk memutar`,"hangar.unplate":`Lepas · kembali 100%`,"hangar.plateLock.part":`Ada bagian di atasnya: pindahkan dulu`,"hangar.plateLock.split":`Menahan pelat lain: lepas itu dulu`,"hangar.modDoes":`Pada senjata di bintangnya: {what}`,"hangar.mods":`Mod terpasang: {list}`,"part.flamer.name":`Pelontar Api`,"part.flamer.desc":`Kerucut api pendek yang membakar kawanan.`,"part.frost.name":`Meriam Kriogenik`,"part.frost.desc":`Serpihan es yang membekukan: lambat dan tak menembak.`,"part.minepod.name":`Peluncur Ranjau`,"part.minepod.desc":`Menebar ranjau melayang yang meledak bila didekati.`,"part.ripper.name":`Cakram Pencabik`,"part.ripper.desc":`Gergaji yang memantul dari dinding ke musuh ke musuh.`,"part.plasma.name":`Bola Plasma`,"part.plasma.desc":`Bola lambat yang membesar saat terbang dan menembus.`,"part.beamer.name":`Sinar Memanas`,"part.beamer.desc":`Sinar yang makin panas makin lama menyala.`,"part.gravwell.name":`Sumur Gravitasi`,"part.gravwell.desc":`Titik gelap yang menarik musuh dan membelokkan tembakan.`,"part.sp
