    #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;

                  background: #0b1530e6; border: 1px solid #ffffff1f; padding: 18px 24px; border-radius: 20px; max-width: min(88vw, 520px);
                  box-sizing: border-box; box-shadow: 0 10px 40px #0008; }
    #ui h1 { margin: 0; font-size: 44px; letter-spacing: 1px; font-weight: 800;
             background: linear-gradient(180deg, #fff6c8, #ffd76b 55%, #8fc4ff); -webkit-background-clip: text; background-clip: text; color: transparent;
             filter: drop-shadow(0 0 14px #ffd76b55); }
    #ui h2 { margin: 0; font-size: 26px; }
    #ui .sub { color: #b8c6e8; font-size: 15px; max-width: 34ch; }

                 background: #ffd76b; color: #1a1430; cursor: pointer; padding: 0 20px; }
    #ui button.alt { background: #24345e; color: #eef3ff; }
    #ui button:disabled, #ui button[aria-disabled=true] { opacity: 0.55; }
    #ui .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    #ui .stars { display: flex; gap: 4px; justify-content: center; }
    #ui .hud { position: fixed; top: 6px; left: 8px; right: 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; pointer-events: none; }
    #ui .hud .name { justify-self: start; text-align: left; font-size: 14px; color: #c9d6f5; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
    #ui .hud .name b { display: block; color: #fff; font-size: 15px; }
    #ui .hud .count { font-size: 28px; font-weight: 800; color: #fff; text-shadow: 0 0 12px #e9ff8a88; }
    #ui .hud .count small { font-size: 16px; color: #c9d6f5; }
    #ui .hud .count.pop { animation: pop 0.25s ease-out; }
    @keyframes pop { from { transform: scale(1.35); } to { transform: scale(1); } }
    #ui .hud .right { justify-self: end; display: flex; gap: 8px; align-items: center; }
    #ui .hud .pause { pointer-events: auto; min-width: ${S}px; width: ${S}px; padding: 0; display: grid; place-items: center; background: #24345ecc; color: #fff; }
    #ui .hud .loops { display: flex; gap: 4px; margin-top: 4px; justify-content: center; }
    #ui .hud .loops i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #8fc4ff; box-sizing: border-box; }
    #ui .hud .loops i.used { background: #8fc4ff; }
    #ui .hud .loops i.now { background: #ffd76b; border-color: #ffd76b; }
    #ui .hud .bar { height: 5px; width: min(46vw, 260px); background: #ffffff22; border-radius: 3px; margin: 5px auto 0; overflow: hidden; }
    #ui .hud .bar div { height: 100%; background: linear-gradient(90deg, #ffd76b, #e9ff8a); width: 100%; }
    #ui .hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: #0b1530e6; border: 1px solid #ffffff2a;

    #ui .hint b { display: block; color: #fff; font-size: 16px; margin-bottom: 2px; }
    #ui .hint .short { display: none; }
    @media (max-height: 460px) { #ui .hint { font-size: 13px; padding: 4px 12px; bottom: 6px; } #ui .hint b { font-size: 14px; display: inline; margin-right: 8px; }

    #ui .wide { width: min(94vw, 720px); max-width: min(94vw, 720px); max-height: 92vh; overflow: auto; }
    #ui .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(${S*1.6}px, 1fr)); gap: 8px; width: 100%; }
    #ui .grid button { min-width: 0; width: 100%; min-height: ${S+10}px; border-radius: 14px; padding: 4px; display: flex; flex-direction: column;

    #ui .grid button small { font-size: 14px; color: #5a3600; font-weight: 800; letter-spacing: 1px; }
    #ui .grid button.alt small { color: #ffd76b; }
    #ui .cards { display: grid; gap: 8px; width: 100%; }
