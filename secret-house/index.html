`Ropes, stripes, the sea in every room: that's home.`,"buyer.light":`Clean lines, glass and light. Make the old tower modern.`,"buyer.manor":`Velvet, candles, a little darkness. Perfect for writing.`,"buyer.clock":`Records, sunbursts, mustard sofas. The good old days!`,"house.rose.name":`Grandma Rose's Flat`,"house.rose.intro":`The flat is yours now, dear. Clean it well: it remembers more than I ever told you.`,"house.rose.wall1":`Don't sell the box`,"house.rose.clue1":`Scrawled in pencil under the soot: “Don't sell the box.” Which box?`,"house.rose.clue2":`Small wet footprints lead from the bed to the wall… and stop.`,"house.rose.clue3":`A door-shaped crack under the old wallpaper. Someone papered over a door!`,"house.rose.page":`A tiny sewing room. Rose's music box, a bundle of letters from Tom the sailor, and a photo of the two of them by the lighthouse. Every night she played his song and waited.`,"house.cabin.name":`The Hale Lake Cabin`,"house.cabin.intro":`Dad's cabin. We searched the lake for his boat for twenty years. Maybe you'll have better luck.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`The lake gives back`,"house.cabin.clue1":`Numbers scratched under the mold: N47 W12. A place on the lake?`,"house.cabin.clue2":`Carved deep into the planks: “The lake gives back what it takes.”`,"house.cabin.clue3":`Under the floor's grime: a trapdoor with an iron ring.`,"house.cabin.page":`Dad's brass diving helmet and a map with an X at N47 W12. The brothers found the boat at last, and in it a tin box addressed to “Ada, the lighthouse”.`,"house.light.name":`The Old Lighthouse`,"house.light.intro":`Keeper Ada's log, last page: “Nov 3. The lamp went dark. I'll fix it tomorrow.” That was long ago.`,"house.light.wall1":`Nov 3: the lamp is dark`,"house.light.clue1":`Under the salt crust, in a hurry: “Nov 3: the lamp is dark.”`,"house.light.clue2":`A child's drawing: a ship, a lighthouse beam. Signed “Tom, age 7”.`,"house.light.clue3":`Behind the stones: the outline of a small iron door.`,"house.light.page":`The keeper's study. Tom's cap, his telescope, and a letter he never sent: “Rose, wait for me at the clock shop at midnight.” Ada kept it, hoping he would deliver it himself.`,"house.manor.name":`Ashcombe Manor`,"house.manor.intro":`A note on the door: “Read the walls with this.” Under it lies a UV lamp. It's yours now.`,"house.manor.wall1":`Behind the poet`,"house.manor.wall2":`VII`,"house.manor.clue1":`Invisible ink, glowing violet: “Behind the poet.”`,"house.manor.clue2":`Scratched above the shelves: VII. The seventh book?`,"house.manor.clue3":`The bookcase has a door's outline. The seventh book, the poet's, is a latch!`,"house.manor.page":`A secret library. The sisters wrote twelve mysteries under one name. The sealed last page reveals the culprit: the raven. “Every story needs a bird that knows too much.”`,"house.clock.name":`The Clockmaker's Shop`,"house.clock.intro":`Eli mended every clock in town and talked to none of them, except one. He said it sang.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`A greasy sketch of a gear and a bird: “Wind me at midnight.”`,"house.clock.clue2":`In invisible ink: 12 · 3 · 9. Where the hands of a clock point?`,"house.clock.clue3":`Under the soot of the attic wall: a narrow door marked XII.`,"house.clock.page":`Eli's workshop. A brass bird that sings Tom's song, the one from Rose's music box, and a watch engraved “To Rose, from Tom. Midnight.” Tom came back after all. Every house kept a piece of their story; now it is whole.`},es:{tagline:`Reforma casas viejas. Descubre lo que esconde la mugre.`,wallet:`Cartera: {money}`,money:"${n}",continueHouse:`Continuar`,roomOf:`{name} · sala {n}/{of}`,before:`Antes`,after:`Después`,appeal:`Atractivo {n}`,gift:`Rose te dejó un regalo: {name}`,paintColor:`Color de pintura`,pan:`Mirar alrededor`,"vol.sfx":`Efectos`,"vol.music":`Música`,"phase.clean":`Limpiar`,"phase.repair":`Reparar`,"phase.stage":`Decorar`,"hint.twist":`La mugre esconde un os dos junto al faro. Cada noche ella tocaba su canción y esperaba.`,"house.cabin.name":`La cabaña del lago Hale`,"house.cabin.intro":`La cabaña de papá. Buscamos su barca en el lago durante veinte años. Quizá tú tengas más suerte.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`El lago devuelve`,"house.cabin.clue1":`Números rayados bajo el moho: N47 W12. ¿Un lugar del lago?`,"house.cabin.clue2":`Tallado a fondo en los tablones: «El lago devuelve lo que se lleva».`,"house.cabin.clue3":`Bajo la mugre del suelo: una trampilla con una argolla de hierro.`,"house.cabin.page":`El casco de buzo de latón de papá y un mapa con una X en N47 W12. Los hermanos encontraron por fin la barca, y en ella una caja de hojalata dirigida a «Ada, el faro».`,"house.light.name":`El viejo faro`,"house.light.intro":`Diario de la farera Ada, última página: «3 nov. La lámpara se apagó. Mañana la arreglo». De eso hace mucho.`,"house.light.wall1":`3 nov: faro apagado`,"house.light.clue1":`Bajo la costra de sal, escrito a toda prisa: «3 nov: faro apagado».`,"house.light.clue2":`Un dibujo infantil: un barco, el haz de un faro. Firmado «Tom, 7 años».`,"house.light.clue3":`Tras las piedras: el contorno de una pequeña puerta de hierro.`,"house.light.page":`El despacho de la farera. La gorra de Tom, su telescopio y una carta que nunca envió: «Rose, espérame en la relojería a medianoche». Ada la guardó, con la esperanza de que él la entregara en persona.`,"house.manor.name":`La mansión Ashcombe`,"house.manor.intro":`Una nota en la puerta: «Lee las paredes con esto». Debajo hay una lámpara UV. Ahora es tuya.`,"house.manor.wall1":`Tras el poeta`,"house.manor.wall2":`VII`,"house.manor.clue1":`Tinta invisible con un brillo violeta: «Tras el poeta».`,"house.manor.clue2":`Rayado sobre las estanterías: VII. ¿El séptimo libro?`,"house.manor.clue3":`La librería tiene el contorno de una puerta. ¡El séptimo libro, el del poeta, es un pestillo!`,"house.manor.page":`Una biblioteca secreta. Las hermanas escribieron doce novelas de misterio con un solo nombre. La última página, sellada, revela al culpable: el cuervo. «Toda historia necesita un pájaro que sabe demasiado».`,"house.clock.name":`La relojería`,"house.clock.intro":`Eli arreglaba todos los relojes del pueblo y no hablaba con ninguno, salvo con uno. Decía que cantaba.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Un boceto grasiento de un engranaje y un pájaro: «Dame cuerda a medianoche».`,"house.clock.clue2":`En tinta invisible: 12 · 3 · 9. ¿Hacia dónde apuntan las agujas de un reloj?`,"house.clock.clue3":`Bajo el hollín de la pared del desván: una puerta estrecha marcada XII.`,"house.clock.page":`El taller de Eli. Un pájaro de latón que canta la canción de Tom, la de la caja de música de Rose, y un reloj grabado: «Para Rose, de Tom. Medianoche». Al final, Tom volvió. Cada casa guardaba un trozo de su historia; ahora está completa.`},"pt-BR":{tagline:`Reforme casas velhas. Descubra o que a sujeira esconde.`,wallet:`Carteira: {money}`,money:"${n}",continueHouse:`Continuar`,roomOf:`{name} · cômodo {n}/{of}`,before:`Antes`,after:`Depois`,appeal:`Charme {n}`,gift:`Rose deixou um presente para você: {name}`,paintColor:`Cor da tinta`,pan:`Olhar ao redor`,"vol.sfx":`Efeitos`,"vol.music":`Música`,"phase.clean":`Limpar`,"phase.repair":`Consertar`,"phase.stage":`Decorar`,"hint.twist":`A sujeira esconde um segredo: esfregue para achar pistas`,"hint.scrub":`Tire a sujeira: deslize o dedo pelo cômodo`,"hint.junk":{one:`Toque no entulho para jogar fora (falta {n}). Algumas coisas valem algo`,other:`Toque no entulho para jogar fora (faltam {n}). Algumas coisas valem algo`},"hint.webs":`Deslize pelas teias de aranha`,"hint.sniff":`Biscuit sentiu um cheiro: esfregue onde ela fareja`,"hint.uv":`Tinta invisível! Escolha a lâmpada UV e ilumine as paredes`,"hint.wires":`Arraste cada plugue até a tomada da mesma cor`,"hint.nails":`Toque nos pregos para martelá-los`,"hint.pickPaint":`Escolha uma cor para a parede`,"hint.paint": t":`Procure no escuro: mantenha a luz sobre o que você vê`,"secret.reward":`Agora é seu: {name}, e a coleira {collar} da Biscuit`,"secret.toSale":`Para a venda ▶`,"npc.rose":`Vovó Rose`,"npc.hale":`Os irmãos Hale`,"npc.ada":`A faroleira Ada`,"npc.ashcombe":`As irmãs Ashcombe`,"npc.eli":`Eli, o relojoeiro`,"npc.mila":`Mila`,"npc.ortega":`Capitão Ortega`,"npc.juno":`Juno Park`,"npc.vesper":`Lady Vesper`,"npc.otis":`Otis`,"buyer.rose":`Quero que pareça um abraço. Aconchegante, por favor!`,"buyer.cabin":`Cordas, listras, o mar em cada cômodo: isso é um lar.`,"buyer.light":`Linhas retas, vidro e luz. Deixe o velho farol moderno.`,"buyer.manor":`Veludo, velas, um pouco de escuridão. Perfeito para escrever.`,"buyer.clock":`Discos de vinil, sóis dourados, sofás cor de mostarda. Bons tempos!`,"house.rose.name":`O apartamento da Vovó Rose`,"house.rose.intro":`O apartamento agora é seu, querida. Limpe bem: ele lembra mais do que eu jamais contei.`,"house.rose.wall1":`Não venda a caixa`,"house.rose.clue1":`Rabiscado a lápis sob a fuligem: “Não venda a caixa.” Que caixa?`,"house.rose.clue2":`Pegadas pequenas e molhadas vão da cama até a parede… e param.`,"house.rose.clue3":`Uma rachadura em forma de porta sob o papel de parede velho. Alguém cobriu uma porta com papel!`,"house.rose.page":`Um quartinho de costura. A caixinha de música de Rose, um maço de cartas de Tom, o marinheiro, e uma foto dos dois perto do farol. Toda noite ela tocava a música dele e esperava.`,"house.cabin.name":`A cabana dos Hale no lago`,"house.cabin.intro":`A cabana do papai. Procuramos o barco dele no lago por vinte anos. Talvez você tenha mais sorte.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`O lago devolve`,"house.cabin.clue1":`Números riscados sob o mofo: N47 W12. Um lugar no lago?`,"house.cabin.clue2":`Entalhado fundo nas tábuas: “O lago devolve o que leva.”`,"house.cabin.clue3":`Sob a sujeira do chão: um alçapão com uma argola de ferro.`,"house.cabin.page":`O capacete de mergulho de latão do papai e um mapa com um X em N47 W12. Os irmãos enfim acharam o barco, e nele uma caixa de lata endereçada a “Ada, o farol”.`,"house.light.name":`O Velho Farol`,"house.light.intro":`Diário da faroleira Ada, última página: “3 nov. A luz apagou. Conserto amanhã.” Isso foi há muito tempo.`,"house.light.wall1":`3 nov: farol apagado`,"house.light.clue1":`Sob a crosta de sal, às pressas: “3 nov: farol apagado.”`,"house.light.clue2":`Um desenho de criança: um navio, o facho de um farol. Assinado “Tom, 7 anos”.`,"house.light.clue3":`Atrás das pedras: o contorno de uma pequena porta de ferro.`,"house.light.page":`O escritório da faroleira. O boné de Tom, o telescópio dele e uma carta que ele nunca enviou: “Rose, me espere na relojoaria à meia-noite.” Ada a guardou, torcendo para que ele mesmo a entregasse.`,"house.manor.name":`Mansão Ashcombe`,"house.manor.intro":`Um bilhete na porta: “Leia as paredes com isto.” Embaixo dele, uma lâmpada UV. Agora é sua.`,"house.manor.wall1":`Atrás do poeta`,"house.manor.wall2":`VII`,"house.manor.clue1":`Tinta invisível, brilhando em violeta: “Atrás do poeta.”`,"house.manor.clue2":`Riscado acima das prateleiras: VII. O sétimo livro?`,"house.manor.clue3":`A estante tem o contorno de uma porta. O sétimo livro, o do poeta, é uma trava!`,"house.manor.page":`Uma biblioteca secreta. As irmãs escreveram doze mistérios sob um só nome. A última página, lacrada, revela o culpado: o corvo. “Toda história precisa de um pássaro que sabe demais.”`,"house.clock.name":`A Relojoaria`,"house.clock.intro":`Eli consertava todos os relógios da cidade e não falava com nenhum, exceto um. Dizia que ele cantava.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Um esboço engordurado de uma engrenagem e um pássaro: “Dê corda em mim à meia-noite.”`,"house.clock.clue2":`Em tinta invisível: 12 · 3 · 9. Para onde apontam os ponteiros de um relógio?`,"house.clock.clue3":`Sob a fuligem da parede do sótão: uma porta estreita marcada XII.`,"house.clock.page":`A oficina aît !`,"buyer.cabin":`Des cordages, des rayures, la mer dans chaque pièce : voilà un foyer.`,"buyer.light":`Des lignes épurées, du verre et de la lumière. Rendez le vieux phare moderne.`,"buyer.manor":`Du velours, des bougies, un peu d'ombre. Parfait pour écrire.`,"buyer.clock":`Des vinyles, des soleils dorés, des canapés moutarde. Le bon vieux temps !`,"house.rose.name":`L'appartement de Mamie Rose`,"house.rose.intro":`L'appartement est à vous maintenant, mon petit. Nettoyez-le bien : il se souvient de plus que je ne vous en ai jamais dit.`,"house.rose.wall1":`Ne vends pas la boîte`,"house.rose.clue1":`Griffonné au crayon sous la suie : « Ne vends pas la boîte. » Quelle boîte ?`,"house.rose.clue2":`De petites empreintes mouillées vont du lit jusqu'au mur… et s'arrêtent.`,"house.rose.clue3":`Une fissure en forme de porte sous le vieux papier peint. Quelqu'un a tapissé une porte !`,"house.rose.page":`Un minuscule atelier de couture. La boîte à musique de Rose, une liasse de lettres de Tom le marin et une photo d'eux deux près du phare. Chaque soir, elle jouait sa chanson et attendait.`,"house.cabin.name":`Le chalet des Hale au bord du lac`,"house.cabin.intro":`Le chalet de papa. Nous avons cherché son bateau dans le lac pendant vingt ans. Vous aurez peut-être plus de chance.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`Le lac rend`,"house.cabin.clue1":`Des chiffres gravés sous la moisissure : N47 W12. Un endroit du lac ?`,"house.cabin.clue2":`Profondément taillé dans les planches : « Le lac rend ce qu'il prend. »`,"house.cabin.clue3":`Sous la crasse du plancher : une trappe avec un anneau de fer.`,"house.cabin.page":`Le casque de plongée en laiton de papa et une carte avec une croix à N47 W12. Les frères ont enfin retrouvé le bateau, et dedans une boîte en fer adressée à « Ada, le phare ».`,"house.light.name":`Le vieux phare`,"house.light.intro":`Journal de la gardienne Ada, dernière page : « 3 nov. La lampe s'est éteinte. Je la réparerai demain. » C'était il y a longtemps.`,"house.light.wall1":`3/11 : phare éteint`,"house.light.clue1":`Sous la croûte de sel, à la hâte : « 3/11 : phare éteint. »`,"house.light.clue2":`Un dessin d'enfant : un navire, le faisceau d'un phare. Signé « Tom, 7 ans ».`,"house.light.clue3":`Derrière les pierres : le contour d'une petite porte en fer.`,"house.light.page":`Le bureau de la gardienne. La casquette de Tom, sa longue-vue et une lettre qu'il n'a jamais envoyée : « Rose, attends-moi chez l'horloger à minuit. » Ada l'a gardée, en espérant qu'il viendrait la remettre lui-même.`,"house.manor.name":`Le manoir Ashcombe`,"house.manor.intro":`Un mot sur la porte : « Lisez les murs avec ceci. » Dessous, une lampe UV. Elle est à vous.`,"house.manor.wall1":`Derrière le poète`,"house.manor.wall2":`VII`,"house.manor.clue1":`Encre invisible, d'un violet lumineux : « Derrière le poète. »`,"house.manor.clue2":`Gravé au-dessus des étagères : VII. Le septième livre ?`,"house.manor.clue3":`La bibliothèque a le contour d'une porte. Le septième livre, celui du poète, est un loquet !`,"house.manor.page":`Une bibliothèque secrète. Les sœurs ont écrit douze romans policiers sous un seul nom. La dernière page, scellée, révèle le coupable : le corbeau. « Toute histoire a besoin d'un oiseau qui en sait trop. »`,"house.clock.name":`La boutique de l'horloger`,"house.clock.intro":`Eli réparait toutes les horloges de la ville et ne parlait à aucune, sauf une. Il disait qu'elle chantait.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Un croquis graisseux d'un engrenage et d'un oiseau : « Remontez-moi à minuit. »`,"house.clock.clue2":`À l'encre invisible : 12 · 3 · 9. Là où pointent les aiguilles d'une horloge ?`,"house.clock.clue3":`Sous la suie du mur du grenier : une porte étroite marquée XII.`,"house.clock.page":`L'atelier d'Eli. Un oiseau de laiton qui chante la chanson de Tom, celle de la boîte à musique de Rose, et une montre gravée « À Rose, de Tom. Minuit. » Tom est revenu, finalement. Chaque maison ga ung`,"house.rose.intro":`Die Wohnung gehört jetzt dir, Schatz. Putz sie gründlich: Sie erinnert sich an mehr, als ich dir je erzählt habe.`,"house.rose.wall1":`Verkauf die Dose nicht`,"house.rose.clue1":`Mit Bleistift unter den Ruß gekritzelt: „Verkauf die Dose nicht.“ Welche Dose?`,"house.rose.clue2":`Kleine nasse Fußspuren führen vom Bett zur Wand … und hören auf.`,"house.rose.clue3":`Ein türförmiger Riss unter der alten Tapete. Jemand hat eine Tür übertapeziert!`,"house.rose.page":`Ein winziges Nähzimmer. Roses Spieldose, ein Bündel Briefe von Tom, dem Seemann, und ein Foto der beiden am Leuchtturm. Jeden Abend spielte sie sein Lied und wartete.`,"house.cabin.name":`Die Seehütte der Hales`,"house.cabin.intro":`Papas Hütte. Zwanzig Jahre haben wir den See nach seinem Boot abgesucht. Vielleicht hast du mehr Glück.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`Der See gibt zurück`,"house.cabin.clue1":`Zahlen, unter dem Schimmel eingeritzt: N47 W12. Ein Ort auf dem See?`,"house.cabin.clue2":`Tief in die Planken geschnitzt: „Der See gibt zurück, was er nimmt.“`,"house.cabin.clue3":`Unter dem Dreck am Boden: eine Falltür mit einem Eisenring.`,"house.cabin.page":`Papas Taucherhelm aus Messing und eine Karte mit einem X bei N47 W12. Endlich fanden die Brüder das Boot, und darin eine Blechdose, adressiert an „Ada, der Leuchtturm“.`,"house.light.name":`Der alte Leuchtturm`,"house.light.intro":`Wärterin Adas Logbuch, letzte Seite: „3. Nov. Die Lampe ist aus. Ich repariere sie morgen.“ Das ist lange her.`,"house.light.wall1":`3. Nov.: Lampe dunkel`,"house.light.clue1":`Unter der Salzkruste, in Eile geschrieben: „3. Nov.: Lampe dunkel.“`,"house.light.clue2":`Eine Kinderzeichnung: ein Schiff, ein Leuchtturmstrahl. Unterschrieben „Tom, 7 Jahre“.`,"house.light.clue3":`Hinter den Steinen: der Umriss einer kleinen Eisentür.`,"house.light.page":`Das Zimmer der Wärterin. Toms Mütze, sein Fernrohr und ein Brief, den er nie abschickte: „Rose, warte um Mitternacht beim Uhrmacher мнат отделано: {rooms} · заработано {earned}`,"journal.biscuit":`Ошейники Biscuit`,"journal.perfect":`идеальные сделки ★★★ {n}/{of}`,"collar.none":`Красный`,"collar.ribbon":`Бант`,"collar.anchor":`Якорь`,"collar.star":`Звезда`,"collar.lace":`Кружево`,"collar.bell":`Колокольчик`,"daily.title":`Задание дня`,"daily.done":`На сегодня всё: завтра новая комната. Рабочих дней: {n}`,"daily.rare":`Легендарная вещь в ваш каталог: {name}`,"daily.intro":`Одна комната, каждый день новая, общая для всех. Закончите её — получите оплату и легендарную вещь.`,"secret.title":`Тайная комната`,"secret.hint":`Обыщите темноту: держите свет над тем, что видите`,"secret.reward":`Теперь ваше: {name} и ошейник Biscuit «{collar}»`,"secret.toSale":`К продаже ▶`,"npc.rose":`Бабушка Rose`,"npc.hale":`Братья Hale`,"npc.ada":`Смотрительница Ada`,"npc.ashcombe":`Сёстры Ashcombe`,"npc.eli":`Часовщик Eli`,"npc.mila":`Mila`,"npc.ortega":`Капитан Ortega`,"npc.juno":`Juno Park`,"npc.vesper":`Леди Vesper`,"npc.otis":`Otis`,"buyer.rose":`Хочу, чтобы здесь было как в объятиях. Уютно, пожалуйста!`,"buyer.cabin":`Канаты, полоски, море в каждой комнате — вот это дом.`,"buyer.light":`Чистые линии, стекло и свет. Сделайте старую башню современной.`,"buyer.manor":`Бархат, свечи, немного мрака. Идеально для писательства.`,"buyer.clock":`Пластинки, зеркала-солнца, горчичные диваны. Старые добрые времена!`,"house.rose.name":`Квартира бабушки Rose`,"house.rose.intro":`Теперь квартира твоя, милая. Хорошенько её отмой: она помнит больше, чем я тебе рассказывала.`,"house.rose.wall1":`Не продавай шкатулку`,"house.rose.clue1":`Карандашом, под сажей: «Не продавай шкатулку». Какую шкатулку?`,"house.rose.clue2":`Маленькие мокрые следы ведут от кровати к стене… и обрываются.`,"house.rose.clue3":`Трещина в форме двери под старыми обоями. Кто-то заклеил дверь!`,"house.rose.page":`Крохотная швейная комната. Музыкальная шкатулка Rose, пачка писем от моряка Tom и фото их двоих у маяка. Каждый вечер она заводила его песню и ждала.`,"house.cabin.name":`Домик Hale у озера`,"house.cabin.intro":`Папин домик. Двадцать лет мы искали его лодку в озере. Может, вам повезёт больше.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`Озеро всё вернёт`,"house.cabin.clue1":`Цифры, нацарапанные под плесенью: N47 W12. Место на озере?`,"house.cabin.clue2":`Глубоко вырезано на досках: «Озеро возвращает то, что забирает».`,"house.cabin.clue3":`Под грязью на полу: люк с железным кольцом.`,"house.cabin.page":`Папин латунный водолазный шлем и карта с крестиком у N47 W12. Братья наконец нашли лодку, а в ней — жестяную коробку с надписью «Ada, маяк».`,"house.light.name":`Старый маяк`,"house.light.intro":`Журнал смотрительницы Ada, последняя страница: «3 ноября. Лампа погасла. Починю завтра». Это было давно.`,"house.light.wall1":`3 нояб.: маяк погас`,"house.light.clue1":`Под соляной коркой, второпях: «3 нояб.: маяк погас».`,"house.light.clue2":`Детский рисунок: корабль, луч маяка. Подпись: «Tom, 7 лет».`,"house.light.clue3":`За камнями: очертания маленькой железной дверцы.`,"house.light.page":`Кабинет смотрительницы. Кепка Tom, его подзорная труба и письмо, которое он так и не отправил: «Rose, жди меня в часовой мастерской в полночь». Ada хранила его, надеясь, что он доставит его сам.`,"house.manor.name":`Усадьба Ashcombe`,"house.manor.intro":`Записка на двери: «Читайте стены вот этим». Под ней — УФ-лампа. Теперь она ваша.`,"house.manor.wall1":`За поэтом`,"house.manor.wall2":`VII`,"house.manor.clue1":`Невидимые чернила светятся фиолетовым: «За поэтом».`,"house.manor.clue2":`Нацарапано над полками: VII. Седьмая книга?`,"house.manor.clue3":`У книжного шкафа контур двери. Седьмая книга, книга поэта, — это защёлка!`,"house.manor.page":`Тайная библиотека. Сёстры написали двенадцать детективов под одним именем. Запечатанная последняя страница раскрывает виновного: это ворон. «В каждой истории нужна птица, которая знает слишком много».`,"house.clock.name":`Часовая мастерская`,"house.clock.intro":`Eli чинил все часы в городе и ни с одними не разговаривал, кроме одних. Он говорил, что они поют.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Промасленный набросок шестерёнки и птицы: «Заведи меня в полночь».`,"house.clock.clue2":`Невидимыми чернилами: 12 · 3 · 9. Куда указывают стрелки часов?`,"house.clock.clue3":`Под сажей на стене чердака: узкая дверь с надписью XII.`,"house.clock.page":`Мастерская Eli. Латунная птица, которая поёт песню Tom — ту самую, из шкатулки Rose, — и часы с гравировкой «Для Rose от Tom. Полночь». Tom всё-таки вернулся. Каждый дом хранил частичку их истории; теперь она собрана целиком.`},tr:{tagline:`Eski evleri yenileyip satın. Kirin sakladığını bulun.`,wallet:`Cüzdan: {money}`,money:"${n}",continueHouse:`Devam`,roomOf:`{name} · oda {n}/{of}`,before:`Önce`,after:`Sonra`,appeal:`Çekicilik {n}`,gift:`Rose size bir hediye bıraktı: {name}`,paintColor:`Boya rengi`,pan:`Etrafa bakın`,"vol.sfx":`Efektler`,"vol.music":`Müzik`,"phase.clean":`Temizle`,"phase.repair":`Onar`,"phase.stage":`Döşe`,"hint.twist":`Kir bir sır saklıyor: ipuçları için ovun`,"hint.scrub":`Kiri ovun: parmağınızı odada kaydırın`,"hint.junk":{one:`Atmak için hurdaya dokunun ({n} kaldı). Bazıları değerli`,other:`Atmak için hurdalara dokunun ({n} kaldı). Bazıları değerli`},"hint.webs":`Örümcek ağlarını kaydırarak temizleyin`,"hint.sniff":`Biscuit bir koku aldı: kokladığı yeri ovun`,"hint.uv":`Görünmez mürekkep! UV lambayı seçip duvarlara tutun`,"hint.wires":`Her fişi kendi rengindeki prize sürükleyin`,"hint.nails":`Çakmak için çivilere dokunun`,"hint.pickPaint":`Duvar için bir renk seçin`,"hint.paint":`Boyayı rulo ile duvara sürün`,"hint.stage":`Eşya koymak için bir çerçeveye dokunun. Alıcının sevdiği stil: {style}`,"note.clean":`Pırıl pırıl!`,"note.door":`Son ipucu bir kapı. Açmak için evi bitirin…`,"clue.label":`İpucu {n}/{of}:`,"results.title":`Oda yenilendi!`,"results.appeal":`Çekicilik {n}`,"results.finds":`buluntular {money}`,"results.daily":`ücret {money}`,"results.next":`İleri ▶`,"resul ski kuleyi modern yapın.`,"buyer.manor":`Kadife, mumlar, biraz karanlık. Yazmak için mükemmel.`,"buyer.clock":`Plaklar, güneş desenleri, hardal rengi kanepeler. Ah, o eski güzel günler!`,"house.rose.name":`Rose Nine'nin Dairesi`,"house.rose.intro":`Daire artık senin, yavrum. İyi temizle: sana anlattığımdan çok daha fazlasını hatırlıyor.`,"house.rose.wall1":`Kutuyu satma`,"house.rose.clue1":`İsin altında kurşun kalemle karalanmış: “Kutuyu satma.” Hangi kutu?`,"house.rose.clue2":`Yataktan duvara giden küçük ıslak ayak izleri… ve birden bitiyorlar.`,"house.rose.clue3":`Eski duvar kâğıdının altında kapı biçiminde bir çatlak. Biri bir kapının üstünü kâğıtla kaplamış!`,"house.rose.page":`Minicik bir dikiş odası. Rose'un müzik kutusu, denizci Tom'dan bir deste mektup ve ikisinin deniz fenerinin yanında çekilmiş bir fotoğrafı. Rose her gece onun şarkısını çalar ve beklerdi.`,"house.cabin.name":`Hale'lerin Göl Kulübesi`,"house.cabin.intro":`Babamın kulübesi. Yirmi yıl boyunca gölde teknesini aradık. Belki siz daha şanslı olursunuz.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`Göl geri verir`,"house.cabin.clue1":`Küfün altına kazınmış sayılar: N47 W12. Gölde bir yer mi?`,"house.cabin.clue2":`Tahtalara derince oyulmuş: “Göl, aldığını geri verir.”`,"house.cabin.clue3":`Zemindeki kirin altında: demir halkalı bir kapak.`,"house.cabin.page":`Babamın pirinç dalgıç kaskı ve N47 W12 noktasında X işareti olan bir harita. Kardeşler sonunda tekneyi buldu; içinde de üzerinde “Ada, deniz feneri” yazan teneke bir kutu.`,"house.light.name":`Eski Deniz Feneri`,"house.light.intro":`Fenerci Ada'nın seyir defteri, son sayfa: “3 Kasım. Lamba söndü. Yarın tamir ederim.” Bu çok uzun zaman önceydi.`,"house.light.wall1":`3 Kasım: lamba söndü`,"house.light.clue1":`Tuz kabuğunun altında, aceleyle yazılmış: “3 Kasım: lamba söndü.”`,"house.light.clue2":`Bir çocuk resmi: bir gemi, bir fener ışığı. İmza: “Tom, 7 yaşında”.`,"house.light.clue3":`Taşların ardında: küçük bir demir kapının hatları.`,"house.light.page":`Fenercinin çalışma odası. Tom'un kasketi, teleskobu ve hiç göndermediği bir mektup: “Rose, gece yarısı saatçi dükkânında beni bekle.” Ada mektubu sakladı; Tom'un onu kendi eliyle götüreceğini umuyordu.`,"house.manor.name":`Ashcombe Malikânesi`,"house.manor.intro":`Kapıda bir not: “Duvarları bununla okuyun.” Altında bir UV lamba duruyor. Artık sizin.`,"house.manor.wall1":`Şairin ardında`,"house.manor.wall2":`VII`,"house.manor.clue1":`Görünmez mürekkep, mor mor parlıyor: “Şairin ardında.”`,"house.manor.clue2":`Rafların üstüne kazınmış: VII. Yedinci kitap mı?`,"house.manor.clue3":`Kitaplıkta bir kapı hattı var. Yedinci kitap, şairinki, bir mandal!`,"house.manor.page":`Gizli bir kütüphane. Kız kardeşler tek bir isimle on iki polisiye yazmış. Mühürlü son sayfa suçluyu açıklıyor: kuzgun. “Her hikâyenin fazla şey bilen bir kuşa ihtiyacı vardır.”`,"house.clock.name":`Saatçi Dükkânı`,"house.clock.intro":`Eli kasabadaki her saati onarırdı ama hiçbiriyle konuşmazdı, biri hariç. Onun şarkı söylediğini söylerdi.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Yağlı bir eskiz, bir dişli ve bir kuş: “Beni gece yarısı kur.”`,"house.clock.clue2":`Görünmez mürekkeple: 12 · 3 · 9. Bir saatin akrebiyle yelkovanının gösterdiği yerler mi?`,"house.clock.clue3":`Çatı katı duvarının isi altında: üzerinde XII yazan dar bir kapı.`,"house.clock.page":`Eli'nin atölyesi. Tom'un şarkısını, Rose'un müzik kutusundaki o şarkıyı söyleyen pirinç bir kuş ve üzerinde “Rose'a, Tom'dan. Gece yarısı.” yazan bir cep saati. Demek Tom sonunda geri dönmüş. Her ev onların hikâyesinden bir parça saklıyordu; artık hikâye tamam.`},it:{tagline:`Ristruttura vecchie case. Scopri cosa nasconde lo sporco.`,wallet:`Portafoglio: {money}`,money:"${n}",continueHouse:`Continua`,roomOf:`{name} · stanza {n}/{of}`,before:`Prima`,after:`Dopo`,appeal:`Fascino {n}`,gift:`Rose ti ha lasciato un regalo: {name}`,paintColor:`Colore`,pan:`Guardati intorno`,"vol.sfx":`Effetti`,"vol.music":`Musica`,"phase.clean": l.unknown":`Non ancora in vendita`,"journal.hidden":`Ancora sotto lo sporco…`,"journal.stats":`{rooms} stanze restaurate · {earned} guadagnati`,"journal.biscuit":`I collari di Biscuit`,"journal.perfect":`ristrutturazioni perfette ★★★ {n}/{of}`,"collar.none":`Rosso`,"collar.ribbon":`Fiocco`,"collar.anchor":`Ancora`,"collar.star":`Stella`,"collar.lace":`Pizzo`,"collar.bell":`Campanella`,"daily.title":`Il lavoro di oggi`,"daily.done":`Finito per oggi: domani una nuova stanza. Giorni di lavoro: {n}`,"daily.rare":`Un pezzo leggendario per il tuo catalogo: {name}`,"daily.intro":`Una stanza, nuova ogni giorno e uguale per tutti. Finiscila per una paga e un pezzo leggendario.`,"secret.title":`La stanza nascosta`,"secret.hint":`Cerca nel buio: tieni la luce su ciò che vedi`,"secret.reward":`Ora sono tuoi: {name} e il collare {collar} di Biscuit`,"secret.toSale":`Alla vendita ▶`,"npc.rose":`Nonna Rose`,"npc.hale":`I fratelli Hale`,"npc.ada":`Ada la guardiana`,"npc.ashcombe":`Le sorelle Ashcombe`,"npc.eli":`Eli l'orologiaio`,"npc.mila":`Mila`,"npc.ortega":`Capitano Ortega`,"npc.juno":`Juno Park`,"npc.vesper":`Lady Vesper`,"npc.otis":`Otis`,"buyer.rose":`Voglio che sembri un abbraccio. Accogliente, per favore!`,"buyer.cabin":`Corde, righe, il mare in ogni stanza: questa è casa.`,"buyer.light":`Linee pulite, vetro e luce. Rendi moderna la vecchia torre.`,"buyer.manor":`Velluto, candele, un po' di oscurità. Perfetta per scrivere.`,"buyer.clock":`Dischi, raggiere, divani color senape. Ah, i bei tempi andati!`,"house.rose.name":`L'appartamento di nonna Rose`,"house.rose.intro":`Ora l'appartamento è tuo, tesoro. Puliscilo bene: ricorda più di quanto ti abbia mai raccontato.`,"house.rose.wall1":`Non vendere la scatola`,"house.rose.clue1":`Scarabocchiato a matita sotto la fuliggine: “Non vendere la scatola.” Quale scatola?`,"house.rose.clue2":`Piccole impronte bagnate vanno dal letto al muro… e si fermano.`,"house.rose.clue3":`Una crepa a forma di porta sotto la vecchia carta da parati. Qualcuno ci ha nascosto una porta!`,"house.rose.page":`Una minuscola stanza da cucito. Il carillon di Rose, un fascio di lettere di Tom il marinaio e una foto di loro due accanto al faro. Ogni sera lei suonava la sua canzone e aspettava.`,"house.cabin.name":`Il capanno sul lago degli Hale`,"house.cabin.intro":`Il capanno di papà. Per vent'anni abbiamo cercato la sua barca nel lago. Forse tu avrai più fortuna.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`Il lago restituisce`,"house.cabin.clue1":`Numeri graffiati sotto la muffa: N47 W12. Un punto del lago?`,"house.cabin.clue2":`Inciso a fondo nelle assi: “Il lago restituisce ciò che prende.”`,"house.cabin.clue3":`Sotto lo sporco del pavimento: una botola con un anello di ferro.`,"house.cabin.page":`Il casco da palombaro in ottone di papà e una mappa con una X su N47 W12. Alla fine i fratelli hanno trovato la barca, e dentro una scatola di latta indirizzata ad “Ada, il faro”.`,"house.light.name":`Il vecchio faro`,"house.light.intro":`Il diario della guardiana Ada, ultima pagina: “3 nov. La lampada si è spenta. La riparo domani.” È stato tanto tempo fa.`,"house.light.wall1":`3 nov: lampada spenta`,"house.light.clue1":`Sotto la crosta di sale, scritto in fretta: “3 nov: lampada spenta.”`,"house.light.clue2":`Il disegno di un bambino: una nave, il fascio di un faro. Firmato “Tom, 7 anni”.`,"house.light.clue3":`Dietro le pietre: il contorno di una piccola porta di ferro.`,"house.light.page":`Lo studio della guardiana. Il berretto di Tom, il suo telescopio e una lettera mai spedita: “Rose, aspettami alla bottega dell'orologiaio a mezzanotte.” Ada l'ha conservata, sperando che lui la consegnasse di persona.`,"house.manor.name":`Villa Ashcombe`,"house.manor.intro":`Un biglietto sulla porta: “Leggi i muri con questa.” Sotto c'è una lampada UV. Ora è tua.`,"house.manor.wall1":`Dietro il poeta`,"house.manor.wall2":`VII`,"house.manor.clue1":`Inchiostro invisibile, di un viola luminoso: “Dietro il poeta.”`,"house.manor.clue2":`Graffiato sopra gli scaffali: VII. Il settimo libro?`,"house.manor.clue3":`La libreria ha il contorno di una porta. Il settimo libro, quello del poeta, è una leva!`,"house.manor.page":`Una biblioteca segreta. Le sorelle hanno scritto dodici gialli sotto un unico nome. L'ultima pagina sigillata svela il colpevole: il corvo. “Ogni storia ha bisogno di un uccello che sa troppo.”`,"house.clock.name":`La bottega dell'orologiaio`,"house.clock.intro":`Eli riparava ogni orologio della città e non parlava con nessuno di loro, tranne uno. Diceva che cantava.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Uno schizzo unto, un ingranaggio e un uccello: “Caricami a mezzanotte.”`,"house.clock.clue2":`Con inchiostro invisibile: 12 · 3 · 9. Dove puntano le lancette di un orologio?`,"house.clock.clue3":`Sotto la fuliggine del muro in soffitta: una porta stretta segnata XII.`,"house.clock.page":`Il laboratorio di Eli. Un uccellino d'ottone che canta la canzone di Tom, quella del carillon di Rose, e un orologio con incisa la dedica “A Rose, da Tom. Mezzanotte.” Alla fine Tom era tornato. Ogni casa custodiva un pezzo della loro storia; ora è completa.`},pl:{tagline:`Odnawiaj stare domy. Odkryj, co skrywa brud.`,wallet:`Portfel: {money}`,money:"${n}",continueHouse:`Dalej`,roomOf:`{name} · pokój {n}/{of}`,before:`Przed`,after:`Po`,appeal:`Urok {n}`,gift:`Rose zostawiła ci prezent: {name}`,paintColor:`Kolor farby`,pan:`Rozejrzyj się`,"vol.sfx":`Efekty`,"vol.music":`Muzyka`,"phase.clean":`Sprzątanie`,"phase.repair":`Naprawa`,"phase.stage":`Wystrój`,"hint.twist":`Brud skrywa sekret: szoruj, by znaleźć wskazówki`,"hint.scrub":`Zetrzyj brud: przesuwaj palcem po pokoju`,"hint.junk":{one:`Stuknij rupieć, by go wyrzucić (został {n}). Część jest cenna`,few:`Stuknij rupiecie, by je wyrzucić (zostały {n}). Część jest cenna`,many:`Stuknij rupiecie, by je wyrzucić (zostało {n}). Część jest cenna`,other:`Stuknij rupiecie, by je wyrzucić (zostało {n}). Część jest cenna`},"hint.webs":`Prz do katalogu: {name}`,"daily.intro":`Jeden pokój, codziennie nowy, ten sam dla wszystkich. Skończ go, a dostaniesz zapłatę i legendarny przedmiot.`,"secret.title":`Ukryty pokój`,"secret.hint":`Przeszukaj ciemność: trzymaj światło nad tym, co widzisz`,"secret.reward":`Teraz twoje: {name} i obroża Biscuit „{collar}”`,"secret.toSale":`Do sprzedaży ▶`,"npc.rose":`Babcia Rose`,"npc.hale":`Bracia Hale`,"npc.ada":`Latarniczka Ada`,"npc.ashcombe":`Siostry Ashcombe`,"npc.eli":`Zegarmistrz Eli`,"npc.mila":`Mila`,"npc.ortega":`Kapitan Ortega`,"npc.juno":`Juno Park`,"npc.vesper":`Lady Vesper`,"npc.otis":`Otis`,"buyer.rose":`Chcę, żeby było jak w objęciach. Przytulnie, proszę!`,"buyer.cabin":`Liny, paski, morze w każdym pokoju: to jest dom.`,"buyer.light":`Czyste linie, szkło i światło. Zrób ze starej wieży coś nowoczesnego.`,"buyer.manor":`Aksamit, świece, odrobina mroku. Idealne do pisania.`,"buyer.clock":`Płyty, lustra-słońca, musztardowe sofy. Stare, dobre czasy!`,"house.rose.name":`Mieszkanie babci Rose`,"house.rose.intro":`Mieszkanie jest teraz twoje, kochanie. Wysprzątaj je dobrze: pamięta więcej, niż ci kiedykolwiek powiedziałam.`,"house.rose.wall1":`Nie sprzedawaj pudełka`,"house.rose.clue1":`Nabazgrane ołówkiem pod sadzą: „Nie sprzedawaj pudełka”. Jakiego pudełka?`,"house.rose.clue2":`Małe mokre ślady stóp prowadzą od łóżka do ściany… i się urywają.`,"house.rose.clue3":`Pęknięcie w kształcie drzwi pod starą tapetą. Ktoś zatapetował drzwi!`,"house.rose.page":`Maleńka szwalnia. Pozytywka Rose, plik listów od marynarza Toma i zdjęcie ich dwojga przy latarni. Co wieczór puszczała jego piosenkę i czekała.`,"house.cabin.name":`Chata Hale'ów nad jeziorem`,"house.cabin.intro":`Chata taty. Przez dwadzieścia lat szukaliśmy jego łodzi w jeziorze. Może ty będziesz mieć więcej szczęścia.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`Jezioro oddaje`,"house.cabin.clue1":`Liczby wydrapane pod pleśnią: N47 W12. Miejsce na jeziorze?`,"house.cabin.clue2":`Głęboko wyryte w deskach: „Jezioro oddaje, co zabiera”.`,"house.cabin.clue3":`Pod brudem na podłodze: klapa z żelaznym pierścieniem.`,"house.cabin.page":`Mosiężny hełm nurka taty i mapa z krzyżykiem na N47 W12. Bracia w końcu znaleźli łódź, a w niej blaszane pudełko zaadresowane „Ada, latarnia”.`,"house.light.name":`Stara latarnia`,"house.light.intro":`Dziennik latarniczki Ada, ostatnia strona: „3 listopada. Lampa zgasła. Naprawię ją jutro”. To było dawno temu.`,"house.light.wall1":`3 lis.: lampa zgasła`,"house.light.clue1":`Pod solną skorupą, w pośpiechu: „3 lis.: lampa zgasła”.`,"house.light.clue2":`Rysunek dziecka: statek, promień latarni. Podpisany „Tom, lat 7”.`,"house.light.clue3":`Za kamieniami: zarys małych żelaznych drzwiczek.`,"house.light.page":`Gabinet latarniczki. Czapka Toma, jego luneta i list, którego nigdy nie wysłał: „Rose, czekaj na mnie o północy w pracowni zegarmistrza”. Ada go zachowała w nadziei, że Tom sam go doręczy.`,"house.manor.name":`Dwór Ashcombe`,"house.manor.intro":`Kartka na drzwiach: „Czytaj tym ściany”. Pod nią leży lampa UV. Jest teraz twoja.`,"house.manor.wall1":`Za poetą`,"house.manor.wall2":`VII`,"house.manor.clue1":`Niewidzialny atrament, świecący na fioletowo: „Za poetą”.`,"house.manor.clue2":`Wydrapane nad półkami: VII. Siódma książka?`,"house.manor.clue3":`Regał ma zarys drzwi. Siódma książka, ta poety, to zapadka!`,"house.manor.page":`Tajna biblioteka. Siostry napisały dwanaście kryminałów pod jednym nazwiskiem. Zapieczętowana ostatnia strona zdradza winowajcę: kruka. „Każda historia potrzebuje ptaka, który wie za dużo”.`,"house.clock.name":`Pracownia zegarmistrza`,"house.clock.intro":`Eli naprawiał każdy zegar w mieście i z żadnym nie rozmawiał, poza jednym. Mówił, że śpiewa.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Zatłuszczony szkic zębatki i ptaka: „Nakręć mnie o północy”.`,"house.clock.clue2":`Niewidzialnym atramentem: 12 · 3 · 9. Tam, gdzie wskazują wskazówki zegara?`,"house.clock.clue3":`Pod sadzą na ścianie strychu: wąskie drzwi oznaczone XII.`,"house.clock.page":`Pracownia Eliego. Mosiężny ptak, który śpiewa piosenkę Toma, tę z pozytywki Rose, i zegarek z grawerem „Dla Rose od Toma. Północ”. Tom jednak wrócił. Każdy dom przechował kawałek ich historii; teraz jest cała.`},id:{tagline:`Renovasi rumah tua. Temukan rahasia di balik kotoran.`,wallet:`Dompet: {money}`,money:"${n}",continueHouse:`Lanjutkan`,roomOf:`{name} · ruang {n}/{of}`,before:`Sebelum`,after:`Sesudah`,appeal:`Daya tarik {n}`,gift:`Rose meninggalkan hadiah: {name}`,paintColor:`Warna cat`,pan:`Lihat sekeliling`,"vol.sfx":`Efek`,"vol.music":`Musik`,"phase.clean":`Bersihkan`,"phase.repair":`Perbaiki`,"phase.stage":`Tata`,"hint.twist":`Kotoran menyimpan rahasia: gosok untuk menemukan petunjuk`,"hint.scrub":`Gosok kotorannya: usap ke seluruh ruangan`,"hint.junk":{other:`Ketuk barang bekas untuk membuangnya (sisa {n}). Ada yang berharga`},"hint.webs":`Usap untuk menyingkirkan sarang laba-laba`,"hint.sniff":`Biscuit mencium sesuatu: gosok tempat ia mengendus`,"hint.uv":`Tinta tak terlihat! Ambil lampu UV dan sorotkan ke dinding`,"hint.wires":`Seret setiap steker ke stopkontak yang sewarna`,"hint.nails":`Ketuk paku untuk memakunya`,"hint.pickPaint":`Pilih warna untuk dinding`,"hint.paint":`Gulirkan cat ke dinding`,"hint.stage":`Ketuk bingkai untuk menaruh barang. Pembeli suka gaya {style}`,"note.clean":`Bersih berkilau!`,"note.door":`Petunjuk terakhir adalah sebuah pintu. Selesaikan rumahnya untuk membukanya…`,"clue.label":`Petunjuk {n}/{of}:`,"results.title":`Ruangan dipulihkan!`,"results.appeal":`Daya tarik {n}`,"results.finds":`temuan {money}`,"results.daily":`upah {money}`,"results.next":`Lanjut ▶`,"results.extra":`▶ Cari lagi: barang langka`,"results.extraGot":`Ditemukan: {name}!`,"sale.title":`Jual {name}`,"sale.base":`Harga dasar`,"sale.staging":`Penataan gaya {style} ({pct}%)`,"sale.story":`Kisah yang ditemukan`,"sale.price":`Harga jual`,"sale.paid":`Harga beli`,"sale.finds":`Barang berharga`,"sale.profit":`Untung`,"sale.sel ose.name":`Apartemen Nenek Rose`,"house.rose.intro":`Apartemen ini milikmu sekarang, Sayang. Bersihkan baik-baik: ia ingat lebih banyak daripada yang pernah Nenek ceritakan.`,"house.rose.wall1":`Jangan jual kotaknya`,"house.rose.clue1":`Ditulis dengan pensil di bawah jelaga: “Jangan jual kotaknya.” Kotak yang mana?`,"house.rose.clue2":`Jejak kaki kecil yang basah dari ranjang ke dinding… lalu berhenti.`,"house.rose.clue3":`Retakan berbentuk pintu di balik kertas dinding tua. Ada yang menutupi sebuah pintu dengan kertas dinding!`,"house.rose.page":`Ruang jahit mungil. Kotak musik Rose, seikat surat dari Tom si pelaut, dan foto mereka berdua di dekat mercusuar. Setiap malam Rose memutar lagu Tom dan menunggu.`,"house.cabin.name":`Pondok Danau Keluarga Hale`,"house.cabin.intro":`Pondok Ayah. Dua puluh tahun kami mencari perahunya di danau. Semoga nasibmu lebih mujur.`,"house.cabin.wall1":`N47 W12`,"house.cabin.wall2":`Danau mengembalikan`,"house.cabin.clue1":`Angka tergores di bawah jamur: N47 W12. Sebuah titik di danau?`,"house.cabin.clue2":`Terukir dalam di papan: “Danau mengembalikan apa yang diambilnya.”`,"house.cabin.clue3":`Di bawah kotoran lantai: pintu kolong dengan cincin besi.`,"house.cabin.page":`Helm selam kuningan milik Ayah dan peta bertanda X di N47 W12. Akhirnya kakak-beradik itu menemukan perahunya, dan di dalamnya ada kotak kaleng beralamat “Ada, mercusuar”.`,"house.light.name":`Mercusuar Tua`,"house.light.intro":`Buku catatan Penjaga Ada, halaman terakhir: “3 Nov. Lampunya padam. Besok akan kuperbaiki.” Itu sudah lama sekali.`,"house.light.wall1":`3 Nov: lampu padam`,"house.light.clue1":`Di bawah kerak garam, ditulis terburu-buru: “3 Nov: lampu padam.”`,"house.light.clue2":`Gambar anak-anak: kapal, sorot mercusuar. Ditandatangani “Tom, 7 tahun”.`,"house.light.clue3":`Di balik batu-batu: garis sebuah pintu besi kecil.`,"house.light.page":`Ruang kerja sang penjaga. Topi Tom, teleskopnya, dan surat yang tak pernah ia kirim: “Rose, tunggu aku di toko jam tengah malam.” Ada menyimpannya, berharap Tom sendiri yang akan mengantarkannya.`,"house.manor.name":`Rumah Besar Ashcombe`,"house.manor.intro":`Catatan di pintu: “Baca dinding dengan ini.” Di bawahnya ada lampu UV. Kini lampu itu milik pemilik baru.`,"house.manor.wall1":`Di balik sang penyair`,"house.manor.wall2":`VII`,"house.manor.clue1":`Tinta tak terlihat, berpendar ungu: “Di balik sang penyair.”`,"house.manor.clue2":`Tergores di atas rak: VII. Buku ketujuh?`,"house.manor.clue3":`Rak buku itu punya garis pintu. Buku ketujuh, karya sang penyair, adalah kaitnya!`,"house.manor.page":`Perpustakaan rahasia. Kakak-beradik itu menulis dua belas novel misteri dengan satu nama. Halaman terakhir yang tersegel mengungkap pelakunya: si gagak. “Setiap cerita butuh burung yang tahu terlalu banyak.”`,"house.clock.name":`Toko Pembuat Jam`,"house.clock.intro":`Eli memperbaiki setiap jam di kota tanpa pernah bicara pada satu pun, kecuali satu. Katanya jam itu bernyanyi.`,"house.clock.wall2":`12 · 3 · 9`,"house.clock.clue1":`Sketsa berminyak, roda gigi dan seekor burung: “Putar aku tengah malam.”`,"house.clock.clue2":`Dengan tinta tak terlihat: 12 · 3 · 9. Arah jarum jam?`,"house.clock.clue3":`Di bawah jelaga dinding loteng: pintu sempit bertanda XII.`,"house.clock.page":`Bengkel Eli. Burung kuningan yang menyanyikan lagu Tom, lagu dari kotak musik Rose, dan arloji berukir “Untuk Rose, dari Tom. Tengah malam.” Ternyata Tom kembali juga. Setiap rumah menyimpan sepotong kisah mereka; kini kisah itu utuh.`}},ra=!1;async function ia(e,t){let n=NaN;O(Number.isFinite(n)?n:null),document.addEventListener(`contextmenu`,e=>e.preventDefault());let r=Se(t.portal);return r&&(await r.init(),r.loadingStart()),aa(e,t,t.kit,r,na)}async function aa(e,t,n,r,i){let a=new Ve({strings:i,languages:t.languages,saveKey:t.saveKey,minTouchPx:t.minTouchPx,locale:t.locale,ads:t.ads,portal:r,keepEventLog:ra,canvas:e,title:t.title});if(!ta)throw Error(`kit code: no entry module (${n.entry})`);let o=document.c
