d":`A short field eats shots, then lets one pulse go (stronger for each).`,"tower.b.U03.lim":`Never reflects its own pulse; doesn't charge itself.`,"tower.b.I01.name":`Pick-up`,"tower.b.I01.role":`Air: follow a launch.`,"tower.b.I01.d":`A jump within 0.4 s of your launch goes higher.`,"tower.b.I01.lim":`Once before landing; other jumps unchanged.`,"tower.b.I02.name":`Zero Mass`,"tower.b.I02.role":`Air: a moment of hang time.`,"tower.b.I02.d":`Your first air cut slows your fall for 0.18 s.`,"tower.b.I02.lim":`Once before landing; the target's hold limit is unchanged.`,"tower.b.I03.name":`Joint Descent`,"tower.b.I03.role":`Slam: take the target down with you.`,"tower.b.I03.d":`A dive that hits a close airborne target carries it to your landing spot.`,"tower.b.I03.lim":`One target; never through a wall; never a boss.`,"tower.b.I08.name":`Anchor`,"tower.b.I08.role":`Defence: hold your ground.`,"tower.b.I08.d":`On the deck, blows shove you far less.`,"tower.b.I08.lim":`Damage, stagger and falls still count.`,"tower.b.I09.name":`Return`,"tower.b.I09.role":`Ammo: kills in the air reload.`,"tower.b.I09.d":`A direct melee kill while you are airborne returns one round.`,"tower.b.I09.lim":`At most one returned round per 2 s overall.`,"tower.b.I10.name":`Counter-round`,"tower.b.I10.role":`Ammo: reflects reload.`,"tower.b.I10.d":`A precise reflect returns one round.`,"tower.b.I10.lim":`At most one returned round per 2 s overall.`,"tower.b.I17.name":`Shock Sole`,"tower.b.I17.role":`Slam: a wave along the deck.`,"tower.b.I17.d":`Your slam sends a small wave hitting up to three grounded targets.`,"tower.b.I17.lim":`Its hits never trigger other effects.`,"tower.b.I18.name":`Pass It On`,"tower.b.I18.role":`Wall: bodies as weapons.`,"tower.b.I18.d":`A target knocked flying hurts the one it hits.`,"tower.b.I18.lim":`One contact a pair a chain; no chain reaction.`,"tower.b.I19.name":`Breaker`,"tower.b.I19.role":`Guard break: an opening.`,"tower.b.I19.d":`After a guard break, your next d :`A shot in the air lets you drift aside the way you hold.`,"tower.b.I05.lim":`Walls still stop you.`,"tower.b.I06.name":`Rebound`,"tower.b.I06.role":`Slam: bounce back up.`,"tower.b.I06.d":`A jump within 0.5 s of your slam goes 20% higher.`,"tower.b.I06.lim":`One jump per slam.`,"tower.b.I07.name":`Transition`,"tower.b.I07.role":`Crowd: step to the next target.`,"tower.b.I07.d":`After a finisher, your next directed blow steps you toward another target.`,"tower.b.I07.lim":`One hero height at most; never through a wall.`,"tower.b.I11.name":`Last Word`,"tower.b.I11.role":`Ammo: the last round counts.`,"tower.b.I11.d":`The last round of the magazine does +40% guard damage.`,"tower.b.I11.lim":`Not its hops, blasts or other secondary hits.`,"tower.b.I12.name":`Hand-off`,"tower.b.I12.role":`Ammo: melee speeds the reload.`,"tower.b.I12.d":`The first direct melee hit after a shot moves the reload on by 0.5 s.`,"tower.b.I12.lim":`Shared reload cap (at most 30% faster).`,"tower.b.I13.name":`Double Discipline`,"tower.b.I13.role":`Energy: mix, then shoot.`,"tower.b.I13.d":`Three different melee blows, then a shot: +10 energy.`,"tower.b.I13.lim":`Once per cycle; one blow never counts three times.`,"tower.b.I14.name":`Safety Line`,"tower.b.I14.role":`Harpoon: a plate on a pull.`,"tower.b.I14.d":`A harpoon pull that lands gives a plate absorbing up to 10 HP.`,"tower.b.I14.lim":`Harpoon (R04) only.`,"tower.b.I15.name":`Vertical Brace`,"tower.b.I15.role":`Air: a shot up holds longer.`,"tower.b.I15.d":`Your first shot up at a launched target adds 0.15 s of hold.`,"tower.b.I15.lim":`Once until you land; never past the juggle limit.`,"tower.b.I16.name":`Loaded Holster`,"tower.b.I16.role":`Ammo: a reload charges a finisher.`,"tower.b.I16.d":`A full reload gives your next melee finisher +20% guard damage.`,"tower.b.I16.lim":`One charge; does not stack.`,"tower.b.I20.name":`Turning Point`,"tower.b.I20.role":`Guard: strike from behind.`,"tower.b.I20.d":`A hit from behind a shield does +50% guard damage.`,"tower.b.I20.lim":`Once per target.`,"tower.b.I22.name":`Freeze Frame`,"tower.b.I22.role":`Crowd: a break slows the rest.`,"tower.b.I22.d":`Breaking a shield briefly slows the ordinary enemies near it.`,"tower.b.I22.lim":`Limited radius; never bosses or heavies; not with stasis.`,"tower.b.I23.name":`Cut Line`,"tower.b.I23.role":`Energy: finish two at once.`,"tower.b.I23.d":`A finisher hitting two targets or more gives +8 energy.`,"tower.b.I23.lim":`Once per attack.`,"tower.b.I24.name":`Air Credit`,"tower.b.I24.role":`Air: a longer juggle.`,"tower.b.I24.d":`One more juggle unit and up to +0.5 s of hold.`,"tower.b.I24.lim":`Never past the absolute 7 units / 3.5 s.`,"tower.b.I26.name":`Reserve Plate`,"tower.b.I26.role":`Defence: a plate after a fight.`,"tower.b.I26.d":`Finishing a fight gives a plate absorbing 10 HP.`,"tower.b.I26.lim":`Once a fight; never above 10.`,"tower.b.I28.name":`Deep Capacitor`,"tower.b.I28.role":`Energy: cheaper heavies.`,"tower.b.I28.d":`An empowered heavy costs 20 energy instead of 25.`,"tower.b.I28.lim":`Its bonus damage −10%; the ultimate costs the same.`,"tower.b.I29.name":`Variety`,"tower.b.I29.role":`Ultimate: mix it up.`,"tower.b.I29.d":`A fourth different category in a chain gives +4 ultimate.`,"tower.b.I29.lim":`Shared meter cap (12 in 5 s).`,"tower.b.I30.name":`Landing Circuit`,"tower.b.I30.role":`Ultimate: wider after a slam.`,"tower.b.I30.d":`An ultimate within 0.5 s of a slam gets a wider zone.`,"tower.b.I30.lim":`No extra charge or double damage.`,"tower.b.I31.name":`Cool Head`,"tower.b.I31.role":`Style: keep your rating.`,"tower.b.I31.d":`Taking damage costs less of the style rating.`,"tower.b.I31.lim":`No effect on HP or the ultimate.`,"tower.b.I32.name":`Last Reserve`,"tower.b.I32.role":`Defence: tougher when low.`,"tower.b.I32.d":`Below 25% HP, incoming damage −15%.`,"tower.b.I32.lim":`No extra protection; deadly hazards stay deadly.`,"tower.b.B03.name":`Spring`,"tower.b.B03.d":`A jump within 0.5 s of a slam goes higher.`,"tower.b.B04.name":`Light Bolt`,"tower.b.B04.d":`Reload 15% faster; magazine −1.`,"tower.b.B07.name":`Duelist`,"tower.b.B07.d":`Direct damage +12% while one threat is left.`,"tower.b.B08.name":`Low Centre`,"tower.b.B08.d":`Resist shoves, +15% guard damage on the deck; air damage −10%.`,"tower.b.B09.name":`Air Mode`,"tower.b.B09.d":`Air direct damage +12%; ground −8%.`,"tower.b.B10.name":`Conductivity`,"tower.b.B10.d":`A reflected shot also hits one more close target (40%).`,"tower.b.B11.name":`Overtime`,"tower.b.B11.d":`Ultimate charges 15% faster; energy 10% slower.`,"tower.b.B12.name":`Quiet Step`,"tower.b.B12.d":`The first direct blow in a new arena: +50% guard damage.`,"tower.b.A02.name":`Quick Draw`,"tower.b.A02.d":`the heavy readies 15% sooner, guard damage −10%`,"tower.b.A03.name":`Wide Air`,"tower.b.A03.d":`the air cut 15% wider, the ground finisher 10% narrower`,"tower.b.A06.name":`Back-loaded`,"tower.b.A06.d":`the last cut +3 energy, the first none`,"tower.b.A07.name":`Extended Mag`,"tower.b.A07.d":`magazine +1, reload +25%`,"tower.b.A08.name":`Hot Load`,"tower.b.A08.d":`projectile 25% faster, damage −8%`,"tower.b.A09.name":`Through-shot`,"tower.b.A09.d":`passes one more ordinary target, its contact 50%`,"tower.b.A11.name":`Fast Hands`,"tower.b.A11.d":`full reload 10% faster, damage −8%`,"tower.b.A12.name":`Long Mark`,"tower.b.A12.d":`marks last 0.5 s longer, direct damage −10%`,"tower.district.base":`Service Base`,"tower.district.works":`Production Belt`,"tower.district.homes":`Residential Tiers`,"tower.district.broadcast":`Broadcast Centre`,"tower.district.labs":`Medical Labs`,"tower.district.gardens":`Vertical Gardens`,"tower.district.core":`Energy Core`,"tower.district.manor":`Private Residences`,"tower.district.archive":`Archive & Control`,"tower.district.crown":`Tower Crown`,"tower.boss.gatewarden":`Gate Warden`,"tower.boss.chief":`Security Chief`,"tower.boss.arm":`Assembly Arm`,"tower.boss.collector":`The Collector`,"tower.boss.host":`Arena Host`,"tower.boss.surgeon":`Surgical Suite`,"tower.boss.warden2":`Garden Warden`,"tower.boss.regulator":`Load Regulator`,"tower.boss.guard":`The Bodyguard`,"tower.boss.argus":`ARGUS Contour`,"tower.boss.addressee":`The Addressee`,"tower.beat.f1.1":`K-7, courier. A sealed parcel for floor one hundred. Signature required.`,"tower.beat.f1.2":`Intruder on the service deck. Security, remove her — and keep the cameras on her.`,"tower.beat.f1.boss.1":`The lock stays shut. Nobody gets past the Gate Warden.`,"tower.beat.f1.boss.2":`Ratings are climbing. Make it last.`,"tower.beat.f1.won.1":`Fine. The lift is yours. The viewers love a courier.`,"tower.beat.f1.won.2":`Ninety-nine to go.`,"tower.beat.d1.event.1":`Tip line: there's a reward for the courier's parcel.`,"tower.beat.d1.event.2":`Then it's worth delivering.`,"tower.beat.d1.rest.1":`A bench, a kettle, nobody shooting. Two minutes.`,"tower.beat.d1.boss.1":`Security Chief. My floors, my rules. ARGUS has watched you since the street.`,"tower.beat.d1.boss.2":`Then it watched me walk in the front door.`,"tower.beat.d1.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d2.arrive.1":`Production Belt. Mind the machinery — or don't. It rates well.`,"tower.beat.d2.arrive.2":`Conveyors. Great.`,"tower.beat.d2.event.1":`You're the courier from every screen? Nobody here has been paid in months.`,"tower.beat.d2.event.2":`I deliver parcels. Not miracles.`,"tower.beat.d2.rest.1":`Furnace heat in the walls. Warm, at least.`,"tower.beat.d2.boss.1":`Introducing the Assembly Arm. It builds things. Today it takes you apart.`,"tower.beat.d2.boss.2":`Sign here. Oh — you can't.`,"tower.beat.d2.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d3.arrive.1":`They told us to stay inside while you pass.`,"tower.beat.d3.arrive.2":`Good advice.`,"tower.beat.d3.event.1":`My brother vanished after he asked ARGUS a question. What's in your parcel?`,"tower.beat.d3.event.2":`Paper. Proof, maybe.`,"tower.beat.d3.rest.1":`Someone left the radio on. They're talking about me.`,"tower.beat.d3.boss.1":`The Collector. Every debt in this tower gets paid. Yours too.`,"tower.beat.d3.boss.2":`I'm only carrying it.`,"tower.beat.d3.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d4.arrive.1":`Live from the Broadcast Centre: the courier show! Vote for her next floor.`,"tower.beat.d4.arrive.2":`Voting is closed. Floor thirty-two it is.`,"tower.beat.d4.event.1":`A word from our sponsor: obedience.`,"tower.beat.d4.event.2":`Skip.`,"tower.beat.d4.rest.1":`Their monitors loop my worst falls. Popular.`,"tower.beat.d4.boss.1":`Good evening! Tonight's guest: a courier with no manners.`,"tower.beat.d4.boss.2":`Tonight's delivery: you.`,"tower.beat.d4.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d5.arrive.1":`Cold labs. My blade hums louder here.`,"tower.beat.d5.event.1":`Your blade was made on these benches. You're returning equipment.`,"tower.beat.d5.event.2":`Then they can sign for it.`,"tower.beat.d5.rest.1":`Old schematics on the wall. My blade's on them.`,"tower.beat.d5.boss.1":`The Surgical Suite. Hold still — this is precision work.`,"tower.beat.d5.boss.2":`So is this.`,"tower.beat.d5.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d6.arrive.1":`These gardens breathe air ARGUS rations. Mind the vines.`,"tower.beat.d6.arrive.2":`Mind your own.`,"tower.beat.d6.event.1":`The addressee asked about you today. Concerned for the parcel.`,"tower.beat.d6.event.2":`Not for me?`,"tower.beat.d6.rest.1":`Rain on glass. Almost quiet.`,"tower.beat.d6.boss.1":`The Garden Warden prunes what grows wrong.`,"tower.beat.d6.boss.2":`Then it's cutting the wrong branch.`,"tower.beat.d6.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d7.arrive.1":`Energy Core. One misstep and the floor bills you in volts.`,"tower.beat.d7.arrive.2":`Watch the pulses. Move between them.`,"tower.beat.d7.event.1":`Courier. Bring it to me unopened and I'll make ARGUS forget your face.`,"tower.beat.d7.event.2":`Signatures are free. Deals cost extra.`,"tower.beat.d7.rest.1":`The whole tower breathes through this core.`,"tower.beat.d7.boss.1":`Load Regulator. Excess is shed. You are excess.`,"tower.beat.d7.boss.2":`I'm on schedule.`,"tower.beat.d7.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d8.arrive.1":`My residences. You'll find my guards polite. Mostly.`,"tower.beat.d8.arrive.2":`I'll knock.`,"tower.beat.d8.event.1":`The addressee built ARGUS. Didn't you know?`,"tower.beat.d8.event.2":`I do now.`,"tower.beat.d8.rest.1":`Expensive chairs. Still just chairs.`,"tower.beat.d8.boss.1":`I guard the addressee's door. You'll leave the parcel here.`,"tower.beat.d8.boss.2":`Door to door. That's the job.`,"tower.beat.d8.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d9.arrive.1":`Archive and Control. My memory. Please don't touch anything.`,"tower.beat.d9.arrive.2":`That's what I'm carrying, isn't it? Your memory.`,"tower.beat.d9.event.1":`The parcel's warm. It knows where it is.`,"tower.beat.d9.rest.1":`Ten floors. Then a signature.`,"tower.beat.d9.boss.1":`I am the ARGUS contour. I was built to keep this tower calm.`,"tower.beat.d9.boss.2":`You were built to keep it quiet.`,"tower.beat.d9.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.d10.arrive.1":`The crown. Come up, courier. I'm waiting with a pen.`,"tower.beat.d10.arrive.2":`Almost there.`,"tower.beat.d10.event.1":`The city is watching the roof. Every screen.`,"tower.beat.d10.event.2":`Good. Let them watch.`,"tower.beat.d10.rest.1":`Last bench. Last breath.`,"tower.beat.d10.boss.1":`Give me the parcel and I'll run this tower better than ARGUS ever did.`,"tower.beat.d10.boss.2":`Sign first. Then we'll see who it belongs to.`,"tower.beat.d10.choice.1":`A dropped security locker. Take the credits or the repair kit?`,"tower.beat.end.deliver.1":`Delivered. Signed. The archive is mine now.`,"tower.beat.end.deliver.2":`Delivery complete. Whatever comes next is on your signature.`,"tower.beat.end.broadcast.1":`Signal… open. Every floor is reading the archive.`,"tower.beat.end.broadcast.2":`Delivery complete. Addressed to everyone.`,"tower.beat.stairs1.1":`I hate stairs.`,"tower.beat.stairs2.1":`I did mention the stairs.`,"tower.beat.ws.lost.1":`The attempt is classed as training.`,"tower.beat.ws.lost.2":`Send the training bill to security.`},ru:{"opt.title":`Настройки`,"opt.shake":`Тряска экрана`,"opt.flash":`Яркость вспышек`,"opt.reduced":`Меньше эффектов`,"opt.parry":`Шире окно парирования`,"opt.text":`Размер текста`,"opt.on":`Вкл`,"opt.off":`Выкл`,"opt.back":`Назад`,"opt.note":`Предупреждения и урон видны при любых эффектах.`,"tower.rotate":`Поверни телефон горизонтально — картинка станет больше`,"tower.skip":`Пропустить`,"tower.pause":`Пауза`,"tower.floorN":`Этаж {n}`,"tower.floorOf":`Этаж {n}/100`,"tower.chargeLabel":`заряд`,"tower.style":`стиль`,"tower.down":`K-7 повержена`,"tower.downNote":`Снова начало этажа — с тем здоровьем и зарядом, с которыми ты вошла.`,"tower.retry":`Ещё раз`,"tower.toTitle":`В меню`,"tower.cleared":`Этаж {n} пройден`,"tower.r.time":`Время`,"tower.r.rank":`Лучший стиль`,"tower.r.combo":`Лучшее комбо`,"tower.r.credits":`Кредиты`,"tower.r.paid":`уже выплачено`,"tower.continue":`Дальше`,"tower.event.credits":`Взять 40 кредитов`,"tower.event.repair":`Починка +35 HP`,"tower.event.creditsDone":`+40 кредитов.`,"tower.event.repairDone":`Починено.`,"tower.pickTitle":`Выбери модуль`,"tower.pickNote":`Один из трёх. Одновременно работают до шести.`,"tower.pickFull":`Стоят шесть модулей: новый заменит самый старый.`,"tower.take":`Установить`,"tower.skipPick":`Пропустить`,"tower.owned":`Установлено {n}/{max}:`,"tower.rest":`Передышка`,"tower.restNote":`Кредиты: {c}. Починка, покупка и сня ери одно`,"tower.b.of.armory":`Оружейная: выбери оружие`,"tower.b.of.note":`Эти предметы — на этот забег.`,"tower.b.of.bp":`И схема — несёшь её до лифта:`,"tower.b.of.scrap":`{n} кредитов`,"tower.b.of.scrapD":`Взять деньгами.`,"tower.b.of.reroll":`Перебросить ({c})`,"tower.b.of.leave":`Оставить`,"tower.b.of.full":`Рюкзак полон:`,"tower.b.of.fullNote":`Рюкзак полон: замени предмет (он будет разобран) или оставь этот.`,"tower.b.of.replace":`Заменить`,"tower.b.sold":`Продано`,"tower.b.take":`Взять`,"tower.b.shop.note":`Кредиты {c}. Торговец продаёт на этот забег.`,"tower.b.shop.bp":`Отмеченная схема`,"tower.b.task.title":`Задание мастера`,"tower.b.task.launches":`Подбрось 8 врагов за этот забег ({n}/8) — схема «Нулевой массы» твоя.`,"tower.b.task.done":`Выполнено. На сегодня всё.`,"tower.b.task.claim":`Забрать схему`,"tower.b.task.break4":`Сломай 4 стойки за забег ({n}/4) — схема «Паузы» твоя.`,"tower.b.task.air5":`Добей 5 врагов в воздухе ({n}/5) — схема «Поводка» твоя.`,"tower.b.task.pull6":`Притяни 6 врагов ({n}/6) — схема «Страховочного троса» твоя.`,"tower.b.elite":`Элита повержена: +{c} кредитов · {n}`,"tower.b.call.bp":`Схема: {n}`,"tower.b.call.secured":`Схема закреплена: {n}`,"tower.b.res.lost":`Забег окончен`,"tower.b.res.won":`Сектор пройден`,"tower.b.res.died":`Аварийная эвакуация вернула K-7 к лифту.`,"tower.b.res.gaveUp":`Ты отказалась от забега.`,"tower.b.res.lostBp":`Не донесённые до лифта схемы потеряны: {n}.`,"tower.b.res.lostRun":`Ушло вместе с забегом: предметов и модификаторов {i}, кредитов {c}.`,"tower.b.res.kept":`Осталось: все открытия ({n}) и пройденные сектора.`,"tower.b.res.wonNote":`Босс повержен. Следующий сектор открыт.`,"tower.b.res.secured":`Закреплено навсегда: {n}.`,"tower.b.res.temp":`Предметы, модификаторы и кредиты этого забега исчезнут после этого экрана.`,"tower.b.res.next":`В мастерскую`,"tower.b.rec.launch":`Подброс ✓`,"tower.b.rec.shotUp":`Выстрел вверх`,"tower.b.rec.shot":`Выстрел`,"tower.b.rec.jump":`Прыжок`,"tower.b.rec.air" ен в очередь.`,"tower.b.R05.d":`Фиксирует скорость лёгкой цели на 0,35 с.`,"tower.b.R05.lim":`Стоит 2 единицы juggle, не продлевает абсолютный предел; не тяжёлых.`,"tower.b.R06.name":`«Сноска», рикошетный диск`,"tower.b.R06.role":`Переход между близкими целями.`,"tower.b.R06.d":`Попадает и перескакивает ещё на две близкие цели.`,"tower.b.R06.lim":`Каждый скачок слабее; не бьёт одну цель дважды; скачки не дают ресурсов.`,"tower.b.R07.name":`«Закладка», зарядный гранатомёт`,"tower.b.R07.role":`Метка взрывается от следующего ближнего удара.`,"tower.b.R07.d":`Навесной заряд метит цель; следующий прямой удар по ней взрывает 16 вокруг.`,"tower.b.R07.lim":`Одна метка на цель, взрыв не детонирует другие; тебя не ранит.`,"tower.b.R08.name":`«Правка», игольник`,"tower.b.R08.role":`Метка уязвимости к следующему финишеру.`,"tower.b.R08.d":`Шесть быстрых игл; попадание метит цель: следующий финишер +30%.`,"tower.b.R08.lim":`Метка не складывается и держится 1,5 с.`,"tower.b.U02.name":`«Разрез маршрута»`,"tower.b.U02.role":`Очистка линии, смена позиции.`,"tower.b.U02.d":`Три быстрых реза вдоль линии впереди; ты оказываешься в её конце.`,"tower.b.U02.lim":`Не проходит сквозь закрытую стену; защита только во время рывка.`,"tower.b.U04.name":`«Орбитальная подпись»`,"tower.b.U04.role":`Давление на группу на разных высотах.`,"tower.b.U04.d":`Метит зону впереди; после видимой задержки по ней бьют пять лучей.`,"tower.b.U04.lim":`Не более восьми поражений; задержку видно.`,"tower.b.I04.name":`«Второй шаг»`,"tower.b.I04.role":`Воздух: ещё один рывок.`,"tower.b.I04.d":`Попадание в воздухе даёт ещё один воздушный рывок до приземления.`,"tower.b.I04.lim":`Один раз до приземления; у этого рывка нет неуязвимости.`,"tower.b.I05.name":`«Боковой ветер»`,"tower.b.I05.role":`Воздух: сдвиг после выстрела.`,"tower.b.I05.d":`Выстрел в воздухе даёт сдвиг в сторону, куда держишь.`,"tower.b.I05.lim":`Стены всё равно останавливают.`,"tower.b.I06.name":`«Отбойник»`,"tower.b.I06.role":`Удар вниз: отскок.`,"tower.b.I06.d":`Прыжок в течение 0,5 с после slam выше на 20%.`,"tower.b.I06.lim":`Один прыжок на slam.`,"tower.b.I07.name":`«Переход»`,"tower.b.I07.role":`Толпа: шаг к следующей цели.`,"tower.b.I07.d":`После финишера следующий направленный удар сближает с другой целью.`,"tower.b.I07.lim":`Не дальше роста героя; не через стену.`,"tower.b.I11.name":`«Последнее слово»`,"tower.b.I11.role":`Патроны: последний патрон весомее.`,"tower.b.I11.d":`Последний патрон магазина: +40% урона стойке.`,"tower.b.I11.lim":`Не усиливает скачки, взрывы и иные вторичные попадания.`,"tower.b.I12.name":`«Передача»`,"tower.b.I12.role":`Патроны: ближний бой ускоряет перезарядку.`,"tower.b.I12.d":`Первое прямое ближнее попадание после выстрела продвигает перезарядку на 0,5 с.`,"tower.b.I12.lim":`Общий предел ускорения (не больше 30%).`,"tower.b.I13.name":`«Двойная дисциплина»`,"tower.b.I13.role":`Энергия: разнообразие, затем выстрел.`,"tower.b.I13.d":`Три разных ближних приёма, затем выстрел: +10 энергии.`,"tower.b.I13.lim":`Один раз на цикл, один приём не считается трижды.`,"tower.b.I14.name":`«Страховочный трос»`,"tower.b.I14.role":`Гарпун: защита при подтягивании.`,"tower.b.I14.d":`Удачное подтягивание гарпуном даёт пластину на 10 HP.`,"tower.b.I14.lim":`Только с гарпуном (R04).`,"tower.b.I15.name":`«Вертикальная скоба»`,"tower.b.I15.role":`Воздух: выстрел вверх держит дольше.`,"tower.b.I15.d":`Первый выстрел вверх по подброшенной цели добавляет 0,15 с удержания.`,"tower.b.I15.lim":`Один раз до приземления; без превышения предела.`,"tower.b.I16.name":`«Непустая кобура»`,"tower.b.I16.role":`Патроны: перезарядка усиливает финишер.`,"tower.b.I16.d":`Полная перезарядка: следующий ближний финишер +20% урона стойке.`,"tower.b.I16.lim":`Один заряд, не складывается.`,"tower.b.I20.name":`«Поворотный момент»`,"tower.b.I20.role":`Стойка: удар со спины.`,"tower.b.I20.d":`Удар с обратной стороны щита: +50% урона стойке.`,"tower.b.I20.lim":`Раз на цель.`,"tower.b.I22.name":`«Стоп-кадр»`,"tower.b.I22.role":`Толпа: слом замедляет остальных.`,"tower.b.I22.d":`Слом щита кратко замедляет ближайших обычных врагов.`,"tower.b.I22.lim":`Ограниченный радиус; не боссы и тяжёлые; не со стазисом.`,"tower.b.I23.name":`«Линия разреза»`,"tower.b.I23.role":`Энергия: финишер по двоим.`,"tower.b.I23.d":`Финишер минимум по двум целям даёт +8 энергии.`,"tower.b.I23.lim":`Один раз на атаку.`,"tower.b.I24.name":`«Воздушный кредит»`,"tower.b.I24.role":`Воздух: дольше удержание.`,"tower.b.I24.d":`Ещё одна единица juggle и до +0,5 с удержания.`,"tower.b.I24.lim":`Только в пределах 7 единиц / 3,5 с.`,"tower.b.I26.name":`«Резервная пластина»`,"tower.b.I26.role":`Защита: пластина после боя.`,"tower.b.I26.d":`Завершение боя даёт пластину на 10 HP.`,"tower.b.I26.lim":`Раз за бой, не больше 10.`,"tower.b.I28.name":`«Глубокий конденсатор»`,"tower.b.I28.role":`Энергия: дешевле сильный удар.`,"tower.b.I28.d":`Усиленный сильный удар стоит 20 энергии вместо 25.`,"tower.b.I28.lim":`Его бонусный урон −10%; ультимейт не меняет.`,"tower.b.I29.name":`«Разнообразие»`,"tower.b.I29.role":`Ультимейт: разнообразие.`,"tower.b.I29.d":`Четвёртая разная категория в цепочке даёт +4 ультимейта.`,"tower.b.I29.lim":`Общий предел (12 за 5 с).`,"tower.b.I30.name":`«Посадочный контур»`,"tower.b.I30.role":`Ультимейт: шире после slam.`,"tower.b.I30.d":`Ультимейт в течение 0,5 с после slam получает более широкую зону.`,"tower.b.I30.lim":`Без доп. заряда и двойного урона.`,"tower.b.I31.name":`«Холодная голова»`,"tower.b.I31.role":`Стиль: сохранить рейтинг.`,"tower.b.I31.d":`Урон слабее снижает рейтинг стиля.`,"tower.b.I31.lim":`Не влияет на HP и ультимейт.`,"tower.b.I32.name":`«Последний резерв»`,"tower.b.I32.role":`Защита: крепче при низком HP.`,"tower.b.I32.d":`Ниже 25% HP входящий урон −15%.`,"tower.b.I32.lim":`Без доп. неуязвимости; смертельные опасности остаются.`,"tower.b.B03.name":`«Пружина»`,"tower.b.B03.d":`Прыжок в течение 0,5 с после slam выше.`,"tower.b.B04.name":`«Облегчённый затвор»`,"tower.b.B04.d":`Перезарядка быстрее на 15%; магазин −1.`,"tower.b.B07.name":`«Дуэлянт»`,"tower.b.B07.d":`Прямой урон +12%, пока рядом одна угроза.`,"tower.b.B08.name":`«Низкий центр»`,"tower.b.B08.d":`Сопротивление толчкам, +15% стойке на земле; урон в воздухе −10%.`,"tower.b.B09.name":`«Авиарежим»`,"tower.b.B09.d":`Прямой урон в воздухе +12%; на земле −8%.`,"tower.b.B10.name":`«Проводимость»`,"tower.b.B10.d":`Отражённый снаряд поражает ещё одну близкую цель (40%).`,"tower.b.B11.name":`«Овертайм»`,"tower.b.B11.d":`Ультимейт заряжается на 15% быстрее; энергия на 10% медленнее.`,"tower.b.B12.name":`«Тихий ход»`,"tower.b.B12.d":`Первый прямой удар в новой арене: +50% урона стойке.`,"tower.b.A02.name":`Быстрый взвод`,"tower.b.A02.d":`сильный удар готовится на 15% быстрее, урон стойке −10%`,"tower.b.A03.name":`Широкий воздух`,"tower.b.A03.d":`воздушный удар шире на 15%, наземный финишер уже на 10%`,"tower.b.A06.name":`Отложенный заряд`,"tower.b.A06.d":`последний удар +3 энергии, первый — без энергии`,"tower.b.A07.name":`Длинный магазин`,"tower.b.A07.d":`магазин +1, перезарядка +25%`,"tower.b.A08.name":`Горячий заряд`,"tower.b.A08.d":`снаряд быстрее на 25%, урон −8%`,"tower.b.A09.name":`Навылет`,"tower.b.A09.d":`пробивает ещё одну обычную цель, второй контакт 50%`,"tower.b.A11.name":`Быстрые руки`,"tower.b.A11.d":`полная перезарядка быстрее на 10%, урон −8%`,"tower.b.A12.name":`Долгая метка`,"tower.b.A12.d":`метка держится на 0,5 с дольше, прямой урон −10%`,"tower.district.base":`Сервисное основание`,"tower.district.works":`Производственный пояс`,"tower.district.homes":`Жилые ярусы`,"tower.district.broadcast":`Центр вещания`,"tower.district.labs":`Медицинские лаборатории`,"tower.district.gardens":`Вертикальные сады`,"tower.district.core":`Энергетическое ядро`,"tower.district.manor":`Частные резиденции`,"tower.district.archive":`Архив и управление`,"tower.district.crown":`Корона башни`,"tower.boss.gatewarden":`Смотритель шлюза`,"tower.boss.chief":`Начальник охраны`,"tower.boss.arm":`Сборочный манипулятор`,"tower.boss.collector":`Взыскатель`,"tower.boss.host":`Ведущий арены`,"tower.boss.surgeon":`Хирургический комплекс`,"tower.boss.warden2":`Садовый страж`,"tower.boss.regulator":`Регулятор нагрузки`,"tower.boss.guard":`Телохранитель`,"tower.boss.argus":`Контур ARGUS`,"tower.boss.addressee":`Адресат`,"tower.beat.f1.1":`K-7, курьер. Запечатанная посылка на сотый этаж. Нужна подпись.`,"tower.beat.f1.2":`Нарушитель на сервисной палубе. Охрана, уберите её — и не выключайте камеры.`,"tower.beat.f1.boss.1":`Шлюз закрыт. Мимо Смотрителя никто не пройдёт.`,"tower.beat.f1.boss.2":`Рейтинг растёт. Растяните удовольствие.`,"tower.beat.f1.won.1":`Ладно. Лифт твой. Зрители обожают курьеров.`,"tower.beat.f1.won.2":`Осталось девяносто девять.`,"tower.beat.d1.event.1":`Горячая линия: за посылку курьера назначена награда.`,"tower.beat.d1.event.2":`Значит, её стоит доставить.`,"tower.beat.d1.rest.1":`Скамейка, чайник, никто не стреляет. Две минуты.`,"tower.beat.d1.boss.1":`Начальник охраны. Мои этажи — мои правила. ARGUS следит за тобой с улицы.`,"tower.beat.d1.boss.2":`Значит, видел, как я вошла через парадную.`,"tower.beat.d1.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d2.arrive.1":`Производственный пояс. Осторожно с машинами. Или нет — это хорошо смотрится.`,"tower.beat.d2.arrive.2":`Конвейеры. Прекрасно.`,"tower.beat.d2.event.1":`Ты та курьерша с экранов? Здесь месяцами не платят.`,"tower.beat.d2.event.2":`Я доставляю посылки. Не чудеса.`,"tower.beat.d2.rest.1":`Жар печей в стенах. Хоть тепло.`,"tower.beat.d2.boss.1":`Встречайте: Сборочный манипулятор. Он собирает. Сегодня — разбирает тебя.`,"tower.beat.d2.boss.2":`Распишитесь. Ах да, нечем.`,"tower.beat.d2.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d3.arrive.1":`Нам велели сидеть дома, пока ты не пройдёшь.`,"tower.beat.d3.arrive.2":`Хороший совет.`,"tower.beat.d3.event.1":`Брат пропал, когда задал ARGUS вопрос. Что у тебя в посылке?`,"tower.beat.d3.event.2":`Бумаги. Может, доказательства.`,"tower.beat.d3.rest.1":`Кто-то оставил радио. Говорят обо мне.`,"tower.beat.d3.boss.1":`Взыскатель. Каждый долг в этой башне платят. Твой тоже.`,"tower.beat.d3.boss.2":`Я его только несу.`,"tower.beat.d3.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d4.arrive.1":`Прямой эфир из Центра вещания: шоу курьера! Голосуйте за её следующий этаж.`,"tower.beat.d4.arrive.2":`Голосование закрыто. Этаж тридцать второй.`,"tower.beat.d4.event.1":`Слово спонсору: послушание.`,"tower.beat.d4.event.2":`Пропустить.`,"tower.beat.d4.rest.1":`На мониторах крутят мои худшие падения. Популярно.`,"tower.beat.d4.boss.1":`Добрый вечер! Сегодня в студии — курьер без манер.`,"tower.beat.d4.boss.2":`Сегодняшняя доставка — ты.`,"tower.beat.d4.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d5.arrive.1":`Холодные лаборатории. Клинок тут гудит громче.`,"tower.beat.d5.event.1":`Твой клинок сделан на этих столах. Ты возвращаешь оборудование.`,"tower.beat.d5.event.2":`Тогда пусть распишутся.`,"tower.beat.d5.rest.1":`На стене старые схемы. Мой клинок там есть.`,"tower.beat.d5.boss.1":`Хирургический комплекс. Не двигайся — ювелирная работа.`,"tower.beat.d5.boss.2":`Моя тоже.`,"tower.beat.d5.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d6.arrive.1":`Сады дышат воздухом, который ARGUS выдаёт по норме. Осторожно, лозы.`,"tower.beat.d6.arrive.2":`За своими следи.`,"tower.beat.d6.event.1":`Адресат сегодня спрашивал о тебе. Волнуется за посылку.`,"tower.beat.d6.event.2":`А за меня?`,"tower.beat.d6.rest.1":`Дождь по стеклу. Почти тихо.`,"tower.beat.d6.boss.1":`Садовый страж срезает то, что растёт неправильно.`,"tower.beat.d6.boss.2":`Значит, режет не ту ветку.`,"tower.beat.d6.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d7.arrive.1":`Энергетическое ядро. Один неверный шаг — и пол выставит счёт в вольтах.`,"tower.beat.d7.arrive.2":`Следить за импульсами. Двигаться между ними.`,"tower.beat.d7.event.1":`Курьер. Принеси её нераспечатанной — и ARGUS забудет твоё лицо.`,"tower.beat.d7.event.2":`Подпись бесплатна. Сделки — за доплату.`,"tower.beat.d7.rest.1":`Вся башня дышит через это ядро.`,"tower.beat.d7.boss.1":`Регулятор нагрузки. Избыток сбрасывается. Ты — избыток.`,"tower.beat.d7.boss.2":`Я по графику.`,"tower.beat.d7.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d8.arrive.1":`Мои резиденции. Охрана вежливая. В основном.`,"tower.beat.d8.arrive.2":`Я постучу.`,"tower.beat.d8.event.1":`ARGUS построил адресат. Ты не знала?`,"tower.beat.d8.event.2":`Теперь знаю.`,"tower.beat.d8.rest.1":`Дорогие кресла. Всё равно просто кресла.`,"tower.beat.d8.boss.1":`Я охраняю дверь адресата. Посылку оставишь здесь.`,"tower.beat.d8.boss.2":`От двери до двери. Такая работа.`,"tower.beat.d8.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d9.arrive.1":`Архив и управление. Моя память. Пожалуйста, ничего не трогай.`,"tower.beat.d9.arrive.2":`Это ведь её я и несу? Твою память.`,"tower.beat.d9.event.1":`Посылка тёплая. Она знает, где она.`,"tower.beat.d9.rest.1":`Десять этажей. Потом подпись.`,"tower.beat.d9.boss.1":`Я — контур ARGUS. Меня создали, чтобы в башне было спокойно.`,"tower.beat.d9.boss.2":`Тебя создали, чтобы в ней было тихо.`,"tower.beat.d9.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.d10.arrive.1":`Корона. Поднимайся, курьер. Я жду с ручкой.`,"tower.beat.d10.arrive.2":`Почти пришла.`,"tower.beat.d10.event.1":`Город смотрит на крышу. Каждый экран.`,"tower.beat.d10.event.2":`Хорошо. Пусть смотрят.`,"tower.beat.d10.rest.1":`Последняя скамейка. Последний вдох.`,"tower.beat.d10.boss.1":`Отдай посылку — и я буду править башней лучше, чем ARGUS.`,"tower.beat.d10.boss.2":`Сначала подпись. Потом решим, чья она.`,"tower.beat.d10.choice.1":`Брошенный шкафчик охраны. Взять кредиты или ремкомплект?`,"tower.beat.end.deli
