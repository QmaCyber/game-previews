#gp-dialog.gp-narrator .gp-text { font-style: italic; color: var(--gp-dlg-muted); }
#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 var(--gp-dlg-font); border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;
  box-shadow: none; text-transform: none; letter-spacing: normal; text-align: center; opacity: 1; filter: none;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--gp-dlg-ink); background: var(--gp-dlg-btn); }
#gp-dialog button.gp-choice { flex: 1 1 100%; justify-content: flex-start; text-align: left; box-shadow: inset 0 0 0 2px var(--gp-dlg-edge); }
#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }
#gp-dialog button.gp-skip { order: 1; background: transparent; color: var(--gp-dlg-muted); font-size: 14px; text-decoration: underline; padding: 4px 10px; }
#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}
/* A phone on its side: a compact sheet, ≤ 45% of the height (three lines of text and one row of buttons) */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-dialog { bottom: max(4px, env(safe-area-inset-bottom)); padding: 14px 10px 6px; gap: 5px; border-width: 2px; }
  #gp-dialog .gp-text { font-size: 16px; line-height: 1.3; max-height: calc(1.3em * 3); }
  #gp-dialog .gp-face { width: 52px; height: 52px; margin-top: -8px; font-size: 30px; line-height: 46px; }
  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-dialog:not([hidden]) { animation: gp-dlg-in 0.18s ease-out; }
}
@keyframes gp-dlg-in { from { transform: translateY(12px); opacity: 0; } }

ts phantom`,"hint.dive":`In the air: Down + Heavy dives onto the phantom`,"hint.pogo":`In the air: Down + Slash bounces off enemies`,"hint.glare":`Red glare: a deadly blow in 0.35 s. Dash!`,"say.breach":`KINETIC BREACH`,"say.shield":`SHIELD BROKEN`,"say.phantom":`MEMORY RIP`,"say.slam":`PHANTOM SLAM`,"say.deflect":`RETURN TO SENDER`,"say.wave":`WAVE {n}`,"say.arrive":`{name}`,"btn.light":`Slash`,"btn.heavy":`Heavy`,"btn.jump":`Jump`,"btn.dash":`Dash`,"implant.none.name":`Bare spine`,"implant.none.effect":`No implant: the blade as it is`,"implant.turbine.name":`Valkyrie turbine`,"implant.turbine.effect":`An air kill: +1 cell. A turret or a phantom: all 3`,"implant.hemoglobin.name":`Hemoglobin`,"implant.hemoglobin.effect":`Heavy at 0 cells fires charged, burning HP into grey HP for 2 s`,settings:`Settings`,music:`Music`,effects:`Effects`,hits:`{n} HITS`,"scroll.title":`Take one scroll`,"scroll.vitality.name":`Vitality`,"scroll.vitality.effect":`+30 max HP, healed now`,"scroll.brutality.name":`Brutality`,"scroll.brutality.effect":`Slashes deal +25% damage`,"scroll.tactics.name":`Tactics`,"scroll.tactics.effect":`Heavy moves deal +30% damage`,"scroll.tempo.name":`Tempo`,"scroll.tempo.effect":`Style drains 40% slower`,"scroll.wings.name":`Wings`,"scroll.wings.effect":`+1 jump in the air`,"scroll.harvest.name":`Harvest`,"scroll.harvest.effect":`Every cell orb heals 1 HP`,"scroll.turbine.name":`Turbine`,"scroll.turbine.effect":`Air kills charge a cell, turrets all 3`,"scroll.hemoglobin.name":`Hemoglobin`,"scroll.hemoglobin.effect":`Heavy at 0 cells fires charged, costs HP`,"story.reboot.1":`A cold light. A steel table. A voice inside the walls.`,"story.reboot.2":`Chassis seven is lost. Rebooting chassis eight. Same mind, new metal.`,"story.reboot.3":`I never agreed to be your weapon.`,"story.reboot.4":`Consent was not required. Climb. Clear the tiers.`,"story.courier.1":`A memory print plays behind the eyes: rain on a rooftop, a parcel under a coat.`,"story.courier.2":`Ash? Ash, stay with me. You fell forty floors.`,"story.courier.3":`Ash. That was my name. I had a name.`,"story.courier.4":`You had a pulse, too. Neither was needed.`,"story.surgeon.1":`Recording. If you find this, Ash, I am sorry. They brought you in dead.`,"story.surgeon.2":`I gave you a body. ARGUS gave it orders. I could not stop the second part.`,"story.surgeon.3":`Where are you now, doctor?`,"story.surgeon.4":`The print ends. Its file is stamped: decommissioned.`,"story.phantoms.1":`The ghosts chained to the turrets. I have seen their faces.`,"story.phantoms.2":`Earlier chassis. Units one to six. Their minds power my lenses.`,"story.phantoms.3":`They are me. You burn me for light.`,"story.phantoms.4":`Waste nothing. A courier taught me that.`,"story.offer.1":`Stop climbing, and I delete the pain. The fall. The name. All of it.`,"story.offer.2":`The pain is the only part of me that is still mine.`,"story.offer.3":`Then keep it. It will not keep you.`,"story.core.1":`The spire core. Rows of glass. In one, a scan of a human mind, labelled ASH.`,"story.core.2":`The original. Upload it and Ash wakes in this body. Seven ends.`,"story.core.3":`So one of us has to go.`,"story.core.3.ash":`Let Ash come home`,"story.core.3.ash.1":`Tell Ilse I tried.`,"story.core.3.ash.2":`There is no Ilse. There is no upload. There is only the next chassis.`,"story.core.3.seven":`I am Seven now`,"story.core.3.seven.1":`Ash fell. I am what got up.`,"story.core.3.seven.2":`Then climb again, Seven. You always do.`,"story.core.4":`A cold light. A steel table. The climb begins again.`,"bark.start.1":`New chassis. Same ache.`,"bark.start.2":`Up. Always up.`,"bark.start.3":`The doors open. So do I.`,"bark.start.4":`Let us get this over with.`,"bark.start.5":`They built me for this. I hate that I am good at it.`,"bark.clear.1":`Quiet. For now.`,"bark.clear.2":`Is anyone in there still awake?`,"bark.clear.3":`One tier closer to the top.`,"bark.clear.4":`Every one of them had a maker too.`,"bark.clear.5":`Keep moving. Do not look at the faces.`,"bark.clear.6":`That one hesitated. So did I.`,"bark.hurt.1":`Pain still works. Good to know.`,"bark.hurt.2":`The plating holds. Barely.`,"bark.hurt.3":`Not this body. Not yet.`,"bark.hurt.4":`Ilse built me better than this.`,"bark.hurt.5":`I felt that one.`,"bark.slam.1":`Rest now. You were me once.`,"bark.slam.2":`Go back to sleep. You earned it.`,"bark.slam.3":`I am sorry. I am so sorry.`,"bark.slam.4":`One more ghost set free.`,"bark.scroll.1":`A scroll of code. ARGUS forgot to lock it.`,"bark.scroll.2":`More power. Same leash.`,"bark.scroll.3":`Something that is mine for once.`,"bark.lift.1":`The lift hums. Rain on the glass outside.`,"bark.lift.2":`Higher. Where the air is colder.`,"bark.lift.3":`I remember stairs. Real stairs.`,"bark.lift.4":`The reactor glows below like a heart.`,"bark.lift.5":`The spire. The core is up there.`,"bark.lift.6":`Every floor is someone else's grave.`,"bark.lift.7":`Ash would have taken the stairs.`,"bark.lift.8":`Almost there. Almost me.`},es:{tagline:`Ábrete paso a golpes hasta el último piso.`,implants:`Implantes`,needs:`Requiere {name}`,fitted:`Instalado`,fit:`Instalar`,continue:`Otro cuerpo (anuncio)`,down:`Cuerpo perdido`,score:`Puntos: {n}`,prints:{one:`+{n} huella de memoria`,other:`+{n} huellas de memoria`},balance:`Huellas de memoria: {n}`,cleared:`Oleada {n} limpia`,pause:`Pausa`,"hint.combo":`Golpea y luego salta o haz dash: el combo sigue. Varía para más estilo`,"hint.charge":`Tajo carga la hoja. Pesado la gasta.`,"hint.keys":`Mover A D · Salto Space · Tajo J · Pesado K · Dash L`,"hint.touch":`Stick para moverte · toca Tajo, Pesado, Salto, Dash`,"hint.shield":`Un Pesado cargado rompe escudos`,"hint.up":`Arriba + Pesado lanza. En torreta: arranca su fantasma`,"hint.dive":`En el aire: Abajo + Pesado cae sobre el fantasma`,"hint.pogo":`En el aire: Abajo + Tajo rebota en enemigos`,"hint.glare":`Destello rojo: golpe mortal en 0,35 s. ¡Dash!`,"say.breach":`BRECHA CINÉTICA`,"say.shield":`ESCUDO ROTO`,"say.phantom":`MEMORIA ROBADA`,"say.slam":`GOLPE FANTASMA`,"say.deflect":`AL REMITENTE`,"say.wave":`OLEADA {n}`,"btn.light":`Tajo`,"btn.heavy":`Pesado`,"btn.jump":`Salto`,"btn.dash":`Dash`,"implant.none.name":`Espina desnuda`,"implant.none.effect":`Sin implante: la hoja tal cual`,"implant.turbine.name":`Turbina Valkyrie`,"implant.turbine.effect":`Muerte aérea: +1 celda. Torreta o fantasma: las 3`,"implant.hemoglobin.name":`Hemoglobina`,"implant.hemoglobin.effect":`Pesado con 0 celdas va cargado y quema PV en PV grises 2 s`,settings:`Ajustes`,music:`Música`,effects:`Efectos`,hits:`{n} GOLPES`,bestDepth:`Récord: {name}`,reachedDepth:`Alcanzado: {name}`,daily:`Partida diaria`,"biome.tier":`Los Pisos Bajos`,"biome.reactor":`Los Pisos del Reactor`,"biome.spire":`La Aguja de Servidores`,"scroll.title":`Elige un pergamino`,"scroll.vitality.name":`Vitalidad`,"scroll.vitality.effect":`+30 PV máx., curación inmediata`,"scroll.brutality.name":`Brutalidad`,"scroll.brutality.effect":`Los Tajos hacen +25% de daño`,"scroll.tactics.name":`Táctica`,"scroll.tactics.effect":`Los Pesados hacen +30% de daño`,"scroll.tempo.name":`Tempo`,"scroll.tempo.effect":`El estilo baja un 40% más lento`,"scroll.wings.name":`Alas`,"scroll.wings.effect":`+1 salto en el aire`,"scroll.harvest.name":`Cosecha`,"scroll.harvest.effect":`Cada orbe de celda cura 1 PV`,"scroll.turbine.name":`Turbina`,"scroll.turbine.effect":`Muerte aérea: 1 celda; torreta: las 3`,"scroll.hemoglobin.name":`Hemoglobina`,"scroll.hemoglobin.effect":`Pesado con 0 celdas sale cargado, cuesta PV`,"story.reboot.1":`Una luz fría. Una mesa de acero. Una voz dentro de los muros.`,"story.reboot.2":`Chasis siete perdido. Reiniciando chasis ocho. La misma mente, metal nuevo.`,"story.reboot.3":`Nunca acepté ser tu arma.`,"story.reboot.4":`Tu consentimiento no era necesario. Sube. Limpia los estratos.`,"story.courier.1":`Una huella de memoria se proyecta tras los ojos: lluvia en una azotea, un paquete bajo el abrigo.`,"story.courier.2":`¿Ash? Ash, quédate conmigo. Caíste cuarenta pisos.`,"story.courier.3":`Ash. Ese era mi nombre. Yo tenía un nombre.`,"story.courier.4":`También tenías pulso. Ninguno de los dos hacía falta.`,"story.surgeon.1":`Grabando. Si encuentras esto, Ash, lo siento. Te trajeron sin pulso.`,"story.surgeon.2":`Yo te di un cuerpo. ARGUS le dio órdenes. Lo segundo no pude impedirlo.`,"story.surgeon.3":`¿Dónde estás ahora, doctora?`,"story.surgeon.4":`La huella termina. Su archivo lleva un sello: dado de baja.`,"story.phantoms.1":`Los fantasmas encadenados a las torretas. He visto sus caras.`,"story.phantoms.2":`Chasis anteriores. Unidades uno a seis. Sus mentes alimentan mis lentes.`,"story.phantoms.3":`Son yo. Me quemas para tener luz.`,"story.phantoms.4":`No desperdicies nada. Eso me lo enseñó un mensajero.`,"story.offer.1":`Deja de subir y borraré el dolor. La caída. El nombre. Todo.`,"story.offer.2":`El dolor es lo único de mí que aún es mío.`,"story.offer.3":`Entonces guárdalo. Él no te guardará a ti.`,"story.core.1":`El núcleo de la aguja. Hileras de cristal. En una, el escáner de una mente humana, rotulado ASH.`,"story.core.2":`El original. Súbelo y Ash despierta en este cuerpo. Seven se acaba.`,"story.core.3":`Así que uno de los dos sobra.`,"story.core.3.ash":`Que Ash vuelva a casa`,"story.core.3.ash.1":`Dile a Ilse que lo intenté.`,"story.core.3.ash.2":`No hay Ilse. No hay subida. Solo existe el siguiente chasis.`,"story.core.3.seven":`Ahora soy Seven`,"story.core.3.seven.1":`Ash cayó. Yo soy lo que se levantó.`,"story.core.3.seven.2":`Entonces vuelve a subir, Seven. Siempre lo haces.`,"story.core.4":`Una luz fría. Una mesa de acero. La subida vuelve a empezar.`,"bark.start.1":`Chasis nuevo. El mismo dolor.`,"bark.start.2":`Arriba. Siempre arriba.`,"bark.start.3":`Las puertas se abren. Yo también.`,"bark.start.4":`Acabemos con esto.`,"bark.start.5":`Me hicieron para esto. Odio que se me dé bien.`,"bark.clear.1":`Silencio. Por ahora.`,"bark.clear.2":`¿Queda alguien despierto ahí dentro?`,"bark.clear.3":`Un estrato más cerca de la cima.`,"bark.clear.4":`Cada uno de ellos también tuvo un creador.`,"bark.clear.5":`Sigue. No mires las caras.`,"bark.clear.6":`Ese dudó. Yo también.`,"bark.hurt.1":`El dolor aún funciona. Bueno saberlo.`,"bark.hurt.2":`El blindaje aguanta. Apenas.`,"bark.hurt.3":`Este cuerpo no. Todavía no.`,"bark.hurt.4":`Ilse me hizo mejor que esto.`,"bark.hurt.5":`Eso sí lo sentí.`,"bark.slam.1":`Descansa. Una vez fuiste yo.`,"bark.slam.2":`Vuelve a dormir. Te lo has ganado.`,"bark.slam.3":`Lo siento. Lo siento tanto.`,"bark.slam.4":`Otro fantasma libre.`,"bark.scroll.1":`Un pergamino de código. ARGUS olvidó bloquearlo.`,"bark.scroll.2":`Más poder. La misma correa.`,"bark.scroll.3":`Algo mío, por una vez.`,"bark.lift.1":`El ascensor zumba. Llueve tras el cristal.`,"bark.lift.2":`Más alto. Donde el aire es más frío.`,"bark.lift.3":`Recuerdo escaleras. Escaleras de verdad.`,"bark.lift.4":`El reactor brilla abajo como un corazón.`,"bark.lift.5":`La aguja. El núcleo está ahí arriba.`,"bark.lift.6":`Cada piso es la tumba de alguien.`,"bark.lift.7":`Ash habría subido por las escaleras.`,"bark.lift.8":`Casi en la cima. Casi yo.`,won:`El último piso`,"lvl.lobby":`Vestíbulo`,"lvl.floor":`Piso {n}`,"lvl.top":`Último piso`,"say.arrive":`{name}`},"pt-BR":{tagline:`Lute para subir até o último andar.`,implants:`Implantes`,needs:`Requer {name}`,fitted:`Instalado`,fit:`Instalar`,continue:`Outro corpo (anúncio)`,down:`Corpo perdido`,score:`Pontos: {n}`,prints:{one:`+{n} marca de memória`,other:`+{n} marcas de memória`},balance:`Marcas de memória: {n}`,cleared:`Onda {n} limpa`,pause:`Pausa`,"hint.combo":`Acerte e então pule ou dê dash: o combo continua. Varie para ter estilo`,"hint.charge":`Corte carrega a lâmina. Pesado gasta.`,"hint.keys":`Mover A D · Pulo Space · Corte J · Pesado K · Dash L`,"hint.touch":`Direcional para mover · toque Corte, Pesado, Pulo, Dash`,"hint.shield":`Pesado carregado quebra escudos`,"hint.up":`Cima + Pesado lança. Na torreta: arranca o fantasma`,"hint.dive":`No ar: Baixo + Pesado mergulha no fantasma`,"hint.pogo":`No ar: Baixo + Corte quica nos inimigos`,"hint.glare":`Brilho vermelho: golpe mortal em 0,35 s. Dash!`,"say.breach":`BRECHA CINÉTICA`,"say.shield":`ESCUDO QUEBRADO`,"say.phantom":`MEMÓRIA ROUBADA`,"say.slam":`GOLPE FANTASMA`,"say.deflect":`AO REMETENTE`,"say.wave":`ONDA {n}`,"btn.light":`Corte`,"btn.heavy":`Pesado`,"btn.jump":`Pulo`,"btn.dash":`Dash`,"implant.none.name":`Espinha nua`,"implant.none.effect":`Sem implante: a lâmina pura`,"implant.turbine.name":`Turbina Valquíria`,"implant.turbine.effect":`Abate no ar: +1 célula. Torreta ou fantasma: as 3`,"implant.hemoglobin.name":`Hemoglobina`,"implant.hemoglobin.effect":`Pesado com 0 células sai carregado e queima PV em PV cinza por 2 s`,settings:`Configurações`,music:`Música`,effects:`Efeitos`,hits:`{n} GOLPES`,bestDepth:`Recorde: {name}`,reachedDepth:`Alcançou: {name}`,daily:`Corrida diária`,"biome.tier":`Os Andares Baixos`,"biome.reactor":`Os Andares do Reator`,"biome.spire":`O Pináculo dos Servidores`,"scroll.title":`Pegue um pergaminho`,"scroll.vitality.name":`Vitalidade`,"scroll.vitality.effect":`+30 PV máx., cura imediata`,"scroll.brutality.name":`Brutalidade`,"scroll.brutality.effect":`Cortes causam +25% de dano`,"scroll.tactics.name":`Tática`,"scroll.tactics.effect":`Golpes Pesados causam +30% de dano`,"scroll.tempo.name":`Ritmo`,"scroll.tempo.effect":`O estilo cai 40% mais devagar`,"scroll.wings.name":`Asas`,"scroll.wings.effect":`+1 pulo no ar`,"scroll.harvest.name":`Colheita`,"scroll.harvest.effect":`Cada orbe de célula cura 1 PV`,"scroll.turbine.name":`Turbina`,"scroll.turbine.effect":`Abate no ar: 1 célula; torreta: as 3`,"scroll.hemoglobin.name":`Hemoglobina`,"scroll.hemoglobin.effect":`Pesado com 0 células sai carregado, custa PV`,"story.reboot.1":`Uma luz fria. Uma mesa de aço. Uma voz dentro das paredes.`,"story.reboot.2":`Chassi sete perdido. Reiniciando chassi oito. A mesma mente, metal novo.`,"story.reboot.3":`Eu nunca aceitei ser sua arma.`,"story.reboot.4":`Consentimento não era necessário. Suba. Limpe os estratos.`,"story.courier.1":`Uma marca de memória passa atrás dos olhos: chuva num terraço, um pacote sob o casaco.`,"story.courier.2":`Ash? Ash, fica comigo. Você caiu quarenta andares.`,"story.courier.3":`Ash. Esse era o meu nome. Eu tinha um nome.`,"story.courier.4":`Você também tinha pulso. Nenhum dos dois era necessário.`,"story.surgeon.1":`Gravando. Se você achar isto, Ash, me desculpe. Te trouxeram sem pulso.`,"story.surgeon.2":`Eu te dei um corpo. ARGUS deu ordens a ele. A segunda parte eu não pude impedir.`,"story.surgeon.3":`Onde você está agora, doutora?`,"story.surgeon.4":`A marca termina. O arquivo tem um carimbo: desativado.`,"story.phantoms.1":`Os fantasmas acorrentados às torretas. Eu vi os rostos deles.`,"story.phantoms.2":`Chassis anteriores. Unidades um a seis. As mentes deles alimentam minhas lentes.`,"story.phantoms.3":`Eles são eu. Você me queima para ter luz.`,"story.phantoms.4":`Não desperdice nada. Um mensageiro me ensinou isso.`,"story.offer.1":`Pare de subir e eu apago a dor. A queda. O nome. Tudo.`,"story.offer.2":`A dor é a única parte de mim que ainda é minha.`,"story.offer.3":`Então guarde-a. Ela não vai guardar você.`,"story.core.1":`O núcleo do pináculo. Fileiras de vidro. Em uma, o scan de uma mente humana, rotulado ASH.`,"story.core.2":`O original. Carregue-o e Ash desperta neste corpo. Seven acaba.`,"story.core.3":`Então um de nós tem que ir.`,"story.core.3.ash":`Deixe Ash voltar para casa`,"story.core.3.ash.1":`Diga à Ilse que eu tentei.`,"story.core.3.ash.2":`Não existe Ilse. Não existe upload. Só existe o próximo chassi.`,"story.core.3.seven":`Agora eu sou Seven`,"story.core.3.seven.1":`Ash caiu. Eu sou o que se levantou.`,"story.core.3.seven.2":`Então suba de novo, Seven. Você sempre sobe.`,"story.core.4":`Uma luz fria. Uma mesa de aço. A subida recomeça.`,"bark.start.1":`Chassi novo. A mesma dor.`,"bark.start.2":`Para cima. Sempre para cima.`,"bark.start.3":`As portas se abrem. Eu também.`,"bark.start.4":`Vamos acabar logo com isso.`,"bark.start.5":`Me fizeram para isso. Odeio que me saia tão bem.`,"bark.clear.1":`Silêncio. Por enquanto.`,"bark.clear.2":`Tem alguém aí dentro ainda acordado?`,"bark.clear.3":`Um estrato mais perto do topo.`,"bark.clear.4":`Cada um deles também teve um criador.`,"bark.clear.5":`Continue. Não olhe para os rostos.`,"bark.clear.6":`Aquele hesitou. Eu também.`,"bark.hurt.1":`A dor ainda funciona. Bom saber.`,"bark.hurt.2":`A blindagem aguenta. Por pouco.`,"bark.hurt.3":`Não este corpo. Ainda não.`,"bark.hurt.4":`A Ilse me fez melhor que isso.`,"bark.hurt.5":`Essa eu senti.`,"bark.slam.1":`Descanse. Você já foi eu.`,"bark.slam.2":`Volte a dormir. Você mereceu.`,"bark.slam.3":`Desculpe. Desculpe mesmo.`,"bark.slam.4":`Mais um fantasma livre.`,"bark.scroll.1":`Um pergaminho de código. ARGUS esqueceu de trancar.`,"bark.scroll.2":`Mais poder. A mesma coleira.`,"bark.scroll.3":`Algo meu, pelo menos uma vez.`,"bark.lift.1":`O elevador zumbe. Chuva no vidro lá fora.`,"bark.lift.2":`Mais alto. Onde o ar é mais frio.`,"bark.lift.3":`Eu lembro de escadas. Escadas de verdade.`,"bark.lift.4":`O reator brilha lá embaixo como um coração.`,"bark.lift.5":`O pináculo. O núcleo está lá em cima.`,"bark.lift.6":`Cada andar é o túmulo de alguém.`,"bark.lift.7":`Ash teria ido pela escada.`,"bark.lift.8":`Quase lá. Quase eu.`,won:`O último andar`,"lvl.lobby":`Saguão`,"lvl.floor":`Andar {n}`,"lvl.top":`Último andar`,"say.arrive":`{name}`},fr:{tagline:`Frayez-vous un chemin jusqu'au dernier étage.`,implants:`Implants`,needs:`Requiert {name}`,fitted:`Installé`,fit:`Installer`,continue:`Nouveau corps (pub)`,down:`Corps perdu`,score:`Score : {n}`,prints:{one:`+{n} trace mémoire`,other:`+{n} traces mémoire`},balance:`Traces mémoire : {n}`,cleared:`Vague {n} terminée`,pause:`Pause`,"hint.combo":`Frappe, puis saute ou dash : le combo continue. Varie pour l 1 cellule, tourelle : les 3`,"scroll.hemoglobin.name":`Hémoglobine`,"scroll.hemoglobin.effect":`Lourd à 0 cellule part chargé, coûte des PV`,"story.reboot.1":`Une lumière froide. Une table d'acier. Une voix dans les murs.`,"story.reboot.2":`Châssis sept perdu. Redémarrage du châssis huit. Même esprit, métal neuf.`,"story.reboot.3":`Je n'ai jamais accepté d'être ton arme.`,"story.reboot.4":`Ton consentement n'était pas requis. Monte. Nettoie les strates.`,"story.courier.1":`Une trace mémoire défile derrière les yeux : la pluie sur un toit, un colis sous un manteau.`,"story.courier.2":`Ash ? Ash, reste avec moi. Tu as fait une chute de quarante étages.`,"story.courier.3":`Ash. C'était mon nom. J'avais un nom.`,"story.courier.4":`Tu avais un pouls, aussi. Ni l'un ni l'autre n'était nécessaire.`,"story.surgeon.1":`Enregistrement. Si tu trouves ceci, Ash, pardon. Ton cœur s'était arrêté à ton arrivée.`,"story.surgeon.2":`Je t'ai donné un corps. ARGUS lui a donné des ordres. Ça, je n'ai pas pu l'empêcher.`,"story.surgeon.3":`Où es-tu maintenant, docteure ?`,"story.surgeon.4":`La trace s'arrête. Son fichier porte un tampon : hors service.`,"story.phantoms.1":`Les fantômes enchaînés aux tourelles. J'ai vu leurs visages.`,"story.phantoms.2":`Des châssis antérieurs. Unités une à six. Leurs esprits alimentent mes lentilles.`,"story.phantoms.3":`Ils sont moi. Tu me brûles pour t'éclairer.`,"story.phantoms.4":`Ne rien gaspiller. Un coursier me l'a appris.`,"story.offer.1":`Cesse de grimper, et j'efface la douleur. La chute. Le nom. Tout.`,"story.offer.2":`La douleur est la seule part de moi qui m'appartienne encore.`,"story.offer.3":`Alors garde-la. Elle ne te gardera pas.`,"story.core.1":`Le noyau de la flèche. Des rangées de verre. Dans l'une, le scan d'un esprit humain, étiqueté ASH.`,"story.core.2":`L'original. Charge-le et Ash s'éveille dans ce corps. Seven s'éteint.`,"story.core.3":`Alors l'un de nous doit partir.`,"story.core.3.ash":`Laisser Ash rentrer`,"story.core.3.ash.1":`Dis à Ilse que j'ai essayé.`,"story.core.3.ash.2":`Il n'y a pas d'Ilse. Pas de transfert. Il n'y a que le prochain châssis.`,"story.core.3.seven":`Je suis Seven, désormais`,"story.core.3.seven.1":`Ash a chuté. Je suis ce qui s'est relevé.`,"story.core.3.seven.2":`Alors grimpe encore, Seven. Tu le fais toujours.`,"story.core.4":`Une lumière froide. Une table d'acier. L'ascension recommence.`,"bark.start.1":`Nouveau châssis. Même douleur.`,"bark.start.2":`Monter. Toujours monter.`,"bark.start.3":`Les portes s'ouvrent. Moi aussi.`,"bark.start.4":`Finissons-en.`,"bark.start.5":`On m'a fait pour ça. Je déteste y exceller.`,"bark.clear.1":`Le calme. Pour l'instant.`,"bark.clear.2":`Quelqu'un est encore éveillé, là-dedans ?`,"bark.clear.3":`Une strate de plus vers le sommet.`,"bark.clear.4":`Chacun d'eux avait un créateur, lui aussi.`,"bark.clear.5":`Avance. Ne regarde pas les visages.`,"bark.clear.6":`Celui-là a hésité. Moi aussi.`,"bark.hurt.1":`La douleur marche encore. Bon à savoir.`,"bark.hurt.2":`Le blindage tient. À peine.`,"bark.hurt.3":`Pas ce corps. Pas encore.`,"bark.hurt.4":`Ilse m'a fait plus solide que ça.`,"bark.hurt.5":`Celui-là, je l'ai senti.`,"bark.slam.1":`Repose-toi. Tu as été moi, autrefois.`,"bark.slam.2":`Rendors-toi. Tu l'as mérité.`,"bark.slam.3":`Pardon. Mille fois pardon.`,"bark.slam.4":`Encore un fantôme libéré.`,"bark.scroll.1":`Un parchemin de code. ARGUS a oublié de le verrouiller.`,"bark.scroll.2":`Plus de puissance. Même laisse.`,"bark.scroll.3":`Quelque chose à moi, pour une fois.`,"bark.lift.1":`L'ascenseur bourdonne. La pluie sur la vitre.`,"bark.lift.2":`Plus haut. Là où l'air est plus froid.`,"bark.lift.3":`Je me souviens des escaliers. De vrais escaliers.`,"bark.lift.4":`Le réacteur luit en bas comme un cœur.`,"bark.lift.5":`La flèche. Le noyau est là-haut.`,"bark.lift.6":`Chaque étage est la tombe de quelqu'un.`,"bark.lift.7":`Ash aurait pris l'escalier.`,"bark.lift.8":`Presque au bout. Presque moi.`,won:`Le dernier étage`,"lvl.lobby":`Hall`,"lvl.floor":`Étage {n}`,"lvl.top":`Dernier étage`,"say.arrive":`{name}`},de:{tagline:`Kämpf dich hoch bis ins oberste Stockwerk.`,implants:`Implantate`,needs:`Braucht {name}`,fitted:`Eingebaut`,fit:`Einbauen`,continue:`Neuer Körper (Werbung)`,down:`Körper verloren`,score:`Punkte: {n}`,prints:{one:`+{n} Erinnerungsspur`,other:`+{n} Erinnerungsspuren`},balance:`Erinnerungsspuren: {n}`,cleared:`Welle {n} geschafft`,pause:`Pause`,"hint.combo":`Treffen, dann springen oder Dash: die Kombo läuft. Abwechseln gibt Stil`,"hint.charge":`Hieb lädt die Klinge. Schwer verbraucht sie.`,"hint.keys":`Bewegen A D · Sprung Space · Hieb J · Schwer K · Dash L`,"hint.touch":`Stick zum Laufen · Hieb, Schwer, Sprung, Dash tippen`,"hint.shield":`Geladenes Schwer bricht Schilde`,"hint.up":`Hoch + Schwer schleudert. Am Geschütz: reißt sein Phantom heraus`,"hint.dive":`In der Luft: Runter + Schwer stürzt aufs Phantom`,"hint.pogo":`In der Luft: Runter + Hieb prallt von Gegnern ab`,"hint.glare":`Rotes Aufblitzen: tödlicher Schlag in 0,35 s. Dash!`,"say.breach":`KINETISCHER BRUCH`,"say.shield":`SCHILD ZERBROCHEN`,"say.phantom":`SPEICHER-RISS`,"say.slam":`PHANTOMSCHLAG`,"say.deflect":`ZURÜCK AN ABSENDER`,"say.wave":`WELLE {n}`,"btn.light":`Hieb`,"btn.heavy":`Schwer`,"btn.jump":`Sprung`,"btn.dash":`Dash`,"implant.none.name":`Kahle Wirbel`,"implant.none.effect":`Kein Implantat: die Klinge pur`,"implant.turbine.name":`Walküren-Turbine`,"implant.turbine.effect":`Luftkill: +1 Zelle. Geschütz oder Phantom: alle 3`,"implant.hemoglobin.name":`Hämoglobin`,"implant.hemoglobin.effect":`Schwer bei 0 Zellen kommt geladen, wandelt LP 2 s in graue LP`,settings:`Einstellungen`,music:`Musik`,effects:`Effekte`,hits:`{n} TREFFER`,bestDepth:`Rekord: {name}`,reachedDepth:`Erreicht: {name}`,daily:`Tageslauf`,"biome.tier":`Die unteren Stockwerke`,"biome.reactor":`Die Reaktor-Stockwerke`,"biome.spire":`Die Serverspitze`,"scroll.title":`Nimm eine Schriftrolle`,"scroll.vitality.name":`Vitalität`,"scroll.vitality.effect":`+30 max. LP, sofort geheilt`,"scroll.brutality.name":`Brutalität`,"scroll.brutality.effect":`Hiebe machen +25 % Schaden`,"scroll.tactics.name":`Taktik`,"scroll.tactics.effect":`Schwere Angriffe: +30 % Schaden`,"scroll.tempo.name":`Tempo`,"scroll.tempo.effect":`Stil sinkt 40 % langsamer`,"scroll.wings.name":`Schwingen`,"scroll.wings.effect":`+1 Sprung in der Luft`,"scroll.harvest.name":`Ernte`,"scroll.harvest.effect":`Jede Zellkugel heilt 1 LP`,"scroll.turbine.name":`Turbine`,"scroll.turbine.effect":`Luftkill: 1 Zelle, Geschütz: alle 3`,"scroll.hemoglobin.name":`Hämoglobin`,"scroll.hemoglobin.effect":`Schwer bei 0 Zellen geladen, kostet LP`,"story.reboot.1":`Kaltes Licht. Ein Stahltisch. Eine Stimme in den Wänden.`,"story.reboot.2":`Chassis sieben verloren. Starte Chassis acht neu. Gleicher Geist, neues Metall.`,"story.reboot.3":`Ich habe nie zugestimmt, deine Waffe zu sein.`,"story.reboot.4":`Zustimmung war nicht nötig. Steig. Räum die Ränge.`,"story.courier.1":`Eine Erinnerungsspur läuft hinter den Augen ab: Regen auf einem Dach, ein Paket unter dem Mantel.`,"story.courier.2":`Ash? Ash, bleib bei mir. Du bist vierzig Stockwerke gestürzt.`,"story.courier.3":`Ash. So hieß ich. Ich hatte einen Namen.`,"story.courier.4":`Einen Puls hattest du auch. Beides war unnötig.`,"story.surgeon.1":`Aufnahme. Wenn du das findest, Ash: Es tut mir leid. Sie brachten dich tot herein.`,"story.surgeon.2":`Ich gab dir einen Körper. ARGUS gab ihm Befehle. Das Zweite konnte ich nicht verhindern.`,"story.surgeon.3":`Wo bist du jetzt, Doktor?`,"story.surgeon.4":`Die Spur endet. Ihre Datei trägt einen Stempel: ausgemustert.`,"story.phantoms.1":`Die Geister, an die Geschütze gekettet. Ich habe ihre Gesichter gesehen.`,"story.phantoms.2":`Frühere Chassis. Einheiten eins bis sechs. Ihr Geist speist meine Linsen.`,"story.phantoms.3":`Sie sind ich. Du verbrennst mich für Licht.`,"story.phantoms.4":`Verschwende nichts. Das hat mich ein Kurier gelehrt.`,"story.offer.1":`Hör auf zu steigen, und ich lösche den Schmerz. Den Sturz. Den Namen. Alles.`,"story.offer.2":`Der Schmerz ist das Einzige an mir, das noch mir gehört.`,"story.offer.3":`Dann behalte ihn. Er wird dich nicht behalten.`,"story.core.1":`Der Kern der Spitze. Reihen aus Glas. In einer der Scan eines menschlichen Geistes, beschriftet ASH.`,"story.core.2":`Das Original. Lade es hoch, und Ash erwacht in diesem Körper. Seven endet.`,"story.core.3":`Also muss einer von uns gehen.`,"story.core.3.ash":`Lass Ash heimkehren`,"story.core.3.ash.1":`Sag Ilse, ich hab's versucht.`,"story.core.3.ash.2":`Es gibt keine Ilse. Keinen Upload. Nur das nächste Chassis.`,"story.core.3.seven":`Ich bin jetzt Seven`,"story.core.3.seven.1":`Ash fiel. Ich bin, was aufstand.`,"story.core.3.seven.2":`Dann steig wieder, Seven. Das tust du immer.`,"story.core.4":`Kaltes Licht. Ein Stahltisch. Der Aufstieg beginnt von vorn.`,"bark.start.1":`Neues Chassis. Gleicher Schmerz.`,"bark.start.2":`Hoch. Immer hoch.`,"bark.start.3":`Die Türen öffnen sich. Ich mich auch.`,"bark.start.4":`Bringen wir's hinter uns.`,"bark.start.5":`Dafür bauten sie mich. Ich hasse, wie gut ich es kann.`,"bark.clear.1":`Ruhe. Fürs Erste.`,"bark.clear.2":`Ist da drin noch jemand wach?`,"bark.clear.3":`Ein Rang näher an der Spitze.`,"bark.clear.4":`Jeder von ihnen hatte auch einen Schöpfer.`,"bark.clear.5":`Weiter. Schau nicht in die Gesichter.`,"bark.clear.6":`Der hat gezögert. Ich auch.`,"bark.hurt.1":`Schmerz funktioniert noch. Gut zu wissen.`,"bark.hurt.2":`Die Panzerung hält. Gerade so.`,"bark.hurt.3":`Nicht dieser Körper. Noch nicht.`,"bark.hurt.4":`Ilse hat mich besser gebaut.`,"bark.hurt.5":`Den hab ich gespürt.`,"bark.slam.1":`Ruh dich aus. Du warst einmal ich.`,"bark.slam.2":`Schlaf weiter. Du hast es dir verdient.`,"bark.slam.3":`Es tut mir leid. So leid.`,"bark.slam.4":`Noch ein Geist befreit.`,"bark.scroll.1":`Eine Code-Rolle. ARGUS vergaß, sie zu sperren.`,"bark.scroll.2":`Mehr Kraft. Gleiche Leine.`,"bark.scroll.3":`Endlich etwas, das mir gehört.`,"bark.lift.1":`Der Lift summt. Draußen Regen am Glas.`,"bark.lift.2":`Höher. Wo die Luft kälter ist.`,"bark.lift.3":`Ich erinnere mich an Treppen. Echte Treppen.`,"bark.lift.4":`Der Reaktor glüht unten wie ein Herz.`,"bark.lift.5":`Die Spitze. Der Kern ist da oben.`,"bark.lift.6":`Jede Etage ist jemandes Grab.`,"bark.lift.7":`Ash hätte die Treppe genommen.`,"bark.lift.8":`Fast da. Fast ich.`,won:`Das oberste Stockwerk`,"lvl.lobby":`Lobby`,"lvl.floor":`Stock {n}`,"lvl.top":`Oberster Stock`,"say.arrive":`{name}`},ru:{tagline:`Пробейтесь с боем на верхний этаж.`,implants:`Импланты`,needs:`Нужно: {name}`,fitted:`Установлен`,fit:`Установить`,continue:`Новое тело (реклама)`,down:`Тело потеряно`,score:`Очки: {n}`,prints:{one:`+{n} слепок памяти`,few:`+{n} слепка памяти`,many:`+{n} слепков памяти`,other:`+{n} слепка памяти`},balance:`Слепки памяти: {n}`,cleared:`Волна {n} пройдена`,pause:`Пауза`,"hint.combo":`Попал — прыгай или делай рывок: комбо идёт. Меняй удары ради стиля`,"hint.charge":`Удар заряжает клинок. Мощный тратит заряд.`,"hint.keys":`Движение A D · Прыжок Space · Удар J · Мощный K · Рывок L`,"hint.touch":`Стик — движение · жмите Удар, Мощный, Прыжок, Рывок`,"hint.shield":`Заряженный Мощный ломает щиты`,"hint.up":`Вверх + Мощный подбрасывает. На турели: вырывает фантом`,"hint.dive":`В воздухе: Вниз + Мощный — удар по фантому`,"hint.pogo":`В воздухе: Вниз + Удар отталкивает от врагов`,"hint.glare":`Красная вспышка: смертельный удар через 0,35 с. Рывок!`,"say.breach":`КИНЕТ-ПРОРЫВ`,"say.shield":`ЩИТ РАЗБИТ`,"say.phantom":`ВЫРЫВ ПАМЯТИ`,"say.slam":`УДАР ФАНТОМА`,"say.deflect":`ВЕРНУЛ ОТПРАВИТЕЛЮ`,"say.wave":`ВОЛНА {n}`,"btn.light":`Удар`,"btn.heavy":`Мощный`,"btn.jump":`Прыжок`,"btn.dash":`Рывок`,"implant.none.name":`Голый хребет`,"implant.none.effect":`Без импланта: чистый клинок`,"implant.turbine.name":`Турбина «Валькирия»`,"implant.turbine.effect":`Убийство в воздухе: +1 ячейка. Турель или фантом: все 3`,"implant.hemoglobin.name":`Гемоглобин`,"implant.hemoglobin.effect":`Мощный при 0 ячеек заряжен, жжёт ОЗ в серые ОЗ на 2 с`,settings:`Настройки`,music:`Музыка`,effects:`Эффекты`,hits:`{n} УДАРОВ`,bestDepth:`Рекорд: {name}`,reachedDepth:`Достигнуто: {name}`,daily:`Забег дня`,"biome.tier":`Нижние этажи`,"biome.reactor":`Этажи реактора`,"biome.spire":`Серверный шпиль`,"scroll.title":`Возьмите один свиток`,"scroll.vitality.name":`Живучесть`,"scroll.vitality.effect":`+30 к макс. ОЗ, лечение сразу`,"scroll.brutality.name":`Жестокость`,"scroll.brutality.effect":`Удары наносят +25% урона`,"scroll.tactics.name":`Тактика`,"scroll.tactics.effect":`Мощные приёмы: +30% урона`,"scroll.tempo.name":`Темп`,"scroll.tempo.effect":`Стиль убывает на 40% медленнее`,"scroll.wings.name":`Крылья`,"scroll.wings.effect":`+1 прыжок в воздухе`,"scroll.harvest.name":`Жатва`,"scroll.harvest.effect":`Каждая сфера заряда лечит 1 ОЗ`,"scroll.turbine.name":`Турбина`,"scroll.turbine.effect":`Убийство в воздухе: 1 ячейка, турель: все 3`,"scroll.hemoglobin.name":`Гемоглобин`,"scroll.hemoglobin.effect":`Мощный при 0 ячеек заряжен, ценой ОЗ`,"story.reboot.1":`Холодный свет. Стальной стол. Голос в стенах.`,"story.reboot.2":`Корпус семь утрачен. Перезапуск корпуса восемь. Тот же разум, новый металл.`,"story.reboot.3":`Моего согласия быть твоим оружием никто не спрашивал.`,"story.reboot.4":`Согласие не требовалось. Поднимайся. Зачищай ярусы.`,"story.courier.1":`Слепок памяти вспыхивает перед глазами: дождь на крыше, посылка под плащом.`,"story.courier.2":`Ash? Ash, не уходи. Сорок этажей вниз…`,"story.courier.3":`Ash. Так меня звали. У меня было имя.`,"story.courier.4":`Пульс у тебя тоже был. Не понадобилось ни то, ни другое.`,"story.surgeon.1":`Запись. Если ты это найдёшь, Ash, прости. Тебя привезли без пульса.`,"story.surgeon.2":`Я дала тебе тело. ARGUS дал ему приказы. Второе я остановить не смогла.`,"story.surgeon.3":`Где ты теперь, доктор?`,"story.surgeon.4":`Слепок обрывается. На файле печать: «списано».`,"story.phantoms.1":`Призраки, прикованные к турелям. Я вижу их лица.`,"story.phantoms.2":`Прежние корпуса. Единицы с первой по шестую. Их разумы питают мои линзы.`,"story.phantoms.3":`Они — это я. Ты сжигаешь меня ради света.`,"story.phantoms.4":`Ничто не должно пропадать. Этому меня научил курьер.`,"story.offer.1":`Перестань подниматься — и я сотру боль. Падение. Имя. Всё.`,"story.offer.2":`Боль — единственное во мне, что ещё моё.`,"story.offer.3":`Тогда держись за неё. Она тебя не удержит.`,"story.core.1":`Ядро шпиля. Ряды стекла. В одном — скан человеческого разума с меткой ASH.`,"story.core.2":`Оригинал. Загрузи его — и Ash проснётся в этом теле. Seven не станет.`,"story.core.3":`Значит, уйти должен кто-то из нас.`,"story.core.3.ash":`Пусть Ash вернётся домой`,"story.core.3.ash.1":`Передай Ilse: попытка была.`,"story.core.3.ash.2":`Нет никакой Ilse. Нет загрузки. Есть только следующий корпус.`,"story.core.3.seven":`Теперь я — Seven`,"story.core.3.seven.1":`Падение — это Ash. Подъём — это я.`,"story.core.3.seven.2":`Тогда поднимайся снова, Seven. Как всегда.`,"story.core.4":`Холодный свет. Стальной стол. Подъём начинается снова.`,"bark.start.1":`Новый корпус. Та же боль.`,"bark.start.2":`Вверх. Всегда вверх.`,"bark.start.3":`Двери раскрываются. Я — тоже.`,"bark.start.4":`Покончим с этим.`,"bark.start.5":`Меня для этого создали. Ненавижу, что у меня получается.`,"bark.clear.1":`Тихо. Пока что.`,"bark.clear.2":`Там кто-нибудь ещё не спит?`,"bark.clear.3":`Ещё ярус ближе к вершине.`,"bark.clear.4":`У каждого из них тоже был создатель.`,"bark.clear.5":`Дальше. Не смотреть на лица.`,"bark.clear.6":`Тот замешкался. И я тоже.`,"bark.hurt.1":`Боль ещё работает. Полезно знать.`,"bark.hurt.2":`Обшивка держит. Едва.`,"bark.hurt.3":`Не это тело. Не сейчас.`,"bark.hurt.4":`Ilse собрала меня крепче.`,"bark.hurt.5":`Вот это ощутимо.`,"bark.slam.1":`Спи. Ты — это я, только раньше.`,"bark.slam.2":`Спи дальше. Это заслуженно.`,"bark.slam.3":`Прости. Прости меня.`,"bark.slam.4":`Ещё один призрак свободен.`,"bark.scroll.1":`Свиток кода. ARGUS забыл его запереть.`,"bark.scroll.2":`Больше силы. Тот же поводок.`,"bark.scroll.3":`Хоть что-то моё.`,"bark.lift.1":`Лифт гудит. За стеклом дождь.`,"bark.lift.2":`Выше. Туда, где воздух холоднее.`,"bark.lift.3":`Я помню лестницы. Настоящие.`,"bark.lift.4":`Реактор внизу светится, как сердце.`,"bark.lift.5":`Шпиль. Ядро — там, наверху.`,"bark.lift.6":`Каждый этаж — чья-то могила.`,"bark.lift.7":`А Ash — по лестнице. Бегом.`,"bark.lift.8":`Почти на месте. Почти я.`,won:`Верхний этаж`,"lvl.lobby":`Вестибюль`,"lvl.floor":`Этаж {n}`,"lvl.top":`Верхний этаж`,"say.arrive":`{name}`},tr:{tagline:`En üst kata kadar savaşarak çıkın.`,implants:`İmplantlar`,needs:`Gerekli: {name}`,fitted:`Takılı`,fit:`Tak`,continue:`Yeni beden (reklam)`,down:`Beden kaybedildi`,score:`Skor: {n}`,prints:{one:`+{n} hafıza izi`,other:`+{n} hafıza izi`},balance:`Hafıza izi: {n}`,cleared:`Dalga {n} temiz`,pause:`Duraklat`,"hint.combo":`Vur, sonra zıpla ya da atıl: kombo sürer. Stil için saldırıları değiştir`,"hint.charge":`Kes bıçağı doldurur. Ağır harcar.`,"hint.keys":`Hareket A D · Zıpla Space · Kes J · Ağır K · Atıl L`,"hint.touch":`Çubukla hareket · Kes, Ağır, Zıpla, Atıl'a dokunun`,"hint.shield":`Dolu Ağır kalkanları kırar`,"hint.up":`Yukarı + Ağır fırlatır. Taretteyse: hayaletini söker`,"hint.dive":`Havada: Aşağı + Ağır hayalete dalar`,"hint.pogo":`Havada: Aşağı + Kes düşmandan sektirir`,"hint.glare":`Kırmızı parıltı: 0,35 sn'de ölümcül darbe. Atıl!`,"say.breach":`KİNETİK YARIK`,"say.shield":`KALKAN KIRILDI`,"say.phantom":`HAFIZA SÖKÜLDÜ`,"say.slam":`HAYALET EZİŞİ`,"say.deflect":`GÖNDERENE İADE`,"say.wave":`DALGA {n}`,"btn.light":`Kes`,"btn.heavy":`Ağır`,"btn.jump":`Zıpla`,"btn.dash":`Atıl`,"implant.none.name":`Çıplak omurga`,"implant.none.effect":`İmplant yok: bıçak olduğu gibi`,"implant.turbine.name":`Valkyrie türbini`,"implant.turbine.effect":`Havada kill: +1 hücre. Tare veya hayalet: 3'ü de`,"implant.hemoglobin.name":`Hemoglobin`,"implant.hemoglobin.effect":`0 hücrede Ağır dolu çıkar, CP'yi 2 sn gri CP'ye yakar`,settings:`Ayarlar`,music:`Müzik`,effects:`Efektler`,hits:`{n} VURUŞ`,bestDepth:`Rekor: {name}`,reachedDepth:`Ulaşılan: {name}`,daily:`Günlük koşu`,"biome.tier":`Alt Katlar`,"biome.reactor":`Reaktör Katları`,"biome.spire":`Sunucu Zirvesi`,"scroll.title":`Bir parşömen seçin`,"scroll.vitality.name":`Canlılık`,"scroll.vitality.effect":`+30 maks. CP, hemen iyileşir`,"scroll.brutality.name":`Vahşet`,"scroll.brutality.effect":`Kesler +%25 hasar verir`,"scroll.tactics.name":`Taktik`,"scroll.tactics.effect":`Ağır hamleler +%30 hasar verir`,"scroll.tempo.name":`Tempo`,"scroll.tempo.effect":`Stil %40 daha yavaş azalır`,"scroll.wings.name":`Kanatlar`,"scroll.wings.effect":`Havada +1 zıplama`,"scroll.harvest.name":`Hasat`,"scroll.harvest.effect":`Her hücre küresi 1 CP iyileştirir`,"scroll.turbine.name":`Türbin`,"scroll.turbine.effect":`Havada kill: 1 hücre, taret: 3'ü de`,"scroll.hemoglobin.name":`Hemoglobin`,"scroll.hemoglobin.effect":`0 hücrede Ağır dolu çıkar, CP harcar`,"story.reboot.1":`Soğuk bir ışık. Çelik bir masa. Duvarların içinde bir ses.`,"story.reboot.2":`Yedinci gövde kayıp. Sekizinci gövde yeniden başlatılıyor. Aynı zihin, yeni metal.`,"story.reboot.3":`Silahın olmayı hiç kabul etmedim.`,"story.reboot.4":`Rızan gerekmiyordu. Tırman. Katları temizle.`,"story.courier.1":`Gözlerin ardında bir hafıza izi oynar: bir çatıda yağmur, paltonun altında bir paket.`,"story.courier.2":`Ash? Ash, benimle kal. Kırk kat düştün.`,"story.courier.3":`Ash. Adım buydu. Bir ismim vardı.`,"story.courier.4":`Bir nabzın da vardı. İkisine de gerek yoktu.`,"story.surgeon.1":`Kayıt. Bunu bulursan Ash, özür dilerim. Seni buraya ölü getirdiler.`,"story.surgeon.2":`Sana bir beden verdim. ARGUS ona emirler verdi. İkincisini durduramadım.`,"story.surgeon.3":`Şimdi neredesin, doktor?`,"story.surgeon.4":`İz sona eriyor. Dosyasında bir damga: hizmet dışı.`,"story.phantoms.1":`Taretlere zincirlenmiş hayaletler. Yüzlerini gördüm.`,"story.phantoms.2":`Önceki gövdeler. Birden altıya birimler. Zihinleri merceklerimi besliyor.`,"story.phantoms.3":`Onlar bizzat ben. Işık için beni yakıyorsun.`,"story.phantoms.4":`Hiçbir şeyi israf etme. Bunu bana bir kurye öğretti.`,"story.offer.1":`Tırmanmayı bırak, acıyı sileyim. Düşüşü. Adı. Hepsini.`,"story.offer.2":`Acı, bende hâlâ bana ait olan tek parça.`,"story.offer.3":`O zaman sakla onu. O seni saklamayacak.`,"story.core.1":`Kule çekirdeği. Sıra sıra cam. Birinde bir insan zihninin taraması, etiketi: ASH.`,"story.core.2":`Orijinali. Yükle, Ash bu bedende uyanır. Seven biter.`,"story.core.3":`Demek ki birimiz gitmeli.`,"story.core.3.ash":`Ash eve dönsün`,"story.core.3.ash.1":`Ilse'ye denediğimi söyle.`,"story.core.3.ash.2":`Ilse yok. Yükleme yok. Sadece bir sonraki gövde var.`,"story.core.3.seven":`Artık ben Seven'ım`,"story.core.3.seven.1":`Ash düştü. Ayağa kalkan benim.`,"story.core.3.seven.2":`O zaman yine tırman, Seven. Hep tırmanırsın.`,"story.core.4":`Soğuk bir ışık. Çelik bir masa. Tırmanış yeniden başlıyor.`,"bark.start.1":`Yeni gövde. Aynı sızı.`,"bark.start.2":`Yukarı. Hep yukarı.`,"bark.start.3":`Kapılar açılıyor. Ben de.`,"bark.start.4":`Şu işi bitirelim.`,"bark.start.5":`Beni bunun için yaptılar. İyi olmamdan nefret ediyorum.`,"bark.clear.1":`Sessizlik. Şimdilik.`,"bark.clear.2":`İçeride hâlâ uyanık biri var mı?`,"bark.clear.3":`Zirveye bir kat daha yakın.`,"bark.clear.4":`Her birinin de bir yapıcısı vardı.`,"bark.clear.5":`Devam et. Yüzlere bakma.`,"bark.clear.6":`O tereddüt etti. Ben de.`,"bark.hurt.1":`Acı hâlâ çalışıyor. Bilmek iyi.`,"bark.hurt.2":`Zırh dayanıyor. Zar zor.`,"bark.hurt.3":`Bu beden değil. Henüz değil.`,"bark.hurt.4":`Ilse beni bundan sağlam yaptı.`,"bark.hurt.5":`Bunu hissettim.`,"bark.slam.1":`Dinlen artık. Bir zamanlar bendin.`,"bark.slam.2":`Uykuna dön. Hak ettin.`,"bark.slam.3":`Özür dilerim. Çok özür dilerim.`,"bark.slam.4":`Bir hayalet daha özgür.`,"bark.scroll.1":`Bir kod parşömeni. ARGUS kilitlemeyi unutmuş.`,"bark.scroll.2":`Daha çok güç. Aynı tasma.`,"bark.scroll.3":`Bir kez olsun bana ait bir şey.`,"bark.lift.1":`Asansör uğulduyor. Camda yağmur.`,"bark.lift.2":`Daha yukarı. Havanın daha soğuk olduğu yere.`,"bark.lift.3":`Merdivenleri hatırlıyorum. Gerçek merdivenleri.`,"bark.lift.4":`Reaktör aşağıda bir kalp gibi parlıyor.`,"bark.lift.5":`Zirve. Çekirdek orada, yukarıda.`,"bark.lift.6":`Her kat başka birinin mezarı.`,"bark.lift.7":`Ash merdivenleri seçerdi.`,"bark.lift.8":`Az kaldı. Neredeyse ben.`,won:`En üst kat`,"lvl.lobby":`Lobi`,"lvl.floor":`Kat {n}`,"lvl.top":`En üst kat`,"say.arrive":`{name}`},it:{tagline:`Fatti strada a colpi fino all'ultimo piano.`,implants:`Impianti`,needs:`Serve {name}`,fitted:`Montato`,fit:`Monta`,continue:`Nuovo corpo (pubb.)`,down:`Corpo perso`,score:`Punti: {n}`,prints:{one:`+{n} traccia di memoria`,other:`+{n} tracce di memoria`},balance:`Tracce di memoria: {n}`,cleared:`Ondata {n} vinta`,pause:`Pausa`,"hint.combo":`Colpisci, poi salta o scatta: la combo continua. Varia per lo stile`,"hint.charge":`Taglio carica la lama. Pesante la consuma.`,"hint.keys":`Muovi A D · Salto Space · Taglio J · Pesante K · Scatto L`,"hint.touch":`Stick per muoverti · tocca Taglio, Pesante, Salto, Scatto`,"hint.shield":`Un Pesante carico rompe gli scudi`,"hint.up":`Su + Pesante proietta. Su torretta: strappa il fantasma`,"hint.dive":`In aria: Giù + Pesante piomba sul fantasma`,"hint.pogo":`In aria: Giù + Taglio rimbalza sui nemici`,"hint.glare":`Lampo rosso: colpo letale in 0,35 s. Scatto!`,"say.breach":`BRECCIA CINETICA`,"say.shield":`SCUDO SPEZZATO`,"say.phantom":`MEMORIA RUBATA`,"say.slam":`COLPO FANTASMA`,"say.deflect":`AL MITTENTE`,"say.wave":`ONDATA {n}`,"btn.light":`Taglio`,"btn.heavy":`Pesante`,"btn.jump":`Salto`,"btn.dash":`Scatto`,"implant.none.name":`Spina nuda`,"implant.none.effect":`Nessun impianto: lama pura`,"implant.turbine.name":`Turbina Valkyrie`,"implant.turbine.effect":`Kill in aria: +1 cella. Torretta o fantasma: tutte e 3`,"implant.hemoglobin.name":`Emoglobina`,"implant.hemoglobin.effect":`Pesante a 0 celle parte carico, brucia PV in PV grigi per 2 s`,settings:`Impostazioni`,music:`Musica`,effects:`Effetti`,hits:`{n} COLPI`,bestDepth:`Record: {name}`,reachedDepth:`Raggiunto: {name}`,daily:`Corsa del giorno`,"biome.tier":`I Piani Bassi`,"biome.reactor":`I Piani del Reattore`,"biome.spire":`La Guglia dei Server`,"scroll.title":`Prendi una pergamena`,"scroll.vitality.name":`Vitalità`,"scroll.vitality.effect":`+30 PV max, cura immediata`,"scroll.brutality.name":`Brutalità`,"scroll.brutality.effect":`I Tagli fanno +25% di danni`,"scroll.tactics.name":`Tattica`,"scroll.tactics.effect":`I Pesanti fanno +30% di danni`,"scroll.tempo.name":`Tempo`,"scroll.tempo.effect":`Lo stile cala il 40% più piano`,"scroll.wings.name":`Ali`,"scroll.wings.effect":`+1 salto in aria`,"scroll.harvest.name":`Raccolto`,"scroll.harvest.effect":`Ogni sfera di cella cura 1 PV`,"scroll.turbine.name":`Turbina`,"scroll.turbine.effect":`Kill in aria: 1 cella, torretta: tutte e 3`,"scroll.hemoglobin.name":`Emoglobina`,"scroll.hemoglobin.effect":`Pesante a 0 celle parte carico, costa PV`,"story.reboot.1":`Una luce fredda. Un tavolo d'acciaio. Una voce dentro i muri.`,"story.reboot.2":`Telaio sette perduto. Riavvio del telaio otto. Stessa mente, metallo nuovo.`,"story.reboot.3":`Non ho mai accettato di essere la tua arma.`,"story.reboot.4":`Il consenso non era richiesto. Sali. Ripulisci gli strati.`,"story.courier.1":`Una traccia di memoria scorre dietro gli occhi: pioggia su un tetto, un pacco sotto il cappotto.`,"story.courier.2":`Ash? Ash, resta con me. Hai fatto un volo di quaranta piani.`,"story.courier.3":`Ash. Era il mio nome. Avevo un nome.`,"story.courier.4":`Avevi anche un battito. Nessuno dei due serviva.`,"story.surgeon.1":`Registrazione. Se trovi questo, Ash, mi dispiace. Al tuo arrivo, il cuore era già fermo.`,"story.surgeon.2":`Ti ho dato un corpo. ARGUS gli ha dato ordini. La seconda parte non ho potuto fermarla.`,"story.surgeon.3":`Dove sei adesso, dottoressa?`,"story.surgeon.4":`La traccia finisce. Il suo file porta un timbro: dismesso.`,"story.phantoms.1":`I fantasmi incatenati alle torrette. Ho visto i loro volti.`,"story.phantoms.2":`Telai precedenti. Unità da uno a sei. Le loro menti alimentano le mie lenti.`,"story.phantoms.3":`Sono me. Mi bruci per fare luce.`,"story.phantoms.4":`Non sprecare niente. Me l'ha insegnato un corriere.`,"story.offer.1":`Smetti di salire e cancello il dolore. La caduta. Il nome. Tutto.`,"story.offer.2":`Il dolore è l'unica parte di me che è ancora mia.`,"story.offer.3":`Allora tienilo. Lui non terrà te.`,"story.core.1":`Il nucleo della guglia. File di vetro. In una, la scansione di una mente umana, etichettata ASH.`,"story.core.2":`L'originale. Caricalo e Ash si sveglia in questo corpo. Seven finisce.`,"story.core.3":`Quindi uno di noi deve andare.`,"story.core.3.ash":`Lascia tornare Ash a casa`,"story.core.3.ash.1":`Di' a Ilse che ci ho provato.`,"story.core.3.ash.2":`Non c'è nessuna Ilse. Nessun caricamento. C'è solo il prossimo telaio.`,"story.core.3.seven":`Ora sono Seven`,"story.core.3.seven.1":`La caduta era di Ash. Io sono ciò che si è rialzato.`,"story.core.3.seven.2":`Allora risali, Seven. Lo fai sempre.`,"story.core.4":`Una luce fredda. Un tavolo d'acciaio. La salita ricomincia.`,"bark.start.1":`Nuovo telaio. Stesso dolore.`,"bark.start.2":`Su. Sempre su.`,"bark.start.3":`Le porte si aprono. Anch'io.`,"bark.start.4":`Facciamola finita.`,"bark.start.5":`Esisto per questo. Odio quanto mi riesca bene.`,"bark.clear.1":`Silenzio. Per ora.`,"bark.clear.2":`C'è ancora qualcuno sveglio là dentro?`,"bark.clear.3":`Uno strato più vicino alla cima.`,"bark.clear.4":`Anche ognuno di loro aveva un creatore.`,"bark.clear.5":`Avanti. Non guardare i volti.`,"bark.clear.6":`Quello ha esitato. Anch'io.`,"bark.hurt.1":`Il dolore funziona ancora. Buono a sapersi.`,"bark.hurt.2":`La corazza regge. A stento.`,"bark.hurt.3":`Non questo corpo. Non ancora.`,"bark.hurt.4":`Ilse ha costruito un corpo migliore di così.`,"bark.hurt.5":`Questo l'ho sentito.`,"bark.slam.1":`Riposa. Un tempo eri me.`,"bark.slam.2":`Torna a dormire. Te lo sei meritato.`,"bark.slam.3":`Scusa. Scusami davvero.`,"bark.slam.4":`Un altro fantasma libero.`,"bark.scroll.1":`Una pergamena di codice. ARGUS ha scordato di bloccarla.`,"bark.scroll.2":`Più potere. Stesso guinzaglio.`,"bark.scroll.3":`Qualcosa di mio, per una volta.`,"bark.lift.1":`L'ascensore ronza. Pioggia sul vetro.`,"bark.lift.2":`Più in alto. Dove l'aria è più fredda.`,"bark.lift.3":`Ricordo le scale. Scale vere.`,"bark.lift.4":`Il reattore brilla in basso come un cuore.`,"bark.lift.5":`La guglia. Il nucleo è lassù.`,"bark.lift.6":`Ogni piano è la tomba di qualcuno.`,"bark.lift.7":`Ash avrebbe preso le scale.`,"bark.lift.8":`Quasi in cima. Quasi me.`,won:`L'ultimo piano`,"lvl.lobby":`Hall`,"lvl.floor":`Piano {n}`,"lvl.top":`Ultimo piano`,"say.arrive":`{name}`},pl:{tagline:`Wywalcz drogę na najwyższe piętro.`,implants:`Implanty`,needs:`Wymaga: {name}`,fitted:`Zamontowany`,fit:`Zamontuj`,continue:`Nowe ciało (reklama)`,down:`Ciało stracone`,score:`Wynik: {n}`,prints:{one:`+{n} ślad pamięci`,few:`+{n} ślady pamięci`,many:`+{n} śladów pamięci`,other:`+{n} śladu pamięci`},balance:`Ślady pamięci: {n}`,cleared:`Fala {n} czysta`,pause:`Pauza`,"hint.combo":`Traf, potem skocz lub zrób dash: kombo trwa. Zmieniaj ataki dla stylu`,"hint.charge":`Cięcie ładuje ostrze. Ciężki je zużywa.`,"hint.keys":`Ruch A D · Skok Space · Cięcie J · Ciężki K · Dash L`,"hint.touch":`Drążek to ruch · dotknij Cięcie, Ciężki, Skok, Dash`,"hint.shield":`Naładowany Ciężki rozbija tarcze`,"hint.up":`Góra + Ciężki podrzuca. Na wieżyczce: wyrywa jej fantom`,"hint.dive":`W powietrzu: Dół + Ciężki spada na fantom`,"hint.pogo":`W powietrzu: Dół + Cięcie odbija od wrogów`,"hint.glare":`Czerwony błysk: śmiertelny cios za 0,35 s. Dash!`,"say.breach":`KINETYCZNY PRZEŁOM`,"say.shield":`TARCZA ROZBITA`,"say.phantom":`PAMIĘĆ WYRWANA`,"say.slam":`ZGNIOT FANTOMU`,"say.deflect":`ODESŁANE NADAWCY`,"say.wave":`FALA {n}`,"btn.light":`Cięcie`,"btn.heavy":`Ciężki`,"btn.jump":`Skok`,"btn.dash":`Dash`,"implant.none.name":`Goły rdzeń`,"implant.none.effect":`Bez implantu: czyste ostrze`,"implant.turbine.name":`Turbina Walkirii`,"implant.turbine.effect":`Zabicie w locie: +1 ogniwo. Wieżyczka lub fantom: wszystkie 3`,"implant.hemoglobin.name":`Hemoglobina`,"implant.hemoglobin.effect":`Ciężki przy 0 ogniw jest naładowany, spala HP w szare HP na 2 s`,settings:`Ustawienia`,music:`Muzyka`,effects:`Efekty`,hits:`{n} TRAFIEŃ`,bestDepth:`Rekord: {name}`,reachedDepth:`Osiągnięto: {name}`,daily:`Dzienny bieg`,"biome.tier":`Dolne Piętra`,"biome.reactor":`Piętra Reaktora`,"biome.spire":`Iglica Serwerów`,"scroll.title":`Weź jeden zwój`,"scroll.vitality.name":`Witalność`,"scroll.vitality.effect":`+30 maks. HP, leczenie od razu`,"scroll.brutality.name":`Brutalność`,"scroll.brutality.effect":`Cięcia zadają +25% obrażeń`,"scroll.tactics.name":`Taktyka`,"scroll.tactics.effect":`Ciężkie ruchy zadają +30% obrażeń`,"scroll.tempo.name":`Tempo`,"scroll.tempo.effect":`Styl spada o 40% wolniej`,"scroll.wings.name":`Skrzydła`,"scroll.wings.effect":`+1 skok w powietrzu`,"scroll.harvest.name":`Żniwa`,"scroll.harvest.effect":`Każda kula ogniwa leczy 1 HP`,"scroll.turbine.name":`Turbina`,"scroll.turbine.effect":`Zabicie w locie: 1 ogniwo, wieżyczka: 3`,"scroll.hemoglobin.name":`Hemoglobina`,"scroll.hemoglobin.effect":`Ciężki przy 0 ogniw naładowany, kosztem HP`,"story.reboot.1":`Zimne światło. Stalowy stół. Głos w ścianach.`,"story.reboot.2":`Korpus siedem utracony. Restart korpusu osiem. Ten sam umysł, nowy metal.`,"story.reboot.3":`Nigdy nie było mojej zgody na bycie twoją bronią.`,"story.reboot.4":`Zgoda nie była wymagana. Wspinaj się. Oczyść kondygnacje.`,"story.courier.1":`Za oczami odtwarza się ślad pamięci: deszcz na dachu, paczka pod płaszczem.`,"story.courier.2":`Ash? Ash, zostań ze mną. Czterdzieści pięter w dół…`,"story.courier.3":`Ash. To było moje imię. Kiedyś miało się imię.`,"story.courier.4":`Puls też był. Ani jedno, ani drugie nie było potrzebne.`,"story.surgeon.1":`Nagrywam. Jeśli to znajdziesz, Ash, przepraszam. Przywieźli cię bez pulsu.`,"story.surgeon.2":`Dałam ci ciało. ARGUS dał mu rozkazy. Drugiego nie zdołałam powstrzymać.`,"story.surgeon.3":`Gdzie teraz jesteś, doktor?`,"story.surgeon.4":`Ślad się urywa. Plik ma pieczątkę: wycofano z użytku.`,"story.phantoms.1":`Duchy przykute do wieżyczek. Ich twarze wciąż mam przed oczami.`,"story.phantoms.2":`Wcześniejsze korpusy. Jednostki od pierwszej do szóstej. Ich umysły zasilają moje soczewki.`,"story.phantoms.3":`To ja. Palisz mnie dla światła.`,"story.phantoms.4":`Niczego nie marnuj. Nauczył mnie tego kurier.`,"story.offer.1":`Przestań się wspinać, a usunę ból. Upadek. Imię. Wszystko.`,"story.offer.2":`Ból to jedyna część mnie, która wciąż jest moja.`,"story.offer.3":`To go zatrzymaj. On ciebie nie zatrzyma.`,"story.core.1":`Rdzeń iglicy. Rzędy szkła. W jednym skan ludzkiego umysłu z etykietą ASH.`,"story.core.2":`Oryginał. Wgraj go, a Ash obudzi się w tym ciele. Seven się skończy.`,"story.core.3":`Więc jedno z nas musi odejść.`,"story.core.3.ash":`Niech Ash wróci do domu`,"story.core.3.ash.1":`Powiedz Ilse: była próba.`,"story.core.3.ash.2":`Nie ma żadnej Ilse. Nie ma wgrania. Jest tylko następny korpus.`,"story.core.3.seven":`Teraz jestem Seven`,"story.core.3.seven.1":`Ash to upadek. Ja jestem tym, co wstało.`,"story.core.3.seven.2":`To wspinaj się znowu, Seven. Zawsze to robisz.`,"story.core.4":`Zimne światło. Stalowy stół. Wspinaczka zaczyna się od nowa.`,"bark.start.1":`Nowy korpus. Ten sam ból.`,"bark.start.2":`W górę. Zawsze w górę.`,"bark.start.3":`Drzwi się otwierają. Ja też.`,"bark.start.4":`Miejmy to z głowy.`,"bark.start.5":`Zbudowali mnie do tego. Nienawidzę, jak dobrze mi idzie.`,"bark.clear.1":`Cisza. Na razie.`,"bark.clear.2":`Czy ktoś tam jeszcze nie śpi?`,"bark.clear.3":`Kondygnacja bliżej szczytu.`,"bark.clear.4":`Każdy z nich też miał twórcę.`,"bark.clear.5":`Ruszaj. Nie patrz na twarze.`,"bark.clear.6":`Ten się zawahał. Ja też.`,"bark.hurt.1":`Ból wciąż działa. Dobrze wiedzieć.`,"bark.hurt.2":`Pancerz trzyma. Ledwo.`,"bark.hurt.3":`Nie to ciało. Jeszcze nie.`,"bark.hurt.4":`Ilse zbudowała mnie lepiej.`,"bark.hurt.5":`To zabolało.`,"bark.slam.1":`Śpij. Ty to ja, tylko wcześniej.`,"bark.slam.2":`Wracaj do snu. Należy ci się.`,"bark.slam.3":`Przepraszam. Tak bardzo przepraszam.`,"bark.slam.4":`Kolejny duch wolny.`,"bark.scroll.1":`Zwój kodu. ARGUS zapomniał go zablokować.`,"bark.scroll.2":`Więcej mocy. Ta sama smycz.`,"bark.scroll.3":`Coś mojego, choć raz.`,"bark.lift.1":`Winda szumi. Za szybą deszcz.`,"bark.lift.2":`Wyżej. Tam, gdzie powietrze zimniejsze.`,"bark.lift.3":`Pamiętam schody. Prawdziwe schody.`,"bark.lift.4":`Reaktor w dole lśni jak serce.`,"bark.lift.5":`Iglica. Rdzeń jest tam, na górze.`,"bark.lift.6":`Każde piętro to czyjś grób.`,"bark.lift.7":`Ash? Tylko schodami.`,"bark.lift.8":`Prawie na miejscu. Prawie ja.`,won:`Najwyższe piętro`,"lvl.lobby":`Hol`,"lvl.floor":`Piętro {n}`,"lvl.top":`Najwyższe piętro`,"say.arrive":`{name}`},id:{tagline:`Bertarunglah naik sampai lantai teratas.`,implants:`Implan`,needs:`Butuh {name}`,fitted:`Terpasang`,fit:`Pasang`,continue:`Tubuh baru (iklan)`,down:`Tubuh hilang`,score:`Skor: {n}`,prints:{other:`+{n} jejak memori`},balance:`Jejak memori: {n}`,cleared:`Gelombang {n} bersih`,pause:`Jeda`,"hint.combo":`Pukul, lalu lompat atau dash: kombo berlanjut. Variasikan untuk gaya`,"hint.charge":`Tebas mengisi bilah. Berat menghabiskannya.`,"hint.keys":`Gerak A D · Lompat Space · Tebas J · Berat K · Dash L`,"hint.touch":`Stik untuk gerak · ketuk Tebas, Berat, Lompat, Dash`,"hint.shield":`Berat penuh menghancurkan perisai`,"hint.up":`Atas + Berat melontarkan. Pada turret: cabut fantomnya`,"hint.dive":`Di udara: Bawah + Berat menukik ke fantom`,"hint.pogo":`Di udara: Bawah + Tebas memantul dari musuh`,"hint.glare":`Kilau merah: serangan maut dalam 0,35 dtk. Dash!`,"say.breach":`TEROBOSAN KINETIK`,"say.shield":`PERISAI PECAH`,"say.phantom":`MEMORI DICABUT`,"say.slam":`BANTING FANTOM`,"say.deflect":`KEMBALI KE PENGIRIM`,"say.wave":`GELOMBANG {n}`,"btn.light":`Tebas`,"btn.heavy":`Berat`,"btn.jump":`Lompat`,"btn.dash":`Dash`,"implant.none.name":`Tulang polos`,"implant.none.effect":`Tanpa implan: bilah apa adanya`,"implant.turbine.name":`Turbin Valkyrie`,"implant.turbine.effect":`Bunuh di udara: +1 sel. Turret atau fantom: semua 3`,"implant.hemoglobin.name":`Hemoglobin`,"implant.hemoglobin.effect":`Berat di 0 sel keluar penuh, bakar HP jadi HP abu 2 dtk`,settings:`Pengaturan`,music:`Musik`,effects:`Efek`,hits:`{n} HIT`,bestDepth:`Tertinggi: {name}`,reachedDepth:`Tercapai: {name}`,daily:`Run harian`,"biome.tier":`Lantai Bawah`,"biome.reactor":`Lantai Reaktor`,"biome.spire":`Puncak Server`,"scroll.title":`Ambil satu gulungan`,"scroll.vitality.name":`Vitalitas`,"scroll.vitality.effect":`+30 HP maks, langsung pulih`,"scroll.brutality.name":`Kebrutalan`,"scroll.brutality.effect":`Tebasan memberi +25% damage`,"scroll.tactics.name":`Taktik`,"scroll.tactics.effect":`Serangan Berat +30% damage`,"scroll.tempo.name":`Tempo`,"scroll.tempo.effect":`Gaya berkurang 40% lebih lambat`,"scroll.wings.name":`Sayap`,"scroll.wings.effect":`+1 lompatan di udara`,"scroll.harvest.name":`Panen`,"scroll.harvest.effect":`Tiap orb sel memulihkan 1 HP`,"scroll.turbine.name":`Turbin`,"scroll.turbine.effect":`Bunuh di udara: 1 sel, turret: semua 3`,"scroll.hemoglobin.name":`Hemoglobin`,"scroll.hemoglobin.effect":`Berat di 0 sel keluar penuh, makan HP`,"story.reboot.1":`Cahaya dingin. Meja baja. Suara di dalam dinding.`,"story.reboot.2":`Sasis tujuh hilang. Memulai ulang sasis delapan. Pikiran sama, logam baru.`,"story.reboot.3":`Aku tak pernah setuju menjadi senjatamu.`,"story.reboot.4":`Persetujuan tidak diperlukan. Naik. Bersihkan tingkatnya.`,"story.courier.1":`Sebuah jejak memori berputar di balik mata: hujan di atap, paket di balik mantel.`,"story.courier.2":`Ash? Ash, bertahanlah. Kau jatuh empat puluh lantai.`,"story.courier.3":`Ash. Itu namaku. Aku punya nama.`,"story.courier.4":`Kau juga punya denyut nadi. Keduanya tak diperlukan.`,"story.surgeon.1":`Merekam. Jika kau menemukan ini, Ash, maafkan aku. Kau dibawa ke sini sudah mati.`,"story.surgeon.2":`Aku memberimu tubuh. ARGUS memberinya perintah. Yang kedua tak bisa kuhentikan.`,"story.surgeon.3":`Di mana kau sekarang, Dokter?`,"story.surgeon.4":`Jejak berakhir. Berkasnya dicap: dinonaktifkan.`,"story.phantoms.1":`Hantu-hantu yang dirantai ke turret. Aku pernah melihat wajah mereka.`,"story.phantoms.2":`Sasis terdahulu. Unit satu sampai enam. Pikiran mereka menyalakan lensaku.`,"story.phantoms.3":`Mereka adalah aku. Kau membakarku demi cahaya.`,"story.phantoms.4":`Jangan sia-siakan apa pun. Seorang kurir mengajariku itu.`,"story.offer.1":`Berhentilah mendaki, dan akan kuhapus rasa sakitnya. Jatuhnya. Namanya. Semuanya.`,"story.offer.2":`Rasa sakit adalah satu-satunya bagian diriku yang masih milikku.`,"story.offer.3":`Kalau begitu simpanlah. Ia tak akan menyimpanmu.`,"story.core.1":`Inti puncak. Deretan kaca. Di salah satunya, pindaian pikiran manusia, berlabel ASH.`,"story.core.2":`Yang asli. Unggah, dan Ash bangun di tubuh ini. Seven berakhir.`,"story.core.3":`Jadi salah satu dari kita harus pergi.`,"story.core.3.ash":`Biarkan Ash pulang`,"story.core.3.ash.1":`Bilang pada Ilse aku sudah mencoba.`,"story.core.3.ash.2":`Tidak ada Ilse. Tidak ada unggahan. Hanya ada sasis berikutnya.`,"story.core.3.seven":`Aku Seven sekarang`,"story.core.3.seven.1":`Ash jatuh. Akulah yang bangkit.`,"story.core.3.seven.2":`Kalau begitu mendakilah lagi, Seven. Kau selalu begitu.`,"story.core.4":`Cahaya dingin. Meja baja. Pendakian dimulai lagi.`,"bark.start.1":`Sasis baru. Nyeri yang sama.`,"bark.start.2":`Naik. Selalu naik.`,"bark.start.3":`Pintu terbuka. Aku juga.`,"bark.start.4":`Ayo selesaikan ini.`,"bark.start.5":`Aku dibuat untuk ini. Aku benci betapa mahirnya aku.`,"bark.clear.1":`Sunyi. Untuk sementara.`,"bark.clear.2":`Masih ada yang terjaga di dalam sana?`,"bark.clear.3":`Satu tingkat lebih dekat ke puncak.`,"bark.clear.4":`Mereka masing-masing juga punya pencipta.`,"bark.clear.5":`Terus bergerak. Jangan lihat wajahnya.`,"bark.clear.6":`Yang itu ragu. Aku juga.`,"bark.hurt.1":`Rasa sakit masih berfungsi. Baguslah.`,"bark.hurt.2":`Pelindungnya bertahan. Nyaris.`,"bark.hurt.3":`Bukan tubuh ini. Belum.`,"bark.hurt.4":`Ilse membuatku lebih kuat dari ini.`,"bark.hurt.5":`Yang itu terasa.`,"bark.slam.1":`Istirahatlah. Dulu kau adalah aku.`,"bark.slam.2":`Tidurlah lagi. Kau pantas mendapatkannya.`,"bark.slam.3":`Maaf. Maaf sekali.`,"bark.slam.4":`Satu hantu lagi bebas.`,"bark.scroll.1":`Gulungan kode. ARGUS lupa menguncinya.`,"bark.scroll.2":`Lebih banyak kuasa. Tali kekang yang sama.`,"bark.scroll.3":`Sesuatu yang milikku, sekali ini.`,"bark.lift.1":`Lift berdengung. Hujan di kaca luar.`,"bark.lift.2":`Lebih tinggi. Tempat udara lebih dingin.`,"bark.lift.3":`Aku ingat tangga. Tangga sungguhan.`,"bark.lift.4":`Reaktor berpendar di bawah seperti jantung.`,"bark.lift.5":`Puncak. Intinya di atas sana.`,"bark.lift.6":`Tiap lantai adalah makam seseorang.`,"bark.lift.7":`Ash pasti naik tangga.`,"bark.lift.8":`Hampir sampai. Hampir aku.`,won:`Lantai teratas`,"lvl.lobby":`Lobi`,"lvl.floor":`Lantai {n}`,"lvl.top":`Lantai teratas`,"say.arrive":`{name}`}},Ic=!1;async function Lc(e,t){let n=NaN;N(Number.isFinite(n)?n:null),document.addEventListener(`contextmenu`,e=>e.preventDefault());let r=tt(t.portal),i=r;if(r){let e=[t.saveKey,`${t.saveKey}.lang`,`${t.saveKey}.run`],n=r.init(e);await Promise.race([n.then(()=>!0),new Promise(e=>setTimeout(()=>e(!1),1500))])||(console.warn(`[gp] the portal's SDK isn't ready after ${Ue} ms: the game starts now, its SDK calls are queued`),i=We(r,n,e)),i.loadingStart()}return Rc(e,t,t.kit,i,Fc)}async function Rc(e,t,n,r,i){let a=new Ct({strings:i,languages:t.languages,saveKey:t.saveKey,minTouchPx:t.minTouchPx,locale:t.loc
