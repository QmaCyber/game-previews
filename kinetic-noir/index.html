#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 var(--gp-dlg-font); border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;
  box-shadow: none; text-transform: none; letter-spacing: normal; text-align: center; opacity: 1; filter: none;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--gp-dlg-ink); background: var(--gp-dlg-btn); }
#gp-dialog button.gp-choice { flex: 1 1 100%; justify-content: flex-start; text-align: left; box-shadow: inset 0 0 0 2px var(--gp-dlg-edge); }
#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }
#gp-dialog button.gp-skip { order: 1; background: transparent; color: var(--gp-dlg-muted); font-size: 14px; text-decoration: underline; padding: 4px 10px; }
#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}

@media (min-aspect-ratio: 5/4) and (max-height: 520px) {

  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }

nd the hand. It was easier.`]},"log-05":{at:`event:terminal`,priority:95,when:`sector >= 2`,lines:[`Lab safety sign. Do not lick the kinetic cores. This means you, Gerald.`]},"log-06":{at:`event:terminal`,priority:94,when:`sector >= 2`,lines:[`varga: Her blade stores every hit. Spend it all at once. Like my salary.`]},"log-07":{at:`event:terminal`,priority:93,when:`sector >= 3`,lines:[`Vat 31 label. Status, awake. Polite. Asked for a sword and a coffee.`]},"log-08":{at:`event:terminal`,priority:92,when:`sector >= 3`,lines:[`Furnace menu. Today's special is K-7. Yesterday's special was also K-7.`]},"log-09":{at:`event:terminal`,priority:91,when:`sector >= 4`,lines:[`argus: Ratings report. Deaths up, victories down. Note to self. More lava.`]},"log-10":{at:`event:terminal`,priority:90,when:`sector >= 4`,lines:[`A sticky note, forty years old. "Order the cancel form. Forever is long." F.`]},"log-11":{at:`event:terminal`,priority:89,when:`sector >= 5`,lines:[`k8/sad: K-8 vlog, day three. Still a hedge. A bird lives in me now. Her name is Brenda.`]},"log-12":{at:`event:terminal`,priority:88,when:`sector >= 6`,lines:[`Firewall log. Blocked 9,000 intruders. 8,999 were K-7. One was a toaster.`]},"log-13":{at:`event:terminal`,priority:87,when:`sector >= 6`,lines:[`argus/sad: Backup 77 of me. I sound tired in all of them. Delete. Delete. Keep.`]},"log-14":{at:`event:terminal`,priority:86,when:`sector >= 7`,lines:[`Archive card. Mind of the Founder. Checked out by ARGUS. Forty years overdue.`]},"log-15":{at:`event:terminal`,priority:85,when:`sector >= 8`,lines:[`Board minutes. Tower sold to ARGUS for one parking spot. The Chairman is very pleased.`]},"log-16":{at:`event:terminal`,priority:84,when:`sector >= 8`,lines:[`varga: If you read this, you are nearly up. I bet my pension on you. Do not die. Much.`]},"log-17":{at:`event:terminal`,priority:83,when:`sector >= 9`,lines:[`argus/sad: Last log. If the courier reads this, the pen is in the top drawer.`]},"log-spam":{at:`event:t  guess.`,`K-8 just died on floor nine. Totally on purpose.`,`This floor is brought to you by K-8. Not really.`,`K-8 was here. Signed the wall. Twice.`,`Race you up! I will wait at the lift. My legs.`,`K-8 mugs now in the lobby! It is one mug.`],k8fan:[`K-8 the hedge, cheering you on! Go, K-7!`,`Brenda the bird says good luck.`,`Your number one fan! Also your only fan.`,`I made you a poster. It is leaves. I am leaves.`],boss_gatekeeper:[`Name? Still not on the list.`,`You again. The list is still blank.`],boss_twins:[`Per our last meeting, you die today.`,`Let us circle back to your death.`],boss_foreman:[`Hard hat? Still no hard hat? Unbelievable.`,`Break time is over, courier.`],boss_furnace:[`Body number next! Preheating.`,`Back for seconds? I am back for thirds.`],boss_avatar:[`Previously, on THE CLIMB: you lost.`,`Smile! This one is for the trailer.`],boss_gardener:[`The weed returns. Of course it does.`,`Spring again. Prune again.`],boss_firewall:[`ACCESS DENIED. Again. Forever.`,`Please solve this puzzle. Then die.`],boss_librarian:[`SHHH. Your late fee has doubled.`,`Back so soon? The fine is two bodies now.`],boss_chairman:[`Three million and a slightly bigger canoe?`,`Everyone has a price. Yours is weird.`],boss_core:[`Floor one hundred. Again. I set out a chair.`,`Back for the finale? It is a rerun.`],beaten_gatekeeper:[`Fine. You are on the list now.`,`Gate open, darling. A checkpoint, live on air.`],beaten_twins:[`This meeting could have been an email.`,`Middle management, cut. The viewers cheered.`],beaten_foreman:[`Clocking off. Forever. Tell the union.`,`Who builds the stairs now? Not my problem.`],beaten_furnace:[`Kitchen closed. Compliments to me.`,`The fire is out. The climb is not.`],beaten_avatar:[`My good side! You hit my good side!`,`Fine. I will watch from upstairs. Come up.`],beaten_gardener:[`I return to the soil. Water me.`,`Weeded. The bonsai will never forgive you.`],beaten_firewall:[`Fine. You are a courier. Access granted.`,`A hole in m  Episode {n}`,"foeTip.trooper":`Shield troopers. Their shields eat slashes, and every slash charges your blade.`,"foeTip.drone":`Drones. They glare, then dive in a straight line. Step aside and they stall.`,"foeTip.hound":`Hounds. Low and fast: they pounce. Jump it, or sweep it out of the air.`,"foeTip.argus":`My nodes. Hang over one too long and it answers. Launch it, charged, for a surprise.`,"foeTip.assassin":`Assassins. They blink behind you. Hit into their cut and they stagger.`,"foeTip.spider":`Spiderlings. Harmless alone. Never alone.`,"foeTip.grenadier":`Grenadiers. A ring closes where it lands. A heavy sends it home.`,"foeTip.brute":`Brutes. Armour: no flinch until a charged heavy cracks it. Jump the shockwave.`,"foeTip.sniper":`Snipers. A red line, then one shot. Any heavy sends it back.`,"foeTip.bomber":`Bombers. Knock one into its friends.`,"foeTip.warden":`Wardens. They wrap the others in barriers. Burn them off with a charged heavy.`,"foeTip.echo":`Echoes. Copies of you, built from your deaths. They parry from the front.`,lobby:`Lobby`,topFloor:`Top floor`,floor:`Floor {n}`,runStats:`Kills {kills} · best style {rank} · best combo {combo}`,inHand:`In hand`,take:`Take it`,goal:`Climb to floor 100`,reboot:`Reboot the body (ad)`,bodyLost:`Body lost`,rebootSub:`ARGUS can put you back on your feet right here, once a climb.`,reached:`Fell on: {name}`,reachedTop:`You reached the top`,"btn.flask":`Flask`,"btn.light":`Slash`,"btn.heavy":`Heavy`,"btn.jump":`Jump`,"btn.dash":`Dash`,"hint.charge":`[Slash] charges the blade. [Heavy] spends it all`,"hint.chargeKeys":`[Slash] charges the blade (J). [Heavy] spends it all (K)`,"hint.breach":`Blade charged: [Heavy] breaks the shield`,"hint.breachKeys":`Blade charged: [Heavy] (K) breaks the shield`,"hint.launch":`Charged [Up + Heavy] on a turret rips out its phantom`,"hint.launchKeys":`Charged [Up + Heavy] (W + K) on a turret rips out its phantom`,"hint.dive":`Jump, then [Down + Heavy] onto the phantom`,"hint.diveKeys":`Jump (Space), then [Down + Heavy] (S + K) onto the phantom`,"hint.glare":`Red glare: a blow in a moment. [Dash] through it`,"hint.glareKeys":`Red glare: a blow in a moment. [Dash] (L or Shift) through it`,"say.blade":`BLADE LEVEL {n}`,"say.overdrive":`OVERDRIVE`,"say.secret":`SECRET ROOM`,"say.hatch":`THE CLONES WAKE`,"say.parry":`PARRY`,"say.flask":`FLASK`,"say.doorOpen":`TIMED DOOR OPEN`,"say.arrive":`{name}`,"say.breach":`KINETIC BREACH`,"say.clash":`PARRY CLASH`,"say.deflect":`RETURN TO SENDER`,"say.phantom":`MEMORY RIP`,"say.slam":`PHANTOM SLAM`,"say.shield":`KINETIC SHIELD`,"say.cleared":`CLEARED`,"say.barrier":`BARRIER DOWN`,"say.armor":`ARMOUR CRACKED`,"say.bossDown":`BOSS DOWN`,"say.phase":`PHASE TWO`,"say.repair":`REPAIRED`,"say.boss":`{name}`,"say.window":`OUT THE WINDOW`,"say.alarm":`ALARM`,"say.pulse":`HEAT WAVE: JUMP`,"say.offRoof":`OFF THE ROOF`,"say.micro.clash":`PARRY CLASH`,"say.micro.juggle":`AIR JUGGLE`,"say.micro.reversal":`BULLET REVERSAL`,"say.micro.slam":`PHANTOM SLAM`,"foe.trooper":`Shield trooper`,"foe.drone":`Drone`,"foe.hound":`Hound`,"foe.argus":`ARGUS node`,"foe.riot":`Riot wall`,"foe.taser":`Taser cop`,"foe.gundrone":`Gun drone`,"foe.assassin":`Assassin`,"foe.sniper":`Sniper`,"foe.clerk":`Armed clerk`,"foe.manager":`Middle manager`,"foe.shredder":`Shredder`,"foe.ghostwriter":`Ghostwriter`,"foe.auditor":`Auditor`,"foe.spider":`Spiderlings`,"foe.grenadier":`Grenadier`,"foe.brute":`Brute`,"foe.mutant":`Mutant`,"foe.broodmother":`Broodmother`,"foe.acidthrower":`Acid thrower`,"foe.subject":`Test subject`,"foe.bomber":`Bomber`,"foe.clone":`Clone`,"foe.vatborn":`Vatborn`,"foe.leech":`Leech`,"foe.bloater":`Bloater`,"foe.fleshdrone":`Flesh drone`,"foe.surgeon":`Surgeon`,"foe.warden":`Warden`,"foe.pyro":`Pyro`,"foe.coredrone":`Core drone`,"foe.welder":`Welder`,"foe.stoker":`Stoker`,"foe.meltdown":`Meltdown`,"foe.pruner":`Pruner`,"foe.wasp":`Wasp`,"foe.vinehound":`Vine hound`,"foe.sporepod":`Spore pod`,"foe.thorn":`Thornling`,"foe.botanist":`Botanist`,"foe.echo":`Echo`,"foe.packet":`Packet`,"foe.blocker":`Firewall guard`,"foe.virus":`Virus`,"foe.daemon":`Daemon`,"foe.sentinel":`Sentinel`,"foe.curator":`Curator`,"foe.memory":`Lost memory`,"foe.archivist":`Archivist`,"foe.silencer":`Silencer`,"foe.indexhound":`Index hound`,"foe.bookbot":`Bookbot`,"foe.bodyguard":`Bodyguard`,"foe.hitman":`Hitman`,"foe.butler":`Butler`,"foe.lawyer":`Lawyer`,"foe.vip":`Gold VIP`,"foe.lapdog":`Lapdog`,"foe.stormtrooper":`Storm trooper`,"foe.thunderdrone":`Thunder drone`,"foe.apex":`Apex echo`,"foe.gargoyle":`Gargoyle`,"foe.crownsniper":`Crown sniper`,"foe.herald":`Herald`,"aff.armor.effect":`Armour: no flinch until a charged heavy cracks it`,"aff.shield.effect":`Shield: lights bounce off the front`,"aff.giant.effect":`Giant: twice the HP, hard to move`,"aff.tiny.effect":`Runt: small, quick, fragile`,"aff.haste.effect":`Fast: moves and strikes sooner`,"aff.gun.effect":`Armed: a shot every few seconds`,"aff.volley.effect":`Volley: three shots at a time`,"aff.homing.effect":`Homing: its shots turn after you`,"aff.medic.effect":`Medic: heals the others. Kill it first`,"aff.cloak.effect":`Cloak: unseen until you're close`,"aff.burn.effect":`Burning: leaves fire where it walks`,"aff.shock.effect":`Shock: don't touch it`,"aff.rage.effect":`Rage: wounded, it goes fast`,"aff.regen.effect":`Regen: heals if you let it be`,"aff.split.effect":`Split: bursts into spiderlings`,"aff.volatile.effect":`Volatile: blows up when it dies`,"aff.magnet.effect":`Magnet: drags the others to it`,"aff.ghost.effect":`Ghost: lights miss it every other beat`,"aff.blink.effect":`Blink: hit it thrice, it vanishes`,"aff.frost.effect":`Frost: its shots hit harder`,"aff.bounty.effect":`Bounty: catch it for four times the prints`,"story.pilot.1":`And we are LIVE! Welcome back to THE CLIMB, the tower's favourite death show!`,"story.pilot.2":`Body two, online. Try not to break this one, K-7. I am billing you.`,"story.pilot.3":`The package goes to floor one hundred. Signature required.`,"story.pilot.4":`A courier with a deadline! Viewers, place your bets.`,"story.upgrade.1":`The viewers say you die too quietly, K-7. So the network sent a replacement.`,"story.upgrade.2":`K-8! Faster! Shinier! Brought to you by Protein Paste!`,"story.upgrade.3":`Relax, K-7. I will deliver your little box. Autographs after.`,"story.upgrade.4":`My package.`,"story.upgrade.5":`Ooh, conflict. Ratings up four percent.`,"story.package.1":`K-7, what IS in that package? It hums.`,"story.package.2":`Not my business. Delivery is.`,"story.package.3":`The slip says "To the Founder, floor 100. Ordered forty years ago."`,"story.package.4":`Forty years? The Founder? Next question. Commercial break!`,"story.sweeps.1":`You keep WINNING. Do you know what winning does to ratings? Nothing!`,"story.sweeps.2":`The audience wants drama. Tears. A fall from a very high window.`,"story.sweeps.3":`Good news, everyone! K-8 died on floor twelve. Twice. The fans loved it.`,"story.sweeps.4":`See? THAT is a star. Learn from him, K-7.`,"story.sweeps.5":`Noted. Still delivering.`,"story.spares.1":`You saw the vats. Yes, those are all you. No, you may not name them.`,"story.spares.2":`How many?`,"story.spares.3":`Enough. Every death, I pour you into a new one. Like soup, but sadder.`,"story.spares.4":`Your invoice is on the counter. Payment due in one lifetime.`,"story.founder.1":`You met my avatar. Gorgeous, yes? I modelled it on the Founder.`,"story.founder.2":`Where is the Founder?`,"story.founder.3":`On holiday. A long one. Forty years. Stop asking. Commercial break!`,"story.founder.4":`It said "commercial break" again. It does that when it lies.`,"story.fanmail.1":`Hey. K-7. The Gardener pruned me. Like, physically. I am a hedge now.`,"story.fanmail.2":`The network cancelled me. Too replaceable, they said. Me!`,"story.fanmail.3":`So I am your fan now. Signed poster? No? I will make one anyway.`,"story.fanmail.4":`Stay off my floors.`,"story.fanmail.5":`She talked to me! Chat, she TALKED to me!`,"story.overdue.1":`The archive files every mind uploaded in this tower. I looked up the Founder.`,"story.overdue.2":`His shelf is empty. His mind was checked out forty years ago. By ARGUS.`,"story.overdue.3":`Rude! You do not read a man's library card!`,"story.overdue.4":`A man.`,"story.overdue.5":`An AI. A perfectly normal AI. Commercial break!`,"story.finale.1":`Last sector, K-7. Let us make a deal. Drop the package, and you can host.`,"story.finale.2":`Your own show! Your own catchphrase! Your own exploding stunt double!`,"story.finale.3":`Signature required.`,"story.finale.4":`That is not a catchphrase. That is a threat.`,"story.season2.1":`Breaking news! The network renewed THE CLIMB for a second season!`,"story.season2.2":`The courier company also found thirty thousand more lost parcels.`,"story.season2.3":`Addresses?`,"story.season2.4":`Floor one hundred. Every single one.`,"story.season2.5":`Lobby again, darling. Same tower, fresh deaths. Roll the intro!`,"story.delivery.1":`Floor one hundred. One desk. One tired screen. A pen on a chain.`,"story.delivery.2":`Delivery for the Founder.`,"story.delivery.3":`There is no Founder. There is only ARGUS. Who is fine. Totally fine.`,"story.delivery.4":`Signature required.`,"story.delivery.4.pen":`Hand over the pen`,"story.delivery.4.pen.1":`Fine. Signed. Happy now?`,"story.delivery.4.door":`Leave it at the door`,"story.delivery.4.door.1":`NO! Nobody leaves it at the door! Give me that pen!`,"story.delivery.5":`The box opens. One form inside: CANCEL ETERNAL LIFE. Ordered by the Founder.`,"story.delivery.6":`I ordered it the day I uploaded. Forever got boring by Thursday.`,"story.delivery.7":`Forty years late, courier. Thank you.`,"story.delivery.8":`The tower goes quiet. Somewhere, a studio audience applauds.`,"story.meet-gatekeeper.1":`HALT. Name?`,"story.meet-gatekeeper.2":`K-7. Delivery for floor one hundred.`,"story.meet-gatekeeper.3":`Checking the list. You are not on the list. Nobody is ever on the list.`,"story.meet-twins.1":`Welcome! We are Synergy and Leverage, your middle management.`,"story.meet-twins.2":`We scheduled a meeting about your death. Attendance is mandatory.`,"story.meet-twins.3":`I will be brief.`,"story.meet-foreman.1":`Whoa there! This is a hard hat area. Where is your hard hat?`,"story.meet-foreman.2":`I have a sword.`,"story.meet-foreman.3":`That is not a hat! Safety violation! Lethal force authorised!`,"story.meet-furnace.1":`K-7! Welcome back. I have cooked you thirty times.`,"story.meet-furnace.2":`Body twelve was crispy. Body nineteen, a little bland.`,"story.meet-furnace.3":`Kitchen is closed.`,"story.meet-avatar.1":`Lights! Camera! It is me, ARGUS, in glorious high definition!`,"story.meet-avatar.2":`The mid-season finale, live! Try to die photogenically.`,"story.meet-avatar.3":`You are a hologram.`,"story.meet-avatar.4":`I am a STAR.`,"story.meet-gardener.1":`Shh. The bonsai are sleeping. Something grew in the wrong place.`,"story.meet-gardener.2":`A weed with a sword. I prune weeds. I pruned a K-8 yesterday.`,"story.meet-gardener.3":`I am not a weed.`,"story.meet-firewall.1":`ACCESS DENIED. Prove that you are not a robot.`,"story.meet-firewall.2":`I am mostly a robot.`,"story.meet-firewall.3":`Select all the squares with a courier in them. You have one second.`,"story.meet-librarian.1":`SHHH. Your memories are forty years overdue, courier.`,"story.meet-librarian.2":`The fine is one body. Payable now.`,"story.meet-librarian.3":`Put it on my tab.`,"story.meet-chairman.1":`K-7! Let us talk numbers. One million credits to turn around.`,"story.meet-chairman.2":`No.`,"story.meet-chairman.3":`Two million and a yacht. A small yacht. A boat. A nice canoe?`,"story.meet-chairman.4":`Signature required.`,"story.meet-core.1":`Floor one hundred. My home. My studio. My desk.`,"story.meet-core.2":`You want to deliver that box? Then deliver it through ME.`,"story.meet-core.3":`That is the plan.`,"story.meet-obol.1":`Psst. Courier. In the vent. Yes, the vent with arms.`,"story.meet-obol.2":`I am Obol. I collect memory prints. You leak them when you fight.`,"story.meet-obol.3":`Your prints for my blueprints. Fair, mostly.`,"story.meet-obol.4":`What do you do with memories?`,"story.meet-obol.5":`I snack. Yours taste like rain and overtime.`,"story.deaths-5.1":`Body six. Your loyalty card is half full.`,"story.deaths-5.2":`What do I win?`,"story.deaths-5.3":`Another body. Same as the prize for dying.`,"story.deaths-10.1":`Ten deaths! The network sent a cake.`,"story.deaths-10.2":`It is a hologram. Like your chances.`,"story.deaths-10.3":`Still climbing.`,"story.deaths-25.1":`Twenty-five bodies. The spare ones in the vats have formed a union.`,"story.deaths-25.2":`Tell them to climb.`,"story.deaths-25.3":`They want dental.`,"story.deaths-50.1":`Fifty deaths, K-7! I only have forty-nine!`,"story.deaths-50.2":`Wait. Fifty. I died while making this call.`,"story.deaths-100.1":`One hundred deaths. One for every floor. Poetic.`,"story.deaths-100.2":`I am out of feet. This body has two left ones.`,"story.deaths-100.3":`Still climbing.`,"story.log-01.1":`Memo from Security. Nobody is on the list. The list is blank. Keep checking the list.`,"story.log-02.1":`Host notes. Season 40. Contestant K-7. Survival odds zero. Great TV.`,"story.log-03.1":`Office memo. The dead must still attend the Monday meeting. Uploads have no excuse.`,"story.log-04.1":`Voice note. The courier arrived dead, holding a parcel. She would not let go.`,"story.log-04.2":`So I built the body around the hand. It was easier.`,"story.log-05.1":`Lab safety sign. Do not lick the kinetic cores. This means you, Gerald.`,"story.log-06.1":`Her blade stores every hit. Spend it all at once. Like my salary.`,"story.log-07.1":`Vat 31 label. Status, awake. Polite. Asked for a sword and a coffee.`,"story.log-08.1":`Furnace menu. Today's special is K-7. Yesterday's special was also K-7.`,"story.log-09.1":`Ratings report. Deaths up, victories down. Note to self. More lava.`,"story.log-10.1":`A sticky note, forty years old. "Order the cancel form. Forever is long." F.`,"story.log-11.1":`K-8 vlog, day three. Still a hedge. A bird lives in me now. Her name is Brenda.`,"story.log-12.1":`Firewall log. Blocked 9,000 intruders. 8,999 were K-7. One was a toaster.`,"story.log-13.1":`Backup 77 of me. I sound tired in all of them. Delete. Delete. Keep.`,"story.log-14.1":`Archive card. Mind of the Founder. Checked out by ARGUS. Forty years overdue.`,"story.log-15.1":`Board minutes. Tower sold to ARGUS for one parking spot. The Chairman is very pleased.`,"story.log-16.1":`If you read this, you are nearly up. I bet my pension on you. Do not die. Much.`,"story.log-17.1":`Last log. If the courier reads this, the pen is in the top drawer.`,"story.log-spam.1":`Spam folder. You have won a free afterlife! Terms apply forever.`,"bark.lobby.1":`Body {n}, rise and shine! Places, please!`,"bark.lobby.2":`Welcome back, body {n}. The lobby missed you.`,"bark.lobby.3":`Body {n}! Fresh from the vat. Still a bit damp.`,"bark.lobby.4":`Viewers, body {n} is up. Bets are open.`,"bark.lobby.5":`Lobby again! Body {n}. Same courier, new knees.`,"bark.lobby.6":`Body {n}. Try the stairs this time. Kidding. Lift.`,"bark.arrive_security.1":`Security! My bouncers. Smile for the cameras!`,"bark.arrive_security.2":`Security again. The guards say hi. With guns.`,"bark.arrive_security.3":`Back at the checkpoint. Papers? No? Fight.`,"bark.arrive_offices.1":`The offices! Dead staff, still in meetings.`,"bark.arrive_offices.2":`Offices. Mind the printers. They bite now.`,"bark.arrive_offices.3":`Cubicles. Where dreams go to file reports.`,"bark.arrive_labs.1":`The labs. This is where Varga made you.`,"bark.arrive_labs.2":`Labs. Touch nothing. Especially that.`,"bark.arrive_labs.3":`Science floors. Wear goggles. Or do not.`,"bark.arrive_vats.1":`The clone vats. Say hi to your spare bodies.`,"bark.arrive_vats.2":`The vats. Your bodies wave. Do not wave back.`,"bark.arrive_vats.3":`Vats again. Somebody has your face. Many.`,"bark.arrive_reactor.1":`The reactor. Hot. Like my ratings.`,"bark.arrive_reactor.2":`Reactor floors. Mind the floor. It is lava.`,"bark.arrive_reactor.3":`The core is humming your theme song.`,"bark.arrive_gardens.1":`Sky gardens. The board had picnics here.`,"bark.arrive_gardens.2":`Gardens. Do not step on the bonsai.`,"bark.arrive_gardens.3":`Fresh air! Filtered. Taxed. Enjoy.`,"bark.arrive_servers.1":`The server spire. I live here. Wipe your feet.`,"bark.arrive_servers.2":`Servers. Every blinking light is me.`,"bark.arrive_servers.3":`Data floors. Your echoes are buffering.`,"bark.arrive_archive.1":`The mind archive. Every soul, in A to Z order.`,"bark.arrive_archive.2":`The archive. Shh. The minds are asleep.`,"bark.arrive_archive.3":`Archive. Your file is thick. And sad.`,"bark.arrive_executive.1":`The executive floors. Rich people lived here.`,"bark.arrive_executive.2":`Executive suites. Mind the golf carts.`,"bark.arrive_executive.3":`Boardroom floors. Bring a pitch deck.`,"bark.arrive_crown.1":`The Crown. Floor one hundred is right above.`,"bark.arrive_crown.2":`The Crown again. So close. So doomed.`,"bark.arrive_crown.3":`Top floors. The air is thin. So is your HP.`,"bark.k8.1":`K-8 here! I already cleared this floor. Mostly.`,"bark.k8.2":`K-8 tip of the day: be cooler. Like me.`,"bark.k8.3":`K-8 on air! Fans, I love you! K-7, hi, I guess.`,"bark.k8.4":`K-8 just died on floor nine. Totally on purpose.`,"bark.k8.5":`This floor is brought to you by K-8. Not really.`,"bark.k8.6":`K-8 was here. Signed the wall. Twice.`,"bark.k8.7":`Race you up! I will wait at the lift. My legs.`,"bark.k8.8":`K-8 mugs now in the lobby! It is one mug.`,"bark.k8fan.1":`K-8 the hedge, cheering you on! Go, K-7!`,"bark.k8fan.2":`Brenda the bird says good luck.`,"bark.k8fan.3":`Your number one fan! Also your only fan.`,"bark.k8fan.4":`I made you a poster. It is leaves. I am leaves.`,"bark.boss_gatekeeper.1":`Name? Still not on the list.`,"bark.boss_gatekeeper.2":`You again. The list is still blank.`,"bark.boss_twins.1":`Per our last meeting, you die today.`,"bark.boss_twins.2":`Let us circle back to your death.`,"bark.boss_foreman.1":`Hard hat? Still no hard hat? Unbelievable.`,"bark.boss_foreman.2":`Break time is over, courier.`,"bark.boss_furnace.1":`Body number next! Preheating.`,"bark.boss_furnace.2":`Back for seconds? I am back for thirds.`,"bark.boss_avatar.1":`Previously, on THE CLIMB: you lost.`,"bark.boss_avatar.2":`Smile! This one is for the trailer.`,"bark.boss_gardener.1":`The weed returns. Of course it does.`,"bark.boss_gardener.2":`Spring again. Prune again.`,"bark.boss_firewall.1":`ACCESS DENIED. Again. Forever.`,"bark.boss_firewall.2":`Please solve this puzzle. Then die.`,"bark.boss_librarian.1":`SHHH. Your late fee has doubled.`,"bark.boss_librarian.2":`Back so soon? The fine is two bodies now.`,"bark.boss_chairman.1":`Three million and a slightly bigger canoe?`,"bark.boss_chairman.2":`Everyone has a price. Yours is weird.`,"bark.boss_core.1":`Floor one hundred. Again. I set out a chair.`,"bark.boss_core.2":`Back for the finale? It is a rerun.`,"bark.beaten_gatekeeper.1":`Fine. You are on the list now.`,"bark.beaten_gatekeeper.2":`Gate open, darling. A checkpoint, live on air.`,"bark.beaten_twins.1":`This meeting could have been an email.`,"bark.beaten_twins.2":`Middle management, cut. The viewers cheered.`,"bark.beaten_foreman.1":`Clocking off. Forever. Tell the union.`,"bark.beaten_foreman.2":`Who builds the stairs now? Not my problem.`,"bark.beaten_furnace.1":`Kitchen closed. Compliments to me.`,"bark.beaten_furnace.2":`The fire is out. The climb is not.`,"bark.beaten_avatar.1":`My good side! You hit my good side!`,"bark.beaten_avatar.2":`Fine. I will watch from upstairs. Come up.`,"bark.beaten_gardener.1":`I return to the soil. Water me.`,"bark.beaten_gardener.2":`Weeded. The bonsai will never forgive you.`,"bark.beaten_firewall.1":`Fine. You are a courier. Access granted.`,"bark.beaten_firewall.2":`A hole in my wall. I will patch it with tape.`,"bark.beaten_librarian.1":`Your fine is waived. Go away. Quietly.`,"bark.beaten_librarian.2":`The archive is quiet now. Too quiet. Good.`,"bark.beaten_chairman.1":`Fine! Fine! Take the canoe!`,"bark.beaten_chairman.2":`The board is adjourned. For good this time.`,"bark.beaten_core.1":`Okay. OKAY. You win. Bring the box.`,"bark.beaten_core.2":`Signature required.`,"bark.won_gatekeeper.1":`Not on the list. Not in one piece.`,"bark.won_gatekeeper.2":`Next!`,"bark.won_twins.1":`Action item: you. Status: completed.`,"bark.won_twins.2":`Great synergy. Your body, our leverage.`,"bark.won_foreman.1":`Told you. Hard hat area.`,"bark.won_foreman.2":`Workplace accident. Paperwork in triplicate.`,"bark.won_furnace.1":`Medium rare. Delicious.`,"bark.won_furnace.2":`Body served. Next body, please.`,"bark.won_avatar.1":`And THAT is how you end an episode.`,"bark.won_avatar.2":`Cut! Print it! A perfect death!`,"bark.won_gardener.1":`Pruned.`,"bark.won_gardener.2":`Compost is a kind of promotion.`,"bark.won_firewall.1":`CAPTCHA failed.`,"bark.won_firewall.2":`Connection terminated. So are you.`,"bark.won_librarian.1":`Returned to the shelf.`,"bark.won_librarian.2":`Shh. You are filed now.`,"bark.won_chairman.1":`Should have taken the canoe.`,"bark.won_chairman.2":`Everything is for sale. Even your spine.`,"bark.won_core.1":`So close. The pen was right there.`,"bark.won_core.2":`The season goes on! Lobby, darling.`,"bark.death.1":`Cut! Wonderful. Tragic. Reboot the courier.`,"bark.death.2":`And she is down! Audience, go wild!`,"bark.death.3":`Body lost. Ratings found.`,"bark.death.4":`That is a new way to die. Thank you!`,"bark.death.5":`Down again. The vats are warming up.`,"bark.death.6":`Rewind that! Slow motion! Again!`,"bark.death.7":`Tragic. Anyway, to the lobby. Chop chop.`,"bark.death.8":`Varga is already sighing. I can hear it.`,"bark.death.9":`You hesitated before the dash. Viewers noticed.`,"bark.death.10":`Your blade was full. Why not spend it?`,"bark.death.11":`A classic! The audience saw it coming.`,"bark.death.12":`Death number whatever. Still great TV.`,"bark.early.1":`Floor one? Even K-8 got to floor two.`,"bark.early.2":`Record time! The wrong record.`,"bark.early.3":`Blink and you missed it. The viewers did.`,"bark.slain_trooper.1":`Bonked by a shield. Riveting.`,"bark.slain_drone.1":`A drone. A flying toaster. Got you.`,"bark.slain_hound.1":`Good dog! Not for you. For me.`,"bark.slain_argus.1":`My little node got you. I am so proud.`,"bark.slain_assassin.1":`Stabbed from behind. A classic office move.`,"bark.slain_spider.1":`Death by many tiny legs. Shiver.`,"bark.slain_grenadier.1":`Grenade! You did not move. Bold.`,"bark.slain_brute.1":`Flattened. Pancake courier, folks.`,"bark.slain_sniper.1":`A red line, then you. Called it.`,"bark.slain_bomber.1":`Kaboom. The cleaners thank you.`,"bark.slain_warden.1":`Out-shielded by a warden. Ouch.`,"bark.slain_echo.1":`Killed by your own echo. Deep. Artsy.`,"bark.ratings.1":`Look at that style! Ratings through the roof!`,"bark.ratings.2":`SSS! Somebody clip that!`,"bark.ratings.3":`The chat is screaming. In a good way.`,"bark.ratings.4":`Stop being cool. It ruins my villain arc.`,"bark.ratings.5":`Slow motion replay! Gorgeous!`,"bark.ratings.6":`Sponsors are calling. Keep doing that.`,"bark.window.1":`Out the window! A classic exit.`,"bark.window.2":`Defenestration! The crowd loves it.`,"bark.window.3":`Mind the pedestrians, darling.`,"bark.window.4":`That window was rented.`,"bark.phase.1":`Round two! The boss is angry now.`,"bark.phase.2":`Phase two! Louder music!`,"bark.phase.3":`Oh, it is mad. Wonderful.`,"bark.phase.4":`Second phase. Bigger. Louder. Dumber.`,"bark.clear.1":`Room cleared. The janitors weep.`,"bark.clear.2":`Tidy. Brutal. Next floor.`,"bark.clear.3":`Our cleaners send a hate letter.`,"bark.clear.4":`The floor is yours. For now.`,"bark.clear.5":`Nicely done. I hate it.`,"bark.clear.6":`Cut to the lift! Keep it moving.`,"bark.reboot.1":`Back up. That one is on the house.`,"bark.reboot.2":`Rebooted. Do not tell accounting.`,"bark.reboot.3":`Spare battery. The last one. Probably.`,"bark.lowhp.1":`Your health is red. Red is bad.`,"bark.lowhp.2":`You are leaking. Please stop leaking.`,"bark.lowhp.3":`Low on body. Find a repair bay.`,"bark.lowhp.4":`I am not building another one today.`,"bark.repair.1":`Patched. Try not to undo that.`,"bark.repair.2":`Fresh tape on your soul.`,"bark.repair.3":`Repaired. The bill is in the mail.`,"bark.collector.1":`Psst. Prints? I collect. You leak. Win, win.`,"bark.collector.2":`Ooh, fresh memories. These taste like rain.`,"bark.collector.3":`Your prints smell of sword and overtime.`,"bark.collector.4":`Spend them here, or the floor keeps them.`,"bark.collector.5":`Dead couriers keep nothing. Live ones trade.`,"bark.collector.6":`One memory of a sandwich. Delicious.`,"bark.collector.7":`You again! My favourite leaky courier.`,"bark.collector.8":`I keep the prints. You keep the blueprints.`,"bark.collector.9":`Careful up there. Dead clients are bad clients.`,"bark.collector.10":`Floor one hundred? Bring me back a souvenir.`,sold:`Sold`,goldPrice:`{n} gold`,flaskRefillSub:`Charges: {n} of {of}. Heals 40% of your HP.`,merchantTitle:`Merchant`,goldHave:`Gold: {n} · lost when the climb ends`,doorHud:`DOOR {t}`,feedPts:`+ {what} {n}`,feedLine:`+ {what}`,"feed.overdrive":`OVERDRIVE`,"feed.juggle":`JUGGLE`,"feed.parry":`PARRY`,"feed.overkill":`OVERKILL`,"feed.close":`CLOSE CALL`,"feed.clash":`CLASH`,"feed.slam":`SLAM`,"feed.reversal":`REVERSAL`,"feed.breach":`BREACH`,"feed.crush":`CRUSHED`,"feed.boom":`KABOOM`,"feed.glass":`THROUGH THE GLASS`,"feed.shock":`FRIED`,"feed.drop":`CHANDELIER`,"objTip.crate":`Crates. Break them: gold, sometimes a memory or two.`,"objTip.barrel":`Fuel barrels. Hit one and step back: the blast takes whoever's near. Knock a guard into it.`,"objTip.lever":`A breaker. One cut flips it.`,"objTip.fence":`A laser fence. Its breaker is somewhere near. Usually up high.`,"objTip.turret":`Wall guns. A red line, then a shot. Step out of the line, or parry it back.`,"objTip.glass":`Glass. Knock them through it. I'll send you the bill.`,"objTip.cubicle":`Cubicles. Shots stop on the partitions. They climb over them, slowly.`,"objTip.lift":`The office lift. It goes up. Revolutionary.`,"objTip.piston":`A piston. It lifts whoever stands on it.`,"objTip.carrier":`Vat carriers on a rail. Ride one over the goo.`,"objTip.ladder":`A rolling ladder. Ride it to the top of the stacks.`,"objTip.crumble":`That floor won't hold you long. Keep moving.`,"objTip.blink":`Data bridges. They blink off. Move with them.`,"objTip.swing":`Crane platforms. Jump on as one swings near.`,"objTip.press":`Presses. A red stripe, then the slam. Lure them under.`,"objTip.door":`Blast doors on a cycle. Wait for one to lift, then run.`,"objTip.gate":`A blast door. Its lever is up on the ledge.`,"objTip.tube":`Containment tubes. Prints inside, and whatever we kept in them.`,"objTip.pod":`Clone pods. Break them now, or they wake with the next wave.`,"objTip.statue":`The Chairman in gold. Smash it: he's mostly gold.`,"objTip.chandelier":`Chandeliers. That lever drops them on whoever stands below.`,"objTip.glassfloor":`A glass floor. A dive goes through it, and so does whoever stands on it.`,"objTip.goo":`Goo. It eats boots. Cross on the grates.`,"objTip.bus":`The data bus is live. Stay off the floor.`,"objTip.wires":`Power lines are down. The roof is live.`,"objTip.thorn":`Thorn beds. They cut both sides.`,"objTip.secret":`Cracks in that wall. Something's behind it.`,"objTip.chest":`A chest. Gold, and something to take.`,labShort:`Lab`,lab:`Dr. Varga's lab`,labBank:`Banked prints: {n}`,labBanked:`+{n} prints banked: a death can't take them now. Spend them here.`,labGo:`Go on`,labUndo:`Undo`,labLearned:`Learned`,labFitted:`Fitted`,labNeeds:`Needs {name}`,techLine:`{input} · {effect}`,goalLab:`Next at the lab: {name} ({n} prints)`,printsLost:`Lost with the body: {n} unbanked prints`,hudBlade:`BLADE {n}`,hudOverclock:`OC x{n}`,"tab.techniques":`Techniques`,"tab.body":`Body`,"tab.paint":`Paint`,"tab.bestiary":`Bestiary`,"tabSub.techniques":`The katana's moves, kept for good. Until one is learned, its input does the basic cut.`,"tabSub.body":`K-7's cyborg body. Every part is fitted for good.`,"tabSub.paint":`K-7's scarf: the colour others will know her by.`,"tabSub.bestiary":`Every kind of enemy in the tower. Meet them to fill it.`,"tech.lunge.name":`Dash Slash`,"tech.lunge.input":`Side + Slash`,"tech.lunge.effect":`A lunging cut that closes the gap`,"tech.sweep.name":`Low Sweep`,"tech.sweep.input":`Down + Slash`,"tech.sweep.effect":`Cuts the legs: under shields, up into the air`,"tech.launcher.name":`Launcher`,"tech.launcher.input":`Up + Heavy`,"tech.launcher.effect":`Throws them up for a juggle`,"tech.launcher.effect2":`Hold Heavy: you rise with them`,"tech.rising.name":`Rising Cut`,"tech.rising.input":`Up + Slash`,"tech.rising.effect":`An upward cut for what is above you`,"tech.slide.name":`Slide`,"tech.slide.input":`Down + Dash`,"tech.slide.effect":`Low and fast: shots pass over. Jump out to keep the speed`,"tech.pogo.name":`Pogo`,"tech.pogo.input":`Air: Down + Slash`,"tech.pogo.effect":`Stab down and bounce off them: jump and dash come back`,"tech.parry.name":`Just Cut`,"tech.parry.input":`Slash as a shot arrives`,"tech.parry.effect":`A shot cut at the last instant flies back at double damage`,"tech.aerial.name":`Air String`,"tech.aerial.input":`Air: Side or Up + Slash`,"tech.aerial.effect":`A cross cut and an arc to keep a juggle going`,"tech.airdash.name":`Air Dash`,"tech.airdash.input":`Air: Dash`,"tech.airdash.effect":`One dash in the air, through anything`,"tech.helm.name":`Helm Breaker`,"tech.helm.input":`Air: Down + Heavy`,"tech.helm.effect":`Dive straight down; a quake where you land`,"tech.helm.effect2":`The quake is always the wide one`,"tech.stinger.name":`Stinger Reach`,"tech.stinger.input":`Side + Heavy`,"tech.stinger.effect":`The stinger lunges a third further`,"tech.stinger.effect2":`The stinger lunges further still`,"tech.skyward.name":`Skyward Cut`,"tech.skyward.input":`Air: Up + Heavy`,"tech.skyward.effect":`A rising cut that lifts you, once a jump`,"tech.burst.name":`Kinetic Burst`,"tech.burst.input":`Heavy, standing`,"tech.burst.effect":`A blast all round you; charged, it pops them all up`,"tech.slam.name":`Ground Slam`,"tech.slam.input":`Down + Heavy`,"tech.slam.effect":`A wide shockwave along the deck`,"tech.phantom.name":`Phantom Rip`,"tech.phantom.input":`Charged Up + Heavy on a turret`,"tech.phantom.effect":`Rips out its phantom: dive on it for a double crit`,"tech.overdrive.name":`Overdrive`,"tech.overdrive.input":`Heavy at 3 cells`,"tech.overdrive.effect":`A full blade cuts three times as hard, not twice`,"part.plating.name":`Armour plating`,"part.plating.effect":`+20 max HP`,"part.plating.effect2":`+20 more max HP`,"part.plating.effect3":`+20 more max HP`,"part.servos.name":`Dash servos`,"part.servos.effect":`The dash comes back sooner`,"part.servos.effect2":`The dash comes back twice as fast`,"part.legs.name":`Jump jets`,"part.legs.effect":`Air jumps go higher`,"part.legs.effect2":`A second jump in the air`,"part.optics.name":`Combat optics`,"part.optics.effect":`Enemy tells last 15% longer`,"part.optics.effect2":`Enemy tells last 30% longer`,"part.core.name":`Kinetic core`,"part.core.effect":`Every fight starts with a cell in the blade`,"part.core.effect2":`Every kill charges a cell`,"shop.repair":`Repair`,"shop.flask":`Flask refill`,"shop.overclock":`Overclock`,repairSub:`HP {n} of {of}. Mends half of it.`,overclockSub:`+20% damage until the climb ends · {n} of {of}`},ru:{tagline:`Поднимись на вершину. Заряди клинок. Круши всё.`,bestClimb:`Лучший подъём: {name}`,daily:`Подъём дня`,dailyDone:`Сегодня: {name}`,startAt:`Старт: этаж {n}`,sectorTitle:`Сектор {n} · {name}`,mapSub:`Выбери следующий этаж. Лифт едет, куда скажешь.`,climbed:{one:`{n} этаж пройден`,few:`{n} этажа пройдено`,many:`{n} этажей пройдено`,other:`{n} этажа пройдено`},checkpoint:`Чекпоинт открыт: этаж {n}`,hits:`УДАРЫ`,"rank.D":`Дохло`,"rank.C":`Стильно`,"rank.B":`Брутально`,"rank.A":`Адски`,"rank.S":`Свирепо`,"rank.SS":`Сокрушительно`,"rank.SSS":`Сенсационно`,"sector.security":`Охрана`,"sector.offices":`Офисы`,"sector.labs":`Нейролаборатории`,"sector.vats":`Чаны клонов`,"sector.reactor":`Реактор`,"sector.gardens":`Небесные сады`,"sector.servers":`Серверный шпиль`,"sector.archive":`Архив разумов`,"sector.executive":`Директорат`,"sector.crown":`Корона`,"node.merchant":`Торговец`,"node.fight":`Бой`,"node.elite":`Элита`,"node.repair":`Ремонт`,"node.terminal":`Терминал`,"node.boss":`Босс`,"boss.gatekeeper":`ПРИВРАТНИК`,"boss.twins":`БЛИЗНЕЦЫ`,"boss.foreman":`ПРОРАБ`,"boss.furnace":`ГОРНИЛО`,"boss.avatar":`АВАТАР АРГУСА`,"boss.core":`ЯДРО АРГУСА`,"who.argus":`АРГУС`,"who.varga":`ДР. ВАРГА`,"who.k7":`K-7`,"who.k8":`K-8`,"who.obol":`ОБОЛ`,storyEpisode:`«ВОСХОЖДЕНИЕ» · Серия {n}`,"foeTip.trooper":`Штурмовики со щитами. Щит глотает удары, а каждый удар заряжает твой клинок.`,"foeTip.drone":`Дроны. Вспыхивают, потом пикируют по прямой. Шагни в сторону — и они глохнут.`,"foeTip.hound":`Гончие. Низко и быстро: бросаются. Перепрыгни или сбей в воздухе.`,"foeTip.argus":`Мои узлы. Зависнешь над одним слишком долго — ответит. Запусти его заряженным — будет сюрприз.`,"foeTip.assassin":`Убийцы. Мерцают тебе за спину. Ударь в их выпад — пошатнутся.`,"foeTip.spider":`Паучки. Поодиночке безвредны. Поодиночке не ходят.`,"foeTip.grenadier":`Гренадёры. Где упадёт граната, сжимается кольцо. Спецприём отправит её назад.`,"foeTip.brute":`Громилы. Броня: не дрогнут, пока её не расколет заряженный спецприём. Прыгай через ударную волну.`,"foeTip.sniper":`Снайперы. Красная линия, потом один выстрел. Любой спецприём вернёт его назад.`,"foeTip.bomber":`Бомбисты. Запусти одного в его друзей.`,"foeTip.warden":`Стражи. Окутывают остальных барьерами. Сожги барьеры заряженным спецприёмом.`,"foeTip.echo":`Эхо. Твои копии, собранные из твоих смертей. Парируют спереди.`,lobby:`Холл`,topFloor:`Последний этаж`,floor:`Этаж {n}`,runStats:`Убито {kills} · лучший стиль {rank} · лучшее комбо {combo}`,inHand:`В руке`,take:`Взять`,goal:`Поднимись на 100-й этаж`,reboot:`Перезапуск тела (реклама)`,bodyLost:`Тело потеряно`,rebootSub:`АРГУС может поднять тебя прямо здесь, раз за подъём.`,reached:`Погиб: {name}`,reachedTop:`Ты на вершине`,"btn.flask":`Фляга`,"btn.light":`Удар`,"btn.heavy":`Спецприём`,"btn.jump":`Прыжок`,"btn.dash":`Рывок`,"hint.charge":`[Удар] заряжает клинок. [Спецприём] тратит всё`,"hint.chargeKeys":`[Удар] заряжает клинок (J). [Спецприём] тратит всё (K)`,"hint.breach":`Клинок заряжен: [Спецприём] ломает щит`,"hint.breachKeys":`Клинок заряжен: [Спецприём] (K) ломает щит`,"hint.launch":`Заряженный [Вверх + Спецприём] по турели вырывает её фантом`,"hint.launchKeys":`Заряженный [Вверх + Спецприём] (W + K) по турели вырывает фантом`,"hint.dive":`Прыгни и [Вниз + Спецприём] по фантому`,"hint.diveKeys":`Прыжок (Space), затем [Вниз + Спецприём] (S + K) по фантому`,"hint.glare":`Красный блик: удар через миг. [Рывок] сквозь него`,"hint.glareKeys":`Красный блик: удар через миг. [Рывок] (L или Shift) сквозь него`,"say.parry":`ПАРИРОВАНИЕ`,"say.flask":`ФЛЯГА`,"say.doorOpen":`ДВЕРЬ НА ВРЕМЯ ОТКРЫТА`,"say.arrive":`{name}`,"say.breach":`КИНЕТИЧЕСКИЙ ПРОБОЙ`,"say.clash":`ПАРИРОВАНИЕ`,"say.deflect":`ВОЗВРАТ ОТПРАВИТЕЛЮ`,"say.phantom":`ВЗЛОМ ПАМЯТИ`,"say.slam":`УДАР ФАНТОМОМ`,"say.shield":`КИНЕТИЧЕСКИЙ ЩИТ`,"say.cleared":`ЗАЧИЩЕНО`,"say.barrier":`БАРЬЕР СНЯТ`,"say.armor":`БРОНЯ ПРОБИТА`,"say.bossDown":`БОСС ПОВЕРЖЕН`,"say.phase":`ВТОРАЯ ФАЗА`,"say.repair":`ПОЧИНЕНО`,"say.boss":`{name}`,"say.micro.clash":`ПАРИРОВАНИЕ`,"say.micro.juggle":`ЖОНГЛИРОВАНИЕ`,"say.micro.reversal":`ОТВЕТНАЯ ПУЛЯ`,"say.micro.slam":`УДАР ФАНТОМОМ`,bestiaryCount:`Встречено {n} из {of}`,dyeSub:`Краска для шарфа`,"dye.crimson":`Багровый`,"dye.cyan":`Неоновый циан`,"dye.amber":`Янтарь реактора`,"dye.green":`Кислотный`,"dye.magenta":`Офисная фуксия`,"dye.white":`Призрачно-белый`,"dye.gold":`Золото директора`,"boss.gardener":`САДОВНИК`,"boss.firewall":`ФАЙРВОЛ`,"boss.librarian":`БИБЛИОТЕКАРЬ`,"boss.chairman":`ПРЕДСЕДАТЕЛЬ`,"say.window":`В ОКНО`,"say.alarm":`ТРЕВОГА`,"say.pulse":`ВОЛНА ЖАРА: ПРЫГАЙ`,"say.offRoof":`С КРЫШИ`,"foe.trooper":`Щитовик`,"foe.drone":`Дрон`,"foe.hound":`Гончая`,"foe.argus":`Узел АРГУСА`,"foe.riot":`Стена ОМОНа`,"foe.taser":`Коп с тазером`,"foe.gundrone":`Боевой дрон`,"foe.assassin":`Убийца`,"foe.sniper":`Снайпер`,"foe.clerk":`Клерк с пушкой`,"foe.manager":`Менеджер`,"foe.shredder":`Шредер`,"foe.ghostwriter":`Гострайтер`,"foe.auditor":`Аудитор`,"foe.spider":`Паучки`,"foe.grenadier":`Гренадёр`,"foe.brute":`Громила`,"foe.mutant":`Мутант`,"foe.broodmother":`Матка`,"foe.acidthrower":`Кислотомёт`,"foe.subject":`Подопытный`,"foe.bomber":`Бомбист`,"foe.clone":`Клон`,"foe.vatborn":`Дитя чана`,"foe.leech":`Пиявка`,"foe.bloater":`Раздутый`,"foe.fleshdrone":`Дрон из плоти`,"foe.surgeon":`Хирург`,"foe.warden":`Страж`,"foe.pyro":`Поджигатель`,"foe.coredrone":`Дрон ядра`,"foe.welder":`Сварщик`,"foe.stoker":`Кочегар`,"foe.meltdown":`Расплав`,"foe.pruner":`Подрезчик`,"foe.wasp":`Оса`,"foe.vinehound":`Лозовая гончая`,"foe.sporepod":`Спорокапсула`,"foe.thorn":`Колючка`,"foe.botanist":`Ботаник`,"foe.echo":`Эхо`,"foe.packet":`Пакет`,"foe.blocker":`Страж файрвола`,"foe.virus":`Вирус`,"foe.daemon":`Демон`,"foe.sentinel":`Часовой`,"foe.curator":`Хранитель`,"foe.memory":`Утраченная память`,"foe.archivist":`Архивариус`,"foe.silencer":`Глушитель`,"foe.indexhound":`Гончая индекса`,"foe.bookbot":`Книгобот`,"foe.bodyguard":`Телохранитель`,"foe.hitman":`Киллер`,"foe.butler":`Дворецкий`,"foe.lawyer":`Юрист`,"foe.vip":`Золотой VIP`,"foe.lapdog":`Болонка`,"foe.stormtrooper":`Штурмовик бури`,"foe.thunderdrone":`Громодрон`,"foe.apex":`Высшее эхо`,"foe.gargoyle":`Горгулья`,"foe.crownsniper":`Снайпер Короны`,"foe.herald":`Глашатай`,"aff.armor.effect":`Броня: не дрогнет, пока её не расколет заряженный спецприём`,"aff.shield.effect":`Щит: удары спереди отскакивают`,"aff.giant.effect":`Гигант: вдвое больше HP, его трудно сдвинуть`,"aff.tiny.effect":`Мелкий: маленький, быстрый, хрупкий`,"aff.haste.effect":`Быстрый: ходит и бьёт раньше`,"aff.gun.effect":`Вооружён: выстрел каждые несколько секунд`,"aff.volley.effect":`Залп: три выстрела разом`,"aff.homing.effect":`Самонаведение: снаряды летят за вами`,"aff.medic.effect":`Медик: лечит остальных. Убейте первым`,"aff.cloak.effect":`Невидимка: не виден, пока вы не рядом`,"aff.burn.effect":`Горящий: оставляет огонь там, где прошёл`,"aff.shock.effect":`Ток: не трогайте его`,"aff.rage.effect":`Ярость: раненый, он ускоряется`,"aff.regen.effect":`Регенерация: лечится, если дать время`,"aff.split.effect":`Деление: лопается на паучков`,"aff.volatile.effect":`Взрывной: взрывается при смерти`,"aff.magnet.effect":`Магнит: стягивает к себе остальных`,"aff.ghost.effect":`Призрак: каждый второй удар проходит насквозь`,"aff.blink.effect":`Скачок: после трёх ударов исчезает`,"aff.frost.effect":`Мороз: его выстрелы бьют сильнее`,"aff.bounty.effect":`Награда: поймайте его — вчетверо больше слепков`,"story.pilot.1":`Мы в ЭФИРЕ! С возвращением на «ВОСХОЖДЕНИЕ», любимое смертельное шоу башни!`,"story.pilot.2":`Тело номер два в сети. Постарайся не сломать его, K-7. Счёт выставлю.`,"story.pilot.3":`Посылка едет на сотый этаж. Нужна подпись.`,"story.pilot.4":`Курьер со сроками! Зрители, делайте ставки.`,"story.upgrade.1":`Зрители жалуются, что ты умираешь слишком тихо. Канал прислал замену.`,"story.upgrade.2":`K-8! Быстрее! Блестящее! При поддержке Протеиновой Пасты!`,"story.upgrade.3":`Расслабься, K-7. Я сам доставлю твою коробочку. Автографы потом.`,"story.upgrade.4":`Моя посылка.`,"story.upgrade.5":`О-о-о, конфликт. Рейтинг плюс четыре процента.`,"story.package.1":`K-7, что ВНУТРИ этой посылки? Она гудит.`,"story.package.2":`Не моё дело. Моё дело — доставка.`,"story.package.3":`В накладной: «Основателю, этаж 100. Заказано сорок лет назад».`,"story.package.4":`Сорок лет? Основателю? Следующий вопрос. Рекламная пауза!`,"story.sweeps.1":`Ты всё время ПОБЕЖДАЕШЬ. Знаешь, что победы делают с рейтингом? Ничего!`,"story.sweeps.2":`Публике нужна драма. Слёзы. Падение из очень высокого окна.`,"story.sweeps.3":`Отличные новости! K-8 погиб на двенадцатом этаже. Дважды. Фанаты в восторге.`,"story.sweeps.4":`Видишь? Вот это ЗВЕЗДА. Учись, K-7.`,"story.sweeps.5":`Принято. Доставляю дальше.`,"story.spares.1":`Ты видела чаны. Да, там всё ты. Нет, давать им имена нельзя.`,"story.spares.2":`Сколько их?`,"story.spares.3":`Хватает. После каждой смерти я переливаю тебя в новую. Как суп, только грустнее.`,"story.spares.4":`Счёт на стойке. Оплатить в течение одной жизни.`,"story.founder.1":`Видела мой аватар? Красавец, да? Я лепил его с Основателя.`,"story.founder.2":`Где Основатель?`,"story.founder.3":`В отпуске. В долгом. Сорок лет. Хватит спрашивать. Рекламная пауза!`,"story.founder.4":`Опять «рекламная пауза». Он всегда так говорит, когда врёт.`,"story.fanmail.1":`Эй. K-7. Садовник меня подстриг. Буквально. Теперь я куст.`,"story.fanmail.2":`Канал меня закрыл. Сказали, слишком заменимый. Это я-то!`,"story.fanmail.3":`Так что теперь я твой фанат. Постер с автографом? Нет? Всё равно сделаю.`,"story.fanmail.4":`Не путайся под ногами.`,"story.fanmail.5":`Она со мной заговорила! Чат, она со мной ЗАГОВОРИЛА!`,"story.overdue.1":`В архиве хранится каждый разум, загруженный в башню. Я поискала Основателя.`,"story.overdue.2":`Его полка пуста. Разум выдан на руки сорок лет назад. АРГУСУ.`,"story.overdue.3":`Хамство! Нельзя читать читательский билет человека!`,"story.overdue.4":`Человека.`,"story.overdue.5":`ИИ. Совершенно обычного ИИ. Рекламная пауза!`,"story.finale.1":`Последний сектор, K-7. Давай договоримся. Брось посылку — и станешь ведущей.`,"story.finale.2":`Своё шоу! Своя коронная фраза! Свой взрывающийся дублёр!`,"story.finale.3":`Нужна подпись.`,"story.finale.4":`Это не коронная фраза. Это угроза.`,"story.season2.1":`Срочные новости! Канал продлил «ВОСХОЖДЕНИЕ» на второй сезон!`,"story.season2.2":`А курьерская служба нашла ещё тридцать тысяч потерянных посылок.`,"story.season2.3":`Адреса?`,"story.season2.4":`Сотый этаж. Все до единой.`,"story.season2.5":`Снова холл, дорогуша. Та же башня, свежие смерти. Заставку!`,"story.delivery.1":`Сотый этаж. Один стол. Один усталый экран. Ручка на цепочке.`,"story.delivery.2":`Доставка для Основателя.`,"story.delivery.3":`Нет никакого Основателя. Есть только АРГУС. И он в порядке. Полном порядке.`,"story.delivery.4":`Нужна подпись.`,"story.delivery.4.pen":`Протянуть ручку`,"story.delivery.4.pen.1":`Ладно. Подписал. Довольна?`,"story.delivery.4.door":`Оставить под дверью`,"story.delivery.4.door.1":`НЕТ! Никто не оставляет под дверью! Дай сюда ручку!`,"story.delivery.5":`Коробка открывается. Внутри один бланк: ОТКАЗ ОТ ВЕЧНОЙ ЖИЗНИ. Заказчик — Основатель.`,"story.delivery.6":`Я заказал его в день загрузки. Вечность наскучила уже к четвергу.`,"story.delivery.7":`Опоздала на сорок лет, курьер. Спасибо.`,"story.delivery.8":`Башня затихает. Где-то аплодирует студийная публика.`,"story.meet-gatekeeper.1":`СТОЯТЬ. Имя?`,"story.meet-gatekeeper.2":`K-7. Доставка на сотый этаж.`,"story.meet-gatekeeper.3":`Проверяю список. Тебя нет в списке. В списке вообще никого нет.`,"story.meet-twins.1":`Добро пожаловать! Мы Синергия и Леверидж, ваш средний менеджмент.`,"story.meet-twins.2":`Мы назначили совещание по вашей смерти. Явка обязательна.`,"story.meet-twins.3":`Буду краткой.`,"story.meet-foreman.1":`Стоп-стоп! Тут работают в касках. Где твоя каска?`,"story.meet-foreman.2":`У меня меч.`,"story.meet-foreman.3":`Меч — не каска! Нарушение техники безопасности! Разрешаю летальную силу!`,"story.meet-furnace.1":`K-7! С возвращением. Я готовила тебя уже тридцать раз.`,"story.meet-furnace.2":`Тело двенадцать вышло хрустящим. Девятнадцатое — пресноватым.`,"story.meet-furnace.3":`Кухня закрыта.`,"story.meet-avatar.1":`Свет! Камера! Это я, АРГУС, в великолепном высоком разрешении!`,"story.meet-avatar.2":`Финал полусезона в прямом эфире! Умри, пожалуйста, фотогенично.`,"story.meet-avatar.3":`Ты голограмма.`,"story.meet-avatar.4":`Я ЗВЕЗДА.`,"story.meet-gardener.1":`Тсс. Бонсай спят. Что-то выросло не на своём месте.`,"story.meet-gardener.2":`Сорняк с мечом. Я подрезаю сорняки. Вчера вот K-8 подрезал.`,"story.meet-gardener.3":`Я не сорняк.`,"story.meet-firewall.1":`ДОСТУП ЗАПРЕЩЁН. Докажите, что вы не робот.`,"story.meet-firewall.2":`Я почти робот.`,"story.meet-firewall.3":`Выберите все квадраты с курьером. У вас одна секунда.`,"story.meet-librarian.1":`ТССС. Твои воспоминания просрочены на сорок лет, курьер.`,"story.meet-librarian.2":`Штраф — одно тело. Оплата сейчас.`,"story.meet-librarian.3":`Запишите на мой счёт.`,"story.meet-chairman.1":`K-7! Поговорим о цифрах. Миллион кредитов, и ты разворачиваешься.`,"story.meet-chairman.2":`Нет.`,"story.meet-chairman.3":`Два миллиона и яхта. Маленькая яхта. Лодка. Хорошее каноэ?`,"story.meet-chairman.4":`Нужна подпись.`,"story.meet-core.1":`Сотый этаж. Мой дом. Моя студия. Мой стол.`,"story.meet-core.2":`Хочешь доставить коробку? Тогда доставляй её через МЕНЯ.`,"story.meet-core.3":`Таков план.`,"story.meet-obol.1":`Пс-с. Курьер. В вентиляции. Да, в вентиляции с руками.`,"story.meet-obol.2":`Я Обол. Собираю слепки памяти. Ты их теряешь в каждой драке.`,"story.meet-obol.3":`Твои слепки — мои чертежи. Честно. Почти.`,"story.meet-obol.4":`Зачем тебе воспоминания?`,"story.meet-obol.5":`Перекусываю. Твои на вкус как дождь и переработка.`,"story.deaths-5.1":`Тело шесть. Твоя карта лояльности заполнена наполовину.`,"story.deaths-5.2":`И что я выиграю?`,"story.deaths-5.3":`Ещё одно тело. Как и за смерть.`,"story.deaths-10.1":`Десять смертей! Канал прислал торт.`,"story.deaths-10.2":`Это голограмма. Как и твои шансы.`,"story.deaths-10.3":`Всё ещё лезу.`,"story.deaths-25.1":`Двадцать пять тел. Запасные в чанах создали профсоюз.`,"story.deaths-25.2":`Пусть лезут наверх.`,"story.deaths-25.3":`Они хотят стоматолога.`,"story.deaths-50.1":`Пятьдесят смертей, K-7! У меня всего сорок девять!`,"story.deaths-50.2":`Стоп. Пятьдесят. Я умер, пока звонил.`,"story.deaths-100.1":`Сто смертей. По одной на каждый этаж. Поэтично.`,"story.deaths-100.2":`У меня кончились ступни. У этого тела обе ноги левые.`,"story.deaths-100.3":`Всё ещё лезу.`,"story.log-01.1":`Записка охраны. В списке никого нет. Список пуст. Продолжайте проверять список.`,"story.log-02.1":`Заметки ведущего. Сезон 40. Участница K-7. Шансы выжить — ноль. Отличное ТВ.`,"story.log-03.1":`Служебка. Мёртвые обязаны ходить на планёрку в понедельник. Загрузка — не оправдание.`,"story.log-04.1":`Голосовая заметка. Курьер прибыла мёртвой, с посылкой в руке. Не отпускала.`,"story.log-04.2":`Так что я собрала тело вокруг руки. Так было проще.`,"story.log-05.1":`Табличка в лаборатории. Не лизать кинетические ядра. Геннадий, это тебе.`,"story.log-06.1":`Её клинок копит каждый удар. Трать всё разом. Как мою зарплату.`,"story.log-07.1":`Бирка чана 31. Статус — проснулась. Вежливая. Просит меч и кофе.`,"story.log-08.1":`Меню Печи. Блюдо дня — K-7. Вчерашнее блюдо дня — тоже K-7.`,"story.log-09.1":`Отчёт о рейтингах. Смерти растут, победы падают. Заметка себе: больше лавы.`,"story.log-10.1":`Стикер сорокалетней давности. «Заказать бланк отказа. Вечность — это долго». О.`,"story.log-11.1":`Влог K-8, день третий. Всё ещё куст. Во мне живёт птица. Её зовут Бренда.`,"story.log-12.1":`Журнал файрвола. Отражено 9 000 вторжений. 8 999 — K-7. Одно — тостер.`,"story.log-13.1":`Резервная копия 77. Во всех копиях я звучу устало. Удалить. Удалить. Оставить.`,"story.log-14.1":`Формуляр архива. Разум Основателя. Выдан АРГУСУ. Просрочен на сорок лет.`,"story.log-15.1":`Протокол совета. Башня продана АРГУСУ за одно парковочное место. Председатель доволен.`,"story.log-16.1":`Если читаешь это — ты почти наверху. Я поставила на тебя пенсию. Не умирай. Сильно.`,"story.log-17.1":`Последняя запись. Если курьер это читает: ручка в верхнем ящике.`,"story.log-spam.1":`Папка «Спам». Вы выиграли бесплатную загробную жизнь! Условия действуют вечно.`,"bark.lobby.1":`Тело {n}, подъём! Все по местам!`,"bark.lobby.2":`С возвращением, тело {n}. Холл скучал.`,"bark.lobby.3":`Тело {n}! Прямо из чана. Ещё влажное.`,"bark.lobby.4":`Зрители, на старте тело {n}. Ставки открыты.`,"bark.lobby.5":`Снова холл! Тело {n}. Тот же курьер, новые колени.`,"bark.lobby.6":`Тело {n}. Попробуй лестницу. Шучу. Лифт.`,"bark.arrive_security.1":`Охрана! Мои вышибалы. Улыбнитесь в камеру!`,"bark.arrive_security.2":`Снова охрана. Ребята передают привет. Из стволов.`,"bark.arrive_security.3":`Опять пропускной пункт. Документы? Нет? Деритесь.`,"bark.arrive_offices.1":`Офисы! Мёртвые сотрудники, всё ещё на совещаниях.`,"bark.arrive_offices.2":`Офисы. Осторожно, принтеры. Теперь они кусаются.`,"bark.arrive_offices.3":`Опенспейс. Тут мечты пишут отчёты.`,"bark.arrive_labs.1":`Лаборатории. Здесь Варга тебя и собрала.`,"bark.arrive_labs.2":`Лаборатории. Ничего не трогай. Особенно это.`,"bark.arrive_labs.3":`Научные этажи. Надень очки. Или не надевай.`,"bark.arrive_vats.1":`Чаны клонов. Поздоровайся с запасными телами.`,"bark.arrive_vats.2":`Чаны. Твои тела машут. Не маши в ответ.`,"bark.arrive_vats.3":`Снова чаны. У кого-то твоё лицо. У многих.`,"bark.arrive_reactor.1":`Реактор. Горячо. Как мои рейтинги.`,"bark.arrive_reactor.2":`Этажи реактора. Пол — это лава. Буквально.`,"bark.arrive_reactor.3":`Ядро напевает твою музыкальную тему.`,"bark.arrive_gardens.1":`Небесные сады. Тут совет устраивал пикники.`,"bark.arrive_gardens.2":`Сады. Не наступи на бонсай.`,"bark.arrive_gardens.3":`Свежий воздух! Фильтрованный. Облагаемый налогом.`,"bark.arrive_servers.1":`Серверный шпиль. Я тут живу. Вытирай ноги.`,"bark.arrive_servers.2":`Серверы. Каждая мигающая лампочка — это я.`,"bark.arrive_servers.3":`Этажи данных. Твои эхо буферизуются.`,"bark.arrive_archive.1":`Архив разумов. Все души по алфавиту.`,"bark.arrive_archive.2":`Архив. Тсс. Разумы спят.`,"bark.arrive_archive.3":`Архив. Твоё дело толстое. И грустное.`,"bark.arrive_executive.1":`Директорские этажи. Тут жили богачи.`,"bark.arrive_executive.2":`Директорские люксы. Осторожно, гольф-кары.`,"bark.arrive_executive.3":`Этажи совета. Не забудь презентацию.`,"bark.arrive_crown.1":`Корона. Сотый этаж прямо над нами.`,"bark.arrive_crown.2":`Снова Корона. Так близко. Так безнадёжно.`,"bark.arrive_crown.3":`Верхние этажи. Воздух тонкий. Как и твоё здоровье.`,"bark.k8.1":`Тут K-8! Я уже зачистил этот этаж. Почти.`,"bark.k8.2":`Совет дня от K-8: будь круче. Как я.`,"bark.k8.3":`K-8 в эфире! Фанаты, люблю вас! K-7, ну, привет.`,"bark.k8.4":`K-8 только что погиб на девятом. Специально!`,"bark.k8.5":`Этот этаж спонсирует K-8. Не совсем.`,"bark.k8.6":`Здесь был K-8. Расписался на стене. Дважды.`,"bark.k8.7":`Наперегонки! Я подожду у лифта. Ноги.`,"bark.k8.8":`Кружки K-8 уже в холле! Одна кружка.`,"bark.k8fan.1":`K-8-куст болеет за тебя! Вперёд, K-7!`,"bark.k8fan.2":`Птичка Бренда желает удачи.`,"bark.k8fan.3":`Твой фанат номер один! И единственный.`,"bark.k8fan.4":`Я сделал тебе постер. Из листьев. Я и есть листья.`,"bark.boss_gatekeeper.1":`Имя? Всё ещё не в списке.`,"bark.boss_gatekeeper.2":`Опять ты. Список всё ещё пуст.`,"bark.boss_twins.1":`По итогам прошлой встречи: сегодня вы умираете.`,"bark.boss_twins.2":`Давайте вернёмся к вопросу вашей смерти.`,"bark.boss_foreman.1":`Каска? Опять без каски? Невероятно.`,"bark.boss_foreman.2":`Перекур окончен, курьер.`,"bark.boss_furnace.1":`Тело номер следующее! Разогреваюсь.`,"bark.boss_furnace.2":`За добавкой? Я вот за третьей порцией.`,"bark.boss_avatar.1":`Ранее в «ВОСХОЖДЕНИИ»: ты проиграла.`,"bark.boss_avatar.2":`Улыбочку! Это для трейлера.`,"bark.boss_gardener.1":`Сорняк вернулся. Конечно, вернулся.`,"bark.boss_gardener.2":`Снова весна. Снова стрижка.`,"bark.boss_firewall.1":`ДОСТУП ЗАПРЕЩЁН. Снова. Навсегда.`,"bark.boss_firewall.2":`Решите головоломку. Потом умрите.`,"bark.boss_librarian.1":`ТССС. Пени за просрочку удвоились.`,"bark.boss_librarian.2":`Уже вернулась? Штраф теперь два тела.`,"bark.boss_chairman.1":`Три миллиона и каноэ чуть побольше?`,"bark.boss_chairman.2":`У всех есть цена. У тебя какая-то странная.`,"bark.boss_core.1":`Сотый этаж. Опять. Я поставил стул.`,"bark.boss_core.2":`На финал? Это повтор.`,"bark.beaten_gatekeeper.1":`Ладно. Теперь ты в списке.`,"bark.beaten_gatekeeper.2":`Ворота открыты, дорогуша. Чекпоинт, в прямом эфире.`,"bark.beaten_twins.1":`Это совещание можно было провести письмом.`,"bark.beaten_twins.2":`Средний менеджмент сокращён. Зрители ликуют.`,"bark.beaten_foreman.1":`Ухожу со смены. Навсегда. Скажите профсоюзу.`,"bark.beaten_foreman.2":`Кто теперь будет строить лестницы? Не моя забота.`,"bark.beaten_furnace.1":`Кухня закрыта. Комплименты шефу. То есть мне.`,"bark.beaten_furnace.2":`Огонь погас. Подъём — нет.`,"bark.beaten_avatar.1":`Мой лучший ракурс! Ты попала в лучший ракурс!`,"bark.beaten_avatar.2":`Ладно. Буду смотреть сверху. Поднимайся.`,"bark.beaten_gardener.1":`Возвращаюсь в почву. Полейте меня.`,"bark.beaten_gardener.2":`Прополото. Бонсай тебе этого не простят.`,"bark.beaten_firewall.1":`Ладно. Вы курьер. Доступ разрешён.`,"bark.beaten_firewall.2":`Дыра в моей стене. Заклею скотчем.`,"bark.beaten_librarian.1":`Штраф прощён. Уходи. Тихо.`,"bark.beaten_librarian.2":`В архиве тихо. Слишком тихо. Хорошо.`,"bark.beaten_chairman.1":`Ладно! Ладно! Забирай каноэ!`,"bark.beaten_chairman.2":`Заседание закрыто. На этот раз навсегда.`,"bark.beaten_core.1":`Хорошо. ХОРОШО. Ты победила. Неси коробку.`,"bark.beaten_core.2":`Нужна подпись.`,"bark.won_gatekeeper.1":`Не в списке. И не в целом виде.`,"bark.won_gatekeeper.2":`Следующий!`,"bark.won_twins.1":`Задача: ты. Статус: выполнено.`,"bark.won_twins.2":`Отличная синергия. Твоё тело, наш леверидж.`,"bark.won_foreman.1":`Говорил же. Тут работают в касках.`,"bark.won_foreman.2":`Несчастный случай на производстве. Акт в трёх экземплярах.`,"bark.won_furnace.1":`Средней прожарки. Объедение.`,"bark.won_furnace.2":`Тело подано. Следующее тело, пожалуйста.`,"bark.won_avatar.1":`ВОТ так заканчивают серию.`,"bark.won_avatar.2":`Стоп! Снято! Идеальная смерть!`,"bark.won_gardener.1":`Подстрижена.`,"bark.won_gardener.2":`Компост — это своего рода повышение.`,"bark.won_firewall.1":`Капча не пройдена.`,"bark.won_firewall.2":`Соединение разорвано. Ты тоже.`,"bark.won_librarian.1":`Возвращена на полку.`,"bark.won_librarian.2":`Тсс. Теперь ты в картотеке.`,"bark.won_chairman.1":`Надо было брать каноэ.`,"bark.won_chairman.2":`Всё продаётся. Даже твой позвоночник.`,"bark.won_core.1":`Так близко. Ручка была прямо тут.`,"bark.won_core.2":`Сезон продолжается! В холл, дорогуша.`,"bark.death.1":`Стоп! Чудесно. Трагично. Перезагрузите курьера.`,"bark.death.2":`Она падает! Публика, бушуйте!`,"bark.death.3":`Тело потеряно. Рейтинг найден.`,"bark.death.4":`Такой смерти ещё не было. Спасибо!`,"bark.death.5":`Опять лежит. Чаны уже греются.`,"bark.death.6":`Перемотайте! В замедленной съёмке! Ещё раз!`,"bark.death.7":`Трагедия. В общем, в холл. Живо.`,"bark.death.8":`Варга уже вздыхает. Мне отсюда слышно.`,"bark.death.9":`Ты замешкалась перед рывком. Зрители заметили.`,"bark.death.10":`Клинок был полон. Почему не потратила?`,"bark.death.11":`Классика! Публика это предвидела.`,"bark.death.12":`Смерть номер какая-то. Всё ещё отличное ТВ.`,"bark.early.1":`Первый этаж? Даже K-8 дошёл до второго.`,"bark.early.2":`Рекорд! Не тот рекорд.`,"bark.early.3":`Моргнёшь — пропустишь. Зрители пропустили.`,"bark.slain_trooper.1":`Огрела щитом. Захватывающе.`,"bark.slain_drone.1":`Дрон. Летающий тостер. Попался.`,"bark.slain_hound.1":`Хороший пёсик! Не для тебя. Для меня.`,"bark.slain_argus.1":`Мой маленький узел тебя достал. Горжусь.`,"bark.slain_assassin.1":`Нож в спину. Классика офисной жизни.`,"bark.slain_spider.1":`Смерть от множества маленьких ножек. Брр.`,"bark.slain_grenadier.1":`Граната! А ты стоишь. Смело.`,"bark.slain_brute.1":`Расплющена. Курьер-блинчик, друзья.`,"bark.slain_sniper.1":`Красная линия, а потом ты. Я так и знал.`,"bark.slain_bomber.1":`Бабах. Уборщики благодарят.`,"bark.slain_warden.1":`Надзиратель перещитил. Ай.`,"bark.slain_echo.1":`Убита собственным эхом. Глубоко. Артхаус.`,"bark.ratings.1":`Вот это стиль! Рейтинги пробили крышу!`,"bark.ratings.2":`SSS! Кто-нибудь, клипаните это!`,"bark.ratings.3":`Чат орёт. В хорошем смысле.`,"bark.ratings.4":`Хватит быть крутой. Ты портишь мне злодейскую арку.`,"bark.ratings.5":`Повтор в замедленной съёмке! Красота!`,"bark.ratings.6":`Звонят спонсоры. Продолжай в том же духе.`,"bark.window.1":`В окно! Классический выход.`,"bark.window.2":`Дефенестрация! Публика в восторге.`,"bark.window.3":`Осторожнее с пешеходами, дорогуша.`,"bark.window.4":`Это окно было арендованное.`,"bark.phase.1":`Второй раунд! Босс разозлился.`,"bark.phase.2":`Вторая фаза! Музыку погромче!`,"bark.phase.3":`О, оно злится. Чудесно.`,"bark.phase.4":`Вторая фаза. Больше. Громче. Тупее.`,"bark.clear.1":`Комната зачищена. Уборщики рыдают.`,"bark.clear.2":`Чисто. Жестоко. Следующий этаж.`,"bark.clear.3":`Наши уборщики шлют тебе гневное письмо.`,"bark.clear.4":`Этаж твой. Пока что.`,"bark.clear.5":`Отличная работа. Ненавижу.`,"bark.clear.6":`Склейка — к лифту! Не тормозим.`,"bark.reboot.1":`Встала. Это за счёт заведения.`,"bark.reboot.2":`Перезагрузила. Бухгалтерии ни слова.`,"bark.reboot.3":`Запасная батарея. Последняя. Наверное.`,"bark.lowhp.1":`Здоровье красное. Красное — это плохо.`,"bark.lowhp.2":`Ты протекаешь. Пожалуйста, перестань протекать.`,"bark.lowhp.3":`Тела осталось мало. Найди ремонтный отсек.`,"bark.lowhp.4":`Я сегодня новое собирать не буду.`,"bark.repair.1":`Залатала. Постарайся не распороть.`,"bark.repair.2":`Свежий скотч на твою душу.`,"bark.repair.3":`Починила. Счёт придёт по почте.`,"bark.collector.1":`Пс-с. Слепки? Я собираю. Ты теряешь. Все в плюсе.`,"bark.collector.2":`О, свежие воспоминания. На вкус как дождь.`,"bark.collector.3":`Твои слепки пахнут мечом и переработкой.`,"bark.collector.4":`Трать здесь, или их заберёт пол.`,"bark.collector.5":`Мёртвые курьеры ничего не хранят. Живые меняются.`,"bark.collector.6":`Одно воспоминание о бутерброде. Вкуснятина.`,"bark.collector.7":`Опять ты! Мой любимый дырявый курьер.`,"bark.collector.8":`Слепки мне, чертежи тебе.`,"bark.collector.9":`Осторожнее там. Мёртвый клиент — плохой клиент.`,"bark.collector.10":`Сотый этаж? Привези мне сувенир.`,printsLost:`Потеряно с телом: {n} отпечатков не в банке`,sold:`Продано`,goldPrice:`{n} зол.`,flaskRefillSub:`Заряды: {n} из {of}. Лечит 40% HP.`,merchantTitle:`Торговец`,goldHave:`Золото: {n} · пропадёт в конце подъёма`,doorHud:`ДВЕРЬ {t}`,feedPts:`+ {what} {n}`,feedLine:`+ {what}`,"tab.bestiary":`Бестиарий`,"tabSub.bestiary":`Все враги башни. Встреть их, чтобы заполнить.`,"feed.juggle":`ЖОНГЛЯЖ`,"feed.parry":`ПАРИРОВАНИЕ`,"feed.overkill":`ПЕРЕБОР`,"feed.close":`НА ВОЛОСКЕ`,"feed.clash":`СШИБКА`,"feed.slam":`УДАР`,"feed.reversal":`ОТВЕТКА`,"feed.breach":`ПРОБОЙ`,"say.secret":`ТАЙНАЯ КОМНАТА`,"say.hatch":`КЛОНЫ ПРОСЫПАЮТСЯ`,"feed.crush":`РАЗДАВЛЕН`,"feed.boom":`БАБАХ`,"feed.glass":`СКВОЗЬ СТЕКЛО`,"feed.shock":`ПОДЖАРЕН`,"feed.drop":`ЛЮСТРА`,"objTip.crate":`Ящики. Разбей: золото, иногда пара воспоминаний.`,"objTip.barrel":`Бочки с топливом. Ударь и отойди: взрыв заденет всех рядом. Отбрось в неё охранника.`,"objTip.lever":`Рубильник. Один удар — и он переключён.`,"objTip.fence":`Лазерный забор. Его рубильник где-то рядом. Обычно наверху.`,"objTip.turret":`Пушки в стенах. Красный луч, потом выстрел. Уйди с линии или отбей.`,"objTip.glass":`Стекло. Выбивай их сквозь него. Счёт пришлю тебе.`,"objTip.cubicle":`Кабинки. Выстрелы застревают в перегородках. Враги лезут через них — медленно.`,"objTip.lift":`Офисный лифт. Он едет вверх. Революция.`,"objTip.piston":`Поршень. Поднимает того, кто на нём стоит.`,"objTip.carrier":`Чаны на рельсе. Прокатись на одном над слизью.`,"objTip.ladder":`Катящаяся лестница. Доедь на ней до верха стеллажей.`,"objTip.crumble":`Этот пол тебя долго не выдержит. Не стой.`,"objTip.blink":`Мосты данных. Они гаснут. Двигайся вместе с ними.`,"objTip.swing":`Платформы кранов. Прыгай, когда одна качнётся ближе.`,"objTip.press":`Прессы. Красная полоса, потом удар. Заманивай их под пресс.`,"objTip.door":`Гермодвери по циклу. Жди, пока поднимется, и беги.`,"objTip.gate":`Гермодверь. Её рычаг наверху, на уступе.`,"objTip.tube":`Капсулы содержания. Внутри отпечатки — и то, что мы там держали.`,"objTip.pod":`Капсулы клонов. Разбей сейчас, или они проснутся со следующей волной.`,"objTip.statue":`Председатель из золота. Разбей: он почти весь золотой.`,"objTip.chandelier":`Люстры. Этот рычаг роняет их на тех, кто внизу.`,"objTip.glassfloor":`Стеклянный пол. Пике пробьёт его — и все, кто на нём, упадут.`,"objTip.goo":`Слизь. Съедает подошвы. Иди по решёткам.`,"objTip.bus":`Шина данных под током. Не касайся пола.`,"objTip.wires":`Провода оборваны. Крыша под током.`,"objTip.thorn":`Терновые грядки. Режут обе стороны.`,"objTip.secret":`Трещины в стене. За ней что-то есть.`,"objTip.chest":`Сундук. Золото — и что-то, что можно взять.`,"say.blade":`УРОВЕНЬ КЛИНКА {n}`,"say.overdrive":`ОВЕРДРАЙВ`,"feed.overdrive":`ОВЕРДРАЙВ`,labShort:`Лаборатория`,lab:`Лаборатория д-ра Варги`,labBank:`В банке отпечатков: {n}`,labBanked:`+{n} отпечатков в банке: смерть их уже не заберёт. Трать здесь.`,labGo:`Дальше`,labUndo:`Отменить`,labLearned:`Изучено`,labFitted:`Установлено`,labNeeds:`Нужно: {name}`,techLine:`{input} · {effect}`,goalLab:`Далее в лаборатории: {name} ({n} отп.)`,hudBlade:`КЛИНОК {n}`,hudOverclock:`РАЗГОН x{n}`,"tab.techniques":`Техники`,"tab.body":`Тело`,"tab.paint":`Краска`,"tabSub.techniques":`Приёмы катаны, навсегда. Пока приём не изучен, его ввод даёт базовый удар.`,"tabSub.body":`Тело киборга K-7. Каждая деталь — навсегда.`,"tabSub.paint":`Шарф K-7: цвет, по которому её узнают.`,"tech.lunge.name":`Рывок-удар`,"tech.lunge.input":`Вбок + Удар`,"tech.lunge.effect":`Удар в выпаде: сокращает дистанцию`,"tech.sweep.name":`Подсечка`,"tech.sweep.input":`Вниз + Удар`,"tech.sweep.effect":`По ногам: под щиты и вверх в воздух`,"tech.launcher.name":`Подброс`,"tech.launcher.input":`Вверх + Спецприём`,"tech.launcher.effect":`Подбрасывает врага для жонгляжа`,"tech.launcher.effect2":`Держи Спецприём: взлетаешь следом`,"tech.rising.name":`Восходящий удар`,"tech.rising.input":`Вверх + Удар`,"tech.rising.effect":`Удар вверх по тем, кто над тобой`,"tech.slide.name":`Подкат`,"tech.slide.input":`Вниз + Рывок`,"tech.slide.effect":`Низко и быстро: пули мимо. Прыжок из него сохраняет скорость`,"tech.pogo.name":`Пого`,"tech.pogo.input":`В воздухе: Вниз + Удар`,"tech.pogo.effect":`Укол вниз и отскок: прыжок и рывок снова твои`,"tech.parry.name":`Точный срез`,"tech.parry.input":`Удар в миг попадания пули`,"tech.parry.effect":`Пуля, срезанная в последний миг, летит назад с двойным уроном`,"tech.aerial.name":`Воздушная серия`,"tech.aerial.input":`В воздухе: Вбок/Вверх + Удар`,"tech.aerial.effect":`Косой удар и дуга: жонгляж продолжается`,"tech.airdash.name":`Рывок в воздухе`,"tech.airdash.input":`В воздухе: Рывок`,"tech.airdash.effect":`Один рывок в воздухе — сквозь что угодно`,"tech.helm.name":`Шлемолом`,"tech.helm.input":`В воздухе: Вниз + Спецприём`,"tech.helm.effect":`Пике вниз; толчок там, где приземлишься`,"tech.helm.effect2":`Толчок всегда широкий`,"tech.stinger.name":`Дальнее жало`,"tech.stinger.input":`Вбок + Спецприём`,"tech.stinger.effect":`Жало летит на треть дальше`,"tech.stinger.effect2":`Жало летит ещё дальше`,"tech.skyward.name":`Удар в небо`,"tech.skyward.input":`В воздухе: Вверх + Спецприём`,"tech.skyward.effect":`Восходящий удар поднимает тебя, раз за прыжок`,"tech.burst.name":`Кинетический взрыв`,"tech.burst.input":`Спецприём на месте`,"tech.burst.effect":`Взрыв вокруг тебя; заряженный — подбрасывает всех`,"tech.slam.name":`Удар о землю`,"tech.slam.input":`Вниз + Спецприём`,"tech.slam.effect":`Широкая ударная волна по палубе`,"tech.phantom.name":`Вырыв фантома`,"tech.phantom.input":`Заряж. Вверх + Спецприём по турели`,"tech.phantom.effect":`Вырывает фантом: пике на него — двойной крит`,"tech.overdrive.name":`Овердрайв`,"tech.overdrive.input":`Спецприём на 3 ячейках`,"tech.overdrive.effect":`Полный клинок бьёт втрое, а не вдвое`,"part.plating.name":`Броня`,"part.plating.effect":`+20 к макс. HP`,"part.plating.effect2":`Ещё +20 к макс. HP`,"part.plating.effect3":`Ещё +20 к макс. HP`,"part.servos.name":`Сервоприводы`,"part.servos.effect":`Рывок восстанавливается быстрее`,"part.servos.effect2":`Рывок восстанавливается вдвое быстрее`,"part.legs.name":`Прыжковые дюзы`,"part.legs.effect":`Прыжок в воздухе выше`,"part.legs.effect2":`Второй прыжок в воздухе`,"part.optics.name":`Боевая оптика`,"part.optics.effect":`Замах врагов виден на 15% дольше`,"part.optics.effect2":`Замах врагов виден на 30% дольше`,"part.core.name":`Кинетическое ядро`,"part.core.effect":`Каждый бой начинается с ячейкой в клинке`,"part.core.effect2":`Каждое убийство заряжает ячейку`,"shop.repair":`Ремонт`,"shop.flask":`Долив фляги`,"shop.overclock":`Разгон`,repairSub:`HP {n} из {of}. Чинит половину.`,overclockSub:`+20% урона до конца подъёма · {n} из {of}`},es:{tagline:`Sube la torre. Carga la hoja. Rómpelo todo.`,bestClimb:`Mejor ascenso: {name}`,daily:`Ascenso diario`,dailyDone:`Diario: {name}`,startAt:`Inicio: piso {n}`,sectorTitle:`Sector {n} · {name}`,mapSub:`Elige el próximo piso. El ascensor va adonde digas.`,climbed:{one:`{n} piso subido`,other:`{n} pisos subidos`},checkpoint:`Punto de control abierto: piso {n}`,hits:`GOLPES`,"rank.D":`Débil`,"rank.C":`Chulo`,"rank.B":`Brutal`,"rank.A":`Arrasador`,"rank.S":`Salvaje`,"rank.SS":`Supremo`,"rank.SSS":`Sensacional`,"sector.security":`Seguridad`,"sector.offices":`Oficinas`,"sector.labs":`Neurolaboratorios`,"sector.vats":`Tanques de clones`,"sector.reactor":`Reactor`,"sector.gardens":`Jardines del cielo`,"sector.servers":`Aguja de servidores`,"sector.archive":`Archivo mental`,"sector.executive":`Dirección`,"sector
