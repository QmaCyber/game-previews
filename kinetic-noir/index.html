dirigido: sus disparos te siguen`,"aff.medic.effect":`Médico: cura a los demás. Mátalo primero`,"aff.cloak.effect":`Camuflaje: invisible hasta que te acercas`,"aff.burn.effect":`Ardiente: deja fuego donde pisa`,"aff.shock.effect":`Descarga: no lo toques`,"aff.rage.effect":`Furia: herido, se acelera`,"aff.regen.effect":`Regen: se cura si lo dejas`,"aff.split.effect":`División: estalla en arañitas`,"aff.volatile.effect":`Volátil: explota al morir`,"aff.magnet.effect":`Imán: arrastra a los demás hacia él`,"aff.ghost.effect":`Fantasma: los tajos lo atraviesan a ratos`,"aff.blink.effect":`Parpadeo: tras tres golpes, desaparece`,"aff.frost.effect":`Escarcha: sus disparos golpean más`,"aff.bounty.effect":`Recompensa: atrápalo y da el cuádruple de huellas`,"story.pilot.1":`¡Estamos EN DIRECTO! ¡Bienvenidos a LA ESCALADA, el show de muertes favorito de la torre!`,"story.pilot.2":`Cuerpo dos, en línea. No rompas este, K-7. Te lo voy a cobrar.`,"story.pilot.3":`El paquete va al piso cien. Se requiere firma.`,"story.pilot.4":`¡Una mensajera con plazo de entrega! Espectadores, hagan sus apuestas.`,"story.upgrade.1":`El público dice que mueres demasiado callada, K-7. La cadena envió un reemplazo.`,"story.upgrade.2":`¡K-8! ¡Más rápido! ¡Más brillante! ¡Patrocinado por Pasta Proteica!`,"story.upgrade.3":`Tranqui, K-7. Yo entrego tu cajita. Autógrafos después.`,"story.upgrade.4":`Mi paquete.`,"story.upgrade.5":`Uy, conflicto. La audiencia sube un cuatro por ciento.`,"story.package.1":`K-7, ¿qué HAY en ese paquete? Zumba.`,"story.package.2":`No es asunto mío. La entrega sí.`,"story.package.3":`El albarán dice: «Al Fundador, piso 100. Pedido hace cuarenta años».`,"story.package.4":`¿Cuarenta años? ¿El Fundador? Siguiente pregunta. ¡Pausa publicitaria!`,"story.sweeps.1":`Sigues GANANDO. ¿Sabes qué hace ganar por la audiencia? ¡Nada!`,"story.sweeps.2":`El público quiere drama. Lágrimas. Una caída desde una ventana muy alta.`,"story.sweeps.3":`¡Buenas noticias! K-8 murió en el piso doce. Dos veces. A los fans les encantó.`,"story.sweeps.4":`¿Ves? ESO es una estrella. Aprende de él, K-7.`,"story.sweeps.5":`Anotado. Sigo entregando.`,"story.spares.1":`Viste las cubas. Sí, todas son tú. No, no puedes ponerles nombre.`,"story.spares.2":`¿Cuántas?`,"story.spares.3":`Suficientes. Cada vez que mueres, te vierto en una nueva. Como sopa, pero más triste.`,"story.spares.4":`Tu factura está en el mostrador. Vence en una vida.`,"story.founder.1":`Conociste a mi avatar. Precioso, ¿verdad? Lo diseñé a imagen del Fundador.`,"story.founder.2":`¿Dónde está el Fundador?`,"story.founder.3":`De vacaciones. Largas. Cuarenta años. Deja de preguntar. ¡Pausa publicitaria!`,"story.founder.4":`Otra vez «pausa publicitaria». Siempre lo dice cuando miente.`,"story.fanmail.1":`Oye. K-7. El Jardinero me podó. Literalmente. Ahora soy un seto.`,"story.fanmail.2":`La cadena me canceló. Dijeron que era demasiado reemplazable. ¡Yo!`,"story.fanmail.3":`Así que ahora soy tu fan. ¿Póster firmado? ¿No? Lo haré igual.`,"story.fanmail.4":`No te metas en mis pisos.`,"story.fanmail.5":`¡Me habló! ¡Chat, me HABLÓ!`,"story.overdue.1":`El archivo guarda cada mente subida en esta torre. Busqué al Fundador.`,"story.overdue.2":`Su estante está vacío. Su mente se prestó hace cuarenta años. A ARGUS.`,"story.overdue.3":`¡Qué grosería! ¡No se lee el carné de biblioteca de un hombre!`,"story.overdue.4":`De un hombre.`,"story.overdue.5":`De una IA. Una IA perfectamente normal. ¡Pausa publicitaria!`,"story.finale.1":`Último sector, K-7. Hagamos un trato. Suelta el paquete y serás presentadora.`,"story.finale.2":`¡Tu propio show! ¡Tu propia frase estrella! ¡Tu propia doble que explota!`,"story.finale.3":`Se requiere firma.`,"story.finale.4":`Eso no es una frase estrella. Es una amenaza.`,"story.season2.1":`¡Última hora! ¡La cadena renovó LA ESCALADA por una segunda temporada!`,"story.season2.2":`La mensajería también encontró treinta mil paquetes perdidos más.`,"story.season2.3":`¿Direcciones?`,"story.season2.4":`Piso cien. Todos y cada uno.`,"story.season2.5":`Al vestíbulo otra vez, cariño. Misma torre, muertes frescas. ¡Cabecera!`,"story.delivery.1":`Piso cien. Un escritorio. Una pantalla cansada. Un bolígrafo con cadena.`,"story.delivery.2":`Entrega para el Fundador.`,"story.delivery.3":`No hay ningún Fundador. Solo está ARGUS. Que está bien. Perfectamente bien.`,"story.delivery.4":`Se requiere firma.`,"story.delivery.4.pen":`Darle el bolígrafo`,"story.delivery.4.pen.1":`Vale. Firmado. ¿Contenta?`,"story.delivery.4.door":`Dejarlo en la puerta`,"story.delivery.4.door.1":`¡NO! ¡Nadie lo deja en la puerta! ¡Dame ese bolígrafo!`,"story.delivery.5":`La caja se abre. Dentro, un formulario: CANCELAR LA VIDA ETERNA. Lo pidió el Fundador.`,"story.delivery.6":`Lo pedí el día que me subí. La eternidad me aburrió el jueves.`,"story.delivery.7":`Cuarenta años tarde, mensajera. Gracias.`,"story.delivery.8":`La torre se queda en silencio. En algún lugar, un público de plató aplaude.`,"story.meet-gatekeeper.1":`ALTO. ¿Nombre?`,"story.meet-gatekeeper.2":`K-7. Entrega para el piso cien.`,"story.meet-gatekeeper.3":`Revisando la lista. No estás en la lista. Nunca hay nadie en la lista.`,"story.meet-twins.1":`¡Bienvenida! Somos Sinergia y Apalancamiento, tus mandos intermedios.`,"story.meet-twins.2":`Convocamos una reunión sobre tu muerte. La asistencia es obligatoria.`,"story.meet-twins.3":`Seré breve.`,"story.meet-foreman.1":`¡Eh, eh! Zona de casco obligatorio. ¿Dónde está tu casco?`,"story.meet-foreman.2":`Tengo una espada.`,"story.meet-foreman.3":`¡Eso no es un casco! ¡Infracción de seguridad! ¡Fuerza letal autorizada!`,"story.meet-furnace.1":`¡K-7! Bienvenida otra vez. Ya te he cocinado treinta veces.`,"story.meet-furnace.2":`El cuerpo doce salió crujiente. El diecinueve, algo soso.`,"story.meet-furnace.3":`La cocina está cerrada.`,"story.meet-avatar.1":`¡Luces! ¡Cámara! ¡Soy yo, ARGUS, en gloriosa alta definición!`,"story.meet-avatar.2":`¡El final de mitad de temporada, en directo! Intenta morir con estilo.`,"story.meet-avatar.3":`Eres un holograma.`,"story.meet-avatar.4":`Soy una ESTRELLA.`,"story.meet-gardener.1":`Shh. Los bonsáis duermen. Algo creció donde no debía.`,"story.meet-gardener.2":`Una mala hierba con espada. Podo malas hierbas. Ayer podé a un K-8.`,"story.meet-gardener.3":`No soy una mala hierba.`,"story.meet-firewall.1":`ACCESO DENEGADO. Demuestra que no eres un robot.`,"story.meet-firewall.2":`Soy casi un robot.`,"story.meet-firewall.3":`Selecciona todas las casillas con una mensajera. Tienes un segundo.`,"story.meet-librarian.1":`SHHH. Tus recuerdos llevan cuarenta años de retraso, mensajera.`,"story.meet-librarian.2":`La multa es un cuerpo. Se paga ahora.`,"story.meet-librarian.3":`Apúntalo en mi cuenta.`,"story.meet-chairman.1":`¡K-7! Hablemos de números. Un millón de créditos por dar media vuelta.`,"story.meet-chairman.2":`No.`,"story.meet-chairman.3":`Dos millones y un yate. Un yate pequeño. Un bote. ¿Una canoa bonita?`,"story.meet-chairman.4":`Se requiere firma.`,"story.meet-core.1":`Piso cien. Mi casa. Mi plató. Mi escritorio.`,"story.meet-core.2":`¿Quieres entregar esa caja? Pues tendrás que pasar por MÍ.`,"story.meet-core.3":`Ese es el plan.`,"story.meet-obol.1":`Psst. Mensajera. En el conducto. Sí, el conducto con brazos.`,"story.meet-obol.2":`Soy Óbolo. Colecciono huellas de memoria. Tú las sueltas al pelear.`,"story.meet-obol.3":`Tus huellas por mis planos. Justo, más o menos.`,"story.meet-obol.4":`¿Qué haces con los recuerdos?`,"story.meet-obol.5":`Me los pico. Los tuyos saben a lluvia y horas extra.`,"story.deaths-5.1":`Cuerpo seis. Tu tarjeta de fidelidad va por la mitad.`,"story.deaths-5.2":`¿Y qué gano?`,"story.deaths-5.3":`Otro cuerpo. Lo mismo que por morir.`,"story.deaths-10.1":`¡Diez muertes! La cadena envió una tarta.`,"story.deaths-10.2":`Es un holograma. Como tus posibilidades.`,"story.deaths-10.3":`Sigo subiendo.`,"story.deaths-25.1":`Veinticinco cuerpos. Los de repuesto en las cubas fundaron un sindicato.`,"story.deaths-25.2":`Que suban ellos.`,"story.deaths-25.3":`Quieren seguro dental.`,"story.deaths-50.1":`¡Cincuenta muertes, K-7! ¡Yo solo llevo cuarenta y nueve!`,"story.deaths-50.2":`Espera. Cincuenta. Morí haciendo esta llamada.`,"story.deaths-100.1":`Cien muertes. Una por piso. Poético.`,"story.deaths-100.2":`Me quedé sin pies. Este cuerpo tiene dos izquierdos.`,"story.deaths-100.3":`Sigo subiendo.`,"story.log-01.1":`Nota de Seguridad. No hay nadie en la lista. La lista está vacía. Sigan revisando la lista.`,"story.log-02.1":`Notas del presentador. Temporada 40. Concursante K-7. Probabilidad de sobrevivir, cero. Gran tele.`,"story.log-03.1":`Circular. Los muertos deben asistir a la reunión del lunes. Estar subido no es excusa.`,"story.log-04.1":`Nota de voz. La mensajera llegó muerta, agarrando un paquete. No lo soltaba.`,"story.log-04.2":`Así que construí el cuerpo alrededor de la mano. Era más fácil.`,"story.log-05.1":`Cartel del laboratorio. No lamer los núcleos cinéticos. Va por ti, Gerardo.`,"story.log-06.1":`Su espada guarda cada golpe. Gástalo todo de una vez. Como mi sueldo.`,"story.log-07.1":`Etiqueta de la cuba 31. Estado, despierta. Educada. Pidió una espada y un café.`,"story.log-08.1":`Menú del Horno. Plato del día, K-7. El de ayer también era K-7.`,"story.log-09.1":`Informe de audiencia. Muertes al alza, victorias a la baja. Nota mental: más lava.`,"story.log-10.1":`Una nota adhesiva de hace cuarenta años. «Pedir el formulario. La eternidad es larga». F.`,"story.log-11.1":`Vlog de K-8, día tres. Sigo siendo un seto. Vive un pájaro en mí. Se llama Brenda.`,"story.log-12.1":`Registro del cortafuegos. 9000 intrusos bloqueados. 8999 eran K-7. Uno era una tostadora.`,"story.log-13.1":`Copia de seguridad 77. En todas sueno cansado. Borrar. Borrar. Conservar.`,"story.log-14.1":`Ficha del archivo. Mente del Fundador. Prestada a ARGUS. Cuarenta años de retraso.`,"story.log-15.1":`Acta del consejo. Torre vendida a ARGUS por una plaza de parking. El Presidente, encantado.`,"story.log-16.1":`Si lees esto, ya casi estás arriba. Aposté mi pensión por ti. No te mueras. Mucho.`,"story.log-17.1":`Último registro. Si la mensajera lee esto, el bolígrafo está en el cajón de arriba.`,"story.log-spam.1":`Carpeta de spam. ¡Has ganado una vida eterna gratis! Aplican condiciones para siempre.`,"bark.lobby.1":`¡Cuerpo {n}, arriba! ¡A sus puestos!`,"bark.lobby.2":`Bienvenido, cuerpo {n}. El vestíbulo te echaba de menos.`,"bark.lobby.3":`¡Cuerpo {n}! Recién salido de la cuba. Aún húmedo.`,"bark.lobby.4":`Espectadores, sale el cuerpo {n}. Apuestas abiertas.`,"bark.lobby.5":`¡Vestíbulo otra vez! Cuerpo {n}. Misma mensajera, rodillas nuevas.`,"bark.lobby.6":`Cuerpo {n}. Prueba las escaleras. Es broma. Ascensor.`,"bark.arrive_security.1":`¡Seguridad! Mis gorilas. ¡Sonrían a cámara!`,"bark.arrive_security.2":`Seguridad otra vez. Los guardias saludan. Con armas.`,"bark.arrive_security.3":`De vuelta al control. ¿Papeles? ¿No? A pelear.`,"bark.arrive_offices.1":`¡Las oficinas! Plantilla muerta, aún en reuniones.`,"bark.arrive_offices.2":`Oficinas. Cuidado con las impresoras. Ahora muerden.`,"bark.arrive_offices.3":`Cubículos. Donde los sueños rellenan informes.`,"bark.arrive_labs.1":`Los laboratorios. Aquí te hizo Varga.`,"bark.arrive_labs.2":`Laboratorios. No toques nada. Sobre todo eso.`,"bark.arrive_labs.3":`Pisos de ciencia. Ponte gafas. O no.`,"bark.arrive_vats.1":`Las cubas de clones. Saluda a tus cuerpos de repuesto.`,"bark.arrive_vats.2":`Las cubas. Tus cuerpos saludan. No les devuelvas el saludo.`,"bark.arrive_vats.3":`Cubas otra vez. Alguien tiene tu cara. Muchos.`,"bark.arrive_reactor.1":`El reactor. Caliente. Como mi audiencia.`,"bark.arrive_reactor.2":`Pisos del reactor. Ojo, el suelo es lava.`,"bark.arrive_reactor.3":`El núcleo tararea tu sintonía.`,"bark.arrive_gardens.1":`Jardines del cielo. El consejo hacía pícnics aquí.`,"bark.arrive_gardens.2":`Jardines. No pises los bonsáis.`,"bark.arrive_gardens.3":`¡Aire fresco! Filtrado. Con impuestos. Disfruta.`,"bark.arrive_servers.1":`La aguja de servidores. Vivo aquí. Límpiate los pies.`,"bark.arrive_servers.2":`Servidores. Cada lucecita que parpadea soy yo.`,"bark.arrive_servers.3":`Pisos de datos. Tus ecos están cargando.`,"bark.arrive_archive.1":`El archivo de mentes. Cada alma, por orden alfabético.`,"bark.arrive_archive.2":`El archivo. Shh. Las mentes duermen.`,"bark.arrive_archive.3":`Archivo. Tu expediente es gordo. Y triste.`,"bark.arrive_executive.1":`Los pisos ejecutivos. Aquí vivían los ricos.`,"bark.arrive_executive.2":`Suites ejecutivas. Cuidado con los carritos de golf.`,"bark.arrive_executive.3":`Pisos del consejo. Trae tu presentación.`,"bark.arrive_crown.1":`La Corona. El piso cien está justo encima.`,"bark.arrive_crown.2":`La Corona otra vez. Tan cerca. Tan condenada.`,"bark.arrive_crown.3":`Pisos altos. El aire escasea. Como tu vida.`,"bark.k8.1":`¡Aquí K-8! Ya limpié este piso. Casi.`,"bark.k8.2":`Consejo del día de K-8: sé más guay. Como yo.`,"bark.k8.3":`¡K-8 en directo! ¡Fans, os quiero! K-7, hola, supongo.`,"bark.k8.4":`K-8 acaba de morir en el piso nueve. A propósito.`,"bark.k8.5":`Este piso lo patrocina K-8. No es verdad.`,"bark.k8.6":`K-8 estuvo aquí. Firmó la pared. Dos veces.`,"bark.k8.7":`¡Te echo una carrera! Te espero en el ascensor. Mis piernas.`,"bark.k8.8":`¡Tazas de K-8 ya en el vestíbulo! Es una taza.`,"bark.k8fan.1":`¡K-8 el seto te anima! ¡Vamos, K-7!`,"bark.k8fan.2":`La pájara Brenda te desea suerte.`,"bark.k8fan.3":`¡Tu fan número uno! Y el único.`,"bark.k8fan.4":`Te hice un póster. De hojas. Yo soy hojas.`,"bark.boss_gatekeeper.1":`¿Nombre? Sigues sin estar en la lista.`,"bark.boss_gatekeeper.2":`Tú otra vez. La lista sigue vacía.`,"bark.boss_twins.1":`Según la última reunión, hoy mueres.`,"bark.boss_twins.2":`Retomemos el tema de tu muerte.`,"bark.boss_foreman.1":`¿Casco? ¿Sigues sin casco? Increíble.`,"bark.boss_foreman.2":`Se acabó el descanso, mensajera.`,"bark.boss_furnace.1":`¡Cuerpo número siguiente! Precalentando.`,"bark.boss_furnace.2":`¿Vienes a repetir? Yo voy por la tercera.`,"bark.boss_avatar.1":`Anteriormente, en LA ESCALADA: perdiste.`,"bark.boss_avatar.2":`¡Sonríe! Esta es para el tráiler.`,"bark.boss_gardener.1":`La mala hierba vuelve. Claro que sí.`,"bark.boss_gardener.2":`Primavera otra vez. Poda otra vez.`,"bark.boss_firewall.1":`ACCESO DENEGADO. Otra vez. Para siempre.`,"bark.boss_firewall.2":`Resuelve este acertijo. Luego muere.`,"bark.boss_librarian.1":`SHHH. Tu recargo se ha duplicado.`,"bark.boss_librarian.2":`¿Ya de vuelta? La multa ahora es de dos cuerpos.`,"bark.boss_chairman.1":`¿Tres millones y una canoa un poco más grande?`,"bark.boss_chairman.2":`Todos tienen un precio. El tuyo es raro.`,"bark.boss_core.1":`Piso cien. Otra vez. Te puse una silla.`,"bark.boss_core.2":`¿Vienes al final? Es una reposición.`,"bark.beaten_gatekeeper.1":`Vale. Ya estás en la lista.`,"bark.beaten_gatekeeper.2":`Puerta abierta, cariño. Un punto de control, en directo.`,"bark.beaten_twins.1":`Esta reunión podría haber sido un correo.`,"bark.beaten_twins.2":`Mandos intermedios, recortados. El público aplaude.`,"bark.beaten_foreman.1":`Fichando la salida. Para siempre. Avisad al sindicato.`,"bark.beaten_foreman.2":`¿Quién construye ahora las escaleras? No es mi problema.`,"bark.beaten_furnace.1":`Cocina cerrada. Mis felicitaciones al chef. O sea, a mí.`,"bark.beaten_furnace.2":`El fuego se apagó. La escalada no.`,"bark.beaten_avatar.1":`¡Mi lado bueno! ¡Le diste a mi lado bueno!`,"bark.beaten_avatar.2":`Vale. Lo veré desde arriba. Sube.`,"bark.beaten_gardener.1":`Vuelvo a la tierra. Riégame.`,"bark.beaten_gardener.2":`Desbrozado. Los bonsáis nunca te lo perdonarán.`,"bark.beaten_firewall.1":`Vale. Eres mensajera. Acceso concedido.`,"bark.beaten_firewall.2":`Un agujero en mi muro. Lo taparé con cinta.`,"bark.beaten_librarian.1":`Multa perdonada. Vete. En silencio.`,"bark.beaten_librarian.2":`El archivo está en silencio. Demasiado. Bien.`,"bark.beaten_chairman.1":`¡Vale! ¡Vale! ¡Quédate la canoa!`,"bark.beaten_chairman.2":`Se levanta la sesión. Esta vez para siempre.`,"bark.beaten_core.1":`Vale. VALE. Ganas tú. Trae la caja.`,"bark.beaten_core.2":`Se requiere firma.`,"bark.won_gatekeeper.1":`Ni en la lista ni de una pieza.`,"bark.won_gatekeeper.2":`¡Siguiente!`,"bark.won_twins.1":`Tarea: tú. Estado: completada.`,"bark.won_twins.2":`Gran sinergia. Tu cuerpo, nuestro apalancamiento.`,"bark.won_foreman.1":`Te lo dije. Zona de casco.`,"bark.won_foreman.2":`Accidente laboral. Papeleo por triplicado.`,"bark.won_furnace.1":`Al punto. Delicioso.`,"bark.won_furnace.2":`Cuerpo servido. El siguiente, por favor.`,"bark.won_avatar.1":`Y ASÍ se termina un episodio.`,"bark.won_avatar.2":`¡Corten! ¡Se queda! ¡Una muerte perfecta!`,"bark.won_gardener.1":`Podada.`,"bark.won_gardener.2":`El compost es una especie de ascenso.`,"bark.won_firewall.1":`CAPTCHA fallido.`,"bark.won_firewall.2":`Conexión terminada. Tú también.`,"bark.won_librarian.1":`Devuelta a la estantería.`,"bark.won_librarian.2":`Shh. Ya estás archivada.`,"bark.won_chairman.1":`Debiste aceptar la canoa.`,"bark.won_chairman.2":`Todo está en venta. Hasta tu columna.`,"bark.won_core.1":`Tan cerca. El bolígrafo estaba ahí mismo.`,"bark.won_core.2":`¡La temporada sigue! Al vestíbulo, cariño.`,"bark.death.1":`¡Corten! Maravilloso. Trágico. Reiniciad a la mensajera.`,"bark.death.2":`¡Y cae! ¡Público, a gritar!`,"bark.death.3":`Cuerpo perdido. Audiencia encontrada.`,"bark.death.4":`¡Esa forma de morir es nueva! ¡Gracias!`,"bark.death.5":`Otra vez al suelo. Las cubas se calientan.`,"bark.death.6":`¡Rebobina! ¡A cámara lenta! ¡Otra vez!`,"bark.death.7":`Trágico. En fin, al vestíbulo. Rapidito.`,"bark.death.8":`Varga ya está suspirando. La oigo desde aquí.`,"bark.death.9":`Dudaste antes del impulso. El público lo notó.`,"bark.death.10":`Tu espada estaba llena. ¿Por qué no la gastaste?`,"bark.death.11":`¡Un clásico! El público lo vio venir.`,"bark.death.12":`Muerte número lo que sea. Sigue siendo gran tele.`,"bark.early.1":`¿Piso uno? Hasta K-8 llegó al dos.`,"bark.early.2":`¡Tiempo récord! El récord equivocado.`,"bark.early.3":`Si parpadeas, te lo pierdes. El público se lo perdió.`,"bark.slain_trooper.1":`Un golpe de escudo. Apasionante.`,"bark.slain_drone.1":`Un dron. Una tostadora voladora. Te pilló.`,"bark.slain_hound.1":`¡Buen perro! Para ti no. Para mí.`,"bark.slain_argus.1":`Mi nodito te atrapó. Qué orgullo.`,"bark.slain_assassin.1":`Puñalada por la espalda. Un clásico de oficina.`,"bark.slain_spider.1":`Muerte por muchas patitas. Escalofrío.`,"bark.slain_grenadier.1":`¡Granada! No te moviste. Valiente.`,"bark.slain_brute.1":`Aplastada. Mensajera a la plancha, amigos.`,"bark.slain_sniper.1":`Una línea roja, y luego tú. Lo sabía.`,"bark.slain_bomber.1":`Bum. Los de limpieza te lo agradecen.`,"bark.slain_warden.1":`Un celador te ganó a escudos. Ay.`,"bark.slain_echo.1":`Asesinada por tu propio eco. Profundo. Artístico.`,"bark.ratings.1":`¡Qué estilo! ¡La audiencia por las nubes!`,"bark.ratings.2":`¡SSS! ¡Que alguien grabe eso!`,"bark.ratings.3":`El chat está gritando. Para bien.`,"bark.ratings.4":`Deja de ser guay. Me arruinas el arco de villano.`,"bark.ratings.5":`¡Repetición a cámara lenta! ¡Precioso!`,"bark.ratings.6":`Llaman los patrocinadores. Sigue así.`,"bark.window.1":`¡Por la ventana! Una salida clásica.`,"bark.window.2":`¡Defenestración! Al público le encanta.`,"bark.window.3":`Cuidado con los peatones, cariño.`,"bark.window.4":`Esa ventana era alquilada.`,"bark.phase.1":`¡Segundo asalto! El jefe se ha enfadado.`,"bark.phase.2":`¡Fase dos! ¡Más música!`,"bark.phase.3":`Oh, está furioso. Maravilloso.`,"bark.phase.4":`Segunda fase. Más grande. Más fuerte. Más tonta.`,"bark.clear.1":`Sala limpia. Los conserjes lloran.`,"bark.clear.2":`Limpio. Brutal. Siguiente piso.`,"bark.clear.3":`Los de limpieza te mandan una carta de odio.`,"bark.clear.4":`El piso es tuyo. Por ahora.`,"bark.clear.5":`Bien hecho. Lo odio.`,"bark.clear.6":`¡Corte al ascensor! Que no pare.`,"bark.reboot.1":`En pie. Esta va por cuenta de la casa.`,"bark.reboot.2":`Reiniciada. Ni una palabra a contabilidad.`,"bark.reboot.3":`Batería de repuesto. La última. Creo.`,"bark.lowhp.1":`Tu salud está en rojo. Rojo es malo.`,"bark.lowhp.2":`Estás goteando. Por favor, deja de gotear.`,"bark.lowhp.3":`Te queda poco cuerpo. Busca una bahía de reparación.`,"bark.lowhp.4":`Hoy no pienso construir otro.`,"bark.repair.1":`Parcheada. Intenta no deshacerlo.`,"bark.repair.2":`Cinta nueva para tu alma.`,"bark.repair.3":`Reparada. La factura va por correo.`,"bark.collector.1":`Psst. ¿Huellas? Yo colecciono. Tú pierdes. Todos ganan.`,"bark.collector.2":`Uy, recuerdos frescos. Saben a lluvia.`,"bark.collector.3":`Tus huellas huelen a espada y horas extra.`,"bark.collector.4":`Gástalas aquí, o se las queda el suelo.`,"bark.collector.5":`Los mensajeros muertos no guardan nada. Los vivos negocian.`,"bark.collector.6":`Un recuerdo de un bocadillo. Delicioso.`,"bark.collector.7":`¡Tú otra vez! Mi mensajera agujereada favorita.`,"bark.collector.8":`Yo me quedo las huellas. Tú, los planos.`,"bark.collector.9":`Cuidado ahí arriba. Cliente muerto, mal cliente.`,"bark.collector.10":`¿Piso cien? Tráeme un recuerdo.`,printsLost:`Perdidas con el cuerpo: {n} huellas sin guardar`,sold:`Vendido`,goldPrice:`{n} oro`,flaskRefillSub:`Cargas: {n} de {of}. Cura el 40 % de la vida.`,merchantTitle:`Mercader`,goldHave:`Oro: {n} · se pierde al acabar el ascenso`,doorHud:`PUERTA {t}`,feedPts:`+ {what} {n}`,feedLine:`+ {what}`,"tab.bestiary":`Bestiario`,"tabSub.bestiary":`Cada enemigo de la torre. Encuéntralos para llenarlo.`,"feed.juggle":`MALABAR`,"feed.parry":`PARADA`,"feed.overkill":`EXCESO`,"feed.close":`POR UN PELO`,"feed.clash":`CHOQUE`,"feed.slam":`MAZAZO`,"feed.reversal":`REVÉS`,"feed.breach":`BRECHA`,"say.secret":`SALA SECRETA`,"say.hatch":`LOS CLONES DESPIERTAN`,"feed.crush":`APLASTADO`,"feed.boom":`KABUM`,"feed.glass":`POR LA VENTANA`,"feed.shock":`FRITO`,"fee .input":`Aire: Lado o Arriba + Tajo`,"tech.aerial.effect":`Corte cruzado y arco para mantener el malabar`,"tech.airdash.name":`Impulso aéreo`,"tech.airdash.input":`Aire: Impulso`,"tech.airdash.effect":`Un impulso en el aire, a través de todo`,"tech.helm.name":`Rompecascos`,"tech.helm.input":`Aire: Abajo + Pesado`,"tech.helm.effect":`Picado en vertical; un temblor donde caes`,"tech.helm.effect2":`El temblor siempre es el amplio`,"tech.stinger.name":`Aguijón largo`,"tech.stinger.input":`Lado + Pesado`,"tech.stinger.effect":`El aguijón llega un tercio más lejos`,"tech.stinger.effect2":`El aguijón llega aún más lejos`,"tech.skyward.name":`Corte al cielo`,"tech.skyward.input":`Aire: Arriba + Pesado`,"tech.skyward.effect":`Un corte ascendente que te eleva, uno por salto`,"tech.burst.name":`Estallido cinético`,"tech.burst.input":`Pesado, quieto`,"tech.burst.effect":`Una onda a tu alrededor; cargada, los lanza a todos`,"tech.slam.name":`Golpe al suelo`,"tech.slam.input":`Abajo + Pesado`,"tech.slam.effect":`Una amplia onda de choque por el suelo`,"tech.phantom.name":`Arranque fantasma`,"tech.phantom.input":`Arriba + Pesado cargado a una torreta`,"tech.phantom.effect":`Arranca su fantasma: cae sobre él para un crítico doble`,"tech.overdrive.name":`Sobrecarga`,"tech.overdrive.input":`Pesado con 3 celdas`,"tech.overdrive.effect":`La hoja llena corta el triple, no el doble`,"part.plating.name":`Blindaje`,"part.plating.effect":`+20 de HP máx.`,"part.plating.effect2":`+20 más de HP máx.`,"part.plating.effect3":`+20 más de HP máx.`,"part.servos.name":`Servos de impulso`,"part.servos.effect":`El impulso vuelve antes`,"part.servos.effect2":`El impulso vuelve el doble de rápido`,"part.legs.name":`Propulsores`,"part.legs.effect":`El salto en el aire llega más alto`,"part.legs.effect2":`Un segundo salto en el aire`,"part.optics.name":`Óptica de combate`,"part.optics.effect":`Los avisos enemigos duran un 15% más`,"part.optics.effect2":`Los avisos enemigos duran un 30% más`,"part.core.nam
