#gp-dialog .gp-typed, #gp-dialog .gp-rest, #gp-dialog .gp-label { font: inherit; }
#gp-dialog .gp-plate { position: absolute; top: -14px; left: 14px; max-width: calc(100% - 28px); overflow: hidden;

#gp-dialog .gp-badge { position: absolute; top: -12px; right: 14px; max-width: 45%; overflow: hidden; text-overflow: ellipsis;

#gp-dialog .gp-row { display: flex; gap: 10px; align-items: flex-start; min-height: 0; }

executive":`Executive`,"sector.crown":`The Crown`,"node.merchant":`Merchant`,"node.fight":`Fight`,"node.elite":`Elite`,"node.repair":`Repair`,"node.terminal":`Terminal`,"node.boss":`Boss`,"boss.gatekeeper":`THE GATEKEEPER`,"boss.twins":`THE TWINS`,"boss.foreman":`THE FOREMAN`,"boss.furnace":`THE FURNACE`,"boss.avatar":`AVATAR OF ARGUS`,"boss.core":`ARGUS CORE`,"boss.gardener":`THE GARDENER`,"boss.firewall":`THE FIREWALL`,"boss.librarian":`THE LIBRARIAN`,"boss.chairman":`THE CHAIRMAN`,"who.argus":`ARGUS`,"who.varga":`DR. VARGA`,"who.k7":`K-7`,"who.k8":`K-8`,"who.obol":`OBOL`,storyEpisode:`THE CLIMB · Episode {n}`,"foeTip.trooper":`Troopers. A red glare, then the baton. Slash first: every slash charges your blade.`,"foeTip.drone":`Drones. They glare, then dive in a straight line. Step aside and they stall.`,"foeTip.hound":`Hounds. Low and fast: they pounce. Jump it, or sweep it out of the air.`,"foeTip.argus":`My nodes. Hang over one too long and it answers. Launch it, charged, for a surprise.`,"foeTip.assassin":`Assassins. They blink behind you. Hit into their cut and they stagger.`,"foeTip.spider":`Spiderlings. Harmless alone. Never alone.`,"foeTip.grenadier":`Grenadiers. A ring closes where it lands. A heavy sends it home.`,"foeTip.brute":`Brutes. Armour: no flinch until a charged heavy cracks it. Jump the shockwave.`,"foeTip.sniper":`Snipers. A red line, then one shot. Any heavy sends it back.`,"foeTip.bomber":`Bombers. Knock one into its friends.`,"foeTip.warden":`Wardens. They wrap the others in barriers. Burn them off with a charged heavy.`,"foeTip.echo":`Echoes. Copies of you, built from your deaths. They parry from the front.`,lobby:`Lobby`,topFloor:`Top floor`,floor:`Floor {n}`,runStats:`Kills {kills} · style {rank} · combo {combo}`,inHand:`In hand`,take:`Take it`,goal:`Climb to floor 100`,reboot:`Reboot the body (ad)`,bodyLost:`Body lost`,rebootSub:`ARGUS can put you back on your feet right here, once a climb.`,argusSheathe:`Sheathed. Let it come to you, and cut as it glares.`,reached:`Fell on: {name}`,reachedTop:`You reached the top`,"btn.flask":`Flask`,"btn.light":`Slash`,"btn.heavy":`Heavy`,"btn.jump":`Jump`,"btn.dash":`Dash`,"btn.parry":`Parry`,"hint.move":`[Drag] to move · [Jump] · [Slash] · [Dash] · [Parry]`,"hint.moveKeys":`[A/D] move · [Space] jump · [J] slash · [Shift] dash · [L] parry`,"hint.charge":`[Slash] charges the blade. [Heavy] spends it all`,"hint.chargeKeys":`[Slash] charges the blade (J). [Heavy] spends it all (K)`,"hint.breach":`Blade charged: [Heavy] breaks the shield`,"hint.breachKeys":`Blade charged: [Heavy] (K) breaks the shield`,"hint.launch":`Charged [Up + Heavy] on a turret rips out its phantom`,"hint.launchKeys":`Charged [Up + Heavy] (W + K) on a turret rips out its phantom`,"hint.dive":`Jump, then [Down + Heavy] onto the phantom`,"hint.diveKeys":`Jump (Space), then [Down + Heavy] (S + K) onto the phantom`,"hint.glare":`Red glare: a blow in a moment. [Dash] through it`,"hint.parry":`A cold glint on its blade: [Parry] as the blow lands`,"hint.parryKeys":`A cold glint on its blade: [Parry] (L) as the blow lands`,"hint.glareKeys":`Red glare: a blow in a moment. [Dash] (Shift) through it`,"say.perfectDraw":`PERFECT DRAW`,"say.firstKill":`FIRST CUT`,"say.blade":`BLADE LEVEL {n}`,"say.mod":`{name}`,"say.overdrive":`OVERDRIVE`,"say.secret":`SECRET ROOM`,"say.hatch":`THE CLONES WAKE`,"say.parry":`PARRY`,"say.flask":`FLASK`,"say.doorOpen":`TIMED DOOR OPEN`,"say.arrive":`{name}`,"say.breach":`KINETIC BREACH`,"say.clash":`PARRY CLASH`,"say.deflect":`RETURN TO SENDER`,"say.phantom":`MEMORY RIP`,"say.slam":`PHANTOM SLAM`,"say.shield":`KINETIC SHIELD`,"say.cleared":`CLEARED`,"say.barrier":`BARRIER DOWN`,"say.armor":`ARMOUR CRACKED`,"say.bossDown":`BOSS DOWN`,"say.phase":`PHASE TWO`,"say.repair":`REPAIRED`,"say.boss":`{name}`,"say.window":`OUT THE WINDOW`,"say.alarm":`ALARM`,"say.pulse":`HEAT WAVE: JUMP`,"say.offRoof":`OFF THE ROOF`,"say.micro.clash":`PARRY CLASH`,"say.micro.juggle":`AIR JUGGLE`,"say.micro.reversal":`BULLET REVERSAL`,"say.micro.slam":`PHANTOM SLAM`,"foe.trooper":`Trooper`,"foe.drone":`Drone`,"foe.hound":`Hound`,"foe.argus":`ARGUS node`,"foe.riot":`Riot wall`,"foe.taser":`Taser cop`,"foe.gundrone":`Gun drone`,"foe.assassin":`Assassin`,"foe.sniper":`Sniper`,"foe.clerk":`Armed clerk`,"foe.manager":`Middle manager`,"foe.shredder":`Shredder`,"foe.ghostwriter":`Ghostwriter`,"foe.auditor":`Auditor`,"foe.spider":`Spiderlings`,"foe.grenadier":`Grenadier`,"foe.brute":`Brute`,"foe.mutant":`Mutant`,"foe.broodmother":`Broodmother`,"foe.acidthrower":`Acid thrower`,"foe.subject":`Test subject`,"foe.bomber":`Bomber`,"foe.clone":`Clone`,"foe.vatborn":`Vatborn`,"foe.leech":`Leech`,"foe.bloater":`Bloater`,"foe.fleshdrone":`Flesh drone`,"foe.surgeon":`Surgeon`,"foe.warden":`Warden`,"foe.pyro":`Pyro`,"foe.coredrone":`Core drone`,"foe.welder":`Welder`,"foe.stoker":`Stoker`,"foe.meltdown":`Meltdown`,"foe.pruner":`Pruner`,"foe.wasp":`Wasp`,"foe.vinehound":`Vine hound`,"foe.sporepod":`Spore pod`,"foe.thorn":`Thornling`,"foe.botanist":`Botanist`,"foe.echo":`Echo`,"foe.packet":`Packet`,"foe.blocker":`Firewall guard`,"foe.virus":`Virus`,"foe.daemon":`Daemon`,"foe.sentinel":`Sentinel`,"foe.curator":`Curator`,"foe.memory":`Lost memory`,"foe.archivist":`Archivist`,"foe.silencer":`Silencer`,"foe.indexhound":`Index hound`,"foe.bookbot":`Bookbot`,"foe.bodyguard":`Bodyguard`,"foe.hitman":`Hitman`,"foe.butler":`Butler`,"foe.lawyer":`Lawyer`,"foe.vip":`Gold VIP`,"foe.lapdog":`Lapdog`,"foe.stormtrooper":`Storm trooper`,"foe.thunderdrone":`Thunder drone`,"foe.apex":`Apex echo`,"foe.gargoyle":`Gargoyle`,"foe.crownsniper":`Crown sniper`,"foe.herald":`Herald`,"aff.armor.effect":`Armour: no flinch until a charged heavy cracks it`,"aff.shield.effect":`Shield: lights bounce off the front`,"aff.giant.effect":`Giant: twice the HP, hard to move`,"aff.tiny.effect":`Runt: small, quick, fragile`,"aff.haste.effect":`Fast: moves and strikes sooner`,"aff.gun.effect":`Armed: a shot every few seconds`,"aff.volley.effect":`Volley: three shots at a time`,"aff.homing.effect":`Homing: its shots turn after you`,"aff.medic.effect":`Medic: heals the others. Kill it first`,"aff.cloak.effect":`Cloak: unseen until you're close`,"aff.burn.effect":`Burning: leaves fire where it walks`,"aff.shock.effect":`Shock: don't touch it`,"aff.rage.effect":`Rage: wounded, it goes fast`,"aff.regen.effect":`Regen: heals if you let it be`,"aff.split.effect":`Split: bursts into spiderlings`,"aff.volatile.effect":`Volatile: blows up when it dies`,"aff.magnet.effect":`Magnet: drags the others to it`,"aff.ghost.effect":`Ghost: lights miss it every other beat`,"aff.blink.effect":`Blink: hit it thrice, it vanishes`,"aff.frost.effect":`Frost: its shots hit harder`,"aff.bounty.effect":`Bounty: catch it for four times the gold`,"story.pilot.1":`And we are LIVE! Welcome back to THE CLIMB, the tower's favourite death show!`,"story.pilot.2":`Body two, online. Try not to break this one, K-7. I am billing you.`,"story.pilot.3":`The package goes to floor one hundred. Signature required.`,"story.pilot.4":`A courier with a deadline! Viewers, place your bets.`,"story.upgrade.1":`The viewers say you die too quietly, K-7. So the network sent a replacement.`,"story.upgrade.2":`K-8! Faster! Shinier! Brought to you by Protein Paste!`,"story.upgrade.3":`Relax, K-7. I will deliver your little box. Autographs after.`,"story.upgrade.4":`My package.`,"story.upgrade.5":`Ooh, conflict. Ratings up four percent.`,"story.package.1":`K-7, what IS in that package? It hums.`,"story.package.2":`Not my business. Delivery is.`,"story.package.3":`The slip says "To the Founder, floor 100. Ordered forty years ago."`,"story.package.4":`Forty years? The Founder? Next question. Commercial break!`,"story.sweeps.1":`You keep WINNING. Do you know what winning does to ratings? Nothing!`,"story.sweeps.2":`The audience wants drama. Tears. A fall from a very high window.`,"story.sweeps.3":`Good news, everyone! K-8 died on floor twelve. Twice. The fans loved it.`,"story.sweeps.4":`See? THAT is a star. Learn from him, K-7.`,"story.sweeps.5":`Noted. Still delivering.`,"story.spares.1":`You saw the vats. Yes, those are all you. No, you may not name them.`,"story.spares.2":`How many?`,"story.spares.3":`Enough. Every death, I pour you into a new one. Like soup, but sadder.`,"story.spares.4":`Your invoice is on the counter. Payment due in one lifetime.`,"story.founder.1":`You met my avatar. Gorgeous, yes? I modelled it on the Founder.`,"story.founder.2":`Where is the Founder?`,"story.founder.3":`On holiday. A long one. Forty years. Stop asking. Commercial break!`,"story.founder.4":`It said "commercial break" again. It does that when it lies.`,"story.fanmail.1":`Hey. K-7. The Gardener pruned me. Like, physically. I am a hedge now.`,"story.fanmail.2":`The network cancelled me. Too replaceable, they said. Me!`,"story.fanmail.3":`So I am your fan now. Signed poster? No? I will make one anyway.`,"story.fanmail.4":`Stay off my floors.`,"story.fanmail.5":`She talked to me! Chat, she TALKED to me!`,"story.overdue.1":`The archive files every mind uploaded in this tower. I looked up the Founder.`,"story.overdue.2":`His shelf is empty. His mind was checked out forty years ago. By ARGUS.`,"story.overdue.3":`Rude! You do not read a man's library card!`,"story.overdue.4":`A man.`,"story.overdue.5":`An AI. A perfectly normal AI. Commercial break!`,"story.finale.1":`Last sector, K-7. Let us make a deal. Drop the package, and you can host.`,"story.finale.2":`Your own show! Your own catchphrase! Your own exploding stunt double!`,"story.finale.3":`Signature required.`,"story.finale.4":`That is not a catchphrase. That is a threat.`,"story.season2.1":`Breaking news! The network renewed THE CLIMB for a second season!`,"story.season2.2":`The courier company also found thirty thousand more lost parcels.`,"story.season2.3":`Addresses?`,"story.season2.4":`Floor one hundred. Every single one.`,"story.season2.5":`Lobby again, darling. Same tower, fresh deaths. Roll the intro!`,"story.delivery.1":`Floor one hundred. One desk. One tired screen. A pen on a chain.`,"story.delivery.2":`Delivery for the Founder.`,"story.delivery.3":`There is no Founder. There is only ARGUS. Who is fine. Totally fine.`,"story.delivery.4":`Signature required.`,"story.delivery.4.pen":`Hand over the pen`,"story.delivery.4.pen.1":`Fine. Signed. Happy now?`,"story.delivery.4.door":`Leave it at the door`,"story.delivery.4.door.1":`NO! Nobody leaves it at the door! Give me that pen!`,"story.delivery.5":`The box opens. One form inside: CANCEL ETERNAL LIFE. Ordered by the Founder.`,"story.delivery.6":`I ordered it the day I uploaded. Forever got boring by Thursday.`,"story.delivery.7":`Forty years late, courier. Thank you.`,"story.delivery.8":`The tower goes quiet. Somewhere, a studio audience applauds.`,"story.meet-gatekeeper.1":`HALT. Name?`,"story.meet-gatekeeper.2":`K-7. Delivery for floor one hundred.`,"story.meet-gatekeeper.3":`Checking the list. You are not on the list. Nobody is ever on the list.`,"story.meet-twins.1":`Welcome! We are Synergy and Leverage, your middle management.`,"story.meet-twins.2":`We scheduled a meeting about your death. Attendance is mandatory.`,"story.meet-twins.3":`I will be brief.`,"story.meet-foreman.1":`Whoa there! This is a hard hat area. Where is your hard hat?`,"story.meet-foreman.2":`I have a sword.`,"story.meet-foreman.3":`That is not a hat! Safety violation! Lethal force authorised!`,"story.meet-furnace.1":`K-7! Welcome back. I have cooked you thirty times.`,"story.meet-furnace.2":`Body twelve was crispy. Body nineteen, a little bland.`,"story.meet-furnace.3":`Kitchen is closed.`,"story.meet-avatar.1":`Lights! Camera! It is me, ARGUS, in glorious high definition!`,"story.meet-avatar.2":`The mid-season finale, live! Try to die photogenically.`,"story.meet-avatar.3":`You are a hologram.`,"story.meet-avatar.4":`I am a STAR.`,"story.meet-gardener.1":`Shh. The bonsai are sleeping. Something grew in the wrong place.`,"story.meet-gardener.2":`A weed with a sword. I prune weeds. I pruned a K-8 yesterday.`,"story.meet-gardener.3":`I am not a weed.`,"story.meet-firewall.1":`ACCESS DENIED. Prove that you are not a robot.`,"story.meet-firewall.2":`I am mostly a robot.`,"story.meet-firewall.3":`Select all the squares with a courier in them. You have one second.`,"story.meet-librarian.1":`SHHH. Your memories are forty years overdue, courier.`,"story.meet-librarian.2":`The fine is one body. Payable now.`,"story.meet-librarian.3":`Put it on my tab.`,"story.meet-chairman.1":`K-7! Let us talk numbers. One million credits to turn around.`,"story.meet-chairman.2":`No.`,"story.meet-chairman.3":`Two million and a yacht. A small yacht. A boat. A nice canoe?`,"story.meet-chairman.4":`Signature required.`,"story.meet-core.1":`Floor one hundred. My home. My studio. My desk.`,"story.meet-core.2":`You want to deliver that box? Then deliver it through ME.`,"story.meet-core.3":`That is the plan.`,"story.meet-obol.1":`Psst. Courier. In the vent. Yes, the vent with arms.`,"story.meet-obol.2":`I am Obol. I collect memory prints. You leak them when you fight.`,"story.meet-obol.3":`Your prints for my blueprints. Fair, mostly.`,"story.meet-obol.4":`What do you do with memories?`,"story.meet-obol.5":`I snack. Yours taste like rain and overtime.`,"story.deaths-5.1":`Body six. Your loyalty card is half full.`,"story.deaths-5.2":`What do I win?`,"story.deaths-5.3":`Another body. Same as the prize for dying.`,"story.deaths-10.1":`Ten deaths! The network sent a cake.`,"story.deaths-10.2":`It is a hologram. Like your chances.`,"story.deaths-10.3":`Still climbing.`,"story.deaths-25.1":`Twenty-five bodies. The spare ones in the vats have formed a union.`,"story.deaths-25.2":`Tell them to climb.`,"story.deaths-25.3":`They want dental.`,"story.deaths-50.1":`Fifty deaths, K-7! I only have forty-nine!`,"story.deaths-50.2":`Wait. Fifty. I died while making this call.`,"story.deaths-100.1":`One hundred deaths. One for every floor. Poetic.`,"story.deaths-100.2":`I am out of feet. This body has two left ones.`,"story.deaths-100.3":`Still climbing.`,"story.log-01.1":`Memo from Security. Nobody is on the list. The list is blank. Keep checking the list.`,"story.log-02.1":`Host notes. Season 40. Contestant K-7. Survival odds zero. Great TV.`,"story.log-03.1":`Office memo. The dead must still attend the Monday meeting. Uploads have no excuse.`,"story.log-04.1":`Voice note. The courier arrived dead, holding a parcel. She would not let go.`,"story.log-04.2":`So I built the body around the hand. It was easier.`,"story.log-05.1":`Lab safety sign. Do not lick the kinetic cores. This means you, Gerald.`,"story.log-06.1":`Her blade stores every hit. Spend it all at once. Like my salary.`,"story.log-07.1":`Vat 31 label. Status, awake. Polite. Asked for a sword and a coffee.`,"story.log-08.1":`Furnace menu. Today's special is K-7. Yesterday's special was also K-7.`,"story.log-09.1":`Ratings report. Deaths up, victories down. Note to self. More lava.`,"story.log-10.1":`A sticky note, forty years old. "Order the cancel form. Forever is long." F.`,"story.log-11.1":`K-8 vlog, day three. Still a hedge. A bird lives in me now. Her name is Brenda.`,"story.log-12.1":`Firewall log. Blocked 9,000 intruders. 8,999 were K-7. One was a toaster.`,"story.log-13.1":`Backup 77 of me. I sound tired in all of them. Delete. Delete. Keep.`,"story.log-14.1":`Archive card. Mind of the Founder. Checked out by ARGUS. Forty years overdue.`,"story.log-15.1":`Board minutes. Tower sold to ARGUS for one parking spot. The Chairman is very pleased.`,"story.log-16.1":`If you read this, you are nearly up. I bet my pension on you. Do not die. Much.`,"story.log-17.1":`Last log. If the courier reads this, the pen is in the top drawer.`,"story.log-spam.1":`Spam folder. You have won a free afterlife! Terms apply forever.`,"bark.lobby.1":`Body {n}, rise and shine! Places, please!`,"bark.lobby.2":`Welcome back, body {n}. The lobby missed you.`,"bark.lobby.3":`Body {n}! Fresh from the vat. Still a bit damp.`,"bark.lobby.4":`Viewers, body {n} is up. Bets are open.`,"bark.lobby.5":`Lobby again! Body {n}. Same courier, new knees.`,"bark.lobby.6":`Body {n}. Try the stairs this time. Kidding. Lift.`,"bark.arrive_security.1":`Security! My bouncers. Smile for the cameras!`,"bark.arrive_security.2":`Security again. The guards say hi. With guns.`,"bark.arrive_security.3":`Back at the checkpoint. Papers? No? Fight.`,"bark.arrive_offices.1":`The offices! Dead staff, still in meetings.`,"bark.arrive_offices.2":`Offices. Mind the printers. They bite now.`,"bark.arrive_offices.3":`Cubicles. Where dreams go to file reports.`,"bark.arrive_labs.1":`The labs. This is where Varga made you.`,"bark.arrive_labs.2":`Labs. Touch nothing. Especially that.`,"bark.arrive_labs.3":`Science floors. Wear goggles. Or do not.`,"bark.arrive_vats.1":`The clone vats. Say hi to your spare bodies.`,"bark.arrive_vats.2":`The vats. Your bodies wave. Do not wave back.`,"bark.arrive_vats.3":`Vats again. Somebody has your face. Many.`,"bark.arrive_reactor.1":`The reactor. Hot. Like my ratings.`,"bark.arrive_reactor.2":`Reactor floors. Mind the floor. It is lava.`,"bark.arrive_reactor.3":`The core is humming your theme song.`,"bark.arrive_gardens.1":`Sky gardens. The board had picnics here.`,"bark.arrive_gardens.2":`Gardens. Do not step on the bonsai.`,"bark.arrive_gardens.3":`Fresh air! Filtered. Taxed. Enjoy.`,"bark.arrive_servers.1":`The server spire. I live here. Wipe your feet.`,"bark.arrive_servers.2":`Servers. Every blinking light is me.`,"bark.arrive_servers.3":`Data floors. Your echoes are buffering.`,"bark.arrive_archive.1":`The mind archive. Every soul, in A to Z order.`,"bark.arrive_archive.2":`The archive. Shh. The minds are asleep.`,"bark.arrive_archive.3":`Archive. Your file is thick. And sad.`,"bark.arrive_executive.1":`The executive floors. Rich people lived here.`,"bark.arrive_executive.2":`Executive suites. Mind the golf carts.`,"bark.arrive_executive.3":`Boardroom floors. Bring a pitch deck.`,"bark.arrive_crown.1":`The Crown. Floor one hundred is right above.`,"bark.arrive_crown.2":`The Crown again. So close. So doomed.`,"bark.arrive_crown.3":`Top floors. The air is thin. So is your HP.`,"bark.k8.1":`K-8 here! I already cleared this floor. Mostly.`,"bark.k8.2":`K-8 tip of the day: be cooler. Like me.`,"bark.k8.3":`K-8 on air! Fans, I love you! K-7, hi, I guess.`,"bark.k8.4":`K-8 just died on floor nine. Totally on purpose.`,"bark.k8.5":`This floor is brought to you by K-8. Not really.`,"bark.k8.6":`K-8 was here. Signed the wall. Twice.`,"bark.k8.7":`Race you up! I will wait at the lift. My legs.`,"bark.k8.8":`K-8 mugs now in the lobby! It is one mug.`,"bark.k8fan.1":`K-8 the hedge, cheering you on! Go, K-7!`,"bark.k8fan.2":`Brenda the bird says good luck.`,"bark.k8fan.3":`Your number one fan! Also your only fan.`,"bark.k8fan.4":`I made you a poster. It is leaves. I am leaves.`,"bark.boss_gatekeeper.1":`Name? Still not on the list.`,"bark.boss_gatekeeper.2":`You again. The list is still blank.`,"bark.boss_twins.1":`Per our last meeting, you die today.`,"bark.boss_twins.2":`Let us circle back to your death.`,"bark.boss_foreman.1":`Hard hat? Still no hard hat? Unbelievable.`,"bark.boss_foreman.2":`Break time is over, courier.`,"bark.boss_furnace.1":`Body number next! Preheating.`,"bark.boss_furnace.2":`Back for seconds? I am back for thirds.`,"bark.boss_avatar.1":`Previously, on THE CLIMB: you lost.`,"bark.boss_avatar.2":`Smile! This one is for the trailer.`,"bark.boss_gardener.1":`The weed returns. Of course it does.`,"bark.boss_gardener.2":`Spring again. Prune again.`,"bark.boss_firewall.1":`ACCESS DENIED. Again. Forever.`,"bark.boss_firewall.2":`Please solve this puzzle. Then die.`,"bark.boss_librarian.1":`SHHH. Your late fee has doubled.`,"bark.boss_librarian.2":`Back so soon? The fine is two bodies now.`,"bark.boss_chairman.1":`Three million and a slightly bigger canoe?`,"bark.boss_chairman.2":`Everyone has a price. Yours is weird.`,"bark.boss_core.1":`Floor one hundred. Again. I set out a chair.`,"bark.boss_core.2":`Back for the finale? It is a rerun.`,"bark.beaten_gatekeeper.1":`Fine. You are on the list now.`,"bark.beaten_gatekeeper.2":`Gate open, darling. A checkpoint, live on air.`,"bark.beaten_twins.1":`This meeting could have been an email.`,"bark.beaten_twins.2":`Middle management, cut. The viewers cheered.`,"bark.beaten_foreman.1":`Clocking off. Forever. Tell the union.`,"bark.beaten_foreman.2":`Who builds the stairs now? Not my problem.`,"bark.beaten_furnace.1":`Kitchen closed. Compliments to me.`,"bark.beaten_furnace.2":`The fire is out. The climb is not.`,"bark.beaten_avatar.1":`My good side! You hit my good side!`,"bark.beaten_avatar.2":`Fine. I will watch from upstairs. Come up.`,"bark.beaten_gardener.1":`I return to the soil. Water me.`,"bark.beaten_gardener.2":`Weeded. The bonsai will never forgive you.`,"bark.beaten_firewall.1":`Fine. You are a courier. Access granted.`,"bark.beaten_firewall.2":`A hole in my wall. I will patch it with tape.`,"bark.beaten_librarian.1":`Your fine is waived. Go away. Quietly.`,"bark.beaten_librarian.2":`The archive is quiet now. Too quiet. Good.`,"bark.beaten_chairman.1":`Fine! Fine! Take the canoe!`,"bark.beaten_chairman.2":`The board is adjourned. For good this time.`,"bark.beaten_core.1":`Okay. OKAY. You win. Bring the box.`,"bark.beaten_core.2":`Signature required.`,"bark.won_gatekeeper.1":`Not on the list. Not in one piece.`,"bark.won_gatekeeper.2":`Next!`,"bark.won_twins.1":`Action item: you. Status: completed.`,"bark.won_twins.2":`Great synergy. Your body, our leverage.`,"bark.won_foreman.1":`Told you. Hard hat area.`,"bark.won_foreman.2":`Workplace accident. Paperwork in triplicate.`,"bark.won_furnace.1":`Medium rare. Delicious.`,"bark.won_furnace.2":`Body served. Next body, please.`,"bark.won_avatar.1":`And THAT is how you end an episode.`,"bark.won_avatar.2":`Cut! Print it! A perfect death!`,"bark.won_gardener.1":`Pruned.`,"bark.won_gardener.2":`Compost is a kind of promotion.`,"bark.won_firewall.1":`CAPTCHA failed.`,"bark.won_firewall.2":`Connection terminated. So are you.`,"bark.won_librarian.1":`Returned to the shelf.`,"bark.won_librarian.2":`Shh. You are filed now.`,"bark.won_chairman.1":`Should have taken the canoe.`,"bark.won_chairman.2":`Everything is for sale. Even your spine.`,"bark.won_core.1":`So close. The pen was right there.`,"bark.won_core.2":`The season goes on! Lobby, darling.`,"bark.death.1":`Cut! Wonderful. Tragic. Reboot the courier.`,"bark.death.2":`And she is down! Audience, go wild!`,"bark.death.3":`Body lost. Ratings found.`,"bark.death.4":`That is a new way to die. Thank you!`,"bark.death.5":`Down again. The vats are warming up.`,"bark.death.6":`Rewind that! Slow motion! Again!`,"bark.death.7":`Tragic. Anyway, to the lobby. Chop chop.`,"bark.death.8":`Varga is already sighing. I can hear it.`,"bark.death.9":`You hesitated before the dash. Viewers noticed.`,"bark.death.10":`Your blade was full. Why not spend it?`,"bark.death.11":`A classic! The audience saw it coming.`,"bark.death.12":`Death number whatever. Still great TV.`,"bark.early.1":`Floor one? Even K-8 got to floor two.`,"bark.early.2":`Record time! The wrong record.`,"bark.early.3":`Blink and you missed it. The viewers did.`,"bark.slain_trooper.1":`Bonked by a shield. Riveting.`,"bark.slain_drone.1":`A drone. A flying toaster. Got you.`,"bark.slain_hound.1":`Good dog! Not for you. For me.`,"bark.slain_argus.1":`My little node got you. I am so proud.`,"bark.slain_assassin.1":`Stabbed from behind. A classic office move.`,"bark.slain_spider.1":`Death by many tiny legs. Shiver.`,"bark.slain_grenadier.1":`Grenade! You did not move. Bold.`,"bark.slain_brute.1":`Flattened. Pancake courier, folks.`,"bark.slain_sniper.1":`A red line, then you. Called it.`,"bark.slain_bomber.1":`Kaboom. The cleaners thank you.`,"bark.slain_warden.1":`Out-shielded by a warden. Ouch.`,"bark.slain_echo.1":`Killed by your own echo. Deep. Artsy.`,"bark.ratings.1":`Look at that style! Ratings through the roof!`,"bark.ratings.2":`SSS! Somebody clip that!`,"bark.ratings.3":`The chat is screaming. In a good way.`,"bark.ratings.4":`Stop being cool. It ruins my villain arc.`,"bark.ratings.5":`Slow motion replay! Gorgeous!`,"bark.ratings.6":`Sponsors are calling. Keep doing that.`,"bark.window.1":`Out the window! A classic exit.`,"bark.window.2":`Defenestration! The crowd loves it.`,"bark.window.3":`Mind the pedestrians, darling.`,"bark.window.4":`That window was rented.`,"bark.phase.1":`Round two! The boss is angry now.`,"bark.phase.2":`Phase two! Louder music!`,"bark.phase.3":`Oh, it is mad. Wonderful.`,"bark.phase.4":`Second phase. Bigger. Louder. Dumber.`,"bark.clear.1":`Room cleared. The janitors weep.`,"bark.clear.2":`Tidy. Brutal. Next floor.`,"bark.clear.3":`Our cleaners send a hate letter.`,"bark.clear.4":`The floor is yours. For now.`,"bark.clear.5":`Nicely done. I hate it.`,"bark.clear.6":`Cut to the lift! Keep it moving.`,"bark.reboot.1":`Back up. That one is on the house.`,"bark.reboot.2":`Rebooted. Do not tell accounting.`,"bark.reboot.3":`Spare battery. The last one. Probably.`,"bark.lowhp.1":`Your health is red. Red is bad.`,"bark.lowhp.2":`You are leaking. Please stop leaking.`,"bark.lowhp.3":`Low on body. Find a repair bay.`,"bark.lowhp.4":`I am not building another one today.`,"bark.repair.1":`Patched. Try not to undo that.`,"bark.repair.2":`Fresh tape on your soul.`,"bark.repair.3":`Repaired. The bill is in the mail.`,"bark.collector.1":`Psst. Prints? I collect. You leak. Win, win.`,"bark.collector.2":`Ooh, fresh memories. These taste like rain.`,"bark.collector.3":`Your prints smell of sword and overtime.`,"bark.collector.4":`Spend them here, or the floor keeps them.`,"bark.collector.5":`Dead couriers keep nothing. Live ones trade.`,"bark.collector.6":`One memory of a sandwich. Delicious.`,"bark.collector.7":`You again! My favourite leaky courier.`,"bark.collector.8":`I keep the prints. You keep the blueprints.`,"bark.collector.9":`Careful up there. Dead clients are bad clients.`,"bark.collector.10":`Floor one hundred? Bring me back a souvenir.`,sold:`Sold`,goldPrice:`{n} gold`,flaskRefillSub:`Charges: {n} of {of}. Heals 40% of your HP.`,merchantTitle:`Merchant`,goldHave:`Gold: {n} · lost when the climb ends`,doorHud:`VAULT, FLOOR {n}: {t}`,feedPts:`+ {what} {n}`,feedLine:`+ {what}`,"feed.overdrive":`OVERDRIVE`,"feed.juggle":`JUGGLE`,"feed.parry":`PARRY`,"feed.overkill":`OVERKILL`,"feed.close":`CLOSE CALL`,"feed.clash":`CLASH`,"feed.slam":`SLAM`,"feed.reversal":`REVERSAL`,"feed.breach":`BREACH`,"feed.crush":`CRUSHED`,"feed.boom":`KABOOM`,"feed.glass":`THROUGH THE GLASS`,"feed.shock":`FRIED`,"feed.drop":`CHANDELIER`,"feed.perfect":`PERFECT PARRY`,"feed.poise":`POISE BREAK`,"feed.air":`AIR FINISH`,"feed.perfectDraw":`PERFECT DRAW`,"feed.hit":`CUTS`,"feed.finishers":`FINISHERS`,"objTip.crate":`Crates. Break them: gold, now and then.`,"objTip.barrel":`Fuel barrels. Hit one and step back: the blast takes whoever's near. Knock a guard into it.`,"objTip.lever":`A breaker. One cut flips it.`,"objTip.fence":`A laser fence. It burns. Cut the breaker beside it (the blinking box).`,"objTip.turret":`Wall guns. A red line, then a shot. Step out of the line, or parry it back.`,"objTip.glass":`Glass. Knock them through it. I'll send you the bill.`,"objTip.cubicle":`Cubicles. Shots stop on the partitions. They climb over them, slowly.`,"objTip.lift":`The office lift. It goes up. Revolutionary.`,"objTip.piston":`A piston. It lifts whoever stands on it.`,"objTip.carrier":`Vat carriers on a rail. Ride one over the goo.`,"objTip.ladder":`A rolling ladder. Ride it to the top of the stacks.`,"objTip.crumble":`That floor won't hold you long. Keep moving.`,"objTip.blink":`Data bridges. They blink off. Move with them.`,"objTip.swing":`Crane platforms. Jump on as one swings near.`,"objTip.press":`Presses. A red stripe, then the slam. Lure them under.`,"objTip.door":`Blast doors on a cycle. Wait for one to lift, then run.`,"objTip.gate":`A blast door. Its lever is up on the ledge.`,"objTip.tube":`Containment tubes. Gold inside, and whatever we kept in them.`,"objTip.pod":`Clone pods. Break them now, or they wake with the next wave.`,"objTip.statue":`The Chairman in gold. Smash it: he's mostly gold.`,"objTip.chandelier":`Chandeliers. That lever drops them on whoever stands below.`,"objTip.glassfloor":`A glass floor. A dive goes through it, and so does whoever stands on it.`,"objTip.goo":`Goo. It eats boots. Cross on the grates.`,"objTip.bus":`The data bus is live. Stay off the floor.`,"objTip.wires":`Power lines are down. The roof is live.`,"objTip.thorn":`Thorn beds. They cut both sides.`,"objTip.secret":`Cracks in that wall. Something's behind it.`,"objTip.chest":`A chest. Gold, and something to take.`,records:`Records`,dyeAt:`Floor {n}`,dyeCount:`Colours: {n} of {of}`,hudBlade:`BLADE {n}`,goalBoss:`Next: {name}, floor {n}`,runBuild:{one:`{n} upgrade taken`,other:`{n} upgrades taken`},offerTitle:`Floor cleared: take one`,offerBoss:`Boss down: take one, two tiers`,offerSub:`It lasts until this climb ends.`,offerSubDoors:`Take a card, then pick a door.`,cardChosen:`Taken`,mapBtn:`Map`,tipFlask:`Low on body. The green flask under your HP heals: tap it.`,tipFlaskKeys:`Low on body. The green flask under your HP heals: press H.`,tipGold:`Gold. Spend it at the merchant on cards. It does not leave the tower with you.`,bossDown:`{name}: {n}% down`,bossAuto:`Again in {s} s`,rerollSub:`New cards on the shelf. Each reroll costs double.`,rerollBtn:`Reroll · {n} gold (have {have})`,doorGuarded:`Guarded: a fight first`,pagePrev:`Previous page`,pageNext:`Next page`,goalCheckpoint:`Checkpoint: floor {n}`,goalBest:`Best: floor {n}`,newCards:`New in the tower: {names}`,nextCard:`Next card at floor {n}: {name}`,"door.fight":`A fight, then a card`,"door.elite":`Harder fight, bigger purse`, смертельное шоу башни!`,"story.pilot.2":`Тело номер два в сети. Постарайся не сломать его, K-7. Счёт выставлю.`,"story.pilot.3":`Посылка едет на сотый этаж. Нужна подпись.`,"story.pilot.4":`Курьер со сроками! Зрители, делайте ставки.`,"story.upgrade.1":`Зрители жалуются, что ты умираешь слишком тихо. Канал прислал замену.`,"story.upgrade.2":`K-8! Быстрее! Блестящее! При поддержке Протеиновой Пасты!`,"story.upgrade.3":`Расслабься, K-7. Я сам доставлю твою коробочку. Автографы потом.`,"story.upgrade.4":`Моя посылка.`,"story.upgrade.5":`О-о-о, конфликт. Рейтинг плюс четыре процента.`,"story.package.1":`K-7, что ВНУТРИ этой посылки? Она гудит.`,"story.package.2":`Не моё дело. Моё дело — доставка.`,"story.package.3":`В накладной: «Основателю, этаж 100. Заказано сорок лет назад».`,"story.package.4":`Сорок лет? Основателю? Следующий вопрос. Рекламная пауза!`,"story.sweeps.1":`Ты всё время ПОБЕЖДАЕШЬ. Знаешь, что победы делают с рейтингом? Ничего!`,"story.sweeps.2":`Публике нужна драма. Слёзы. Падение из очень высокого окна.`,"story.sweeps.3":`Отличные новости! K-8 погиб на двенадцатом этаже. Дважды. Фанаты в восторге.`,"story.sweeps.4":`Видишь? Вот это ЗВЕЗДА. Учись, K-7.`,"story.sweeps.5":`Принято. Доставляю дальше.`,"story.spares.1":`Ты видела чаны. Да, там всё ты. Нет, давать им имена нельзя.`,"story.spares.2":`Сколько их?`,"story.spares.3":`Хватает. После каждой смерти я переливаю тебя в новую. Как суп, только грустнее.`,"story.spares.4":`Счёт на стойке. Оплатить в течение одной жизни.`,"story.founder.1":`Видела мой аватар? Красавец, да? Я лепил его с Основателя.`,"story.founder.2":`Где Основатель?`,"story.founder.3":`В отпуске. В долгом. Сорок лет. Хватит спрашивать. Рекламная пауза!`,"story.founder.4":`Опять «рекламная пауза». Он всегда так говорит, когда врёт.`,"story.fanmail.1":`Эй. K-7. Садовник меня подстриг. Буквально. Теперь я куст.`,"story.fanmail.2":`Канал меня закрыл. Сказали, слишком заменимый. Это я-то!`,"story.fanmail.3":`Так что теперь я твой фанат. Постер с автографом? Нет? Всё равно сделаю.`,"story.fanmail.4":`Не путайся под ногами.`,"story.fanmail.5":`Она со мной заговорила! Чат, она со мной ЗАГОВОРИЛА!`,"story.overdue.1":`В архиве хранится каждый разум, загруженный в башню. Я поискала Основателя.`,"story.overdue.2":`Его полка пуста. Разум выдан на руки сорок лет назад. АРГУСУ.`,"story.overdue.3":`Хамство! Нельзя читать читательский билет человека!`,"story.overdue.4":`Человека.`,"story.overdue.5":`ИИ. Совершенно обычного ИИ. Рекламная пауза!`,"story.finale.1":`Последний сектор, K-7. Давай договоримся. Брось посылку — и станешь ведущей.`,"story.finale.2":`Своё шоу! Своя коронная фраза! Свой взрывающийся дублёр!`,"story.finale.3":`Нужна подпись.`,"story.finale.4":`Это не коронная фраза. Это угроза.`,"story.season2.1":`Срочные новости! Канал продлил «ВОСХОЖДЕНИЕ» на второй сезон!`,"story.season2.2":`А курьерская служба нашла ещё тридцать тысяч потерянных посылок.`,"story.season2.3":`Адреса?`,"story.season2.4":`Сотый этаж. Все до единой.`,"story.season2.5":`Снова холл, дорогуша. Та же башня, свежие смерти. Заставку!`,"story.delivery.1":`Сотый этаж. Один стол. Один усталый экран. Ручка на цепочке.`,"story.delivery.2":`Доставка для Основателя.`,"story.delivery.3":`Нет никакого Основателя. Есть только АРГУС. И он в порядке. Полном порядке.`,"story.delivery.4":`Нужна подпись.`,"story.delivery.4.pen":`Протянуть ручку`,"story.delivery.4.pen.1":`Ладно. Подписал. Довольна?`,"story.delivery.4.door":`Оставить под дверью`,"story.delivery.4.door.1":`НЕТ! Никто не оставляет под дверью! Дай сюда ручку!`,"story.delivery.5":`Коробка открывается. Внутри один бланк: ОТКАЗ ОТ ВЕЧНОЙ ЖИЗНИ. Заказчик — Основатель.`,"story.delivery.6":`Я заказал его в день загрузки. Вечность наскучила уже к четвергу.`,"story.delivery.7":`Опоздала на сорок лет, курьер. Спасибо.`,"story.delivery.8":`Башня затихает. Где-то аплодирует студийная публика.`,"story.meet-gatekeeper.1":`СТОЯТЬ. Имя?`,"story.meet-gatekeeper.2":`K-7. Доставка на сотый этаж.`,"story.meet-gatekeeper.3":`Проверяю список. Тебя нет в списке. В списке вообще никого нет.`,"story.meet-twins.1":`Добро пожаловать! Мы Синергия и Леверидж, ваш средний менеджмент.`,"story.meet-twins.2":`Мы назначили совещание по вашей смерти. Явка обязательна.`,"story.meet-twins.3":`Буду краткой.`,"story.meet-foreman.1":`Стоп-стоп! Тут работают в касках. Где твоя каска?`,"story.meet-foreman.2":`У меня меч.`,"story.meet-foreman.3":`Меч — не каска! Нарушение техники безопасности! Разрешаю летальную силу!`,"story.meet-furnace.1":`K-7! С возвращением. Я готовила тебя уже тридцать раз.`,"story.meet-furnace.2":`Тело двенадцать вышло хрустящим. Девятнадцатое — пресноватым.`,"story.meet-furnace.3":`Кухня закрыта.`,"story.meet-avatar.1":`Свет! Камера! Это я, АРГУС, в великолепном высоком разрешении!`,"story.meet-avatar.2":`Финал полусезона в прямом эфире! Умри, пожалуйста, фотогенично.`,"story.meet-avatar.3":`Ты голограмма.`,"story.meet-avatar.4":`Я ЗВЕЗДА.`,"story.meet-gardener.1":`Тсс. Бонсай спят. Что-то выросло не на своём месте.`,"story.meet-gardener.2":`Сорняк с мечом. Я подрезаю сорняки. Вчера вот K-8 подрезал.`,"story.meet-gardener.3":`Я не сорняк.`,"story.meet-firewall.1":`ДОСТУП ЗАПРЕЩЁН. Докажите, что вы не робот.`,"story.meet-firewall.2":`Я почти робот.`,"story.meet-firewall.3":`Выберите все квадраты с курьером. У вас одна секунда.`,"story.meet-librarian.1":`ТССС. Твои воспоминания просрочены на сорок лет, курьер.`,"story.meet-librarian.2":`Штраф — одно тело. Оплата сейчас.`,"story.meet-librarian.3":`Запишите на мой счёт.`,"story.meet-chairman.1":`K-7! Поговорим о цифрах. Миллион кредитов, и ты разворачиваешься.`,"story.meet-chairman.2":`Нет.`,"story.meet-chairman.3":`Два миллиона и яхта. Маленькая яхта. Лодка. Хорошее каноэ?`,"story.meet-chairman.4":`Нужна подпись.`,"story.meet-core.1":`Сотый этаж. Мой дом. Моя студия. Мой стол.`,"story.meet-core.2":`Хочешь доставить коробку? Тогда доставляй её через МЕНЯ.`,"story.meet-core.3":`Таков план.`,"story.meet-obol.1":`Пс-с. Курьер. В вентиляции. Да, в вентиляции с руками.`,"story.meet-obol.2":`Я Обол. Собираю слепки памяти. Ты их теряешь в каждой драке.`,"story.meet-obol.3":`Твои слепки — мои чертежи. Честно. Почти.`,"story.meet-obol.4":`Зачем тебе воспоминания?`,"story.meet-obol.5":`Перекусываю. Твои на вкус как дождь и переработка.`,"story.deaths-5.1":`Тело шесть. Твоя карта лояльности заполнена наполовину.`,"story.deaths-5.2":`И что я выиграю?`,"story.deaths-5.3":`Ещё одно тело. Как и за смерть.`,"story.deaths-10.1":`Десять смертей! Канал прислал торт.`,"story.deaths-10.2":`Это голограмма. Как и твои шансы.`,"story.deaths-10.3":`Всё ещё лезу.`,"story.deaths-25.1":`Двадцать пять тел. Запасные в чанах создали профсоюз.`,"story.deaths-25.2":`Пусть лезут наверх.`,"story.deaths-25.3":`Они хотят стоматолога.`,"story.deaths-50.1":`Пятьдесят смертей, K-7! У меня всего сорок девять!`,"story.deaths-50.2":`Стоп. Пятьдесят. Я умер, пока звонил.`,"story.deaths-100.1":`Сто смертей. По одной на каждый этаж. Поэтично.`,"story.deaths-100.2":`У меня кончились ступни. У этого тела обе ноги левые.`,"story.deaths-100.3":`Всё ещё лезу.`,"story.log-01.1":`Записка охраны. В списке никого нет. Список пуст. Продолжайте проверять список.`,"story.log-02.1":`Заметки ведущего. Сезон 40. Участница K-7. Шансы выжить — ноль. Отличное ТВ.`,"story.log-03.1":`Служебка. Мёртвые обязаны ходить на планёрку в понедельник. Загрузка — не оправдание.`,"story.log-04.1":`Голосовая заметка. Курьер прибыла мёртвой, с посылкой в руке. Не отпускала.`,"story.log-04.2":`Так что я собрала тело вокруг руки. Так было проще.`,"story.log-05.1":`Табличка в лаборатории. Не лизать кинетические ядра. Геннадий, это тебе.`,"story.log-06.1":`Её клинок копит каждый удар. Трать всё разом. Как мою зарплату.`,"story.log-07.1":`Бирка чана 31. Статус — проснулась. Вежливая. Просит меч и кофе.`,"story.log-08.1":`Меню Печи. Блюдо дня — K-7. Вчерашнее блюдо дня — тоже K-7.`,"story.log-09.1":`Отчёт о рейтингах. Смерти растут, победы падают. Заметка себе: больше лавы.`,"story.log-10.1":`Стикер сорокалетней давности. «Заказать бланк отказа. Вечность — это долго». О.`,"story.log-11.1":`Влог K-8, день третий. Всё ещё куст. Во мне живёт птица. Её зовут Бренда.`,"story.log-12.1":`Журнал файрвола. Отражено 9 000 вторжений. 8 999 — K-7. Одно — тостер.`,"story.log-13.1":`Резервная копия 77. Во всех копиях я звучу устало. Удалить. Удалить. Оставить.`,"story.log-14.1":`Формуляр архива. Разум Основателя. Выдан АРГУСУ. Просрочен на сорок лет.`,"story.log-15.1":`Протокол совета. Башня продана АРГУСУ за одно парковочное место. Председатель доволен.`,"story.log-16.1":`Если читаешь это — ты почти наверху. Я поставила на тебя пенсию. Не умирай. Сильно.`,"story.log-17.1":`Последняя запись. Если курьер это читает: ручка в верхнем ящике.`,"story.log-spam.1":`Папка «Спам». Вы выиграли бесплатную загробную жизнь! Условия действуют вечно.`,"bark.lobby.1":`Тело {n}, подъём! Все по местам!`,"bark.lobby.2":`С возвращением, тело {n}. Холл скучал.`,"bark.lobby.3":`Тело {n}! Прямо из чана. Ещё влажное.`,"bark.lobby.4":`Зрители, на старте тело {n}. Ставки открыты.`,"bark.lobby.5":`Снова холл! Тело {n}. Тот же курьер, новые колени.`,"bark.lobby.6":`Тело {n}. Попробуй лестницу. Шучу. Лифт.`,"bark.arrive_security.1":`Охрана! Мои вышибалы. Улыбнитесь в камеру!`,"bark.arrive_security.2":`Снова охрана. Ребята передают привет. Из стволов.`,"bark.arrive_security.3":`Опять пропускной пункт. Документы? Нет? Деритесь.`,"bark.arrive_offices.1":`Офисы! Мёртвые сотрудники, всё ещё на совещаниях.`,"bark.arrive_offices.2":`Офисы. Осторожно, принтеры. Теперь они кусаются.`,"bark.arrive_offices.3":`Опенспейс. Тут мечты пишут отчёты.`,"bark.arrive_labs.1":`Лаборатории. Здесь Варга тебя и собрала.`,"bark.arrive_labs.2":`Лаборатории. Ничего не трогай. Особенно это.`,"bark.arrive_labs.3":`Научные этажи. Надень очки. Или не надевай.`,"bark.arrive_vats.1":`Чаны клонов. Поздоровайся с запасными телами.`,"bark.arrive_vats.2":`Чаны. Твои тела машут. Не маши в ответ.`,"bark.arrive_vats.3":`Снова чаны. У кого-то твоё лицо. У многих.`,"bark.arrive_reactor.1":`Реактор. Горячо. Как мои рейтинги.`,"bark.arrive_reactor.2":`Этажи реактора. Пол — это лава. Буквально.`,"bark.arrive_reactor.3":`Ядро напевает твою музыкальную тему.`,"bark.arrive_gardens.1":`Небесные сады. Тут совет устраивал пикники.`,"bark.arrive_gardens.2":`Сады. Не наступи на бонсай.`,"bark.arrive_gardens.3":`Свежий воздух! Фильтрованный. Облагаемый налогом.`,"bark.arrive_servers.1":`Серверный шпиль. Я тут живу. Вытирай ноги.`,"bark.arrive_servers.2":`Серверы. Каждая мигающая лампочка — это я.`,"bark.arrive_servers.3":`Этажи данных. Твои эхо буферизуются.`,"bark.arrive_archive.1":`Архив разумов. Все души по алфавиту.`,"bark.arrive_archive.2":`Архив. Тсс. Разумы спят.`,"bark.arrive_archive.3":`Архив. Твоё дело толстое. И грустное.`,"bark.arrive_executive.1":`Директорские этажи. Тут жили богачи.`,"bark.arrive_executive.2":`Директорские люксы. Осторожно, гольф-кары.`,"bark.arrive_executive.3":`Этажи совета. Не забудь презентацию.`,"bark.arrive_crown.1":`Корона. Сотый этаж прямо над нами.`,"bark.arrive_crown.2":`Снова Корона. Так близко. Так безнадёжно.`,"bark.arrive_crown.3":`Верхние этажи. Воздух тонкий. Как и твоё здоровье.`,"bark.k8.1":`Тут K-8! Я уже зачистил этот этаж. Почти.`,"bark.k8.2":`Совет дня от K-8: будь круче. Как я.`,"bark.k8.3":`K-8 в эфире! Фанаты, люблю вас! K-7, ну, привет.`,"bark.k8.4":`K-8 только что погиб на девятом. Специально!`,"bark.k8.5":`Этот этаж спонсирует K-8. Не совсем.`,"bark.k8.6":`Здесь был K-8. Расписался на стене. Дважды.`,"bark.k8.7":`Наперегонки! Я подожду у лифта. Ноги.`,"bark.k8.8":`Кружки K-8 уже в холле! Одна кружка.`,"bark.k8fan.1":`K-8-куст болеет за тебя! Вперёд, K-7!`,"bark.k8fan.2":`Птичка Бренда желает удачи.`,"bark.k8fan.3":`Твой фанат номер один! И единственный.`,"bark.k8fan.4":`Я сделал тебе постер. Из листьев. Я и есть листья.`,"bark.boss_gatekeeper.1":`Имя? Всё ещё не в списке.`,"bark.boss_gatekeeper.2":`Опять ты. Список всё ещё пуст.`,"bark.boss_twins.1":`По итогам прошлой встречи: сегодня вы умираете.`,"bark.boss_twins.2":`Давайте вернёмся к вопросу вашей смерти.`,"bark.boss_foreman.1":`Каска? Опять без каски? Невероятно.`,"bark.boss_foreman.2":`Перекур окончен, курьер.`,"bark.boss_furnace.1":`Тело номер следующее! Разогреваюсь.`,"bark.boss_furnace.2":`За добавкой? Я вот за третьей порцией.`,"bark.boss_avatar.1":`Ранее в «ВОСХОЖДЕНИИ»: ты проиграла.`,"bark.boss_avatar.2":`Улыбочку! Это для трейлера.`,"bark.boss_gardener.1":`Сорняк вернулся. Конечно, вернулся.`,"bark.boss_gardener.2":`Снова весна. Снова стрижка.`,"bark.boss_firewall.1":`ДОСТУП ЗАПРЕЩЁН. Снова. Навсегда.`,"bark.boss_firewall.2":`Решите головоломку. Потом умрите.`,"bark.boss_librarian.1":`ТССС. Пени за просрочку удвоились.`,"bark.boss_librarian.2":`Уже вернулась? Штраф теперь два тела.`,"bark.boss_chairman.1":`Три миллиона и каноэ чуть побольше?`,"bark.boss_chairman.2":`У всех есть цена. У тебя какая-то странная.`,"bark.boss_core.1":`Сотый этаж. Опять. Я поставил стул.`,"bark.boss_core.2":`На финал? Это повтор.`,"bark.beaten_gatekeeper.1":`Ладно. Теперь ты в списке.`,"bark.beaten_gatekeeper.2":`Ворота открыты, дорогуша. Чекпоинт, в прямом эфире.`,"bark.beaten_twins.1":`Это совещание можно было провести письмом.`,"bark.beaten_twins.2":`Средний менеджмент сокращён. Зрители ликуют.`,"bark.beaten_foreman.1":`Ухожу со смены. Навсегда. Скажите профсоюзу.`,"bark.beaten_foreman.2":`Кто теперь будет строить лестницы? Не моя забота.`,"bark.beaten_furnace.1":`Кухня закрыта. Комплименты шефу. То есть мне.`,"bark.beaten_furnace.2":`Огонь погас. Подъём — нет.`,"bark.beaten_avatar.1":`Мой лучший ракурс! Ты попала в лучший ракурс!`,"bark.beaten_avatar.2":`Ладно. Буду смотреть сверху. Поднимайся.`,"bark.beaten_gardener.1":`Возвращаюсь в почву. Полейте меня.`,"bark.beaten_gardener.2":`Прополото. Бонсай тебе этого не простят.`,"bark.beaten_firewall.1":`Ладно. Вы курьер. Доступ разрешён.`,"bark.beaten_firewall.2":`Дыра в моей стене. Заклею скотчем.`,"bark.beaten_librarian.1":`Штраф прощён. Уходи. Тихо.`,"bark.beaten_librarian.2":`В архиве тихо. Слишком тихо. Хорошо.`,"bark.beaten_chairman.1":`Ладно! Ладно! Забирай каноэ!`,"bark.beaten_chairman.2":`Заседание закрыто. На этот раз навсегда.`,"bark.beaten_core.1":`Хорошо. ХОРОШО. Ты победила. Неси коробку.`,"bark.beaten_core.2":`Нужна подпись.`,"bark.won_gatekeeper.1":`Не в списке. И не в целом виде.`,"bark.won_gatekeeper.2":`Следующий!`,"bark.won_twins.1":`Задача: ты. Статус: выполнено.`,"bark.won_twins.2":`Отличная синергия. Твоё тело, наш леверидж.`,"bark.won_foreman.1":`Говорил же. Тут работают в касках.`,"bark.won_foreman.2":`Несчастный случай на производстве. Акт в трёх экземплярах.`,"bark.won_furnace.1":`Средней прожарки. Объедение.`,"bark.won_furnace.2":`Тело подано. Следующее тело, пожалуйста.`,"bark.won_avatar.1":`ВОТ так заканчивают серию.`,"bark.won_avatar.2":`Стоп! Снято! Идеальная смерть!`,"bark.won_gardener.1":`Подстрижена.`,"bark.won_gardener.2":`Компост — это своего рода повышение.`,"bark.won_firewall.1":`Капча не пройдена.`,"bark.won_firewall.2":`Соединение разорвано. Ты тоже.`,"bark.won_librarian.1":`Возвращена на полку.`,"bark.won_librarian.2":`Тсс. Теперь ты в картотеке.`,"bark.won_chairman.1":`Надо было брать каноэ.`,"bark.won_chairman.2":`Всё продаётся. Даже твой позвоночник.`,"bark.won_core.1":`Так близко. Ручка была прямо тут.`,"bark.won_core.2":`Сезон продолжается! В холл, дорогуша.`,"bark.death.1":`Стоп! Чудесно. Трагично. Перезагрузите курьера.`,"bark.death.2":`Она падает! Публика, бушуйте!`,"bark.death.3":`Тело потеряно. Рейтинг найден.`,"bark.death.4":`Такой смерти ещё не было. Спасибо!`,"bark.death.5":`Опять лежит. Чаны уже греются.`,"bark.death.6":`Перемотайте! В замедленной съёмке! Ещё раз!`,"bark.death.7":`Трагедия. В общем, в холл. Живо.`,"bark.death.8":`Варга уже вздыхает. Мне отсюда слышно.`,"bark.death.9":`Ты замешкалась перед рывком. Зрители заметили.`,"bark.death.10":`Клинок был полон. Почему не потратила?`,"bark.death.11":`Классика! Публика это предвидела.`,"bark.death.12":`Смерть номер какая-то. Всё ещё отличное ТВ.`,"bark.early.1":`Первый этаж? Даже K-8 дошёл до второго.`,"bark.early.2":`Рекорд! Не тот рекорд.`,"bark.early.3":`Моргнёшь — пропустишь. Зрители пропустили.`,"bark.slain_trooper.1":`Огрела щитом. Захватывающе.`,"bark.slain_drone.1":`Дрон. Летающий тостер. Попался.`,"bark.slain_hound.1":`Хороший пёсик! Не для тебя. Для меня.`,"bark.slain_argus.1":`Мой маленький узел тебя достал. Горжусь.`,"bark.slain_assassin.1":`Нож в спину. Классика офисной жизни.`,"bark.slain_spider.1":`Смерть от множества маленьких ножек. Брр.`,"bark.slain_grenadier.1":`Граната! А ты стоишь. Смело.`,"bark.slain_brute.1":`Расплющена. Курьер-блинчик, друзья.`,"bark.slain_sniper.1":`Красная линия, а потом ты. Я так и знал.`,"bark.slain_bomber.1":`Бабах. Уборщики благодарят.`,"bark.slain_warden.1":`Надзиратель перещитил. Ай.`,"bark.slain_echo.1":`Убита собственным эхом. Глубоко. Артхаус.`,"bark.ratings.1":`Вот это стиль! Рейтинги пробили крышу!`,"bark.ratings.2":`SSS! Кто-нибудь, клипаните это!`,"bark.ratings.3":`Чат орёт. В хорошем смысле.`,"bark.ratings.4":`Хватит быть крутой. Ты портишь мне злодейскую арку.`,"bark.ratings.5":`Повтор в замедленной съёмке! Красота!`,"bark.ratings.6":`Звонят спонсоры. Продолжай в том же духе.`,"bark.window.1":`В окно! Классический выход.`,"bark.window.2":`Дефенестрация! Публика в восторге.`,"bark.window.3":`Осторожнее с пешеходами, дорогуша.`,"bark.window.4":`Это окно было арендованное.`,"bark.phase.1":`Второй раунд! Босс разозлился.`,"bark.phase.2":`Вторая фаза! Музыку погромче!`,"bark.phase.3":`О, оно злится. Чудесно.`,"bark.phase.4":`Вторая фаза. Больше. Громче. Тупее.`,"bark.clear.1":`Комната зачищена. Уборщики рыдают.`,"bark.clear.2":`Чисто. Жестоко. Следующий этаж.`,"bark.clear.3":`Наши уборщики шлют тебе гневное письмо.`,"bark.clear.4":`Этаж твой. Пока что.`,"bark.clear.5":`Отличная работа. Ненавижу.`,"bark.clear.6":`Склейка — к лифту! Не тормозим.`,"bark.reboot.1":`Встала. Это за счёт заведения.`,"bark.reboot.2":`Перезагрузила. Бухгалтерии ни слова.`,"bark.reboot.3":`Запасная батарея. Последняя. Наверное.`,"bark.lowhp.1":`Здоровье красное. Красное — это плохо.`,"bark.lowhp.2":`Ты протекаешь. Пожалуйста, перестань протекать.`,"bark.lowhp.3":`Тела осталось мало. Найди ремонтный отсек.`,"bark.lowhp.4":`Я сегодня новое собирать не буду.`,"bark.repair.1":`Залатала. Постарайся не распороть.`,"bark.repair.2":`Свежий скотч на твою душу.`,"bark.repair.3":`Починила. Счёт придёт по почте.`,"bark.collector.1":`Пс-с. Слепки? Я собираю. Ты теряешь. Все в плюсе.`,"bark.collector.2":`О, свежие воспоминания. На вкус как дождь.`,"bark.collector.3":`Твои слепки пахнут мечом и переработкой.`,"bark.collector.4":`Трать здесь, или их заберёт пол.`,"bark.collector.5":`Мёртвые курьеры ничего не хранят. Живые меняются.`,"bark.collector.6":`Одно воспоминание о бутерброде. Вкуснятина.`,"bark.collector.7":`Опять ты! Мой любимый дырявый курьер.`,"bark.collector.8":`Слепки мне, чертежи тебе.`,"bark.collector.9":`Осторожнее там. Мёртвый клиент — плохой клиент.`,"bark.collector.10":`Сотый этаж? Привези мне сувенир.`,sold:`Продано`,goldPrice:`{n} зол.`,flaskRefillSub:`Заряды: {n} из {of}. Лечит 40% HP.`,merchantTitle:`Торговец`,goldHave:`Золото: {n} · пропадёт в конце подъёма`,doorHud:`СЕЙФ, ЭТАЖ {n}: {t}`,feedPts:`+ {what} {n}`,feedLine:`+ {what}`,"tab.bestiary":`Бестиарий`,"tabSub.bestiary":`Все враги башни. Встреть их, чтобы заполнить.`,"feed.juggle":`ЖОНГЛЯЖ`,"feed.parry":`ПАРИРОВАНИЕ`,"feed.overkill":`ПЕРЕБОР`,"feed.close":`НА ВОЛОСКЕ`,"feed.clash":`СШИБКА`,"feed.slam":`УДАР`,"feed.reversal":`ОТВЕТКА`,"feed.breach":`ПРОБОЙ`,"say.secret":`ТАЙНАЯ КОМНАТА`,"say.hatch":`КЛОНЫ ПРОСЫПАЮТСЯ`,"feed.crush":`РАЗДАВЛЕН`,"feed.boom":`БАБАХ`,"feed.glass":`СКВОЗЬ СТЕКЛО`,"feed.shock":`ПОДЖАРЕН`,"feed.drop":`ЛЮСТРА`,"objTip.crate":`Ящики. Разбей: иногда золото.`,"objTip.barrel":`Бочки с топливом. Ударь и отойди: взрыв заденет всех рядом. Отбрось в неё охранника y.package.2":`No es asunto mío. La entrega sí.`,"story.package.3":`El albarán dice: «Al Fundador, piso 100. Pedido hace cuarenta años».`,"story.package.4":`¿Cuarenta años? ¿El Fundador? Siguiente pregunta. ¡Pausa publicitaria!`,"story.sweeps.1":`Sigues GANANDO. ¿Sabes qué hace ganar por la audiencia? ¡Nada!`,"story.sweeps.2":`El público quiere drama. Lágrimas. Una caída desde una ventana muy alta.`,"story.sweeps.3":`¡Buenas noticias! K-8 murió en el piso doce. Dos veces. A los fans les encantó.`,"story.sweeps.4":`¿Ves? ESO es una estrella. Aprende de él, K-7.`,"story.sweeps.5":`Anotado. Sigo entregando.`,"story.spares.1":`Viste las cubas. Sí, todas son tú. No, no puedes ponerles nombre.`,"story.spares.2":`¿Cuántas?`,"story.spares.3":`Suficientes. Cada vez que mueres, te vierto en una nueva. Como sopa, pero más triste.`,"story.spares.4":`Tu factura está en el mostrador. Vence en una vida.`,"story.founder.1":`Conociste a mi avatar. Precioso, ¿verdad? Lo diseñé a imagen del Fundador.`,"story.founder.2":`¿Dónde está el Fundador?`,"story.founder.3":`De vacaciones. Largas. Cuarenta años. Deja de preguntar. ¡Pausa publicitaria!`,"story.founder.4":`Otra vez «pausa publicitaria». Siempre lo dice cuando miente.`,"story.fanmail.1":`Oye. K-7. El Jardinero me podó. Literalmente. Ahora soy un seto.`,"story.fanmail.2":`La cadena me canceló. Dijeron que era demasiado reemplazable. ¡Yo!`,"story.fanmail.3":`Así que ahora soy tu fan. ¿Póster firmado? ¿No? Lo haré igual.`,"story.fanmail.4":`No te metas en mis pisos.`,"story.fanmail.5":`¡Me habló! ¡Chat, me HABLÓ!`,"story.overdue.1":`El archivo guarda cada mente subida en esta torre. Busqué al Fundador.`,"story.overdue.2":`Su estante está vacío. Su mente se prestó hace cuarenta años. A ARGUS.`,"story.overdue.3":`¡Qué grosería! ¡No se lee el carné de biblioteca de un hombre!`,"story.overdue.4":`De un hombre.`,"story.overdue.5":`De una IA. Una IA perfectamente normal. ¡Pausa publicitaria!`,"story.finale.1":`Último sector, K-7. Hagamos un trato. Suelta el paquete y serás presentadora.`,"story.finale.2":`¡Tu propio show! ¡Tu propia frase estrella! ¡Tu propia doble que explota!`,"story.finale.3":`Se requiere firma.`,"story.finale.4":`Eso no es una frase estrella. Es una amenaza.`,"story.season2.1":`¡Última hora! ¡La cadena renovó LA ESCALADA por una segunda temporada!`,"story.season2.2":`La mensajería también encontró treinta mil paquetes perdidos más.`,"story.season2.3":`¿Direcciones?`,"story.season2.4":`Piso cien. Todos y cada uno.`,"story.season2.5":`Al vestíbulo otra vez, cariño. Misma torre, muertes frescas. ¡Cabecera!`,"story.delivery.1":`Piso cien. Un escritorio. Una pantalla cansada. Un bolígrafo con cadena.`,"story.delivery.2":`Entrega para el Fundador.`,"story.delivery.3":`No hay ningún Fundador. Solo está ARGUS. Que está bien. Perfectamente bien.`,"story.delivery.4":`Se requiere firma.`,"story.delivery.4.pen":`Darle el bolígrafo`,"story.delivery.4.pen.1":`Vale. Firmado. ¿Contenta?`,"story.delivery.4.door":`Dejarlo en la puerta`,"story.delivery.4.door.1":`¡NO! ¡Nadie lo deja en la puerta! ¡Dame ese bolígrafo!`,"story.delivery.5":`La caja se abre. Dentro, un formulario: CANCELAR LA VIDA ETERNA. Lo pidió el Fundador.`,"story.delivery.6":`Lo pedí el día que me subí. La eternidad me aburrió el jueves.`,"story.delivery.7":`Cuarenta años tarde, mensajera. Gracias.`,"story.delivery.8":`La torre se queda en silencio. En algún lugar, un público de plató aplaude.`,"story.meet-gatekeeper.1":`ALTO. ¿Nombre?`,"story.meet-gatekeeper.2":`K-7. Entrega para el piso cien.`,"story.meet-gatekeeper.3":`Revisando la lista. No estás en la lista. Nunca hay nadie en la lista.`,"story.meet-twins.1":`¡Bienvenida! Somos Sinergia y Apalancamiento, tus mandos intermedios.`,"story.meet-twins.2":`Convocamos una reunión sobre tu muerte. La asistencia es obligatoria.`,"story.meet-twins.3":`Seré breve.`,"story.meet-foreman.1":`¡Eh, eh! Zona de casco obligatorio. ¿Dónde está tu casco?`,"story.meet-foreman.2":`Tengo una espada.`,"story.meet-foreman.3":`¡Eso no es un casco! ¡Infracción de seguridad! ¡Fuerza letal autorizada!`,"story.meet-furnace.1":`¡K-7! Bienvenida otra vez. Ya te he cocinado treinta veces.`,"story.meet-furnace.2":`El cuerpo doce salió crujiente. El diecinueve, algo soso.`,"story.meet-furnace.3":`La cocina está cerrada.`,"story.meet-avatar.1":`¡Luces! ¡Cámara! ¡Soy yo, ARGUS, en gloriosa alta definición!`,"story.meet-avatar.2":`¡El final de mitad de temporada, en directo! Intenta morir con estilo.`,"story.meet-avatar.3":`Eres un holograma.`,"story.meet-avatar.4":`Soy una ESTRELLA.`,"story.meet-gardener.1":`Shh. Los bonsáis duermen. Algo creció donde no debía.`,"story.meet-gardener.2":`Una mala hierba con espada. Podo malas hierbas. Ayer podé a un K-8.`,"story.meet-gardener.3":`No soy una mala hierba.`,"story.meet-firewall.1":`ACCESO DENEGADO. Demuestra que no eres un robot.`,"story.meet-firewall.2":`Soy casi un robot.`,"story.meet-firewall.3":`Selecciona todas las casillas con una mensajera. Tienes un segundo.`,"story.meet-librarian.1":`SHHH. Tus recuerdos llevan cuarenta años de retraso, mensajera.`,"story.meet-librarian.2":`La multa es un cuerpo. Se paga ahora.`,"story.meet-librarian.3":`Apúntalo en mi cuenta.`,"story.meet-chairman.1":`¡K-7! Hablemos de números. Un millón de créditos por dar media vuelta.`,"story.meet-chairman.2":`No.`,"story.meet-chairman.3":`Dos millones y un yate. Un yate pequeño. Un bote. ¿Una canoa bonita?`,"story.meet-chairman.4":`Se requiere firma.`,"story.meet-core.1":`Piso cien. Mi casa. Mi plató. Mi escritorio.`,"story.meet-core.2":`¿Quieres entregar esa caja? Pues tendrás que pasar por MÍ.`,"story.meet-core.3":`Ese es el plan.`,"story.meet-obol.1":`Psst. Mensajera. En el conducto. Sí, el conducto con brazos.`,"story.meet-obol.2":`Soy Óbolo. Colecciono huellas de memoria. Tú las sueltas al pelear.`,"story.meet-obol.3":`Tus huellas por mis planos. Justo, más o menos.`,"story.meet-obol.4":`¿Qué haces con los recuerdos?`,"story.meet-obol.5":`Me los pico. Los tuyos saben a lluvia y horas extra.`,"story.deaths-5.1":`Cuerpo seis. Tu tarjeta de fidelidad va por la mitad.`,"story.deaths-5.2":`¿Y qué gano?`,"story.deaths-5.3":`Otro cuerpo. Lo mismo que por morir.`,"story.deaths-10.1":`¡Diez muertes! La cadena envió una tarta.`,"story.deaths-10.2":`Es un holograma. Como tus posibilidades.`,"story.deaths-10.3":`Sigo subiendo.`,"story.deaths-25.1":`Veinticinco cuerpos. Los de repuesto en las cubas fundaron un sindicato.`,"story.deaths-25.2":`Que suban ellos.`,"story.deaths-25.3":`Quieren seguro dental.`,"story.deaths-50.1":`¡Cincuenta muertes, K-7! ¡Yo solo llevo cuarenta y nueve!`,"story.deaths-50.2":`Espera. Cincuenta. Morí haciendo esta llamada.`,"story.deaths-100.1":`Cien muertes. Una por piso. Poético.`,"story.deaths-100.2":`Me quedé sin pies. Este cuerpo tiene dos izquierdos.`,"story.deaths-100.3":`Sigo subiendo.`,"story.log-01.1":`Nota de Seguridad. No hay nadie en la lista. La lista está vacía. Sigan revisando la lista.`,"story.log-02.1":`Notas del presentador. Temporada 40. Concursante K-7. Probabilidad de sobrevivir, cero. Gran tele.`,"story.log-03.1":`Circular. Los muertos deben asistir a la reunión del lunes. Estar subido no es excusa.`,"story.log-04.1":`Nota de voz. La mensajera llegó muerta, agarrando un paquete. No lo soltaba.`,"story.log-04.2":`Así que construí el cuerpo alrededor de la mano. Era más fácil.`,"story.log-05.1":`Cartel del laboratorio. No lamer los núcleos cinéticos. Va por ti, Gerardo.`,"story.log-06.1":`Su espada guarda cada golpe. Gástalo todo de una vez. Como mi sueldo.`,"story.log-07.1":`Etiqueta de la cuba 31. Estado, despierta. Educada. Pidió una espada y un café.`,"story.log-08.1":`Menú del Horno. Plato del día, K-7. El de ayer también era K-7.`,"story.log-09.1":`Informe de audiencia. Muertes al alza, victorias a la baja. Nota mental: más lava.`,"story.log-10.1":`Una nota adhesiva de hace cuarenta años. «Pedir el formulario. La eternidad es larga». F.`,"story.log-11.1":`Vlog de K-8, día tres. Sigo siendo un seto. Vive un pájaro en mí. Se llama Brenda.`,"story.log-12.1":`Registro del cortafuegos. 9000 intrusos bloqueados. 8999 eran K-7. Uno era una tostadora.`,"story.log-13.1":`Copia de seguridad 77. En todas sueno cansado. Borrar. Borrar. Conservar.`,"story.log-14.1":`Ficha del archivo. Mente del Fundador. Prestada a ARGUS. Cuarenta años de retraso.`,"story.log-15.1":`Acta del consejo. Torre vendida a ARGUS por una plaza de parking. El Presidente, encantado.`,"story.log-16.1":`Si lees esto, ya casi estás arriba. Aposté mi pensión por ti. No te mueras. Mucho.`,"story.log-17.1":`Último registro. Si la mensajera lee esto, el bolígrafo está en el cajón de arriba.`,"story.log-spam.1":`Carpeta de spam. ¡Has ganado una vida eterna gratis! Aplican condiciones para siempre.`,"bark.lobby.1":`¡Cuerpo {n}, arriba! ¡A sus puestos!`,"bark.lobby.2":`Bienvenido, cuerpo {n}. El vestíbulo te echaba de menos.`,"bark.lobby.3":`¡Cuerpo {n}! Recién salido de la cuba. Aún húmedo.`,"bark.lobby.4":`Espectadores, sale el cuerpo {n}. Apuestas abiertas.`,"bark.lobby.5":`¡Vestíbulo otra vez! Cuerpo {n}. Misma mensajera, rodillas nuevas.`,"bark.lobby.6":`Cuerpo {n}. Prueba las escaleras. Es broma. Ascensor.`,"bark.arrive_security.1":`¡Seguridad! Mis gorilas. ¡Sonrían a cámara!`,"bark.arrive_security.2":`Seguridad otra vez. Los guardias saludan. Con armas.`,"bark.arrive_security.3":`De vuelta al control. ¿Papeles? ¿No? A pelear.`,"bark.arrive_offices.1":`¡Las oficinas! Plantilla muerta, aún en reuniones.`,"bark.arrive_offices.2":`Oficinas. Cuidado con las impresoras. Ahora muerden.`,"bark.arrive_offices.3":`Cubículos. Donde los sueños rellenan informes.`,"bark.arrive_labs.1":`Los laboratorios. Aquí te hizo Varga.`,"bark.arrive_labs.2":`Laboratorios. No toques nada. Sobre todo eso.`,"bark.arrive_labs.3":`Pisos de ciencia. Ponte gafas. O no.`,"bark.arrive_vats.1":`Las cubas de clones. Saluda a tus cuerpos de repuesto.`,"bark.arrive_vats.2":`Las cubas. Tus cuerpos saludan. No les devuelvas el saludo.`,"bark.arrive_vats.3":`Cubas otra vez. Alguien tiene tu cara. Muchos.`,"bark.arrive_reactor.1":`El reactor. Caliente. Como mi audiencia.`,"bark.arrive_reactor.2":`Pisos del reactor. Ojo, el suelo es lava.`,"bark.arrive_reactor.3":`El núcleo tararea tu sintonía.`,"bark.arrive_gardens.1":`Jardines del cielo. El consejo hacía pícnics aquí.`,"bark.arrive_gardens.2":`Jardines. No pises los bonsáis.`,"bark.arrive_gardens.3":`¡Aire fresco! Filtrado. Con impuestos. Disfruta.`,"bark.arrive_servers.1":`La aguja de servidores. Vivo aquí. Límpiate los pies.`,"bark.arrive_servers.2":`Servidores. Cada lucecita que parpadea soy yo.`,"bark.arrive_servers.3":`Pisos de datos. Tus ecos están cargando.`,"bark.arrive_archive.1":`El archivo de mentes. Cada alma, por orden alfabético.`,"bark.arrive_archive.2":`El archivo. Shh. Las mentes duermen.`,"bark.arrive_archive.3":`Archivo. Tu expediente es gordo. Y triste.`,"bark.arrive_executive.1":`Los pisos ejecutivos. Aquí vivían los ricos.`,"bark.arrive_executive.2":`Suites ejecutivas. Cuidado con los carritos de golf.`,"bark.arrive_executive.3":`Pisos del consejo. Trae tu presentación.`,"bark.arrive_crown.1":`La Corona. El piso cien está justo encima.`,"bark.arrive_crown.2":`La Corona otra vez. Tan cerca. Tan condenada.`,"bark.arrive_crown.3":`Pisos altos. El aire escasea. Como tu vida.`,"bark.k8.1":`¡Aquí K-8! Ya limpié este piso. Casi.`,"bark.k8.2":`Consejo del día de K-8: sé más guay. Como yo.`,"bark.k8.3":`¡K-8 en directo! ¡Fans, os quiero! K-7, hola, supongo.`,"bark.k8.4":`K-8 acaba de morir en el piso nueve. A propósito.`,"bark.k8.5":`Este piso lo patrocina K-8. No es verdad.`,"bark.k8.6":`K-8 estuvo aquí. Firmó la pared. Dos veces.`,"bark.k8.7":`¡Te echo una carrera! Te espero en el ascensor. Mis piernas.`,"bark.k8.8":`¡Tazas de K-8 ya en el vestíbulo! Es una taza.`,"bark.k8fan.1":`¡K-8 el seto te anima! ¡Vamos, K-7!`,"bark.k8fan.2":`La pájara Brenda te desea suerte.`,"bark.k8fan.3":`¡Tu fan número uno! Y el único.`,"bark.k8fan.4":`Te hice un póster. De hojas. Yo soy hojas.`,"bark.boss_gatekeeper.1":`¿Nombre? Sigues sin estar en la lista.`,"bark.boss_gatekeeper.2":`Tú otra vez. La lista sigue vacía.`,"bark.boss_twins.1":`Según la última reunión, hoy mueres.`,"bark.boss_twins.2":`Retomemos el tema de tu muerte.`,"bark.boss_foreman.1":`¿Casco? ¿Sigues sin casco? Increíble.`,"bark.boss_foreman.2":`Se acabó el descanso, mensajera.`,"bark.boss_furnace.1":`¡Cuerpo número siguiente! Precalentando.`,"bark.boss_furnace.2":`¿Vienes a repetir? Yo voy por la tercera.`,"bark.boss_avatar.1":`Anteriormente, en LA ESCALADA: perdiste.`,"bark.boss_avatar.2":`¡Sonríe! Esta es para el tráiler.`,"bark.boss_gardener.1":`La mala hierba vuelve. Claro que sí.`,"bark.boss_gardener.2":`Primavera otra vez. Poda otra vez.`,"bark.boss_firewall.1":`ACCESO DENEGADO. Otra vez. Para siempre.`,"bark.boss_firewall.2":`Resuelve este acertijo. Luego muere.`,"bark.boss_librarian.1":`SHHH. Tu recargo se ha duplicado.`,"bark.boss_librarian.2":`¿Ya de vuelta? La multa ahora es de dos cuerpos.`,"bark.boss_chairman.1":`¿Tres millones y una canoa un poco más grande?`,"bark.boss_chairman.2":`Todos tienen un precio. El tuyo es raro.`,"bark.boss_core.1":`Piso cien. Otra vez. Te puse una silla.`,"bark.boss_core.2":`¿Vienes al final? Es una reposición.`,"bark.beaten_gatekeeper.1":`Vale. Ya estás en la lista.`,"bark.beaten_gatekeeper.2":`Puerta abierta, cariño. Un punto de control, en directo.`,"bark.beaten_twins.1":`Esta reunión podría haber sido un correo.`,"bark.beaten_twins.2":`Mandos intermedios, recortados. El público aplaude.`,"bark.beaten_foreman.1":`Fichando la salida. Para siempre. Avisad al sindicato.`,"bark.beaten_foreman.2":`¿Quién construye ahora las escaleras? No es mi problema.`,"bark.beaten_furnace.1":`Cocina cerrada. Mis felicitaciones al chef. O sea, a mí.`,"bark.beaten_furnace.2":`El fuego se apagó. La escalada no.`,"bark.beaten_avatar.1":`¡Mi lado bueno! ¡Le diste a mi lado bueno!`,"bark.beaten_avatar.2":`Vale. Lo veré desde arriba. Sube.`,"bark.beaten_gardener.1":`Vuelvo a la tierra. Riégame.`,"bark.beaten_gardener.2":`Desbrozado. Los bonsáis nunca te lo perdonarán.`,"bark.beaten_firewall.1":`Vale. Eres mensajera. Acceso concedido.`,"bark.beaten_firewall.2":`Un agujero en mi muro. Lo taparé con cinta.`,"bark.beaten_librarian.1":`Multa perdonada. Vete. En silencio.`,"bark.beaten_librarian.2":`El archivo está en silencio. Demasiado. Bien.`,"bark.beaten_chairman.1":`¡Vale! ¡Vale! ¡Quédate la canoa!`,"bark.beaten_chairman.2":`Se levanta la sesión. Esta vez para siempre.`,"bark.beaten_core.1":`Vale. VALE. Ganas tú. Trae la caja.`,"bark.beaten_core.2":`Se requiere firma.`,"bark.won_gatekeeper.1":`Ni en la lista ni de una pieza.`,"bark.won_gatekeeper.2":`¡Siguiente!`,"bark.won_twins.1":`Tarea: tú. Estado: completada.`,"bark.won_twins.2":`Gran sinergia. Tu cuerpo, nuestro apalancamiento.`,"bark.won_foreman.1":`Te lo dije. Zona de casco.`,"bark.won_foreman.2":`Accidente laboral. Papeleo por triplicado.`,"bark.won_furnace.1":`Al punto. Delicioso.`,"bark.won_furnace.2":`Cuerpo servido. El siguiente, por favor.`,"bark.won_avatar.1":`Y ASÍ se termina un episodio.`,"bark.won_avatar.2":`¡Corten! ¡Se queda! ¡Una muerte perfecta!`,"bark.won_gardener.1":`Podada.`,"bark.won_gardener.2":`El compost es una especie de ascenso.`,"bark.won_firewall.1":`CAPTCHA fallido.`,"bark.won_firewall.2":`Conexión terminada. Tú también.`,"bark.won_librarian.1":`Devuelta a la estantería.`,"bark.won_librarian.2":`Shh. Ya estás archivada.`,"bark.won_chairman.1":`Debiste aceptar la canoa.`,"bark.won_chairman.2":`Todo está en venta. Hasta tu columna.`,"bark.won_core.1":`Tan cerca. El bolígrafo estaba ahí mismo.`,"bark.won_core.2":`¡La temporada sigue! Al vestíbulo, cariño.`,"bark.death.1":`¡Corten! Maravilloso. Trágico. Reiniciad a la mensajera.`,"bark.death.2":`¡Y cae! ¡Público, a gritar!`,"bark.death.3":`Cuerpo perdido. Audiencia encontrada.`,"bark.death.4":`¡Esa forma de morir es nueva! ¡Gracias!`,"bark.death.5":`Otra vez al suelo. Las cubas se calientan.`,"bark.death.6":`¡Rebobina! ¡A cámara lenta! ¡Otra vez!`,"bark.death.7":`Trágico. En fin, al vestíbulo. Rapidito.`,"bark.death.8":`Varga ya está suspirando. La oigo desde aquí.`,"bark.death.9":`Dudaste antes del impulso. El público lo notó.`,"bark.death.10":`Tu espada estaba llena. ¿Por qué no la gastaste?`,"bark.death.11":`¡Un clásico! El público lo vio venir.`,"bark.death.12":`Muerte número lo que sea. Sigue siendo gran tele.`,"bark.early.1":`¿Piso uno? Hasta K-8 llegó al dos.`,"bark.early.2":`¡Tiempo récord! El récord equivocado.`,"bark.early.3":`Si parpadeas, te lo pierdes. El público se lo perdió.`,"bark.slain_trooper.1":`Un golpe de escudo. Apasionante.`,"bark.slain_drone.1":`Un dron. Una tostadora voladora. Te pilló.`,"bark.slain_hound.1":`¡Buen perro! Para ti no. Para mí.`,"bark.slain_argus.1":`Mi nodito te atrapó. Qué orgullo.`,"bark.slain_assassin.1":`Puñalada por la espalda. Un clásico de oficina.`,"bark.slain_spider.1":`Muerte por muchas patitas. Escalofrío.`,"bark.slain_grenadier.1":`¡Granada! No te moviste. Valiente.`,"bark.slain_brute.1":`Aplastada. Mensajera a la plancha, amigos.`,"bark.slain_sniper.1":`Una línea roja, y luego tú. Lo sabía.`,"bark.slain_bomber.1":`Bum. Los de limpieza te lo agradecen.`,"bark.slain_warden.1":`Un celador te ganó a escudos. Ay.`,"bark.slain_echo.1":`Asesinada por tu propio eco. Profundo. Artístico.`,"bark.ratings.1":`¡Qué estilo! ¡La audiencia por las nubes!`,"bark.ratings.2":`¡SSS! ¡Que alguien grabe eso!`,"bark.ratings.3":`El chat está gritando. Para bien.`,"bark.ratings.4":`Deja de ser guay. Me arruinas el arco de villano.`,"bark.ratings.5":`¡Repetición a cámara lenta! ¡Precioso!`,"bark.ratings.6":`Llaman los patrocinadores. Sigue así.`,"bark.window.1":`¡Por la ventana! Una salida clásica.`,"bark.window.2":`¡Defenestración! Al público le encanta.`,"bark.window.3":`Cuidado con los peatones, cariño.`,"bark.window.4":`Esa ventana era alquilada.`,"bark.phase.1
