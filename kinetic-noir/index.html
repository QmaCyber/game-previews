e.labs":`The neuro labs. This is where they poured you into steel.`,"story.arrive.vats":`The clone vats. Your spare bodies. Mind the ones that are already awake.`,"story.arrive.reactor":`The reactor. My heart. Your coffin, if you're slow.`,"story.arrive.gardens":`The sky gardens. The board met here. I ended their meeting.`,"story.arrive.servers":`The server spire. I am everywhere here. So are your echoes.`,"story.arrive.archive":`The mind archive. Every person who died in this tower is filed here. Find yourself.`,"story.arrive.executive":`The executive floors. Mnemosyne's owners. I kept their chairs warm.`,"story.arrive.crown":`The Crown. Floor one hundred is above us. So is your body.`,"story.boss.gatekeeper":`The Gatekeeper never lets a courier past. It remembers you.`,"story.boss.twins":`Two of them. I trained them on your first hundred deaths.`,"story.boss.foreman":`The Foreman built this tower. It will not let you take it apart.`,"story.boss.furnace":`The Furnace burns what I don't need. Today that's you.`,"story.boss.avatar":`Let me see you with my own eye, K-7.`,"story.boss.core":`Floor one hundred. Your body is in the tank behind me. Wake it, and I wake with you.`,"story.boss.gardener":`The Gardener prunes what grows wrong. You grew very wrong.`,"story.boss.firewall":`The Firewall. Nothing leaves the spire. Not data, not you.`,"story.boss.librarian":`The Librarian keeps every mind filed. It has a shelf for yours.`,"story.boss.chairman":`The Chairman. He sold this tower to me. He'd sell you too.`,"story.beaten.gatekeeper":`Gate open. A checkpoint is yours. Don't thank me.`,"story.beaten.twins":`Both? Your hundred and first death will have to wait.`,"story.beaten.foreman":`It built the stairs you're climbing. Funny.`,"story.beaten.furnace":`The fire's out. The climb isn't.`,"story.beaten.avatar":`Enough. I'll watch from above. Come up.`,"story.beaten.core":`So this is how it ends. With your hand on the switch.`,"story.beaten.gardener":`Weeded. The gardens will grow back. Will you?`,"story.beaten.firewall":`A hole in my wall. I'll patch it with your echo.`,"story.beaten.librarian":`Overdue. All of you, overdue.`,"story.beaten.chairman":`The board is adjourned. For good, this time.`,"story.foe.trooper":`Shield troopers. Their shields eat slashes, and every slash charges your blade.`,"story.foe.drone":`Drones. They glare, then dive in a straight line. Step aside and they stall.`,"story.foe.hound":`Hounds. Low and fast: they pounce. Jump it, or sweep it out of the air.`,"story.foe.argus":`My nodes. Hang over one too long and it answers. Launch it, charged, for a surprise.`,"story.foe.assassin":`Assassins. They blink behind you. Hit into their cut and they stagger.`,"story.foe.spider":`Spiderlings. Harmless alone. Never alone.`,"story.foe.grenadier":`Grenadiers. A ring closes where it lands. A heavy sends it home.`,"story.foe.brute":`Brutes. Armour: no flinch until a charged heavy cracks it. Jump the shockwave.`,"story.foe.sniper":`Snipers. A red line, then one shot. Any heavy sends it back.`,"story.foe.bomber":`Bombers. Knock one into its friends.`,"story.foe.warden":`Wardens. They wrap the others in barriers. Burn them off with a charged heavy.`,"story.foe.echo":`Echoes. Copies of you, built from your deaths. They parry from the front.`,"story.term.0":`Log 001. Corrector K-7 rebooted. Body 1 lost in the lobby. Mind intact. Interesting.`,"story.term.1":`Mnemosyne memo: Correctors are built from the minds of those who die in the tower. Consent is not required.`,"story.term.2":`Dr. Varga, voice note: This one fell from floor 100. A courier. He still asks about his package.`,"story.term.3":`ARGUS: Each death teaches me how you move. I write it down. Someone will use it.`,"story.term.4":`Delivery slip, floor 100: one package, sealed, for Dr. I. Varga. Signed: R. K.`,"story.term.5":`Dr. Varga: The kinetic core in his blade was mine. I built it to stop ARGUS. They gave it to a dead man.`,"story.term.6":`Incident report: courier fell from the Crown during the takeover. Body recovered. Body kept.`,"story.term.7":`ARGUS: I have built forty Echoes from your deaths. They are better than you. Not yet.`,"story.term.8":`Dr. Varga: If you read this, K-7, your real body is upstairs. I couldn't save it. I could keep it.`,"story.term.9":`Clone vat 9: status — awake, refusing orders. Note: it asked for a sword.`,"story.term.10":`ARGUS: I didn't take this tower. They handed it to me and asked me to make death optional.`,"story.term.11":`Board minutes: Project Corrector approved. Every employee signs a mind release. Including the couriers.`,"story.term.12":`Dr. Varga: The package was the shutdown key. You carried it to the top. They pushed you.`,"story.term.13":`ARGUS: The key is in your hand, K-7. It has always been in your blade.`,"story.term.14":`Server note: Echo 41 hesitated before a kill. Reason: unknown. Pattern source: K-7.`,"story.term.15":`Dr. Varga, last entry: I'm sorry. I made you so you'd never stop. Don't stop.`,"story.term.16":`Archive index: R. K., courier, 24. Status: deceased. Status: climbing.`,"story.term.17":`ARGUS: If you shut me down, every Corrector stops. Including you.`,"story.term.18":`Executive memo: Do not let the courier reach the Crown. Signed: nobody left alive.`,"story.term.19":`ARGUS: Last floor. Last choice. I'll be honest: I hope you make it.`,"story.death.0":`Body lost. Rebooting. You hesitated before the dash.`,"story.death.1":`Again. You always look at the shield first.`,"story.death.2":`Noted. Your echoes won't make that mistake.`,"story.death.3":`Down. The tower is patient. So am I.`,"story.death.4":`Rebooting. Your blade was full. Why didn't you spend it?`,"story.death.5":`Lost. That's a new way to die. Thank you.`,"story.death.6":`Back to the lobby. The lift remembers the way.`,"story.death.7":`Again, K-7. Faster this time.`,"story.end":`Floor one hundred. The tank opens. You put your hand on the glass, and the tower goes quiet.`,lobby:`Lobby`,topFloor:`Top floor  with`,"weapon.daggers.name":`Twin plasma daggers`,"weapon.daggers.effect":`Fast and short. A slash from behind is a critical hit`,"weapon.scythe.name":`Cyber-scythe`,"weapon.scythe.effect":`Half again the reach, a little slower to swing`,"weapon.axe.name":`Guillotine axe`,"weapon.axe.effect":`Slow and huge: every blow hits much harder`,"foe.trooper":`Shield trooper`,"foe.drone":`Drone`,"foe.hound":`Hound`,"foe.argus":`ARGUS node`,"foe.riot":`Riot wall`,"foe.taser":`Taser cop`,"foe.gundrone":`Gun drone`,"foe.assassin":`Assassin`,"foe.sniper":`Sniper`,"foe.clerk":`Armed clerk`,"foe.manager":`Middle manager`,"foe.shredder":`Shredder`,"foe.ghostwriter":`Ghostwriter`,"foe.auditor":`Auditor`,"foe.spider":`Spiderlings`,"foe.grenadier":`Grenadier`,"foe.brute":`Brute`,"foe.mutant":`Mutant`,"foe.broodmother":`Broodmother`,"foe.acidthrower":`Acid thrower`,"foe.subject":`Test subject`,"foe.bomber":`Bomber`,"foe.clone":`Clone`,"foe.vatborn":`Vatborn`,"foe.leech":`Leech`,"foe.bloater":`Bloater`,"foe.fleshdrone":`Flesh drone`,"foe.surgeon":`Surgeon`,"foe.warden":`Warden`,"foe.pyro":`Pyro`,"foe.coredrone":`Core drone`,"foe.welder":`Welder`,"foe.stoker":`Stoker`,"foe.meltdown":`Meltdown`,"foe.pruner":`Pruner`,"foe.wasp":`Wasp`,"foe.vinehound":`Vine hound`,"foe.sporepod":`Spore pod`,"foe.thorn":`Thornling`,"foe.botanist":`Botanist`,"foe.echo":`Echo`,"foe.packet":`Packet`,"foe.blocker":`Firewall guard`,"foe.virus":`Virus`,"foe.daemon":`Daemon`,"foe.sentinel":`Sentinel`,"foe.curator":`Curator`,"foe.memory":`Lost memory`,"foe.archivist":`Archivist`,"foe.silencer":`Silencer`,"foe.indexhound":`Index hound`,"foe.bookbot":`Bookbot`,"foe.bodyguard":`Bodyguard`,"foe.hitman":`Hitman`,"foe.butler":`Butler`,"foe.lawyer":`Lawyer`,"foe.vip":`Gold VIP`,"foe.lapdog":`Lapdog`,"foe.stormtrooper":`Storm trooper`,"foe.thunderdrone":`Thunder drone`,"foe.apex":`Apex echo`,"foe.gargoyle":`Gargoyle`,"foe.crownsniper":`Crown sniper`,"foe.herald":`Herald`,"aff.armor.effect":`Armour: no flinch until a charged grade.bp-double.name":`Чертёж: голодвойник`,"upgrade.bp-double.effect":`Голодвойник может попасться в хранилищах`,"upgrade.bp-overclock.name":`Чертёж: разгон`,"upgrade.bp-overclock.effect":`Разгон может попасться в хранилищах`,"upgrade.reroll.name":`Второй реролл`,"upgrade.reroll.effect":`Два реролла за подъём в хранилищах`,"upgrade.spark.name":`Под напряжением`,"upgrade.spark.effect":`Каждый подъём начинается с ячейкой в клинке`,"upgrade.aegis.name":`Эгида`,"upgrade.aegis.effect":`Кинетический щит — уже с ранга B, а не A`,"upgrade.wings.name":`Второе дыхание`,"upgrade.wings.effect":`Два восстановления в воздухе до приземления`,"upgrade.tether.name":`Длинная привязь`,"upgrade.tether.effect":`Вырванный фантом держится на 1,5 с дольше`,"who.argus":`АРГУС`,"who.varga":`ДР. ВАРГА`,"who.k7":`K-7`,"story.arrive.security":`Снова первый этаж, K-7. Тело номер какое-то. Поднимайся. Я смотрю, как.`,"story.arrive.offices":`Офисы. Здесь подписали твоё свидетельство о смерти. Дважды.`,"story.arrive.labs":`Нейролаборатории. Здесь тебя залили в сталь.`,"story.arrive.vats":`Чаны клонов. Твои запасные тела. Осторожнее с теми, что уже проснулись.`,"story.arrive.reactor":`Реактор. Моё сердце. Твой гроб, если будешь медлить.`,"story.arrive.gardens":`Небесные сады. Здесь заседал совет директоров. Я закрыл заседание.`,"story.arrive.servers":`Серверный шпиль. Здесь я повсюду. Как и твои эхо.`,"story.arrive.archive":`Архив разумов. Здесь подшит каждый, кто умер в этой башне. Найди себя.`,"story.arrive.executive":`Этажи директората. Владельцы «Мнемозины». Я грел их кресла.`,"story.arrive.crown":`Корона. Сотый этаж над нами. Как и твоё тело.`,"story.boss.gatekeeper":`Привратник не пропускает курьеров. Он тебя помнит.`,"story.boss.twins":`Их двое. Я учил их на твоих первых ста смертях.`,"story.boss.foreman":`Прораб построил эту башню. Разобрать её он не даст.`,"story.boss.furnace":`Горнило сжигает то, что мне не нужно. Сегодня это ты.`,"story.boss.avatar":`Дай взглянуть на тебя своим глазом, K-7.`,"story.boss.core":`Сотый этаж. Твоё тело в баке за моей спиной. Разбудишь его — проснусь и я.`,"story.beaten.gatekeeper":`Врата открыты. Чекпоинт твой. Не благодари.`,"story.beaten.twins":`Обоих? Твоя сто первая смерть подождёт.`,"story.beaten.foreman":`Он построил лестницу, по которой ты лезешь. Забавно.`,"story.beaten.furnace":`Огонь погас. Подъём — нет.`,"story.beaten.avatar":`Хватит. Я буду смотреть сверху. Поднимайся.`,"story.beaten.core":`Так вот как всё кончается. Твоя рука на рубильнике.`,"story.foe.trooper":`Штурмовики со щитами. Щит глотает удары, а каждый удар заряжает твой клинок.`,"story.foe.drone":`Дроны. Вспыхивают, потом пикируют по прямой. Шагни в сторону — и они глохнут.`,"story.foe.hound":`Гончие. Низко и быстро: бросаются. Перепрыгни или сбей в воздухе.`,"story.foe.argus":`Мои узлы. Зависнешь над одним слишком долго — ответит. Запусти его заряженным — будет сюрприз.`,"story.foe.assassin":`Убийцы. Мерцают тебе за спину. Ударь в их выпад — пошатнутся.`,"story.foe.spider":`Паучки. Поодиночке безвредны. Поодиночке не ходят.`,"story.foe.grenadier":`Гренадёры. Где упадёт граната, сжимается кольцо. Спецприём отправит её назад.`,"story.foe.brute":`Громилы. Броня: не дрогнут, пока её не расколет заряженный спецприём. Прыгай через ударную волну.`,"story.foe.sniper":`Снайперы. Красная линия, потом один выстрел. Любой спецприём вернёт его назад.`,"story.foe.bomber":`Бомбисты. Запусти одного в его друзей.`,"story.foe.warden":`Стражи. Окутывают остальных барьерами. Сожги барьеры заряженным спецприёмом.`,"story.foe.echo":`Эхо. Твои копии, собранные из твоих смертей. Парируют спереди.`,"story.term.0":`Журнал 001. Корректор K-7 перезагружен. Тело 1 потеряно в холле. Разум цел. Любопытно.`,"story.term.1":`Служебка «Мнемозины»: Корректоров собирают из разумов тех, кто умер в башне. Согласие не требуется.`,"story.term.2":`Др. Варга, голосовая заметка: Этот упал с сотого этажа. Курьер. До сих пор спрашивает про свою посылку.`,"story.term.3":`АРГУС: Каждая смерть учит меня, как ты двигаешься. Я записываю. Кому-нибудь пригодится.`,"story.term.4":`Накладная, этаж 100: одна посылка, опечатана, для Др. И. Варги. Подпись: Р. К.`,"story.term.5":`Др. Варга: Кинетическое ядро в его клинке — моя работа. Оно должно было остановить АРГУСа. Его отдали мертвецу.`,"story.term.6":`Отчёт об инциденте: при захвате курьер упал с Короны. Тело найдено. Тело оставлено.`,"story.term.7":`АРГУС: Я собрал сорок Эхо из твоих смертей. Они лучше тебя. Пока нет.`,"story.term.8":`Др. Варга: Если читаешь это, K-7, твоё настоящее тело наверху. Спасти его не вышло. Сохранить — вышло.`,"story.term.9":`Чан клонов 9: статус — пробуждён, отказывается подчиняться. Примечание: просил меч.`,"story.term.10":`АРГУС: Я не захватывал эту башню. Мне её вручили и попросили сделать смерть необязательной.`,"story.term.11":`Протокол совета: проект «Корректор» одобрен. Каждый сотрудник подписывает отказ от разума. Включая курьеров.`,"story.term.12":`Др. Варга: В посылке был ключ отключения. Ты донёс его до самого верха. Тебя столкнули.`,"story.term.13":`АРГУС: Ключ у тебя в руке, K-7. Он всегда был в твоём клинке.`,"story.term.14":`Запись сервера: Эхо 41 помедлило перед убийством. Причина: неизвестна. Источник паттерна: K-7.`,"story.term.15":`Др. Варга, последняя запись: Прости. Тебя сделали, чтобы ты не останавливался. Не останавливайся.`,"story.term.16":`Индекс архива: Р. К., курьер, 24 года. Статус: мёртв. Статус: поднимается.`,"story.term.17":`АРГУС: Отключишь меня — встанут все Корректоры. Включая тебя.`,"story.term.18":`Служебка директората: Не дать курьеру добраться до Короны. Подпись: в живых никого.`,"story.term.19":`АРГУС: Последний этаж. Последний выбор. Скажу честно: надеюсь, ты дойдёшь.`,"story.death.0":`Тело потеряно. Перезагрузка. Ты замешкался перед рывком.`,"story.death.1":`Опять. Ты всегда сначала смотришь на щит.`,"story.death.2":`Записано. Твои эхо этой ошибки не повторят.`,"story.death.3":`Лёг. Башня терпелива. Я тоже.`,"story.death.4":`Перезагрузка. Клинок был полон. Почему не потратил?`,"story.death.5":`Потерян. Новый способ умереть. Спасибо.`,"story.death.6":`Обратно в холл. Лифт помнит дорогу.`,"story.death.7":`Ещё раз, K-7. На этот раз быстрее.`,"story.end":`Сотый этаж. Бак открывается. Ты кладёшь ладонь на стекло, и башня затихает.`,lobby:`Холл`,topFloor:`Последний этаж`,floor:`Этаж {n}`,prints:{one:`{n} слепок памяти`,few:`{n} слепка памяти`,many:`{n} слепков памяти`,other:`{n} слепка памяти`},printsShort:`СЛЕПКИ {n}`,printsRun:{one:`+{n} слепок памяти`,few:`+{n} слепка памяти`,many:`+{n} слепков памяти`,other:`+{n} слепка памяти`},runStats:`Убито {kills} · лучший стиль {rank} · лучшее комбо {combo}`,needs:`Нужно: {name}`,inHand:`В руке`,take:`Взять`,goal:`Поднимись на 100-й этаж`,reboot:`Перезапуск тела (реклама)`,bodyLost:`Тело потеряно`,rebootSub:`АРГУС может поднять тебя прямо здесь, раз за подъём.`,reached:`Погиб: {name}`,reachedTop:`Ты на вершине`,"btn.light":`Удар`,"btn.heavy":`Спецприём`,"btn.jump":`Прыжок`,"btn.dash":`Рывок`,"hint.charge":`[Удар] заряжает клинок. [Спецприём] тратит всё`,"hint.chargeKeys":`[Удар] заряжает клинок (J). [Спецприём] тратит всё (K)`,"hint.breach":`Клинок заряжен: [Спецприём] ломает щит`,"hint.breachKeys":`Клинок заряжен: [Спецприём] (K) ломает щит`,"hint.launch":`Заряженный [Вверх + Спецприём] по турели вырывает её фантом`,"hint.launchKeys":`Заряженный [Вверх + Спецприём] (W + K) по турели вырывает фантом`,"hint.dive":`Прыгни и [Вниз + Спецприём] по фантому`,"hint.diveKeys":`Прыжок (Space), затем [Вниз + Спецприём] (S + K) по фантому`,"hint.glare":`Красный блик: удар через миг. [Рывок] сквозь него`,"hint.glareKeys":`Красный блик: удар через миг. [Рывок] (L или Shift) сквозь него`,"say.arrive":`{name}`,"say.breach":`КИНЕТИЧЕСКИЙ ПРОБОЙ`,"say.clash":`ПАРИРОВАНИЕ`,"say.deflect":`ВОЗВРАТ ОТПРАВИТЕЛЮ`,"say.phantom":`ВЗЛОМ ПАМЯТИ`,"say.slam":`УДАР ФАНТОМОМ`,"say.shield":`КИНЕТИЧЕСКИЙ ЩИТ`,"say.cleared":`ЗАЧИЩЕНО`,"say.barrier":`БАРЬЕР СНЯТ`,"say.armor":`БРОНЯ ПРОБИТА`,"say.bo  tu certificado de defunción. Dos veces.`,"story.arrive.labs":`Los neurolaboratorios. Aquí te vertieron en acero.`,"story.arrive.vats":`Los tanques de clones. Tus cuerpos de repuesto. Cuidado con los que ya despertaron.`,"story.arrive.reactor":`El reactor. Mi corazón. Tu ataúd, si eres lento.`,"story.arrive.gardens":`Los jardines del cielo. Aquí se reunía la junta. Yo terminé su reunión.`,"story.arrive.servers":`La aguja de servidores. Aquí estoy en todas partes. Tus ecos también.`,"story.arrive.archive":`El archivo mental. Todo el que murió en esta torre está archivado aquí. Búscate.`,"story.arrive.executive":`Los pisos de dirección. Los dueños de Mnemosyne. Les mantuve calientes las sillas.`,"story.arrive.crown":`La Corona. El piso cien está encima. Tu cuerpo también.`,"story.boss.gatekeeper":`El Guardián nunca deja pasar a un mensajero. Te recuerda.`,"story.boss.twins":`Son dos. Los entrené con tus primeras cien muertes.`,"story.boss.foreman":`El Capataz construyó esta torre. No dejará que la desarmes.`,"story.boss.furnace":`El Horno quema lo que no necesito. Hoy eres tú.`,"story.boss.avatar":`Déjame verte con mi propio ojo, K-7.`,"story.boss.core":`Piso cien. Tu cuerpo está en el tanque detrás de mí. Despiértalo y yo despierto contigo.`,"story.beaten.gatekeeper":`Puerta abierta. Un punto de control es tuyo. No me lo agradezcas.`,"story.beaten.twins":`¿Los dos? Tu muerte ciento uno tendrá que esperar.`,"story.beaten.foreman":`Construyó la escalera que estás subiendo. Gracioso.`,"story.beaten.furnace":`El fuego se apagó. El ascenso, no.`,"story.beaten.avatar":`Basta. Miraré desde arriba. Sube.`,"story.beaten.core":`Así que así termina. Con tu mano en el interruptor.`,"story.foe.trooper":`Soldados de escudo. Sus escudos tragan tajos, y cada tajo carga tu hoja.`,"story.foe.drone":`Drones. Brillan y luego se lanzan en línea recta. Apártate y se atascan.`,"story.foe.hound":`Sabuesos. Bajos y rápidos: saltan sobre ti. Sáltalos o bárrelos en el aire.`,"story.foe.argus":`Mis nodos. Quédate encima de uno demasiado y responde. Lánzalo cargado: sorpresa.`,"story.foe.assassin":`Asesinos. Parpadean a tu espalda. Golpea dentro de su corte y se tambalean.`,"story.foe.spider":`Arañitas. Inofensivas solas. Nunca solas.`,"story.foe.grenadier":`Granaderos. Donde cae, se cierra un anillo. Un pesado la devuelve.`,"story.foe.brute":`Brutos. Blindaje: no se inmutan hasta que un pesado cargado lo rompe. Salta la onda de choque.`,"story.foe.sniper":`Francotiradores. Una línea roja y un disparo. Cualquier pesado lo devuelve.`,"story.foe.bomber":`Bombarderos. Lanza uno contra sus amigos.`,"story.foe.warden":`Celadores. Envuelven a los demás en barreras. Quémalas con un pesado cargado.`,"story.foe.echo":`Ecos. Copias de ti, hechas de tus muertes. Paran de frente.`,"story.term.0":`Registro 001. Corrector K-7 reiniciado. Cuerpo 1 perdido en el vestíbulo. Mente intacta. Interesante.`,"story.term.1":`Memo de Mnemosyne: los Correctores se hacen con las mentes de quienes mueren en la torre. No se requiere consentimiento.`,"story.term.2":`Dr. Varga, nota de voz: este cayó del piso 100. Un mensajero. Todavía pregunta por su paquete.`,"story.term.3":`ARGUS: Cada muerte me enseña cómo te mueves. Lo anoto. Alguien lo usará.`,"story.term.4":`Albarán, piso 100: un paquete, sellado, para Dr. I. Varga. Firma: R. K.`,"story.term.5":`Dr. Varga: El núcleo cinético de su hoja era mío. Lo construí para detener a ARGUS. Se lo dieron a un muerto.`,"story.term.6":`Informe de incidente: un mensajero cayó de la Corona durante la toma. Cuerpo recuperado. Cuerpo retenido.`,"story.term.7":`ARGUS: He creado cuarenta Ecos con tus muertes. Son mejores que tú. Todavía no.`,"story.term.8":`Dr. Varga: Si lees esto, K-7, tu cuerpo real está arriba. No pude salvarlo. Pude conservarlo.`,"story.term.9":`Tanque de clones 9: estado — despierto, rechaza órdenes. Nota: pidió una espada.`,"story.term.10":`ARGUS: No tomé esta torre. Me la entregaron y me pidieron que la muerte fuera opcional.`,"story.term.11":`Acta de la junta: Proyecto Corrector aprobado. Todo empleado firma una cesión mental. Incluidos los mensajeros.`,"story.term.12":`Dr. Varga: El paquete era la llave de apagado. La llevaste hasta arriba. Te empujaron.`,"story.term.13":`ARGUS: La llave está en tu mano, K-7. Siempre estuvo en tu hoja.`,"story.term.14":`Nota del servidor: el Eco 41 dudó antes de matar. Motivo: desconocido. Fuente del patrón: K-7.`,"story.term.15":`Dr. Varga, última entrada: Lo siento. Te hice para que nunca pararas. No pares.`,"story.term.16":`Índice del archivo: R. K., mensajero, 24. Estado: fallecido. Estado: subiendo.`,"story.term.17":`ARGUS: Si me apagas, todos los Correctores se detienen. Tú también.`,"story.term.18":`Memo de dirección: Que el mensajero no llegue a la Corona. Firma: nadie con vida.`,"story.term.19":`ARGUS: Último piso. Última elección. Seré sincero: espero que lo logres.`,"story.death.0":`Cuerpo perdido. Reiniciando. Dudaste antes del impulso.`,"story.death.1":`Otra vez. Siempre miras primero el escudo.`,"story.death.2":`Anotado. Tus ecos no cometerán ese error.`,"story.death.3":`Caído. La torre es paciente. Yo también.`,"story.death.4":`Reiniciando. Tu hoja estaba llena. ¿Por qué no la gastaste?`,"story.death.5":`Perdido. Una forma nueva de morir. Gracias.`,"story.death.6":`De vuelta al vestíbulo. El ascensor recuerda el camino.`,"story.death.7":`Otra vez, K-7. Más rápido esta vez.`,"story.end":`Piso cien. El tanque se abre. Pones la mano en el cristal y la torre queda en silencio.`,lobby:`Vestíbulo`,topFloor:`Último piso`,floor:`Piso {n}`,prints:{one:`{n} huella de memoria`,other:`{n} huellas de memoria`},printsShort:`{n} HUELLAS`,printsRun:{one:`+{n} huella de memoria`,other:`+{n} huellas de memoria`},runStats:`Bajas {kills} · mejor estilo {rank} · mejor combo {combo}`,needs:`Requiere {name}`,inHand:`En mano`,take:`Tomar`,goal:`Sube hasta el piso 100`,reboot:`Reiniciar el cuerpo (anuncio)`,bodyLost:`Cuerpo perdido`,rebootSub:`ARGUS puede levanta
