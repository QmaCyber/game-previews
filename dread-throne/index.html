Under the Dread Throne burns the Ember Heart, the last fire that holds Brightvale's endless winter back. The Sun Church calls it stolen sun, and High Inquisitor Solenne sends wave after wave of crusaders to take it. You are Malgrath, the Demon King, and this is a tower defense from the villain's side.

Your castle is a grid of rooms, and every room can turn, at any moment, even in the middle of a fight. Press the turn button in a room's corner to bend the heroes' road into a long loop past your spike pits, wraiths and webs, or spin a room with heroes inside and watch them stagger. Traps and obelisks go on the road; towers like the Imp Roost, the Bone Ballista and the Brimstone Cauldron stand beside it and fill their room, so they shape the maze too. Seal the road completely and the heroes smash through a wall, and that hole stays open for good.

Kill or scare? Slain heroes give souls to build with. Terrified heroes flee home past your traps: no souls, but they spread Dread, which makes later waves more timid, and they pay double Infamy for permanent upgrades.

Features:
- Turn castle rooms in real time to reroute every wave
- 10 fixtures: traps, obelisks and towers, unlocked as you clear stages; move any of them for a few souls
- Every fixture changes its look as it levels up, and at level 3 ascends one of two ways (20 ascensions)
- 9 kinds of heroes with their own attacks: archers shoot your towers silent, sappers blow walls open, mages dispel traps, clerics heal, and the Chosen One silences whatever he stands on
- 6 hand-made stages of 10 waves each, with stars for a clean defence; the later ones stay hard even with every upgrade
- A story told in comic cards after every stage, replayable from the Scenes menu
- Dark Pacts: a tree of 15 permanent pacts on three paths, with 6 Oaths you swear one of two ways
