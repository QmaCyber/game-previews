:where(#gp-results) { --gp-results-bg: rgba(16, 26, 38, 0.92); --gp-results-ink: #f2f7ff; --gp-results-muted: #a9b9cc;

#gp-results { pointer-events: auto; box-sizing: border-box; width: min(92vw, 440px); max-height: 94vh; overflow: auto;
  display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 22px 16px; border-radius: var(--gp-results-radius);
  background: var(--gp-results-bg); color: var(--gp-results-ink); font: 600 17px var(--gp-results-font); text-align: center; }
#gp-results h2 { margin: 0; font-size: 32px; line-height: 1.1; }
#gp-results .gp-lines { display: flex; flex-direction: column; gap: 4px; }
#gp-results .gp-goal { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); text-align: left; }
#gp-results .gp-goal-k { font-size: 13px; color: var(--gp-results-muted); text-transform: uppercase; letter-spacing: 0.04em; }
#gp-results .gp-goal-row { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
#gp-results .gp-goal-l { flex: 1; font-size: 18px; }
#gp-results .gp-goal-p { font-variant-numeric: tabular-nums; color: var(--gp-results-accent); }
#gp-results .gp-goal-d { font-size: 14px; color: var(--gp-results-muted); margin-top: 2px; }
#gp-results .gp-bar { height: 8px; border-radius: 4px; background: var(--gp-results-bar); overflow: hidden; margin-top: 6px; }
#gp-results .gp-bar i { display: block; height: 100%; background: var(--gp-results-accent); border-radius: 4px; }
#gp-results button.gp-primary { position: relative; min-width: 0; margin: 0; text-transform: none; box-shadow: none; overflow: hidden; width: 100%; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--gp-results-accent); color: var(--gp-results-accent-ink); font: 800 24px var(--gp-results-font); padding: 0 24px; }
#gp-results .gp-primary small { display: block; font-size: 13px; font-weight: 700; opacity: 0.75; }
#gp-results .gp-primary .gp-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(255, 255, 255, 0.28); pointer-events: none; }
#gp-results .gp-primary span { position: relative; }
#gp-results button.gp-menu { min-width: 0; width: auto; margin: 0; text-transform: none; box-shadow: none; border: 0; background: transparent; color: var(--gp-results-muted); font: 700 16px var(--gp-results-font);

    #ui { position: fixed; inset: 0; pointer-events: none; font: 600 16px ${I}, ${ce}; color: #f6ead0;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #ui .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #ui .screen { pointer-events: auto; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
                  background: linear-gradient(#2a1710f2, #1a0d08f2); border: 2px solid ${Z.brass}; box-shadow: 0 10px 40px #000a, inset 0 0 0 4px #00000055;
                  padding: 18px 22px; border-radius: 14px; max-width: min(92vw, 560px); max-height: 94vh; box-sizing: border-box; }
    #ui .screen.wide { max-width: min(96vw, 860px); width: 100%; }
    #ui h1 { margin: 0; font: 900 clamp(34px, 9vw, 64px) Georgia, 'Times New Roman', serif; letter-spacing: 2px; color: ${Z.brassLight};
             text-shadow: 0 3px 0 #5a3a10, 0 0 18px #ffd16655; }
    #ui h2 { margin: 0; font: 800 clamp(20px, 5vw, 28px) Georgia, serif; color: ${Z.brassLight}; }
    #ui .sub { color: #d8c8a4; font-size: 14px; max-width: 46ch; }
    #ui button { pointer-events: auto; min-width: ${e.minTouchPx*2.6}px; min-height: ${e.minTouchPx}px; border: 0; border-radius: 10px; cursor: pointer;
                 font: 800 17px ${I}, ${ce}; padding: 0 18px; color: #2a1708;
                 background: linear-gradient(${Z.brassLight}, ${Z.brass}); box-shadow: 0 3px 0 #6a4a14, inset 0 1px 0 #fff8; }
    #ui button.alt { background: linear-gradient(#5a3a28, #3a2216); color: #f6ead0; box-shadow: 0 3px 0 #1a0a04, inset 0 1px 0 #ffffff22; }
    #ui button.plain { background: transparent; color: #e8d8b4; box-shadow: none; text-decoration: underline; min-width: ${e.minTouchPx*2}px; }
    #ui button[aria-disabled=true], #ui button:disabled { filter: grayscale(0.8) brightness(0.7); }
    #ui .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
    #ui .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; pointer-events: none; }
    #ui .hud .r1, #ui .hud .r2 { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    #ui .hud .round { font: 800 15px Georgia, serif; color: ${Z.brassLight}; text-align: left; line-height: 1.1; }
    #ui .hud .round small { display: block; font: 600 12px ${I}; color: #d8c8a4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
    #ui .hud .score { flex: 1; max-width: 300px; }
    #ui .hud .bar { height: 10px; border-radius: 6px; background: #00000066; border: 1px solid #c9a24a88; overflow: hidden; }
    #ui .hud .bar i { display: block; height: 100%; background: linear-gradient(90deg, ${Z.brass}, ${Z.gold}); }
    #ui .hud .nums { font: 800 15px ${I}; text-align: center; white-space: nowrap; }
    @media (max-width: 420px) { #ui .hud .nums { font-size: 13px; } }
    #ui .hud .money { font: 900 18px ${I}; color: ${Z.gold}; min-width: 48px; text-align: right; }
    #ui .hud .pips { font: 700 13px ${I}; color: #e8d8b4; }
    #ui button.wide { width: min(100%, 420px); }
    #gp-hint[data-pos=top] { top: var(--dm-hint, 70px); }
    #ui .hud .score .pips { text-align: center; font-size: 12px; margin-top: 3px; }
    #ui .hud .pips b { color: ${Z.gold}; }
    /* the language sheet in the salon's walnut and brass */
    #gp-lang-sheet { --gp-lang-bg: rgba(10, 6, 4, 0.82); --gp-lang-panel: linear-gradient(#2a1710f4, #1a0d08f4); --gp-lang-ink: #f6ead0;
                     --gp-lang-btn: linear-gradient(#5a3a28, #3a2216); --gp-lang-on: linear-gradient(${Z.brassLight}, ${Z.brass}); --gp-lang-on-ink: #2a1708; }
    html body #gp-lang-sheet .gp-lang-panel { border: 2px solid ${Z.brass}; border-radius: 14px; box-shadow: 0 10px 40px #000a, inset 0 0 0 4px #00000055; }
    html body #gp-lang-sheet .gp-lang-title { font: 800 22px Georgia, serif; color: ${Z.brassLight}; }
    html body #gp-lang-sheet button { box-shadow: 0 3px 0 #1a0a04, inset 0 1px 0 #ffffff22; font-weight: 700; }
    /* the salon's counter: velvet cushions under drawn relics, scrolls and curios; on a wide screen, standing tiles */
    #ui .card.velvet { background: radial-gradient(circle at 18% 30%, #7a2232, #3e0c16 78%); border-color: #c9a24a99; box-shadow: inset 0 0 0 3px #00000040, 0 3px 8px #0007; }
    #ui .card.velvet .t b { color: ${Z.brassLight}; }
    #ui .card.sold { opacity: 0.35; transition: opacity 0.3s; }
    #ui .counter.deal .card { animation: dm-deal 0.42s cubic-bezier(.2,1.4,.4,1) backwards; }
    #ui .counter.deal .card:nth-child(2) { animation-delay: 0.07s; } #ui .counter.deal .card:nth-child(3) { animation-delay: 0.14s; }
    #ui .counter.deal .card:nth-child(4) { animation-delay: 0.21s; } #ui .counter.deal .card:nth-child(5) { animation-delay: 0.28s; }
    @keyframes dm-deal { from { opacity: 0; transform: translateY(-14px) scale(0.92); } }
    @media (min-width: 600px) {
      #ui .cards.counter.two, #ui .cards.counter.three { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
      #ui .counter .card { flex-direction: column; text-align: center; gap: 4px; padding: 8px 6px; }
      #ui .counter .card .t { flex: 1; }
      #ui .counter .card button { width: 100%; }
      #ui .counter .card .ic.img, #ui .counter .card .ic.img img { width: 60px; height: 60px; }
    }
    @media (min-width: 600px) and (max-height: 520px) { #ui .counter .card .ic.img, #ui .counter .card .ic.img img { width: 40px; height: 40px; } }
    #ui .owned .slot { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed #c9a24a66; align-self: center; }
    #ui .counting { animation: dm-pulse 0.45s ease-in-out; }
    /* the club's ledger: Patronage on parchment, a stamp on what was just bought */
    #ui .card.ledger { background: repeating-linear-gradient(#efe2bf 0 21px, #d9c79a 21px 22px), #efe2bf; border-color: #8a6a2e; color: #3a2410; }
    #ui .card.ledger .t { color: #4a3018; }
    #ui .card.ledger .t b { color: #2a1708; }
    #ui .card.ledger.off { opacity: 0.6; }
    #ui .card.stamp { animation: dm-stamp 0.55s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 0 0 3px ${Z.gold}, 0 0 22px ${Z.gold}; }
    @keyframes dm-stamp { 0% { transform: scale(1.12) rotate(-1.5deg); } 100% { transform: none; } }
    #ui .volumes { display: flex; flex-direction: column; gap: 4px; width: min(100%, 340px); }
    #ui .vol { display: flex; align-items: center; gap: 12px; pointer-events: auto; min-height: ${e.minTouchPx}px; }
    #ui .vol span { flex: 0 0 84px; text-align: left; font-weight: 800; color: #e8d8b4; }
    #ui .vol input { flex: 1; height: ${e.minTouchPx}px; accent-color: ${Z.brass}; cursor: pointer; margin: 0; }
    #ui .ivoryline { font-weight: 900; color: ${Z.gold}; }
    #ui .ivoryline.shine { animation: dm-pulse 0.5s ease-in-out 3; }
    #ui .hud .pips.pulse { animation: dm-pulse 0.5s ease-in-out 4; }
    @keyframes dm-pulse { 50% { transform: scale(1.18); color: ${Z.brassLight}; text-shadow: 0 0 10px ${Z.gold}; } }
    #ui .hud button { pointer-events: auto; min-width: ${e.minTouchPx}px; padding: 0; }
    #ui .bottom { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; gap: 10px; justify-content: center; align-items: center; pointer-events: none; padding: 0 8px; }
    #ui .bottom button { flex: 0 1 220px; }
    #ui .toasts { position: absolute; right: 8px; bottom: var(--dm-toast, 40%); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none; z-index: 4; }
    #ui .toast { background: #1a0d08e6; border: 1px solid ${Z.brass}; border-radius: 8px; padding: 4px 10px; font-size: 13px; color: ${Z.brassLight};
                 max-width: min(70vw, 320px); animation: dm-toast 2.6s ease-out forwards; }
    #ui .toast b { display: block; font-size: 11px; color: #d8c8a4; }
    @keyframes dm-toast { 0% { opacity: 0; transform: translateX(20px); } 10% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
    #ui .tip { position: absolute; pointer-events: auto; background: #1a0d08f0; border: 1px solid ${Z.brass}; border-radius: 10px; padding: 8px 12px;
               max-width: min(80vw, 300px); font-size: 14px; text-align: left; z-index: 5; }
    #ui .tip b { color: ${Z.brassLight}; display: block; font: 800 15px Georgia, serif; margin-bottom: 2px; }
    #ui .tip .row { margin-top: 6px; justify-content: flex-start; }
    #ui .banner { position: absolute; z-index: 60; left: 50%; top: 40%; transform: translate(-50%, -50%); pointer-events: none; text-align: center;
                  font: 900 clamp(22px, 6vw, 40px) Georgia, serif; color: ${Z.brassLight}; text-shadow: 0 3px 0 #000a, 0 0 20px #ffd16655;
                  animation: dm-banner 1.8s ease-out forwards; white-space: nowrap; }
    #ui .banner small { display: block; font: 700 15px ${I}; color: #f6ead0; white-space: normal; max-width: 80vw; }
