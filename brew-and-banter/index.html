  @font-face { font-family: Fredoka; font-weight: 500; font-display: swap; src: url(${Se}) format('woff2'); }

  :root { --hud: 66px; --ink: #2a1b2e; --cream: #fbf1de; --gold: #ffcf5a; --panel: #2c1d32; --wood: #6b4530; }
