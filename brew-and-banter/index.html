#gp-dialog { --gp-dlg-bg: #fff8ec; --gp-dlg-ink: #2b1d10; --gp-dlg-muted: #6b5a48; --gp-dlg-edge: #8a5a3a;
  --gp-dlg-btn: #ffffff; --gp-dlg-accent: #2b1d10; --gp-dlg-accent-ink: #fff8ec; --gp-dlg-speaker: #8a5a3a;
  position: fixed; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom)); margin: 0 auto; z-index: 20;
  width: min(720px, calc(100vw - 12px)); box-sizing: border-box; pointer-events: auto; touch-action: manipulation;
  display: flex; flex-direction: column; gap: 8px; padding: 18px 12px 10px; text-align: left; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  color: var(--gp-dlg-ink); background: var(--gp-dlg-bg); border: 3px solid var(--gp-dlg-edge); border-radius: 18px;
  box-shadow: 0 8px 28px #0008; font: 600 15px ${De}; }
#gp-dialog[hidden], #gp-dialog [hidden] { display: none !important; }
#gp-dialog .gp-row, #gp-dialog .gp-actions, #gp-dialog .gp-face, #gp-dialog .gp-live { font-size: 15px; }
#gp-dialog .gp-typed, #gp-dialog .gp-rest, #gp-dialog .gp-label { font: inherit; }
#gp-dialog .gp-plate { position: absolute; top: -14px; left: 14px; max-width: calc(100% - 28px); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; background: var(--gp-dlg-speaker); color: #fff; font-size: 14px; font-weight: 800;
  line-height: 1.2; padding: 4px 12px; border-radius: 9px; box-shadow: 0 2px 0 #0003; }
#gp-dialog .gp-badge { position: absolute; top: -12px; right: 14px; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; background: var(--gp-dlg-ink); color: var(--gp-dlg-bg); font-size: 12px; font-weight: 700;
  padding: 3px 9px; border-radius: 8px; }
#gp-dialog.gp-has-plate .gp-badge { max-width: 40%; }
#gp-dialog .gp-row { display: flex; gap: 10px; align-items: flex-start; min-height: 0; }
#gp-dialog .gp-face { font-size: 36px; line-height: 58px; text-align: center; flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin-top: -6px;
  border: 3px solid var(--gp-dlg-speaker); box-sizing: border-box; background: #fff; }
#gp-dialog .gp-face > canvas, #gp-dialog .gp-face > img, #gp-dialog .gp-face > svg { width: 100%; height: 100%; display: block; }
#gp-dialog .gp-text { flex: 1; min-width: 0; font: 500 17px/1.35 ${De};
  max-height: calc(1.35em * 5); overflow-y: auto; overflow-wrap: anywhere; }
#gp-dialog.gp-narrator .gp-text { font-style: italic; color: var(--gp-dlg-muted); }
#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 ${De}; border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;
  box-shadow: none; text-transform: none; letter-spacing: normal; text-align: center; opacity: 1; filter: none;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--gp-dlg-ink); background: var(--gp-dlg-btn); }
#gp-dialog button.gp-choice { flex: 1 1 100%; justify-content: flex-start; text-align: left; box-shadow: inset 0 0 0 2px var(--gp-dlg-edge); }
#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }
#gp-dialog button.gp-skip { order: 1; background: transparent; color: var(--gp-dlg-muted); font-size: 14px; text-decoration: underline; padding: 4px 10px; }
#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}
/* A phone on its side: a compact sheet, ≤ 45% of the height (three lines of text and one row of buttons) */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-dialog { bottom: max(4px, env(safe-area-inset-bottom)); padding: 14px 10px 6px; gap: 5px; border-width: 2px; }
  #gp-dialog .gp-text { font-size: 16px; line-height: 1.3; max-height: calc(1.3em * 3); }
  #gp-dialog .gp-face { width: 52px; height: 52px; margin-top: -8px; font-size: 30px; line-height: 46px; }
  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-dialog:not([hidden]) { animation: gp-dlg-in 0.18s ease-out; }
}
@keyframes gp-dlg-in { from { transform: translateY(12px); opacity: 0; } }

  :root { --hud: 60px; --ink: #fbf1de; --gold: #ffcf5a; --mint: #7ef0c8; --plum: #2a1838; --edge: rgba(255, 220, 170, 0.22); }

  /* HUD */
  .hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; pointer-events: none; }

  .pill.night { flex: 1; flex-direction: column; align-items: stretch; justify-content: center; gap: 4px; font-size: 14px; min-width: 0; }
  .pill.night .row { display: flex; align-items: center; gap: 6px; justify-content: center; white-space: nowrap; }
  .bar { height: 7px; border-radius: 9px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 9px; background: linear-gradient(90deg, var(--mint), var(--gold)); transition: width 0.3s; }
  .hud button { padding: 0; width: ${e}px; position: relative; }
  .hud button svg { width: 24px; height: 24px; }
  .badge { position: absolute; top: -4px; right: -4px; width: 15px; height: 15px; border-radius: 50%; background: #ff5a7a; border: 2px solid #2a1838; }

  /* The customer's words */
  .bubble { position: absolute; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  .bubble .who { font: 900 14px ${Z}; color: var(--gold); letter-spacing: 0.02em; }
  .bubble .say { font: 700 16px/1.32 ${Z}, ${de}; }

  .bubble .sym .known { display: inline-flex; gap: 2px; padding: 1px 6px; border-radius: 8px; background: rgba(255, 255, 255, 0.1); }
  .bubble .pip { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--mint); }
  .bubble .wait { height: 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }

  .bubble.react .say { font-size: 17px; }
  .ess { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; flex: none;
         box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25); }
  .ess svg { width: 14px !important; height: 14px !important; fill: #241430; stroke: #241430; }

  /* The workbench */
  .bench { position: absolute; display: flex; flex-direction: column; gap: 8px; padding: 10px; pointer-events: auto; }
  .mixrow { display: flex; gap: 10px; align-items: center; }
  .slots { display: flex; gap: 6px; }
  .slot { width: ${Math.max(e,52)}px; height: ${Math.max(e,52)}px; padding: 0 !important; border-radius: 14px !important;
          background: rgba(0, 0, 0, 0.3) !important; box-shadow: inset 0 2px 6px #0008 !important; border: 2px dashed rgba(255, 220, 170, 0.25) !important; }
  .slot.full { border: 2px solid var(--gold) !important; background: rgba(255, 207, 90, 0.12) !important; }
  .slot canvas { width: 40px; height: 40px; }
  .meters { flex: 1; display: grid; gap: 3px; min-width: 150px; }
  .meter { display: grid; grid-template-columns: 20px 1fr 20px; gap: 5px; align-items: center; }
  .cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }

  .shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

                  background: linear-gradient(#4e3058, #3a2244) !important; color: var(--ink) !important; box-shadow: 0 3px 0 #1e1026, inset 0 1px 0 #fff2 !important; }
  .shelf button canvas { width: 34px; height: 34px; }

  .shelf .pips .ess { width: 15px; height: 15px; }

  .actions button { flex: 1; }

  .gauge { position: relative; height: 26px; border-radius: 13px; background: linear-gradient(90deg, #3a6aff, #7ef0c8 45%, #ffcf5a 70%, #ff5a3d); box-shadow: inset 0 2px 6px #000a; }

  .bubble .tip { text-align: left; }

ip, but I need a cure.`,"open.lyle.0":`♪ A song of woe, a potion, please ♪`,"open.lyle.1":`My audience fled. Help me, potion-maker!`,"open.ostra.0":`The cards said you would help me, darling.`,"open.ostra.1":`Today's riddle, from the cards to you.`,"sym.calm.1.a":`I've had a bit too much coffee.`,"sym.calm.1.b":`My hands are a little jittery.`,"sym.calm.2.a":`I can't sit still. Not for a second!`,"sym.calm.2.b":`My heart races like a runaway horse!`,"sym.zest.1.a":`I'm a bit sleepy today.`,"sym.zest.1.b":`I keep yawning a little.`,"sym.zest.2.a":`I'm so tired I fell asleep standing up!`,"sym.zest.2.b":`Everything is so heavy, I can't lift a finger!`,"sym.frost.1.a":`I'm a little too warm.`,"sym.frost.1.b":`My cheeks are a bit hot.`,"sym.frost.2.a":`I'm burning up like an oven!`,"sym.frost.2.b":`Steam is coming out of my ears!`,"sym.warm.1.a":`I'm a bit chilly.`,"sym.warm.1.b":`My nose is a little cold.`,"sym.warm.2.a":`I'm frozen stiff!`,"sym.warm.2.b":`My teeth won't stop chattering!`,"sym.gloom.1.a":`I glow a little at night.`,"sym.gloom.1.b":`Everything is a bit too bright.`,"sym.gloom.2.a":`I glow in the dark like a lantern!`,"sym.gloom.2.b":`I shine so bright nobody can sleep!`,"sym.glow.1.a":`I feel a bit gloomy.`,"sym.glow.1.b":`Everything looks a little grey today.`,"sym.glow.2.a":`A dark cloud follows me everywhere!`,"sym.glow.2.b":`I'm so glum even my shadow left me!`,"chapters.arrival":`The Bubbling Kettle`,"chapters.rival":`The Man in the Tall Hat`,"chapters.postcard":`A Postcard From the Sea`,"chapters.apprentice":`The Apprentice`,"chapters.photo":`Grandma's Notebook`,"chapters.truth":`The Green Bottle`,"chapters.eve":`Eve of the Moonfair`,"chapters.moonfair":`The Moonfair`,"story.arrival_1":`The shop goes quiet. On the counter, a black cat opens one eye.`,"story.arrival_2":`Not bad for a first night. Wren said you'd be slow.`,"story.arrival_3":`Well? Say something.`,"story.arrival_3_shock":`A talking cat?!`,"story.arrival_3_shock_1":`A talking cat who counts the till. I'm Pip.`,"story.arrival_3_polite":`Thanks… who are you?`,"story.arrival_3_polite_1":`Manners! I'm Pip. I came with the shop.`,"story.arrival_4":`Wren left in a hurry. Something about the sea. Same time tomorrow.`,"story.rival_1":`The doorbell jangles. Pip is suddenly under the counter.`,"story.rival_2":`So Wren's shop still opens. Vex, Grand Master of the Alchemists' Guild.`,"story.rival_3":`The Guild will buy this cottage. Five hundred gold. Generous.`,"story.rival_3_refuse":`Not for sale.`,"story.rival_3_refuse_1":`Wren said that too. For thirty years.`,"story.rival_3_think":`I'll think about it.`,"story.rival_3_think_1":`Think fast. The offer shrinks.`,"story.rival_4":`At the Moonfair, the Guild wins the Grand Brew. As always.`,"story.rival_5":`Win the Moonfair and nobody can touch the shop. Old law. We need stars: exact cures.`,"story.postcard_1":`A postcard drops through the door. A seagull glares from the front.`,"story.postcard_2":`Dear sprout, the sea is lovely. Feed Pip twice a day, whatever he says.`,"story.postcard_3":`Keep him away from the green bottle on the top shelf. And never sell to a man in a tall hat.`,"story.postcard_3_bottle":`What's in the green bottle?`,"story.postcard_3_bottle_1":`Nothing. It's green. Next question.`,"story.postcard_3_twice":`Twice a day, Pip.`,"story.postcard_3_twice_1":`She meant three times. The sea air got to her.`,"story.apprentice_1":`BANG. Purple smoke, then a girl in a singed hat.`,"story.apprentice_2":`Sorry! Doorbell spell. I'm Luna. A witch. Mostly.`,"story.apprentice_3":`Wren promised to teach me, then she left. Can I help? I sweep. Mostly.`,"story.apprentice_3_welcome":`Welcome aboard!`,"story.apprentice_3_welcome_1":`The brooms and I won't let you down!`,"story.apprentice_3_later":`Keep practising.`,"story.apprentice_3_later_1":`Okay. I'll be at the market. Waving.`,"story.apprentice_4":`Word gets around. A bard and a knight want cures too.`,"story.photo_1":`Found Wren's recipe book. Behind the pickled newts, obviously.`,"story.photo_2":`An old photo slips out: Wren, a boy in a tall hat, and a young man with yellow eyes.`,"story.photo_2_ask":`Pip… who's the third one?`,"story.photo_2_ask_1":`Someone who made a bad decision. Put it back.`,"story.photo_2_back":`Put it back.`,"story.photo_2_back_1":`Good. Sensible.`,"story.photo_3":`The cards sent me, darling. And the cat is not a cat. Everyone knows.`,"story.photo_4":`Out.`,"story.truth_1":`Late. The cauldron ticks as it cools. Pip sits by the green bottle.`,"story.truth_2":`My name was Pippin Ashgrove. Vex and I founded the Guild. Best friends.`,"story.truth_3":`The night before a Moonfair I drank a shapeshifting draught. It worked too well.`,"story.truth_4":`Wren took the cat home. Vex thinks I ran off with our recipes.`,"story.truth_5":`The green bottle is the cure. It needs the Moonfair's moonlight.`,"story.truth_5_cure":`Then let's finish it.`,"story.truth_5_cure_1":`…You'd do that? Don't get sentimental.`,"story.truth_5_family":`Cat or not, you're family.`,"story.truth_5_family_1":`…Cat hair in my eye. Mine.`,"story.eve_1":`Good luck at the Moonfair tomorrow, dear! I baked you a loaf. Cauldron-shaped.`,"story.eve_2":`Duchess caught a Guild man near your cart. She ate his notes.`,"story.eve_3":`I'll guard the cauldron. Nothing will explode. Probably.`,"story.eve_4":`In the morning the judges bring three riddles. Exact cures, perfect boils. What do we pour?`,"story.eve_4_classic":`Wren's Starlight Tonic.`,"story.eve_4_classic_1":`Proven. Wren will be smug for a year.`,"story.eve_4_ours":`Something of our own.`,"story.eve_4_ours_1":`Terrifying. Wren would love it.`,"story.moonfair_1":`The square glows with lanterns. The judges taste your three cures.`,"story.moonfair_2":`The Guild's Elixir Supreme. Forty-seven ingredients. Gold leaf.`,"story.moonfair_3":`Tastes like a coin.`,"story.moonfair_4":`Wren's Starlight Tonic glows in the cups. By the sea, an old woman smiles.`,"story.moonfair_5":`Your own brew fizzes like the first warm day of spring.`,"story.moonfair_6":`The winner of the Grand Brew… the Bubbling Kettle!`,"story.moonfair_7":`Impossible! That shop took everything from me. It took my—`,"story.moonfair_8":`Moonlight hits the green bottle. Pip drinks. A tall man with yellow eyes stands on the counter.`,"story.moonfair_9":`Hello, Vex. I was an idiot. I am so sorry.`,"story.moonfair_10":`Hello, Vex. I was an idiot. I am so sorry.`,"story.moonfair_11":`…Pippin? You were here all along?`,"story.moonfair_12":`Thirty years angry at a shop. That's a lot of years.`,"story.moonfair_12_seat":`There's a seat at the Kettle.`,"story.moonfair_12_seat_1":`…I'll bring biscuits. Guild biscuits.`,"story.moonfair_12_goat":`Start by saying sorry to the goat.`,"story.moonfair_12_goat_1":`Fine. One apology. To a goat.`,"story.moonfair_13":`Heard you won. Coming home for tea. Tell Pip I'm proud of him. Love, Gran.`},es:{tagline:`Una acogedora tienda de pociones nocturna. Cura aquello de lo que se quejan.`,startNight:`Empezar la noche`,continue:`Continuar`,daily:`Remedio del día`,dailyDone:`Remedio del día: curado`,dailyTitle:`Remedio del día`,dailyDoneText:`El acertijo de hoy está curado. Mañana llega otro. Días curados: {n}`,dailyReward:`¡+{n} de oro por el remedio de hoy!`,shop:`Tienda`,notebook:`Cuaderno`,settings:`Ajustes`,ingredients:`Ingredientes`,nightN:`Noche {n}`,nightClosed:`Noche {n}: la tienda está cerrada`,fairTitle:`La Moonfair`,fairAgain:`Los jueces quieren al menos dos remedios exactos. ¡La Moonfair sigue mañana por la noche!`,goldEarned:`oro`,exactCures:`curas exactas: {n}/{total}`,double:`Mira un anuncio: +{n} de oro (×2)`,chapterWaits:`Te espera un capítulo nuevo: {title}`,nextChapter:{one:`{n} estrella más para el siguiente capítulo`,other:`{n} estrellas más para el siguiente capítulo`},nextNight:`Siguiente noche`,chapter:`Capítulo {n}: {title}`,stuck:`¿Te atascas?`,stuckTitle:`¿Te atascas?`,stuckText:`Cada queja pide una esencia: la contraria del problema. Las palabras fuertes piden dos. O Pip puede decirte la cura de este cliente.`,askPip:`Mira un anuncio: Pip dice la cura`,askPipRetry:`Mira un anuncio: Pip dice la cura, reinténtalo`,oopsTitle:`¡Cura equivocada!`,oopsText:`{name} frunce el ceño ante la taza. Pip puede decirte la cura real, y la preparas otra vez antes de que se vaya.`,oopsTextNoAd:`{name} frunce el ceño ante la taza. Vuelve a leer sus palabras: cada una pide una esencia.`,letGo:`Dejar que se vaya`,youMixed:`Tu mezcla:`,closeShop:`Cerrar la tienda por hoy`,pipNeeds:`Pip: necesita`,takeOut:`Sacar {name}`,emptySlot:`Hueco vacío`,boilNow:`Hervir`,stop:`¡Para!`,"tip.cure":`¡Cura aquello de lo que se quejan! Tom no puede estarse quieto: eso pide Calma. Toca Amapola, luego Hervir y para en lo blanco.`,"tip.cancel":`¿Demasiado de una esencia? Su contraria la anula.`,"tip.boil":`Detén el hervor en la zona blanca: una poción perfecta paga más.`,"tip.fair":`¡La Moonfair! Los jueces traen tres acertijos. Curas exactas, hervores perfectos.`,"react.exact.0":`¡Eso es lo que necesitaba!`,"react.exact.1":`¡Oh! ¡Me siento de maravilla!`,"react.exact.2":`Justo lo que hacía falta. ¡Gracias!`,"react.close":`Mmm. Mejor… casi.`,"react.wrong":`Puaj. No es eso.`,"react.left":`No puedo esperar más. Buenas noches.`,"boil.perfect":`¡Y un hervor perfecto!`,"boil.good":`Bien preparada.`,"boil.burnt":`Aunque un poco quemada.`,notebookHint:`Cada síntoma que curaste con exactitud. Cuando un cliente lo repita, verás sus esencias al lado.`,notebookEmpty:`Nada aún. Cura un síntoma con exactitud y Pip lo apuntará.`,tierOpens:{one:`Se abre con {n} compra más`,other:`Se abre con {n} compras más`},level:`nivel {n}/{max}`,owned:`En el estante`,max:`Máx.`,newIngredient:`¡{name} ya está en el estante!`,"vol.music":`Música`,"vol.ambient":`Sonidos de la tienda`,"vol.sfx":`Efectos`,"tier.shelf":`El estante`,"tier.cellar":`El sótano`,"tier.attic":`El desván`,"tier.moon":`La ventana de la luna`,"item.newIngredient":`ingrediente nuevo`,"item.mint.name":`Menta`,"item.honey.name":`Miel`,"item.moonmilk.name":`Leche de luna`,"item.moss.name":`Musgo de ciénaga`,"item.dragon.name":`Ají de dragón`,"item.mandrake.name":`Mandrágora`,"item.bellows.name":`Fuelle`,"item.bellows.effect":`una zona blanca más ancha al hervir`,"item.sign.name":`Letrero`,"item.sign.effect":`+15% de propinas por nivel`,"item.bell.name":`Campanilla`,"item.bell.effect":`un cliente más cada noche`,"item.spyglass.name":`Catalejo`,"item.spyglass.effect":`los síntomas conocidos muestran su fuerza`,"ing.poppy":`Amapola`,"ing.pepper":`Pimienta`,"ing.snowbell":`Campanieve`,"ing.ember":`Raíz de brasa`,"ing.glowcap":`Setaluz`,"ing.dusk":`Baya del ocaso`,"ing.mint":`Menta`,"ing.honey":`Miel`,"ing.moonmilk":`Leche de luna`,"ing.moss":`Musgo de ciénaga`,"ing.dragon":`Ají de dragón`,"ing.mandrake":`Mandrágora`,"who.tom":`Viejo Tom`,"who.bea":`Bea la panadera`,"who.finn":`Finn el pescador`,"who.moss":`Abuela Moss`,"who.reggie":`Sir Reginald`,"who.luna":`Luna`,"who.lyle":`Lyle el bardo`,"who.ostra":`Madame Ostra`,"open.tom.0":`Buenas noches. Soy yo otra vez, y otra vez es mi cabra.`,"open.tom.1":`No te rías. Mi mujer dice que necesito una poción.`,"open.bea.0":`¡Rápido, que se quema el pan! Soy yo.`,"open.bea.1":`Te haría una tarta, cielo, pero mírame.`,"open.finn.0":`Ni un pez en todo el día. Pero pesqué esto.`,"open.finn.1":`El aire del mar me ha hecho algo.`,"open.moss.0":`No le digas al Gremio que vine, tesoro.`,"open.moss.1":`Mis hierbas no arreglan esto. ¿Las tuyas sí?`,"open.reggie.0":`¡Eh, la tienda! ¡Un caballero en apuros!`,"open.reggie.1":`Sir Reginald requiere un remedio. Con urgencia.`,"open.luna.0":`Probé un hechizo conmigo misma. ¡Casi todo bien!`,"open.luna.1":`No se lo digas a Pip, pero necesito una cura.`,"open.lyle.0":`♪ Un canto de pena, una poción, por favor ♪`,"open.lyle.1":`Mi público huyó. ¡Ayúdame, alquimista!`,"open.ostra.0":`Las cartas dijeron que me ayudarías, cariño.`,"open.ostra.1":`El acertijo de hoy, de las cartas a ti.`,"sym.calm.1.a":`He tomado un poco de café de más.`,"sym.calm.1.b":`Me tiemblan un poco las manos.`,"sym.calm.2.a":`¡No puedo parar ni un segundo!`,"sym.calm.2.b":`¡El corazón me va como un caballo desbocado!`,"sym.zest.1.a":`Hoy tengo un poco de sueño.`,"sym.zest.1.b":`No dejo de bostezar un poco.`,"sym.zest.2.a":`¡Tengo tanto sueño que me dormí de pie!`,"sym.zest.2.b":`¡Todo pesa tanto que no puedo ni mover un dedo!`,"sym.frost.1.a":`Tengo un poco de calor.`,"sym.frost.1.b":`Tengo las mejillas un poco calientes.`,"sym.frost.2.a":`¡Ardo como un horno!`,"sym.frost.2.b":`¡Me sale vapor por las orejas!`,"sym.warm.1.a":`Tengo un poco de frío.`,"sym.warm.1.b":`Tengo la nariz un poco fría.`,"sym.warm.2.a":`¡Me estoy congelando!`,"sym.warm.2.b":`¡No paran de castañetearme los dientes!`,"sym.gloom.1.a":`Brillo un poco por la noche.`,"sym.gloom.1.b":`Todo brilla un poco de más.`,"sym.gloom.2.a":`¡Brillo en la oscuridad como un farol!`,"sym.gloom.2.b":`¡Brillo tanto que nadie puede dormir!`,"sym.glow.1.a":`Tengo el ánimo un poco bajo.`,"sym.glow.1.b":`Hoy todo se ve un poco gris.`,"sym.glow.2.a":`¡Una nube negra me sigue a todas partes!`,"sym.glow.2.b":`¡Estoy tan triste que hasta mi sombra me dejó!`,"chapters.arrival":`El Bubbling Kettle`,"chapters.rival":`El hombre del sombrero de copa`,"chapters.postcard":`Una postal desde el mar`,"chapters.apprentice":`La aprendiz`,"chapters.photo":`El cuaderno de la abuela`,"chapters.truth":`La botella verde`,"chapters.eve":`Víspera de la Moonfair`,"chapters.moonfair":`La Moonfair`,"story.arrival_1":`La tienda queda en silencio. Sobre el mostrador, un gato negro abre un ojo.`,"story.arrival_2":`Nada mal para una primera noche. Wren dijo que te costaría.`,"story.arrival_3":`¿Y bien? Di algo.`,"story.arrival_3_shock":`¡¿Un gato que habla?!`,"story.arrival_3_shock_1":`Un gato que habla y que cuenta la caja. Soy Pip.`,"story.arrival_3_polite":`Gracias… ¿quién eres?`,"story.arrival_3_polite_1":`¡Qué modales! Soy Pip. Vine con la tienda.`,"story.arrival_4":`Wren se fue con prisa. Algo del mar. Mañana a la misma hora.`,"story.rival_1":`Suena la campanilla de la puerta. De pronto, Pip está bajo el mostrador.`,"story.rival_2":`Así que la tienda de Wren sigue abriendo. Vex, Gran Maestre del Gremio de Alquimistas.`,"story.rival_3":`El Gremio comprará esta casita. Quinientas monedas de oro. Generoso.`,"story.rival_3_refuse":`No está en venta.`,"story.rival_3_refuse_1":`Wren también decía eso. Durante treinta años.`,"story.rival_3_think":`Lo pensaré.`,"story.rival_3_think_1":`Piensa rápido. La oferta encoge.`,"story.rival_4":`En la Moonfair, el Gremio gana la Gran Poción. Como siempre.`,"story.rival_5":`Gana la Moonfair y nadie podrá tocar la tienda. Ley antigua. Necesitamos estrellas: curas exactas.`,"story.postcard_1":`Una postal cae por la rendija de la puerta. En la foto, una gaviota te fulmina con la mirada.`,"story.postcard_2":`Querido brote: el mar es precioso. Dale de comer a Pip dos veces al día, diga lo que diga.`,"story.postcard_3":`Mantenlo lejos de la botella verde del estante de arriba. Y nunca le vendas a un hombre con sombrero de copa.`,"story.postcard_3_bottle":`¿Qué hay en la botella verde?`,"story.postcard_3_bottle_1":`Nada. Es verde. Siguiente pregunta.`,"story.postcard_3_twice":`Dos veces al día, Pip.`,"story.postcard_3_twice_1":`Quería decir tres. El aire del mar la afectó.`,"story.apprentice_1":`¡BUM! Humo morado y luego una chica con el sombrero chamuscado.`,"story.apprentice_2":`¡Perdón! Hechizo de timbre. Soy Luna. Una bruja. Casi.`,"story.apprentice_3":`Wren prometió enseñarme y luego se fue. ¿Puedo ayudar? Sé barrer. Casi siempre.`,"story.apprentice_3_welcome":`¡Bienvenida a bordo!`,"story.apprentice_3_welcome_1":`¡Las escobas y yo no te fallaremos!`,"story.apprentice_3_later":`Sigue practicando.`,"story.apprentice_3_later_1":`Bueno. Estaré en el mercado. Saludando.`,"story.apprentice_4":`Corre la voz. Un bardo y un caballero también quieren curas.`,"story.photo_1":`Encontré el recetario de Wren. Detrás de los tritones en vinagre, claro.`,"story.photo_2":`Se cae una foto vieja: Wren, un chico con sombrero de copa y un joven de ojos amarillos.`,"story.photo_2_ask":`Pip… ¿quién es el tercero?`,"story.photo_2_ask_1":`Alguien que tomó una mala decisión. Guárdala.`,"story.photo_2_back":`Guardarla.`,"story.photo_2_back_1":`Bien. Es lo sensato.`,"story.photo_3":`Las cartas me enviaron, cariño. Y el gato no es un gato. Lo sabe todo el mundo.`,"story.photo_4":`Fuera.`,"story.truth_1":`Es tarde. El caldero cruje al enfriarse. Pip está sentado junto a la botella verde.`,"story.truth_2":`Me llamaba Pippin Ashgrove. Vex y yo fundamos el Gremio. Éramos mejores amigos.`,"story.truth_3":`La noche antes de una Moonfair bebí una pócima de transformación. Funcionó demasiado bien.`,"story.truth_4":`Wren se llevó al gato a casa. Vex cree que me escapé con nuestras recetas.`,"story.truth_5":`La botella verde es la cura. Necesita la luz de luna de la Moonfair.`,"story.truth_5_cure":`Entonces, terminémosla.`,"story.truth_5_cure_1":`…¿Harías eso? No te pongas sentimental.`,"story.truth_5_family":`Gato o no, eres de la familia.`,"story.truth_5_family_1":`…Un pelo de gato en el ojo. Mío.`,"story.eve_1":`¡Suerte mañana en la Moonfair, cielo! Te horneé un pan. Con forma de caldero.`,"story.eve_2":`Duchess pilló a un hombre del Gremio cerca de tu carro. Se comió sus notas.`,"story.eve_3":`Yo vigilo el caldero. Nada va a explotar. Probablemente.`,"story.eve_4":`Mañana los jueces traen tres acertijos. Curas exactas, hervores perfectos. ¿Qué servimos?`,"story.eve_4_classic":`El Tónico Estelar de Wren.`,"story.eve_4_classic_1":`Probado. Wren presumirá durante un año.`,"story.eve_4_ours":`Algo nuestro.`,"story.eve_4_ours_1":`Aterrador. A Wren le encantaría.`,"story.moonfair_1":`La plaza brilla llena de farolillos. Los jueces prueban tus tres curas.`,"story.moonfair_2":`El Elixir Supremo del Gremio. Cuarenta y siete ingredientes. Pan de oro.`,"story.moonfair_3":`Sabe a moneda.`,"story.moonfair_4":`El Tónico Estelar de Wren brilla en las copas. Junto al mar, una anciana sonríe.`,"story.moonfair_5":`Tu propia poción burbujea como el primer día cálido de la primavera.`,"story.moonfair_6":`El ganador de la Gran Poción… ¡el Bubbling Kettle!`,"story.moonfair_7":`¡Imposible! Esa tienda me lo quitó todo. Me quitó a mi—`,"story.moonfair_8":`La luz de la luna toca la botella verde. Pip bebe. Sobre el mostrador aparece un hombre alto de ojos amarillos.`,"story.moonfair_9":`Hola, Vex. Fui un idiota. Lo siento muchísimo.`,"story.moonfair_10":`Hola, Vex. Fui un idiota. Lo siento muchísimo.`,"story.moonfair_11":`…¿Pippin? ¿Estuviste aquí todo este tiempo?`,"story.moonfair_12":`Treinta años enfadado con una tienda. Son muchos años.`,"story.moonfair_12_seat":`Hay un sitio para ti en el Kettle.`,"story.moonfair_12_seat_1":`…Traeré galletas. Galletas del Gremio.`,"story.moonfair_12_goat":`Empieza pidiéndole perdón a la cabra.`,"story.moonfair_12_goat_1":`Está bien. Una disculpa. A una cabra.`,"story.moonfair_13":`Me enteré de que ganaste. Vuelvo a casa para el té. Dile a Pip que estoy orgullosa de él. Con cariño, la abuela.`},"pt-BR":{tagline:`Uma lojinha aconchegante de poções à noite. Cure aquilo de que eles reclamam.`,startNight:`Começar a noite`,continue:`Continuar`,daily:`Remédio do dia`,dailyDone:`Remédio do dia: curado`,dailyTitle:`Remédio do dia`,dailyDoneText:`O enigma de hoje está curado. Amanhã vem outro. Dias curados: {n}`,dailyReward:`+{n} de ouro pelo remédio de hoje!`,shop:`Loja`,notebook:`Caderno`,settings:`Opções`,ingredients:`Ingredientes`,nightN:`Noite {n}`,nightClosed:`Noite {n}: a loja está fechada`,fairTitle:`A Moonfair`,fairAgain:`Os juízes querem pelo menos duas curas exatas. A Moonfair continua amanhã à noite!`,goldEarned:`ouro`,exactCures:`curas exatas: {n}/{total}`,double:`Veja um anúncio: +{n} de ouro (×2)`,chapterWaits:`Um novo capítulo espera: {title}`,nextChapter:{one:`Falta {n} estrela para o próximo capítulo`,other:`Faltam {n} estrelas `,"tier.cellar":`O porão`,"tier.attic":`O sótão`,"tier.moon":`A janela da lua`,"item.newIngredient":`novo ingrediente`,"item.mint.name":`Hortelã`,"item.honey.name":`Mel`,"item.moonmilk.name":`Leite-de-lua`,"item.moss.name":`Musgo-do-brejo`,"item.dragon.name":`Pimenta-de-dragão`,"item.mandrake.name":`Mandrágora`,"item.bellows.name":`Fole`,"item.bellows.effect":`uma faixa branca mais larga na fervura`,"item.sign.name":`Placa`,"item.sign.effect":`+15% de gorjeta por nível`,"item.bell.name":`Sineta`,"item.bell.effect":`mais um cliente por noite`,"item.spyglass.name":`Luneta`,"item.spyglass.effect":`sintomas conhecidos mostram sua força`,"ing.poppy":`Papoula`,"ing.pepper":`Pimenta`,"ing.snowbell":`Flor-de-neve`,"ing.ember":`Raiz-de-brasa`,"ing.glowcap":`Cogumeluz`,"ing.dusk":`Baga-do-ocaso`,"ing.mint":`Hortelã`,"ing.honey":`Mel`,"ing.moonmilk":`Leite-de-lua`,"ing.moss":`Musgo-do-brejo`,"ing.dragon":`Pimenta-de-dragão`,"ing.mandrake":`Mandrágora`,"who.tom":`Velho Tom`,"who.bea":`Bea, a padeira`,"who.finn":`Finn, o pescador`,"who.moss":`Vovó Moss`,"who.reggie":`Sir Reginald`,"who.luna":`Luna`,"who.lyle":`Lyle, o bardo`,"who.ostra":`Madame Ostra`,"open.tom.0":`Boa noite. Sou eu de novo, e é a minha cabra de novo.`,"open.tom.1":`Não ria. Minha esposa diz que eu preciso de uma poção.`,"open.bea.0":`Rápido, antes que o pão queime! Sou eu.`,"open.bea.1":`Eu faria uma torta pra você, meu bem, mas olha só pra mim.`,"open.finn.0":`Não pesquei nada o dia todo. Só pesquei isto.`,"open.finn.1":`O ar do mar fez alguma coisa comigo.`,"open.moss.0":`Não conte à Guilda que eu vim aqui, meu anjo.`,"open.moss.1":`Minhas ervas não dão conta dessa. As suas dão?`,"open.reggie.0":`Ô de casa! Um cavaleiro precisa de ajuda!`,"open.reggie.1":`Sir Reginald exige um remédio. Com urgência.`,"open.luna.0":`Testei um feitiço em mim mesma. Quase tudo certo!`,"open.luna.1":`Não conte pro Pip, mas preciso de uma cura.`,"open.lyle.0":`♪ Uma canção de dor, uma poção, por favor ♪`,"open.lyle.1":`Meu público fugiu. Me ajude, alquimista!`,"open.ostra.0":`As cartas disseram que você me ajudaria, meu amor.`,"open.ostra.1":`O enigma de hoje, das cartas para você.`,"sym.calm.1.a":`Tomei um pouco de café demais.`,"sym.calm.1.b":`Minhas mãos estão um pouco trêmulas.`,"sym.calm.2.a":`Não consigo sossegar nem por um segundo!`,"sym.calm.2.b":`Meu coração dispara feito um cavalo desembestado!`,"sym.zest.1.a":`Estou com um pouco de sono hoje.`,"sym.zest.1.b":`Fico bocejando um pouco.`,"sym.zest.2.a":`Estou com tanto sono que dormi em pé!`,"sym.zest.2.b":`Tudo pesa tanto que não consigo levantar um dedo!`,"sym.frost.1.a":`Estou com um pouco de calor.`,"sym.frost.1.b":`Minhas bochechas estão um pouco quentes.`,"sym.frost.2.a":`Estou queimando feito um forno!`,"sym.frost.2.b":`Está saindo vapor das minhas orelhas!`,"sym.warm.1.a":`Estou com um pouco de frio.`,"sym.warm.1.b":`Meu nariz está um pouco gelado.`,"sym.warm.2.a":`Estou congelando!`,"sym.warm.2.b":`Meus dentes não param de bater!`,"sym.gloom.1.a":`Eu brilho um pouco à noite.`,"sym.gloom.1.b":`Tudo está um pouco claro demais.`,"sym.gloom.2.a":`Eu brilho no escuro feito uma lanterna!`,"sym.gloom.2.b":`Brilho tanto que ninguém consegue dormir!`,"sym.glow.1.a":`Me sinto um pouco pra baixo.`,"sym.glow.1.b":`Tudo parece um pouco cinza hoje.`,"sym.glow.2.a":`Uma nuvem escura me segue por toda parte!`,"sym.glow.2.b":`Estou tão triste que até minha sombra me largou!`,"chapters.arrival":`O Bubbling Kettle`,"chapters.rival":`O homem da cartola`,"chapters.postcard":`Um cartão-postal do mar`,"chapters.apprentice":`A aprendiz`,"chapters.photo":`O caderno da vovó`,"chapters.truth":`A garrafa verde`,"chapters.eve":`Véspera da Moonfair`,"chapters.moonfair":`A Moonfair`,"story.arrival_1":`A loja fica em silêncio. No balcão, um gato preto abre um olho.`,"story.arrival_2":`Nada mal para uma primeira noite. A Wren disse que você ia demorar.`,"story.arrival_3":`E aí? Diga alguma coisa.`,"story.arrival_3_shock":`Um gato que fala?!`,"story.arrival_3_shock_1":`Um gato que fala e conta o caixa. Eu sou o Pip.`,"story.arrival_3_polite":`Valeu… quem é você?`,"story.arrival_3_polite_1":`Que educação! Sou o Pip. Vim junto com a loja.`,"story.arrival_4":`A Wren saiu às pressas. Algo sobre o mar. Amanhã, mesmo horário.`,"story.rival_1":`O sino da porta tilinta. De repente, o Pip está debaixo do balcão.`,"story.rival_2":`Então a loja da Wren ainda abre. Vex, Grão-Mestre da Guilda dos Alquimistas.`,"story.rival_3":`A Guilda vai comprar este chalé. Quinhentas moedas de ouro. Generoso.`,"story.rival_3_refuse":`Não está à venda.`,"story.rival_3_refuse_1":`A Wren também dizia isso. Por trinta anos.`,"story.rival_3_think":`Vou pensar.`,"story.rival_3_think_1":`Pense rápido. A oferta encolhe.`,"story.rival_4":`Na Moonfair, a Guilda ganha a Grande Poção. Como sempre.`,"story.rival_5":`Vença a Moonfair e ninguém toca na loja. Lei antiga. Precisamos de estrelas: curas exatas.`,"story.postcard_1":`Um cartão-postal cai pela fresta da porta. Na frente, uma gaivota encara feio.`,"story.postcard_2":`Querido brotinho, o mar é lindo. Dê comida ao Pip duas vezes por dia, diga ele o que disser.`,"story.postcard_3":`Mantenha ele longe da garrafa verde na prateleira de cima. E nunca venda nada a um homem de cartola.`,"story.postcard_3_bottle":`O que tem na garrafa verde?`,"story.postcard_3_bottle_1":`Nada. É verde. Próxima pergunta.`,"story.postcard_3_twice":`Duas vezes por dia, Pip.`,"story.postcard_3_twice_1":`Ela quis dizer três. O ar do mar subiu à cabeça dela.`,"story.apprentice_1":`BUM. Fumaça roxa, e depois uma garota de chapéu chamuscado.`,"story.apprentice_2":`Desculpa! Feitiço de campainha. Sou a Luna. Uma bruxa. Quase.`,"story.apprentice_3":`A Wren prometeu me ensinar e depois foi embora. Posso ajudar? Eu varro. Quase sempre.`,"story.apprentice_3_welcome":`Bem-vinda a bordo!`,"story.apprentice_3_welcome_1":`As vassouras e eu não vamos te decepcionar!`,"story.apprentice_3_later":`Continue praticando.`,"story.apprentice_3_later_1":`Tá bom. Vou estar na feira. Acenando.`,"story.apprentice_4":`A notícia se espalha. Um bardo e um cavaleiro também querem curas.`,"story.photo_1":`Achei o livro de receitas da Wren. Atrás das salamandras em conserva, claro.`,"story.photo_2":`Uma foto antiga escorrega: a Wren, um menino de cartola e um rapaz de olhos amarelos.`,"story.photo_2_ask":`Pip… quem é o terceiro?`,"story.photo_2_ask_1":`Alguém que tomou uma decisão ruim. Guarde isso.`,"story.photo_2_back":`Guardar a foto.`,"story.photo_2_back_1":`Ótimo. Sensato.`,"story.photo_3":`As cartas me mandaram, meu amor. E o gato não é um gato. Todo mundo sabe.`,"story.photo_4":`Fora.`,"story.truth_1":`Tarde da noite. O caldeirão estala enquanto esfria. O Pip está ao lado da garrafa verde.`,"story.truth_2":`Meu nome era Pippin Ashgrove. Eu e o Vex fundamos a Guilda. Melhores amigos.`,"story.truth_3":`Na noite antes de uma Moonfair, tomei uma poção de transformação. Funcionou bem demais.`,"story.truth_4":`A Wren levou o gato para casa. O Vex acha que eu fugi com as nossas receitas.`,"story.truth_5":`A garrafa verde é a cura. Ela precisa do luar da Moonfair.`,"story.truth_5_cure":`Então vamos terminá-la.`,"story.truth_5_cure_1":`…Você faria isso? Não fique sentimental.`,"story.truth_5_family":`Gato ou não, você é da família.`,"story.truth_5_family_1":`…Pelo de gato no olho. Meu.`,"story.eve_1":`Boa sorte na Moonfair amanhã, meu bem! Fiz um pão pra você. Em forma de caldeirão.`,"story.eve_2":`A Duchess pegou um homem da Guilda perto da sua carroça. Comeu as anotações dele.`,"story.eve_3":`Eu cuido do caldeirão. Nada vai explodir. Provavelmente.`,"story.eve_4":`Amanhã os jurados trazem três enigmas. Curas exatas, fervuras perfeitas. O que vamos servir?`,"story.eve_4_classic":`O Tônico Estelar da Wren.`,"story.eve_4_classic_1":`Testado e aprovado. A Wren vai se gabar por um ano.`,"story.eve_4_ours":`Algo nosso.`,"story.eve_4_ours_1":`Assustador. A Wren ia adorar.`,"story.moonfair_1":`A praça brilha com lanternas. Os jurados provam suas três curas.`,"story.moonfair_2":`O Elixir Supremo da Guilda. Quarenta e sete ingredientes. Folha de ouro.`,"story.moonfair_3":`Tem gosto de moeda.`,"story.moonfair_4":`O Tônico Estelar da Wren brilha nas taças. À beira-mar, uma senhora sorri.`,"story.moonfair_5":`Sua própria poção borbulha como o primeiro dia quente da primavera.`,"story.moonfair_6":`O vencedor da Grande Poção… o Bubbling Kettle!`,"story.moonfair_7":`Impossível! Aquela loja me tirou tudo. Tirou o meu—`,"story.moonfair_8":`O luar atinge a garrafa verde. O Pip bebe. Um homem alto de olhos amarelos surge em cima do balcão.`,"story.moonfair_9":`Olá, Vex. Eu fui um idiota. Sinto muito, muito mesmo.`,"story.moonfair_10":`Olá, Vex. Eu fui um idiota. Sinto muito, muito mesmo.`,"story.moonfair_11":`…Pippin? Você esteve aqui o tempo todo?`,"story.moonfair_12":`Trinta anos com raiva de uma loja. São muitos anos.`,"story.moonfair_12_seat":`Tem um lugar pra você no Kettle.`,"story.moonfair_12_seat_1":`…Vou levar biscoitos. Biscoitos da Guilda.`,"story.moonfair_12_goat":`Comece pedindo desculpas à cabra.`,"story.moonfair_12_goat_1":`Tá bom. Um pedido de desculpas. Para uma cabra.`,"story.moonfair_13":`Soube que você ganhou. Vou voltar pra casa para um chá. Diga ao Pip que tenho orgulho dele. Beijos, Vovó.`},fr:{tagline:`Une boutique de potions douillette, la nuit. Soignez ce dont ils se plaignent.`,startNight:`Commencer la nuit`,continue:`Continuer`,daily:`Remède du jour`,dailyDone:`Remède du jour\xA0: guéri`,dailyTitle:`Remède du jour`,dailyDoneText:`L'énigme du jour est résolue. Une nouvelle arrive demain. Jours guéris\xA0: {n}`,dailyReward:`+{n} or pour le remède du jour\xA0!`,shop:`Boutique`,notebook:`Carnet`,settings:`Réglages`,ingredients:`Ingrédients`,nightN:`Nuit {n}`,nightClosed:`Nuit {n}\xA0: la boutique est fermée`,fairTitle:`La Moonfair`,fairAgain:`Les juges veulent au moins deux remèdes exacts. La Moonfair continue demain soir\xA0!`,goldEarned:`or`,exactCures:`remèdes exacts\xA0: {n}/ ffichent à côté.`,notebookEmpty:`Rien pour l'instant. Soignez un symptôme exactement et Pip le note.`,tierOpens:{one:`Encore {n} achat pour l'ouvrir`,other:`Encore {n} achats pour l'ouvrir`},level:`niveau {n}/{max}`,owned:`Sur l'étagère`,max:`Max`,newIngredient:`{name} est sur l'étagère\xA0!`,"vol.music":`Musique`,"vol.ambient":`Bruits de la boutique`,"vol.sfx":`Effets`,"tier.shelf":`L'étagère`,"tier.cellar":`La cave`,"tier.attic":`Le grenier`,"tier.moon":`La fenêtre de lune`,"item.newIngredient":`nouvel ingrédient`,"item.mint.name":`Menthe`,"item.honey.name":`Miel`,"item.moonmilk.name":`Lait de lune`,"item.moss.name":`Mousse des marais`,"item.dragon.name":`Piment-dragon`,"item.mandrake.name":`Mandragore`,"item.bellows.name":`Soufflet`,"item.bellows.effect":`une zone blanche plus large à l'ébullition`,"item.sign.name":`Enseigne`,"item.sign.effect":`+15\xA0% de pourboires par niveau`,"item.bell.name":`Clochette`,"item.bell.effect":`un client de plus par nuit`,"item.spyglass.name":`Longue-vue`,"item.spyglass.effect":`les symptômes connus montrent leur force`,"ing.poppy":`Coquelicot`,"ing.pepper":`Poivre`,"ing.snowbell":`Perce-neige`,"ing.ember":`Racine-braise`,"ing.glowcap":`Lumicèpe`,"ing.dusk":`Baie du soir`,"ing.mint":`Menthe`,"ing.honey":`Miel`,"ing.moonmilk":`Lait de lune`,"ing.moss":`Mousse des marais`,"ing.dragon":`Piment-dragon`,"ing.mandrake":`Mandragore`,"who.tom":`Le vieux Tom`,"who.bea":`Bea la boulangère`,"who.finn":`Finn le pêcheur`,"who.moss":`Mamie Moss`,"who.reggie":`Sir Reginald`,"who.luna":`Luna`,"who.lyle":`Lyle le barde`,"who.ostra":`Madame Ostra`,"open.tom.0":`Bonsoir. C'est encore moi, et c'est encore ma chèvre.`,"open.tom.1":`Ne riez pas. Ma femme dit qu'il me faut une potion.`,"open.bea.0":`Vite, avant que le pain brûle\xA0! C'est moi.`,"open.bea.1":`Je vous ferais bien une tarte, mon trésor, mais regardez-moi.`,"open.finn.0":`Rien pêché de la journée. À part ça.`,"open.finn.1":`L'air marin m'a fait un drôle d'effet.`,"open.moss.0":`Ne dites pas à la Guilde que je suis venue, mon chou.`,"open.moss.1":`Mes herbes n'y peuvent rien. Et les vôtres\xA0?`,"open.reggie.0":`Holà, la boutique\xA0! Un chevalier dans le besoin\xA0!`,"open.reggie.1":`Sir Reginald exige un remède. D'urgence.`,"open.luna.0":`J'ai testé un sort sur moi-même. Presque réussi\xA0!`,"open.luna.1":`Ne le dis pas à Pip, mais il me faut un remède.`,"open.lyle.0":`♪ Un chant de malheur, une potion, par pitié ♪`,"open.lyle.1":`Mon public a fui. À l'aide, alchimiste\xA0!`,"open.ostra.0":`Les cartes ont dit que vous m'aideriez, mon trésor.`,"open.ostra.1":`L'énigme du jour, des cartes jusqu'à vous.`,"sym.calm.1.a":`J'ai bu un peu trop de café.`,"sym.calm.1.b":`Mes mains tremblent un peu.`,"sym.calm.2.a":`Je ne tiens pas en place. Pas une seconde\xA0!`,"sym.calm.2.b":`Mon cœur galope comme un cheval fou\xA0!`,"sym.zest.1.a":`J'ai un peu sommeil aujourd'hui.`,"sym.zest.1.b":`Je bâille un peu trop.`,"sym.zest.2.a":`J'ai tellement sommeil que je dors debout\xA0!`,"sym.zest.2.b":`Tout est si lourd, je ne peux pas lever le petit doigt\xA0!`,"sym.frost.1.a":`J'ai un peu trop chaud.`,"sym.frost.1.b":`J'ai les joues un peu chaudes.`,"sym.frost.2.a":`Je brûle comme un four\xA0!`,"sym.frost.2.b":`J'ai de la vapeur qui me sort des oreilles\xA0!`,"sym.warm.1.a":`J'ai un peu froid.`,"sym.warm.1.b":`J'ai le nez un peu froid.`,"sym.warm.2.a":`Je gèle sur place\xA0!`,"sym.warm.2.b":`Je n'arrête pas de claquer des dents\xA0!`,"sym.gloom.1.a":`Je brille un peu la nuit.`,"sym.gloom.1.b":`Tout est un peu trop lumineux.`,"sym.gloom.2.a":`Je brille dans le noir comme une lanterne\xA0!`,"sym.gloom.2.b":`Je brille si fort que personne ne peut dormir\xA0!`,"sym.glow.1.a":`J'ai un peu le cafard.`,"sym.glow.1.b":`Tout semble un peu gris aujourd'hui.`,"sym.glow.2.a":`Un nuage noir me suit partout\xA0!`,"sym.glow.2.b":`J'ai tellement le cafard que même mon ombre est partie\xA0!`,"chapters.arrival":`Le Bubbling Kettle`,"chapters.rival":`L'homme au haut-de-forme`,"chapters.postcard":`Une carte postale de la mer`,"chapters.apprentice":`L'apprentie`,"chapters.photo":`Le carnet de grand-mère`,"chapters.truth":`La bouteille verte`,"chapters.eve":`La veille de la Moonfair`,"chapters.moonfair":`La Moonfair`,"story.arrival_1":`La boutique se tait. Sur le comptoir, un chat noir ouvre un œil.`,"story.arrival_2":`Pas mal pour une première nuit. Wren disait que tu traînerais.`,"story.arrival_3":`Alors\xA0? Dis quelque chose.`,"story.arrival_3_shock":`Un chat qui parle\xA0?!`,"story.arrival_3_shock_1":`Un chat qui parle et qui compte la caisse. Moi, c'est Pip.`,"story.arrival_3_polite":`Merci… qui es-tu\xA0?`,"story.arrival_3_polite_1":`Quelle politesse\xA0! Moi, c'est Pip. Je suis livré avec la boutique.`,"story.arrival_4":`Wren est partie en vitesse. Une histoire de mer. Demain, même heure.`,"story.rival_1":`La clochette de la porte tinte. Soudain, Pip est sous le comptoir.`,"story.rival_2":`Ainsi, la boutique de Wren ouvre encore. Vex, Grand Maître de la Guilde des Alchimistes.`,"story.rival_3":`La Guilde rachètera cette chaumière. Cinq cents pièces d'or. Généreux.`,"story.rival_3_refuse":`Elle n'est pas à vendre.`,"story.rival_3_refuse_1":`Wren disait pareil. Pendant trente ans.`,"story.rival_3_think":`Je vais y réfléchir.`,"story.rival_3_think_1":`Réfléchissez vite. L'offre rétrécit.`,"story.rival_4":`À la Moonfair, la Guilde remporte la Grande Potion. Comme toujours.`,"story.rival_5":`Gagne la Moonfair et personne ne pourra toucher à la boutique. Vieille loi. Il nous faut des étoiles\xA0: des remèdes exacts.`,"story.postcard_1":`Une carte postale glisse sous la porte. Au recto, une mouette lance un regard noir.`,"story.postcard_2":`Mon petit bourgeon, la mer est superbe. Nourris Pip deux fois par jour, quoi qu'il dise.`,"story.postcard_3":`Éloigne-le de la bouteille verte sur l'étagère du haut. Et ne vends jamais rien à un homme en haut-de-forme.`,"story.postcard_3_bottle":`Qu'y a-t-il dans la bouteille verte\xA0?`,"story.postcard_3_bottle_1":`Rien. Elle est verte. Question suivante.`,"story.postcard_3_twice":`Deux fois par jour, Pip.`,"story.postcard_3_twice_1":`Elle voulait dire trois. L'air marin lui a tapé sur la tête.`,"story.apprentice_1":`BANG. Une fumée violette, puis une fille au chapeau roussi.`,"story.apprentice_2":`Pardon\xA0! Sort de sonnette. Moi, c'est Luna. Une sorcière. Presque.`,"story.apprentice_3":`Wren m'avait promis de m'apprendre, puis elle est partie. Je peux aider\xA0? Je balaie. Presque.`,"story.apprentice_3_welcome":`Bienvenue à bord\xA0!`,"story.apprentice_3_welcome_1":`Les balais et moi, on ne te décevra pas\xA0!`,"story.apprentice_3_later":`Entraîne-toi encore.`,"story.apprentice_3_later_1":`D'accord. Je serai au marché. À faire coucou.`,"story.apprentice_4":`La rumeur se répand. Un barde et un chevalier veulent aussi des remèdes.`,"story.photo_1":`J'ai trouvé le livre de recettes de Wren. Derrière les tritons au vinaigre, évidemment.`,"story.photo_2":`Une vieille photo tombe\xA0: Wren, un garçon en haut-de-forme et un jeune homme aux yeux jaunes.`,"story.photo_2_ask":`Pip… qui est le troisième\xA0?`,"story.photo_2_ask_1":`Quelqu'un qui a fait un mauvais choix. Range-la.`,"story.photo_2_back":`La ranger.`,"story.photo_2_back_1":`Bien. Raisonnable.`,"story.photo_3":`Les cartes m'ont envoyée, mon trésor. Et le chat n'est pas un chat. Tout le monde le sait.`,"story.photo_4":`Dehors.`,"story.truth_1":`Il est tard. Le chaudron cliquette en refroidissant. Pip est assis près de la bouteille verte.`,"story.truth_2":`Je m'appelais Pippin Ashgrove. Vex et moi avons fondé la Guilde. Meilleurs amis.`,"story.truth_3":`La veille d'une Moonfair, j'ai bu un philtre de métamorphose. Il a trop bien marché.`,"story.truth_4":`Wren a ramené le chat chez elle. Vex croit que je me suis enfui avec nos recettes.`,"story.truth_5":`La bouteille verte, c'est le remède. Il lui faut le clair de lune de la Moonfair.`,"story.truth_5_cure":`Alors finissons-le.`,"story.truth_5_cure_1":`…Tu ferais ça\xA0? Pas de sentimentalisme.`,"story.truth_5_family":`Chat ou pas, tu es de la famille.`,"story.truth_5_family_1":`…Un poil de chat dans l'œil. Le mien.`,"story.eve_1":`Bonne chance demain à la Moonfair, mon trésor\xA0! Je vous ai fait un pain. En forme de chaudron.`,"story.eve_2":`Duchess a surpris un type de la Guilde près de votre charrette. Elle a mangé ses notes.`,"story.eve_3":`Je surveille le chaudron. Rien n'explosera. Sans doute.`,"story.eve_4":`Demain, les juges apportent trois énigmes. Remèdes exacts, ébullitions parfaites. On sert quoi\xA0?`,"story.eve_4_classic":`Le Tonique Étoilé de Wren.`,"story.eve_4_classic_1":`Une valeur sûre. Wren va frimer pendant un an.`,"story.eve_4_ours":`Une création à nous.`,"story.eve_4_ours_1":`Terrifiant. Wren adorerait.`,"story.moonfair_1":`La place brille de lanternes. Les juges goûtent vos trois remèdes.`,"story.moonfair_2":`L'Élixir Suprême de la Guilde. Quarante-sept ingrédients. Feuille d'or.`,"story.moonfair_3":`Ça a un goût de pièce.`,"story.moonfair_4":`Le Tonique Étoilé de Wren brille dans les coupes. Au bord de la mer, une vieille dame sourit.`,"story.moonfair_5":`Votre propre potion pétille comme le premier jour chaud du printemps.`,"story.moonfair_6":`Le gagnant de la Grande Potion… le Bubbling Kettle\xA0!`,"story.moonfair_7":`Impossible\xA0! Cette boutique m'a tout pris. Elle m'a pris mon—`,"story.moonfair_8":`Le clair de lune frappe la bouteille verte. Pip boit. Un grand homme aux yeux jaunes se dresse sur le comptoir.`,"story.moonfair_9":`Bonsoir, Vex. J'ai été un idiot. Je suis tellement désolé.`,"story.moonfair_10":`Bonsoir, Vex. J'ai été un idiot. Je suis tellement désolé.`,"story.moonfair_11":`…Pippin\xA0? Tu étais là depuis le début\xA0?`,"story.moonfair_12":`Trente ans de colère contre une boutique. Ça fait beaucoup d'années.`,"story.moonfair_12_seat":`Il y a une place pour vous au Kettle.`,"story.moonfair_12_seat_1":`…J'apporterai des biscuits. Des biscuits de la Guilde.`,"story.moonfair_12_goat":`D'abord, des excuses à la chèvre.`,"story.moonfair_12_goat_1":`Soit. Une excuse. À une chèvre.`,"story.moonfair_13":`Il paraît que tu as gagné. Je rentre pour le thé. Dis à Pip que je suis fière de lui. Bisous, Mamie.`},de:{tagline:`Ein gemütlicher Trankladen bei Nacht. Heile, worüber sie klagen.`,startNight:`Nacht beginnen`,continue:`Weiter`,daily:`Mittel des Tages`,dailyDone:`Mittel des Tages: geheilt`,dailyTitle:`Mittel des Tages`,dailyDoneText:`Das heutige Rätsel ist geheilt. Morgen kommt ein neues. Geheilte Tage: {n}`,dailyReward:`+{n} Gold für das heutige Mittel!`,shop:`Laden`,notebook:`Notizbuch`,settings:`Einstellungen`,ingredients:`Zutaten`,nightN:`Nacht {n}`,nightClosed:`Nacht {n}: Der Laden ist zu`,fairTitle:`Der Moonfair`,fairAgain:`Die Jury will mindestens zwei exakte Heilungen. Der Moonfair geht morgen Nacht weiter!`,goldEarned:`Gold`,exactCures:`genau geheilt: {n}/{total}`,double:`Werbung ansehen: +{n} Gold (×2)`,chapterWaits:`Ein neues Kapitel wartet: {title}`,nextChapter:{one:`Noch {n} Stern bis zum nächsten Kapitel`,other:`Noch {n} Sterne bis zum nächsten Kapitel`},nextNight:`Nächste Nacht`,chapter:`Kapitel {n}: {title}`,stuck:`Nicht weiter?`,stuckTitle:`Nicht weiter?`,stuckText:`Jede Klage verlangt eine Essenz: das Gegenteil des Problems. Starke Worte heißen zwei. Oder Pip nennt dir die Kur für diese Kundschaft.`,askPip:`Werbung ansehen: Pip nennt die Kur`,askPipRetry:`Werbung: Pip nennt die Kur, neuer Versuch`,oopsTitle:`Falsche Kur!`,oopsText:`{name} schaut finster in die Tasse. Pip kann die echte Kur nennen, und du braust neu, bevor es zu spät ist.`,oopsTextNoAd:`{name} runzelt die Stirn über der Tasse. Lies die Worte noch mal: Jedes verlangt eine Essenz.`,letGo:`Gehen lassen`,youMixed:`Du hast gemischt:`,closeShop:`Laden für heute schließen`,pipNeeds:`Pip: Gebraucht wird`,takeOut:`{name} herausnehmen`,emptySlot:`Leerer Platz`,boilNow:`Kochen`,stop:`Stopp!`,"tip.cure":`Heile, worüber sie klagen! Tom kann nicht stillsitzen: Das braucht Ruhe. Tippe auf Mohn, dann auf Kochen und stoppe im Weißen.`,"tip.cancel":`Zu viel von einer Essenz? Ihr Gegenteil hebt sie auf.`,"tip.boil":`Stoppe das Kochen im weißen Feld: Ein perfekter Trank bringt mehr.`,"tip.fair":`Der Moonfair! Die Jury bringt drei Rätsel. Exakte Kuren, perfektes Kochen.`,"react.exact.0":`Genau das Richtige!`,"react.exact.1":`Oh! Ich fühl mich wie neu!`,"react.exact.2":`Genau richtig. Danke!`,"react.close":`Hm. Besser… so halbwegs.`,"react.wrong":`Uff. Das war's nicht.`,"react.left":`Ich kann nicht länger warten. Gute Nacht.`,"boil.perfect":`Und perfekt gekocht!`,"boil.good":`Schön gebraut.`,"boil.burnt":`Aber etwas angebrannt.`,notebookHint:`Jedes Symptom, das du genau geheilt hast. Sagt es jemand wieder, stehen seine Essenzen daneben.`,notebookEmpty:`Noch nichts. Heile ein Symptom genau, und Pip schreibt es auf.`,tierOpens:{one:`Noch {n} Kauf schaltet es frei`,other:`Noch {n} Käufe schalten es frei`},level:`Stufe {n}/{max}`,owned:`Im Regal`,max:`Max`,newIngredient:`{name} steht im Regal!`,"vol.music":`Musik`,"vol.ambient":`Ladengeräusche`,"vol.sfx":`Effekte`,"tier.shelf":`Das Regal`,"tier.cellar":`Der Keller`,"tier.attic":`Der Dachboden`,"tier.moon":`Das Mondfenster`,"item.newIngredient":`neue Zutat`,"item.mint.name":`Minze`,"item.honey.name":`Honig`,"item.moonmilk.name":`Mondmilch`,"item.moss.name":`Moormoos`,"item.dragon.name":`Drachenpfeffer`,"item.mandrake.name":`Alraune`,"item.bellows.name":`Blasebalg`,"item.bellows.effect":`breiteres weißes Feld beim Kochen`,"item.sign.name":`Ladenschild`,"item.sign.effect":`+15 % Trinkgeld pro Stufe`,"item.bell.name":`Türglocke`,"item.bell.effect":`ein Kunde mehr pro Nacht`,"item.spyglass.name":`Fernrohr`,"item.spyglass.effect":`bekannte Symptome zeigen ihre Stärke`,"ing.poppy":`Mohn`,"ing.pepper":`Pfeffer`,"ing.snowbell":`Schneeglocke`,"ing.ember":`Glutwurz`,"ing.glowcap":`Glühpilz`,"ing.dusk":`Dämmerbeere`,"ing.mint":`Minze`,"ing.honey":`Honig`,"ing.moonmilk":`Mondmilch`,"ing.moss":`Moormoos`,"ing.dragon":`Drachenpfeffer`,"ing.mandrake":`Alraune`,"who.tom":`Der alte Tom`,"who.bea":`Bäckerin Bea`,"who.finn":`Fischer Finn`,"who.moss":`Oma Moss`,"who.reggie":`Sir Reginald`,"who.luna":`Luna`,"who.lyle":`Barde Lyle`,"who.ostra":`Madame Ostra`,"open.tom.0":`'n Abend. Schon wieder ich, und schon wieder meine Ziege.`,"open.tom.1":`Nicht lachen. Meine Frau sagt, ich brauch einen Trank.`,"open.bea.0":`Schnell, bevor das Brot verbrennt! Ich bin's.`,"open.bea.1":`Ich würd dir ja einen Kuchen backen, aber sieh mich an.`,"open.finn.0":`Den ganzen Tag nichts gefangen. Nur das hier.`,"open.finn.1":`Die Seeluft hat irgendwas mit mir gemacht.`,"open.moss.0":`Sag der Gilde nicht, dass ich hier war, Kindchen.`,"open.moss.1":`Meine Kräuter helfen hier nicht. Helfen deine?`,"open.reggie.0":`Holla, Brauer! Ein Ritter in Not!`,"open.reggie.1":`Sir Reginald verlangt ein Heilmittel. Sofort.`,"open.luna.0":`Hab einen Zauber an mir getestet. Fast alles gut!`,"open.luna.1":`Sag's nicht Pip, aber ich brauche eine Kur.`,"open.lyle.0":`♪ Ein Lied vom Leid, ein Trank, bitte ♪`,"open.lyle.1":`Mein Publikum ist geflohen. Hilf mir, Trankmeister!`,"open.ostra.0":`Die Karten sagten, du hilfst mir, Schätzchen.`,"open.ostra.1":`Das Rätsel des Tages, von den Karten für dich.`,"sym.calm.1.a":`Ich hatte ein bisschen zu viel Kaffee.`,"sym.calm.1.b":`Meine Hände zittern ein wenig.`,"sym.calm.2.a":`Ich kann nicht stillsitzen. Keine Sekunde!`,"sym.calm.2.b":`Mein Herz rast wie ein durchgegangenes Pferd!`,"sym.zest.1.a":`Ich bin heute ein bisschen müde.`,"sym.zest.1.b":`Ich gähne immer wieder ein wenig.`,"sym.zest.2.a":`Ich bin so müde, ich schlafe im Stehen ein!`,"sym.zest.2.b":`Alles ist so schwer, ich kann keinen Finger rühren!`,"sym.frost.1.a":`Mir ist ein wenig zu warm.`,"sym.frost.1.b":`Meine Wangen sind ein bisschen heiß.`,"sym.frost.2.a":`Ich glühe wie ein Backofen!`,"sym.frost.2.b":`Mir kommt Dampf aus den Ohren!`,"sym.warm.1.a":`Mir ist ein bisschen kühl.`,"sym.warm.1.b":`Meine Nase ist ein wenig kalt.`,"sym.warm.2.a":`Ich bin steif gefroren!`,"sym.warm.2.b":`Meine Zähne klappern ohne Ende!`,"sym.gloom.1.a":`Ich leuchte nachts ein wenig.`,"sym.gloom.1.b":`Alles ist ein bisschen zu hell.`,"sym.gloom.2.a":`Ich leuchte im Dunkeln wie eine Laterne!`,"sym.gloom.2.b":`Ich strahle so hell, dass keiner schlafen kann!`,"sym.glow.1.a":`Ich bin ein bisschen trübsinnig.`,"sym.glow.1.b":`Heute wirkt alles ein wenig grau.`,"sym.glow.2.a":`Eine dunkle Wolke folgt mir überallhin!`,"sym.glow.2.b":`So bedrückt, sogar mein Schatten ist weg!`,"chapters.arrival":`Der Bubbling Kettle`,"chapters.rival":`Der Mann mit dem hohen Hut`,"chapters.postcard":`Eine Postkarte vom Meer`,"chapters.apprentice":`Die Schülerin`,"chapters.photo":`Omas Notizbuch`,"chapters.truth":`Die grüne Flasche`,"chapters.eve":`Vorabend des Moonfair`,"chapters.moonfair":`Der Moonfair`,"story.arrival_1":`Im Laden wird es still. Auf der Theke öffnet ein schwarzer Kater ein Auge.`,"story.arrival_2":`Nicht schlecht für die erste Nacht. Wren meinte, du wärst langsam.`,"story.arrival_3":`Na? Sag was.`,"story.arrival_3_shock":`Ein sprechender Kater?!`,"story.arrival_3_shock_1":`Ein sprechender Kater, der die Kasse zählt. Ich bin Pip.`,"story.arrival_3_polite":`Danke… wer bist du?`,"story.arrival_3_polite_1":`Manieren! Ich bin Pip. Ich gehöre zum Laden.`,"story.arrival_4":`Wren ist überstürzt abgereist. Irgendwas mit dem Meer. Morgen, gleiche Zeit.`,"story.rival_1":`Die Türglocke bimmelt. Pip ist plötzlich unter der Theke.`,"story.rival_2":`Wrens Laden öffnet also noch. Vex, Großmeister der Alchemistengilde.`,"story.rival_3":`Die Gilde kauft dieses Häuschen. Fünfhundert Gold. Großzügig.`,"story.rival_3_refuse":`Nicht zu verkaufen.`,"story.rival_3_refuse_1":`Das sagte Wren auch. Dreißig Jahre lang.`,"story.rival_3_think":`Ich denk darüber nach.`,"story.rival_3_think_1":`Denk schnell. Das Angebot schrumpft.`,"story.rival_4":`Auf dem Moonfair gewinnt die Gilde das Große Brauen. Wie immer.`,"story.rival_5":`Gewinn den Moonfair, und keiner kann den Laden anrühren. Altes Gesetz. Wir brauchen Sterne: exakte Kuren.`,"story.postcard_1":`Eine Postkarte fällt durch den Türschlitz. Vorne glotzt eine Möwe.`,"story.postcard_2":`Liebes Sprösslein, das Meer ist herrlich. Füttere Pip zweimal am Tag, egal was er sagt.`,"story.postcard_3":`Halte ihn von der grünen Flasche im obersten Regal fern. Und verkauf nie an einen Mann mit hohem Hut.`,"story.postcard_3_bottle":`Was ist in der grünen Flasche?`,"story.postcard_3_bottle_1":`Nichts. Sie ist grün. Nächste Frage.`,"story.postcard_3_twice":`Zweimal am Tag, Pip.`,"story.postcard_3_twice_1":`Sie meinte dreimal. Die Seeluft ist ihr zu Kopf gestiegen.`,"story.apprentice_1":`PENG. Lila Rauch, dann ein Mädchen mit angesengtem Hut.`,"story.apprentice_2":`Sorry! Türglocken-Zauber. Ich bin Luna. Eine Hexe. Meistens.`,"story.apprentice_3":`Wren wollte mich unterrichten, dann war sie weg. Kann ich helfen? Ich fege. Meistens.`,"story.apprentice_3_welcome":`Willkommen an Bord!`,"story.apprentice_3_welcome_1":`Die Besen und ich lassen dich nicht hängen!`,"story.apprentice_3_later":`Übe weiter.`,"story.apprentice_3_later_1":`Okay. Ich bin auf dem Markt. Und winke.`,"story.apprentice_4":`Das spricht sich rum. Ein Barde und ein Ritter wollen auch Kuren.`,"story.photo_1":`Wrens Rezeptbuch gefunden. Hinter den eingelegten Molchen, natürlich.`,"story.photo_2":`Ein altes Foto rutscht heraus: Wren, ein Junge mit hohem Hut und ein junger Mann mit gelben Augen.`,"story.photo_2_ask":`Pip… wer ist der Dritte?`,"story.photo_2_ask_1":`Jemand, der sich falsch entschieden hat. Leg es zurück.`,"story.photo_2_back":`Zurücklegen.`,"story.photo_2_back_1":`Gut. Vernünftig.`,"story.photo_3":`Die Karten haben mich geschickt, Schätzchen. Und der Kater ist kein Kater. Weiß doch jeder.`,"story.photo_4":`Raus.`,"story.truth_1":`Spät. Der Kessel tickt beim Abkühlen. Pip sitzt neben der grünen Flasche.`,"story.truth_2":`Ich hieß Pippin Ashgrove. Vex und ich haben die Gilde gegründet. Beste Freunde.`,"story.truth_3":`In der Nacht vor einem Moonfair trank ich einen Verwandlungstrank. Er wirkte zu gut.`,"story.truth_4":`Wren nahm den Kater mit heim. Vex glaubt, ich bin mit unseren Rezepten abgehauen.`,"story.truth_5":`Die grüne Flasche ist das Gegenmittel. Sie braucht das Mondlicht des Moonfair.`,"story.truth_5_cure":`Dann bringen wir's zu Ende.`,"story.truth_5_cure_1":`…Das würdest du tun? Werd bloß nicht sentimental.`,"story.truth_5_family":`Kater oder nicht, du bist Familie.`,"story.truth_5_family_1":`…Katzenhaar im Auge. Meins.`,"story.eve_1":`Viel Glück morgen auf dem Moonfair, Schätzchen! Ich hab dir ein Brot gebacken. In Kesselform.`,"story.eve_2":`Duchess hat einen Gildenmann an deinem Karren erwischt. Sie hat seine Notizen gefressen.`,"story.eve_3":`Ich bewache den Kessel. Nichts wird explodieren. Wahrscheinlich.`,"story.eve_4":`Morgen bringt die Jury drei Rätsel. Exakte Kuren, perfektes Kochen. Was schenken wir aus?`,"story.eve_4_classic":`Wrens Sternenlicht-Tonikum.`,"story.eve_4_classic_1":`Bewährt. Wren wird ein Jahr lang damit angeben.`,"story.eve_4_ours":`Etwas Eigenes.`,"story.eve_4_ours_1":`Furchterregend. Wren würde es lieben.`,"story.moonfair_1":`Der Platz leuchtet voller Laternen. Die Jury kostet deine drei Kuren.`,"story.moonfair_2":`Das Elixier Suprême der Gilde. Siebenundvierzig Zutaten. Blattgold.`,"story.moonfair_3":`Schmeckt wie eine Münze.`,"story.moonfair_4":`Wrens Sternenlicht-Tonikum leuchtet in den Bechern. Am Meer lächelt eine alte Frau.`,"story.moonfair_5":`Dein eigenes Gebräu prickelt wie der erste warme Frühlingstag.`,"story.moonfair_6":`Der Sieger des Großen Brauens… der Bubbling Kettle!`,"story.moonfair_7":`Unmöglich! Dieser Laden hat mir alles genommen. Er nahm mir meinen—`,"story.moonfair_8":`Mondlicht trifft die grüne Flasche. Pip trinkt. Ein großer Mann mit gelben Augen steht auf der Theke.`,"story.moonfair_9":`Hallo, Vex. Ich war ein Idiot. Es tut mir so leid.`,"story.moonfair_10":`Hallo, Vex. Ich war ein Idiot. Es tut mir so leid.`,"story.moonfair_11":`…Pippin? Du warst die ganze Zeit hier?`,"story.moonfair_12":`Dreißig Jahre wütend auf einen Laden. Das sind viele Jahre.`,"story.moonfair_12_seat":`Im Kettle ist ein Platz frei.`,"story.moonfair_12_seat_1":`…Ich bring Kekse mit. Gildenkekse.`,"story.moonfair_12_goat":`Entschuldige dich erst bei der Ziege.`,"story.moonfair_12_goat_1":`Na gut. Eine Entschuldigung. Bei einer Ziege.`,"story.moonfair_13":`Hab gehört, ihr habt gewonnen. Komme heim zum Tee. Sag Pip, ich bin stolz auf ihn. Alles Liebe, Oma.`},ru:{tagline:`Уютная лавка зелий в ночи. Лечите то, на что жалуются.`,startNight:`Начать ночь`,continue:`Продолжить`,daily:`Средство дня`,dailyDone:`Средство дня: готово`,dailyTitle:`Средство дня`,dailyDoneText:`Сегодняшняя загадка решена. Новая будет завтра. Вылеченных дней: {n}`,dailyReward:`+{n} золота за средство дня!`,shop:`Лавка`,notebook:`Блокнот`,settings:`Настройки`,ingredients:`Ингредиенты`,nightN:`Ночь {n}`,nightClosed:`Ночь {n}: лавка закрыта`,fairTitle:`Ярмарка Moonfair`,fairAgain:`Судьям нужно хотя бы два точных лекарства. Ярмарка Moonfair продолжится завтра ночью!`,goldEarned:`золото`,exactCures:`точно вылечено: {n}/{total}`,double:`Реклама: +{n} золота (×2)`,chapterWaits:`Ждёт новая глава: {title}`,nextChapter:{one:`Ещё {n} звезда до следующей главы`,few:`Ещё {n} звезды до следующей главы`,many:`Ещё {n} звёзд до следующей главы`,other:`Ещё {n} звезды до следующей главы`},nextNight:`Следующая ночь`,chapter:`Глава {n}: {title}`,stuck:`Застряли?`,stuckTitle:`Застряли?`,stuckText:`Каждая жалоба требует одной эссенции — противоположной беде. Сильные слова значат две. Или Pip подскажет средство для этого гостя.`,askPip:`Реклама: Pip назовёт средство`,askPipRetry:`Реклама: Pip назовёт средство, ещё попытка`,oopsTitle:`Не то средство!`,oopsText:`{name} хмуро смотрит в чашку. Pip может назвать верное средство, и вы сварите заново, пока не поздно.`,oopsTextNoAd:`{name} хмурится над чашкой. Перечитайте слова: каждое просит одну эссенцию.`,l ym.warm.1.a":`Мне немного зябко.`,"sym.warm.1.b":`Нос слегка замёрз.`,"sym.warm.2.a":`Мороз до самых костей!`,"sym.warm.2.b":`Зубы стучат без остановки!`,"sym.gloom.1.a":`Ночью я слегка свечусь.`,"sym.gloom.1.b":`Всё вокруг чуть ярковато.`,"sym.gloom.2.a":`Свечусь в темноте, как фонарь!`,"sym.gloom.2.b":`Сияю так ярко, что никто не может уснуть!`,"sym.glow.1.a":`Мне немного тоскливо.`,"sym.glow.1.b":`Сегодня всё какое-то сероватое.`,"sym.glow.2.a":`За мной повсюду ходит чёрная туча!`,"sym.glow.2.b":`Такая тоска, что даже тень от меня ушла!`,"chapters.arrival":`«Bubbling Kettle»`,"chapters.rival":`Человек в высокой шляпе`,"chapters.postcard":`Открытка с моря`,"chapters.apprentice":`Ученица`,"chapters.photo":`Бабушкина тетрадь`,"chapters.truth":`Зелёная бутылка`,"chapters.eve":`Канун Moonfair`,"chapters.moonfair":`Ярмарка Moonfair`,"story.arrival_1":`В лавке становится тихо. На прилавке чёрный кот открывает один глаз.`,"story.arrival_2":`Неплохо для первой ночи. Wren говорила, что ты будешь копушей.`,"story.arrival_3":`Ну? Скажи что-нибудь.`,"story.arrival_3_shock":`Говорящий кот?!`,"story.arrival_3_shock_1":`Говорящий кот, который считает выручку. Я Pip.`,"story.arrival_3_polite":`Спасибо… а ты кто?`,"story.arrival_3_polite_1":`Какие манеры! Я Pip. Я прилагаюсь к лавке.`,"story.arrival_4":`Wren уехала в спешке. Что-то насчёт моря. Завтра в то же время.`,"story.rival_1":`Звякает дверной колокольчик. Pip вдруг оказывается под прилавком.`,"story.rival_2":`Значит, лавка Wren ещё работает. Vex, великий магистр Гильдии алхимиков.`,"story.rival_3":`Гильдия купит этот домик. Пятьсот золотых. Щедро.`,"story.rival_3_refuse":`Не продаётся.`,"story.rival_3_refuse_1":`Wren тоже так говорила. Тридцать лет подряд.`,"story.rival_3_think":`Я подумаю.`,"story.rival_3_think_1":`Думайте быстрее. Предложение тает.`,"story.rival_4":`На Moonfair Гильдия выиграет Великую варку. Как всегда.`,"story.rival_5":`Выиграем Moonfair — и лавку никто не тронет. Старый закон. Нужны звёзды: точные средства.`,"story.postcard_1":`В щель двери падает открытка. С картинки сердито глядит чайка.`,"story.postcard_2":`Росточек мой, на море чудесно. Корми Pip дважды в день, что бы он ни говорил.`,"story.postcard_3":`Не подпускай его к зелёной бутылке на верхней полке. И ничего не продавай человеку в высокой шляпе.`,"story.postcard_3_bottle":`Что в зелёной бутылке?`,"story.postcard_3_bottle_1":`Ничего. Она зелёная. Следующий вопрос.`,"story.postcard_3_twice":`Дважды в день, Pip.`,"story.postcard_3_twice_1":`Она имела в виду трижды. Морской воздух ударил ей в голову.`,"story.apprentice_1":`БАХ. Лиловый дым, а в нём девушка в подпалённой шляпе.`,"story.apprentice_2":`Простите! Заклинание для звонка. Я Luna. Ведьма. В основном.`,"story.apprentice_3":`Wren обещала меня учить, а потом уехала. Можно помогать? Я подметаю. В основном.`,"story.apprentice_3_welcome":`Добро пожаловать в команду!`,"story.apprentice_3_welcome_1":`Мы с мётлами не подведём!`,"story.apprentice_3_later":`Тренируйся ещё.`,"story.apprentice_3_later_1":`Ладно. Буду на рынке. Махать рукой.`,"story.apprentice_4":`Слухи расходятся. Бард и рыцарь тоже хотят лечиться.`,"story.photo_1":`Нашёл книгу рецептов Wren. За маринованными тритонами, конечно.`,"story.photo_2":`Выпадает старое фото: Wren, мальчик в высокой шляпе и юноша с жёлтыми глазами.`,"story.photo_2_ask":`Pip… а кто третий?`,"story.photo_2_ask_1":`Тот, кто принял плохое решение. Положи на место.`,"story.photo_2_back":`Положить на место.`,"story.photo_2_back_1":`Хорошо. Разумно.`,"story.photo_3":`Меня послали карты, дорогуша. А кот вовсе не кот. Это все знают.`,"story.photo_4":`Вон.`,"story.truth_1":`Поздно. Остывая, котёл тикает. Pip сидит у зелёной бутылки.`,"story.truth_2":`Меня звали Pippin Ashgrove. Мы с Vex основали Гильдию. Лучшие друзья.`,"story.truth_3":`В ночь перед Moonfair я выпил зелье превращения. Оно сработало слишком хорошо.`,"story.truth_4":`Wren забрала кота домой. Vex думает, что я сбежал с нашими рецептами.`,"story.truth_5":`В зелёной бутылке — лекарство. Ему нужен лунный свет Moonfair.`,"story.truth_5_cure":`Тогда давай закончим.`,"story.truth_5_cure_1":`…Ты правда это сделаешь? Только без нежностей.`,"story.truth_5_family":`Кот или нет, ты — семья.`,"story.truth_5_family_1":`…Шерсть в глаз попала. Моя.`,"story.eve_1":`Удачи завтра на Moonfair, дорогуша! Я испекла вам каравай. В форме котла.`,"story.eve_2":`Duchess поймала человека из Гильдии у вашей тележки. И съела его записи.`,"story.eve_3":`Я посторожу котёл. Ничего не взорвётся. Наверное.`,"story.eve_4":`Завтра судьи принесут три загадки. Точные средства, идеальная варка. Что будем разливать?`,"story.eve_4_classic":`Звёздный тоник Wren.`,"story.eve_4_classic_1":`Проверено. Wren будет задаваться целый год.`,"story.eve_4_ours":`Что-то своё.`,"story.eve_4_ours_1":`Жуть. Wren бы понравилось.`,"story.moonfair_1":`Площадь сияет фонарями. Судьи пробуют ваши три средства.`,"story.moonfair_2":`Эликсир Превосходный от Гильдии. Сорок семь ингредиентов. Сусальное золото.`,"story.moonfair_3":`На вкус как монета.`,"story.moonfair_4":`Звёздный тоник Wren сияет в чашах. У моря улыбается старушка.`,"story.moonfair_5":`Ваше собственное зелье искрится, как первый тёплый весенний день.`,"story.moonfair_6":`Победитель Великой варки… «Bubbling Kettle»!`,"story.moonfair_7":`Невозможно! Эта лавка отняла у меня всё. Она отняла моего—`,"story.moonfair_8":`Лунный свет падает на зелёную бутылку. Pip пьёт. На прилавке стоит высокий мужчина с жёлтыми глазами.`,"story.moonfair_9":`Здравствуй, Vex. Я был идиотом. Прости меня.`,"story.moonfair_10":`Здравствуй, Vex. Я был идиотом. Прости меня.`,"story.moonfair_11":`…Pippin? Ты всё это время был здесь?`,"story.moonfair_12":`Тридцать лет злиться на лавку. Это очень много лет.`,"story.moonfair_12_seat":`В нашей лавке есть место и для вас.`,"story.moonfair_12_seat_1":`…Принесу печенье. Гильдейское.`,"story.moonfair_12_goat":`Для начала извинитесь перед козой.`,"story.moonfair_12_goat_1":`Ладно. Одно извинение. Козе.`,"story.moo ım bir iksire ihtiyacım var diyor.`,"open.bea.0":`Çabuk, ekmek yanmadan! Benim.`,"open.bea.1":`Size turta yapardım canım, ama halime bakın.`,"open.finn.0":`Bütün gün hiçbir şey tutamadım. Onun yerine bunu kaptım.`,"open.finn.1":`Deniz havası bana bir şey yaptı.`,"open.moss.0":`Loncaya buraya geldiğimi söylemeyin, yavrum.`,"open.moss.1":`Benim otlarım buna çare olmuyor. Sizinkiler olur mu?`,"open.reggie.0":`Dükkâncı! Başı dertte bir şövalye var!`,"open.reggie.1":`Sir Reginald bir çare talep ediyor. Acilen.`,"open.luna.0":`Kendime bir büyü denedim. Çoğunlukla iyiyim!`,"open.luna.1":`Pip'e söylemeyin ama bir ilaca ihtiyacım var.`,"open.lyle.0":`♪ Bir dert şarkısı, bir iksir lütfen ♪`,"open.lyle.1":`Dinleyicilerim kaçtı. Yardım edin, iksirci!`,"open.ostra.0":`Kartlar bana yardım edeceğinizi söyledi, şekerim.`,"open.ostra.1":`Günün bilmecesi, kartlardan size.`,"sym.calm.1.a":`Biraz fazla kahve içtim.`,"sym.calm.1.b":`Ellerim biraz titriyor.`,"sym.calm.2.a":`Yerimde duramıyorum. Bir saniye bile!`,"sym.calm.2.b":`Kalbim kaçak bir at gibi dörtnala koşuyor!`,"sym.zest.1.a":`Bugün biraz uykuluyum.`,"sym.zest.1.b":`Durmadan biraz esniyorum.`,"sym.zest.2.a":`O kadar yorgunum ki ayakta uyuyakaldım!`,"sym.zest.2.b":`Her şey o kadar ağır ki parmağımı kıpırdatamıyorum!`,"sym.frost.1.a":`Biraz fazla sıcakladım.`,"sym.frost.1.b":`Yanaklarım biraz sıcak.`,"sym.frost.2.a":`Fırın gibi yanıyorum!`,"sym.frost.2.b":`Kulaklarımdan buhar çıkıyor!`,"sym.warm.1.a":`Biraz üşüyorum.`,"sym.warm.1.b":`Burnum biraz soğuk.`,"sym.warm.2.a":`Buz kesildim!`,"sym.warm.2.b":`Dişlerim durmadan takırdıyor!`,"sym.gloom.1.a":`Geceleri biraz parlıyorum.`,"sym.gloom.1.b":`Her şey biraz fazla parlak.`,"sym.gloom.2.a":`Karanlıkta fener gibi parlıyorum!`,"sym.gloom.2.b":`O kadar parlıyorum ki kimse uyuyamıyor!`,"sym.glow.1.a":`Biraz kasvetli hissediyorum.`,"sym.glow.1.b":`Bugün her şey biraz gri görünüyor.`,"sym.glow.2.a":`Kara bir bulut her yerde peşimde!`,"sym.glow.2.b":`O kadar kederliyim ki gölgem bile gitti!`,"chapters.arrival":`Bubbling Kettle`,"chapters.rival":`Uzun Şapkalı Adam`,"chapters.postcard":`Denizden Bir Kartpostal`,"chapters.apprentice":`Çırak`,"chapters.photo":`Büyükannenin Defteri`,"chapters.truth":`Yeşil Şişe`,"chapters.eve":`Moonfair Arifesi`,"chapters.moonfair":`Moonfair`,"story.arrival_1":`Dükkân sessizleşiyor. Tezgâhta siyah bir kedi tek gözünü açıyor.`,"story.arrival_2":`İlk gece için fena değil. Wren yavaş olacağını söylemişti.`,"story.arrival_3":`Eee? Bir şey söyle.`,"story.arrival_3_shock":`Konuşan bir kedi mi?!`,"story.arrival_3_shock_1":`Kasayı sayan, konuşan bir kedi. Ben Pip.`,"story.arrival_3_polite":`Teşekkürler… sen kimsin?`,"story.arrival_3_polite_1":`Ne terbiyeli! Ben Pip. Dükkânla birlikte geldim.`,"story.arrival_4":`Wren aceleyle gitti. Denizle ilgili bir şey. Yarın aynı saatte.`,"story.rival_1":`Kapı zili şıngırdıyor. Pip bir anda tezgâhın altında.`,"story.rival_2":`Demek Wren'in dükkânı hâlâ açılıyor. Vex, Simyacılar Loncası'nın Büyük Üstadı.`,"story.rival_3":`Lonca bu kulübeyi satın alacak. Beş yüz altın. Cömert bir teklif.`,"story.rival_3_refuse":`Satılık değil.`,"story.rival_3_refuse_1":`Wren de öyle derdi. Otuz yıl boyunca.`,"story.rival_3_think":`Düşüneceğim.`,"story.rival_3_think_1":`Çabuk düşünün. Teklif küçülüyor.`,"story.rival_4":`Moonfair'de Büyük Demleme'yi Lonca kazanır. Her zamanki gibi.`,"story.rival_5":`Moonfair'i kazanırsak dükkâna kimse dokunamaz. Eski yasa. Yıldız lazım: tam tedaviler.`,"story.postcard_1":`Kapının altından bir kartpostal düşüyor. Önündeki martı ters ters bakıyor.`,"story.postcard_2":`Sevgili fidanım, deniz harika. Pip'i günde iki kez besle, ne derse desin.`,"story.postcard_3":`Onu en üst raftaki yeşil şişeden uzak tut. Ve uzun şapkalı bir adama asla bir şey satma.`,"story.postcard_3_bottle":`Yeşil şişede ne var?`,"story.postcard_3_bottle_1":`Hiçbir şey. Yeşil işte. Sonraki soru.`,"story.postcard_3_twice":`Günde iki kez, Pip.`,"story.postcard_3_twice_1":`Üç kez demek istedi. Deniz havası ona dokunmuş.`,"story.apprentice_1":`GÜM. Mor bir duman, ardından şapkası alazlanmış bir kız.`,"story.apprentice_2":`Pardon! Kapı zili büyüsü. Ben Luna. Bir cadı. Çoğunlukla.`,"story.apprentice_3":`Wren bana ders vereceğine söz verdi, sonra gitti. Yardım edebilir miyim? Süpürürüm. Çoğunlukla.`,"story.apprentice_3_welcome":`Aramıza hoş geldin!`,"story.apprentice_3_welcome_1":`Süpürgeler ve ben seni yarı yolda bırakmayız!`,"story.apprentice_3_later":`Çalışmaya devam et.`,"story.apprentice_3_later_1":`Tamam. Pazarda olurum. El sallarım.`,"story.apprentice_4":`Ağızdan ağıza yayılıyor. Bir ozan ve bir şövalye de ilaç istiyor.`,"story.photo_1":`Wren'in tarif kitabını buldum. Turşu semenderlerin arkasında, tabii ki.`,"story.photo_2":`Eski bir fotoğraf kayıyor: Wren, uzun şapkalı bir oğlan ve sarı gözlü genç bir adam.`,"story.photo_2_ask":`Pip… üçüncüsü kim?`,"story.photo_2_ask_1":`Kötü bir karar veren biri. Yerine koy.`,"story.photo_2_back":`Yerine koyayım.`,"story.photo_2_back_1":`Güzel. Akıllıca.`,"story.photo_3":`Beni kartlar gönderdi, şekerim. Hem bu kedi kedi değil. Herkes bilir.`,"story.photo_4":`Dışarı.`,"story.truth_1":`Geç oldu. Kazan soğurken tıkırdıyor. Pip yeşil şişenin yanında oturuyor.`,"story.truth_2":`Adım Pippin Ashgrove'du. Loncayı Vex'le birlikte kurduk. En iyi arkadaştık.`,"story.truth_3":`Bir Moonfair'den önceki gece biçim değiştirme iksiri içtim. Fazla iyi işe yaradı.`,"story.truth_4":`Wren kediyi eve götürdü. Vex, tariflerimizle kaçtığımı sanıyor.`,"story.truth_5":`Yeşil şişe, tedavinin ta kendisi. Moonfair'in ay ışığı gerekiyor.`,"story.truth_5_cure":`O hâlde bitirelim.`,"story.truth_5_cure_1":`…Bunu yapar mıydın? Sakın duygusallaşma.`,"story.truth_5_family":`Kedi ya da değil, sen ailedensin.`,"story.truth_5_family_1":`…Gözüme kedi tüyü kaçtı. Benim.`,"story.eve_1":`Yarın Moonfair'de bol şans, canım! Size bir somun pişirdim. Kazan şeklinde.`,"story.eve_2":`Duchess arabanızın yanında bir Lonca adamı yakaladı. Notlarını yedi.`,"story.eve_3":`Kazanı ben korurum. Hiçbir şey patlamayacak. Herhalde.`,"story.eve_4":`Yarın jüri üç bilmece getiriyor. Tam tedaviler, kusursuz kaynatmalar. Ne dolduralım?`,"story.eve_4_classic":`Wren'in Yıldız Işığı Toniği.`,"story.eve_4_classic_1":`Denenmiş. Wren bir yıl boyunca böbürlenir.`,"story.eve_4_ours":`Kendimize ait bir şey.`,"story.eve_4_ours_1":`Ürkütücü. Wren bayılırdı.`,"story.moonfair_1":`Meydan fenerlerle parlıyor. Jüri üç ilacınızın tadına bakıyor.`,"story.moonfair_2":`Lonca'nın Yüce İksiri. Kırk yedi malzeme. Altın varak.`,"story.moonfair_3":`Madeni para gibi tadı var.`,"story.moonfair_4":`Wren'in Yıldız Işığı Toniği fincanlarda parlıyor. Deniz kenarında yaşlı bir kadın gülümsüyor.`,"story.moonfair_5":`Kendi iksiriniz baharın ilk ılık günü gibi köpürüyor.`,"story.moonfair_6":`Büyük Demleme'nin kazananı… Bubbling Kettle!`,"story.moonfair_7":`İmkânsız! O dükkân her şeyimi aldı. Benim—`,"story.moonfair_8":`Ay ışığı yeşil şişeye vuruyor. Pip içiyor. Tezgâhta sarı gözlü, uzun boylu bir adam duruyor.`,"story.moonfair_9":`Merhaba Vex. Aptallık ettim. Çok özür dilerim.`,"story.moonfair_10":`Merhaba Vex. Aptallık ettim. Çok özür dilerim.`,"story.moonfair_11":`…Pippin? Baştan beri burada mıydın?`,"story.moonfair_12":`Bir dükkâna otuz yıl kızgınlık. Bu çok uzun bir süre.`,"story.moonfair_12_seat":`Kettle'da size de yer var.`,"story.moonfair_12_seat_1":`…Kurabiye getiririm. Lonca kurabiyesi.`,"story.moonfair_12_goat":`Önce keçiden özür dileyin.`,"story.moonfair_12_goat_1":`Peki. Bir özür. Bir keçiye.`,"story.moonfair_13":`Kazandığınızı duydum. Çaya eve geliyorum. Pip'e onunla gurur duyduğumu söyle. Sevgiler, Büyükannen.`},it:{tagline:`Una bottega di pozioni accogliente, di notte. Cura ciò di cui si lamentano.`,startNight:`Inizia la notte`,continue:`Continua`,daily:`Rimedio del giorno`,dailyDone:`Rimedio del giorno: curato`,dailyTitle:`Rimedio del giorno`,dailyDoneText:`L'enigma di oggi è curato. Domani ne arriva uno nuovo. Giorni curati: {n}`,dailyReward:`+{n} oro per il rimedio di oggi!`,shop:`
