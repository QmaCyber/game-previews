o ho preso questo.`,"open.finn.1":`L'aria di mare mi ha fatto qualcosa.`,"open.moss.0":`Non dire alla Gilda che sono venuta qui, tesoro.`,"open.moss.1":`Le mie erbe non bastano stavolta. Le tue sì?`,"open.reggie.0":`Speziale! Un cavaliere in difficoltà!`,"open.reggie.1":`Sir Reginald esige un rimedio. Con urgenza.`,"open.luna.0":`Ho provato un incantesimo su di me. Quasi tutto a posto!`,"open.luna.1":`Non dirlo a Pip, ma mi serve una cura.`,"open.lyle.0":`♪ Un canto di dolor, una pozion per favor ♪`,"open.lyle.1":`Il pubblico è fuggito. Aiutami, pozionista!`,"open.ostra.0":`Le carte dicevano che mi avresti aiutata, tesoro.`,"open.ostra.1":`L'enigma di oggi, dalle carte a te.`,"sym.calm.1.a":`Ho bevuto un po' troppo caffè.`,"sym.calm.1.b":`Mi tremano un po' le mani.`,"sym.calm.2.a":`Non trovo pace. Nemmeno per un secondo!`,"sym.calm.2.b":`Il cuore mi galoppa come un cavallo imbizzarrito!`,"sym.zest.1.a":`Oggi ho un po' di sonno.`,"sym.zest.1.b":`Continuo a sbadigliare un pochino.`,"sym.zest.2.a":`Ho così sonno che dormo in piedi!`,"sym.zest.2.b":`Tutto è così pesante, non alzo nemmeno un dito!`,"sym.frost.1.a":`Ho un po' troppo caldo.`,"sym.frost.1.b":`Ho le guance un po' calde.`,"sym.frost.2.a":`Brucio come un forno!`,"sym.frost.2.b":`Mi esce il vapore dalle orecchie!`,"sym.warm.1.a":`Ho un po' di freddo.`,"sym.warm.1.b":`Ho il naso un po' freddo.`,"sym.warm.2.a":`Sono un ghiacciolo!`,"sym.warm.2.b":`Non smetto di battere i denti!`,"sym.gloom.1.a":`Di notte brillo un pochino.`,"sym.gloom.1.b":`È tutto un po' troppo luminoso.`,"sym.gloom.2.a":`Brillo al buio come una lanterna!`,"sym.gloom.2.b":`Splendo così tanto che nessuno riesce a dormire!`,"sym.glow.1.a":`Mi sento un po' giù.`,"sym.glow.1.b":`Oggi è tutto un po' grigio.`,"sym.glow.2.a":`Una nuvola nera mi segue ovunque!`,"sym.glow.2.b":`Che tristezza nera! Perfino la mia ombra se n'è andata!`,"chapters.arrival":`The Bubbling Kettle`,"chapters.rival":`L'uomo col cilindro`,"chapters.postcard":`Una cartolina dal mare`,"chapters.apprentice":`L'apprendista`,"chapters.photo":`Il taccuino della nonna`,"chapters.truth":`La bottiglia verde`,"chapters.eve":`La vigilia della Moonfair`,"chapters.moonfair":`La Moonfair`,"story.arrival_1":`La bottega si fa silenziosa. Sul bancone, un gatto nero apre un occhio.`,"story.arrival_2":`Niente male per una prima notte. Wren diceva che ci avresti messo una vita.`,"story.arrival_3":`Allora? Di' qualcosa.`,"story.arrival_3_shock":`Un gatto parlante?!`,"story.arrival_3_shock_1":`Un gatto parlante che conta l'incasso. Sono Pip.`,"story.arrival_3_polite":`Grazie… e tu chi sei?`,"story.arrival_3_polite_1":`Che educazione! Sono Pip. Vengo con la bottega.`,"story.arrival_4":`Wren è partita di corsa. Qualcosa a che fare col mare. Domani, stessa ora.`,"story.rival_1":`Il campanello tintinna. All'improvviso Pip è sotto il bancone.`,"story.rival_2":`Dunque la bottega di Wren apre ancora. Vex, Gran Maestro della Gilda degli Alchimisti.`,"story.rival_3":`La Gilda comprerà questa casetta. Cinquecento monete d'oro. Generoso.`,"story.rival_3_refuse":`Non è in vendita.`,"story.rival_3_refuse_1":`Lo diceva anche Wren. Per trent'anni.`,"story.rival_3_think":`Ci penserò.`,"story.rival_3_think_1":`Pensaci in fretta. L'offerta cala.`,"story.rival_4":`Alla Moonfair, la Gilda vince il Grande Infuso. Come sempre.`,"story.rival_5":`Vinci la Moonfair e nessuno potrà toccare la bottega. Antica legge. Ci servono stelle: cure esatte.`,"story.postcard_1":`Una cartolina scivola sotto la porta. Sul fronte, un gabbiano ti fissa torvo.`,"story.postcard_2":`Germoglio mio, il mare è stupendo. Dai da mangiare a Pip due volte al giorno, qualunque cosa dica.`,"story.postcard_3":`Tienilo lontano dalla bottiglia verde sull'ultimo scaffale. E non vendere mai a un uomo col cilindro.`,"story.postcard_3_bottle":`Cosa c'è nella bottiglia verde?`,"story.postcard_3_bottle_1":`Niente. È verde. Prossima domanda.`,"story.postcard_3_twice":`Due volte al giorno, Pip.`,"story.postcard_3_twice_1":`Intendeva tre. L'aria di mare le ha dato alla testa.`,"story.apprentice_1":`BANG. Fumo viola, poi una ragazza con un cappello bruciacchiato.`,"story.apprentice_2":`Scusa! Incantesimo del campanello. Sono Luna. Una strega. Più o meno.`,"story.apprentice_3":`Wren aveva promesso di insegnarmi, poi è partita. Posso aiutare? So spazzare. Più o meno.`,"story.apprentice_3_welcome":`Benvenuta a bordo!`,"story.apprentice_3_welcome_1":`Io e le scope non ti deluderemo!`,"story.apprentice_3_later":`Continua a esercitarti.`,"story.apprentice_3_later_1":`Va bene. Sarò al mercato. A salutarti con la mano.`,"story.apprentice_4":`La voce gira. Anche un bardo e un cavaliere vogliono cure.`,"story.photo_1":`Ho trovato il ricettario di Wren. Dietro i tritoni sottaceto, ovvio.`,"story.photo_2":`Scivola fuori una vecchia foto: Wren, un ragazzo col cilindro e un giovane dagli occhi gialli.`,"story.photo_2_ask":`Pip… chi è il terzo?`,"story.photo_2_ask_1":`Uno che ha preso una pessima decisione. Rimettila a posto.`,"story.photo_2_back":`Rimettila a posto.`,"story.photo_2_back_1":`Bene. Saggia scelta.`,"story.photo_3":`Mi hanno mandata le carte, tesoro. E il gatto non è un gatto. Lo sanno tutti.`,"story.photo_4":`Fuori.`,"story.truth_1":`È tardi. Il calderone ticchetta mentre si raffredda. Pip siede accanto alla bottiglia verde.`,"story.truth_2":`Mi chiamavo Pippin Ashgrove. Io e Vex abbiamo fondato la Gilda. Migliori amici.`,"story.truth_3":`La notte prima di una Moonfair ho bevuto una pozione mutaforma. Ha funzionato fin troppo bene.`,"story.truth_4":`Wren ha portato a casa il gatto. Vex crede che io sia scappato con le nostre ricette.`,"story.truth_5":`La bottiglia verde è la cura. Le serve il chiaro di luna della Moonfair.`,"story.truth_5_cure":`Allora completiamola.`,"story.truth_5_cure_1":`…Lo faresti davvero? Niente sentimentalismi.`,"story.truth_5_family":`Gatto o no, sei di famiglia.`,"story.truth_5_family_1":`…Un pelo di gatto nell'occhio. Mio.`,"story.eve_1":`In bocca al lupo per la Moonfair di domani, tesoro! Ti ho sfornato una pagnotta. A forma di calderone.`,"story.eve_2":`Duchess ha beccato un uomo della Gilda vicino al tuo carretto. Si è mangiata i suoi appunti.`,"story.eve_3":`Farò la guardia al calderone. Non esploderà niente. Probabilmente.`,"story.eve_4":`Domani i giudici portano tre enigmi. Cure esatte, bolliture perfette. Cosa versiamo?`,"story.eve_4_classic":`Il Tonico Stellare di Wren.`,"story.eve_4_classic_1":`Collaudato. Wren se ne vanterà per un anno.`,"story.eve_4_ours":`Qualcosa di nostro.`,"story.eve_4_ours_1":`Terrificante. A Wren piacerebbe un sacco.`,"story.moonfair_1":`La piazza brilla di lanterne. I giudici assaggiano le tue tre cure.`,"story.moonfair_2":`L'Elisir Supremo della Gilda. Quarantasette ingredienti. Foglia d'oro.`,"story.moonfair_3":`Sa di moneta.`,"story.moonfair_4":`Il Tonico Stellare di Wren brilla nelle tazze. In riva al mare, un'anziana signora sorride.`,"story.moonfair_5":`Il tuo infuso frizza come il primo giorno tiepido di primavera.`,"story.moonfair_6":`Il vincitore del Grande Infuso… il Bubbling Kettle!`,"story.moonfair_7":`Impossibile! Quella bottega mi ha tolto tutto. Mi ha tolto il mio—`,"story.moonfair_8":`La luce della luna colpisce la bottiglia verde. Pip beve. Sul bancone c'è un uomo alto dagli occhi gialli.`,"story.moonfair_9":`Ciao, Vex. Sono stato un idiota. Mi dispiace tanto.`,"story.moonfair_10":`Ciao, Vex. Sono stato un idiota. Mi dispiace tanto.`,"story.moonfair_11":`…Pippin? Sei stato qui per tutto il tempo?`,"story.moonfair_12":`Trent'anni arrabbiato con una bottega. Sono tanti anni.`,"story.moonfair_12_seat":`C'è un posto per te al Kettle.`,"story.moonfair_12_seat_1":`…Porterò i biscotti. Biscotti della Gilda.`,"story.moonfair_12_goat":`Inizia chiedendo scusa alla capra.`,"story.moonfair_12_goat_1":`D'accordo. Una scusa. A una capra.`,"story.moonfair_13":`Ho saputo che hai vinto. Torno a casa per il tè. Di' a Pip che sono fiera di lui. Con affetto, la nonna.`},pl:{tagline:`Przytuln ,"who.ostra":`Madame Ostra`,"open.tom.0":`Dobry wieczór. To znowu ja i znowu moja koza.`,"open.tom.1":`Nie śmiej się. Żona mówi, że potrzebuję mikstury.`,"open.bea.0":`Szybko, zanim chleb się przypali! To ja.`,"open.bea.1":`Upiekłabym ci placek, kochanie, ale spójrz na mnie.`,"open.finn.0":`Cały dzień nic nie złowiłem. Za to złapałem to.`,"open.finn.1":`Morskie powietrze coś mi zrobiło.`,"open.moss.0":`Nie mów Gildii, że tu przyszłam, złotko.`,"open.moss.1":`Moje zioła tu nie pomogą. A twoje?`,"open.reggie.0":`Ratunku! Rycerz w potrzebie!`,"open.reggie.1":`Sir Reginald żąda lekarstwa. Pilnie.`,"open.luna.0":`Rzuciłam zaklęcie na siebie. Prawie w porządku!`,"open.luna.1":`Nie mów Pipowi, ale potrzebuję leku.`,"open.lyle.0":`♪ Smutna to pieśń, miksturkę mi daj ♪`,"open.lyle.1":`Publiczność uciekła. Pomóż mi, proszę!`,"open.ostra.0":`Karty mówiły, że mi pomożesz, kochanie.`,"open.ostra.1":`Dzisiejsza zagadka, prosto z kart.`,"sym.calm.1.a":`Chyba trochę przesadzam z kawą.`,"sym.calm.1.b":`Trochę drżą mi ręce.`,"sym.calm.2.a":`Nie mogę usiedzieć. Ani sekundy!`,"sym.calm.2.b":`Serce galopuje mi jak spłoszony koń!`,"sym.zest.1.a":`Trochę chce mi się dziś spać.`,"sym.zest.1.b":`Ciągle trochę ziewam.`,"sym.zest.2.a":`Tak mi się chce spać, że zasypiam na stojąco!`,"sym.zest.2.b":`Wszystko jest takie ciężkie, nie mogę ruszyć palcem!`,"sym.frost.1.a":`Jest mi trochę za ciepło.`,"sym.frost.1.b":`Trochę pieką mnie policzki.`,"sym.frost.2.a":`Płonę jak piec!`,"sym.frost.2.b":`Z uszu bucha mi para!`,"sym.warm.1.a":`Jest mi trochę chłodno.`,"sym.warm.1.b":`Nos mam trochę zimny.`,"sym.warm.2.a":`Zamarzam na kość!`,"sym.warm.2.b":`Zęby szczękają mi bez przerwy!`,"sym.gloom.1.a":`Nocą trochę świecę.`,"sym.gloom.1.b":`Wszystko jest trochę za jasne.`,"sym.gloom.2.a":`Świecę w ciemności jak latarnia!`,"sym.gloom.2.b":`Świecę tak jasno, że nikt nie może spać!`,"sym.glow.1.a":`Jest mi trochę smutno.`,"sym.glow.1.b":`Wszystko jest dziś trochę szare.`,"sym.glow.2.a":`Wszędzie chodzi za mną czarna chmura!`,"sym.glow.2.b":`Tak mi ponuro, że nawet cień ode mnie uciekł!`,"chapters.arrival":`The Bubbling Kettle`,"chapters.rival":`Mężczyzna w cylindrze`,"chapters.postcard":`Pocztówka znad morza`,"chapters.apprentice":`Uczennica`,"chapters.photo":`Notatnik babci`,"chapters.truth":`Zielona butelka`,"chapters.eve":`W przededniu Moonfair`,"chapters.moonfair":`Moonfair`,"story.arrival_1":`W sklepie zapada cisza. Na ladzie czarny kot otwiera jedno oko.`,"story.arrival_2":`Nieźle jak na pierwszą noc. Wren mówiła, że będzie ci szło wolno.`,"story.arrival_3":`No i? Powiedz coś.`,"story.arrival_3_shock":`Gadający kot?!`,"story.arrival_3_shock_1":`Gadający kot, który liczy utarg. Jestem Pip.`,"story.arrival_3_polite":`Dzięki… a ty kim jesteś?`,"story.arrival_3_polite_1":`Jakie maniery! Jestem Pip. Jestem w komplecie ze sklepem.`,"story.arrival_4":`Wren wyjechała w pośpiechu. Coś z morzem. Jutro o tej samej porze.`,"story.rival_1":`Dzwonek przy drzwiach brzęczy. Pip nagle siedzi pod ladą.`,"story.rival_2":`A więc sklep Wren wciąż działa. Vex, Wielki Mistrz Gildii Alchemików.`,"story.rival_3":`Gildia kupi tę chatkę. Pięćset sztuk złota. Hojnie.`,"story.rival_3_refuse":`Nie na sprzedaż.`,"story.rival_3_refuse_1":`Wren też tak mówiła. Przez trzydzieści lat.`,"story.rival_3_think":`Zastanowię się.`,"story.rival_3_think_1":`Myśl szybko. Oferta maleje.`,"story.rival_4":`Na Moonfair Gildia wygrywa Wielki Wywar. Jak zawsze.`,"story.rival_5":`Wygraj Moonfair, a nikt nie tknie sklepu. Stare prawo. Potrzebujemy gwiazdek: dokładnych leków.`,"story.postcard_1":`Przez drzwi wpada pocztówka. Z przodu łypie groźnie mewa.`,"story.postcard_2":`Kiełku mój, morze jest cudne. Karm Pipa dwa razy dziennie, cokolwiek by mówił.`,"story.postcard_3":`Trzymaj go z dala od zielonej butelki na górnej półce. I nigdy nic nie sprzedawaj mężczyźnie w cylindrze.`,"story.postcard_3_bottle":`Co jest w zielonej butelce?`,"story.postcard_3_bottle_1":`Nic. Jest zielona. Następne pytanie.`,"story.postcard_3_twice":`Dwa razy dziennie, Pip.`,"story.postcard_3_twice_1":`Miała na myśli trzy. Morskie powietrze jej zaszkodziło.`,"story.apprentice_1":`BUM. Fioletowy dym, a potem dziewczyna w osmalonym kapeluszu.`,"story.apprentice_2":`Przepraszam! Zaklęcie na dzwonek. Jestem Luna. Czarownica. Prawie.`,"story.apprentice_3":`Wren obiecała mnie uczyć, a potem wyjechała. Mogę pomóc? Zamiatam. Prawie.`,"story.apprentice_3_welcome":`Witaj na pokładzie!`,"story.apprentice_3_welcome_1":`Miotły i ja cię nie zawiedziemy!`,"story.apprentice_3_later":`Poćwicz jeszcze.`,"story.apprentice_3_later_1":`Dobra. Będę na targu. Pomacham ci.`,"story.apprentice_4":`Wieść się niesie. Bard i rycerz też chcą leków.`,"story.photo_1":`Znalazłem książkę z przepisami Wren. Za marynowanymi traszkami, oczywiście.`,"story.photo_2":`Wypada stare zdjęcie: Wren, chłopak w cylindrze i młody mężczyzna o żółtych oczach.`,"story.photo_2_ask":`Pip… kim jest ten trzeci?`,"story.photo_2_ask_1":`Kimś, kto podjął złą decyzję. Odłóż to.`,"story.photo_2_back":`Odłóż to.`,"story.photo_2_back_1":`Dobrze. Rozsądnie.`,"story.photo_3":`Przysłały mnie karty, kochanie. A kot nie jest kotem. Wszyscy to wiedzą.`,"story.photo_4":`Wynocha.`,"story.truth_1":`Późno. Stygnący kocioł tyka. Pip siedzi przy zielonej butelce.`,"story.truth_2":`Nazywałem się Pippin Ashgrove. Razem z Vexem założyliśmy Gildię. Najlepsi przyjaciele.`,"story.truth_3":`W noc przed Moonfair wypiłem eliksir przemiany. Zadziałał aż za dobrze.`,"story.truth_4":`Wren zabrała kota do domu. Vex myśli, że uciekłem z naszymi przepisami.`,"story.truth_5":`Zielona butelka to lekarstwo. Potrzebuje księżycowego światła Moonfair.`,"story.truth_5_cure":`To dokończmy to.`,"story.truth_5_cure_1":`…Naprawdę to zrobisz? Tylko bez sentymentów.`,"story.truth_5_family":`Kot czy nie, jesteś rodziną.`,"story.truth_5_family_1":`…Kocia sierść w oku. Moja.`,"story.eve_1":`Powodzenia jutro na Moonfair, kochanie! Upiekłam ci bochenek. W kształcie kociołka.`,"story.eve_2":`Duchess przyłapała człowieka z Gildii przy twoim wózku. Zjadła jego notatki.`,"story.eve_3":`Będę pilnować kociołka. Nic nie wybuchnie. Chyba.`,"story.eve_4":`Jutro sędziowie przynoszą trzy zagadki. Dokładne leki, idealne gotowanie. Co nalewamy?`,"story.eve_4_classic":`Gwiezdny Tonik Wren.`,"story.eve_4_classic_1":`Sprawdzony. Wren będzie się puszyć przez rok.`,"story.eve_4_ours":`Coś naszego.`,"story.eve_4_ours_1":`Przerażające. Wren by to pokochała.`,"story.moonfair_1":`Plac lśni od lampionów. Sędziowie próbują twoich trzech leków.`,"story.moonfair_2":`Najwyższy Eliksir Gildii. Czterdzieści siedem składników. Płatki złota.`,"story.moonfair_3":`Smakuje jak moneta.`,"story.moonfair_4":`Gwiezdny Tonik Wren lśni w kubkach. Nad morzem uśmiecha się starsza pani.`,"story.moonfair_5":`Twój własny wywar musuje jak pierwszy ciepły dzień wiosny.`,"story.moonfair_6":`Zwycięzcą Wielkiego Wywaru jest… Bubbling Kettle!`,"story.moonfair_7":`Niemożliwe! Ten sklep odebrał mi wszystko. Odebrał mi mojego—`,"story.moonfair_8":`Księżycowe światło pada na zieloną butelkę. Pip pije. Na ladzie stoi wysoki mężczyzna o żółtych oczach.`,"story.moonfair_9":`Cześć, Vex. Byłem idiotą. Tak bardzo przepraszam.`,"story.moonfair_10":`Cześć, Vex. Byłem idiotą. Tak bardzo przepraszam.`,"story.moonfair_11":`…Pippin? Byłeś tu przez cały czas?`,"story.moonfair_12":`Trzydzieści lat złości na sklep. To dużo lat.`,"story.moonfair_12_seat":`W Kettle jest dla ciebie miejsce.`,"story.moonfair_12_seat_1":`…Przyniosę ciastka. Ciastka Gildii.`,"story.moonfair_12_goat":`Zacznij od przeprosin dla kozy.`,"story.moonfair_12_goat_1":`Niech będzie. Jedne przeprosiny. Dla kozy.`,"story.moonfair_13":`Słyszałam, że wygraliście. Wracam do domu na herbatę. Powiedz Pipowi, że jestem z niego dumna. Ściskam, Babcia.`},id:{tagline:`Toko ramuan yang nyaman di malam hari. Sembuhkan apa yang mereka keluhkan.`,startNight:`Mulai malam`,continue:`Lanjutkan`,daily:`Ramuan harian`,dailyDone:`Ramuan harian: sembuh`,dailyTitle:`Ramuan harian`,dailyDoneTex kan yang bagus.`,"boil.burnt":`Tapi agak gosong.`,notebookHint:`Setiap gejala yang kamu sembuhkan dengan tepat. Saat pelanggan mengucapkannya lagi, esensnya tampil di sampingnya.`,notebookEmpty:`Belum ada. Sembuhkan gejala dengan tepat dan Pip akan mencatatnya.`,tierOpens:{other:`{n} pembelian lagi untuk membukanya`},level:`level {n}/{max}`,owned:`Di rak`,max:`Maks`,newIngredient:`{name} ada di rak!`,"vol.music":`Musik`,"vol.ambient":`Suara toko`,"vol.sfx":`Efek`,"tier.shelf":`Rak`,"tier.cellar":`Ruang bawah`,"tier.attic":`Loteng`,"tier.moon":`Jendela bulan`,"item.newIngredient":`bahan baru`,"item.mint.name":`Mint`,"item.honey.name":`Madu`,"item.moonmilk.name":`Susu bulan`,"item.moss.name":`Lumut rawa`,"item.dragon.name":`Lada naga`,"item.mandrake.name":`Mandragora`,"item.bellows.name":`Pompa angin`,"item.bellows.effect":`kotak putih lebih lebar saat merebus`,"item.sign.name":`Papan toko`,"item.sign.effect":`+15% tip per level`,"item.bell.name":`Lonceng pintu`,"item.bell.effect":`satu pelanggan lagi tiap malam`,"item.spyglass.name":`Teropong`,"item.spyglass.effect":`gejala yang dikenal tampak kekuatannya`,"ing.poppy":`Popi`,"ing.pepper":`Lada`,"ing.snowbell":`Bunga salju`,"ing.ember":`Akar bara`,"ing.glowcap":`Jamur pendar`,"ing.dusk":`Beri senja`,"ing.mint":`Mint`,"ing.honey":`Madu`,"ing.moonmilk":`Susu bulan`,"ing.moss":`Lumut rawa`,"ing.dragon":`Lada naga`,"ing.mandrake":`Mandragora`,"who.tom":`Kakek Tom`,"who.bea":`Bea si Tukang Roti`,"who.finn":`Finn si Nelayan`,"who.moss":`Nenek Moss`,"who.reggie":`Sir Reginald`,"who.luna":`Luna`,"who.lyle":`Lyle sang Penyair`,"who.ostra":`Madame Ostra`,"open.tom.0":`Malam. Aku lagi, dan kambingku lagi.`,"open.tom.1":`Jangan tertawa. Kata istriku aku butuh ramuan.`,"open.bea.0":`Cepat, sebelum rotinya gosong! Ini aku.`,"open.bea.1":`Ingin kubuatkan pai, Nak, tapi lihat aku.`,"open.finn.0":`Seharian tak dapat ikan. Malah dapat ini.`,"open.finn.1":`Udara laut berbuat sesuatu padaku.`,"open.moss.0":`Jangan bilang ke Serikat aku ke sini, Nak.`,"open.moss.1":`Herbaku tak mempan untuk yang ini. Herbamu bisa?`,"open.reggie.0":`Pemilik toko! Ksatria butuh bantuan!`,"open.reggie.1":`Sir Reginald memerlukan obat. Segera.`,"open.luna.0":`Aku mencoba mantra pada diriku. Hampir baik-baik saja!`,"open.luna.1":`Jangan bilang Pip, tapi aku butuh obat.`,"open.lyle.0":`♪ Lagu duka, satu ramuan, ya ♪`,"open.lyle.1":`Penontonku kabur. Tolong aku, peramu!`,"open.ostra.0":`Kata kartu, kau akan menolongku, Sayang.`,"open.ostra.1":`Teka-teki hari ini, dari kartu untukmu.`,"sym.calm.1.a":`Aku sedikit kebanyakan minum kopi.`,"sym.calm.1.b":`Tanganku sedikit gemetar.`,"sym.calm.2.a":`Aku tak bisa diam. Sedetik pun tidak!`,"sym.calm.2.b":`Jantungku berpacu seperti kuda lepas!`,"sym.zest.1.a":`Aku agak mengantuk hari ini.`,"sym.zest.1.b":`Aku terus menguap sedikit.`,"sym.zest.2.a":`Aku sangat lelah sampai tertidur sambil berdiri!`,"sym.zest.2.b":`Semuanya sangat berat, aku tak bisa mengangkat jari!`,"sym.frost.1.a":`Aku sedikit kepanasan.`,"sym.frost.1.b":`Pipiku agak panas.`,"sym.frost.2.a":`Aku terbakar seperti oven!`,"sym.frost.2.b":`Uap keluar dari telingaku!`,"sym.warm.1.a":`Aku agak kedinginan.`,"sym.warm.1.b":`Hidungku sedikit dingin.`,"sym.warm.2.a":`Aku membeku kaku!`,"sym.warm.2.b":`Gigiku tak berhenti bergemeletuk!`,"sym.gloom.1.a":`Aku sedikit bercahaya di malam hari.`,"sym.gloom.1.b":`Semuanya agak terlalu terang.`,"sym.gloom.2.a":`Aku menyala dalam gelap seperti lentera!`,"sym.gloom.2.b":`Aku bersinar sangat terang sampai tak ada yang bisa tidur!`,"sym.glow.1.a":`Aku merasa agak murung.`,"sym.glow.1.b":`Semuanya tampak sedikit kelabu hari ini.`,"sym.glow.2.a":`Awan gelap mengikutiku ke mana-mana!`,"sym.glow.2.b":`Aku sangat sedih sampai bayanganku pun pergi!`,"chapters.arrival":`The Bubbling Kettle`,"chapters.rival":`Pria Bertopi Tinggi`,"chapters.postcard":`Kartu Pos dari Laut`,"chapters.apprentice":`Sang Murid`,"chapters.photo":`Buku Catatan Nenek`,"chapters.truth":`Botol Hijau`,"chapters.eve":`Malam Sebelum Moonfair`,"chapters.moonfair":`Moonfair`,"story.arrival_1":`Toko menjadi sunyi. Di atas meja, seekor kucing hitam membuka satu mata.`,"story.arrival_2":`Lumayan untuk malam pertama. Kata Wren kamu bakal lambat.`,"story.arrival_3":`Nah? Katakan sesuatu.`,"story.arrival_3_shock":`Kucing yang bisa bicara?!`,"story.arrival_3_shock_1":`Kucing bicara yang menghitung kas. Aku Pip.`,"story.arrival_3_polite":`Terima kasih… kamu siapa?`,"story.arrival_3_polite_1":`Sopan sekali! Aku Pip. Aku satu paket dengan toko ini.`,"story.arrival_4":`Wren pergi terburu-buru. Ada urusan dengan laut. Sampai besok, jam yang sama.`,"story.rival_1":`Lonceng pintu berdenting. Tiba-tiba Pip sudah di bawah meja.`,"story.rival_2":`Jadi toko Wren masih buka. Vex, Mahaguru Serikat Alkemis.`,"story.rival_3":`Serikat akan membeli pondok ini. Lima ratus keping emas. Murah hati.`,"story.rival_3_refuse":`Tidak dijual.`,"story.rival_3_refuse_1":`Wren juga bilang begitu. Selama tiga puluh tahun.`,"story.rival_3_think":`Akan kupikirkan.`,"story.rival_3_think_1":`Pikirkan cepat. Tawarannya menyusut.`,"story.rival_4":`Di Moonfair, Serikat memenangkan Ramuan Agung. Seperti biasa.`,"story.rival_5":`Menangkan Moonfair dan tak ada yang bisa menyentuh toko ini. Hukum lama. Kita butuh bintang: obat yang tepat.`,"story.postcard_1":`Sebuah kartu pos jatuh lewat celah pintu. Seekor camar melotot dari gambarnya.`,"story.postcard_2":`Tunas kecilku, lautnya indah. Beri Pip makan dua kali sehari, apa pun katanya.`,"story.postcard_3":`Jauhkan dia dari botol hijau di rak paling atas. Dan jangan pernah menjual pada pria bertopi tinggi.`,"story.postcard_3_bottle":`Apa isi botol hijau itu?`,"story.postcard_3_bottle_1":`Tidak ada. Warnanya hijau. Pertanyaan berikutnya.`,"story.postcard_3_twice":`Dua kali sehari, Pip.`,"story.postcard_3_twice_1":`Maksudnya tiga kali. Udara laut membuatnya lupa.`,"story.apprentice_1":`DUAR. Asap ungu, lalu seorang gadis bertopi hangus.`,"story.apprentice_2":`Maaf! Mantra bel pintu. Aku Luna. Penyihir. Kurang lebih.`,"story.apprentice_3":`Wren janji mengajariku, lalu dia pergi. Boleh aku bantu? Aku bisa menyapu. Kurang lebih.`,"story.apprentice_3_welcome":`Selamat bergabung!`,"story.apprentice_3_welcome_1":`Aku dan sapu-sapu tak akan mengecewakanmu!`,"story.apprentice_3_later":`Terus berlatih.`,"story.apprentice_3_later_1":`Oke. Aku di pasar. Sambil melambai.`,"story.apprentice_4":`Kabar cepat menyebar. Seorang penyair dan ksatria juga mau obat.`,"story.photo_1":`Ketemu buku resep Wren. Di balik kadal air acar, tentu saja.`,"story.photo_2":`Sebuah foto lama terselip keluar: Wren, anak lelaki bertopi tinggi, dan pemuda bermata kuning.`,"story.photo_2_ask":`Pip… siapa yang ketiga?`,"story.photo_2_ask_1":`Seseorang yang membuat keputusan buruk. Kembalikan.`,"story.photo_2_back":`Kembalikan.`,"story.photo_2_back_1":`Bagus. Bijak.`,"story.photo_3":`Kartu yang mengutusku, Sayang. Dan kucing itu bukan kucing. Semua orang tahu.`,"story.photo_4":`Keluar.`,"story.truth_1":`Larut malam. Kuali berdetak saat mendingin. Pip duduk di samping botol hijau.`,"story.truth_2":`Namaku dulu Pippin Ashgrove. Aku dan Vex mendirikan Serikat. Sahabat karib.`,"story.truth_3":`Malam sebelum sebuah Moonfair aku meminum ramuan pengubah wujud. Hasilnya terlalu manjur.`,"story.truth_4":`Wren membawa kucing itu pulang. Vex mengira aku kabur membawa resep kami.`,"story.truth_5":`Botol hijau itu obatnya. Butuh cahaya bulan Moonfair.`,"story.truth_5_cure":`Kalau begitu, ayo selesaikan.`,"story.truth_5_cure_1":`…Kamu mau melakukan itu? Jangan sentimental.`,"story.truth_5_family":`Kucing atau bukan, kamu keluarga.`,"story.truth_5_family_1":`…Ada bulu kucing di mataku. Punyaku sendiri.`,"story.eve_1":`Semoga berhasil di Moonfair besok, Nak! Kubuatkan roti. Bentuk kuali.`,"story.eve_2":`Duchess menangkap orang Serikat di dekat gerobakmu. Catatannya dia makan.`,"story.eve_3":`Aku akan menjaga kuali. Tak akan ada yang meledak. Mungkin.`,"story.eve_4":`Besok para juri membawa tiga teka-teki. Obat tepat, rebusan sempurna. Kita tuang apa?`,"story.eve_4_classic":`Tonik Cahaya Bintang Wren.`,"story.eve_4_classic_1":`Sudah teruji. Wren bakal sombong setahun.`,"story.eve_4_ours":`Racikan kita sendiri.`,"story.eve_4_ours_1":`Menakutkan. Wren pasti suka.`,"story.moonfair_1":`Alun-alun bercahaya oleh lentera. Para juri mencicipi tiga obatmu.`,"story.moonfair_2":`Eliksir Agung Serikat. Empat puluh tujuh bahan. Daun emas.`,"story.moonfair_3":`Rasanya seperti koin.`,"story.moonfair_4":`Tonik Cahaya Bintang Wren berpendar di cangkir. Di tepi laut, seorang nenek tersenyum.`,"story.moonfair_5":`Ramuanmu sendiri berdesis seperti hari hangat pertama di musim semi.`,"story.moonfair_6":`Pemenang Ramuan Agung… The Bubbling Kettle!`,"story.moonfair_7":`Mustahil! Toko itu merampas segalanya dariku. Ia merampas—`,"story.moonfair_8":`Cahaya bulan menyinari botol hijau. Pip meminumnya. Seorang pria jangkung bermata kuning berdiri di atas meja.`,"story.moonfair_9":`Halo, Vex. Aku dulu bodoh. Aku sungguh minta maaf.`,"story.moonfair_10":`Halo, Vex. Aku dulu bodoh. Aku sungguh minta maaf.`,"story.moonfair_11":`…Pippin? Selama ini kau ada di sini?`,"story.moonfair_12":`Tiga puluh tahun marah pada sebuah toko. Itu waktu yang lama.`,"story.moonfair_12_seat":`Ada kursi untukmu di Kettle.`,"story.moonfair_12_seat_1":`…Aku akan bawa biskuit. Biskuit Serikat.`,"story.moonfair_12_goat":`Mulailah dengan minta maaf ke kambing.`,"story.moonfair_12_goat_1":`Baiklah. Satu permintaan maaf. Untuk kambing.`,"story.moonfair_13":`Dengar-dengar kalian menang. Nenek pulang untuk minum teh. Bilang ke Pip Nenek bangga padanya. Peluk sayang, Nenek.`}},ra=!1;async function ia(e,t){let n=NaN;ce(Number.isFinite(n)?n:null),document.addEventListener(`contextmenu`,e=>e.preventDefault());let r=Te(t.portal);return r&&(await r.init(),r.loadingStart()),aa(e,t,t.kit,r,na)}async function aa(e,t,n,r,i){let a=new We({strings:i,languages:t.languages,saveKey:t.saveKey,minTouchPx:t.minTouchPx,locale:t.locale,ads:t.ads,
