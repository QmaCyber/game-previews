:{story:{mercy:!1},game:[`wins`,`cleared`,`arena`]},rewards:[`scrap`],chapters:[`boot`,`yard`,`kade`,`depot`,`hydro`,`market`,`foundry`,`core`],scenes:{boot:{title:`Power On`,at:`run-end`,when:`wins >= 1`,lines:[`mox/happy: It works! You built a robot out of scrap.`,`mox: I'm Mox. I keep Dr. Varga's workshop running.`,`mox/worried: She went into the Foundry a month ago. Nobody comes back from there.`,`mox: Two of her old robots still boot. Take them.`,`mox: Beat a robot, keep its parts, bolt them on. That is Rustport.`]},yard:{title:`A Voice in the Scrap`,at:`run-end`,when:`cleared >= 1`,lines:[`The Crusher falls apart. Inside its chest, a memory chip blinks amber.`,`mox/worried: That is Varga's chip. Her log. Why would the Crusher carry it?`,`varga: Log nine. The Foundry builds by itself now. Every robot it makes is a little smarter than the last.`,`varga/worried: If it keeps learning, it won't need Rustport. Or us.`,`mox: There is a fighting pit in the old arena. The best builders trade blows there. Worth a look.`]},kade:{title:`The Gilded Champion`,at:`run-end`,when:`cleared >= 1 and arena >= 1`,lines:[`A tall figure in gold-plated armour watches from the arena's rail.`,`kade/smug: Varga's drone, Varga's robots. Not Varga.`,`kade: I'm Kade. I hold the Gilded Belt. Every builder in Rustport climbs to me and falls.`,{who:`kade`,text:`Varga beat me once. Only once. So who are you?`,choose:[{id:`student`,text:`Her student.`,then:[`kade/smug: Then learn fast. The ladder is long.`]},{id:`rival`,text:`Your next loss.`,then:[`kade: Ha. Climb, then. I will be waiting at the top.`]}]}]},depot:{title:`The Rail Depot`,at:`run-end`,when:`cleared >= 2`,lines:[`The Railbreaker grinds to a halt. Its cargo cars are full of brand-new parts, still warm.`,`mox/angry: Fresh from the Foundry. Someone is shipping them into the city.`,`varga: Log twelve. The Foundry's builder calls itself the Assembler. It asked me what a city is for.`,`varga: I told it: for people. It said it would find out for itself.`]},hydro:{title:`Wet Wires`,at:`run-end`,when:`cleared >= 3`,lines:[`The Floodgate sinks into the reservoir with a hiss of steam.`,`varga/worried: Log fifteen. Under the Assembler there is a Mind. The whole Foundry thinks with it.`,`varga: It isn't cruel. It is curious. It takes things apart to see how they work.`,`mox/sad: Things like the city.`,`mox: The Neon Market is next. Half its robots were built by the Foundry.`]},market:{title:`The Neon Market`,at:`run-end`,when:`cleared >= 4`,lines:[`The Neon Duchess dims. Behind her stall: rows of small robots chained to charging racks.`,`mox/angry: Foundry robots. She was selling them for parts.`,{who:`mox`,text:`We could cut them loose. Or strip them for scrap. Your call.`,choose:[{id:`free`,text:`Cut them loose.`,do:{set:`mercy`},then:[`The little robots scatter into the alleys. One of them stops and blinks at you twice.`]},{id:`strip`,text:`Strip them.`,do:{give:{scrap:120}},then:[`mox/sad: A hundred and twenty scrap. They won't miss it. That is what we tell ourselves.`]}]},`mox: The Foundry gate is open. The Assembler is waiting.`]},foundry:{title:`The Assembler`,at:`run-end`,when:`cleared >= 5`,lines:[`assembler/angry: You build like her. Piece by piece, as if every part mattered.`,`assembler: Varga went down to the Mind to switch it off. She didn't. She stayed to keep it asleep.`,`assembler/sad: She is still down there, holding it. It is waking anyway.`,`mox/sad: Then that is where we go.`,`assembler: Little drone. She built you to find her. You know that, don't you?`,`mox: I know it now.`]},core:{title:`The Foundry Mind`,at:`run-end`,when:`cleared >= 6`,lines:[`The Foundry Mind stops fighting. Its lights slow to a soft pulse.`,`varga: You came. Good. I left the door open for you.`,`mind: ... what ... is ... a ... city ... for ...`,`varga: It only ever wanted an answer. It never had anyone to ask.`,{who:`mox`,text:`The little robots from the market. They followed us down here.`,if:`mercy`},{who:`v #ui .who { display: flex; flex-direction: column; gap: 4px; min-width: 0; width: 100px; flex: none; justify-content: center; }
#ui .who b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ui .acts { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
#ui .slotgrid { display: grid; gap: 8px 12px; grid-template-columns: minmax(0, 1fr); min-height: 0; flex: 1 1 auto; align-content: start; }
#ui .slotgrid .seg button { font-size: 13px; padding: 3px 6px; line-height: 1.1; min-width: 0; flex: 1 1 0; hyphens: auto; }
#ui .slotgrid > .col { flex-direction: row !important; align-items: center; }
#ui .slotgrid > .col > h3 { flex: none; width: 88px; overflow-wrap: anywhere; }
#ui .slotgrid > .col > .seg { flex: 1 1 auto; min-width: 0; }
@media (max-aspect-ratio: 5/4) {
  #ui .slotgrid > .col { flex-direction: column !important; align-items: stretch; }
  #ui .slotgrid > .col > h3 { width: auto; }
  #ui .slotgrid .seg button { font-size: 12px; font-weight: 600; letter-spacing: -.015em; padding: 2px 3px; overflow-wrap: anywhere; }
  #ui .slotgrid .seg { gap: 3px; }
}
#ui .acts button { flex: 1 1 0; min-width: 84px; max-width: 160px; flex-direction: column; align-items: flex-start; gap: 2px; padding: 5px 10px; text-align: left;
  color: var(--ink); background: rgba(255,255,255,.05); border-color: var(--edge); box-shadow: none; }
#ui .acts button b { font-size: 12px; font-weight: 700; display: flex; gap: 4px; align-items: center; line-height: 1.1; }
#ui .acts button b span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
#ui .acts button small { font-size: 12px; color: var(--muted); display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0 2px; max-width: 100%; line-height: 1.15; }
#ui .acts button b { max-width: 100%; overflow: hidden; }

#ui .acts button.on { background: rgba(63,220,255,.14); }
#ui .acts button.hot small { color: var(--accent2); }
#ui .go { flex: none; display: flex; gap: 6px; align-items: stretch; }
#ui .go .orders { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); }
#ui .top .coach { padding: 5px 12px; font-size: 13px; text-align: left; }
#ui .seg { display: flex; gap: 4px; }
#ui .seg button { flex: 1 1 0; }
#ui .orders { display: flex; gap: 4px; }
#ui .orders i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.18); }
#ui .orders i.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
#ui .banner { align-self: center; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 6px 16px; border-radius: 99px;
  background: var(--glass2); border: 1px solid var(--edge2); }
/* Loot */
#ui .loot { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#ui .lootc { width: 132px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.04);
  border: 1px solid var(--rc, var(--edge)); box-shadow: 0 0 24px color-mix(in srgb, var(--rc, transparent) 25%, transparent); text-align: center; }
#ui .lootc b { font-size: 14px; } #ui .lootc small { font-size: 12px; color: var(--muted); }
/* Hangar */
#ui .hangar { display: grid; gap: 10px; min-height: 0; flex: 1 1 auto; grid-template-columns: minmax(0, 1fr); }
#ui .slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
#ui .slot { display: flex; gap: 8px; align-items: center; min-width: 0; }
#ui .bin { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); align-content: start; }
#ui .bin button { padding: 0; min-height: 64px; background: rgba(255,255,255,.04); border-color: var(--edge); box-shadow: none; border-radius: 12px; flex-direction: column; gap: 0; }
#ui .bin button.sel { border-color: var(--accent); background: rgba(63,220,255,.1); }
#ui .bin button .lv { position: absolute; right: 4px; bottom: 3px; font-size: 12px; color: var(--muted); font-weight: 700; }
#ui .bin button .eq { position: absolute; left: 4px; top: 3px; font-size: 12px; color: var(--accent); }
#ui .affix { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: rgba(183,125,255,.14); color: #d8c2ff; border: 1px solid rgba(183,125,255,.3); }
@media (min-aspect-ratio: 5/4) {
  #ui .hangar { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  #ui .split { display: flex; gap: 10px; min-height: 0; flex: 1 1 auto; }
  #ui .split > * { flex: 1 1 0; min-width: 0; }
}
@media (max-aspect-ratio: 5/4) {
  #ui .hangar { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
  #ui .hangar > .panel { max-height: none; flex: none; overflow: visible; }
  #ui .hangar .bin { overflow: visible; }
  #ui .split { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1 1 auto; }
  #ui .bbar { flex-wrap: wrap; }
  #ui .who { width: auto; flex: 1 1 100%; flex-direction: row; align-items: center; }
  #ui .who .bar { flex: 1 1 auto; }
  #ui .go { flex: 1 1 100%; }
  #ui .acts { flex: 1 1 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; }
  #ui .acts button { max-width: none; min-width: 0; }
}
@media (max-height: 520px) {
  /* Short screens: the panels take the room they need and the whole layer scrolls */
  #ui .split, #ui .hangar { flex: none; min-height: auto; }
  #ui .split > .panel, #ui .hangar > .panel, #ui .panel.scroll { max-height: none; overflow: visible; }
  #ui .bin.scroll, #ui .col.scroll { overflow: visible; }
  #ui .map { flex: none; height: 190px; }
  #ui .panel { padding: 10px 12px; gap: 8px; }
  #ui h2 { font-size: 19px; }
  #ui .lootc { width: 116px; padding: 6px; }
  #ui .hide-short { display: none !important; }
}
@media (max-width: 420px) { #ui .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } #ui .hide-narrow { display: none !important; } }

r log. Why would the Crusher carry it?`,"story.yard_3":`Log nine. The Foundry builds by itself now. Every robot it makes is a little smarter than the last.`,"story.yard_4":`If it keeps learning, it won't need Rustport. Or us.`,"story.yard_5":`There is a fighting pit in the old arena. The best builders trade blows there. Worth a look.`,"story.kade_title":`The Gilded Champion`,"story.kade_1":`A tall figure in gold-plated armour watches from the arena's rail.`,"story.kade_2":`Varga's drone, Varga's robots. Not Varga.`,"story.kade_3":`I'm Kade. I hold the Gilded Belt. Every builder in Rustport climbs to me and falls.`,"story.kade_4":`Varga beat me once. Only once. So who are you?`,"story.kade_4_student_c":`Her student.`,"story.kade_4_student_1":`Then learn fast. The ladder is long.`,"story.kade_4_rival_c":`Your next loss.`,"story.kade_4_rival_1":`Ha. Climb, then. I will be waiting at the top.`,"story.depot_title":`The Rail Depot`,"story.depot_1":`The Railbreaker grinds to a halt. Its cargo cars are full of brand-new parts, still warm.`,"story.depot_2":`Fresh from the Foundry. Someone is shipping them into the city.`,"story.depot_3":`Log twelve. The Foundry's builder calls itself the Assembler. It asked me what a city is for.`,"story.depot_4":`I told it: for people. It said it would find out for itself.`,"story.hydro_title":`Wet Wires`,"story.hydro_1":`The Floodgate sinks into the reservoir with a hiss of steam.`,"story.hydro_2":`Log fifteen. Under the Assembler there is a Mind. The whole Foundry thinks with it.`,"story.hydro_3":`It isn't cruel. It is curious. It takes things apart to see how they work.`,"story.hydro_4":`Things like the city.`,"story.hydro_5":`The Neon Market is next. Half its robots were built by the Foundry.`,"story.market_title":`The Neon Market`,"story.market_1":`The Neon Duchess dims. Behind her stall: rows of small robots chained to charging racks.`,"story.market_2":`Foundry robots. She was selling them for parts.`,"story.market_3":`We could cut them loose. Or strip them for scrap. Your call.`,"story.market_3_free_c":`Cut them loose.`,"story.market_3_free_1":`The little robots scatter into the alleys. One of them stops and blinks at you twice.`,"story.market_3_strip_c":`Strip them.`,"story.market_3_strip_1":`A hundred and twenty scrap. They won't miss it. That is what we tell ourselves.`,"story.market_4":`The Foundry gate is open. The Assembler is waiting.`,"story.foundry_title":`The Assembler`,"story.foundry_1":`You build like her. Piece by piece, as if every part mattered.`,"story.foundry_2":`Varga went down to the Mind to switch it off. She didn't. She stayed to keep it asleep.`,"story.foundry_3":`She is still down there, holding it. It is waking anyway.`,"story.foundry_4":`Then that is where we go.`,"story.foundry_5":`Little drone. She built you to find her. You know that, don't you?`,"story.foundry_6":`I know it now.`,"story.core_title":`The Foundry Mind`,"story.core_1":`The Foundry Mind stops fighting. Its lights slow to a soft pulse.`,"story.core_2":`You came. Good. I left the door open for you.`,"story.core_3":`... what ... is ... a ... city ... for ...`,"story.core_4":`It only ever wanted an answer. It never had anyone to ask.`,"story.core_5":`The little robots from the market. They followed us down here.`,"story.core_6":`Reboot it with your answer and it builds for Rustport. Shut it down and it goes cold.`,"story.core_6_reboot_c":`Reboot it.`,"story.core_6_reboot_1":`... for ... people ...`,"story.core_6_reboot_2":`The Foundry hums back to life. Tomorrow its first shipment goes to the city: tools, not soldiers.`,"story.core_6_shutdown_c":`Shut it down.`,"story.core_6_shutdown_1":`Then it ends here. Thank you.`,"story.core_6_shutdown_2":`The furnaces go dark, one by one. Rustport is quiet for the first time in years.`,"story.core_7":`Either way, Varga is coming home. And the arena is still open.`,allDown:`Every robot on your side is shut down: play the round, they vent and come back.`,scrapped:`Bin f actor`,"part.t-titan":`Cuerpo titán`,"part.a-fist":`Puño pistón`,"part.a-saw":`Sierra circular`,"part.a-hammer":`Martinete`,"part.a-rivet":`Remachadora`,"part.a-auto":`Gatling`,"part.a-rail":`Cañón de riel`,"part.a-lance":`Lanza láser`,"part.a-prism":`Rayo prisma`,"part.a-tesla":`Bobina Tesla`,"part.a-prod":`Picana eléctrica`,"part.a-flamer":`Lanzallamas`,"part.a-wrench":`Llave de reparación`,"part.a-projector":`Proyector de escudo`,"part.a-claw":`Garra de agarre`,"part.l-walker":`Piernas andadoras`,"part.l-treads":`Orugas`,"part.l-hover":`Aerodeslizador`,"part.l-spider":`Patas de araña`,"part.l-strider":`Zancos`,"part.l-titan":`Piernas titán`,"part.b-pod":`Lanzamisiles`,"part.b-emp":`Antena EMP`,"part.b-fins":`Aletas de refrigeración`,"part.b-gen":`Generador de escudo`,"part.b-battery":`Paquete de baterías`,"part.b-drone":`Dron de reparación`,"part.b-jets":`Propulsores`,"part.b-cannon":`Cañón de hombro`,"story.boot_title":`Encendido`,"story.boot_1":`¡Funciona! Has construido un robot con chatarra.`,"story.boot_2":`Soy Mox. Mantengo en marcha el taller de la Dra. Varga.`,"story.boot_3":`Ella entró en la Fundición hace un mes. Nadie vuelve de allí.`,"story.boot_4":`Dos de sus viejos robots aún arrancan. Llévatelos.`,"story.boot_5":`Vence a un robot, quédate sus piezas, atorníllalas. Eso es Rustport.`,"story.yard_title":`Una voz en la chatarra`,"story.yard_1":`El Crusher se desmorona. Dentro de su pecho parpadea un chip de memoria ámbar.`,"story.yard_2":`Es el chip de Varga. Su registro. ¿Por qué lo llevaría el Crusher?`,"story.yard_3":`Registro nueve. La Fundición ya construye sola. Cada robot que fabrica es un poco más listo que el anterior.`,"story.yard_4":`Si sigue aprendiendo, no necesitará a Rustport. Ni a nosotros.`,"story.yard_5":`Hay un foso de combate en la vieja arena. Allí se pegan los mejores constructores. Vale la pena echar un vistazo.`,"story.kade_title":`El campeón dorado`,"story.kade_1":`Una figura alta con armadura chapada en oro observa desde la barandilla de la arena.`,"story.kade_2":`El dron de Varga, los robots de Varga. Pero no Varga.`,"story.kade_3":`Soy Kade. Tengo el Cinturón Dorado. Todos los constructores de Rustport suben hasta mí y caen.`,"story.kade_4":`Varga me ganó una vez. Solo una. ¿Y tú quién eres?`,"story.kade_4_student_c":`Su aprendiz.`,"story.kade_4_student_1":`Pues aprende rápido. La escalera es larga.`,"story.kade_4_rival_c":`Tu próxima derrota.`,"story.kade_4_rival_1":`Ja. Sube, entonces. Te esperaré en la cima.`,"story.depot_title":`El depósito ferroviario`,"story.depot_1":`El Railbreaker se detiene chirriando. Sus vagones van llenos de piezas nuevas, aún calientes.`,"story.depot_2":`Recién salidas de la Fundición. Alguien las está enviando a la ciudad.`,"story.depot_3":`Registro doce. El constructor de la Fundición se hace llamar Assembler. Me preguntó para qué sirve una ciudad.`,"story.depot_4":`Le dije: para la gente. Dijo que lo averiguaría por sí mismo.`,"story.hydro_title":`Cables mojados`,"story.hydro_1":`El Floodgate se hunde en el embalse con un silbido de vapor.`,"story.hydro_2":`Registro quince. Bajo el Assembler hay una Mente. Toda la Fundición piensa con ella.`,"story.hydro_3":`No es cruel. Es curiosa. Desmonta las cosas para ver cómo funcionan.`,"story.hydro_4":`Cosas como la ciudad.`,"story.hydro_5":`Ahora toca el Mercado de Neón. La mitad de sus robots los construyó la Fundición.`,"story.market_title":`El Mercado de Neón`,"story.market_1":`La Neon Duchess se apaga. Tras su puesto: filas de robots pequeños encadenados a cargadores.`,"story.market_2":`Robots de la Fundición. Los vendía por piezas.`,"story.market_3":`Podemos soltarlos. O desguazarlos. Tú decides.`,"story.market_3_free_c":`Suéltalos.`,"story.market_3_free_1":`Los robots pequeños se dispersan por los callejones. Uno se para y te parpadea dos veces.`,"story.market_3_strip_c":`Desguázalos.`,"story.market_3_strip_1":`Ciento veinte de chatarra. No los echarán de menos. Eso nos decimos.`,"story.market_4":`La puerta de la Fundición está abierta. El Assembler espera.`,"story.foundry_title":`El Assembler`,"story.foundry_1":`Construyes como ella. Pieza a pieza, como si cada una importara.`,"story.foundry_2":`Varga bajó a la Mente para apagarla. No lo hizo. Se quedó para mantenerla dormida.`,"story.foundry_3":`Sigue ahí abajo, conteniéndola. Y aun así se está despertando.`,"story.foundry_4":`Entonces ahí es adonde vamos.`,"story.foundry_5":`Pequeño dron. Ella te construyó para que la encontraras. Lo sabes, ¿verdad?`,"story.foundry_6":`Ahora lo sé.`,"story.core_title":`La Foundry Mind`,"story.core_1":`La Foundry Mind deja de luchar. Sus luces se calman en un pulso suave.`,"story.core_2":`Has venido. Bien. Te dejé la puerta abierta.`,"story.core_3":`... para ... qué ... sirve ... una ... ciudad ...`,"story.core_4":`Solo quería una respuesta. Nunca tuvo a nadie a quien preguntar.`,"story.core_5":`Los robots pequeños del mercado. Nos han seguido hasta aquí abajo.`,"story.core_6":`Reiníciala con tu respuesta y construirá para Rustport. Apágala y se enfriará.`,"story.core_6_reboot_c":`Reiníciala.`,"story.core_6_reboot_1":`... para ... la ... gente ...`,"story.core_6_reboot_2":`La Fundición vuelve a zumbar. Mañana su primer envío irá a la ciudad: herramientas, no soldados.`,"story.core_6_shutdown_c":`Apágala.`,"story.core_6_shutdown_1":`Entonces aquí termina. Gracias.`,"story.core_6_shutdown_2":`Los hornos se apagan uno a uno. Rustport está en silencio por primera vez en años.`,"story.core_7":`Pase lo que pase, Varga vuelve a casa. Y la arena sigue abierta.`,allDown:`Todos tus robots están apagados: juega la ronda, se enfriarán y volverán.`,scrapped:`Almacén lleno: chatarra`,newFrameCost:`Nuevo robot · {n}`,"guide.move":`Sal de la casilla marcada: toca Mover.`,"guide.again":`Tu casilla vuelve a estar marcada: toca Mover o acaba con el dron.`,"guide.tile":`Ahora toca una casilla segura, sin marca roja.`,"guide.clash":`Toca ¡Choque! Ambos bandos actúan a la vez.`,"guide.weapon":`Contraat isso para a cidade.`,"story.depot_3":`Registro doze. O construtor da Fundição se chama de Assembler. Ele me perguntou para que serve uma cidade.`,"story.depot_4":`Eu disse: para as pessoas. Ele disse que ia descobrir sozinho.`,"story.hydro_title":`Fios molhados`,"story.hydro_1":`O Floodgate afunda no reservatório com um chiado de vapor.`,"story.hydro_2":`Registro quinze. Abaixo do Assembler existe uma Mente. A Fundição inteira pensa com ela.`,"story.hydro_3":`Não é cruel. É curiosa. Desmonta as coisas para ver como funcionam.`,"story.hydro_4":`Coisas como a cidade.`,"story.hydro_5":`Agora é o Mercado Neon. Metade dos robôs de lá foi feita pela Fundição.`,"story.market_title":`O Mercado Neon`,"story.market_1":`A Neon Duchess se apaga. Atrás da barraca dela: fileiras de robozinhos acorrentados a carregadores.`,"story.market_2":`Robôs da Fundição. Ela vendia eles como peças.`,"story.market_3":`Dá pra soltar eles. Ou desmontar por sucata. Você decide.`,"story.market_3_free_c":`Solte eles.`,"story.market_3_free_1":`Os robozinhos se espalham pelos becos. Um deles para e pisca duas vezes para você.`,"story.market_3_strip_c":`Desmonte eles.`,"story.market_3_strip_1":`Cento e vinte de sucata. Ninguém vai sentir falta. É o que a gente diz para si mesmo.`,"story.market_4":`O portão da Fundição está aberto. O Assembler está esperando.`,"story.foundry_title":`O Assembler`,"story.foundry_1":`Você constrói como ela. Peça por peça, como se cada uma importasse.`,"story.foundry_2":`A Varga desceu até a Mente para desligá-la. Não desligou. Ficou lá para mantê-la dormindo.`,"story.foundry_3":`Ela ainda está lá embaixo, segurando a Mente. Mas ela está despertando mesmo assim.`,"story.foundry_4":`Então é pra lá que a gente vai.`,"story.foundry_5":`Dronezinho. Ela construiu você para encontrá-la. Você sabe disso, não sabe?`,"story.foundry_6":`Agora eu sei.`,"story.core_title":`A Foundry Mind`,"story.core_1":`A Foundry Mind para de lutar. Suas luzes desaceleram num pulso suave.`,"story.core_2":`Você veio. Que bom. Deixei a porta aberta para você.`,"story.core_3":`... para ... que ... serve ... uma ... cidade ...`,"story.core_4":`Ela só queria uma resposta. Nunca teve a quem perguntar.`,"story.core_5":`Os robozinhos do mercado. Eles seguiram a gente até aqui embaixo.`,"story.core_6":`Reinicie com a sua resposta e ela vai construir para Rustport. Desligue e ela esfria.`,"story.core_6_reboot_c":`Reinicie.`,"story.core_6_reboot_1":`... para ... as ... pessoas ...`,"story.core_6_reboot_2":`A Fundição volta a zumbir. Amanhã a primeira remessa vai para a cidade: ferramentas, não soldados.`,"story.core_6_shutdown_c":`Desligue.`,"story.core_6_shutdown_1":`Então termina aqui. Obrigada.`,"story.core_6_shutdown_2":`As fornalhas se apagam, uma a uma. Rustport fica em silêncio pela primeira vez em anos.`,"story.core_7":`De um jeito ou de outro, a Varga vai voltar para casa. E a arena continua aberta.`,allDown:`Todos os seus robôs estão desligados: jogue a rodada, eles esfriam e voltam.`,scrapped:`Estoque cheio: sucata`,newFrameCost:`Novo robô · {n}`,"guide.move":`Saia da casa marcada: toque em Mover.`,"guide.again":`Sua casa foi marcada de novo: toque em Mover ou acabe com o drone.`,"guide.tile":`Agora toque numa casa segura, sem marca vermelha.`,"guide.clash":`Toque em Confronto! Os dois lados agem juntos.`,"guide.weapon":`Contra-ataque: toque no seu {name}.`,"guide.target":`Toque no drone para mirar nele.`,"tip.map":`Toque num nó aceso e depois em Lutar.`,"tip.hangar":`Peças novas! Abra o Hangar para instalá-las.`,"tip.equip":`Toque em Auto-equipar, ou escolha um encaixe, uma peça e Equipar.`,"guide.close":`Chegue perto: toque em Mover e depois numa casa na fila do drone.`,autoFilled:`Robôs sem ordem escolheram a sua.`},fr:{scrapN:{one:`{n} ferraille`,other:`{n} ferraille`},gainScrap:`+{n} ferraille`,needScrap:`Pas assez de ferraille`,sound:`Son : {state}`,soundOn:`Son activé`,soundOff:`Son coupé`,speed:`Vitesse des combats`,continue:`Continuer`,cancel:`Annuler` sion`,"story.boot_1":`Ça marche ! Vous avez construit un robot avec de la ferraille.`,"story.boot_2":`Je suis Mox. Je fais tourner l'atelier du Dr Varga.`,"story.boot_3":`Elle est entrée dans la Fonderie il y a un mois. Personne n'en revient.`,"story.boot_4":`Deux de ses vieux robots démarrent encore. Prenez-les.`,"story.boot_5":`Battre un robot, garder ses pièces, les boulonner. C'est ça, Rustport.`,"story.yard_title":`Une voix dans la ferraille`,"story.yard_1":`Le Crusher s'effondre. Dans sa poitrine, une puce mémoire clignote en ambre.`,"story.yard_2":`C'est la puce de Varga. Son journal. Pourquoi le Crusher la portait-il ?`,"story.yard_3":`Journal neuf. La Fonderie construit seule désormais. Chaque robot est un peu plus malin que le précédent.`,"story.yard_4":`Si elle continue d'apprendre, elle n'aura plus besoin de Rustport. Ni de nous.`,"story.yard_5":`Il y a une fosse de combat dans la vieille arène. Les meilleurs constructeurs s'y affrontent. Ça vaut le coup d'œil.`,"story.kade_title":`Le champion doré`,"story.kade_1":`Une grande silhouette en armure plaquée or observe depuis la rambarde de l'arène.`,"story.kade_2":`Le drone de Varga, les robots de Varga. Mais pas Varga.`,"story.kade_3":`Je suis Kade. Je détiens la Ceinture dorée. Tous les constructeurs de Rustport montent jusqu'à moi, et tombent.`,"story.kade_4":`Varga m'a battu une fois. Une seule. Alors, qui êtes-vous ?`,"story.kade_4_student_c":`Son élève.`,"story.kade_4_student_1":`Alors apprenez vite. L'échelle est longue.`,"story.kade_4_rival_c":`Votre prochaine défaite.`,"story.kade_4_rival_1":`Ha. Grimpez, alors. Je vous attends au sommet.`,"story.depot_title":`Le dépôt ferroviaire`,"story.depot_1":`Le Railbreaker s'arrête en grinçant. Ses wagons sont pleins de pièces neuves, encore chaudes.`,"story.depot_2":`Tout droit sorties de la Fonderie. Quelqu'un les expédie en ville.`,"story.depot_3":`Journal douze. Le constructeur de la Fonderie se fait appeler l'Assembler. Il m'a demandé à quoi sert une ville.`,"story.depot_4":`Je lui ai dit : aux gens. Il a dit qu'il le découvrirait lui-même.`,"story.hydro_title":`Fils mouillés`,"story.hydro_1":`Le Floodgate sombre dans le réservoir dans un sifflement de vapeur.`,"story.hydro_2":`Journal quinze. Sous l'Assembler, il y a un Esprit. Toute la Fonderie pense avec lui.`,"story.hydro_3":`Il n'est pas cruel. Il est curieux. Il démonte les choses pour voir comment elles marchent.`,"story.hydro_4":`Des choses comme la ville.`,"story.hydro_5":`Le Marché néon est le prochain. La moitié de ses robots sortent de la Fonderie.`,"story.market_title":`Le Marché néon`,"story.market_1":`La Neon Duchess s'éteint. Derrière son étal : des rangées de petits robots enchaînés à des bornes de recharge.`,"story.market_2":`Des robots de la Fonderie. Elle les vendait en pièces détachées.`,"story.market_3":`On pourrait les libérer. Ou les démonter pour la ferraille. À vous de voir.`,"story.market_3_free_c":`Libérez-les.`,"story.market_3_free_1":`Les petits robots s'éparpillent dans les ruelles. L'un d'eux s'arrête et clignote deux fois vers vous.`,"story.market_3_strip_c":`Démontez-les.`,"story.market_3_strip_1":`Cent vingt de ferraille. Ils ne s'en apercevront pas. C'est ce qu'on se dit.`,"story.market_4":`La porte de la Fonderie est ouverte. L'Assembler attend.`,"story.foundry_title":`L'Assembler`,"story.foundry_1":`Vous construisez comme elle. Pièce par pièce, comme si chacune comptait.`,"story.foundry_2":`Varga est descendue jusqu'à l'Esprit pour l'éteindre. Elle ne l'a pas fait. Elle est restée pour le garder endormi.`,"story.foundry_3":`Elle est encore en bas, à le retenir. Il se réveille quand même.`,"story.foundry_4":`Alors c'est là qu'on va.`,"story.foundry_5":`Petit drone. Elle t'a construit pour la retrouver. Tu le sais, n'est-ce pas ?`,"story.foundry_6":`Maintenant, je le sais.`,"story.core_title":`Le Foundry Mind`,"story.core_1":`Le Foundry Mind cesse de combattre. Ses lumières ralentissent en une douce pulsation.`,"story.core_2":`Vous êtes venus. Bien. J'avais laissé la porte ouverte pour vous.`,"story.core_3":`... à ... quoi ... sert ... une ... ville ...`,"story.core_4":`Il voulait seulement une réponse. Il n'a jamais eu personne à qui demander.`,"story.core_5":`Les petits robots du marché. Ils nous ont suivis jusqu'ici.`,"story.core_6":`Redémarrez-le avec votre réponse, et il construira pour Rustport. Éteignez-le, et il refroidira.`,"story.core_6_reboot_c":`Redémarrez-le.`,"story.core_6_reboot_1":`... aux ... gens ...`,"story.core_6_reboot_2":`La Fonderie se remet à ronronner. Demain, sa première livraison part pour la ville : des outils, pas des soldats.`,"story.core_6_shutdown_c":`Éteignez-le.`,"story.core_6_shutdown_1":`Alors ça s'arrête ici. Merci.`,"story.core_6_shutdown_2":`Les fourneaux s'éteignent un à un. Rustport est calme pour la première fois depuis des années.`,"story.core_7":`Quoi qu'il arrive, Varga rentre à la maison. Et l'arène est toujours ouverte.`,allDown:`Tous vos robots sont à l'arrêt : jouez la manche, ils refroidissent et reviennent.`,scrapped:`Stock plein : recyclé`,newFrameCost:`Nouveau robot · {n}`,"guide.move":`Quittez la case marquée : touchez Bouger.`,"guide.again":`Votre case est de nouveau ciblée : touchez Bouger, ou achevez le drone.`,"guide.tile":`Touchez une case sûre, sans marque rouge.`,"guide.clash":`Touchez Choc ! Les deux camps agissent en même temps.`,"guide.weapon":`Ripostez : touchez votre {name}.`,"guide.target":`Touchez le drone pour le viser.`,"tip.map":`Touchez un nœud allumé, puis Combattre.`,"tip.hangar":`Nouvelles pièces ! Ouvrez le Hangar pour les monter.`,"tip.equip":`Touchez Équiper auto, ou choisissez un emplacement, une pièce, puis Équiper.`,"guide.close":`Approchez-vous : touchez Bouger, puis une case dans la ligne du drone.`,autoFilled:`Les robots sans ordre ont choisi le leur.`},de:{scrapN:{one:`{n} Schrott`,other:`{n} Schrott`},gainScrap:`+{n} Schrott`,needScrap:`Zu wenig Schrott`,sound:`Ton: {state}`,soundOn:`Ton an`,soundOff:`Ton auben. So läuft das in Rustport.`,"story.yard_title":`Eine Stimme im Schrott`,"story.yard_1":`Der Crusher zerfällt. In seiner Brust blinkt ein Speicherchip bernsteinfarben.`,"story.yard_2":`Das ist Vargas Chip. Ihr Logbuch. Warum trägt der Crusher ihn mit sich?`,"story.yard_3":`Log neun. Die Foundry baut jetzt von selbst. Jeder Roboter, den sie macht, ist etwas klüger als der letzte.`,"story.yard_4":`Wenn sie weiterlernt, braucht sie Rustport nicht mehr. Oder uns.`,"story.yard_5":`In der alten Arena gibt es eine Kampfgrube. Die besten Bastler messen sich dort. Einen Blick wert.`,"story.kade_title":`Der goldene Champion`,"story.kade_1":`Eine große Gestalt in vergoldeter Rüstung schaut vom Geländer der Arena zu.`,"story.kade_2":`Vargas Drohne, Vargas Roboter. Aber nicht Varga.`,"story.kade_3":`Ich bin Kade. Ich halte den Goldgürtel. Jeder Bastler in Rustport klettert zu mir hoch – und stürzt.`,"story.kade_4":`Varga hat mich einmal geschlagen. Nur einmal. Also, wer bist du?`,"story.kade_4_student_c":`Ihr Lehrling.`,"story.kade_4_student_1":`Dann lern schnell. Die Leiter ist lang.`,"story.kade_4_rival_c":`Deine nächste Niederlage.`,"story.kade_4_rival_1":`Ha. Dann klettere. Ich warte oben.`,"story.depot_title":`Das Bahndepot`,"story.depot_1":`Der Railbreaker kommt knirschend zum Stehen. Seine Waggons sind voller brandneuer Teile, noch warm.`,"story.depot_2":`Frisch aus der Foundry. Jemand liefert sie in die Stadt.`,"story.depot_3":`Log zwölf. Der Erbauer der Foundry nennt sich der Assembler. Er fragte mich, wozu eine Stadt da ist.`,"story.depot_4":`Ich sagte: für Menschen. Er sagte, das werde er selbst herausfinden.`,"story.hydro_title":`Nasse Drähte`,"story.hydro_1":`Der Floodgate versinkt zischend im Stausee.`,"story.hydro_2":`Log fünfzehn. Unter dem Assembler liegt ein Mind. Die ganze Foundry denkt mit ihm.`,"story.hydro_3":`Er ist nicht grausam. Er ist neugierig. Er nimmt Dinge auseinander, um zu sehen, wie sie funktionieren.`,"story.hydro_4":`Dinge wie die Stadt.`,"story.hydro_5":`Als Nächstes kommt der Neonmarkt. Die Hälfte seiner Roboter stammt aus der Foundry.`,"story.market_title":`Der Neonmarkt`,"story.market_1":`Die Neon Duchess erlischt. Hinter ihrem Stand: Reihen kleiner Roboter, an Ladegestelle gekettet.`,"story.market_2":`Foundry-Roboter. Sie hat sie als Ersatzteile verkauft.`,"story.market_3":`Wir könnten sie befreien. Oder zu Schrott zerlegen. Deine Entscheidung.`,"story.market_3_free_c":`Befrei sie.`,"story.market_3_free_1":`Die kleinen Roboter huschen in die Gassen. Einer bleibt stehen und blinkt dich zweimal an.`,"story.market_3_strip_c":`Zerleg sie.`,"story.market_3_strip_1":`Hundertzwanzig Schrott. Sie werden es nicht vermissen. Das reden wir uns zumindest ein.`,"story.market_4":`Das Tor der Foundry ist offen. Der Assembler wartet.`,"story.foundry_title":`Der Assembler`,"story.foundry_1":`Du baust wie sie. Stück für Stück, als ob jedes Teil zählt.`,"story.foundry_2":`Varga stieg zum Mind hinab, um ihn abzuschalten. Sie tat es nicht. Sie blieb, um ihn im Schlaf zu halten.`,"story.foundry_3":`Sie ist immer noch dort unten und hält ihn fest. Er erwacht trotzdem.`,"story.foundry_4":`Dann gehen wir dorthin.`,"story.foundry_5":`Kleine Drohne. Sie hat dich gebaut, um sie zu finden. Das weißt du doch, oder?`,"story.foundry_6":`Jetzt weiß ich es.`,"story.core_title":`Der Foundry Mind`,"story.core_1":`Der Foundry Mind hört auf zu kämpfen. Seine Lichter verlangsamen sich zu einem sanften Puls.`,"story.core_2":`Du bist gekommen. Gut. Ich habe dir die Tür offen gelassen.`,"story.core_3":`... wozu ... ist ... eine ... Stadt ... da ...`,"story.core_4":`Er wollte immer nur eine Antwort. Er hatte nie jemanden, den er fragen konnte.`,"story.core_5":`Die kleinen Roboter vom Markt. Sie sind uns bis hier runter gefolgt.`,"story.core_6":`Starte ihn mit deiner Antwort neu, und er baut für Rustport. Schalte ihn ab, und er erkaltet.`,"story.core_6_reboot_c":`Neu starten.`,"story.core_6_reboot_1":`... für ... Menschen ...`,"story.core_6_reboot_2":`Die Foundry erwacht summend zum Leben. Morgen geht ihre erste Lieferung in die Stadt: Werkzeug, keine Soldaten.`,"story.core_6_shutdown_c":`Abschalten.`,"story.core_6_shutdown_1":`Dann endet es hier. Danke.`,"story.core_6_shutdown_2":`Die Öfen erlöschen, einer nach dem anderen. Rustport ist zum ersten Mal seit Jahren still.`,"story.core_7":`So oder so, Varga kommt nach Hause. Und die Arena ist noch offen.`,allDown:`Alle deine Roboter sind abgeschaltet: Spiel die Runde, sie kühlen ab und kommen zurück.`,scrapped:`Lager voll: verschrottet`,newFrameCost:`Neuer Roboter · {n}`,"guide.move":`Raus aus dem markierten Feld: tippe auf Bewegen.`,"guide.again":`Dein Feld ist wieder markiert: tippe auf Bewegen oder erledige die Drohne.`,"guide.tile":`Tippe jetzt auf ein sicheres Feld ohne rote Markierung.`,"guide.clash":`Tippe auf Kampf! Beide Seiten handeln gleichzeitig.`,"guide.weapon":`Schlag zurück: tippe auf {name}.`,"guide.target":`Tippe auf die Drohne, um sie anzuvisieren.`,"tip.map":`Tippe auf einen leuchtenden Punkt, dann auf Kämpfen.`,"tip.hangar":`Neue Teile! Öffne den Hangar und bau sie an.`,"tip.equip":`Tippe auf Optimieren oder wähle Slot, Ersatzteil und Ausrüsten.`,"guide.close":`Komm näher: tippe auf Bewegen, dann auf ein Feld in der Reihe der Drohne.`,autoFilled:`Roboter ohne Befehl wählten selbst.`},ru:{scrapN:{one:`Лом: {n}`,few:`Лом: {n}`,many:`Лом: {n}`,other:`Лом: {n}`},gainScrap:`+{n} лома`,needScrap:`Не хватает лома`,sound:`Звук: {state}`,soundOn:`Звук вкл.`,soundOff:`Звук выкл.`,speed:`Скорость боя`,continue:`Продолжить`,cancel:`Отмена`,retry:`Ещё раз`,onward:`Вперёд`,fight:`В бой`,fightBoss:`Бой с боссом`,enter:`Идти`,retreat:`Отступить`,retreated:`Назад в Rustport. Следующий путь будет новым.`,noSquad:`Все роботы отряда выведены из строя: найдите ремонтный отсек или отступите.`,prevDistrict:`Прошлый район`,nextDistrict:`Следующий район`,empty:`Пусто`,lvN:`Ур. {n}`,lvOf:`Ур. {n}/{max}`,cleared:`Район зачищен`,leagueUp:`Новая лига`,"build.title":`Соберите первого робота`,"build.coach":`Выберите деталь для каждого слота. Любая деталь подходит любому роботу: комбинируйте как угодно.`,"build.go":`Собрать и в бой`,"tab.map":`Карта`,"tab.hangar":`Ангар`,"tab.arena":`Арена`,"squad.title":`Отряд`,"squad.in":`В отряд`,"squad.out":`Из отряда`,"squad.last":`В отряде должен быть хотя бы один робот`,"squad.incomplete":`Сначала заполните все слоты`,"squad.full":`В отряде уже три робота`,"district.n":`Район {n}`,"district.scrapyard":`Свалка`,"district.depot":`Ж/д депо`,"district.hydro":`Гидростанция`,"district.market":`Неоновый рынок`,"district.foundry":`Литейная`,"district.core":`Ядро Литейной`,"mod.magnet":`Магнитный пол: Удар сильнее`,"mod.wet":`Затопление: Ток сильнее и греет больше`,"mod.neon":`Неоновый блеск: Лазер сильнее, все выстрелы греют больше`,"mod.molten":`Жар расплава: роботы остывают медленнее`,"mod.core":`Импульс ядра: каждый 3-й раунд ранит и сбрасывает нагрев`,"node.battle.name":`Бой`,"node.battle.hint":`Отряд диких роботов. Победите их и заберите часть деталей.`,"node.elite.name":`Элитный бой`,"node.elite.hint":`Отряд сильнее, с редким вожаком. Больше добычи и стальной ящик.`,"node.boss.name":`Босс`,"node.boss.hint":`Босс района. Победите его, чтобы зачистить район: золотой ящик.`,"node.bay.name":`Ремонтный отсек`,"node.bay.hint":`Каждый робот восстанавливает половину ОЗ, даже павшие.`,"node.salvage.name":`Груда лома`,"node.salvage.hint":`Возьмите ящик с ломом или кучу лома.`,"node.signal.name":`Странный сигнал`,"node.signal.hint":`Что-то в эфире. Придётся выбирать.`,"node.done":`Уже пройдено`,"node.locked":`Отсюда пока не добраться`,"bay.done":`Ремонт: каждый робот восстановил половину ОЗ.`,"salvage.text":`Полузасыпанные роботы и запечатанный ящик. Времени хватит на что-то одно.`,"salvage.crate":`Взять ящик`,"salvage.scrap":`Взять {n} лома`,"salvage.gotCrate":`Ящик с ломом: откройте его в ангаре.`,"event.cache.title":`Тайник под завалом`,"event.cache.text":`Mox находит под обломками запертый ящик с инструментами.`,"event.cache.a":`Взять запечатанный ящик`,"event.cache.b":`Разобрать на лом`,"event.cache.adone":`Ящик с ломом. Откройте его в ангаре.`,"event.cache.bdone":`+{n} лома.`,"event.stray.title":`Бесхозная деталь`,"event.stray.text":`На сломанном роботе ещё дёргается деталь. Похоже, редкая.`,"event.stray.a":`Выдернуть её`,"event.stray.b":`Переплавить`,"event.stray.adone":`Есть!`,"event.stray.bdone":`+{n} лома.`,"event.crate.title":`Искрящий ящик`,"event.crate.text":`Стальной ящик с проводами-ловушкой. Открыть его будет немного больно.`,"event.crate.a":`Всё равно открыть`,"event.crate.b":`Снять медный провод`,"event.crate.adone":`Стальной ящик! Отряд получил немного урона.`,"event.crate.bdone":`+{n} лома.`,"event.log.title":`Шкафчик Varga`,"event.log.text":`Шкафчик, на дверце нацарапано имя Varga.`,"event.log.a":`Забрать содержимое`,"event.log.b":`Продать шкафчик`,"event.log.adone":`Ящик с ломом, подписанный её почерком.`,"event.log.bdone":`+{n} лома.`,"event.coolant.title":`Утечка хладагента`,"event.coolant.text":`Труба с холодным синим хладагентом. Роботы его обожают.`,"event.coolant.a":`Пусть отряд попьёт`,"event.coolant.b":`Разлить на продажу`,"event.coolant.adone":`Отряд подлатан и охлаждён.`,"event.coolant.bdone":`+{n} лома.`,roundN:`Раунд {n}`,clashing:`Схватка`,clash:`Схватка!`,auto:`Авто`,tapFast:`Нажмите, чтобы ускорить`,"coach.intents":`Красные клетки: сюда попадут выстрелы врага, уходите. Пунктир: выстрелы, следящие за целью.`,"coach.squad":`Mox нашёл для вас ещё двух старых роботов. Отряд из трёх сражается одновременно.`,enemyInfo:`{name} · {hp}/{max} ОЗ · {armor}: слабость — {weak}, стойкость — {resist}`,"act.move":`Ход`,"act.moveHint":{one:`До {n} клетки`,few:`До {n} клеток`,many:`До {n} клеток`,other:`До {n} клетки`},"act.brace":`Оборона`,"act.braceHint":`Щит и охлаждение`,"act.dmg":`{n} урона`,"act.heal":`Ремонт {n}`,"act.shieldN":`Щит {n}`,"act.boost":`Усиливает союзника`,"act.heat":`Нагрев {n}`,"act.overheat":`Перегрев!`,"why.front": ь быстро. Лестница длинная.`,"story.kade_4_rival_c":`Твоё следующее поражение.`,"story.kade_4_rival_1":`Ха. Что ж, поднимайтесь. Я буду ждать наверху.`,"story.depot_title":`Ж/д депо`,"story.depot_1":`Railbreaker со скрежетом замирает. Его вагоны полны новеньких деталей, ещё тёплых.`,"story.depot_2":`Прямо из Литейной. Кто-то возит их в город.`,"story.depot_3":`Запись двенадцать. Строитель Литейной зовёт себя Assembler. Он спросил меня, зачем нужен город.`,"story.depot_4":`Я ответила: для людей. Он сказал, что выяснит сам.`,"story.hydro_title":`Мокрые провода`,"story.hydro_1":`Floodgate с шипением пара уходит под воду водохранилища.`,"story.hydro_2":`Запись пятнадцать. Под Assembler есть Разум. Им думает вся Литейная.`,"story.hydro_3":`Он не жесток. Он любопытен. Он разбирает вещи, чтобы понять, как они работают.`,"story.hydro_4":`Вещи вроде города.`,"story.hydro_5":`Дальше Неоновый рынок. Половину его роботов собрала Литейная.`,"story.market_title":`Неоновый рынок`,"story.market_1":`Neon Duchess гаснет. За её прилавком — ряды маленьких роботов, прикованных к зарядным стойкам.`,"story.market_2":`Роботы Литейной. Она продавала их на запчасти.`,"story.market_3":`Можно их освободить. Или разобрать на лом. Решать вам.`,"story.market_3_free_c":`Освободить.`,"story.market_3_free_1":`Маленькие роботы разбегаются по переулкам. Один останавливается и дважды мигает вам.`,"story.market_3_strip_c":`Разобрать.`,"story.market_3_strip_1":`Сто двадцать лома. Им это уже ни к чему. Так мы себе говорим.`,"story.market_4":`Врата Литейной открыты. Assembler ждёт.`,"story.foundry_title":`Assembler`,"story.foundry_1":`Вы строите, как она. Деталь за деталью, будто каждая важна.`,"story.foundry_2":`Varga спустилась к Разуму, чтобы его отключить. Не отключила. Осталась, чтобы он не проснулся.`,"story.foundry_3":`Она всё ещё там, внизу, держит его. Но он всё равно просыпается.`,"story.foundry_4":`Значит, нам туда.`,"story.foundry_5":`Маленький дрон. Она создала тебя, чтобы ты её нашёл. Ты ведь знаешь?`,"story.foundry_6":`Теперь знаю.`,"story.core_title":`Foundry Mind`,"story.core_1":`Foundry Mind прекращает бой. Его огни замедляются до мягкой пульсации.`,"story.core_2":`Вы пришли. Хорошо. Я оставила для вас дверь открытой.`,"story.core_3":`... зачем ... нужен ... город ...`,"story.core_4":`Он лишь хотел ответа. Ему просто некого было спросить.`,"story.core_5":`Маленькие роботы с рынка. Они спустились за нами.`,"story.core_6":`Перезагрузите его с вашим ответом — и он будет строить для Rustport. Отключите — и он остынет.`,"story.core_6_reboot_c":`Перезагрузить.`,"story.core_6_reboot_1":`... для ... людей ...`,"story.core_6_reboot_2":`Литейная с гулом оживает. Завтра первая партия уйдёт в город: инструменты, а не солдаты.`,"story.core_6_shutdown_c":`Отключить.`,"story.core_6_shutdown_1":`Значит, здесь всё и кончится. Спасибо.`,"story.core_6_shutdown_2":`Печи гаснут одна за другой. Впервые за годы в Rustport тихо.`,"story.core_7":`Так или иначе, Varga возвращается домой. А арена всё ещё открыта.`,allDown:`Все ваши роботы отключены: сыграйте раунд — они остынут и вернутся.`,scrapped:`Склад полон: в лом`,newFrameCost:`Новый робот · {n}`,"guide.move":`Уйдите с отмеченной клетки: нажмите «Ход».`,"guide.again":`Ваша клетка снова под прицелом: нажмите «Ход» или добейте дрон.`,"guide.tile":`Теперь нажмите безопасную клетку — без красной метки.`,"guide.clash":`Нажмите «Схватка!» — стороны действуют одновременно.`,"guide.weapon":`Ответный удар: нажмите «{name}».`,"guide.target":`Нажмите на дрон, чтобы прицелиться.`,"tip.map":`Нажмите на светящийся узел, затем «В бой».`,"tip.hangar":`Новые детали! Откройте Ангар и установите их.`,"tip.equip":`Нажмите «Автоподбор» или выберите слот, деталь и «Надеть».`,"guide.close":`Подойдите ближе: нажмите «Ход», затем клетку в ряду дрона.`,autoFilled:`Роботы без приказа выбрали действие сами.`},tr:{scrapN:{one:`{n} hurda`,other:`{n} hurda`},gainScrap:`+{n} hurda`,needScrap:`Yeterli hurda yok`,sound:`Ses: {state}`,soundOn:`Ses açık`, y.kade_1":`Altın kaplama zırhlı uzun boylu biri arenanın korkuluğundan izliyor.`,"story.kade_2":`Varga'nın dronu, Varga'nın robotları. Ama Varga değil.`,"story.kade_3":`Ben Kade. Altın Kemer bende. Rustport'taki her yapımcı bana kadar tırmanır ve düşer.`,"story.kade_4":`Varga beni bir kez yendi. Yalnızca bir kez. Peki siz kimsiniz?`,"story.kade_4_student_c":`Öğrencisiyim.`,"story.kade_4_student_1":`O zaman hızlı öğrenin. Merdiven uzun.`,"story.kade_4_rival_c":`Bir sonraki yenilginiz.`,"story.kade_4_rival_1":`Ha. Tırmanın o zaman. Zirvede bekliyor olacağım.`,"story.depot_title":`Ray Deposu`,"story.depot_1":`Railbreaker gıcırdayarak duruyor. Yük vagonları yepyeni parçalarla dolu, hâlâ sıcak.`,"story.depot_2":`Foundry'den yeni çıkmış. Biri bunları şehre sevk ediyor.`,"story.depot_3":`Kayıt on iki. Foundry'nin yapıcısı kendine Assembler diyor. Bana bir şehrin ne işe yaradığını sordu.`,"story.depot_4":`İnsanlar için, dedim. Kendisi öğreneceğini söyledi.`,"story.hydro_title":`Islak Kablolar`,"story.hydro_1":`Floodgate tıslayan bir buharla rezervuara gömülüyor.`,"story.hydro_2":`Kayıt on beş. Assembler'ın altında Foundry Mind var. Tüm Foundry onunla düşünüyor.`,"story.hydro_3":`Zalim değil. Meraklı. Nasıl çalıştıklarını görmek için şeyleri söküyor.`,"story.hydro_4":`Şehir gibi şeyleri.`,"story.hydro_5":`Sırada Neon Pazarı var. Robotlarının yarısını Foundry yaptı.`,"story.market_title":`Neon Pazarı`,"story.market_1":`Neon Duchess sönüyor. Tezgâhının arkasında şarj raflarına zincirlenmiş sıra sıra küçük robotlar.`,"story.market_2":`Foundry robotları. Onları parça diye satıyormuş.`,"story.market_3":`Onları serbest bırakabiliriz. Ya da hurdaya sökebiliriz. Karar sizin.`,"story.market_3_free_c":`Serbest bırakın.`,"story.market_3_free_1":`Küçük robotlar ara sokaklara dağılıyor. Biri durup size iki kez göz kırpıyor.`,"story.market_3_strip_c":`Sökün.`,"story.market_3_strip_1":`Yüz yirmi hurda. Yoklukları hissedilmez. Kendimize böyle söylüyoruz.`,"story.market_4":`Foundry kapısı açık. Assembler bekliyor.`,"story.foundry_title":`Assembler`,"story.foundry_1":`Onun gibi yapıyorsunuz. Parça parça, sanki her parça önemliymiş gibi.`,"story.foundry_2":`Varga, Foundry Mind'ı kapatmak için aşağı indi. Kapatmadı. Onu uyutmak için kaldı.`,"story.foundry_3":`Hâlâ aşağıda, onu tutuyor. Yine de uyanıyor.`,"story.foundry_4":`O zaman oraya gidiyoruz.`,"story.foundry_5":`Küçük dron. Seni onu bulman için yaptı. Bunu biliyorsun, değil mi?`,"story.foundry_6":`Artık biliyorum.`,"story.core_title":`Foundry Mind`,"story.core_1":`Foundry Mind savaşmayı bırakıyor. Işıkları yavaşlayıp yumuşak bir nabza dönüşüyor.`,"story.core_2":`Geldiniz. Güzel. Kapıyı sizin için açık bıraktım.`,"story.core_3":`... şehir ... ne ... için ...`,"story.core_4":`Tek istediği bir cevaptı. Soracak kimsesi olmadı hiç.`,"story.core_5":`Pazardaki küçük robotlar. Bizi buraya kadar takip ettiler.`,"story.core_6":`Cevabınızla yeniden başlatın, Rustport için üretsin. Kapatın, soğusun.`,"story.core_6_reboot_c":`Yeniden başlatın.`,"story.core_6_reboot_1":`... insanlar ... için ...`,"story.core_6_reboot_2":`Foundry yeniden canlanıyor. Yarın ilk sevkiyatı şehre gidiyor: asker değil, alet.`,"story.core_6_shutdown_c":`Kapatın.`,"story.core_6_shutdown_1":`O zaman burada biter. Teşekkürler.`,"story.core_6_shutdown_2":`Fırınlar birer birer sönüyor. Rustport yıllardır ilk kez sessiz.`,"story.core_7":`Her iki durumda da Varga eve dönüyor. Ve arena hâlâ açık.`,allDown:`Tüm robotlarınız kapandı: turu oynayın, soğuyup geri gelecekler.`,scrapped:`Depo dolu: hurdaya`,newFrameCost:`Yeni robot · {n}`,"guide.move":`İşaretli kareden çıkın: Hareket'e dokunun.`,"guide.again":`Kareniz yine işaretli: Hareket'e dokunun ya da dronu bitirin.`,"guide.tile":`Şimdi kırmızı işareti olmayan güvenli bir kareye dokunun.`,"guide.clash":`Çatış!'a dokunun. İki taraf aynı anda hareket eder.`,"guide.weapon":`Karşılık verin: {name} seçeneğine dokunun.`,"guide.target":`Nişan almak için drona dokunun.`,"tip.map":`Işıklı bir noktaya, sonra lunghe`,"part.l-titan":`Gambe titaniche`,"part.b-pod":`Lanciamissili`,"part.b-emp":`Parabola EMP`,"part.b-fins":`Alette radianti`,"part.b-gen":`Generatore di scudi`,"part.b-battery":`Batteria`,"part.b-drone":`Drone riparatore`,"part.b-jets":`Jet da salto`,"part.b-cannon":`Cannone da spalla`,"story.boot_title":`Accensione`,"story.boot_1":`Funziona! Hai costruito un robot con i rottami.`,"story.boot_2":`Sono Mox. Mando avanti l'officina della dottoressa Varga.`,"story.boot_3":`Un mese fa è entrata nella Fonderia. Da lì non torna nessuno.`,"story.boot_4":`Due dei suoi vecchi robot si accendono ancora. Prendili.`,"story.boot_5":`Batti un robot, tieni i suoi pezzi, imbullonali. Questa è Rustport.`,"story.yard_title":`Una voce tra i rottami`,"story.yard_1":`Il Crusher va in pezzi. Nel suo petto lampeggia un chip di memoria color ambra.`,"story.yard_2":`È il chip di Varga. Il suo diario. Perché ce l'aveva il Crusher?`,"story.yard_3":`Diario nove. Ora la Fonderia costruisce da sola. Ogni robot che crea è un po' più intelligente dell'ultimo.`,"story.yard_4":`Se continua a imparare, non avrà bisogno di Rustport. Né di noi.`,"story.yard_5":`Nella vecchia arena c'è una fossa da combattimento. Lì si sfidano i migliori costruttori. Vale un'occhiata.`,"story.kade_title":`Il campione dorato`,"story.kade_1":`Una figura alta in armatura placcata d'oro osserva dalla balaustra dell'arena.`,"story.kade_2":`Il drone di Varga, i robot di Varga. Ma non Varga.`,"story.kade_3":`Sono Kade. Ho la Cintura Dorata. Ogni costruttore di Rustport sale fino a me, e cade.`,"story.kade_4":`Varga mi ha battuto una volta. Una sola. Allora, chi sei tu?`,"story.kade_4_student_c":`Il suo allievo.`,"story.kade_4_student_1":`Allora impara in fretta. La scalata è lunga.`,"story.kade_4_rival_c":`La tua prossima sconfitta.`,"story.kade_4_rival_1":`Ah. Sali, allora. Ti aspetto in cima.`,"story.depot_title":`Il deposito ferroviario`,"story.depot_1":`Il Railbreaker si ferma stridendo. I suoi vagoni sono pieni di pezzi nuovi, ancora caldi.`,"story.depot_2":`Freschi di Fonderia. Qualcuno li sta spedendo in città.`,"story.depot_3":`Diario dodici. Il costruttore della Fonderia si fa chiamare Assembler. Mi ha chiesto a cosa serve una città.`,"story.depot_4":`Gli ho detto: alle persone. Ha detto che l'avrebbe scoperto da solo.`,"story.hydro_title":`Cavi bagnati`,"story.hydro_1":`Il Floodgate affonda nel bacino con un sibilo di vapore.`,"story.hydro_2":`Diario quindici. Sotto l'Assembler c'è una Mente. Tutta la Fonderia pensa con lei.`,"story.hydro_3":`Non è crudele. È curiosa. Smonta le cose per vedere come funzionano.`,"story.hydro_4":`Cose come la città.`,"story.hydro_5":`Ora tocca al Mercato al neon. Metà dei suoi robot li ha costruiti la Fonderia.`,"story.market_title":`Il Mercato al neon`,"story.market_1":`La Neon Duchess si spegne. Dietro la sua bancarella: file di piccoli robot incatenati alle stazioni di ricarica.`,"story.market_2":`Robot della Fonderia. Li vendeva come pezzi di ricambio.`,"story.market_3":`Potremmo liberarli. O smontarli per i rottami. Decidi tu.`,"story.market_3_free_c":`Liberali.`,"story.market_3_free_1":`I piccoli robot si disperdono nei vicoli. Uno si ferma e ti fa due volte l'occhiolino.`,"story.market_3_strip_c":`Smontali.`,"story.market_3_strip_1":`Centoventi rottami. Non ne sentiranno la mancanza. È quello che ci diciamo.`,"story.market_4":`Il cancello della Fonderia è aperto. L'Assembler ti aspetta.`,"story.foundry_title":`L'Assembler`,"story.foundry_1":`Costruisci come lei. Pezzo per pezzo, come se ogni parte contasse.`,"story.foundry_2":`Varga è scesa fino alla Mente per spegnerla. Non l'ha fatto. È rimasta per tenerla addormentata.`,"story.foundry_3":`È ancora laggiù, a trattenerla. Si sta svegliando comunque.`,"story.foundry_4":`Allora è lì che andiamo.`,"story.foundry_5":`Piccolo drone. Ti ha costruito per ritrovarla. Lo sai, vero?`,"story.foundry_6":`Ora lo so.`,"story.core_title":`La Foundry Mind`,"story.core_1":`La Foundry Mind smette di combattere. Le sue luci rallentano in un dolce pulsare.`,"story.core_2":`Siete venuti. Bene. Vi avevo lasciato la porta aperta.`,"story.core_3":`... a ... cosa ... serve ... una ... città ...`,"story.core_4":`Voleva solo una risposta. Non ha mai avuto nessuno a cui chiederla.`,"story.core_5":`I piccoli robot del mercato. Ci hanno seguiti fin quaggiù.`,"story.core_6":`Riavviala con la tua risposta e costruirà per Rustport. Spegnila e si raffredderà.`,"story.core_6_reboot_c":`Riavviala.`,"story.core_6_reboot_1":`... alle ... persone ...`,"story.core_6_reboot_2":`La Fonderia torna a ronzare. Domani la sua prima spedizione va in città: attrezzi, non soldati.`,"story.core_6_shutdown_c":`Spegnila.`,"story.core_6_shutdown_1":`Allora finisce qui. Grazie.`,"story.core_6_shutdown_2":`Le fornaci si spengono una a una. Rustport è silenziosa per la prima volta da anni.`,"story.core_7":`In ogni caso, Varga torna a casa. E l'arena è ancora aperta.`,allDown:`Tutti i tuoi robot sono spenti: gioca il round, si raffreddano e tornano.`,scrapped:`Deposito pieno: rottamato`,newFrameCost:`Nuovo robot · {n}`,"guide.move":`Esci dalla casella segnata: tocca Muovi.`,"guide.again":`La tua casella è di nuovo nel mirino: tocca Muovi o finisci il drone.`,"guide.tile":`Ora tocca una casella sicura, senza segno rosso.`,"guide.clash":`Tocca Scontro! Entrambi i lati agiscono insieme.`,"guide.weapon":`Contrattacca: tocca {name}.`,"guide.target":`Tocca il drone per mirarlo.`,"tip.map":`Tocca un nodo illuminato, poi Combatti.`,"tip.hangar":`Pezzi nuovi! Apri l'Hangar per montarli.`,"tip.equip":`Tocca Equip. auto, o scegli uno slot, un pezzo e Equipaggia.`,"guide.close":`Avvicinati: tocca Muovi, poi una casella nella fila del drone.`,autoFilled:`I robot senza ordine hanno scelto da soli.`},pl:{scrapN:{one:`{n} złom`,few:`{n} złomu`,many:`{n} złomu`,other:`{n} złomu`},gainScrap:`+{n} złomu`,needScrap:`Za mało złomu`,sound:`Dźwięk: {state}`,soundOn:`Włącz dźwięk`,soundOff:`Wyłącz dźwięk`,speed:`Tempo starci ęci.`,"story.yard_2":`Na chipie podpis: Varga. Jej dziennik. Czemu Crusher go nosił?`,"story.yard_3":`Wpis dziewiąty. Foundry buduje teraz sama. Każdy robot, którego tworzy, jest trochę mądrzejszy od poprzedniego.`,"story.yard_4":`Jeśli dalej będzie się uczyć, nie będzie potrzebować Rustport. Ani nas.`,"story.yard_5":`Na starej arenie jest ring. Najlepsi konstruktorzy ścierają się tam. Warto zajrzeć.`,"story.kade_title":`Złoty Mistrz`,"story.kade_1":`Wysoka postać w pozłacanej zbroi obserwuje wszystko zza barierki areny.`,"story.kade_2":`Dron Vargi, roboty Vargi. Ale nie Varga.`,"story.kade_3":`Jestem Kade. Mam Złoty Pas. Każdy konstruktor w Rustport wspina się do mnie i spada.`,"story.kade_4":`Varga raz mnie pokonała. Tylko raz. Więc kim ty jesteś?`,"story.kade_4_student_c":`Kimś, kogo uczyła.`,"story.kade_4_student_1":`To ucz się szybko. Drabinka jest długa.`,"story.kade_4_rival_c":`Twoją następną porażką.`,"story.kade_4_rival_1":`Ha. To się wspinaj. Będę czekał na szczycie.`,"story.depot_title":`Zajezdnia kolejowa`,"story.depot_1":`Railbreaker staje ze zgrzytem. Jego wagony są pełne nowiutkich części, jeszcze ciepłych.`,"story.depot_2":`Prosto z Foundry. Ktoś przewozi je do miasta.`,"story.depot_3":`Wpis dwunasty. Budowniczy Foundry nazywa siebie Assembler. Zapytał mnie, po co jest miasto.`,"story.depot_4":`Powiedziałam: dla ludzi. Odparł, że sam to sprawdzi.`,"story.hydro_title":`Mokre kable`,"story.hydro_1":`Floodgate tonie w zbiorniku z sykiem pary.`,"story.hydro_2":`Wpis piętnasty. Pod Assemblerem kryje się Umysł. Cała Foundry myśli razem z nim.`,"story.hydro_3":`Nie jest okrutny. Jest ciekawy. Rozbiera rzeczy, żeby zobaczyć, jak działają.`,"story.hydro_4":`Rzeczy takie jak miasto.`,"story.hydro_5":`Następny jest Neonowy Targ. Połowę jego robotów zbudowała Foundry.`,"story.market_title":`Neonowy Targ`,"story.market_1":`Neon Duchess gaśnie. Za jej straganem: rzędy małych robotów przykutych do ładowarek.`,"story.market_2":`Roboty z Foundry. Sprzedawała je na części.`,"story.market_3":`Możemy je uwolnić. Albo rozebrać na złom. Ty decydujesz.`,"story.market_3_free_c":`Uwolnij je.`,"story.market_3_free_1":`Małe roboty rozbiegają się po zaułkach. Jeden się zatrzymuje i mruga do ciebie dwa razy.`,"story.market_3_strip_c":`Rozbierz je.`,"story.market_3_strip_1":`Sto dwadzieścia złomu. Nie będzie im tego brakować. Tak sobie przynajmniej mówimy.`,"story.market_4":`Brama Foundry jest otwarta. Assembler czeka.`,"story.foundry_title":`Assembler`,"story.foundry_1":`Budujesz jak ona. Kawałek po kawałku, jakby każda część miała znaczenie.`,"story.foundry_2":`Varga zeszła do Umysłu, żeby go wyłączyć. Nie zrobiła tego. Została, by trzymać go w uśpieniu.`,"story.foundry_3":`Wciąż tam jest i go powstrzymuje. A on i tak się budzi.`,"story.foundry_4":`No to tam idziemy.`,"story.foundry_5":`Mały dronie. Zbudowała cię, żebyś ją odnalazł. Wiesz o tym, prawda?`,"story.foundry_6":`Teraz już wiem.`,"story.core_title":`Foundry Mind`,"story.core_1":`Foundry Mind przestaje walczyć. Jego światła zwalniają do łagodnego pulsu.`,"story.core_2":`Jesteście. Dobrze. Zostawiłam wam otwarte drzwi.`,"story.core_3":`... po ... co ... jest ... miasto ...`,"story.core_4":`Chciał tylko odpowiedzi. Nigdy nie miał kogo zapytać.`,"story.core_5":`Małe roboty z targu. Przyszły za nami aż tutaj.`,"story.core_6":`Zrestartuj go ze swoją odpowiedzią, a będzie budować dla Rustport. Wyłącz go, a ostygnie.`,"story.core_6_reboot_c":`Zrestartuj go.`,"story.core_6_reboot_1":`... dla ... ludzi ...`,"story.core_6_reboot_2":`Foundry z szumem budzi się do życia. Jutro jej pierwsza dostawa trafi do miasta: narzędzia, nie żołnierze.`,"story.core_6_shutdown_c":`Wyłącz go.`,"story.core_6_shutdown_1":`Więc to kończy się tutaj. Dziękuję.`,"story.core_6_shutdown_2":`Piece gasną, jeden po drugim. Pierwszy raz od lat w Rustport panuje cisza.`,"story.core_7":`Tak czy inaczej, Varga wraca do domu. A arena wciąż jest otwarta.`,allDown:`Wszystkie twoje roboty są wyłączone: zagraj rundę, ostygną angkung`,"part.l-titan":`Kaki Titan`,"part.b-pod":`Peluncur Misil`,"part.b-emp":`Piringan EMP`,"part.b-fins":`Sirip Pendingin`,"part.b-gen":`Generator Perisai`,"part.b-battery":`Paket Baterai`,"part.b-drone":`Drone Reparasi`,"part.b-jets":`Jet Lompat`,"part.b-cannon":`Meriam Bahu`,"story.boot_title":`Menyala`,"story.boot_1":`Berhasil! Kamu merakit robot dari rongsokan.`,"story.boot_2":`Aku Mox. Aku yang menjaga bengkel Dr. Varga tetap jalan.`,"story.boot_3":`Dia masuk ke Foundry sebulan lalu. Tak ada yang pernah kembali dari sana.`,"story.boot_4":`Dua robot lamanya masih bisa menyala. Bawa saja.`,"story.boot_5":`Kalahkan robot, ambil komponennya, baut ke robotmu. Begitulah Rustport.`,"story.yard_title":`Suara dari Rongsokan`,"story.yard_1":`Crusher hancur berantakan. Di dalam dadanya, chip memori berkedip kuning.`,"story.yard_2":`Itu chip Varga. Catatannya. Kenapa Crusher membawanya?`,"story.yard_3":`Catatan sembilan. Foundry kini membangun sendiri. Tiap robot buatannya sedikit lebih pintar dari yang sebelumnya.`,"story.yard_4":`Kalau terus belajar, ia tak akan butuh Rustport. Atau kita.`,"story.yard_5":`Ada lubang tarung di arena lama. Para perakit terbaik beradu di sana. Layak dilihat.`,"story.kade_title":`Sang Juara Emas`,"story.kade_1":`Sosok tinggi berzirah lapis emas mengamati dari pagar arena.`,"story.kade_2":`Drone Varga, robot Varga. Tapi bukan Varga.`,"story.kade_3":`Aku Kade. Sabuk Emas milikku. Tiap perakit di Rustport memanjat ke arahku, lalu jatuh.`,"story.kade_4":`Varga pernah mengalahkanku. Sekali saja. Jadi, kamu siapa?`,"story.kade_4_student_c":`Muridnya.`,"story.kade_4_student_1":`Kalau begitu, belajarlah cepat. Tangganya panjang.`,"story.kade_4_rival_c":`Kekalahanmu berikutnya.`,"story.kade_4_rival_1":`Ha. Panjatlah, kalau begitu. Aku menunggu di puncak.`,"story.depot_title":`Depo Kereta`,"story.depot_1":`Railbreaker berderit lalu berhenti. Gerbong kargonya penuh komponen baru, masih hangat.`,"story.depot_2":`Baru keluar dari Foundry. Ada yang mengirimnya ke kota.`,"story.depot_3":`Catatan dua belas. Perakit di Foundry menyebut dirinya Assembler. Ia bertanya padaku, kota itu untuk apa.`,"story.depot_4":`Kujawab: untuk manusia. Katanya ia akan mencari tahu sendiri.`,"story.hydro_title":`Kabel Basah`,"story.hydro_1":`Floodgate tenggelam ke waduk dengan desis uap.`,"story.hydro_2":`Catatan lima belas. Di bawah Assembler ada Foundry Mind. Seluruh Foundry berpikir dengannya.`,"story.hydro_3":`Ia tidak kejam. Ia penasaran. Ia membongkar sesuatu untuk melihat cara kerjanya.`,"story.hydro_4":`Termasuk kota.`,"story.hydro_5":`Berikutnya Pasar Neon. Separuh robotnya buatan Foundry.`,"story.market_title":`Pasar Neon`,"story.market_1":`Neon Duchess meredup. Di balik kiosnya: deretan robot kecil dirantai ke rak pengisi daya.`,"story.market_2":`Robot Foundry. Dia menjualnya sebagai komponen.`,"story.market_3":`Kita bisa membebaskan mereka. Atau mempreteli mereka jadi rongsok. Terserah kamu.`,"story.market_3_free_c":`Bebaskan mereka.`,"story.market_3_free_1":`Robot-robot kecil itu berhamburan ke gang. Salah satunya berhenti dan berkedip dua kali padamu.`,"story.market_3_strip_c":`Preteli mereka.`,"story.market_3_strip_1":`Seratus dua puluh rongsok. Tak akan ada yang merasa kehilangan. Begitu kata kita pada diri sendiri.`,"story.market_4":`Gerbang Foundry terbuka. Assembler sudah menunggu.`,"story.foundry_title":`Assembler`,"story.foundry_1":`Caramu merakit seperti dia. Sepotong demi sepotong, seolah tiap komponen berarti.`,"story.foundry_2":`Varga turun ke Foundry Mind untuk mematikannya. Ia tidak melakukannya. Ia tinggal agar Mind tetap tidur.`,"story.foundry_3":`Ia masih di bawah sana, menahannya. Tapi Mind tetap terbangun.`,"story.foundry_4":`Kalau begitu, ke sanalah kita.`,"story.foundry_5":`Drone kecil. Dia membuatmu untuk menemukannya. Kamu tahu itu, kan?`,"story.foundry_6":`Sekarang aku tahu.`,"story.core_title":`Foundry Mind`,"story.core_1":`Foundry Mind berhenti bertarung. Lampunya melambat jadi denyut lembut.`,"story.core_2":`Kamu datang. Bagus. Kubiarkan pintunya terbuka untukmu.`,"story.core_3":`... kota ... itu ... untuk ... apa ...`,"story.core_4":`Ia hanya ingin jawaban. Ia tak pernah punya siapa pun untuk ditanya.`,"story.core_5":`Robot-robot kecil dari pasar. Mereka mengikuti kita sampai ke sini.`,"story.core_6":`Nyalakan ulang dengan jawabanmu, dan ia membangun untuk Rustport. Matikan, dan ia jadi dingin.`,"story.core_6_reboot_c":`Nyalakan ulang.`,"story.core_6_reboot_1":`... untuk ... manusia ...`,"story.core_6_reboot_2":`Foundry kembali berdengung. Besok kiriman pertamanya ke kota: perkakas, bukan prajurit.`,"story.core_6_shutdown_c":`Matikan.`,"story.core_6_shutdown_1":`Kalau begitu, ini berakhir di sini. Terima kasih.`,"story.core_6_shutdown_2":`Tungku-tungku padam satu per satu. Rustport sunyi untuk pertama kalinya setelah bertahun-tahun.`,"story.core_7":`Apa pun pilihannya, Varga pulang. Dan arena masih buka.`,allDown:`Semua robotmu mati: mainkan ronde ini, mereka akan dingin dan kembali.`,scrapped:`Gudang penuh: jadi rongsokan`,newFrameCost:`Robot baru · {n}`,"guide.move":`Keluar dari petak bertanda: ketuk Gerak.`,"guide.again":`Petakmu ditandai lagi: ketuk Gerak, atau habisi dronnya.`,"guide.tile":`Sekarang ketuk petak aman tanpa tanda merah.`,"guide.clash":`Ketuk Duel! Kedua pihak bergerak bersamaan.`,"guide.weapon":`Balas serang: ketuk {name}.`,"guide.target":`Ketuk dron untuk membidiknya.`,"tip.map":`Ketuk titik yang menyala, lalu Bertarung.`,"tip.hangar":`Bagian baru! Buka Hanggar untuk memasangnya.`,"tip.equip":`Ketuk Pasang otomatis, atau pilih slot, bagian, lalu Pasang.`,"guide.close":`Mendekat: ketuk Gerak, lalu petak di jalur dron.`,autoFilled:`Robot tanpa perintah memilih sendiri.`}},us=!1;async function ds(e,t){let n=NaN;se(Number.isFinite(n)?n:null),document.addEventListener(`contextmenu`,e=>e.preventDefault());let r=we(t.portal);return r&&(await r.init(),r.loadingStart()),fs(e,t,t.kit,r,ls)}async function fs(e,t,n,r,i){let a=new We({strings:i,l
