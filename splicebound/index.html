#gp-dialog { --gp-dlg-bg: #fff8ec; --gp-dlg-ink: #2b1d10; --gp-dlg-muted: #6b5a48; --gp-dlg-edge: #8a5a3a;
  --gp-dlg-btn: #ffffff; --gp-dlg-accent: #2b1d10; --gp-dlg-accent-ink: #fff8ec; --gp-dlg-speaker: #8a5a3a;
  position: fixed; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom)); margin: 0 auto; z-index: 20;
  width: min(720px, calc(100vw - 12px)); box-sizing: border-box; pointer-events: auto; touch-action: manipulation;
  display: flex; flex-direction: column; gap: 8px; padding: 18px 12px 10px; text-align: left; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  color: var(--gp-dlg-ink); background: var(--gp-dlg-bg); border: 3px solid var(--gp-dlg-edge); border-radius: 18px;
  box-shadow: 0 8px 28px #0008; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; }
#gp-dialog[hidden], #gp-dialog [hidden] { display: none !important; }
#gp-dialog .gp-row, #gp-dialog .gp-actions, #gp-dialog .gp-face, #gp-dialog .gp-live { font-size: 15px; }
#gp-dialog .gp-typed, #gp-dialog .gp-rest, #gp-dialog .gp-label { font: inherit; }
#gp-dialog .gp-plate { position: absolute; top: -14px; left: 14px; max-width: calc(100% - 28px); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; background: var(--gp-dlg-speaker); color: #fff; font-size: 14px; font-weight: 800;
  line-height: 1.2; padding: 4px 12px; border-radius: 9px; box-shadow: 0 2px 0 #0003; }
#gp-dialog .gp-badge { position: absolute; top: -12px; right: 14px; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; background: var(--gp-dlg-ink); color: var(--gp-dlg-bg); font-size: 12px; font-weight: 700;
  padding: 3px 9px; border-radius: 8px; }
#gp-dialog.gp-has-plate .gp-badge { max-width: 40%; }
#gp-dialog .gp-row { display: flex; gap: 10px; align-items: flex-start; min-height: 0; }
#gp-dialog .gp-face { font-size: 36px; line-height: 58px; text-align: center; flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin-top: -6px;
  border: 3px solid var(--gp-dlg-speaker); box-sizing: border-box; background: #fff; }
#gp-dialog .gp-face > canvas, #gp-dialog .gp-face > img, #gp-dialog .gp-face > svg { width: 100%; height: 100%; display: block; }
#gp-dialog .gp-text { flex: 1; min-width: 0; font: 500 17px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif;
  max-height: calc(1.35em * 5); overflow-y: auto; overflow-wrap: anywhere; }
#gp-dialog.gp-narrator .gp-text { font-style: italic; color: var(--gp-dlg-muted); }
#gp-dialog .gp-rest { visibility: hidden; }
#gp-dialog .gp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gp-dialog .gp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
#gp-dialog button.gp-btn { font: 700 15px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; border: 0; border-radius: 14px;
  cursor: pointer; touch-action: manipulation; min-width: 0; width: auto; height: auto; margin: 0; padding: 4px 14px;
  box-shadow: none; text-transform: none; letter-spacing: normal; text-align: center; opacity: 1; filter: none;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--gp-dlg-ink); background: var(--gp-dlg-btn); }
#gp-dialog button.gp-choice { flex: 1 1 100%; justify-content: flex-start; text-align: left; box-shadow: inset 0 0 0 2px var(--gp-dlg-edge); }
#gp-dialog button.gp-choice[aria-disabled=true] { color: var(--gp-dlg-muted); box-shadow: inset 0 0 0 2px #d8cfc2; cursor: default; }
#gp-dialog button.gp-next { order: 2; margin-left: auto; background: var(--gp-dlg-accent); color: var(--gp-dlg-accent-ink); padding: 4px 22px; }
#gp-dialog button.gp-skip { order: 1; background: transparent; color: var(--gp-dlg-muted); font-size: 14px; text-decoration: underline; padding: 4px 10px; }
#gp-dialog .gp-key { display: none; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #0000001a; flex: none; }
#gp-dialog.gp-waiting button.gp-choice { opacity: 0.75; }
@media (hover: hover) and (pointer: fine) { #gp-dialog .gp-key { display: inline-block; } }
/* Wide screens: choices side by side, Skip first in the row */
@media (min-aspect-ratio: 5/4) {
  #gp-dialog button.gp-choice { flex: 1 1 0; }
  #gp-dialog button.gp-skip { order: -1; }
}
/* A phone on its side: a compact sheet, ≤ 45% of the height (three lines of text and one row of buttons) */
@media (min-aspect-ratio: 5/4) and (max-height: 520px) {
  #gp-dialog { bottom: max(4px, env(safe-area-inset-bottom)); padding: 14px 10px 6px; gap: 5px; border-width: 2px; }
  #gp-dialog .gp-text { font-size: 16px; line-height: 1.3; max-height: calc(1.3em * 3); }
  #gp-dialog .gp-face { width: 52px; height: 52px; margin-top: -8px; font-size: 30px; line-height: 46px; }
  #gp-dialog .gp-plate { top: -13px; font-size: 13px; padding: 3px 10px; }
  #gp-dialog button.gp-btn { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  #gp-dialog:not([hidden]) { animation: gp-dlg-in 0.18s ease-out; }
}
@keyframes gp-dlg-in { from { transform: translateY(12px); opacity: 0; } }

 blows and parts. Worth a look.`]},kade:{title:`The Pit`,at:`run-end`,when:`cleared >= 2 or arena >= 1`,lines:[`A man in a coat of gold leaf leans on the railing above the arena.`,`kade/smug: Varga's tram. Varga's rat. Not Varga.`,`mox/angry: Moth. Mostly moth.`,`kade: I'm Kade. I hold the Bloom Crown. Every splicer in Vell climbs to me and falls.`,{who:`kade`,text:`Varga beat me once. Only once. What are you?`,choose:[{id:`student`,text:`Her student.`,then:[`kade/smug: Then learn fast. The ladder is long.`]},{id:`rival`,text:`Your next loss.`,then:[`kade: Ha. I like you already. Climb.`]}]}]},glasshouse:{title:`The Gardener`,at:`run-end`,when:`cleared >= 2`,lines:[`The Gardener folds into its roots. Under the bark there is a Syndicate tag.`,`mox/worried: "Property of the Graft Syndicate. Batch 7." They planted it here.`,`mox: The Syndicate hunts chimeras for parts. Their boss calls herself Mother Graft.`,`varga: Seren, if you hear this: stop feeding it. It isn't hungry. It's lonely.`,`mox/sad: Seren. That was her sister's name.`]},hive:{title:`The Queen's Gift`,at:`run-end`,when:`cleared >= 3`,lines:[`Queen Vesper falls. The whole arcade goes quiet, then hums a lower note.`,`mox: The hive is calmer. You didn't kill the queen. You quieted her.`,`varga: Seren and I found the First Chimera together, under the city. It was asleep.`,`varga/worried: Every mutation in Vell is one of its dreams. We woke it a little.`,`mox/worried: So when your chimeras mutate in the vat…`,`mox: …the Bloom is dreaming them. Lovely. Terrifying. Lovely.`]},ironworks:{title:`The Foundry Cages`,at:`run-end`,when:`cleared >= 4`,lines:[`Behind the Foreman's rig: cages, dozens, each with a chimera bolted to a harvest frame.`,`mox/angry: Batch after batch. For her Sovereign.`,{who:`mox`,text:`We could open the cages. Or take what they were growing. Your call.`,choose:[{id:`free`,text:`Open every cage.`,do:{set:`mercy`},then:[`The chimeras scatter into the dark. One stops, and bows its strange head.`]},{id:`take`,text:`Take the parts.`,do:{give:{mutagen:60}},then:[`mox/sad: Sixty mutagen. They won't need it. That's what we tell ourselves.`]}]},`mox: Mother Graft's Spire is next. She'll know we're coming.`]},spire:{title:`Mother Graft`,at:`run-end`,when:`cleared >= 5`,lines:[`graft/angry: You splice like her. Gentle. It never listened to gentle.`,`graft: I grafted myself to its heart to make it obey. Ilse went down to cut me loose.`,`graft/sad: She is still down there. Inside it. Holding it asleep.`,`mox/sad: Then that's where we go.`,`graft: Little moth. She made you to find her. You know that, don't you?`,`mox: I know it now.`]},heart:{title:`The Bloom Heart`,at:`run-end`,when:`cleared >= 6`,lines:[`The First Chimera stops fighting. Its many eyes close. One opens: grey, and kind.`,`varga: You came anyway. Good. I left the door open.`,`first: … listening … wanting … becoming …`,`varga: It only ever wanted someone to splice with. Someone to answer it.`,{who:`mox`,text:`The cages. They followed us down. All of them.`,if:`mercy`},{who:`varga`,text:`Bond with it and the Bloom calms, but never ends. Sever it and Vell dries out. Choose.`,choose:[{id:`bond`,text:`Bond with it.`,then:[{who:`first`,text:`… answered …`,ending:`bond`},`The Bloom glows softly over the city. It will dream, and you will splice its dreams.`]},{id:`sever`,text:`Sever the Bloom.`,then:[{who:`varga`,mood:`sad`,text:`Then it ends with us. Thank you.`,ending:`sever`},`The water drains from the market for the first time in twenty years.`]}]},`mox/happy: Either way, the tram's still ours. And the pit is still open.`]}}},Jr={mutagen:`<path d="M9 2h6v2h-1v5.2l5.3 9.2A2.4 2.4 0 0 1 17.2 22H6.8a2.4 2.4 0 0 1-2.1-3.6L10 9.2V4H9z" fill="currentColor" opacity=".25"/><path d="M9 2h6v2h-1v5.2l5.3 9.2A2.4 2.4 0 0 1 17.2 22H6.8a2.4 2.4 0 0 1-2.1-3.6L10 9.2V4H9zm3 9.5L7.4 19.5h9.2z" fill="currentColor"/><circle cx="11" cy="16.5" r="1.3" fill="#0b141a"/><circle cx="13.6" cy="18.2" r=".9" fill="#0b141a"/>`,bolt: :root { --bg:#0b141a; --ink:#ecf7f1; --muted:#9fbab3; --dim:#6d8a86; --panel:#0e1d25f2; --panel2:#132a35; --card:#10232c;
  --line:#26444f; --lime:#b6f24a; --teal:#2ee6c5; --pink:#ff7ad9; --gold:#ffd166; --red:#ff5d6c; --violet:#c77dff; }
#ui { position: fixed; inset: 0; pointer-events: none; color: var(--ink);
  font: 600 15px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif, ${oe}; -webkit-tap-highlight-color: transparent; }
#ui * { box-sizing: border-box; }
#ui .ic { flex: none; vertical-align: -0.18em; }
#ui .layer { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none;
  padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
#ui .layer > * { pointer-events: auto; }
#ui .center { align-items: center; justify-content: center; }
#ui .panel { background: linear-gradient(180deg, #13303bf2, #0c1a21f4); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: 0 18px 50px #000a, inset 0 1px 0 #ffffff14; padding: 16px; max-width: min(96vw, 860px); width: 100%; max-height: 100%;
  display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#ui .scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; scrollbar-width: thin; padding-bottom: 6px; }
#ui h1, #ui h2, #ui h3 { margin: 0; letter-spacing: .02em; }
#ui h2 { font-size: 24px; font-weight: 900; }
#ui h3 { font-size: 16px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#ui .logo { font-weight: 950; letter-spacing: .08em; font-size: clamp(26px, 6.2vw, 44px); line-height: 1; text-transform: uppercase;
  background: linear-gradient(100deg, var(--lime), var(--teal) 45%, var(--violet) 80%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #04201a); }
#ui .sub { color: var(--muted); font-size: 13px; font-weight: 600; }
#ui .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#ui .row.nowrap { flex-wrap: nowrap; }
#ui .grow { flex: 1 1 auto; min-width: 0; }
#ui .spread { justify-content: space-between; }
#ui button { font: 800 16px/1.15 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif, ${oe}; min-height: ${t}px; min-width: ${t}px;
  border: 0; border-radius: 14px; padding: 6px 16px; cursor: pointer; color: #08151b; touch-action: manipulation;
  background: linear-gradient(180deg, #d3ff6b, #8fdc2c); box-shadow: 0 3px 0 #4f8a12, inset 0 1px 0 #ffffffaa;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform .06s, filter .15s; }
#ui button:active { transform: translateY(2px); box-shadow: 0 1px 0 #4f8a12; }
#ui button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
#ui button.alt { color: var(--ink); background: linear-gradient(180deg, #1d3c49, #142c37); box-shadow: 0 3px 0 #0a171d, inset 0 1px 0 #ffffff1c; border: 1px solid #2f5462; }
#ui button.pink { background: linear-gradient(180deg, #ffb0ea, #ff62cf); box-shadow: 0 3px 0 #9b2a7c, inset 0 1px 0 #fff9; }
#ui button.gold { background: linear-gradient(180deg, #ffe39a, #ffbf3d); box-shadow: 0 3px 0 #9a6a0c, inset 0 1px 0 #fffa; }
#ui button.icon { padding: 0; width: ${t}px; }
#ui button[aria-disabled=true], #ui button:disabled { filter: grayscale(.85) brightness(.75); cursor: default; }
#ui button.big { font-size: 19px; min-height: ${Math.round(t*1.2)}px; padding: 6px 24px; }
#ui .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 800;
  background: #0a171d; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
#ui .chip.mut { color: var(--lime); }
#ui .chip.wrap { white-space: normal; border-radius: 12px; }
#ui .pens { overflow-x: auto; overscroll-behavior: contain; padding-bottom: 4px; scrollbar-width: thin; }
#ui .pens > button { flex: none; }
#ui .money { color: #d6ff7a; font-variant-numeric: tabular-nums; }
#ui .fam { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
#ui .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; gap: 10px; align-items: center; min-width: 0; }
#ui .card.sel { border-color: var(--lime); box-shadow: 0 0 0 2px #b6f24a55; }
#ui .card .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
#ui .card .t b { font-size: 15px; }
#ui .card .t small { color: var(--muted); font-size: 13px; font-weight: 600; }
#ui .card > button, #ui .card > div > button { flex: none; white-space: nowrap; }
#ui .card.stack { flex-wrap: wrap; }
#ui .card.stack > .t { flex: 1 1 160px; }
#ui .card.stack > .act { flex: 1 1 100%; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
#ui .card.stack > .act > button { max-width: 100%; white-space: normal; text-align: center; }
#ui .tag { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
#ui .bar { height: 7px; border-radius: 99px; background: #08131a; overflow: hidden; border: 1px solid #ffffff12; }
#ui .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--lime)); }
#ui .bar.hp > i { background: linear-gradient(90deg, #ff6b6b, #ffd166 45%, #7cf06b); }
#ui .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
#ui .stat { background: #0a171d; border-radius: 10px; padding: 5px 7px; display: flex; flex-direction: column; border: 1px solid #ffffff10; }
#ui .stat small { color: var(--dim); font-size: 12px; font-weight: 800; text-transform: uppercase; }
#ui .stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
#ui .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; }
#ui .toast { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); background: #0c1a21f2; border: 1px solid var(--lime);
  color: var(--ink); padding: 10px 16px; border-radius: 14px; font-weight: 800; pointer-events: none; z-index: 9; max-width: 90vw; text-align: center; }
#ui .bubble { background: #f4ffe0; color: #17260b; border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 14px; position: relative; max-width: 360px; }
#ui .bubble::after { content: ''; position: absolute; left: 18px; bottom: -8px; border: 8px solid transparent; border-top-color: #f4ffe0; border-bottom: 0; }
#ui .shake { animation: sb-shake .3s; }
@keyframes sb-shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
#ui .pop { animation: sb-pop .35s ease-out; }
@keyframes sb-pop { 0% { transform: scale(.85); opacity: .4; } 70% { transform: scale(1.04); } }
#ui .glow { animation: sb-glow 1.6s ease-in-out infinite; }
@keyframes sb-glow { 50% { box-shadow: 0 0 0 4px #b6f24a55, 0 3px 0 #4f8a12; } }
@media (prefers-reduced-motion: reduce) { #ui .glow, #ui .pop, #ui .shake { animation: none; } }
/* Portraits */
#ui .pt { flex: none; border-radius: 14px; background: radial-gradient(circle at 50% 60%, #1e4150, #0a161c 70%); border: 1px solid #ffffff14; display: grid; place-items: center; overflow: hidden; }
#ui .pt canvas { display: block; }
/* The hub */
#ui .hub { gap: 8px; }
#ui .topbar { display: flex; align-items: center; gap: 8px; }
#ui .map { position: relative; flex: 1 1 auto; min-height: 0; border-radius: 20px; border: 1px solid var(--line);
  background: radial-gradient(ellipse at 50% 40%, #16343fcc, #0a161ccc); overflow: hidden; }
#ui .map svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#ui .map .node { position: absolute; width: ${t+6}px; height: ${t+6}px; min-width: 0; min-height: 0; padding: 0; border-radius: 50%; transform: translate(-50%, -50%);
  color: #08151b; box-shadow: 0 3px 0 #0006; }
#ui .map .node.k-battle { background: radial-gradient(circle at 35% 30%, #ffd2a6, #ff8a3d); }
#ui .map .node.k-elite { background: radial-gradient(circle at 35% 30%, #ffc0c6, #ff4d6d); }
#ui .map .node.k-boss { background: radial-gradient(circle at 35% 30%, #ffe9a6, #ffb627); width: ${t+18}px; height: ${t+18}px; }
#ui .map .node.k-spring { background: radial-gradient(circle at 35% 30%, #c9fff0, #2ee6c5); }
#ui .map .node.k-cache { background: radial-gradient(circle at 35% 30%, #d9ecff, #6cc6ff); }
#ui .map .node.k-event { background: radial-gradient(circle at 35% 30%, #f1dcff, #c77dff); }
#ui .map .node.done { filter: grayscale(.9) brightness(.55); }
#ui .map .node.locked { filter: grayscale(.6) brightness(.55); opacity: .75; }
#ui .map .node.open { outline: 3px solid #ffffffcc; outline-offset: 3px; }
#ui .map .node.sel { outline: 4px solid var(--lime); outline-offset: 4px; }
#ui .map .node.here::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 2px dashed #ffffff88; }
#ui .map .head { position: absolute; left: 12px; top: 10px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
#ui .map .head > * { pointer-events: auto; }
#ui .squad { display: flex; gap: 6px; }
#ui .squad .mini { display: flex; flex-direction: column; gap: 3px; align-items: stretch; width: 76px; }
#ui .squad .mini .bar { height: 6px; }
#ui .squad .mini small { font-size: 12px; text-align: center; color: var(--muted); overflow-wrap: anywhere; line-height: 1.15; }
#ui .actions { display: flex; gap: 8px; align-items: stretch; }
#ui .actions > button { flex: 1 1 0; }
#ui .hubside { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
@media (min-aspect-ratio: 5/4) {
  #ui .hubbody { display: flex; gap: 10px; flex: 1 1 auto; min-height: 0; }
  #ui .hubside { width: min(36vw, 330px); flex: none; justify-content: flex-end; }
}
@media (max-aspect-ratio: 5/4) {
  #ui .hubbody { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0; }
}
/* Battle HUD */
#ui .bhud-top { display: flex; align-items: center; gap: 8px; }
#ui .bhud-bot { margin-top: auto; background: linear-gradient(180deg, #102631ee, #0a171ef6); border: 1px solid var(--line); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#ui .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
#ui .who b { font-size: 16px; white-space: nowrap; }
#ui .pips { display: flex; gap: 3px; }
#ui .pips i { width: 9px; height: 12px; border-radius: 3px; background: #24404b; }
#ui .pips i.on { background: linear-gradient(180deg, #fff7a8, #ffc93d); }
#ui .abil { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; flex: 1 1 auto; }
#ui .abil button { flex-direction: column; align-items: flex-start; gap: 1px; padding: 5px 10px; text-align: left; min-height: ${t+4}px; }
#ui .abil button small { font-size: 12px; font-weight: 700; opacity: .8; }
#ui .abil button.on { outline: 3px solid #fff; outline-offset: 1px; }
#ui .moves { display: flex; gap: 6px; align-items: center; }
#ui .tip { background: #f4ffe0; color: #17260b; border-radius: 12px; padding: 6px 12px; font-weight: 800; font-size: 14px; align-self: center; max-width: 94vw; text-align: center; }
#ui .ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#ui .ctrl .abil { flex: 1 1 100%; order: -1; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
#ui .ctrl .endt { margin-left: auto; }
#ui .who { flex-wrap: wrap; }
@media (min-aspect-ratio: 5/4) { #ui .ctrl { flex-wrap: nowrap; align-items: stretch; } #ui .ctrl .abil { flex: 1 1 auto; order: 0; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); } #ui .ctrl .endt { margin-left: 0; } }
@media (max-width: 420px) { #ui .who .pips { display: none; } }
@media (max-width: 480px) { #ui .logo { font-size: 24px; letter-spacing: .04em; } }
@media (max-height: 520px) {
  #ui .logo { font-size: 26px; }
  #ui .hub .hint, #ui .hub .nodeinfo { display: none; }
  #ui .squad .mini { width: 60px; }
}
@media (max-height: 470px) {
  #ui .panel { padding: 10px 12px; gap: 7px; border-radius: 16px; }
  #ui h2 { font-size: 20px; }
  #ui .bhud-bot { padding: 5px 6px; gap: 4px; }
  #ui .stats { grid-template-columns: repeat(8, minmax(0, 1fr)); }
}
