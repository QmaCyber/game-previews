          overflow-y: auto; overflow-x: hidden; padding: 3px; box-sizing: border-box; }
    #ui .screen.shop > .grid { flex: 0 1 auto; min-height: 0; }
    #ui .card { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 8px 10px 12px;
          box-shadow: 0 0 0 2px #3b24121f; text-align: left; min-width: 0; }
    #ui .card.just { animation: gnome-bought .35s ease-out; }
    #ui .card .icon { font-size: 28px; width: 36px; text-align: center; flex: none; }
    #ui .card .info { flex: 1; min-width: 0; }
    #ui .card .name { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #ui .card .tag { display: inline-block; margin-left: 4px; font-size: 12px; background: #e63946; color: #fff; border-radius: 6px;
          padding: 1px 5px; vertical-align: 2px; animation: gnome-pulse 1s ease-in-out infinite; }
    #ui .card .eff { font-size: 12px; opacity: 0.75; font-weight: 600; line-height: 1.2; }
    #ui .card .lvl { display: flex; gap: 2px; margin-top: 4px; }
    #ui .card .lvl i { flex: 1; height: 6px; border-radius: 3px; background: #3b24121f; }
    #ui .card .lvl i.on { background: #e63946; }
    #ui .card button { min-width: ${A*1.9}px; font-size: 16px; padding: 0 10px; flex: none; }
    #ui .card button.can { animation: gnome-pulse 1.4s ease-in-out infinite; }
    /* Wide screens (the CrazyGames player): four tall cards in two rows */
    @media (min-aspect-ratio: 3/2) and (min-height: 481px) {
      #ui .screen.shop { max-width: min(96vw, 940px); }
      #ui .screen.shop .grid { grid-template-columns: repeat(4, 1fr); }
      #ui .screen.shop .card { flex-direction: column; text-align: center; gap: 4px; padding: 10px 10px 14px; }
      #ui .screen.shop .card .info { width: 100%; }
      #ui .screen.shop .card button { width: 100%; }
    }
    /* A phone on its side: four compact cards in two rows */
    @media (max-height: 480px) and (min-width: 600px) {
      #ui .screen { gap: 6px; padding: 10px 16px; }
      #ui .screen.shop { max-width: 97vw; gap: 5px; padding: 8px 12px; }
      #ui .screen.shop h2 { font-size: 22px; }
      #ui .screen.shop .big { font-size: 16px; }
      #ui .screen.shop .grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      #ui .screen.shop .card { flex-direction: column; gap: 3px; padding: 6px 6px 11px; text-align: center; }
      #ui .screen.shop .card .info { width: 100%; }
      #ui .screen.shop .card .icon { display: none; }
      #ui .screen.shop .card .eff { display: none; }
      #ui .screen.shop .card .name { font-size: 13px; }
      #ui .screen.shop .card button { width: 100%; font-size: 15px; }
      #ui .sub { font-size: 13px; }
    }
